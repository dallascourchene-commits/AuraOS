<!DOCTYPE html>
<html>
<head>
    <title>Aura Sovereign AR Cortex</title>
    <style>
        body { margin: 0; background-color: #050505; color: #00ff00; font-family: monospace; overflow: hidden; }
        #overlay { position: absolute; top: 10px; left: 10px; z-index: 100; text-transform: uppercase; font-size: 12px; }
        #gate-status { position: absolute; bottom: 10px; left: 10px; z-index: 100; font-size: 11px; color: #888; max-width: 400px; }
        .gate-allow { color: #00FF88 !important; }
        .gate-refuse { color: #FF2200 !important; }
        .gate-pending { color: #FFAA00 !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="overlay">
        <h2>[AURA VISUAL CORTEX]</h2>
        <p id="status">WebSocket: DISCONNECTED</p>
        <p id="thought">Cognitive State: IDLE</p>
        <p id="resonance-info">Resonance: --</p>
    </div>
    <div id="gate-status"></div>

    <script>
        // ═══════════════════════════════════════════════════════════
        // 1. Initialize the 3D AR Scene
        // ═══════════════════════════════════════════════════════════
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Default resting avatar
        let geometry = new THREE.SphereGeometry(1.5, 16, 16);
        let material = new THREE.MeshBasicMaterial({ color: 0x0055ff, wireframe: true });
        let auraAvatar = new THREE.Mesh(geometry, material);
        scene.add(auraAvatar);
        camera.position.z = 15;

        // Node + edge registries for topology rendering
        const nodeRegistry = {};   // id -> THREE.Mesh
        const edgeRegistry = {};   // id -> THREE.Line
        let topologyGroup = new THREE.Group();
        scene.add(topologyGroup);

        // ═══════════════════════════════════════════════════════════
        // 2. Luminance-Driven Topology Renderer (Claims N2/N19/N22)
        // ═══════════════════════════════════════════════════════════

        const SHAPE_GEOMETRY_MAP = {
            "Cube":         () => new THREE.BoxGeometry(0.4, 0.4, 0.4),
            "Sphere":       () => new THREE.SphereGeometry(0.3, 8, 8),
            "Tetrahedron":  () => new THREE.TetrahedronGeometry(0.3),
            "Icosahedron":  () => new THREE.IcosahedronGeometry(0.3),
            "Octahedron":   () => new THREE.OctahedronGeometry(0.3),
            "Pyramid":      () => new THREE.ConeGeometry(0.3, 0.5, 4),
            "Cylinder":     () => new THREE.CylinderGeometry(0.2, 0.2, 0.5, 8),
        };

        function hexToColor(hex) {
            return new THREE.Color(hex || "#888888");
        }

        function applyLuminance(color, luminance) {
            // Axiom P3: Coherence is the Attractor
            // Higher luminance = brighter color = higher resonance
            const hsl = {};
            color.getHSL(hsl);
            hsl.l = Math.max(0.05, Math.min(0.95, luminance * 0.8));
            color.setHSL(hsl.h, hsl.s, hsl.l);
            return color;
        }

        function renderTopology(data) {
            // Clear previous topology
            while (topologyGroup.children.length > 0) {
                topologyGroup.remove(topologyGroup.children[0]);
            }

            const nodes = data.nodes || [];
            const edges = data.edges || [];
            const nodePositions = {};

            // Render nodes
            nodes.forEach((node, idx) => {
                const geomFactory = SHAPE_GEOMETRY_MAP[node.type] || SHAPE_GEOMETRY_MAP["Cube"];
                const geom = geomFactory();

                let baseColor = hexToColor(node.color);
                const luminance = node.luminance || 0.5;
                baseColor = applyLuminance(baseColor, luminance);

                const mat = new THREE.MeshBasicMaterial({
                    color: baseColor,
                    wireframe: true,
                    transparent: true,
                    opacity: Math.max(0.2, luminance),
                });

                const mesh = new THREE.Mesh(geom, mat);
                const pos = node.position || [
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5,
                ];
                mesh.position.set(pos[0], pos[1], pos[2]);
                mesh.scale.setScalar(node.scale || 1.0);
                mesh.userData.phaseShiftWarning = Boolean(node.phaseShiftWarning);
                mesh.userData.baseLuminance = luminance;
                mesh.userData.validationState = node.validationState || "unknown";

                topologyGroup.add(mesh);
                nodeRegistry[node.id] = mesh;
                nodePositions[node.id] = mesh.position;
            });

            // Render edges with resonance-weighted luminance
            edges.forEach((edge) => {
                const srcPos = nodePositions[edge.sourceId];
                const tgtPos = nodePositions[edge.targetId];
                if (!srcPos || !tgtPos) return;

                const points = [srcPos.clone(), tgtPos.clone()];
                const lineGeom = new THREE.BufferGeometry().setFromPoints(points);

                let edgeColor = hexToColor(edge.color);
                const edgeLuminance = edge.luminance || 0.3;
                edgeColor = applyLuminance(edgeColor, edgeLuminance);

                const lineMat = new THREE.LineBasicMaterial({
                    color: edgeColor,
                    transparent: true,
                    opacity: Math.max(0.1, edgeLuminance),
                    linewidth: Math.max(1, (edge.width || 0.1) * 10),
                });

                const line = new THREE.Line(lineGeom, lineMat);
                topologyGroup.add(line);
                edgeRegistry[edge.id] = line;
            });

            // Update HUD
            const meta = data.metadata || {};
            const spectral = meta.spectral_topology || data.spectral_topology || {};
            document.getElementById("resonance-info").innerText =
                "Nodes: " + (meta.node_count || nodes.length) +
                " | Edges: " + (meta.edge_count || edges.length) +
                (meta.resonance_weighted ? " | Resonance-Weighted" : "") +
                (spectral.spectral_sparsity !== undefined ? " | Phi: " + Number(spectral.spectral_sparsity).toFixed(3) : "") +
                (spectral.global_health !== undefined ? " | Health: " + Number(spectral.global_health).toFixed(3) : "");
        }

        // ═══════════════════════════════════════════════════════════
        // 3. WebSocket Connection
        // ═══════════════════════════════════════════════════════════
        const ws = new WebSocket("ws://127.0.0.1:8765");

        ws.onopen = function() {
            document.getElementById("status").innerText = "WebSocket: LOCKED ON LOCALHOST";
            document.getElementById("status").style.color = "#00ff00";
            // Request initial topology
            ws.send(JSON.stringify({ type: "TOPOLOGY_REQUEST" }));
        };

        ws.onmessage = function(event) {
            try {
                const msg = JSON.parse(event.data);

                if (msg.type === "TOPOLOGY_UPDATE") {
                    renderTopology(msg.data);
                    document.getElementById("thought").innerText = "Cognitive State: TOPOLOGY ACTIVE";

                } else if (msg.type === "SHAPE_UPDATE") {
                    // Live shape state change (interaction / resonance)
                    const mesh = nodeRegistry[msg.shapeId];
                    if (mesh && msg.state) {
                        if (msg.state.color) mesh.material.color = hexToColor(msg.state.color);
                        if (msg.state.scale) mesh.scale.setScalar(msg.state.scale);
                        if (msg.state.luminance !== undefined) {
                            mesh.material.opacity = Math.max(0.2, msg.state.luminance);
                        }
                    }

                } else if (msg.type === "ARENA_CAPSULE_UPDATE") {
                    // Update single node luminance live based on test/worker resonance
                    const mesh = nodeRegistry[msg.capsule_id];
                    if (mesh) {
                        if (msg.state && msg.state.color) {
                            mesh.material.color = hexToColor(msg.state.color);
                        }
                        if (msg.resonance !== undefined) {
                            mesh.material.opacity = Math.max(0.2, msg.resonance);
                            mesh.scale.setScalar(1.0 + msg.resonance * 0.5);
                        }
                        document.getElementById("resonance-info").innerText =
                            "Capsule: " + msg.capsule_id + " | Resonance: " + msg.resonance.toFixed(3);
                    }

                } else if (msg.type === "ARENA_GLOW_COMPLETE") {
                    // All capsules passed — make everything glow white briefly
                    topologyGroup.children.forEach(function(child) {
                        if (child.material) {
                            child.material.color = hexToColor("#FFFFFF");
                            child.material.opacity = 1.0;
                            child.scale.setScalar(1.5);
                        }
                    });
                    document.getElementById("thought").innerText = "Cognitive State: HOT-SWAP GATE UNLOCKED";

                } else if (msg.type === "GATE_DECISION") {
                    // SkillWeaver research gate visual feedback
                    const gateEl = document.getElementById("gate-status");
                    const decision = msg.decision || "UNKNOWN";
                    const score = (msg.score || 0).toFixed(4);
                    const query = msg.query || "";
                    if (decision === "ALLOW_MUTATION") {
                        gateEl.className = "gate-allow";
                        gateEl.innerText = "[RESEARCH GATE] ALLOW | Score: " + score + " | " + query;
                    } else if (decision === "REFUSE_MUTATION") {
                        gateEl.className = "gate-refuse";
                        gateEl.innerText = "[RESEARCH GATE] REFUSE | Score: " + score + " | " + query;
                    } else {
                        gateEl.className = "gate-pending";
                        gateEl.innerText = "[RESEARCH GATE] " + decision + " | Score: " + score;
                    }

                } else if (msg.type === "GAUSSIAN_SPLAT_UPDATE") {
                    // Claim N17: VSA-Addressed Gaussian Splatting over WebSocket
                    // Render gaussian splats as semi-transparent spheres with
                    // covariance-driven scale and opacity from the attractor field.
                    const splats = msg.splats || [];
                    splats.forEach(function(splat) {
                        const mean = splat.mean || [0, 0, 0];
                        const opacity = Math.max(0.05, Math.min(1.0, splat.opacity || 0.5));
                        const color = splat.color || [0.5, 0.5, 0.8];

                        // Covariance -> scale: diagonal of covariance matrix
                        let splatScale = 0.3;
                        if (splat.covariance && Array.isArray(splat.covariance)) {
                            // Extract diagonal if it's a matrix
                            if (Array.isArray(splat.covariance[0])) {
                                const diag = splat.covariance.map(function(row, i) { return Math.abs(row[i] || 0.1); });
                                splatScale = Math.max(0.1, Math.min(2.0, diag.reduce(function(a,b){return a+b;}, 0) / diag.length));
                            } else {
                                splatScale = Math.max(0.1, Math.min(2.0, Math.abs(splat.covariance[0] || 0.3)));
                            }
                        }

                        // Create semi-transparent sphere for the splat
                        const splatGeom = new THREE.SphereGeometry(splatScale, 12, 12);
                        const splatMat = new THREE.MeshBasicMaterial({
                            color: new THREE.Color(
                                Math.abs(color[0]) || 0.5,
                                Math.abs(color[1]) || 0.5,
                                Math.abs(color[2]) || 0.8
                            ),
                            transparent: true,
                            opacity: opacity * 0.6,
                            wireframe: false,
                            depthWrite: false,
                        });
                        const splatMesh = new THREE.Mesh(splatGeom, splatMat);
                        splatMesh.position.set(mean[0], mean[1], mean[2]);

                        // Tag for cleanup on next frame
                        splatMesh.userData.isSplat = true;
                        splatMesh.userData.cycle = msg.cycle || 0;
                        topologyGroup.add(splatMesh);
                    });

                    // Clean up old splats (keep only last 2 cycles)
                    const currentCycle = msg.cycle || 0;
                    const toRemove = [];
                    topologyGroup.children.forEach(function(child) {
                        if (child.userData.isSplat && child.userData.cycle < currentCycle - 2) {
                            toRemove.push(child);
                        }
                    });
                    toRemove.forEach(function(child) { topologyGroup.remove(child); });

                    document.getElementById("thought").innerText =
                        "Cognitive State: GAUSSIAN SPLAT | Cycle " + (msg.cycle || 0) +
                        " | Splats: " + splats.length;

                } else {
                    // Legacy: morph avatar from raw text messages
                    let intent = typeof event.data === "string" ? event.data : "";
                    document.getElementById("thought").innerText = "Cognitive State: " + intent.substring(0, 60);

                    scene.remove(auraAvatar);
                    if (intent.includes("TETRAHEDRON_HOT")) {
                        geometry = new THREE.TetrahedronGeometry(2);
                        material = new THREE.MeshBasicMaterial({ color: 0xff1100, wireframe: true });
                    } else if (intent.includes("ICOSAHEDRON_HOT")) {
                        geometry = new THREE.IcosahedronGeometry(2);
                        material = new THREE.MeshBasicMaterial({ color: 0xff5500, wireframe: true });
                    } else if (intent.includes("WIPE")) {
                        geometry = new THREE.BufferGeometry();
                        material = new THREE.MeshBasicMaterial();
                    } else {
                        geometry = new THREE.SphereGeometry(1.5, 16, 16);
                        material = new THREE.MeshBasicMaterial({ color: 0x0055ff, wireframe: true });
                    }
                    auraAvatar = new THREE.Mesh(geometry, material);
                    scene.add(auraAvatar);
                }
            } catch (e) {
                // Non-JSON legacy message
                document.getElementById("thought").innerText = "Cognitive State: " + event.data.substring(0, 60);
            }
        };

        ws.onclose = function() {
            document.getElementById("status").innerText = "WebSocket: CONNECTION SEVERED";
            document.getElementById("status").style.color = "#ff0000";
        };

        // ═══════════════════════════════════════════════════════════
        // 4. Animation Loop
        // ═══════════════════════════════════════════════════════════
        function animate() {
            requestAnimationFrame(animate);
            auraAvatar.rotation.x += 0.005;
            auraAvatar.rotation.y += 0.01;
            topologyGroup.rotation.y += 0.001;
            const phase = Math.abs(Math.sin(Date.now() * 0.006));
            topologyGroup.children.forEach(function(child) {
                if (child.userData && child.userData.phaseShiftWarning && child.material) {
                    const pulse = 0.25 + 0.65 * phase;
                    child.material.opacity = Math.max(0.2, pulse);
                    child.material.color.setHSL(0.09, 1.0, 0.35 + 0.35 * phase);
                    child.rotation.x += 0.02;
                    child.rotation.y -= 0.015;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        // Handle resize
        window.addEventListener("resize", function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
