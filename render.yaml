services:
  - type: web
    name: auraos-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/showcase/status
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FIREWORKS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
