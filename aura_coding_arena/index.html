<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura 3D Coding Arena</title>
  <link rel="stylesheet" href="arena.css">
</head>
<body>
  <main class="arena-shell">
    <section class="viewport">
      <canvas id="arena-canvas" aria-label="Aura topology graph"></canvas>
      <div class="hud">
        <strong>Aura Coding Arena</strong>
        <span id="graph-status">loading topology</span>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="side-panel">
      <header class="panel-header">
        <div>
          <h1>Micro-Arena</h1>
          <p id="truth-policy">Exact topology is source of truth.</p>
        </div>
        <button id="demo-toggle" type="button">Demo</button>
      </header>

      <section class="selected-block">
        <h2>Selected</h2>
        <pre id="selected-node">No node selected</pre>
      </section>

      <section class="controls">
        <div class="command-row">
          <input id="command-input" type="text" value="compile capsule" aria-label="Command">
          <button id="voice-button" type="button">Voice</button>
        </div>
        <div class="button-grid">
          <button id="expand-button" type="button">Expand</button>
          <button id="compile-button" type="button">Compile</button>
          <button id="route-button" type="button">Route</button>
          <button id="mark-button" type="button">Mark Edge</button>
        </div>
        <p id="voice-status">Voice fallback: type a command above.</p>
      </section>

      <section class="facts">
        <h2>Topology Facts</h2>
        <dl>
          <dt>Dependencies</dt><dd id="dependencies">-</dd>
          <dt>Callers</dt><dd id="callers">-</dd>
          <dt>Tests</dt><dd id="tests">-</dd>
          <dt>Faults</dt><dd id="faults">-</dd>
        </dl>
      </section>

      <section class="costs">
        <h2>Token Cost</h2>
        <div class="cost-grid">
          <span>Raw</span><strong id="raw-tokens">0</strong>
          <span>Micro</span><strong id="micro-tokens">0</strong>
          <span>Capsule</span><strong id="capsule-tokens">0</strong>
          <span>Saved</span><strong id="saved-pct">0%</strong>
        </div>
      </section>

      <section class="capsule-output">
        <h2>Capsule / Route</h2>
        <pre id="capsule-json">{}</pre>
      </section>
    </aside>
  </main>
  <script src="main.js"></script>
</body>
</html>
