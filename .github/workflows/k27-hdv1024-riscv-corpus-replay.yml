name: K27 HDV1024 RISC-V Corpus Replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r3-riscv-corpus-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact child head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact PR635 x PR623 convergence and green parent runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          convergence = 'd41f204afb158e4eb793711d686fc40f27a3b1f6'
          corpus = '3ec21d937d6a77424d2ad771daea97fcfea34b1d'
          riscv = '84524fbe907e5d78db1bb257e448f34ff7fbfe02'
          parents = subprocess.check_output(['git','rev-list','--parents','-n','1',convergence], text=True).strip().split()
          assert parents == [convergence, corpus, riscv], parents
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          for run_id, head in ((33369071661, corpus), (33366346680, riscv)):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run=json.load(response)
              assert run['conclusion']=='success', (run_id, run['conclusion'])
              assert run['head_sha']==head, (run_id, run['head_sha'], head)
          print('R3_EXACT_TWO_PARENT_GREEN=true')
          PY

      - name: Prove exact inherited PR623 source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 84524fbe907e5d78db1bb257e448f34ff7fbfe02:tools/k27_xhdv_riscv_candidate_falsifier.py)" = "f0d32198c6b86bbd8ff34db260f3bf351ce54e07"

      - name: Compile and re-run parent plus R3 suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/k27_hdv1024_consequence_corpus.py \
            tools/k27_xhdv_riscv_candidate_falsifier.py \
            tools/k27_hdv1024_riscv_corpus_replay.py \
            tests/test_k27_hdv1024_consequence_corpus.py \
            tests/test_k27_xhdv_riscv_candidate_falsifier.py \
            tests/test_k27_hdv1024_riscv_corpus_replay.py
          python3 -m unittest -v \
            tests.test_k27_hdv1024_consequence_corpus \
            tests.test_k27_xhdv_riscv_candidate_falsifier \
            tests.test_k27_hdv1024_riscv_corpus_replay

      - name: Emit exact R3 receipt and assert consequence-only ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/k27_hdv1024_riscv_corpus_replay.py > /tmp/r3.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/r3.json'))
          assert r['corpus_sha256']=='30014dc3d6e16454a41c91599460dddb2b72aa947fbf297f7b6985e543884b85'
          assert r['riscv_reference_distances']==[0,1024,1,1,1024,4,472,510]
          assert r['all_logical_consequences_match'] is True
          for key in (
              'byte_serialization_bound','byte_endianness_bound','architectural_register_mapping_bound',
              'compiler_abi_bound','riscv_instruction_execution_proven','spike_or_qemu_execution_proven',
              'hidden_h_register_abi_proven','os_context_state_proven','rtl_implementation_proven',
              'synthesis_or_timing_proven','hardware_performance_proven','cross_isa_performance_equivalence_proven',
              'semantic_k27_authority','native_private_transformer_kv_accessed','gate10_promoted','deployment_authorized'):
              assert r[key] is False, key
          print('R3_LOGICAL_CONSEQUENCE_ONLY=true')
          PY

      - name: Consequence ceiling
        run: |
          cat <<'EOF'
          PR635_CANONICAL_CORPUS_OWNER_RETAINED=true
          PR623_RISCV_REFERENCE_OWNER_RETAINED=true
          ALL_8_LOGICAL_HAMMING_CONSEQUENCES_MATCH=true
          BYTE_SERIALIZATION_BOUND=false
          BYTE_ENDIANNESS_BOUND=false
          ARCHITECTURAL_REGISTER_MAPPING_BOUND=false
          COMPILER_ABI_BOUND=false
          RISCV_INSTRUCTION_EXECUTION_PROVEN=false
          SPIKE_OR_QEMU_EXECUTION_PROVEN=false
          RTL_IMPLEMENTATION_PROVEN=false
          HARDWARE_PERFORMANCE_PROVEN=false
          SEMANTIC_K27_AUTHORITY=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          GATE10_PROMOTED=false
          DEPLOYMENT_AUTHORIZED=false
          EOF
