name: UMC deep review PR materialize

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: umc-deep-review-pr-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor == 'dallascourchene-commits' &&
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.ref == 'refactor/unified-memory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_PARENT: 371e794a57dd37c8d293570b505ce4666340c217
      TRANSPORT_COMMIT: 6c9213018c361864e722064b01ba29b804adb95a
      EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind tree-identical human checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse HEAD^^{tree})"
          test -z "$(git status --porcelain=v1)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared and review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' jsonschema ruff bandit

      - name: Run exact hash-locked deep materializer
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_materialize.sh"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'umc_deep_materialize.sh'
          text = path.read_text(encoding='utf-8')
          old = "EXPECTED_HEAD='371e794a57dd37c8d293570b505ce4666340c217'"
          new = f"EXPECTED_HEAD='{os.environ['EVENT_HEAD']}'"
          if text.count(old) != 1:
              raise SystemExit('materializer expected-head binding is ambiguous')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash "${RUNNER_TEMP}/umc_deep_materialize.sh"

      - name: Upload deep-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-deep-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.materialize.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = 'success' ]; then
            body='Deep-review materialization succeeded. Exact hashes passed Python 3.10/3.12 syntax checks, repository compileall, full Ruff, Bandit, 65 regressions, zero-finding Waboose, map regeneration, and bounded-path publication.'
          else
            body='Deep-review materialization failed closed. The hash/tree/path gates prevented unverified publication; inspect the UMC deep review PR materialize workflow evidence.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
