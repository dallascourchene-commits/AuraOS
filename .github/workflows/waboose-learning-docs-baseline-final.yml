name: Waboose Learning Docs Baseline Final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/waboose-learning-docs-baseline-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waboose-learning-docs-baseline-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AURA_WABOOSE_LEARNING_ROOT: /tmp/aura-waboose-learning
      HEAD_REF: ${{ github.event.pull_request.head.ref || 'feature/aura-emergent-evidence-spine' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit
      - name: Restore exact merge-base CODEMAP and apply canonical docs
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base origin/main HEAD)"
          test -n "$BASE_SHA"
          git checkout "$BASE_SHA" -- .aura/CODEMAP.json .aura/CODEMAP.md
          python scripts/apply_waboose_learning_docs.py
          git diff --quiet "$BASE_SHA" -- .aura/CODEMAP.json .aura/CODEMAP.md
          grep -q '^# Coding Waboose V1.1$' docs/AURA_CODING_WABOOSE.md
          grep -q '## Learning from successful CodeRabbit reviews' docs/AURA_CODING_WABOOSE.md
          grep -q 'semantic_review_incomplete' docs/AURA_CODING_WABOOSE.md
          grep -q 'aura_waboose_learn_coderabbit' docs/AURA_CODING_WABOOSE.md
      - name: Reconfirm permanent Python owners
        run: |
          python -m py_compile \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py
          python -m pytest -q \
            tests/test_aura_waboose_semantic_rules.py \
            tests/test_aura_waboose_semantic_rule_false_positives.py \
            tests/test_aura_waboose_semantic_completeness.py \
            tests/test_aura_waboose_learning.py \
            tests/test_aura_waboose_learning_workflows.py \
            tests/test_aura_emergent_evidence_spine_coderabbit.py
          ruff check \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py
          bandit -q -ll \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py
      - name: Remove temporary documentation machinery
        run: |
          rm -f scripts/apply_waboose_learning_docs.py
          rm -f .github/workflows/waboose-learning-docs-baseline-final.yml
      - name: Commit exact permanent documentation tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document grounded Waboose semantic learning"
      - name: Build final semantic Waboose request
        run: |
          python - <<'PY'
          import json
          request = {
              "objective": "Verify the final Coding Waboose semantic-completeness and CodeRabbit Connectome DREAM-lite QDKT learning documentation capsule.",
              "mode": "range",
              "base_ref": "origin/main",
              "head_ref": "HEAD",
              "profile": "precision",
              "graph_depth": 2,
              "graph_node_budget": 240,
              "run_tests": False,
              "run_optional_tools": False,
              "focus_directives": [
                  {"name":"strict_boolean_options","question":"Are boolean options parsed with strict types rather than truthiness?","risk":"correctness","target_patterns":["boolean option","strict type"],"required_evidence":["semantic_rule"]},
                  {"name":"qualified_symbol_identity","question":"Are qualified symbols and same-named methods kept distinct at every target binding boundary?","risk":"dependency_impact","target_patterns":["qualified symbol","symbol identity"],"required_evidence":["semantic_rule"]},
                  {"name":"source_inventory_integrity","question":"Does source inventory fail closed on unreadable files and decoding errors?","risk":"correctness","target_patterns":["source inventory","decoding","unreadable file"],"required_evidence":["semantic_rule"]},
                  {"name":"bounded_closure_integrity","question":"Are closure edge endpoints always inside the bounded closure node set?","risk":"dependency_impact","target_patterns":["bounded closure","edge endpoint"],"required_evidence":["semantic_rule"]},
                  {"name":"test_evidence_preservation","question":"Are test callable nodes and test edges preserved in bounded audit evidence?","risk":"test_gap","target_patterns":["test callable","test edge"],"required_evidence":["semantic_rule"]}
              ],
              "invariants": [
                  "Unsupported semantic focus blocks deterministic-only completion.",
                  "CodeRabbit, Connectome, DREAM-lite, and QDKT remain non-authoritative.",
                  "Reviewed pull request code is never executed by the learning workflow.",
                  "Generated CODEMAP files match the exact PR merge base in this capsule.",
                  "Production mutation and automatic merge remain false."
              ],
              "risk_map": ["semantic_completeness","teacher_authority","cross_pr_memory","generated_artifact_consistency"]
          }
          with open('/tmp/waboose-docs-request.json','w',encoding='utf-8') as handle:
              json.dump(request, handle)
          PY
      - name: Run and enforce final zero-finding Coding Waboose review
        run: |
          set -o pipefail
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/waboose-docs-state.json \
            run --request /tmp/waboose-docs-request.json \
            | tee /tmp/waboose-docs-result.json
          python - <<'PY'
          import json
          with open('/tmp/waboose-docs-result.json', encoding='utf-8') as handle:
              packet = json.load(handle)
          assert packet.get('ok') is True, packet
          assert packet.get('semantic_review_complete') is True, packet
          assert not packet.get('unverified_focus_directives'), packet
          assert not packet.get('findings'), packet
          assert not packet.get('forge_repair_requests'), packet
          assert set(packet.get('semantic_rule_packs_executed') or []) == {
              'strict_input_types', 'symbol_identity', 'source_integrity',
              'bounded_graph_integrity', 'test_evidence_preservation'
          }
          assert packet.get('production_mutation') is False
          assert packet.get('automatic_merge') is False
          PY
      - name: Push reviewed permanent documentation tree
        run: git push origin HEAD:"$HEAD_REF"
      - name: Upload documentation capsule evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waboose-learning-docs-baseline-final
          path: |
            /tmp/waboose-docs-result.json
            /tmp/waboose-docs-state.json
          if-no-files-found: warn
          retention-days: 7
