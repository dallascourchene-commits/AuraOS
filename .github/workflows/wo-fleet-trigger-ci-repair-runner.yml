# Registered one-shot runner for WO-TRIAD2-CI-CODEMAP-REPAIR-001 (generation 9).
name: WO Fleet Trigger Triad2 CI Repair Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wo-fleet-trigger-ci-repair-runner.yml

permissions:
  contents: write

jobs:
  repair-target-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: ci/wo-triad2-ci-codemap-repair-001
      PYTHONPATH: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/wo-triad2-ci-codemap-repair-001
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python 3.12 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"

      - name: Apply deterministic repair transform
        run: python tools/wo_triad2_ci_codemap_repair.py

      - name: Apply Architect fail-closed repair
        run: python tools/wo_triad2_ci_codemap_failclosed_patch.py

      - name: Restore line-bound bang-command CODEMAP index
        run: python tools/wo_triad2_ci_codemap_command_index_patch.py

      - name: Preserve lossless byte-stable incremental CODEMAP refresh
        run: python tools/wo_triad2_ci_codemap_incremental_stability_patch.py

      - name: Bind SkillWeaver to canonical CODEMAP command index
        run: python tools/wo_triad2_ci_skillweaver_codemap_patch.py

      - name: Restore CODEMAP iterator positional compatibility
        run: python tools/wo_triad2_ci_codemap_iterator_compat_patch.py

      - name: Remove branch-local bootstrap files before regeneration
        run: |
          rm -f tools/wo_triad2_ci_codemap_repair.py
          rm -f tools/wo_triad2_ci_codemap_failclosed_patch.py
          rm -f tools/wo_triad2_ci_codemap_command_index_patch.py
          rm -f tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          rm -f tools/wo_triad2_ci_skillweaver_codemap_patch.py
          rm -f tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          rm -f .github/workflows/wo-triad2-ci-codemap-repair-bootstrap.yml

      - name: Compile repaired Python surfaces
        run: python -m py_compile aura_codebase_navigator.py aura_codemap_verify.py aura_architect_loop.py aura_topological_scanner.py aura_topology_manager.py aura_fusion.py aura_skillweaver.py

      - name: Regenerate and verify canonical deep CODEMAP
        run: |
          python aura_codebase_navigator.py --refresh-topology
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python -m aura_codemap_verify

      - name: Python 3.12 CODEMAP and PR272/275 contract checks
        id: contracts312
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            --junitxml=triad2-contracts-py312.xml \
            2>&1 | tee triad2-contracts-py312.txt

      - name: Python 3.12 full pytest-native suite
        id: full312
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --maxfail=1 \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --deselect=tests/test_aura_human_agent_arena.py::test_affordance_map_declares_source_of_truth \
            --junitxml=triad2-full-py312.xml \
            2>&1 | tee triad2-full-py312.txt

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python 3.10 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Python 3.10 CODEMAP and PR272/275 contract checks
        id: contracts310
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            --junitxml=triad2-contracts-py310.xml \
            2>&1 | tee triad2-contracts-py310.txt

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo-triad2-ci-codemap-repair-${{ github.run_id }}
          path: |
            triad2-contracts-py312.txt
            triad2-contracts-py312.xml
            triad2-full-py312.txt
            triad2-full-py312.xml
            triad2-contracts-py310.txt
            triad2-contracts-py310.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce all pre-commit verification gates
        if: steps.contracts312.outcome != 'success' || steps.full312.outcome != 'success' || steps.contracts310.outcome != 'success'
        run: |
          echo "Repair verification is not 100% green; refusing commit and PR progression."
          echo "Python 3.12 focused: ${{ steps.contracts312.outcome }}"
          echo "Python 3.12 full: ${{ steps.full312.outcome }}"
          echo "Python 3.10 focused: ${{ steps.contracts310.outcome }}"
          exit 1

      - name: Remove transient diagnostics before commit
        run: |
          rm -f triad2-contracts-py312.txt triad2-contracts-py312.xml
          rm -f triad2-full-py312.txt triad2-full-py312.xml
          rm -f triad2-contracts-py310.txt triad2-contracts-py310.xml

      - name: Commit exact tested repair tree
        run: |
          git config user.name "AuraOS CI Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair delta was produced."
            exit 1
          fi
          git commit -m "fix(ci): restore deterministic deep CODEMAP contracts"
          git push origin HEAD:${TARGET_BRANCH}
