name: Aura Archive Versioned Chunk DAG

# Proof trigger only: semantic archive surface is unchanged by this comment.
on:
  pull_request:
    paths:
      - "tools/aura_structural_archive_probe.py"
      - "tests/test_aura_structural_archive_probe.py"
      - "tools/aura_archive_versioned_chunk_dag.py"
      - "tests/test_aura_archive_versioned_chunk_dag.py"
      - ".github/workflows/aura-structural-archive-probe.yml"
      - ".github/workflows/aura-archive-versioned-chunk-dag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-versioned-chunk-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact checkout without mutable third-party action
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Compile archive layers
        run: |
          set -euo pipefail
          python -m py_compile tools/aura_structural_archive_probe.py
          python -m py_compile tools/aura_archive_versioned_chunk_dag.py
          python -m py_compile tests/test_aura_structural_archive_probe.py
          python -m py_compile tests/test_aura_archive_versioned_chunk_dag.py

      - name: Reprove structural codec owner
        run: |
          set -euo pipefail
          python -m unittest tests.test_aura_structural_archive_probe -v

      - name: Prove versioned chunk DAG addendum
        run: |
          set -euo pipefail
          python -m unittest tests.test_aura_archive_versioned_chunk_dag -v

      - name: Verify exact reconstruction and claim ceiling
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.aura_archive_versioned_chunk_dag import (
              ChunkingPolicy,
              VersionedArtifact,
              inspect_versioned_archive,
              pack_versioned_archive,
              unpack_versioned_archive,
          )

          shared = (b'{"law":"StableSubjectKey != EvidenceGenerationKey","payload":"' +
                    b"A" * 2048 + b'"}\n') * 6
          v1 = shared + b'{"generation":"g1","delta":"alpha"}\n' + shared
          v2 = shared + b'{"generation":"g2","delta":"beta"}\n' + shared

          def artifact(name, body, generation):
              return VersionedArtifact(
                  artifact_id=name,
                  subject_key="subject:archive-proof",
                  generation_id=generation,
                  source_bytes=body,
                  sector="08_RSH",
                  event_at="2026-08-31T17:00:00Z",
                  recorded_at="2026-08-31T17:01:00Z",
                  scale="WORLD",
                  hydration_index={"L0": "orientation", "L1": "purpose"},
                  connectome_edges=(
                      {"relation": "DERIVED_FROM", "target": "archive-parent"},
                  ),
                  d13=(0,) * 13,
                  k27=(13, 2, 25),
              )

          archive, stats = pack_versioned_archive(
              [artifact("g1", v1, "g1"), artifact("g2", v2, "g2")],
              policy=ChunkingPolicy(min_size=64, avg_size=128, max_size=256),
          )
          assert unpack_versioned_archive(archive) == {"g1": v1, "g2": v2}
          info = inspect_versioned_archive(archive)
          assert stats.unique_chunk_source_bytes < stats.logical_source_bytes
          assert info["index_plane"]["reconstruction_authority"] is False
          assert info["index_plane"]["semantic_similarity_dedup_authority"] is False
          assert info["claim_ceiling"]["universal_compression_superiority"] is False
          assert info["claim_ceiling"]["coordinate_memory_write_authority"] is False
          assert info["claim_ceiling"]["native_private_transformer_kv"] is False
          assert info["claim_ceiling"]["effect_authority"] is False
          print({
              "logical_source_bytes": stats.logical_source_bytes,
              "unique_chunk_source_bytes": stats.unique_chunk_source_bytes,
              "archive_bytes": stats.archive_bytes,
              "dedup_fraction_fixture_only": stats.exact_dedup_savings_fraction,
              "structural_modes": stats.structural_modes,
          })
          PY
