name: Aura NAV13D EKI4 Hydrated Version Handoff Proof

on:
  pull_request:
    paths:
      - "tools/aura_nav13d_eki4_hydrated_version_handoff.py"
      - "tests/test_aura_nav13d_eki4_hydrated_version_handoff.py"
      - "docs/arena/NAV13D_EKI4_HYDRATED_VERSION_HANDOFF_V1.md"
      - ".github/workflows/aura-nav13d-eki4-hydrated-version-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-handoff-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAV13D_HEAD: "94e278db77aadce3429fa80d8925c751f44cecf6"
      NAV13D_PROOF_HEAD: "2a9e14fe032500f074a17ad8493b975f82989478"
      NAV13D_RUN: "33435748257"
      NAV13D_BLOB: "1612eac627dbc14d603ebae9c1327170500c76e7"
      EKI4_HEAD: "162fdb9c69f288090845453a67d1f41da28e8a53"
      EKI4_RUN: "33435683382"
      EKI4_BLOB: "7ac33764ee238098a2887af96344ed642565ac48"
      CONVERGENCE: "55f15c62eef96951c8af35df098efa865702b48c"
    steps:
      - name: Fetch exact head and parent generations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$TARGET_SHA" "$NAV13D_HEAD" "$NAV13D_PROOF_HEAD" "$EKI4_HEAD" "$CONVERGENCE"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Authenticate true convergence parents and semantic blobs
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P "$CONVERGENCE")" = "$EKI4_HEAD $NAV13D_HEAD"
          test "$(git rev-parse "$NAV13D_HEAD:tools/aura_nav13_hydration_completion.py")" = "$NAV13D_BLOB"
          test "$(git rev-parse "$EKI4_HEAD:tools/aura_external_version_transition_envelope.py")" = "$EKI4_BLOB"
          test "$(git rev-parse "$NAV13D_PROOF_HEAD:tools/aura_nav13_hydration_completion.py")" = "$NAV13D_BLOB"
          echo "EXACT_TWO_PARENT_CONVERGENCE=true"

      - name: Revalidate independent hosted parent proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = (
              (int(os.environ["NAV13D_RUN"]), os.environ["NAV13D_PROOF_HEAD"], "Aura NAV-13 Hydration Completion Binding Proof"),
              (int(os.environ["EKI4_RUN"]), os.environ["EKI4_HEAD"], "Aura External Version Transition Envelope V1"),
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          for run_id, head, name in expected:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}", headers=headers
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run["head_sha"] == head, (run_id, run["head_sha"], head)
              assert run["name"] == name, (run_id, run["name"], name)
              assert run["status"] == "completed" and run["conclusion"] == "success", run
              print(f"EXACT_PARENT_SUCCESS run={run_id} head={head}")
          PY

      - name: Compile and run focused adversarials
        run: |
          set -euo pipefail
          python3 -m py_compile tools/aura_nav13d_eki4_hydrated_version_handoff.py tests/test_aura_nav13d_eki4_hydrated_version_handoff.py
          python3 -m unittest -v tests.test_aura_nav13d_eki4_hydrated_version_handoff

      - name: Exhaust 128-state Different-J handoff lattice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.aura_nav13d_eki4_hydrated_version_handoff import prove_different_j
          assert prove_different_j() == 128
          print("NAV13D_EKI4_DIFFERENT_J_128=PASS")
          PY

      - name: Enforce nonpromotion laws
        run: |
          set -euo pipefail
          grep -q 'HydrationCompletion!=EvidenceAdmission!=PersistentWrite' tools/aura_nav13d_eki4_hydrated_version_handoff.py
          grep -q 'CurrentAtWrite!=CurrentAtRead' tools/aura_nav13d_eki4_hydrated_version_handoff.py
          grep -q 'FutureReadCurrentnessDebtMustSurviveHandoff' tools/aura_nav13d_eki4_hydrated_version_handoff.py
          grep -q 'CoordinateMemory!=MODEL_PREFIX_KV' tools/aura_nav13d_eki4_hydrated_version_handoff.py
          echo "PERSISTENT_WRITE_AUTHORIZED=false"
          echo "EVIDENCE_ADMITTED=false"
          echo "SOURCE_TRUTH_PROVEN=false"
          echo "READ_CURRENTNESS_PROVEN=false"
          echo "SEMANTIC_K27_AUTHORITY=false"
          echo "NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false"
