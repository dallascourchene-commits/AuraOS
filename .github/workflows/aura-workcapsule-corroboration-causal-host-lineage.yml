name: Aura WorkCapsule Corroboration Causal Host Lineage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR573_SHA: 01603674b2de33f5cad4b534c1e602511cf6bb5a
  PR577_SHA: 1dd21e248d0925297d52a8067f1ded35fbba9cbf
  CONVERGENCE_SHA: fe562cbd478c28202ca09144dfe1fbb315318378
  PR573_OWNER_BLOB: daaadce3ec21957a2a257c2fbb4ee066f1be0c9a
  PR577_OWNER_BLOB: ea56321ab6ebd06a74a22d8ee4736d362a561b16
  PR577_TEST_BLOB: e28d017a1706419e7203d5c4e7056a732fa9fb1c

jobs:
  exact-corroboration-host-lineage-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact child and prove PR573 x PR577 convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=280 origin "$TARGET_SHA" "$CONVERGENCE_SHA" "$PR573_SHA" "$PR577_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git show -s --format=%P "$CONVERGENCE_SHA")" = "$PR573_SHA $PR577_SHA"
          git merge-base --is-ancestor "$PR573_SHA" HEAD
          git merge-base --is-ancestor "$PR577_SHA" HEAD
          test "$(git hash-object scripts/aura_workcapsule_causal_artifact_qualified_host_envelope.py)" = "$PR573_OWNER_BLOB"
          test "$(git hash-object scripts/aura_workcapsule_live_causal_corroboration.py)" = "$PR577_OWNER_BLOB"
          test "$(git hash-object tests/test_aura_workcapsule_live_causal_corroboration.py)" = "$PR577_TEST_BLOB"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          echo 'TRUE_TWO_PARENT_PR573_PR577_CONVERGENCE=true'
          echo 'EXACT_PR573_AND_PR577_OWNER_BLOBS=true'

      - name: Re-prove PR573 causal-envelope owner on child tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/aura_workcapsule_artifact_qualified_host_observation.py \
            scripts/aura_workcapsule_causal_artifact_qualified_host_envelope.py
          python3 -m unittest -v tests.test_aura_workcapsule_causal_artifact_qualified_host_envelope

      - name: Fetch and re-prove exact PR577 corroboration owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr577 && mkdir -p /tmp/pr577
          git -C /tmp/pr577 init .
          git -C /tmp/pr577 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr577 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR577_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr577 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr577 rev-parse HEAD)" = "$PR577_SHA"
          test -z "$(git -C /tmp/pr577 config --local --get-all http.https://github.com/.extraheader || true)"
          cd /tmp/pr577
          python3 -m py_compile scripts/aura_workcapsule_live_causal_corroboration.py
          python3 -m unittest -v tests.test_aura_workcapsule_live_causal_corroboration

      - name: Prove O43 one-lineage-per-envelope adversarials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/aura_workcapsule_corroboration_causal_host_lineage.py
          python3 -m unittest -v tests.test_aura_workcapsule_corroboration_causal_host_lineage

      - name: Prove mixed corroborated lineages cannot assemble host completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_aura_workcapsule_corroboration_causal_host_lineage.CorroborationCausalHostLineageTests.test_mixed_correlated_lineages_cannot_assemble_one_host_envelope \
            tests.test_aura_workcapsule_corroboration_causal_host_lineage.CorroborationCausalHostLineageTests.test_foreign_target_is_not_laundered_by_corroboration \
            tests.test_aura_workcapsule_corroboration_causal_host_lineage.CorroborationCausalHostLineageTests.test_valid_causal_envelope_from_foreign_o10_world_rejects

      - name: Assert owner reuse and complete consequence ceiling
        shell: bash
        run: |
          set -euo pipefail
          child=scripts/aura_workcapsule_corroboration_causal_host_lineage.py
          grep -q 'verify_live_causal_corroboration' "$child"
          grep -q 'verify_causal_host_admission_envelope' "$child"
          if grep -q '^def verify_live_causal_corroboration' "$child"; then
            echo 'child duplicated PR577 corroboration owner' >&2
            exit 1
          fi
          if grep -q '^def verify_causal_host_admission_envelope' "$child"; then
            echo 'child duplicated PR573 causal-envelope owner' >&2
            exit 1
          fi
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_corroboration_causal_host_lineage import verify_corroboration_causal_host_lineage
          params = set(inspect.signature(verify_corroboration_causal_host_lineage).parameters)
          assert params == {'pr568_receipt','pr572_receipt','causal_host_admission_receipt'}
          PY
          cat <<'EOF'
          CORROBORATION_REPROVED=true
          CAUSAL_HOST_ENVELOPE_INTEGRITY_CHECKED=true
          ONE_RESOLVED_PROOF_LINEAGE_PER_HOST_ENVELOPE=true
          CORROBORATION_COLLAPSED_TO_ONE_ARTIFACT=false
          HOST_OBSERVATION_TRANSFERRED_TO_PEER_ARTIFACT=false
          CAUSAL_HOST_ENVELOPE_REPROVED_BY_CHILD=false
          CAUSAL_HOST_ENVELOPE_PRODUCER_AUTHENTICATED=false
          SEMANTIC_EQUIVALENCE_OF_PROOF_ARTIFACTS=false
          SEMANTIC_TRUTH=false
          HOST_RESOLVER_TRUST=false
          HOST_OBSERVATION_AUTHORITY=false
          TRUSTED_CONTINUATION=false
          HOST_EFFECT_READY=false
          REVIEW_MUTATION_EXECUTION_COMMIT_MERGE_PROMOTION_PROVIDER_PUBLIC_HUMAN_AUTHORITY=false
          SEMANTIC_K27_AUTHORITY=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          GATE10_PROMOTION=false
          EOF
