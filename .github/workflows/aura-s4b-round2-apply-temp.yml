# Final isolated hash-verified S4-B apply. All competing branch writers were removed.
name: Aura Temporary S4-B Verified Patch Apply

on:
  pull_request:
    paths:
      - ".github/workflows/aura-s4b-round2-apply-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact pull-request head only
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feature/spatial-s4b-gaussian-security
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Reconstruct, verify, and apply exact repair patch
        run: |
          set -euo pipefail
          cat .aura_temp/codex_reconciled_* | base64 --decode > /tmp/s4b-repair.patch.gz
          echo "681714af97fc4d708551cfd2429e15bcb26b11be598cbcf2abb011c979599bdc  /tmp/s4b-repair.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/s4b-repair.patch.gz > /tmp/s4b-repair.patch
          echo "53dbcf911223bbb8673ef66b31d1ca61677a50a709c268f323f90f6c0d01084c  /tmp/s4b-repair.patch" | sha256sum --check --strict
          git apply --check --exclude=.github/workflows/aura-spatial-s4.yml /tmp/s4b-repair.patch
          git apply --exclude=.github/workflows/aura-spatial-s4.yml /tmp/s4b-repair.patch
          git diff --check

      - name: Set up Python 3.12 and Node 22
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact decoder and verification tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy

      - name: Compile, lint, format, and run focused regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/*.py \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py
          ruff check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_spz.py
          ruff format --check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_spz.py
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_mixed_scene.py
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs

      - name: Run complete retained S0-S4-B compatibility
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py \
            tests/test_aura_spatial_final_review.py \
            tests/test_aura_showcase_spatial_integration.py \
            tests/test_aura_spatial_render_plan.py \
            tests/test_aura_spatial_session.py \
            tests/test_aura_spatial_server.py \
            tests/test_aura_spatial_continuation_harness.py \
            tests/test_aura_spatial_browser_interaction.py \
            tests/test_aura_spatial_telemetry.py \
            tests/test_aura_spatial_gltf.py \
            tests/test_aura_spatial_ply.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_s4b_harness.py
          npm run test:spatial

      - name: Remove non-workflow transport surfaces
        run: |
          set -euo pipefail
          rm -rf .aura_temp scripts/.s4b_*
          git diff --check
          test ! -e .aura_temp
          test -z "$(find scripts -maxdepth 1 -name '.s4b_*' -print -quit)"

      - name: Publish verified repair through Git Data API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: feature/spatial-s4b-gaussian-security
        run: |
          set -euo pipefail
          git add -A
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          base_tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()

          def api(method: str, path: str, payload: dict | None = None) -> dict:
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "aura-spatial-s4b-verifier",
                  },
              )
              try:
                  with urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          ref = api("GET", f"/git/ref/heads/{branch}")
          observed = ref["object"]["sha"]
          if observed != parent:
              raise RuntimeError(f"branch moved before publish: expected {parent}, observed {observed}")

          raw_names = subprocess.check_output(["git", "diff", "--cached", "--name-only", "-z"]).split(b"\0")
          changed = [item.decode("utf-8") for item in raw_names if item]
          deleted_raw = subprocess.check_output(
              ["git", "diff", "--cached", "--diff-filter=D", "--name-only", "-z"]
          ).split(b"\0")
          deleted = {item.decode("utf-8") for item in deleted_raw if item}
          if not changed:
              raise RuntimeError("verified repair produced no staged changes")

          entries: list[dict] = []
          for path in changed:
              if path in deleted:
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              stage = subprocess.check_output(["git", "ls-files", "-s", "--", path], text=True).strip()
              if not stage:
                  raise RuntimeError(f"missing staged mode for {path}")
              mode = stage.split()[0]
              content = base64.b64encode(Path(path).read_bytes()).decode("ascii")
              blob = api("POST", "/git/blobs", {"content": content, "encoding": "base64"})
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          tree = api("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api(
              "POST",
              "/git/commits",
              {
                  "message": "fix: resolve Codex S4-B safety findings",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          api("PATCH", f"/git/refs/heads/{branch}", {"sha": commit["sha"], "force": False})
          print(f"published verified exact head {commit['sha']}")
          PY
