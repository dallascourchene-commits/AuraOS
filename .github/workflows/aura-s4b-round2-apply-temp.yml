name: Aura Temporary S4-B Verified Patch Apply

on:
  pull_request:
    paths:
      - ".github/workflows/aura-s4b-round2-apply-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Prove permanent source still matches exported review head
        run: |
          set -euo pipefail
          git diff --exit-code 2d348700a55f8adb879017ff10ce6cce5c6b4d80 -- \
            .github/workflows/aura-spatial-s4.yml \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/__init__.py \
            aura_spatial_importers/contracts.py \
            aura_spatial_importers/gaussian_gltf.py \
            aura_spatial_importers/spz.py \
            aura_spatial_render_plan.py \
            aura_spatial_web/gaussian_renderer.js \
            aura_spatial_web/renderer_adapter.js \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_spz.py

      - name: Reconstruct, verify, and apply exact repair patch
        run: |
          set -euo pipefail
          cat .aura_temp/codex_reconciled_* | base64 --decode > /tmp/s4b-repair.patch.gz
          echo "681714af97fc4d708551cfd2429e15bcb26b11be598cbcf2abb011c979599bdc  /tmp/s4b-repair.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/s4b-repair.patch.gz > /tmp/s4b-repair.patch
          echo "53dbcf911223bbb8673ef66b31d1ca61677a50a709c268f323f90f6c0d01084c  /tmp/s4b-repair.patch" | sha256sum --check --strict
          git apply --check /tmp/s4b-repair.patch
          git apply /tmp/s4b-repair.patch
          git diff --check

      - name: Set up Python 3.12 and Node 22
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact decoder and verification tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy

      - name: Compile, lint, format, and run focused regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/*.py \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py
          ruff check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_spz.py
          ruff format --check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_spz.py
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_mixed_scene.py
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs

      - name: Run complete retained S0-S4-B compatibility
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py \
            tests/test_aura_spatial_final_review.py \
            tests/test_aura_showcase_spatial_integration.py \
            tests/test_aura_spatial_render_plan.py \
            tests/test_aura_spatial_session.py \
            tests/test_aura_spatial_server.py \
            tests/test_aura_spatial_continuation_harness.py \
            tests/test_aura_spatial_browser_interaction.py \
            tests/test_aura_spatial_telemetry.py \
            tests/test_aura_spatial_gltf.py \
            tests/test_aura_spatial_ply.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_s4b_harness.py
          npm run test:spatial

      - name: Remove every temporary transport surface
        run: |
          set -euo pipefail
          rm -rf .aura_temp scripts/.s4b_*
          rm -f .github/workflows/aura-s4b-*-temp.yml
          rm -f .github/workflows/aura-source-export-temp.yml
          rm -f .github/workflows/aura-tree-sha-temp.yml
          git diff --check
          ! git status --short | grep -E '(^.. \.aura_temp/|^.. scripts/\.s4b_|aura-.*-temp\.yml$)'

      - name: Commit and push clean exact-head repair
        run: |
          set -euo pipefail
          git add -A
          ! git diff --cached --name-only | grep -E '(^\.aura_temp/|^scripts/\.s4b_|aura-.*-temp\.yml$)'
          git -c user.name='Aura Spatial Review' -c user.email='aura-spatial-review@users.noreply.github.com' \
            commit -m 'fix: resolve Codex S4-B safety findings'
          git push origin HEAD:feature/spatial-s4b-gaussian-security
