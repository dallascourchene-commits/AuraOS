name: K27 spatial-frame transition

on:
  pull_request:
    paths:
      - "tools/k27_spatial_frame_transition_contract.py"
      - "tests/test_k27_spatial_frame_transition_contract.py"
      - ".github/workflows/k27-spatial-frame-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run spatial-frame temporal binding battery
        run: python -m unittest tests/test_k27_spatial_frame_transition_contract.py -v
