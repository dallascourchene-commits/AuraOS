name: Synchronize CODEMAP on analysis branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || startsWith(github.event.pull_request.head.ref, 'analysis/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
      - name: Commit synchronized maps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: synchronize CODEMAP"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
