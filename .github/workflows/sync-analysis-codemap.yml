name: PR240 Final Fixture Repair and Verification

on:
  pull_request:
  push:
    branches:
      - analysis/bilateral-intent-final-b11-b15

permissions:
  contents: write

concurrency:
  group: sync-architecture-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair-verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch latest exact PR branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin \
            analysis/bilateral-intent-final-b11-b15
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD > /tmp/pr240-start-sha
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema ruff pyyaml

      - name: Bind legacy fixtures to retained runtime candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_aura_bilateral_live_repair_foundry.py")
          text = path.read_text(encoding="utf-8")
          anchor = '        "repository_identity_unchanged": True,\n'
          if text.count(anchor) != 1:
              raise RuntimeError("runtime proof fixture anchor drifted")
          text = text.replace(
              anchor,
              anchor + '        "runtime_candidate_id": "candidate",\n',
              1,
          )

          def replace_in_test(source: str, name: str, old: str, new: str) -> str:
              start = source.index(f"def {name}(")
              next_start = source.find("\ndef ", start + 1)
              end = len(source) if next_start < 0 else next_start
              block = source[start:end]
              if block.count(old) != 1:
                  raise RuntimeError(f"{name}: expected one candidate fixture replacement")
              return source[:start] + block.replace(old, new, 1) + source[end:]

          replacements = [
              (
                  "test_missing_negative_proof_blocks_repair_promotion",
                  'candidate_digest=sha("candidate"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_failed_runtime_proof_rehydrates_as_rejected_attempt",
                  'candidate_digest=sha("candidate"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_failed_hypothesis_cannot_repeat_across_service_restart",
                  'candidate_digest=sha("candidate-1"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_failed_hypothesis_cannot_repeat_across_service_restart",
                  'candidate_digest=sha("candidate-2"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_repair_attempt_budget_is_persistent_and_bounded",
                  'candidate_digest=sha(f"candidate-{index}"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_repair_attempt_budget_is_persistent_and_bounded",
                  'candidate_digest=sha("candidate-9"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
              (
                  "test_projection_rejects_cross_incident_or_unverified_u7_evidence",
                  'candidate_digest=sha("candidate"),',
                  'candidate_digest=_runtime_binding_digest("candidate"),',
              ),
          ]
          for name, old, new in replacements:
              text = replace_in_test(text, name, old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Run final Codex verification
        run: |
          python -m py_compile \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            tests/test_aura_bilateral_live_repair_foundry.py
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py
          python -m pytest -q \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py \
            tests/test_aura_showcase_attempt_archive.py
          node --check aura_showcase/live-repair-foundry.js

      - name: Restore canonical workflow and regenerate CODEMAP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/sync-analysis-codemap.yml \
            > .github/workflows/sync-analysis-codemap.yml
          rm -f .github/workflows/pr240-codex-final-verify.yml
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check
          git config user.name "AuraOS PR240 Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind final PR240 fixtures and verify Codex repairs"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin \
            analysis/bilateral-intent-final-b11-b15:refs/remotes/origin/pr240-final
          test "$(git rev-parse refs/remotes/origin/pr240-final)" = "$(cat /tmp/pr240-start-sha)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:analysis/bilateral-intent-final-b11-b15
          unset AUTH_HEADER
