name: Synchronize CODEMAP on architecture work branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "docs/**"
      - "fix/construction-demo-runtime-harness-*"
      - "fix/issue-200-exact-head-harness"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"
      - "Aura_Memory/live_topology_ast.json"

permissions:
  contents: write

concurrency:
  group: sync-architecture-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       startsWith(github.event.pull_request.head.ref, 'analysis/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/construction-demo-runtime-harness-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Finalize Issue 200 canonical docs and restore workflow tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin \
            refs/heads/main:refs/remotes/origin/main
          unset AUTH_HEADER
          rm -f .github/workflows/issue-200-finalize.yml
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = "The output contains a compact manifest, a sorted source-review file list, and a deterministic ZIP built from immutable `HEAD` Git blobs. Generated CODEMAP/topology/P9 artifacts, binaries, symlinks, sensitive/runtime paths, and oversized files are digest-only and never treated as ordinary source. Dirty trees fail closed by default. Long `run` operations emit a structured watchdog check-in every 10 minutes (`HEALTHY_CONTINUE`, `SLOW_BUT_PROGRESSING`, `STALLED_REASSESS`, or `UNKNOWN_REASSESS`) and pause safely at 20 minutes with completed-artifact inventory and an exact `--resume` receipt. The exact full Git archive remains available separately for forensic reconstruction.\n"
          paragraph = "\nIssue #200 hardens that boundary with `scripts/aura_exact_head_transport.py`. Exact-main exports, diagnostics, materialized review trees, and publication bundles are written outside the checkout; dirty or mismatched heads fail closed with explicit path evidence. Formatter drift is transported as verified whole-file bytes, while allowlisted scope validation rejects out-of-scope additions, modifications, deletions, symlinks, and special files before any bundle is emitted. The workflow executes the exact request-revision harness and transport helper from an external tools directory against a clean detached `main` checkout, then independently generates and compares a trusted native `git archive` before upload. These bundles remain proposal evidence for the existing Agent Bridge compare-and-swap lane and grant no automatic publication or merge authority.\n"
          if paragraph.strip() not in text:
              if anchor not in text:
                  raise SystemExit("README insertion anchor missing")
              text = text.replace(anchor, anchor + paragraph, 1)
          readme.write_text(text, encoding="utf-8", newline="\n")

          architecture = Path(".aura/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          text = text.replace(
              "**Architecture audit:** reviewed through July 24, 2026",
              "**Architecture audit:** reviewed through July 25, 2026",
              1,
          )
          anchor = "Generated maps remain navigation evidence and never become patch authority. Dirty repositories fail closed by default; unrestricted giant diffs and unbounded subprocess capture are prohibited. Long architecture runs are supervised by a proposal-only watchdog: a 10-minute check-in classifies healthy, slow-but-progressing, stalled, or unknown state, while a 20-minute hard checkpoint terminates the child safely and requires explicit `--resume`. Watchdog receipts are external run artifacts and grant no mutation authority. The full exact Git export remains a separate forensic reconstruction artifact rather than the preferred AI review input.\n"
          section = "\n## 3A. Exact-head transport and atomic bundle boundary\n\n`scripts/aura_exact_head_transport.py` is the reusable exact-head transport owner introduced by Issue #200. It binds every operation to a lowercase 40-character expected commit, verifies the observed `HEAD`, and requires a clean working tree before and after export, materialization, or bundle construction. Failure receipts, archives, temporary materializations, and final bundle files must remain outside the source checkout.\n\nThe publication-bundle path is all-or-nothing. It emits canonical whole-file add/replace/delete operations only after validating the complete candidate tree against an explicit allowlist. Out-of-scope additions, modifications, deletions, symlinks, and special files fail closed, including formatter-induced whole-file changes. The architecture export workflow extracts the exact request revision into an external tools directory, compiles that request harness and transport helper, detaches to exact `main`, runs the request transport into a non-authoritative comparison directory, independently generates the authoritative native `git archive`, and requires byte-for-byte equality before upload. The helper prepares evidence only: `production_mutation=false`, `automatic_publication=false`, and `merge_authority=false`.\n"
          if section.strip() not in text:
              if anchor not in text:
                  raise SystemExit("ARCHITECTURE insertion anchor missing")
              text = text.replace(anchor, anchor + section, 1)
          text = text.replace(
              "## 3A. Runtime Refactor Harness boundary",
              "## 3B. Runtime Refactor Harness boundary",
              1,
          )
          architecture.write_text(text, encoding="utf-8", newline="\n")
          PY
          git show refs/remotes/origin/main:.github/workflows/sync-analysis-codemap.yml \
            > .github/workflows/sync-analysis-codemap.yml
      - name: Run Issue 200 focused verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile scripts/aura_exact_head_transport.py scripts/aura_architecture_harness.py
          PYTHONPATH=. pytest -q \
            tests/test_aura_exact_head_transport.py \
            tests/test_aura_architecture_harness_export_workflow.py \
            tests/test_aura_architecture_harness.py
          git diff --check
      - name: Regenerate and validate CODEMAP
        run: |
          cp .aura/CODEMAP.json /tmp/aura-codemap-reference.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify \
            --compare-json /tmp/aura-codemap-reference.json \
            > /tmp/aura-codemap-comparison.json
          comparison_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          result = json.loads(
              Path('/tmp/aura-codemap-comparison.json').read_text(encoding='utf-8')
          )
          if result.get('stable_comparison', {}).get('ok') is True:
              subprocess.run(
                  [
                      'git', 'checkout', 'HEAD', '--',
                      '.aura/CODEMAP.json',
                      '.aura/CODEMAP.md',
                      'topology_map.json',
                      'Aura_Memory/live_topology_ast.json',
                  ],
                  check=True,
              )
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'VOLATILE_ONLY\n', encoding='utf-8'
              )
          else:
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'MEANINGFUL\n', encoding='utf-8'
              )
          PY
          if [ "$(cat /tmp/aura-codemap-change-class.txt)" = "MEANINGFUL" ]; then
            python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          else
            test "$comparison_status" -eq 0
          fi
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check
      - name: Commit synchronized final tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          {
            set -x
            git config user.name "AuraOS CODEMAP Bot"
            git config user.email "actions@users.noreply.github.com"
            git status --short
            git add \
              README.md \
              .aura/ARCHITECTURE.md \
              .aura/CODEMAP.json \
              .aura/CODEMAP.md \
              topology_map.json \
              .github/workflows/sync-analysis-codemap.yml
            git add -A .github/workflows/issue-200-finalize.yml
            git add -f Aura_Memory/live_topology_ast.json
            git diff --cached --stat
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs: finalize architecture and synchronize CODEMAP"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              push origin HEAD:"${TARGET_BRANCH}"
            unset AUTH_HEADER
          } 2>&1 | tee codemap-push.log
      - name: Upload synchronized maps and push diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-codemap-${{ github.sha }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
            codemap-push.log
            /tmp/aura-codemap-comparison.json
            /tmp/aura-codemap-change-class.txt
          if-no-files-found: error
          retention-days: 14
