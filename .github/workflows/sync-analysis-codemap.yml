name: Synchronize CODEMAP on architecture work branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "docs/**"
      - "fix/construction-demo-runtime-harness-*"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"
      - "Aura_Memory/live_topology_ast.json"

permissions:
  contents: write

concurrency:
  group: sync-architecture-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       startsWith(github.event.pull_request.head.ref, 'analysis/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/construction-demo-runtime-harness-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR240_RESTORE_HEAD: ab9db8108e2306fa7bcb6045d4681a2127090913
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared and focused verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema ruff pyyaml

      - name: Apply only still-current PR240 review repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/pr240_resolve_open_reviews.py")
          text = path.read_text(encoding="utf-8")
          old_helper = """def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one replacement site, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")
          """
          new_helper = """def replace_once(
              path: str,
              old: str,
              new: str,
              expected_count: int = 1,
          ) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      f"{path}: expected {expected_count} replacement site(s), found {count}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")
          """
          if text.count(old_helper) != 1:
              raise RuntimeError("PR240 patch helper drifted")
          text = text.replace(old_helper, new_helper, 1)
          lines = text.splitlines()
          marker = "# The same old target block occurs in atomic inventory and is replaced once more."
          if lines.count(marker) != 1:
              raise RuntimeError("PR240 duplicate harness target marker drifted")
          marker_index = lines.index(marker)
          if marker_index < 1 or lines[marker_index - 1].strip() != ")":
              raise RuntimeError("PR240 duplicate harness target call boundary drifted")
          lines.insert(marker_index - 1, "    2,")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          python -m py_compile scripts/pr240_resolve_open_reviews.py scripts/pr240_followup_review_fixes.py
          python scripts/pr240_resolve_open_reviews.py
          python scripts/pr240_followup_review_fixes.py
          rm scripts/pr240_resolve_open_reviews.py
          rm scripts/pr240_followup_review_fixes.py
          rm .github/workflows/pr240-resolve-open-reviews.yml

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$PR240_RESTORE_HEAD"
          git show "$PR240_RESTORE_HEAD:.github/workflows/sync-analysis-codemap.yml" > .github/workflows/sync-analysis-codemap.yml
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          unset AUTH_HEADER

          test ! -e scripts/pr240_resolve_open_reviews.py
          test ! -e scripts/pr240_followup_review_fixes.py
          test ! -e .github/workflows/pr240-resolve-open-reviews.yml
          git diff --check

      - name: Compile repaired source and focused regressions
        run: |
          python -m py_compile \
            aura_arena_attempt_archive.py \
            aura_bilateral_live_repair_foundry.py \
            aura_bilateral_live_repair_foundry_contracts.py \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py

      - name: Run fatal Ruff checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_arena_attempt_archive.py \
            aura_bilateral_live_repair_foundry.py \
            aura_bilateral_live_repair_foundry_contracts.py \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py

      - name: Run focused B11-B15 tests and JavaScript validation
        run: |
          python -m pytest -q \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py \
            tests/test_aura_showcase_attempt_archive.py
          node --check aura_showcase/live-repair-foundry.js

      - name: Commit verified permanent source tree locally
        id: source_commit
        run: |
          git config user.name "AuraOS PR240 Review Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve remaining PR240 review findings"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Aura-native exact-head review harness
        env:
          SOURCE_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          python scripts/aura_review_learning_architect_harness.py \
            --repo-root . \
            --base-ref origin/main \
            --head-ref "$SOURCE_SHA" \
            --output /tmp/pr240-review-harness-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/pr240-review-harness-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'PASSED', receipt
          assert receipt['checks']['waboose_prepare_ok'] is True, receipt
          assert receipt['checks']['waboose_scan_ok'] is True, receipt
          assert receipt['checks']['waboose_finalize_ok'] is True, receipt
          assert receipt['checks']['crucible_passed'] is True, receipt
          assert receipt['production_mutation'] is False, receipt
          assert receipt['automatic_fix'] is False, receipt
          assert receipt['automatic_commit'] is False, receipt
          assert receipt['automatic_push'] is False, receipt
          assert receipt['automatic_pull_request'] is False, receipt
          assert receipt['automatic_merge'] is False, receipt
          assert receipt['human_review_required'] is True, receipt
          PY

      - name: Regenerate and validate CODEMAP from final source tree
        run: |
          cp .aura/CODEMAP.json /tmp/aura-codemap-reference.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify --compare-json /tmp/aura-codemap-reference.json > /tmp/aura-codemap-comparison.json
          comparison_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          result = json.loads(Path('/tmp/aura-codemap-comparison.json').read_text(encoding='utf-8'))
          if result.get('stable_comparison', {}).get('ok') is True:
              subprocess.run(
                  ['git', 'checkout', 'HEAD', '--', '.aura/CODEMAP.json', '.aura/CODEMAP.md', 'topology_map.json', 'Aura_Memory/live_topology_ast.json'],
                  check=True,
              )
              Path('/tmp/aura-codemap-change-class.txt').write_text('VOLATILE_ONLY\n', encoding='utf-8')
          else:
              Path('/tmp/aura-codemap-change-class.txt').write_text('MEANINGFUL\n', encoding='utf-8')
          PY
          if [ "$(cat /tmp/aura-codemap-change-class.txt)" = "MEANINGFUL" ]; then
            python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          else
            test "$comparison_status" -eq 0
          fi
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          ! grep -q 'scripts/pr240_resolve_open_reviews.py' .aura/CODEMAP.md
          ! grep -q 'scripts/pr240_followup_review_fixes.py' .aura/CODEMAP.md
          ! grep -q '.github/workflows/pr240-resolve-open-reviews.yml' .aura/CODEMAP.md
          git diff --check

      - name: Commit final synchronized tree and push once
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -o pipefail
          {
            set -x
            git config user.name "AuraOS CODEMAP Bot"
            git config user.email "actions@users.noreply.github.com"
            git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
            git add -f Aura_Memory/live_topology_ast.json
            git diff --cached --stat
            if ! git diff --cached --quiet; then
              git commit -m "docs: synchronize CODEMAP and topology"
            fi
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"${TARGET_BRANCH}"
            unset AUTH_HEADER
          } 2>&1 | tee codemap-push.log

      - name: Upload verification, synchronized maps, and push diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-codemap-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
            codemap-push.log
            /tmp/pr240-review-harness-receipt.json
            /tmp/aura-codemap-comparison.json
            /tmp/aura-codemap-change-class.txt
          if-no-files-found: warn
          retention-days: 14
