name: Synchronize CODEMAP on analysis and documentation branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "docs/**"
      - "refactor/sco-construction-e4-e6"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       startsWith(github.event.pull_request.head.ref, 'analysis/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Materialize and validate exact E4-E6 slice
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set +e
          LOG=.aura/sco_phase2_gate.log
          : > "$LOG"
          FAILED=0
          run_gate() {
            echo "===== $1 =====" | tee -a "$LOG"
            shift
            "$@" 2>&1 | tee -a "$LOG"
            STATUS=${PIPESTATUS[0]}
            echo "STATUS=$STATUS" | tee -a "$LOG"
            if [ "$STATUS" -ne 0 ]; then FAILED=1; fi
          }

          run_gate materialize python tools/sco_phase2_materialize.py
          run_gate py_compile python -m py_compile \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          run_gate compileall python -m compileall -q \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          run_gate fatal_ruff ruff check --select E9,F63,F7,F82 \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          run_gate manual_fatal_lint python tools/sco_phase2_fatal_lint.py
          run_gate focused_e4_e6 python -m pytest -q \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          run_gate canonical_authority_regressions python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py \
            tests/test_aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py
          run_gate randomized_replay python tools/sco_phase2_randomized_probe.py

          if [ "$FAILED" -ne 0 ]; then
            {
              echo '# SCO Construction E4-E6 Gate Failure'
              echo
              echo 'The exact branch validation failed. No source, test, topology, or workflow changes were promoted.'
              echo
              echo '```text'
              tail -n 500 "$LOG"
              echo '```'
            } > docs/AURA_SCO_PHASE2_GATE_FAILURE.md
            git config user.name "AuraOS Phase Bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/AURA_SCO_PHASE2_GATE_FAILURE.md
            git commit -m "docs: record SCO E4-E6 gate failure [skip ci]"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
              push origin HEAD:"$TARGET_BRANCH"
            unset AUTH_HEADER
            exit 1
          fi
      - name: Restore trusted workflow and remove one-time machinery
        run: |
          rm -rf .aura/phase2_payload
          rm -f .aura/sco_phase2_gate.log
          rm -f tools/sco_phase2_materialize.py
          rm -f tools/sco_phase2_fatal_lint.py
          rm -f tools/sco_phase2_randomized_probe.py
          rm -f .github/workflows/sco-phase2-finalize.yml
          rm -f docs/AURA_SCO_PHASE2_GATE_FAILURE.md
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/sync-analysis-codemap.yml \
            > .github/workflows/sync-analysis-codemap.yml
      - name: Regenerate and verify topology from clean final tree
        run: |
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -f aura_construction_contracts.py
          test -f aura_construction_state.py
          test -f aura_construction_authority.py
          test -f tests/test_aura_construction_contracts.py
          test -f tests/test_aura_construction_state.py
          test -f tests/test_aura_construction_authority.py
          test ! -e .aura/phase2_payload
          test ! -e .github/workflows/sco-phase2-finalize.yml
          git diff --check
      - name: Commit verified E4-E6 branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "AuraOS Phase Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "SCO Construction Arena E4-E6 verified vertical slice [skip ci]"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:"$TARGET_BRANCH"
          unset AUTH_HEADER
