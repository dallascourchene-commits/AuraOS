# One-shot validation capture; restored from HEAD^^^ before final commit.
name: Synchronize CODEMAP on analysis and documentation branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "docs/**"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       startsWith(github.event.pull_request.head.ref, 'analysis/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=4 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
      - name: Apply final Agent Bridge review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}, found {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          bridge = "aura_agent_arena_github_bridge.py"
          replace_once(
              bridge,
              '''        or (\n            lower.startswith(".github/workflows/")\n            and any(\n                marker in lower\n                for marker in ("materialize", "bootstrap", "publisher", "trigger")\n            )\n        )''',
              '''        or lower.startswith(".github/workflows/")''',
          )
          replace_once(
              bridge,
              '''        operation = str(item.get("operation", "upsert")).strip().lower()\n        mode = str(item.get("mode", "100644")).strip()\n        if operation not in {"upsert", "delete"}:\n            raise GitHubPublicationError("operation must be upsert or delete")\n        if mode != "100644":\n            raise GitHubPublicationError(\n                "GraphQL createCommitOnBranch supports regular-file mode 100644 only"\n            )''',
              '''        raw_operation = item.get("operation", "upsert")\n        if (\n            not isinstance(raw_operation, str)\n            or raw_operation not in {"upsert", "delete"}\n        ):\n            raise GitHubPublicationError(\n                "operation must be the exact string upsert or delete"\n            )\n        operation = raw_operation\n\n        raw_mode = item.get("mode", "100644")\n        if not isinstance(raw_mode, str) or raw_mode != "100644":\n            raise GitHubPublicationError(\n                "mode must be the exact string 100644"\n            )\n        mode = raw_mode''',
          )
          replace_once(
              bridge,
              '''        encoding = str(item.get("encoding", "utf-8")).strip().lower()\n        content, graphql_contents, decoded = _decode_content(''',
              '''        raw_encoding = item.get("encoding", "utf-8")\n        if (\n            not isinstance(raw_encoding, str)\n            or raw_encoding not in {"utf-8", "base64"}\n        ):\n            raise GitHubPublicationError(\n                "encoding must be the exact string utf-8 or base64"\n            )\n        encoding = raw_encoding\n        content, graphql_contents, decoded = _decode_content(''',
          )
          replace_once(bridge, '"refName": branch,', '"branchName": branch,')

          tests = "tests/test_aura_agent_arena_github_bridge.py"
          replace_once(
              tests,
              '''        ".github/workflows/materialize-temp.yml",\n        "docs/IMPLEMENTATION_TEMP.md",''',
              '''        ".github/workflows/materialize-temp.yml",\n        ".github/workflows/ci.yml",\n        "docs/IMPLEMENTATION_TEMP.md",''',
          )
          replace_once(
              tests,
              '''def test_create_uses_graphql_cas_refname_and_base64() -> None:''',
              '''def test_create_uses_graphql_cas_branchname_and_base64() -> None:''',
          )
          replace_once(tests, '"refName": BRANCH,', '"branchName": BRANCH,')
          strict_test = '''\n\n@pytest.mark.parametrize(\n    ("field", "value"),\n    [\n        ("operation", "UPSERT"),\n        ("encoding", "UTF-8"),\n        ("mode", 100644),\n    ],\n)\ndef test_change_literals_are_not_coerced(field: str, value: Any) -> None:\n    change: dict[str, Any] = {"path": "strict.txt", "content": "x"}\n    change[field] = value\n    with pytest.raises(GitHubPublicationError):\n        compile_publication_contract(_request(changes=[change]))\n'''
          anchor = "\n\ndef test_temporary_transport_escape_hatch_is_removed() -> None:\n"
          test_text = Path(tests).read_text(encoding="utf-8")
          if test_text.count(anchor) != 1:
              raise SystemExit("strict-literal test anchor was not unique")
          Path(tests).write_text(
              test_text.replace(anchor, strict_test + anchor),
              encoding="utf-8",
          )

          docs = "docs/AURA_AGENT_BRIDGE_GITHUB_PUBLICATION.md"
          replace_once(
              docs,
              '''single server-side compare-and-swap operation.''',
              '''single server-side compare-and-swap operation. The GraphQL\n`CommittableBranch` input uses the exact `branchName` field with an unqualified\nbranch name.''',
          )
          replace_once(
              docs,
              '''No local `git add`, staging directory, shell push, encoded archive, or temporary\nworkflow is required.''',
              '''No local `git add`, staging directory, shell push, encoded archive, or temporary\nworkflow is required. This lane rejects every caller-supplied path under\n`.github/workflows/`, regardless of filename, and accepts only exact schema\nliterals and types for change operation, encoding, and mode.''',
          )
          replace_once(
              docs,
              '''GraphQL `refName` variable shape,''',
              '''GraphQL `branchName` variable shape,''',
          )
          replace_once(docs, "**30 tests**.", "**33 tests**.")
          PY
      - name: Validate final Agent Bridge repair
        run: |
          set -o pipefail
          {
            python -m py_compile \
              aura_agent_arena_github_bridge.py \
              aura_agent_arena_github_mcp.py \
              tests/test_aura_agent_arena_github_bridge.py
            python -m pytest -q tests/test_aura_agent_arena_github_bridge.py
            python - <<'PY'
          from pathlib import Path
          for name in (
              "aura_agent_arena_github_bridge.py",
              "tests/test_aura_agent_arena_github_bridge.py",
          ):
              for number, line in enumerate(
                  Path(name).read_text(encoding="utf-8").splitlines(),
                  1,
              ):
                  if len(line) > 88:
                      raise SystemExit(f"{name}:{number}:{len(line)}")
          PY
            git diff --check
          } 2>&1 | tee validation.log
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
      - name: Restore workflow and commit verified repair
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git show HEAD^^^:.github/workflows/sync-analysis-codemap.yml \
            > .github/workflows/sync-analysis-codemap.yml
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_agent_arena_github_bridge.py \
            tests/test_aura_agent_arena_github_bridge.py \
            docs/AURA_AGENT_BRIDGE_GITHUB_PUBLICATION.md \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .github/workflows/sync-analysis-codemap.yml
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "fix(agent-bridge): finalize publication lane and refresh CODEMAP"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          set -o pipefail
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:"${TARGET_BRANCH}" 2>&1 | tee codemap-push.log
          unset AUTH_HEADER
      - name: Upload synchronized maps and push diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-codemap-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            validation.log
            codemap-push.log
          if-no-files-found: error
          retention-days: 14
