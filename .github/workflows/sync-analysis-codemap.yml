name: Synchronize CODEMAP topology and source anchors

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-safety-hold:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain temporary nonpromoting hold
        run: |
          echo "NONPROMOTING_STACK_SAFETY_HOLD"
          echo "This child is stacked on a historical mutating/credential-diagnostic CODEMAP workflow generation."
          echo "Rebase onto hardened PR #393 or its landed successor before integration, then drop this hold."
          echo "This hold is not production CODEMAP policy."
