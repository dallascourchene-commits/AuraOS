name: Synchronize CODEMAP on architecture work branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "docs/**"
      - "fix/construction-demo-runtime-harness-*"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"
      - "Aura_Memory/live_topology_ast.json"

permissions:
  contents: write

concurrency:
  group: sync-architecture-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       startsWith(github.event.pull_request.head.ref, 'analysis/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/construction-demo-runtime-harness-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate and validate CODEMAP
        run: |
          cp .aura/CODEMAP.json /tmp/aura-codemap-reference.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify \
            --compare-json /tmp/aura-codemap-reference.json \
            > /tmp/aura-codemap-comparison.json
          comparison_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          result = json.loads(
              Path('/tmp/aura-codemap-comparison.json').read_text(encoding='utf-8')
          )
          if result.get('stable_comparison', {}).get('ok') is True:
              subprocess.run(
                  [
                      'git', 'checkout', 'HEAD', '--',
                      '.aura/CODEMAP.json',
                      '.aura/CODEMAP.md',
                      'topology_map.json',
                      'Aura_Memory/live_topology_ast.json',
                  ],
                  check=True,
              )
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'VOLATILE_ONLY\n', encoding='utf-8'
              )
          else:
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'MEANINGFUL\n', encoding='utf-8'
              )
          PY
          if [ "$(cat /tmp/aura-codemap-change-class.txt)" = "MEANINGFUL" ]; then
            python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          else
            test "$comparison_status" -eq 0
          fi
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check
      - name: Commit synchronized maps
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EXPECTED_REMOTE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            set -x
            git config user.name "AuraOS CODEMAP Bot"
            git config user.email "actions@users.noreply.github.com"
            git status --short
            git add \
              .aura/CODEMAP.json \
              .aura/CODEMAP.md \
              topology_map.json
            git add -f Aura_Memory/live_topology_ast.json
            git diff --cached --stat
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs: synchronize CODEMAP and topology"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            TARGET_REF="refs/heads/${TARGET_BRANCH}"
            if [ "$TARGET_BRANCH" = "analysis/pr2-materializer-transport" ]; then
              test -n "$EXPECTED_REMOTE_SHA"
              git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
                push --force-with-lease="${TARGET_REF}:${EXPECTED_REMOTE_SHA}" \
                origin "HEAD:${TARGET_REF}"
            else
              git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
                push origin "HEAD:${TARGET_REF}"
            fi
            unset AUTH_HEADER
          } 2>&1 | tee codemap-push.log
      - name: Upload synchronized maps and push diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-codemap-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
            codemap-push.log
            /tmp/aura-codemap-comparison.json
            /tmp/aura-codemap-change-class.txt
          if-no-files-found: error
          retention-days: 14
