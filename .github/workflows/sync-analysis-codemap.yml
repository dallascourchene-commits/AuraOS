name: SCO Phase 2 Coverage Diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sco-phase2-coverage-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'refactor/sco-construction-e4-e6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch -q --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout -q --detach FETCH_HEAD
      - name: Materialize reviewed tree
        run: |
          python3 tools/sco_phase2_materialize.py >/dev/null
          python3 tools/sco_phase2_transformer_preflight.py >/dev/null
          python3 tools/sco_phase2_apply_review_fixes.py >/dev/null
      - name: Install focused verification tools
        run: python3 -m pip install -q pytest==8.4.1 coverage==7.9.2
      - name: Run tests and print missing lines
        run: |
          python3 -m coverage erase
          python3 -m coverage run -m pytest -q tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py tests/test_aura_construction_authority.py
          python3 -m coverage report -m --include='aura_construction_contracts.py,aura_construction_state.py,aura_construction_authority.py'
