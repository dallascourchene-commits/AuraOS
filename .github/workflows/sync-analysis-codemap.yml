name: Synchronize CODEMAP on analysis branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || startsWith(github.event.pull_request.head.ref, 'analysis/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Publish final benchmark evidence and repair report gates
        run: |
          cat > /tmp/planning.json <<'JSON'
          {
            "repository_commit_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
            "arms": {
              "raw_broad_context": {"model_calls": 1, "input_tokens": 130486, "output_tokens": 1169, "total_tokens": 131655, "normalized_cost_usd": 0.133993, "quality": {"quality_score": 0.9550}},
              "aura_slice_single": {"model_calls": 1, "input_tokens": 12764, "output_tokens": 1667, "total_tokens": 14431, "normalized_cost_usd": 0.017765, "quality": {"quality_score": 0.9607}},
              "aura_architect_council": {
                "model_calls": 18,
                "input_tokens": 163936,
                "output_tokens": 4633,
                "total_tokens": 168569,
                "normalized_cost_usd": 0.177835,
                "quality": {"quality_score": 0.9625},
                "selected_plan": {"length_profile": {"length_class": "LONG", "task_count": 8, "distinct_file_count": 17}},
                "model_usage": {"attempted_call_count": 18, "call_count": 18, "failed_call_count": 0}
              }
            },
            "comparison": {
              "slice_input_reduction_pct": 90.22,
              "slice_total_reduction_pct": 89.04,
              "slice_quality_delta": 0.0057,
              "council_total_reduction_pct": -28.04,
              "council_quality_delta": 0.0075
            },
            "role_token_totals": {
              "planner": {"calls": 1, "input_tokens_estimated": 399, "output_tokens_estimated": 2011},
              "planner_alt": {"calls": 1, "input_tokens_estimated": 400, "output_tokens_estimated": 1546},
              "shadow": {"calls": 15, "input_tokens_estimated": 135582, "output_tokens_estimated": 1001},
              "judge": {"calls": 1, "input_tokens_estimated": 27555, "output_tokens_estimated": 75}
            },
            "prompt_manifest": {"entry_count": 20},
            "fixture_completion": {
              "added_long_critic_aliases": {"sequence": "scope", "continuity": "tests", "rollback": "cost"},
              "independent_provider_responses": false
            },
            "findings": [{"id": "F5_PLAN_CONTRACT_LOSS", "lost_fields": [], "status": "NOT_OBSERVED"}]
          }
          JSON
          cat > /tmp/real.json <<'JSON'
          {
            "selected_plan_match": true,
            "disposition": "ACCEPTED",
            "plan_comparison": {"selected_candidate_id": "PLAN-D-SELECTIVE-COUNCIL-V3-SURGEON"},
            "execution_evidence": {
              "head_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
              "patch_digest": "0c0b1ad98678e0c33b2e66775a625832",
              "visible_junit": {"passed": 32, "tests": 32, "failures": 0, "errors": 0},
              "hidden_junit": {"passed": 35, "tests": 35, "failures": 0, "errors": 0},
              "regression_junit": {"passed": 21, "tests": 21, "failures": 0, "errors": 0},
              "gates": {
                "compile": "PASS",
                "api_compatibility": "PASS",
                "security": "PASS",
                "static_analysis": "PASS",
                "container_build": "PASS",
                "selected_plan_bound_to_arena": "PASS",
                "local_output_vault": "PASS",
                "record_redaction": "PASS"
              }
            },
            "code_quality_record": {
              "working_status": "WORKING",
              "observed_quality_score": 100.0,
              "benchmark_quality_score": 93.5,
              "measurement_completeness_pct": 93.5
            }
          }
          JSON
          python scripts/update_architect_benchmark_readme.py \
            --planning-report /tmp/planning.json \
            --real-trial /tmp/real.json \
            --output /tmp/README.updated.md
          cp /tmp/README.updated.md README.md
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/architect-consolidation-benchmark.yml')
          text = workflow.read_text(encoding='utf-8')
          checkout = '          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n'
          if '          persist-credentials: false\n' not in text.split('      - uses: actions/setup-python@v5', 1)[0]:
              if checkout not in text:
                  raise SystemExit('consolidation checkout anchor missing')
              text = text.replace(checkout, checkout + '          persist-credentials: false\n', 1)
          start = text.find('      - name: Verify committed README and preserve artifact snapshot\n')
          end = text.find('      - name: Upload benchmark evidence, exact prompts, registries, state ledgers, and chronicles\n')
          if start < 0 or end <= start:
              raise SystemExit('consolidation README gate boundary missing')
          replacement = '''      - name: Validate committed README evidence and preserve current-head rendering
        run: |
          grep -q "AURA_ARCHITECT_PLANNING_BENCHMARK:START" README.md
          grep -q "168,569" README.md
          grep -q "18 attempted, 18 recorded, 0 failed" README.md
          grep -q "AURA_REAL_REFACTOR_TRIAL:START" README.md
          grep -q "Benchmark quality: **93.50**" README.md
          python scripts/update_architect_benchmark_readme.py \\
            --planning-report benchmark-output/architect_consolidation_benchmark.json \\
            --output benchmark-output/README.current-head.md
          test -s benchmark-output/README.current-head.md
'''
          workflow.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          report = Path('aura_architect_benchmark_report.py')
          text = report.read_text(encoding='utf-8')
          old = '''            "statement": (
                "Architect Council normalization did not preserve submitted plan-level fields: "
                + (", ".join(lost_fields) if lost_fields else "none")
                + "."
            ),'''
          new = '''            "statement": (
                (
                    "Architect Council normalization did not preserve submitted plan-level fields: "
                    + ", ".join(lost_fields)
                    + "."
                )
                if lost_fields
                else (
                    "Architect Council normalization preserved every submitted "
                    "plan-level governance field."
                )
            ),'''
          if old not in text:
              raise SystemExit('report contract statement anchor missing')
          text = text.replace(old, new, 1)
          old = '''        + " The run also exposed contract-preservation and routing defects that must be repaired "
        "before claiming general architectural superiority. This is reproducible pilot evidence, "
        "not proof that Aura is revolutionary, generally superior, conscious, or production-ready."'''
          new = '''        + (
            " The run still exposed contract-preservation or routing defects that require repair. "
            if lost_fields
            else (
                " The repaired Council preserved the submitted governance contract; "
                "remaining route findings stay explicit. "
            )
        )
        + (
            "Before claiming general architectural superiority, those route findings and "
            "execution limits must remain visible. This is reproducible pilot evidence, "
        )
        + (
            "not proof that Aura is revolutionary, generally superior, conscious, or "
            "production-ready."
        )'''
          if old not in text:
              raise SystemExit('report interpretation anchor missing')
          report.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q "168,569" README.md
          grep -q "18 attempted, 18 recorded, 0 failed" README.md
          grep -q "Benchmark quality: **93.50**" README.md
          python -m py_compile aura_architect_benchmark_report.py scripts/update_architect_benchmark_readme.py
          rm -f .github/workflows/pr131-sync-final-benchmark-readme.yml
      - name: Enforce generated-output exclusion invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_codebase_navigator.py")
          text = path.read_text(encoding="utf-8")
          old = "GENERATED_MAP_FILES = {DEFAULT_INDEX_PATH.as_posix(), DEFAULT_MARKDOWN_PATH.as_posix()}"
          new = "GENERATED_MAP_FILES = {DEFAULT_INDEX_PATH.as_posix(), DEFAULT_MARKDOWN_PATH.as_posix(), \"topology_map.json\"}"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected GENERATED_MAP_FILES contract")
          PY
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(".aura/CODEMAP.json").read_text(encoding="utf-8"))
          paths = set(payload.get("coverage", {}).get("all_included_paths_sorted", []))
          assert "topology_map.json" not in paths
          excluded = set(payload.get("coverage", {}).get("excluded_generated_map_files", []))
          assert "topology_map.json" in excluded
          PY
      - name: Restore workflow and commit synchronized evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git show "${GITHUB_SHA}^:.github/workflows/sync-analysis-codemap.yml" > .github/workflows/sync-analysis-codemap.yml
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            README.md \
            aura_architect_benchmark_report.py \
            aura_codebase_navigator.py \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            .github/workflows/architect-consolidation-benchmark.yml \
            .github/workflows/sync-analysis-codemap.yml
          git add -u .github/workflows/pr131-sync-final-benchmark-readme.yml
          git commit -m "docs(benchmark): publish final verified evidence"
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" analysis/architect-benchmark
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:analysis/architect-benchmark
