name: SCO Phase 2 CodeRabbit Finalization

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sco-phase2-publish-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'refactor/sco-construction-e4-e6'
    uses: ./.github/workflows/sco-phase2-finalize.yml
    secrets: inherit
