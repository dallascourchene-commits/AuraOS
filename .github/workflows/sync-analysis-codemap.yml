name: SCO Phase 2 Focused Test Diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: sco-phase2-focused-diagnostic-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'refactor/sco-construction-e4-e6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Materialize and apply reviewed repairs
        run: |
          python3 tools/sco_phase2_materialize.py
          python3 tools/sco_phase2_transformer_preflight.py
          python3 tools/sco_phase2_apply_review_fixes.py
          python3 -m py_compile aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py
      - name: Install focused test runner
        run: python3 -m pip install -q pytest==8.4.1
      - name: Run focused Construction tests
        run: |
          python3 -m pytest -q \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
