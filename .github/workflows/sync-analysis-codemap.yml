name: PR240 Codex Final Verification

on:
  pull_request:
  push:
    branches:
      - analysis/bilateral-intent-final-b11-b15

permissions:
  contents: write

concurrency:
  group: pr240-codex-final-verification
  cancel-in-progress: false

jobs:
  verify-clean-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch exact PR head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema ruff pyyaml

      - name: Run focused Codex verification
        id: verify
        shell: bash
        run: |
          set +e
          status=0
          python -m py_compile \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py || status=$?
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py || status=$?
          python -m pytest -q \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py \
            tests/test_aura_showcase_attempt_archive.py || status=$?
          node --check aura_showcase/live-repair-foundry.js || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore canonical workflow, remove verifier, and synchronize maps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        shell: bash
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/sync-analysis-codemap.yml \
            > .github/workflows/sync-analysis-codemap.yml
          rm -f .github/workflows/pr240-codex-final-verify.yml
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check
          git config user.name "AuraOS PR240 Verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if [ "${VERIFY_STATUS:-1}" = "0" ]; then
            message="test: verify PR240 Codex repairs passed"
          else
            message="test: verify PR240 Codex repairs failed"
          fi
          git commit -m "$message"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:analysis/bilateral-intent-final-b11-b15
          unset AUTH_HEADER

      - name: Enforce verification result
        if: always()
        env:
          VERIFY_STATUS: ${{ steps.verify.outputs.status }}
        run: test "${VERIFY_STATUS:-1}" = "0"
