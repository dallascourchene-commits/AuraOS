name: Synchronize CODEMAP on analysis branches

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || startsWith(github.event.pull_request.head.ref, 'analysis/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Enforce generated-output exclusion invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_codebase_navigator.py")
          text = path.read_text(encoding="utf-8")
          old = "GENERATED_MAP_FILES = {DEFAULT_INDEX_PATH.as_posix(), DEFAULT_MARKDOWN_PATH.as_posix()}"
          new = "GENERATED_MAP_FILES = {DEFAULT_INDEX_PATH.as_posix(), DEFAULT_MARKDOWN_PATH.as_posix(), \"topology_map.json\"}"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected GENERATED_MAP_FILES contract")
          PY
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path(".aura/CODEMAP.json").read_text(encoding="utf-8"))
          paths = set(payload.get("coverage", {}).get("all_included_paths_sorted", []))
          assert "topology_map.json" not in paths
          excluded = set(payload.get("coverage", {}).get("excluded_generated_map_files", []))
          assert "topology_map.json" in excluded
          PY
      - name: Commit navigator invariant and synchronized maps
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_codebase_navigator.py .aura/CODEMAP.json .aura/CODEMAP.md
          if git diff --cached --quiet; then
            echo "Navigator and CODEMAP are already synchronized."
            exit 0
          fi
          git commit -m "fix: exclude generated topology map from CODEMAP"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
