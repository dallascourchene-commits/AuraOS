name: Synchronize CODEMAP on analysis branches

on:
  push:
    branches:
      - "analysis/**"
    paths-ignore:
      - ".aura/CODEMAP.json"
      - ".aura/CODEMAP.md"
      - "topology_map.json"

permissions:
  contents: write

concurrency:
  group: sync-analysis-codemap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-codemap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
      - name: Commit synchronized navigation artifacts
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          if git diff --cached --quiet; then
            echo "CODEMAP is already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize CODEMAP for analysis branch"
          git push origin HEAD:${{ github.ref_name }}
