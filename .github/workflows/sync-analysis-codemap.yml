name: Finalize combined Spatial S5/S6 artifacts

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: finalize-spatial-s5-s6-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-combined-spatial-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/spatial-s4b-gaussian-security'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy

      - name: Restore permanent workflows and remove staging material
        run: |
          set -euo pipefail
          cp .aura/tmp/final-spatial-workflow.yml .github/workflows/aura-spatial-s5-s6-construction.yml
          cp .aura/tmp/final-sync-analysis-codemap.yml .github/workflows/sync-analysis-codemap.yml
          rm .aura/tmp/final-spatial-workflow.yml
          rm .aura/tmp/final-sync-analysis-codemap.yml
          rm -f .github/workflows/aura-spatial-reconcile-temp.yml

      - name: Regenerate and verify CODEMAP and topology
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json

      - name: Compile and lint combined permanent surface
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py
          python -m ruff check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py
          python -m ruff format --check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py

      - name: Validate route and retained regressions
        run: |
          set -euo pipefail
          python aura_spatial_cli.py --repo-root . validate-route
          python -m pytest -q --tb=short tests/test_aura_spatial*.py
          python -m pytest -q --tb=short tests/test_aura_construction*.py
          python -m pytest -q --tb=short \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_agent_arena_github_bridge.py
          npm run test:spatial

      - name: Commit clean verified combined tree
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test ! -e .aura/tmp/final-spatial-workflow.yml
          test ! -e .aura/tmp/final-sync-analysis-codemap.yml
          test ! -e .github/workflows/aura-spatial-reconcile-temp.yml
          git diff --cached --check
          git commit -m "chore: finalize combined Spatial S5/S6 artifacts"
          git push origin HEAD:"$TARGET_BRANCH"
