name: Publish Construction G7-G8 Waboose fixes

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-waboose-fixes.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-waboose-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r requirements.txt
          python -m pip install -q --disable-pip-version-check bandit defusedxml jsonschema pytest ruff

      - name: Apply security and bootstrap corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact source span, observed {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          prepare = Path("scripts/aura_prepare_construction_demo_assets_core.py")
          text = prepare.read_text(encoding="utf-8")
          text = text.replace(
              "from aura_construction_demo_contracts import ConstructionDemoSourceManifest\n",
              "from aura_construction_demo_contracts import ConstructionDemoSourceManifest  # noqa: E402\n",
              1,
          ).replace(
              "from aura_event_contracts import stable_digest\n",
              "from aura_event_contracts import stable_digest  # noqa: E402\n",
              1,
          ).replace(
              "from scripts.aura_mesh_to_gaussian import (\n",
              "from scripts.aura_mesh_to_gaussian import (  # noqa: E402\n",
              1,
          ).replace(
              "from scripts.aura_verify_construction_demo_assets import (\n",
              "from scripts.aura_verify_construction_demo_assets import (  # noqa: E402\n",
              1,
          )
          prepare.write_text(text, encoding="utf-8")

          verifier = Path("scripts/aura_verify_construction_demo_assets.py")
          text = verifier.read_text(encoding="utf-8")
          text = text.replace("import re\n", "import re\nimport shutil\n", 1)
          text = text.replace(
              "import xml.etree.ElementTree as ET\n",
              "from defusedxml import ElementTree as ET\n",
              1,
          )
          text = text.replace(
              "from aura_event_contracts import stable_digest\n",
              "from aura_event_contracts import stable_digest  # noqa: E402\n",
              1,
          )
          verifier.write_text(text, encoding="utf-8")

          replace_once(
              "scripts/aura_verify_construction_demo_assets.py",
              '''    if env:\n        for key, value in env.items():\n            if type(key) is not str or type(value) is not str or "\\x00" in key + value:\n                raise ValueError("command environment must contain bounded strings")\n            merged_env[key] = value\n\n    started = time.monotonic()\n    process = subprocess.Popen(\n        list(command),\n''',
              '''    if env:\n        for key, value in env.items():\n            if type(key) is not str or type(value) is not str or "\\x00" in key + value:\n                raise ValueError("command environment must contain bounded strings")\n            merged_env[key] = value\n\n    requested_executable = Path(command[0]).expanduser()\n    if requested_executable.is_absolute():\n        executable = requested_executable.resolve(strict=True)\n    else:\n        discovered = shutil.which(command[0], path=merged_env["PATH"])\n        if not discovered:\n            raise FileNotFoundError(f"command executable is unavailable: {command[0]}")\n        executable = Path(discovered).resolve(strict=True)\n    argv = [str(executable), *command[1:]]\n\n    started = time.monotonic()\n    process = subprocess.Popen(  # nosec B603 - argv is sequence-only and executable is resolved\n        argv,\n''',
          )
          replace_once(
              "scripts/aura_verify_construction_demo_assets.py",
              "        command=tuple(command),\n",
              "        command=tuple(argv),\n",
          )

          replace_once(
              "aura_spatial_cli.py",
              '''def _head(root: Path) -> str:\n    result = subprocess.run(\n        ["git", "rev-parse", "HEAD"],\n''',
              '''def _head(root: Path) -> str:\n    git_executable = shutil.which("git")\n    if not git_executable:\n        return "0" * 40\n    result = subprocess.run(  # nosec B603 - fixed arguments and resolved executable\n        [git_executable, "rev-parse", "HEAD"],\n''',
          )

          projection = Path("aura_construction_demo_projection.py")
          text = projection.read_text(encoding="utf-8")
          text = text.replace(
              '            "mesh_pass": True,\n',
              '            "mesh_pass": True,  # nosec B105 - capability flag, not a credential\n',
              1,
          ).replace(
              '            "degree_zero_gaussian_pass": True,\n',
              '            "degree_zero_gaussian_pass": True,  # nosec B105 - capability flag\n',
              1,
          )
          projection.write_text(text, encoding="utf-8")
          PY

      - name: Apply Ruff safe fixes and formatting
        run: |
          ruff check --fix \
            aura_construction_demo_contracts.py \
            aura_construction_demo_director.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py
          ruff format \
            aura_construction_demo_contracts.py \
            aura_construction_demo_director.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py

      - name: Verify static and security tools
        run: |
          python -m py_compile \
            aura_construction_demo_contracts.py \
            aura_construction_demo_director.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py
          ruff check \
            aura_construction_demo_contracts.py \
            aura_construction_demo_director.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py
          bandit -q -ll \
            aura_construction_demo_contracts.py \
            aura_construction_demo_director.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py

      - name: Verify focused Python regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py

      - name: Verify retained browser regressions
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --check aura_spatial_web/construction_mesh_pass.js
          node --check aura_spatial_web/construction_overlay_pass.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/gaussian_renderer.js
          node --check aura_spatial_web/webgl2_gaussian_pass.js
          node --test tests/js/spatial-construction-demo.test.mjs
          node --test tests/js/spatial-construction-review-regressions.test.mjs
          node --test tests/js/spatial-gaussian-covariance.test.mjs

      - name: Remove temporary Waboose workflows
        run: |
          git rm -f \
            .github/workflows/aura-construction-g7-g8-waboose.yml \
            .github/workflows/aura-construction-g7-g8-waboose-fixes.yml

      - name: Commit and publish verified Waboose fixes
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Waboose Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(g8): apply Waboose security and lint findings"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
