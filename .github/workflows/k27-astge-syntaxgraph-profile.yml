name: K27 ASTGE SyntaxGraph Profile Contract

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-syntax-profile/**"
      - ".github/workflows/k27-astge-syntaxgraph-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntaxgraph-profile:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Run SyntaxGraph identity contract
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --manifest-path crates/aura-k27-astge-syntax-profile/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-syntax-profile/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-syntax-profile/Cargo.toml --all-targets -- -D warnings
      - name: Emit claim ceiling
        shell: bash
        run: |
          echo "SYNTAX_GRAPH_PROFILE_CONTRACT_EXECUTED=true"
          echo "GRAMMAR_IDENTITY_REQUIRED=true"
          echo "NORMALIZATION_PROFILE_REQUIRED=true"
          echo "STORAGE_LOCAL_NODE_ID_IS_SEMANTIC_ID=false"
          echo "LANGUAGE_NEUTRAL_AST_SEMANTICS_PROVEN=false"
          echo "SYMBOL_GRAPH_PROVEN=false"
          echo "CALL_GRAPH_PROVEN=false"
          echo "SEMANTIC_K27_DERIVED=false"
          echo "AURAOS_RUNTIME_INTEGRATION_PROVEN=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
