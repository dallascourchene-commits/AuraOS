name: Clean Paper VIII lineage wording

on:
  push:
    branches: [main]
    paths: [.github/workflows/clean-paper-viii-lineage-temp.yml]

permissions:
  contents: write

jobs:
  clean-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete interim-paper wording
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "AuraOS maintains an eight-paper defensive prior-art stack. Papers I–VII establish the original conceptual lineage and claims N1–N30. "
              "**Paper VIII is the canonical continuation**, replacing the two unreleased interim N31–N41 manuscripts and establishing claims N31–N50 for "
              "evidence-ordered relational Arenas, compiled relationship intelligence, verified engineering, governed spatial projection, exact-state continuity, and atomic publication."
          )
          new = (
              "AuraOS maintains an eight-paper defensive prior-art stack. Papers I–VII establish the original conceptual lineage and claims N1–N30. "
              "**Paper VIII is the canonical continuation**, establishing claims N31–N50 for evidence-ordered relational Arenas, compiled relationship intelligence, "
              "verified engineering, governed spatial projection, exact-state continuity, and atomic publication."
          )
          if old not in text:
              raise SystemExit("Expected Paper VIII lineage sentence was not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/clean-paper-viii-lineage-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: remove superseded Paper VIII draft wording [skip ci]"
          git push origin HEAD:main
