name: P6.2 QDKT compatibility inventory

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p6-2-qdkt-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  focused-qdkt-compatibility:
    name: QDKT compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "pytest>=8.0,<9.0" \
            "ruff>=0.9,<1.0"
      - name: Compile legacy, P6.1, and P6.2 surfaces
        run: |
          python -m py_compile \
            quantum_dag.py \
            aura_event_contracts.py \
            aura_qdkt_observations.py \
            aura_qdkt_projection_types.py \
            aura_qdkt_projection_io.py \
            aura_qdkt_projection.py \
            aura_qdkt_compatibility_types.py \
            aura_qdkt_inventory.py \
            aura_qdkt_compatibility.py \
            tests/test_aura_qdkt_observations.py \
            tests/test_aura_qdkt_event_recording.py \
            tests/test_aura_qdkt_projection_core.py \
            tests/test_aura_qdkt_projection_hardening.py \
            tests/test_aura_qdkt_inventory.py \
            tests/test_aura_qdkt_compatibility.py \
            tests/test_aura_qdkt_compatibility_hardening.py
      - name: Fatal and static correctness lint
        run: |
          ruff check --select E4,E7,E9,F --ignore E721 \
            aura_qdkt_compatibility_types.py \
            aura_qdkt_inventory.py \
            aura_qdkt_compatibility.py \
            tests/test_aura_qdkt_inventory.py \
            tests/test_aura_qdkt_compatibility.py \
            tests/test_aura_qdkt_compatibility_hardening.py
      - name: Generate deterministic current-use inventory
        run: |
          python aura_qdkt_inventory.py \
            --root . \
            --output "qdkt-p6-2-inventory-${{ matrix.python-version }}.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_event_contracts import canonical_json

          files = tuple(Path('.').glob('qdkt-p6-2-inventory-*.json'))
          assert len(files) == 1
          text = files[0].read_text(encoding='utf-8')
          payload = json.loads(text)
          assert text == canonical_json(payload) + '\n'
          assert payload['version'] == 'AURA_QDKT_INVENTORY_P6_2'
          assert payload['entries']
          assert payload['scanned_files'] > 0
          assert 0 <= payload['ignored_files'] <= payload['scanned_files']
          ids = [item['entry_id'] for item in payload['entries']]
          assert len(ids) == len(set(ids))
          sort_keys = [
              (
                  item['file_path'],
                  item['line'],
                  item['use_class'],
                  item['symbol'],
                  item['entry_id'],
              )
              for item in payload['entries']
          ]
          assert sort_keys == sorted(sort_keys)
          assert all(
              not Path(item['file_path']).name.startswith('qdkt-p6-2-inventory')
              for item in payload['entries']
          )
          PY
      - name: Upload deterministic inventory
        uses: actions/upload-artifact@v4
        with:
          name: qdkt-p6-2-inventory-${{ matrix.python-version }}
          path: qdkt-p6-2-inventory-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Run focused and prior-contract regression matrix
        id: focused-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_qdkt_inventory.py \
            tests/test_aura_qdkt_compatibility.py \
            tests/test_aura_qdkt_compatibility_hardening.py \
            tests/test_aura_qdkt_observations.py \
            tests/test_aura_qdkt_event_recording.py \
            tests/test_aura_qdkt_projection_core.py \
            tests/test_aura_qdkt_projection_hardening.py \
            tests/test_aura_event_contracts.py \
            tests/test_aura_planning_events.py \
            tests/test_aura_planning_projector.py \
            tests/test_aura_planning_projector_hardening.py \
            tests/test_aura_planning_projector_jsonl.py \
            > "p6-2-pytest-${{ matrix.python-version }}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "p6-2-pytest-${{ matrix.python-version }}.txt"
          exit 0
      - name: Upload diagnostics on failure
        if: steps.focused-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: p6-2-pytest-${{ matrix.python-version }}
          path: p6-2-pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce focused test result
        if: steps.focused-tests.outputs.status != '0'
        run: exit 1
