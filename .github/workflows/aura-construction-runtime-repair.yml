name: Aura Construction runtime repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-construction-runtime-repair.yml"
      - "tools/construction_runtime_repair/apply_runtime_repair.py"
      - "aura_spatial_web/construction_wireframe_pass.js"

permissions:
  contents: write

concurrency:
  group: aura-construction-runtime-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build isolated runtimes
        run: |
          python -m venv /tmp/aura-construction-venv
          source /tmp/aura-construction-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
          mkdir -p /tmp/aura-playwright /tmp/aura-construction-runtime
          cd /tmp/aura-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Apply bounded runtime repair
        run: python tools/construction_runtime_repair/apply_runtime_repair.py

      - name: Verify syntax and retained contracts
        run: |
          source /tmp/aura-construction-venv/bin/activate
          python -m py_compile aura_construction_demo_director.py aura_spatial_cli.py
          ruff check aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py
          node --check aura_spatial_web/gaussian_renderer.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/construction_wireframe_pass.js
          node --check aura_spatial_web/construction_demo_app.js
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_spatial_render_plan.py
          git diff --check

      - name: Start repaired Construction server
        run: |
          source /tmp/aura-construction-venv/bin/activate
          python aura_spatial_cli.py \
            --repo-root . \
            construction-video-demo \
            --tour full \
            --host 127.0.0.1 \
            --port 8767 \
            --serve \
            > /tmp/aura-construction-runtime/server.log 2>&1 &
          echo $! > /tmp/aura-construction-runtime/server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8767/api/construction-demo >/tmp/aura-construction-runtime/packet.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aura-construction-runtime/server.log
          exit 1

      - name: Prove repaired browser end to end
        env:
          NODE_PATH: /tmp/aura-playwright/node_modules
          AURA_CONSTRUCTION_DEMO_URL: http://127.0.0.1:8767/demo/construction
          AURA_RUNTIME_EVIDENCE_DIR: /tmp/aura-construction-runtime
        run: node tests/runtime/construction_demo_browser_probe.cjs

      - name: Stop local server
        if: always()
        run: |
          if test -f /tmp/aura-construction-runtime/server.pid; then
            kill "$(cat /tmp/aura-construction-runtime/server.pid)" || true
          fi

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-runtime-repair-evidence
          path: /tmp/aura-construction-runtime
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time repair machinery
        run: |
          git rm -rf \
            .github/workflows/aura-construction-runtime-repair.yml \
            tools/construction_runtime_repair

      - name: Publish verified repair
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Runtime Harness"
          git config user.email "aura-runtime-harness@users.noreply.github.com"
          git add -A
          git commit -m "fix(construction): restore live map and representation controls"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
