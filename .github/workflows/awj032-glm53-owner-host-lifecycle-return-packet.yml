name: AWJ032 GLM53 Owner Host Lifecycle Return Packet

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-return-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact pull-request head without submodule traversal
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Prove C2 parent and lifecycle return contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m py_compile \
            tools/awj032/glm53_owner_host_c2_handoff.py \
            tools/awj032/glm53_owner_host_lifecycle_return_packet.py
          python3 -m unittest -v \
            tools.awj032.test_glm53_owner_host_c2_handoff \
            tools.awj032.test_glm53_owner_host_lifecycle_return_packet
      - name: Assert metric ownership and nonpromotion ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import dataclasses
          import inspect
          from tools.awj032.glm53_owner_host_lifecycle_return_packet import (
              OwnerHostLifecycleReturnPacket,
              REQUIRED_PRODUCER_LIFECYCLE_METRICS,
              build_owner_host_lifecycle_return_packet,
          )

          params = set(inspect.signature(build_owner_host_lifecycle_return_packet).parameters)
          assert params == {"request", "receipt", "join"}
          packet_fields = {field.name for field in dataclasses.fields(OwnerHostLifecycleReturnPacket)}
          assert packet_fields.isdisjoint(REQUIRED_PRODUCER_LIFECYCLE_METRICS)
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["lifecycle_metric_vector_supplied_by_this_packet"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["physical_io_attested_by_this_packet"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["producer_authenticated_by_this_packet"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["lifecycle_registry_verified_by_this_packet"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["real_w4_policy_winner_proven"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["full_model_runtime_proven"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["quality_proven"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["g2_admitted"].default is False
          assert OwnerHostLifecycleReturnPacket.__dataclass_fields__["effect_authority_proven"].default is False
          print("C2_TO_W4_RETURN_IDENTITY_BOUND=true")
          print("LIFECYCLE_METRIC_VECTOR_SUPPLIED=false")
          print("PHYSICAL_IO_ATTESTED=false")
          print("PRODUCER_AUTHENTICATED=false")
          print("LIFECYCLE_REGISTRY_VERIFIED=false")
          print("REAL_W4_POLICY_WINNER_PROVEN=false")
          print("FULL_MODEL_RUNTIME_PROVEN=false")
          print("G2_ADMITTED=false")
          PY
