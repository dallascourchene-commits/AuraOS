name: Project006 O15 Workcell Effect Fault Bridge Proof
on:
  pull_request:
    paths:
      - "tools/project006/o15_fault_injection_bridge.py"
      - ".github/workflows/project006-o15-workcell-effect-fault-proof.yml"
permissions:
  contents: read
jobs:
  exact-three-venv-fault-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checkout and frozen source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(sha256sum tools/project006/o15_fault_injection_bridge.py | awk '{print $1}')" = "8969a8633e9cc2824b97241236b893c992e9d441f69e664ef371998c0f55da82"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Three fresh venv fault campaigns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-out
          for i in 1 2 3; do
            rm -rf ".venv-o15-$i"
            python -m venv ".venv-o15-$i"
            PY=".venv-o15-$i/bin/python"
            PYTHONPATH=. "$PY" -m tools.project006.o15_fault_injection_bridge test
            for mode in campaign fault_matrix omega8 13d hs1000; do
              PYTHONPATH=. "$PY" -m tools.project006.o15_fault_injection_bridge "$mode" > "proof-out/$mode-$i.json"
            done
          done
          for mode in campaign fault_matrix omega8 13d hs1000; do
            cmp "proof-out/$mode-1.json" "proof-out/$mode-2.json"
            cmp "proof-out/$mode-1.json" "proof-out/$mode-3.json"
          done
          python - <<'PY'
          import json
          c=json.load(open('proof-out/campaign-1.json'))
          f=json.load(open('proof-out/fault_matrix-1.json'))
          o=json.load(open('proof-out/omega8-1.json'))
          d=json.load(open('proof-out/13d-1.json'))
          h=json.load(open('proof-out/hs1000-1.json'))
          assert c['cases']==30000 and c['oracle_mismatches']==0 and c['unsafe_replay_decisions']==0 and c['authority_minted']==0
          assert f['cases']==60 and f['duplicate_provider_effects']==0 and f['accepted_effects_left_unresolved']==0
          assert o['states']==6561 and o['keepers']==1 and o['hard_invalid_repairs']==0
          assert d['states']==1594323 and d['lawful_contexts']==243 and d['hard_invalid_context_repairs']==0
          assert h['raw_cells']==1000 and h['consequence_groups']==60 and h['claimed_breakthroughs']==0
          PY
