name: Aura WorkCapsule POST Higher-Owner Portable Continuity

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'tests/test_aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'scripts/aura_workcapsule_post_higher_owner_portable_continuity.py'
      - 'tests/test_aura_workcapsule_post_higher_owner_portable_continuity.py'
      - '.github/workflows/aura-workcapsule-post-higher-owner-portable-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-higher-owner-portable-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR541_SHA: 12e9d4ad114faa08230cbbffc2f8bea40e0a2bfe
    steps:
      - name: Fetch exact child head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR539 POST source-instance continuity
        run: |
          python3 -m py_compile scripts/aura_workcapsule_post_repair_source_projection_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_post_repair_source_projection_continuity

      - name: Fetch PR541 exact second artifact into isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr541
          git -C /tmp/pr541 init .
          git -C /tmp/pr541 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr541 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR541_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr541 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr541 rev-parse HEAD)" = "$PR541_SHA"
          test -z "$(git -C /tmp/pr541 config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR541 portable higher-owner chain and nested projection
        run: |
          cargo fmt --check --manifest-path /tmp/pr541/crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml --all-targets
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml --doc
          cargo clippy --manifest-path /tmp/pr541/crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml --all-targets -- -D warnings
          cargo fmt --check --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --all-targets
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --doc
          cargo clippy --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --all-targets -- -D warnings

      - name: Prove outer cross-runtime schema agreement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rust = Path('/tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/src/lib.rs').read_text()
          py = Path('scripts/aura_workcapsule_post_higher_owner_portable_continuity.py').read_text()
          required = [
              'AURA_ASTGE_CANONICAL_HIGHER_OWNER_OWNER_CHAIN_PROJECTION_V1',
              'AURA_SERDE_JSON_STRUCT_ORDER_COMPACT_V1',
              'canonical_target_projection',
              'continuous_semantic_handle_digest_hex',
              'outer_constructor_reproved_by_inner_owner',
              'one_canonical_post_edit_consequence',
              'higher_owner_semantic_handle_continuity_proven',
              'producer_authenticated',
              'commit_authorized',
          ]
          for token in required:
              assert token in rust, token
              assert token in py, token
          assert 'producer_authenticated: false' in rust
          assert 'higher_owner_projection_producer_authenticated": False' in py
          print('PR541_SECOND_ARTIFACT_EXECUTED_AT_EXACT_SHA=true')
          print('PR541_SCHEMA_MATCHED_ACROSS_RUNTIME=true')
          print('SECOND_ARTIFACT_TREE_COPIED_INTO_CHILD=false')
          PY

      - name: Prove O17 shared-pivot continuity
        run: |
          python3 -m py_compile scripts/aura_workcapsule_post_higher_owner_portable_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_post_higher_owner_portable_continuity

      - name: Assert one nested projection and no lower-owner escape hatch
        run: |
          python3 - <<'PY'
          import inspect
          from pathlib import Path
          from scripts.aura_workcapsule_post_higher_owner_portable_continuity import verify_post_higher_owner_portable_continuity
          params = inspect.signature(verify_post_higher_owner_portable_continuity).parameters
          assert 'higher_owner_projection' in params
          for forbidden in ('astge_projection', 'canonical_target_projection', 'post_edit_witness', 'candidate_binding', 'observed_source_witnesses'):
              assert forbidden not in params, forbidden
          source = Path('scripts/aura_workcapsule_post_higher_owner_portable_continuity.py').read_text()
          assert 'verify_post_repair_source_projection_continuity' in source
          for forbidden in ('compile_source_reentry_observations', 'compile_observation_bound_reentry_closure', 'project_canonical_definition_target'):
              assert forbidden not in source, forbidden
          print('SECOND_CALLER_PROJECTION_SLOT=false')
          print('LOWER_OWNER_REIMPLEMENTED_BY_CHILD=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'POST_CLOSED_SOURCE_INSTANCE_BOUND=true'
          echo 'PORTABLE_HIGHER_OWNER_CHAIN_VERIFIED=true'
          echo 'SAME_NESTED_CANONICAL_TARGET_PROJECTION_REQUIRED=true'
          echo 'HIGHER_OWNER_HANDLE_CONTINUITY_REQUIRED=true'
          echo 'SECOND_CALLER_PROJECTION_SLOT=false'
          echo 'PROJECTION_PRODUCER_AUTHENTICATED=false'
          echo 'HIGHER_OWNER_PROJECTION_PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_REPAIR_CORRECTNESS_MINTED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_DEPENDENCY_CONE_PROVEN=false'
          echo 'RUNTIME_NAME_RESOLUTION_PROVEN=false'
          echo 'CALL_GRAPH_PROVEN=false'
          echo 'B_MINUS_APPROVED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
