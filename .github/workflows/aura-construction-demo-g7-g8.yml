name: Aura Construction Demo G7-G8

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g7-g8.yml"
      - "aura_construction_demo_director.py"
      - "aura_construction_demo_contracts.py"
      - "aura_construction_demo_fixture.py"
      - "aura_construction_demo_fixture_builder.py"
      - "aura_construction_demo_projection.py"
      - "aura_spatial_cli.py"
      - "aura_spatial_contracts.py"
      - "aura_spatial_render_plan.py"
      - "aura_spatial_web/construction_demo.html"
      - "aura_spatial_web/construction_demo.css"
      - "aura_spatial_web/construction_demo_app.js"
      - "aura_spatial_web/construction_mesh_pass.js"
      - "aura_spatial_web/construction_overlay_pass.js"
      - "aura_spatial_web/construction_scene_renderer.js"
      - "aura_spatial_web/gaussian_renderer.js"
      - "aura_spatial_web/webgl2_gaussian_pass.js"
      - "scripts/aura_architecture_harness.py"
      - "scripts/aura_architecture_harness_core.py"
      - "tests/test_aura_construction_demo_director.py"
      - "tests/test_aura_construction_demo_fixture.py"
      - "tests/test_aura_construction_demo_projection.py"
      - "tests/js/spatial-construction-demo.test.mjs"
      - "tests/js/spatial-construction-review-regressions.test.mjs"
      - "tests/js/spatial-gaussian-covariance.test.mjs"
      - "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md"
      - "README.md"
      - "USER_GUIDE.md"
      - ".aura/ARCHITECTURE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-construction-demo-g7-g8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-g7-g8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 256

      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/aura_g7_g8_status /tmp/aura_g7_g8_logs
          git rev-parse HEAD > /tmp/aura_g7_g8_exact_head.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pytest ruff zstandard

      - name: Compile, lint, and inspect source formatting
        run: |
          set +e
          status=0
          python -m py_compile \
            aura_construction_demo_director.py \
            aura_construction_demo_contracts.py \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            aura_spatial_cli.py \
            aura_spatial_contracts.py \
            aura_spatial_render_plan.py \
            tests/test_aura_construction_demo_director.py \
            > /tmp/aura_g7_g8_logs/static.txt 2>&1 || status=$?
          ruff check \
            aura_construction_demo_director.py \
            aura_spatial_cli.py \
            tests/test_aura_construction_demo_director.py \
            >> /tmp/aura_g7_g8_logs/static.txt 2>&1 || status=$?
          ruff format --check \
            aura_construction_demo_director.py \
            aura_spatial_cli.py \
            tests/test_aura_construction_demo_director.py \
            >> /tmp/aura_g7_g8_logs/static.txt 2>&1 || status=$?
          for file in \
            aura_spatial_web/construction_demo_app.js \
            aura_spatial_web/construction_mesh_pass.js \
            aura_spatial_web/construction_overlay_pass.js \
            aura_spatial_web/construction_scene_renderer.js \
            aura_spatial_web/gaussian_renderer.js \
            aura_spatial_web/webgl2_gaussian_pass.js \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs; do
            node --check "$file" >> /tmp/aura_g7_g8_logs/static.txt 2>&1 || status=$?
          done
          git diff --check >> /tmp/aura_g7_g8_logs/static.txt 2>&1 || status=$?
          echo "$status" > /tmp/aura_g7_g8_status/static.status
          cat /tmp/aura_g7_g8_logs/static.txt
          exit 0

      - name: Compile Aura-native architecture evidence
        run: |
          set +e
          python - <<'PY' > /tmp/aura_g7_g8_logs/architecture.txt 2>&1
          import json
          from pathlib import Path

          from aura_architect_council_v3 import route_compass_failure_classes
          from aura_coding_relationship_compass import compile_coding_relationship_compass
          from scripts.aura_architecture_harness import doctor

          root = Path.cwd()
          objective = (
              "Verify the final Construction Arena G7-G8 composition: deterministic director tours, "
              "G4 fixture and G5 scene ownership, G6 renderer reuse, offline local serving, bounded "
              "WebGL2 mesh and degree-zero Gaussian presentation, human-review-only alternatives, "
              "Observatory evidence, exact dissolution, documentation, and generated navigation duties"
          )
          try:
              compass = compile_coding_relationship_compass(
                  objective,
                  root,
                  target_files=(
                      "aura_construction_demo_director.py",
                      "aura_construction_demo_fixture_builder.py",
                      "aura_construction_demo_projection.py",
                      "aura_spatial_cli.py",
                      "aura_spatial_web/construction_demo_app.js",
                      "aura_spatial_web/construction_scene_renderer.js",
                      "aura_spatial_web/construction_overlay_pass.js",
                      "aura_spatial_web/gaussian_renderer.js",
                      "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
                  ),
                  target_symbols=(
                      "compile_construction_demo_packet",
                      "serve_construction_demo",
                      "build_construction_demo_project_fixture",
                      "project_construction_demo_to_scene",
                      "ConstructionSceneRenderer",
                      "ConstructionOverlayPass",
                      "GaussianRenderer",
                  ),
                  max_target_files=16,
                  max_target_symbols=24,
                  max_atomic_nodes=64,
                  max_atlas_participants=64,
                  max_atlas_assessments=160,
                  max_required_tests=40,
                  max_neighborhood_nodes=128,
                  max_neighborhood_edges=512,
                  max_neighborhood_candidate_pairs=4096,
                  include_source=False,
              )
              receipt = {
                  "status": "COMPILED",
                  "repository_head": compass.get("repository_head"),
                  "compass_digest": compass.get("compass_digest"),
                  "grounding_digest": compass.get("grounding_digest"),
                  "recommended_targets": compass.get("recommended_targets"),
                  "required_tests": compass.get("required_tests"),
                  "atlas": compass.get("atlas"),
                  "emergent_candidates": compass.get("emergent_candidates"),
                  "change_graph": compass.get("change_graph"),
                  "council_v3": route_compass_failure_classes(
                      ("INTERFACE", "INVARIANT", "AUTHORITY", "SEQUENCE", "LOCAL_TEST")
                  ),
                  "harness_doctor": doctor(root, None),
                  "safe_to_patch": compass.get("safe_to_patch", False),
                  "production_mutation": False,
                  "automatic_merge": False,
              }
          except Exception as exc:
              receipt = {
                  "status": "FAILED_CLOSED",
                  "error_type": type(exc).__name__,
                  "error": str(exc)[:4096],
                  "safe_to_patch": False,
                  "production_mutation": False,
                  "automatic_merge": False,
              }
          Path("/tmp/aura_g7_g8_architecture.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2, default=str), encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True, default=str))
          raise SystemExit(0 if receipt["status"] == "COMPILED" else 1)
          PY
          status=$?
          echo "$status" > /tmp/aura_g7_g8_status/architecture.status
          cat /tmp/aura_g7_g8_logs/architecture.txt
          exit 0

      - name: Run focused director and retained Construction verification
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_spatial_render_plan.py \
            > /tmp/aura_g7_g8_logs/python.txt 2>&1
          status=$?
          echo "$status" > /tmp/aura_g7_g8_status/python.status
          cat /tmp/aura_g7_g8_logs/python.txt
          exit 0

      - name: Run Construction browser and covariance regressions
        run: |
          set +e
          node --test \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs \
            > /tmp/aura_g7_g8_logs/browser.txt 2>&1
          status=$?
          echo "$status" > /tmp/aura_g7_g8_status/browser.status
          cat /tmp/aura_g7_g8_logs/browser.txt
          exit 0

      - name: Verify deterministic CLI packet and authority envelope
        run: |
          set +e
          python aura_spatial_cli.py --repo-root . construction-video-demo \
            --tour full --output /tmp/aura-construction-demo.packet.json \
            > /tmp/aura_g7_g8_logs/cli.txt 2>&1
          status=$?
          if test "$status" = "0"; then
            python - <<'PY' >> /tmp/aura_g7_g8_logs/cli.txt 2>&1 || status=$?
          import json
          from pathlib import Path
          packet = json.loads(Path("/tmp/aura-construction-demo.packet.json").read_text(encoding="utf-8"))
          assert packet["ok"] is True
          assert len(packet["tour_steps"]) == 18
          assert packet["tour_steps"][-1]["action"] == "DISSOLVE"
          for field in (
              "physical_work_authorized",
              "payment_released",
              "access_controlled",
              "professional_certification_claimed",
              "legal_or_regulatory_authority_claimed",
              "survey_authority_claimed",
              "renderer_authority",
              "automatic_execution",
              "automatic_merge",
          ):
              assert packet[field] is False, field
          assert packet["human_review_required"] is True
          print(packet["scene"]["scene_digest"])
          print(packet["render_plan"]["render_plan_digest"])
          PY
          fi
          echo "$status" > /tmp/aura_g7_g8_status/cli.status
          cat /tmp/aura_g7_g8_logs/cli.txt
          exit 0

      - name: Verify generated navigation state
        run: |
          set +e
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json \
            > /tmp/aura_g7_g8_logs/codemap.txt 2>&1
          status=$?
          echo "$status" > /tmp/aura_g7_g8_status/codemap.status
          cat /tmp/aura_g7_g8_logs/codemap.txt
          exit 0

      - name: Upload complete G7-G8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-g7-g8-diagnostics
          path: |
            /tmp/aura_g7_g8_architecture.json
            /tmp/aura_g7_g8_exact_head.txt
            /tmp/aura-construction-demo.packet.json
            /tmp/aura_g7_g8_logs
            /tmp/aura_g7_g8_status
          if-no-files-found: error
          retention-days: 7

      - name: Evaluate final focused gate
        if: always()
        run: |
          set -euo pipefail
          failed=0
          for status_file in /tmp/aura_g7_g8_status/*.status; do
            status="$(cat "$status_file")"
            printf '%s=%s\n' "$(basename "$status_file")" "$status"
            if test "$status" != "0"; then
              failed=1
            fi
          done
          exit "$failed"
