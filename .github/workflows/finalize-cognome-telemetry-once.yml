name: Finalize Cognome Telemetry Once

on:
  pull_request:
    paths:
      - ".github/workflows/finalize-cognome-telemetry-once.yml"
  push:
    branches:
      - refactor/model-cognome-telemetry
    paths:
      - ".github/workflows/finalize-cognome-telemetry-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone telemetry branch into workspace root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --depth 1 --branch refactor/model-cognome-telemetry \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling and declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest ruff
      - name: Finalize, validate, map, and create final branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/one_time_finalize_cognome_telemetry.py
