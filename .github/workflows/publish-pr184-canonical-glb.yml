name: Publish PR184 Canonical GLB Runtime Admission

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - ".aura/pr184-canonical-glb/trigger"

concurrency:
  group: publish-pr184-canonical-glb
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reassemble and authenticate exact manual patch
        run: |
          set -euo pipefail
          cat .aura/pr184-canonical-glb/chunk?? > "${RUNNER_TEMP}/canonical-glb.tar.gz.b64"
          base64 --decode "${RUNNER_TEMP}/canonical-glb.tar.gz.b64" \
            > "${RUNNER_TEMP}/canonical-glb.tar.gz"
          echo "7c80fafd1abaefd14f5d07233631e6fc85faa0c75d29e4e92444dd4b028c9435  ${RUNNER_TEMP}/canonical-glb.tar.gz" \
            | sha256sum --check --strict

      - name: Install allowlisted files safely
        env:
          ARCHIVE: ${{ runner.temp }}/canonical-glb.tar.gz
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          root = Path.cwd().resolve()
          expected = {
              "scripts/aura_mesh_to_gaussian.py",
              "scripts/aura_prepare_construction_demo_assets.py",
              "tests/test_aura_mesh_to_gaussian.py",
              "tests/test_aura_prepare_construction_demo_assets.py",
          }
          with tarfile.open(os.environ["ARCHIVE"], "r:gz") as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f"archive allowlist mismatch: {sorted(set(names) ^ expected)}")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member rejected: {member.name}")
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"unsafe archive path rejected: {member.name}")
                  destination = (root / Path(*pure.parts)).resolve(strict=False)
                  destination.relative_to(root)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member unreadable: {member.name}")
                  payload = source.read()
                  if len(payload) != member.size:
                      raise SystemExit(f"archive member length mismatch: {member.name}")
                  temporary = destination.with_name(f".{destination.name}.pr184.tmp")
                  temporary.write_bytes(payload)
                  os.replace(temporary, destination)
          PY

      - name: Install bounded validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "jsonschema>=4.23.0,<5.0" \
            "pytest>=8.2.0,<9.0" \
            "pytest-asyncio>=0.23.0,<1.0" \
            "ruff>=0.12.0,<1.0"

      - name: Compile and fatal-lint canonical GLB changes
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/aura_mesh_to_gaussian.py \
            scripts/aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_prepare_construction_demo_assets.py
          ruff check --select E9,F63,F7,F82 \
            scripts/aura_mesh_to_gaussian.py \
            scripts/aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_prepare_construction_demo_assets.py

      - name: Run complete Construction and resolver gate
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py

      - name: Upload authenticated validated source archive
        uses: actions/upload-artifact@v4
        with:
          name: pr184-canonical-glb-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-glb.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.actor != 'github-actions[bot]'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-real-asset-pack-g4-20260722
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: pr184-canonical-glb-${{ github.sha }}
          path: ${{ runner.temp }}/validated

      - name: Publish only the authenticated validated files
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARCHIVE: ${{ runner.temp }}/validated/canonical-glb.tar.gz
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_SHA}" HEAD
          echo "7c80fafd1abaefd14f5d07233631e6fc85faa0c75d29e4e92444dd4b028c9435  ${ARCHIVE}" \
            | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          root = Path.cwd().resolve()
          expected = {
              "scripts/aura_mesh_to_gaussian.py",
              "scripts/aura_prepare_construction_demo_assets.py",
              "tests/test_aura_mesh_to_gaussian.py",
              "tests/test_aura_prepare_construction_demo_assets.py",
          }
          with tarfile.open(os.environ["ARCHIVE"], "r:gz") as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit("validated archive allowlist mismatch")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member rejected: {member.name}")
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"unsafe archive path rejected: {member.name}")
                  destination = (root / Path(*pure.parts)).resolve(strict=False)
                  destination.relative_to(root)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member unreadable: {member.name}")
                  payload = source.read()
                  if len(payload) != member.size:
                      raise SystemExit(f"archive member length mismatch: {member.name}")
                  temporary = destination.with_name(f".{destination.name}.pr184.tmp")
                  temporary.write_bytes(payload)
                  os.replace(temporary, destination)
          PY
          rm -rf .aura/pr184-canonical-glb
          rm -f .github/workflows/publish-pr184-canonical-glb.yml
          git config user.name "AuraOS Construction Runtime Admission"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(construction): canonicalize GLB for runtime admission"
          git push origin HEAD:work/construction-arena-real-asset-pack-g4-20260722
