name: Refresh Cognome CODEMAP Once

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-cognome-codemap-once.yml"
  push:
    branches:
      - refactor/model-cognome-adaptive-router
    paths:
      - ".github/workflows/refresh-cognome-codemap-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf repo
          git clone --depth 1 --branch refactor/model-cognome-adaptive-router \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"

      - name: Regenerate and commit topology artifacts
        working-directory: repo
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .aura/CODEMAP.md .aura/CODEMAP.json topology_map.json
          if git diff --cached --quiet; then
            echo "CODEMAP artifacts are already current."
            exit 0
          fi
          git commit -m "chore(codemap): refresh Model Cognome topology"
          git push origin HEAD:refactor/model-cognome-adaptive-router
