name: K27 ASTGE Nested Scope Source Review

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-scope-review/**"
      - "crates/aura-k27-astge-scopes/**"
      - "crates/aura-k27-astge-source-review/**"
      - "tools/k27_astge_python_scope_oracle.py"
      - ".github/workflows/k27-astge-nested-scope-source-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-scope-source-review:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact candidate head without persisted credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Verify current toolchains
        shell: bash
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Verify both parent proof planes and composed membrane
        shell: bash
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-scopes/Cargo.toml -- --check
          cargo fmt --manifest-path crates/aura-k27-astge-source-review/Cargo.toml -- --check
          cargo fmt --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets
          python3 tools/k27_astge_python_scope_oracle.py
          cargo test --manifest-path crates/aura-k27-astge-source-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets

      - name: Fatal Clippy across composition cone
        shell: bash
        run: |
          cargo clippy --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge-source-review/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Emit claim ceiling
        shell: bash
        run: |
          echo "NESTED_SCOPE_SOURCE_REVIEW_EXECUTED=true"
          echo "PRE_EDIT_SCOPE_ANCHOR_CURRENT=true"
          echo "HIGHER_OWNER_AUTHORIZATION_REQUIRED=true"
          echo "AUTHORIZED_SPANS_CONFINED_TO_SELECTED_SCOPE=true"
          echo "DESCENDANT_SCOPES_PROTECTED=true"
          echo "DUPLICATE_SCOPE_NAME_SELECTED_BY_SCOPE_ID=true"
          echo "POST_EDIT_SCOPE_AST_CURRENTNESS_PROVEN=false"
          echo "RUNTIME_NAME_RESOLUTION_PROVEN=false"
          echo "SEMANTIC_PATCH_CORRECTNESS_PROVEN=false"
          echo "B_MINUS_APPROVED=false"
          echo "COMMIT_AUTHORIZED=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
          echo "COMPOSED_RUST_1_80_PROVEN=false"
