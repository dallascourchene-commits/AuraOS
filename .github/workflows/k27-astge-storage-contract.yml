name: K27 ASTGE Storage Kernel Contract

on:
  pull_request:
    paths:
      - "native/aura-k27-astge/**"
      - ".github/workflows/k27-astge-storage-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k27-astge-storage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format check
        run: cargo fmt --manifest-path native/aura-k27-astge/Cargo.toml -- --check

      - name: Compile and test storage contract
        run: cargo test --manifest-path native/aura-k27-astge/Cargo.toml --all-targets

      - name: Clippy fail-closed
        run: cargo clippy --manifest-path native/aura-k27-astge/Cargo.toml --all-targets -- -D warnings
