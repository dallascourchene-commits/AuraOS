name: P4.1 J2 continuity packet

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p4-1-j2-continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-j2-continuity:
    name: J2 continuity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff
      - name: Compile J2 continuity contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_jspace_codec.py \
            aura_arena_state_packet.py \
            aura_planning_board.py \
            aura_planning_projector.py \
            aura_continuity_packet.py \
            tests/test_aura_jspace_codec.py \
            tests/test_aura_arena_wfst_phase_a.py \
            tests/test_aura_continuity_packet.py \
            tests/test_aura_continuity_packet_digest_hardening.py \
            tests/test_aura_continuity_packet_merge_gate.py
      - name: Static correctness lint
        run: |
          # E721 is intentional where exact primitive types reject bool coercion.
          ruff check --select E4,E7,E9,F --ignore E721 \
            aura_continuity_packet.py \
            tests/test_aura_continuity_packet.py \
            tests/test_aura_continuity_packet_digest_hardening.py \
            tests/test_aura_continuity_packet_merge_gate.py
      - name: Run focused continuity tests
        id: focused-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_jspace_codec.py \
            tests/test_aura_arena_wfst_phase_a.py \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_projector.py \
            tests/test_aura_continuity_packet.py \
            tests/test_aura_continuity_packet_digest_hardening.py \
            tests/test_aura_continuity_packet_merge_gate.py \
            > "p4-1-pytest-${{ matrix.python-version }}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "p4-1-pytest-${{ matrix.python-version }}.txt"
          exit 0
      - name: Upload focused diagnostics on failure
        if: steps.focused-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: p4-1-pytest-${{ matrix.python-version }}
          path: p4-1-pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce focused test result
        if: steps.focused-tests.outputs.status != '0'
        run: exit 1
