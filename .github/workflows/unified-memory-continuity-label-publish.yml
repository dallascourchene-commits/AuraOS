name: Publish unified continuity patch by label

on:
  pull_request_target:
    branches:
      - main
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: umc-label-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 193 &&
      github.event.label.name == 'umc-verified-publish-66' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: refactor/unified-memory-continuity
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TRANSPORT_COMMIT: 1de0f438b330ef91bfc99cead2d288d003181e22
      EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-v2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report start
        shell: bash
        run: gh api repos/${{ github.repository }}/issues/193/comments -f body='Label-triggered verified continuity publication started on exact draft head `${{ github.event.pull_request.head.sha }}`.'

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run immutable 66-test publisher
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'umc_deep_review_v2_materialize.sh'
          text = path.read_text(encoding='utf-8')
          placeholder = "EXPECTED_HEAD='__EXPECTED_HEAD__'"
          replacement = f"EXPECTED_HEAD='{os.environ['EVENT_HEAD']}'"
          if text.count(placeholder) != 1:
              raise SystemExit('materializer expected-head placeholder is ambiguous')
          path.write_text(text.replace(placeholder, replacement, 1), encoding='utf-8')
          PY
          bash "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-label-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Report result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body='Label-triggered verified continuity publication succeeded: five bounded files passed 66 regressions, PVM hard gates, Ruff, Bandit, zero-finding Waboose, Architecture Harness, map regeneration, and atomic publication.'
          else
            body='Label-triggered verified continuity publication failed closed; no partial source commit was accepted.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
