name: Aura WorkCapsule Post-Repair Portable Higher-Owner Continuity

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_canonical_temporal_lifecycle_equivalence.py'
      - 'scripts/aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'scripts/aura_workcapsule_post_repair_portable_higher_owner_continuity.py'
      - 'tests/test_aura_workcapsule_canonical_temporal_lifecycle_equivalence.py'
      - 'tests/test_aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'tests/test_aura_workcapsule_post_repair_portable_higher_owner_continuity.py'
      - '.github/workflows/aura-workcapsule-post-repair-portable-higher-owner-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-higher-owner-post-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR539_SHA: a4faca716c83643eca1566df235b51affc1b6889
      PR541_SHA: 12e9d4ad114faa08230cbbffc2f8bea40e0a2bfe
    steps:
      - name: Fetch exact child ancestry without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=80 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          git merge-base --is-ancestor "$PR539_SHA" HEAD
          git merge-base --is-ancestor "$PR541_SHA" HEAD
          echo 'PR539_ANCESTOR_BOUND=true'
          echo 'PR541_ANCESTOR_BOUND=true'

      - name: Re-prove PR539 WorkCapsule POST source projection continuity
        run: |
          python3 -m py_compile scripts/aura_workcapsule_post_repair_source_projection_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_post_repair_source_projection_continuity

      - name: Fetch PR541 exact portable higher-owner owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr541
          git -C /tmp/pr541 init .
          git -C /tmp/pr541 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr541 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR541_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr541 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr541 rev-parse HEAD)" = "$PR541_SHA"
          test -z "$(git -C /tmp/pr541 config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR541 portable higher-owner projection
        run: |
          cargo fmt --check --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --all-targets
          cargo test --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --doc
          cargo clippy --manifest-path /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml --all-targets -- -D warnings

      - name: Prove Rust-Python portable owner-chain schema agreement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rust = Path('/tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/src/lib.rs').read_text()
          py = Path('scripts/aura_workcapsule_post_repair_portable_higher_owner_continuity.py').read_text()
          required = [
              'AURA_ASTGE_CANONICAL_HIGHER_OWNER_OWNER_CHAIN_PROJECTION_V1',
              'AURA_SERDE_JSON_STRUCT_ORDER_COMPACT_V1',
              'canonical_target_projection',
              'continuous_semantic_handle_digest_hex',
              'outer_constructor_reproved_by_inner_owner',
              'one_canonical_post_edit_consequence',
              'higher_owner_semantic_handle_continuity_proven',
              'producer_authenticated',
              'semantic_patch_correctness_proven',
              'commit_authorized',
          ]
          for token in required:
              assert token in rust, token
              assert token in py, token
          assert 'CanonicalDefinitionTargetProjectionV1' in rust
          assert 'verify_portable_canonical_target_projection' in py
          print('PR541_EXACT_OWNER_EXECUTED=true')
          print('PORTABLE_OWNER_CHAIN_SCHEMA_MATCHED_ACROSS_RUNTIME=true')
          PY

      - name: Prove same nested projection closes on exact POST source instance
        run: |
          python3 -m py_compile scripts/aura_workcapsule_post_repair_portable_higher_owner_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_post_repair_portable_higher_owner_continuity

      - name: Assert one outer projection boundary and no lower replay
        run: |
          python3 - <<'PY'
          import ast
          import inspect
          from pathlib import Path
          from scripts.aura_workcapsule_post_repair_portable_higher_owner_continuity import verify_post_repair_portable_higher_owner_continuity
          params = inspect.signature(verify_post_repair_portable_higher_owner_continuity).parameters
          assert 'higher_owner_projection' in params
          assert 'astge_projection' not in params
          assert 'canonical_target_projection' not in params
          source = Path('scripts/aura_workcapsule_post_repair_portable_higher_owner_continuity.py').read_text()
          assert 'aura_workcapsule_post_source_portable_higher_owner_continuity' in source
          tree = ast.parse(source)
          imported_modules = {
              node.module
              for node in ast.walk(tree)
              if isinstance(node, ast.ImportFrom) and node.module is not None
          }
          assert 'scripts.aura_workcapsule_post_repair_source_projection_continuity' not in imported_modules
          called_names = {
              node.func.attr if isinstance(node.func, ast.Attribute) else node.func.id
              for node in ast.walk(tree)
              if isinstance(node, ast.Call) and isinstance(node.func, (ast.Attribute, ast.Name))
          }
          for forbidden in ('verify_post_repair_source_projection_continuity', 'admit_post_repair_source_projection_continuity', 'compile_source_reentry_observations', 'compile_observation_bound_reentry_closure', 'derive_post_reentry_candidate'):
              assert forbidden not in called_names, forbidden
          print('ONE_OUTER_PORTABLE_PROJECTION_BOUNDARY=true')
          print('SECOND_CALLER_NESTED_PROJECTION_ACCEPTED=false')
          print('LOWER_WORKCAPSULE_REPLAY_REIMPLEMENTED=false')
          print('CANONICAL_OWNER_DELEGATION=true')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'POST_REPAIR_SOURCE_INSTANCE_CONTINUITY_PROVEN=true'
          echo 'PORTABLE_HIGHER_OWNER_CHAIN_VERIFIED=true'
          echo 'SAME_NESTED_CANONICAL_TARGET_PROJECTION_PROVEN=true'
          echo 'HIGHER_OWNER_SEMANTIC_HANDLE_CONTINUITY_PROVEN=true'
          echo 'PROJECTION_PRODUCER_AUTHENTICATED=false'
          echo 'HIGHER_OWNER_PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_REPAIR_CORRECTNESS_MINTED=false'
          echo 'RUNTIME_NAME_RESOLUTION_PROVEN=false'
          echo 'CALL_GRAPH_PROVEN=false'
          echo 'B_MINUS_APPROVED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
