name: P1.1 robust review repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 96 && github.event.pull_request.head.ref == 'refactor/relational-authority-p1-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relational-authority-p1-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install review tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Apply review repairs
        run: python .github/scripts/p1_1_review_repair.py

      - name: Validate syntax and fatal lint
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_relational_authority.py \
            aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py
          ruff check --select E9,F63,F7,F82 \
            aura_event_contracts.py \
            aura_relational_authority.py \
            aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py

      - name: Run focused and adversarial regressions
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py \
            tests/test_aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py

      - name: Commit reviewed source and regression tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aura_event_contracts.py \
            aura_relational_authority.py \
            aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py
          git commit -m "fix(governance): close adversarial authority bypasses"
          git fetch origin refactor/relational-authority-p1-1
          git rebase origin/refactor/relational-authority-p1-1
          git push origin HEAD:refactor/relational-authority-p1-1
