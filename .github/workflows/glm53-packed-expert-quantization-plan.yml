name: GLM53 Packed Expert Quantization Plan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q2-packed-expert-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Compile exact Q2 surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 -m py_compile \
            tools/quantization/aura_glm53_packed_expert_quantization_plan.py \
            tools/quantization/test_aura_glm53_packed_expert_quantization_plan.py

      - name: Run Q2 adversarial suite
        run: python3 -m unittest -v tools.quantization.test_aura_glm53_packed_expert_quantization_plan

      - name: Emit deterministic Q2 planning fixture
        run: python3 -m tools.quantization.aura_glm53_packed_expert_quantization_plan

      - name: Prove two non-self parent artifacts and consequence ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          from tools.quantization.aura_glm53_packed_expert_quantization_plan import (
              PACKED_EXPERT_ARTIFACT_ID,
              LIFECYCLE_POLICY_ARTIFACT_ID,
              build_packed_expert_quantization_plan,
          )
          assert PACKED_EXPERT_ARTIFACT_ID == '1xC6iwBv1EMxSLJW67otQFRUvF1PvhWVS04YRZG_4ZAk'
          assert LIFECYCLE_POLICY_ARTIFACT_ID == '1iN1n8pIfcRoOaXkVTuMcQJelY69MxXuirOPUJF_wcGQ'
          assert set(inspect.signature(build_packed_expert_quantization_plan).parameters) == {'request', 'representations'}
          print('EXPERT_AXIS_SLICEABLE_NE_QUANT_COMPANION_SLICEABLE=true')
          print('INDEXED_REPRESENTATION_REQUIRED=true')
          print('SELECTED_EXPERT_WORKING_SET_NE_FULL_MODEL_STATIC_STORAGE=true')
          print('WORKING_SET_FITS_BUDGET_NE_PERFORMANCE_SAFE=true')
          print('EXPERT_BIT_ALLOCATION_NE_EXPERT_QUALITY=true')
          print('PHYSICAL_IO_OBSERVED=false')
          print('MODEL_EXECUTION_PERFORMED=false')
          print('KV_CACHE_COMPRESSION_PROVEN=false')
          print('NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false')
          print('SEMANTIC_K27_AUTHORITY_MINTED=false')
          print('DEPLOYMENT_AUTHORIZED=false')
          PY
