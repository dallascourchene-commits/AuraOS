name: Aura Coordinate Memory Write Admission

on:
  pull_request:
    paths:
      - 'tools/aura_coordinate_memory_write_admission.py'
      - 'tests/test_aura_coordinate_memory_write_admission.py'
      - 'tools/aura_external_knowledge_coordinate_memory_candidate.py'
      - 'tests/test_aura_external_knowledge_coordinate_memory_candidate.py'
      - '.github/workflows/aura-coordinate-memory-write-admission.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONVERGENCE_COMMIT: 016001dbb1729a9c72f84f9c7082bd84dfe20e01
  CANDIDATE_HEAD: 89a66cdb972d3eab19c9408356b7061d1529947d
  CURRENTNESS_HEAD: 2a483a4232ce8745ee25e81246c39004ff28537e
  CANDIDATE_RUN_ID: '33417664825'
  CURRENTNESS_RUN_ID: '33336734334'
  STANDING_ROW_MEMBRANE_DRIVE_ID: 1eK7xQAP4RvT16AzgluJnC30tm2l68h646HQsH8P6hkE
  STANDING_ROW_MEMBRANE_REVISION: ANLCKQkpzlzv9nBfZkuWZcx4-MHMU7bVQDSaxPYiBfajWgOidkwUCc3tNgW-rFDkKAaGdm8dR1mMcBNUztJXLPUSL3hjzyjzEjv-VksRY8k

jobs:
  coordinate-memory-write-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate true two-parent convergence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONVERGENCE_COMMIT" HEAD
          parents="$(git show -s --format=%P "$CONVERGENCE_COMMIT")"
          test "$parents" = "$CANDIDATE_HEAD $CURRENTNESS_HEAD"
          test -f tools/aura_coordinate_memory_write_admission.py
          test -f tests/test_aura_coordinate_memory_write_admission.py
          echo 'CANDIDATE_X_CURRENTNESS_DIAMOND=true'
          echo "STANDING_ROW_MEMBRANE_COORDINATE=$STANDING_ROW_MEMBRANE_DRIVE_ID@$STANDING_ROW_MEMBRANE_REVISION"
          echo 'DRIVE_MEMBRANE_IS_SEMANTIC_INPUT_NOT_HOSTED_REVALIDATED=true'

      - name: Revalidate exact hosted producer generations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          for run_id, expected_head, label in (
              (os.environ['CANDIDATE_RUN_ID'], os.environ['CANDIDATE_HEAD'], 'COORDINATE_CANDIDATE'),
              (os.environ['CURRENTNESS_RUN_ID'], os.environ['CURRENTNESS_HEAD'], 'MATERIALIZATION_CURRENTNESS'),
          ):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
              assert data['head_sha'] == expected_head, (label, data['head_sha'], expected_head)
              assert data['status'] == 'completed', (label, data['status'])
              assert data['conclusion'] == 'success', (label, data['conclusion'])
              print(f'{label}_EXACT_HOSTED_SUCCESS=true')
          PY

      - name: Reexecute candidate parent contract
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_external_knowledge_coordinate_memory_candidate.py \
            tests/test_aura_external_knowledge_coordinate_memory_candidate.py
          python -m unittest tests.test_aura_external_knowledge_coordinate_memory_candidate -v

      - name: Reexecute currentness parent in its exact test-runtime world
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8.2,<9.0'
          tmp="$(mktemp -d)"
          trap 'git worktree remove --force "$tmp" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          git worktree add --detach "$tmp" "$CURRENTNESS_HEAD"
          (
            cd "$tmp"
            python -m py_compile aura_materialization_admission_currentness.py tests/test_aura_materialization_admission_currentness.py
            python -m pytest -q tests/test_aura_materialization_admission_currentness.py
          )
          echo 'PARENT_CONTRACT_EXECUTED_IN_OWNED_DEPENDENCY_WORLD=true'
          echo 'PARENT_TEST_RUNTIME_DEPENDENCIES_RECREATED=true'

      - name: Run write-admission adversarial contract
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_coordinate_memory_write_admission.py \
            tests/test_aura_coordinate_memory_write_admission.py
          python -m unittest tests.test_aura_coordinate_memory_write_admission -v

      - name: Independently prove insert noop and supersession hold
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_aura_coordinate_memory_write_admission import (
              admit, candidate, resolution_bundle, snapshot_bytes,
          )
          from tools.aura_coordinate_memory_write_admission import (
              SupersessionRelation, WriteAdmissionDisposition,
          )

          fresh = candidate()
          empty = snapshot_bytes([])
          expectation, evidence = resolution_bundle(cand=fresh, store_bytes=empty)
          insert = admit(fresh, empty, expectation=expectation, evidence=evidence)
          assert insert.disposition is WriteAdmissionDisposition.INSERT_NEW_PLAN
          assert insert.store_mutated is False
          assert insert.write_authority is False

          present = snapshot_bytes([fresh.proposed_row])
          expectation, evidence = resolution_bundle(
              cand=fresh,
              store_bytes=present,
              existing_generation=fresh.evidence_generation_key,
              relation=SupersessionRelation.IDENTICAL_GENERATION,
          )
          noop = admit(fresh, present, expectation=expectation, evidence=evidence)
          assert noop.disposition is WriteAdmissionDisposition.NOOP_IDENTICAL_PLAN
          assert noop.proposed_row is None

          old = candidate(rev='abc123', content='a'*64, verifier='v1')
          new = candidate(rev='def456', content='c'*64, verifier='v2')
          occupied = snapshot_bytes([old.proposed_row])
          expectation, evidence = resolution_bundle(
              cand=new,
              store_bytes=occupied,
              existing_generation=old.evidence_generation_key,
              relation=SupersessionRelation.PROPOSED_SUPERSEDES_EXISTING,
          )
          hold = admit(new, occupied, expectation=expectation, evidence=evidence)
          assert hold.disposition is WriteAdmissionDisposition.HOLD_SUPERSESSION_REPRESENTATION_REQUIRED
          assert hold.store_mutated is False
          assert hold.canonical_writer_missing is True
          print('INSERT_PLAN_WITHOUT_WRITE=true')
          print('IDENTICAL_GENERATION_NOOP=true')
          print('PROVED_SUPERSESSION_STILL_HELD_BY_V1_REPRESENTATION=true')
          PY

      - name: Consequence ceiling
        run: |
          echo 'TypedCallerClaim!=IndependentlyResolvedCurrentness'
          echo 'CandidateReady!=WriteEffectAuthority'
          echo 'StableSubjectKey!=EvidenceGenerationKey'
          echo 'DifferentEvidenceGeneration!=ChronologicalOrdering'
          echo 'ResolvedSupersession!=LosslessV1Representation'
          echo 'V1UniqueK+HistoricalSuccessorCannotRepresentOldAndNewSameStableK'
          echo 'K27Placement!=TemporalVersionIdentity'
          echo 'InsertPlan!=StoreMutation'
          echo 'NoopPlan!=Rewrite'
          echo 'SchemaPolicy!=MutationAuthority'
          echo 'OwnedDependencyWorldIncludesParentTestRuntimeDependencies'
          echo 'CanonicalWriterMissing=true'
          echo 'NativePrivateTransformerKVAccessed=false'
