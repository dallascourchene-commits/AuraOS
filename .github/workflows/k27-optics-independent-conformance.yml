name: K27 optics independent conformance

on:
  pull_request:
    paths:
      - "tools/k27_optics_candidate_falsifier.py"
      - "tools/k27_optics_independent_conformance.py"
      - "tests/test_k27_optics_independent_conformance.py"
      - ".github/workflows/k27-optics-independent-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent optics conformance matrix
        run: python -m unittest tests/test_k27_optics_independent_conformance.py -v
