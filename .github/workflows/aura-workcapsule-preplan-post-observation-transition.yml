name: Aura WorkCapsule PRE-Plan POST-Observation Transition

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_preplan_post_observation_transition.py'
      - 'scripts/aura_workcapsule_raw_owner_hold_to_closed_transition.py'
      - 'scripts/aura_workcapsule_observation_bound_closure.py'
      - 'tests/test_aura_workcapsule_preplan_post_observation_transition.py'
      - '.github/workflows/aura-workcapsule-preplan-post-observation-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR533_SHA: e09a1e85bfd8d601a1b4138b8ecf03c221123c2a
      PR516_SHA: 130a01e7e8109d8ce76b1b3210c830c45f0af719
      PR516_OBSERVATION_BLOB: a84f509f44a94d378a5285b0740e78d46c4555e6
    steps:
      - name: Fetch exact child ancestry without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=120 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          git merge-base --is-ancestor "$PR533_SHA" HEAD
          git merge-base --is-ancestor "$PR516_SHA" HEAD
          echo 'PR533_ANCESTOR_BOUND=true'
          echo 'PR516_ANCESTOR_BOUND=true'

      - name: Re-prove PR533 raw-owner HOLD-to-CLOSED transition
        run: |
          python3 -m py_compile scripts/aura_workcapsule_raw_owner_hold_to_closed_transition.py
          python3 -m unittest -v tests.test_aura_workcapsule_raw_owner_hold_to_closed_transition

      - name: Fetch exact PR516 observation-bound owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pr516
          mkdir -p /tmp/pr516
          git -C /tmp/pr516 init .
          git -C /tmp/pr516 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr516 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR516_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr516 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr516 rev-parse HEAD)" = "$PR516_SHA"
          test -z "$(git -C /tmp/pr516 config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR516 observation-bound closure
        run: |
          (cd /tmp/pr516 && python3 -m py_compile scripts/aura_workcapsule_observation_bound_closure.py)
          (cd /tmp/pr516 && python3 -m unittest -v tests.test_aura_workcapsule_observation_bound_closure)

      - name: Verify exact PR516 owner source is present
        run: |
          child_blob="$(git rev-parse HEAD:scripts/aura_workcapsule_observation_bound_closure.py)"
          owner_blob="$(git -C /tmp/pr516 rev-parse HEAD:scripts/aura_workcapsule_observation_bound_closure.py)"
          test "$child_blob" = "$owner_blob"
          test "$owner_blob" = "$PR516_OBSERVATION_BLOB"
          echo 'PR516_OBSERVATION_OWNER_BLOB_EXACT=true'

      - name: Prove O32 positive and adversarial matrix
        run: |
          python3 -m py_compile scripts/aura_workcapsule_preplan_post_observation_transition.py
          python3 -m unittest -v tests.test_aura_workcapsule_preplan_post_observation_transition

      - name: Assert no caller lifecycle-intermediate escape hatch
        run: |
          python3 - <<'PY'
          import inspect
          from pathlib import Path
          from scripts.aura_workcapsule_preplan_post_observation_transition import (
              verify_preplan_post_observation_transition,
          )
          params = inspect.signature(verify_preplan_post_observation_transition).parameters
          for forbidden in (
              'reentry_receipt', 'pre_observation_closure_receipt', 'post_closure_receipt',
              'source_observation_receipt', 'observed_source_witnesses', 'candidate_binding'
          ):
              assert forbidden not in params, forbidden
          source = Path('scripts/aura_workcapsule_preplan_post_observation_transition.py').read_text()
          assert 'compile_raw_owner_end_to_end_stale_lifecycle' in source
          assert 'compile_observation_bound_reentry_closure' in source
          assert 'verify_raw_owner_hold_to_closed_transition' in source
          assert 'pre_reentry_receipt=pre["derived_reentry_receipt"]' in source
          assert 'post_closure_receipt=post_closure' in source
          print('CALLER_LIFECYCLE_INTERMEDIATE_ACCEPTED=false')
          print('PRE_PLAN_DERIVED_FROM_PRE_RAW_OWNER=true')
          print('POST_CANDIDATE_DERIVED_FROM_POST_RAW_OBSERVATION=true')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'EXACT_PRE_PLAN_TO_POST_CLOSURE_IDENTITY=true'
          echo 'EXACT_HOLD_TO_CLOSED_TRANSITION=true'
          echo 'CALLER_REENTRY_RECEIPT_ACCEPTED=false'
          echo 'CALLER_PRE_OBSERVATION_RECEIPT_ACCEPTED=false'
          echo 'CALLER_POST_CLOSURE_RECEIPT_ACCEPTED=false'
          echo 'CALLER_SOURCE_OBSERVATION_RECEIPT_ACCEPTED=false'
          echo 'CALLER_SOURCE_WITNESSES_ACCEPTED=false'
          echo 'CALLER_CANDIDATE_BINDING_ACCEPTED=false'
          echo 'SOURCE_CURRENTNESS_MINTED=false'
          echo 'SEMANTIC_REPAIR_CORRECTNESS_MINTED=false'
          echo 'PRODUCER_IDENTITY_AUTHENTICATED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_DEPENDENCY_CONE_PROVEN=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
