name: Coding Waboose Internal Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - aura_review_arena.py
      - aura_coding_waboose.py
      - aura_coding_waboose_breadboard.py
      - tests/test_aura_review_arena.py
      - scripts/apply_aura_review_arena_v1.py
      - scripts/apply_coding_waboose_v1.py
      - .github/workflows/coding-waboose-internal-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-waboose-internal-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<9"
      - name: Apply integration layers
        run: |
          python scripts/apply_aura_review_arena_v1.py
          python scripts/apply_coding_waboose_v1.py
      - name: Run internal engine tests and capture output
        id: internal
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q tests/test_aura_review_arena.py -vv --tb=long > waboose-internal-test.log 2>&1
          status=$?
          echo "$status" > waboose-internal-test.status
          cat waboose-internal-test.log
          exit "$status"
      - name: Upload exact diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-waboose-internal-diagnostic
          path: |
            waboose-internal-test.log
            waboose-internal-test.status
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        if: always()
        run: test "$(cat waboose-internal-test.status)" = "0"
