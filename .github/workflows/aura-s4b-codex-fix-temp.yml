name: Aura Temporary S4-B Exact Head Export

on:
  pull_request:
    paths:
      - ".github/workflows/aura-s4b-codex-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Verify and archive exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tar --exclude=.git -czf /tmp/aura-s4b-exact-head.tar.gz .

      - name: Upload exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: aura-s4b-exact-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/aura-s4b-exact-head.tar.gz
          if-no-files-found: error
          retention-days: 1
