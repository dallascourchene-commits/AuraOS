name: Aura Temporary S4-B Codex Fix Apply

on:
  pull_request:
    paths:
      - ".github/workflows/aura-s4b-codex-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-verified-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Reconstruct and verify Codex repair patch
        run: |
          set -euo pipefail
          test "$(find scripts/.s4b_fix -maxdepth 1 -name 'patch.b64.*' -type f | wc -l)" = "8"
          cat scripts/.s4b_fix/patch.b64.* | base64 --decode > /tmp/codex-round1.patch
          echo "05a32ae1af24811835e82e09c67d86b0e5390fb3aba8b46f8cf632010122fe29  /tmp/codex-round1.patch" | sha256sum --check --strict
          git apply --check /tmp/codex-round1.patch
          git apply /tmp/codex-round1.patch
          git diff --check

      - name: Set up Python 3.12 and Node 22
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install exact decoder and verification tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy

      - name: Verify manual Codex repairs
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/__init__.py \
            aura_spatial_importers/contracts.py \
            aura_spatial_importers/gaussian_gltf.py \
            aura_spatial_importers/spz.py
          ruff check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/__init__.py \
            aura_spatial_importers/contracts.py \
            aura_spatial_importers/gaussian_gltf.py \
            aura_spatial_importers/spz.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_spz.py
          ruff format --check \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/__init__.py \
            aura_spatial_importers/contracts.py \
            aura_spatial_importers/gaussian_gltf.py \
            aura_spatial_importers/spz.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_spz.py
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_asset_security.py
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs

      - name: Remove all temporary transport surfaces
        run: |
          set -euo pipefail
          rm -rf scripts/.s4b_fix scripts/.s4b_stage
          rm -f .github/workflows/aura-s4b-codex-fix-temp.yml
          rm -f .github/workflows/aura-source-export-temp.yml
          rm -f .github/workflows/aura-tree-sha-temp.yml
          git diff --check
          test ! -e scripts/.s4b_fix
          test ! -e .github/workflows/aura-s4b-codex-fix-temp.yml
          test ! -e .github/workflows/aura-source-export-temp.yml

      - name: Commit and push exact reviewed repair
        run: |
          set -euo pipefail
          git add -A
          ! git diff --cached --name-only | grep -E '(^scripts/\.s4b_|aura-.*-temp\.yml$)'
          git -c user.name='Aura Spatial Review' -c user.email='aura-spatial-review@users.noreply.github.com' \
            commit -m 'fix: address Codex S4-B review findings'
          git push origin HEAD:feature/spatial-s4b-gaussian-security
