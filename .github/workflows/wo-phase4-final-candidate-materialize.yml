name: WO Phase4 Final Candidate Materialize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wo-phase4-final-candidate-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: fix/wc-02-triad2-phase4-final
      EXPECTED_BASE: bb9c2538910c760c79789b3cafa2a7404e789a2e
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wc-02-triad2-phase4-final
          fetch-depth: 0

      - name: Bind exact synchronized base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git status --porcelain | wc -l)" -eq 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"

      - name: Apply bounded Phase4 source repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/wo_triad2_ci_codemap_failclosed_patch.py
          python tools/wo_triad2_ci_skillweaver_codemap_patch.py
          python tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          python tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          python tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          python tools/wo_triad2_ci_pascal_receipt_test_patch.py
          python - <<'PY'
          from tools.wo_triad2_ci_codemap_repair import patch_architect, patch_ci
          patch_architect()
          patch_ci()
          PY

      - name: Apply current CODEMAP consumer, provenance, README, and pytest-contract repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Hermes: canonical current count is summary.file_count; preserve old-schema fallback.
          p = Path('aura_hermes_arena_mode.py')
          replace_once(
              p,
              '    coverage = codemap.get("coverage", {})\n    file_count = int(coverage.get("included_file_count", 0))\n    all_paths = coverage.get("all_included_paths_sorted", []) or []\n    if not file_count and all_paths:\n        file_count = len(all_paths)\n',
              '    coverage = codemap.get("coverage", {})\n    summary = codemap.get("summary", {})\n    file_count = int(\n        summary.get("file_count")\n        or coverage.get("included_file_count")\n        or coverage.get("repo_file_count")\n        or 0\n    )\n    all_paths = coverage.get("all_included_paths_sorted", []) or []\n    if not file_count and all_paths:\n        file_count = len(all_paths)\n    if not file_count and isinstance(codemap.get("files"), list):\n        file_count = len(codemap["files"])\n',
              'Hermes current CODEMAP file count',
          )

          # Topology health: same schema contract.
          p = Path('aura_topology_health.py')
          replace_once(
              p,
              '    coverage = cm.get("coverage", {})\n    file_count = int(coverage.get("included_file_count", 0))\n    topo = cm.get("topology", {})\n    summary = cm.get("summary", {})\n',
              '    coverage = cm.get("coverage", {})\n    summary = cm.get("summary", {})\n    file_count = int(\n        summary.get("file_count")\n        or coverage.get("included_file_count")\n        or coverage.get("repo_file_count")\n        or 0\n    )\n    if not file_count and isinstance(cm.get("files"), list):\n        file_count = len(cm["files"])\n    topo = cm.get("topology", {})\n',
              'Topology health current CODEMAP file count',
          )

          # Restore the completion-audit README marker without extending authority.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = 'Construction Human Agent profile'
          if marker not in text:
              anchor = '- **Source-defeasible hydration** — compact representations must remain defeasible by exact/current source evidence.\n'
              if text.count(anchor) != 1:
                  raise RuntimeError(f'README completion marker anchor count={text.count(anchor)}')
              addition = ('- **Construction Human Agent profile** — review-only projection over canonical Construction state and Observatory evidence; '
                          'it grants no physical-work, payment, access, equipment, professional, deployment, or merge authority.\n')
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          # Rebind PR1 evidence to the exact repaired ci.yml Git blob.
          ci = Path('.github/workflows/ci.yml').read_bytes()
          ci_blob = hashlib.sha1(f'blob {len(ci)}\\0'.encode('ascii') + ci).hexdigest()
          objp = Path('.aura/refactor_objectives/bilateral_intent_guardrail_foundry_pr1.v1.json')
          obj = json.loads(objp.read_text(encoding='utf-8'))
          obj['candidate_source_blobs']['.github/workflows/ci.yml'] = ci_blob
          objp.write_text(json.dumps(obj, indent=2, sort_keys=False) + '\n', encoding='utf-8')

          # W6: legacy script-style harnesses must not SystemExit during pytest import.
          replace_once(
              Path('test_aura_functions.py'),
              'sys.exit(0 if fails == 0 else 1)\n',
              'if __name__ == "__main__":\n    raise SystemExit(0 if fails == 0 else 1)\nif fails:\n    raise AssertionError(f"{fails} legacy Aura function checks failed")\n',
              'Aura function harness exit boundary',
          )
          replace_once(
              Path('test_synthesis_upgrades.py'),
              'sys.exit(0 if fails == 0 else 1)\n',
              'if __name__ == "__main__":\n    raise SystemExit(0 if fails == 0 else 1)\nif fails:\n    raise AssertionError(f"{fails} synthesis upgrade checks failed")\n',
              'Synthesis harness exit boundary',
          )
          replace_once(
              Path('test_syntax_fixes.py'),
              'if all_passed:\n    print("\\n✅ All syntax fixes validated!")\n    sys.exit(0)\nelse:\n    print("\\n❌ Some files still have syntax errors")\n    sys.exit(1)\n',
              'if all_passed:\n    print("\\n✅ All syntax fixes validated!")\nelse:\n    print("\\n❌ Some files still have syntax errors")\n\nif __name__ == "__main__":\n    raise SystemExit(0 if all_passed else 1)\nif not all_passed:\n    raise AssertionError("legacy syntax validation failed")\n',
              'Syntax harness exit boundary',
          )

          contract = Path('tests/test_wc02_phase4_pytest_collection_contract.py')
          contract.write_text('''from __future__ import annotations\n\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nLEGACY_SCRIPT_TESTS = (\n    "test_aura_functions.py",\n    "test_synthesis_upgrades.py",\n    "test_syntax_fixes.py",\n)\n\n\ndef test_legacy_script_tests_do_not_exit_during_pytest_import() -> None:\n    """Legacy script-style checks may exit as CLIs, never while pytest imports them."""\n    for relative in LEGACY_SCRIPT_TESTS:\n        text = (ROOT / relative).read_text(encoding="utf-8")\n        assert 'if __name__ == "__main__":' in text, relative\n        assert "sys.exit(" not in text, relative\n\n\ndef test_legacy_script_failures_remain_assertive_under_pytest() -> None:\n    for relative in LEGACY_SCRIPT_TESTS:\n        text = (ROOT / relative).read_text(encoding="utf-8")\n        assert "raise AssertionError(" in text, relative\n''', encoding='utf-8')

          # Rebase stale substrate assertions onto the current navigator contracts.
          p = Path('test_aura_substrate.py')
          text = p.read_text(encoding='utf-8')
          old = '''        hits = search_index(payload, "!savings", limit=2)\n        self.assertEqual(hits, ["USER_GUIDE.md", "aura_node.py"])\n        aura_node = next(item for item in payload["files"] if item["path"] == "aura_node.py")\n        self.assertEqual(aura_node["command_lines"], {"!savings": [6975, 7098]})\n'''
          new = '''        hits = search_index(payload, "!savings", top_n=2)\n        self.assertEqual([hit["path"] for hit in hits], ["USER_GUIDE.md", "aura_node.py"])\n        aura_node_hit = next(hit for hit in hits if hit["path"] == "aura_node.py")\n        self.assertEqual(aura_node_hit["command_lines"], {"!savings": [6975, 7098]})\n        self.assertIn("!savings", aura_node_hit["commands"])\n'''
          if old not in text:
              raise RuntimeError('substrate search_index stale-contract anchor missing')
          text = text.replace(old, new, 1)

          old = '''        from aura_codebase_navigator import _attach_topology\n\n        records = [{"path": "aura_node.py", "commands": []}]\n        topology = {\n            "nodes": {\n                "aura_node.py::main": {"file": "aura_node.py", "kind": "function"},\n                "aura_router.py::route": {"file": "aura_router.py", "kind": "function"},\n            },\n            "edges": [\n                {"from": "aura_node.py::main", "to": "aura_router.py::route"},\n                {"from": "aura_router.py::route", "to": "aura_node.py::main"},\n            ],\n        }\n        attached = _attach_topology(records, topology)\n        self.assertEqual(attached["aura_node.py"]["degree"], 2)\n        self.assertEqual(attached["aura_node.py"]["neighbor_files"], ["aura_router.py"])\n        self.assertEqual(attached["aura_node.py"]["symbols"], ["main"])\n'''
          new = '''        from aura_codebase_navigator import _attach_topology, _topology_file_index\n\n        records = [{"path": "aura_node.py", "commands": []}]\n        topology = {\n            "nodes": {\n                "aura_node.py::main": {"file": "aura_node.py", "kind": "function"},\n                "aura_router.py::route": {"file": "aura_router.py", "kind": "function"},\n            },\n            "edges": [\n                {"from": "aura_node.py::main", "to": "aura_router.py::route"},\n                {"from": "aura_router.py::route", "to": "aura_node.py::main"},\n            ],\n        }\n        topology_index = _topology_file_index(topology)\n        attached = _attach_topology(records, topology_index)\n        self.assertEqual(attached[0]["topology"]["degree"], 2)\n        self.assertEqual(attached[0]["topology"]["neighbor_files"], ["aura_router.py"])\n        self.assertEqual(attached[0]["topology"]["symbols"], ["main"])\n'''
          if old not in text:
              raise RuntimeError('substrate topology stale-contract anchor missing')
          text = text.replace(old, new, 1)

          old = '''            refreshed = refresh_index_for_paths(index_path, [Path("module.py")], root=root)\n            self.assertEqual(refreshed["changed_paths"], ["module.py"])\n            alpha = next(item for item in refreshed["symbols"] if item["name"] == "alpha")\n            self.assertEqual(alpha["kind"], "async_function")\n            self.assertTrue(alpha["semantic_id"].startswith("module.py#async_function:alpha:"))\n            self.assertEqual(refreshed["topology"]["module.py"]["neighbor_files"], ["sibling.py"])\n'''
          new = '''            topology = json.loads((topo_dir / "live_topology_ast.json").read_text(encoding="utf-8"))\n            refreshed = refresh_index_for_paths(payload, root, [Path("module.py")], topology=topology)\n            self.assertEqual(refreshed["incremental_refresh"]["changed_paths"], ["module.py"])\n            alpha = next(item for item in refreshed["symbols"] if item["name"] == "alpha")\n            self.assertEqual(alpha["kind"], "function")\n            self.assertTrue(alpha["semantic_id"].startswith("module.py#function:alpha:"))\n            module_card = next(card for card in refreshed["files"] if card["path"] == "module.py")\n            self.assertEqual(module_card["topology"]["neighbor_files"], ["sibling.py"])\n'''
          if old not in text:
              raise RuntimeError('substrate incremental stale-contract anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove superseded repair bootstrap surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wo-triad2-ci-codemap-repair-bootstrap.yml
          rm -f tools/wo_triad2_ci_codemap_repair.py
          rm -f tools/wo_triad2_ci_codemap_failclosed_patch.py
          rm -f tools/wo_triad2_ci_codemap_command_index_patch.py
          rm -f tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          rm -f tools/wo_triad2_ci_skillweaver_codemap_patch.py
          rm -f tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          rm -f tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          rm -f tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          rm -f tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          rm -f tools/wo_triad2_ci_pascal_receipt_test_patch.py

      - name: Compile and regenerate navigation artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_architect_loop.py aura_agent_arena_bridge.py aura_coding_relationship_compass.py \
            aura_hermes_arena_mode.py aura_skillweaver.py aura_topology_health.py \
            test_aura_functions.py test_aura_substrate.py test_synthesis_upgrades.py test_syntax_fixes.py \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py \
            tests/test_wc02_phase4_pytest_collection_contract.py
          python aura_codebase_navigator.py --refresh-topology
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python scripts/aura_navigation_refresh.py
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python -m aura_codemap_verify
          git diff --check

      - name: Focused pre-commit regression proof
        run: |
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_aura_topology_health.py \
            tests/test_aura_hermes_arena_mode.py::TestPreflight::test_preflight_repo_digest_has_codemap_status \
            tests/test_aura_system_stabilization.py::TestStabilization::test_codemap_counts \
            tests/test_bilateral_intent_pr1_evidence.py::test_recorded_candidate_source_blobs_match_checkout \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            tests/test_wc02_phase4_pytest_collection_contract.py \
            test_aura_substrate.py

      - name: Commit bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aura Fleet Triad2 Phase4'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No candidate delta materialized'; exit 1; }
          git commit -m 'fix(phase4): remediate CI, CODEMAP, and pytest contracts'
          git rev-parse HEAD | tee /tmp/wc02-phase4-candidate-head.txt
          git rev-parse HEAD^{tree} | tee /tmp/wc02-phase4-candidate-tree.txt
          python -m aura_codemap_verify

      - name: Push candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote="$(git rev-parse FETCH_HEAD)"
          test "$remote" = "$EXPECTED_BASE"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Package exact committed candidate
        shell: bash
        run: |
          git archive --format=tar.gz --output=/tmp/wc02-phase4-candidate.tar.gz HEAD
          git show --stat --oneline HEAD > /tmp/wc02-phase4-candidate-stat.txt
          git diff HEAD^ HEAD --binary > /tmp/wc02-phase4-candidate.patch
          sha256sum \
            /tmp/wc02-phase4-candidate.tar.gz \
            /tmp/wc02-phase4-candidate.patch \
            /tmp/wc02-phase4-candidate-head.txt \
            /tmp/wc02-phase4-candidate-tree.txt \
            > /tmp/wc02-phase4-candidate.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wc02-phase4-final-candidate
          path: |
            /tmp/wc02-phase4-candidate.tar.gz
            /tmp/wc02-phase4-candidate.patch
            /tmp/wc02-phase4-candidate-stat.txt
            /tmp/wc02-phase4-candidate-head.txt
            /tmp/wc02-phase4-candidate-tree.txt
            /tmp/wc02-phase4-candidate.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Stop before PR
        run: |
          echo 'Candidate branch committed and archived.'
          echo 'No PR has been opened. Plain local pytest on these exact bytes remains mandatory.'
