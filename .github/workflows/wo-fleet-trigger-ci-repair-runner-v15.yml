name: WO Fleet Phase4 Triad2 Repair Runner V15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wo-fleet-trigger-ci-repair-runner-v15.yml

permissions:
  contents: read

jobs:
  repair-target-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/wo-triad2-ci-codemap-repair-001
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python 3.12 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"

      - name: Apply validated repair transforms
        run: |
          set -euo pipefail
          python tools/wo_triad2_ci_codemap_repair.py
          python tools/wo_triad2_ci_codemap_failclosed_patch.py
          python tools/wo_triad2_ci_codemap_command_index_patch.py
          python tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          python tools/wo_triad2_ci_skillweaver_codemap_patch.py
          python tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          python tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          python tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          python tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          python tools/wo_triad2_ci_pascal_receipt_test_patch.py

      - name: Restore Construction Human Agent README completion marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = 'Construction Human Agent profile'
          if marker not in text:
              anchor = '- **Source-defeasible hydration** — compact representations must remain defeasible by exact/current source evidence.\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'README completion marker anchor count={text.count(anchor)}')
              addition = ('- **Construction Human Agent profile** — review-only projection over canonical Construction state and Observatory evidence; '
                          'it grants no physical-work, payment, access, equipment, professional, deployment, or merge authority.\n')
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove branch-local bootstrap files before regeneration
        run: |
          rm -f tools/wo_triad2_ci_codemap_repair.py
          rm -f tools/wo_triad2_ci_codemap_failclosed_patch.py
          rm -f tools/wo_triad2_ci_codemap_command_index_patch.py
          rm -f tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          rm -f tools/wo_triad2_ci_skillweaver_codemap_patch.py
          rm -f tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          rm -f tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          rm -f tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          rm -f tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          rm -f tools/wo_triad2_ci_pascal_receipt_test_patch.py
          rm -f .github/workflows/wo-triad2-ci-codemap-repair-bootstrap.yml

      - name: Compile repaired Python surfaces
        run: python -m py_compile aura_codebase_navigator.py aura_codemap_verify.py aura_architect_loop.py aura_topological_scanner.py aura_topology_manager.py aura_fusion.py aura_skillweaver.py aura_agent_arena_bridge.py aura_coding_relationship_compass.py tests/test_aura_construction_pascal_spatial_foundry_pr5.py

      - name: Regenerate and verify canonical deep CODEMAP
        run: |
          python aura_codebase_navigator.py --refresh-topology
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python -m aura_codemap_verify

      - name: Python 3.12 focused contracts
        id: contracts312
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            --junitxml=triad2-contracts-py312.xml 2>&1 | tee triad2-contracts-py312.txt

      - name: Python 3.12 full pytest-native suite
        id: full312
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --deselect=tests/test_aura_human_agent_arena.py::test_affordance_map_declares_source_of_truth \
            --junitxml=triad2-full-py312.xml 2>&1 | tee triad2-full-py312.txt

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python 3.10 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Python 3.10 focused contracts
        id: contracts310
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            --junitxml=triad2-contracts-py310.xml 2>&1 | tee triad2-contracts-py310.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo-phase4-triad2-v15-diagnostics-${{ github.run_id }}
          path: |
            triad2-contracts-py312.txt
            triad2-contracts-py312.xml
            triad2-full-py312.txt
            triad2-full-py312.xml
            triad2-contracts-py310.txt
            triad2-contracts-py310.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce all pre-local verification gates
        if: steps.contracts312.outcome != 'success' || steps.full312.outcome != 'success' || steps.contracts310.outcome != 'success'
        run: |
          echo "Pre-local gates not green; refusing exact-tree artifact."
          echo "py312 focused=${{ steps.contracts312.outcome }}"
          echo "py312 full=${{ steps.full312.outcome }}"
          echo "py310 focused=${{ steps.contracts310.outcome }}"
          exit 1

      - name: Remove transient diagnostics from tested tree
        run: |
          rm -f triad2-contracts-py312.txt triad2-contracts-py312.xml
          rm -f triad2-full-py312.txt triad2-full-py312.xml
          rm -f triad2-contracts-py310.txt triad2-contracts-py310.xml

      - name: Package exact tested repair tree
        run: |
          git status --short > /tmp/wo-phase4-tested-tree-status.txt
          git diff --binary > /tmp/wo-phase4-tested-tree.patch
          tar --exclude=.git -czf /tmp/wo-phase4-tested-tree.tar.gz .
          sha256sum /tmp/wo-phase4-tested-tree.tar.gz /tmp/wo-phase4-tested-tree.patch > /tmp/wo-phase4-tested-tree.sha256

      - name: Upload exact tested repair tree
        uses: actions/upload-artifact@v4
        with:
          name: wo-phase4-tested-tree-${{ github.run_id }}
          path: |
            /tmp/wo-phase4-tested-tree.tar.gz
            /tmp/wo-phase4-tested-tree.patch
            /tmp/wo-phase4-tested-tree-status.txt
            /tmp/wo-phase4-tested-tree.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Stop before branch commit
        run: |
          echo 'CI generation is green and exact tree is packaged.'
          echo 'No fix-branch commit or PR is authorized until local pytest is 100% green.'
