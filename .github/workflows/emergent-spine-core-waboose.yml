name: Emergent Spine Core Waboose

on:
  pull_request:
    branches: [main]
    paths:
      - aura_emergent_evidence_spine.py
      - tests/test_aura_emergent_evidence_spine.py
      - docs/AURA_EMERGENT_EVIDENCE_SPINE_PLAN.md
      - .github/workflows/emergent-spine-core-waboose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergent-spine-core-waboose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-waboose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit

      - name: Compile core capsule
        run: |
          python -m py_compile \
            aura_emergent_evidence_spine.py \
            tests/test_aura_emergent_evidence_spine.py

      - name: Run emergent-spine adversarial tests
        run: python -m pytest -q tests/test_aura_emergent_evidence_spine.py

      - name: Static and security checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_emergent_evidence_spine.py \
            tests/test_aura_emergent_evidence_spine.py
          bandit -q -ll aura_emergent_evidence_spine.py

      - name: Build capsule-one Coding Waboose request
        run: |
          cat > /tmp/emergent-core-waboose.json <<'JSON'
          {
            "objective": "Review the Connectome-grounded Emergent Evidence Spine core for complete atomic-function enumeration, exact code-block slicing, bounded caller/callee dependency closure, advisory-only emergent reasoning, research truth separation, and fail-closed authority boundaries.",
            "mode": "range",
            "base_ref": "origin/main",
            "head_ref": "HEAD",
            "profile": "precision",
            "focus_directives": [
              {
                "name": "connectome_atomic_binding",
                "question": "Does every selected Connectome capability bind to exact atomic functions without invented files or symbols?",
                "risk": "architecture",
                "direction": "both",
                "target_patterns": ["resolve_capabilities", "build_capability_connectome", "build_atomic_function_inventory", "CodeTopoAnchor"],
                "required_evidence": ["exact_source", "symbol_identity", "source_hash"],
                "suggested_tools": ["pytest"],
                "max_depth": 2,
                "max_nodes": 120
              },
              {
                "name": "atomic_closure_precision",
                "question": "Can unrelated functions enter the selected source slices or can required callers and callees be omitted?",
                "risk": "correctness",
                "direction": "both",
                "target_patterns": ["_select_seed_nodes", "_expand_atomic_closure", "_source_slice", "_bounded_anchor"],
                "required_evidence": ["exact_source", "call_graph", "regression_test"],
                "suggested_tools": ["pytest"],
                "max_depth": 2,
                "max_nodes": 160
              },
              {
                "name": "emergent_research_non_authority",
                "question": "Can affinity, emergent findings, or external research become patch or merge authority?",
                "risk": "authority",
                "direction": "both",
                "target_patterns": ["grounding_ok", "approximate_only", "safe_to_patch", "patch_authority", "automatic_merge", "advisory_only"],
                "required_evidence": ["contract_invariant", "exact_source", "regression_test"],
                "suggested_tools": ["pytest"],
                "max_depth": 2,
                "max_nodes": 120
              }
            ],
            "invariants": [
              "The complete atomic callable inventory is computed before bounded emission.",
              "Only exact source spans and hashes can establish grounding.",
              "Affinity-only selection remains advisory and cannot claim grounding.",
              "Emergent findings and research evidence never grant patch authority.",
              "Production mutation, automatic fix, commit, push, pull request, and merge remain false."
            ],
            "risk_map": ["architecture", "correctness", "dependency_graph", "research_truth", "authority"],
            "graph_depth": 2,
            "graph_node_budget": 180,
            "run_tests": true,
            "run_optional_tools": true,
            "metadata": {"capsule": "core", "feature": "emergent_evidence_spine"}
          }
          JSON

      - name: Run Coding Waboose over capsule one
        run: |
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/emergent-core-waboose-state.json \
            run --request /tmp/emergent-core-waboose.json \
            | tee /tmp/emergent-core-waboose-result.json

      - name: Enforce clean Coding Waboose result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path('/tmp/emergent-core-waboose-result.json').read_text())
          assert packet.get('ok') is True, packet
          repairs = packet.get('forge_repair_requests') or []
          if repairs:
              raise SystemExit(f'Coding Waboose found repair-eligible defects: {repairs}')
          assert packet.get('production_mutation') is False
          assert packet.get('automatic_merge') is False
          PY

      - name: Upload capsule-one Waboose packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergent-spine-core-waboose
          path: |
            /tmp/emergent-core-waboose-result.json
            /tmp/emergent-core-waboose-state.json
          if-no-files-found: warn
          retention-days: 3
