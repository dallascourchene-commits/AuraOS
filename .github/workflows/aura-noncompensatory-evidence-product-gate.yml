name: Aura Non-Compensatory Evidence Product Gate

on:
  pull_request:
    paths:
      - "tools/aura_noncompensatory_evidence_product_gate.py"
      - "tests/test_aura_noncompensatory_evidence_product_gate.py"
      - ".github/workflows/aura-noncompensatory-evidence-product-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  noncompensatory-product-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact N1 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Revalidate exact parent proof generations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          expected=[
              (33400399223,'23c8345a1e3d5034ce88bea1ab32c69c1a9cf3f2','GLM53 Official Equal Rate E8 Canary'),
              (33400557094,'7340091202f3f1a859841c3ec4314191f18fa1ad','GLM53 Official Source C2 Request Admission'),
          ]
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for run_id, head, name in expected:
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{run_id}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: run=json.load(r)
              assert run['status']=='completed' and run['conclusion']=='success',run
              assert run['head_sha']==head,(run_id,run['head_sha'],head)
              assert run['name']==name,(run_id,run['name'],name)
          print('N1_PARENT_PROOF_GENERATIONS_EXACT_GREEN=true')
          PY

      - name: Compile and run N1 adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/aura_noncompensatory_evidence_product_gate.py tests/test_aura_noncompensatory_evidence_product_gate.py
          PYTHONPATH=. python3 -m unittest -v tests.test_aura_noncompensatory_evidence_product_gate

      - name: Prove favorable evidence cannot pay hard-gate debt
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 tools/aura_noncompensatory_evidence_product_gate.py | tee /tmp/n1-product-gate.json
          PYTHONPATH=. python3 - <<'PY'
          from tools import aura_noncompensatory_evidence_product_gate as n1
          r=n1.current_parent_fixture(support_strength=10**18)
          assert r.disposition=='HOLD_HARD_GATE'
          assert r.positive_evidence_present is True
          assert r.all_hard_gates_pass is False
          assert r.evidence_policy_evaluated is False
          assert r.bounded_proposal_eligible is False
          assert r.evidence_can_compensate_for_failed_gate is False
          assert r.evidence_magnitude_changes_feasibility is False
          print('N1_NONCOMPENSATION_PROVEN=true')
          print('N1_RECEIPT_DIGEST='+r.receipt_digest)
          PY

      - name: Preserve N1 receipt
        uses: actions/upload-artifact@v4
        with:
          name: n1-noncompensatory-evidence-product-gate-receipt
          path: /tmp/n1-product-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Consequence ceiling
        run: |
          echo 'PositiveEvidenceCannotPayHardGateDebt.'
          echo 'HardConstraint != NegativeReward; EvidenceMagnitude != Feasibility.'
          echo 'No semantic truth, effect authority, semantic K27 authority, private/native KV, Gate-10, merge or deployment authority.'
