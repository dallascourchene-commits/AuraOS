name: Model Cognome Replay and Probes

on:
  pull_request:
    paths:
      - "aura_model_cognome_replay.py"
      - "aura_model_cognome_drift.py"
      - "aura_model_cognome_promotion.py"
      - "aura_model_cognome_federation.py"
      - "aura_open_weight_jacobian_adapter.py"
      - "tests/test_aura_model_cognome_replay_probes.py"
      - "test_aura_icm_workspace.py"
      - ".github/workflows/model-cognome-replay-probes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-probes:
    name: Replay and probe contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install pytest ruff
      - name: Compile modules
        run: |
          python -m py_compile             aura_model_cognome_replay.py             aura_model_cognome_drift.py             aura_model_cognome_promotion.py             aura_model_cognome_federation.py             aura_open_weight_jacobian_adapter.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82             aura_model_cognome_replay.py             aura_model_cognome_drift.py             aura_model_cognome_promotion.py             aura_model_cognome_federation.py             aura_open_weight_jacobian_adapter.py             tests/test_aura_model_cognome_replay_probes.py             test_aura_icm_workspace.py
      - name: Run replay, probe, and ICM contracts
        run: |
          python -m pytest -q             tests/test_aura_model_cognome_replay_probes.py             test_aura_icm_workspace.py
