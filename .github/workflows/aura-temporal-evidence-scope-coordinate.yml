name: Aura Temporal Evidence Scope Coordinate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CONVERGENCE_SHA: fb50aed9349718d24eb96e656998f9dad5e0f3bb
  PR614_HEAD: c2c112f627e93b8fd0b11c971be41badd1902cb6
  PR614_RUN: '33365263419'
  PR614_OWNER_BLOB: 9f2f320eac4e794131205788fc2f59d0447e5306
  PR614_TEST_BLOB: d1c49c3d37b888100c8d77c642d3716534bce42a
  PR610_HEAD: 2c3702fdb1f903df63515dc951392cd377def60e
  PR610_RUN: '33364942749'
  PR610_OWNER_BLOB: b0c4d6db4f3b3bb267d2a63c1147a421fa26d2d3
  PR610_TEST_BLOB: 60ff0b40575cfa9bb43809321a5804ca51b6bad4

jobs:
  exact-temporal-evidence-scope-coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact child and prove PR614 x PR610 convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags origin "$TARGET_SHA" "$CONVERGENCE_SHA" "$PR614_HEAD" "$PR610_HEAD"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$CONVERGENCE_SHA" HEAD
          mapfile -t parents < <(git cat-file -p "$CONVERGENCE_SHA" | awk '/^parent /{print $2}')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$PR614_HEAD"
          test "${parents[1]}" = "$PR610_HEAD"
          test "$(git hash-object tools/thinkpad_longitudinal_envelope_series.py)" = "$PR614_OWNER_BLOB"
          test "$(git hash-object tools/test_thinkpad_longitudinal_envelope_series.py)" = "$PR614_TEST_BLOB"
          test "$(git hash-object tools/k27_eye_pose_observation_contract.py)" = "$PR610_OWNER_BLOB"
          test "$(git hash-object tests/test_k27_eye_pose_observation_contract.py)" = "$PR610_TEST_BLOB"
          echo "TRUE_TWO_PARENT_CONVERGENCE=$CONVERGENCE_SHA"

      - name: Pin exact successful parent hosted runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PR614_RUN}" --jq .head_sha)" = "$PR614_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PR614_RUN}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PR610_RUN}" --jq .head_sha)" = "$PR610_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PR610_RUN}" --jq .conclusion)" = success
          echo "PR614_EXACT_HOSTED=true"
          echo "PR610_EXACT_HOSTED=true"

      - name: Re-prove PR614 historical-series owner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/thinkpad_longitudinal_envelope_series.py
          python3 -m unittest -v tools.test_thinkpad_longitudinal_envelope_series
          echo "PR614_HISTORICAL_SERIES_REPROVED=true"

      - name: Re-prove PR610 point-observation common-cut owner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/k27_eye_pose_observation_contract.py
          python3 -m unittest -v tests.test_k27_eye_pose_observation_contract
          echo "PR610_POINT_COMMON_CUT_REPROVED=true"

      - name: Prove O57 temporal-scope adversarials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/temporal_evidence_scope_coordinate.py
          python3 -m unittest -v tests.test_temporal_evidence_scope_coordinate
          echo "O57_TEMPORAL_SCOPE_ADVERSARIALS=true"

      - name: Prove overlap is not shared current world or causality
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tests.test_temporal_evidence_scope_coordinate import eye_receipt, series
          from tools.temporal_evidence_scope_coordinate import bind_temporal_evidence_scope
          out = bind_temporal_evidence_scope(
              eye_pose_receipt=eye_receipt(1_788_156_600_000_000_000),
              longitudinal_series=series(),
          )
          assert out.point_vs_series_relation == 'DURING'
          assert out.temporal_overlap is True
          assert out.point_observation_was_gate_admissible is True
          assert out.point_observation_current_now_proven is False
          assert out.historical_series_current_now_proven is False
          assert out.shared_current_world_proven is False
          assert out.same_host_proven is False
          assert out.temporal_overlap_proves_causality is False
          assert out.effect_authority_proven is False
          print('TEMPORAL_RELATION=DURING')
          print('TEMPORAL_OVERLAP=true')
          print('SHARED_CURRENT_WORLD=false')
          print('CAUSALITY=false')
          PY

      - name: Assert narrow boundary and complete consequence ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import inspect
          from tools.temporal_evidence_scope_coordinate import bind_temporal_evidence_scope
          assert list(inspect.signature(bind_temporal_evidence_scope).parameters) == ['eye_pose_receipt','longitudinal_series']
          path='tools/temporal_evidence_scope_coordinate.py'
          tree=ast.parse(open(path,encoding='utf-8').read(),filename=path)
          forbidden={'sqlite3','redis','requests','subprocess','socket'}
          for item in ast.walk(tree):
              if isinstance(item,ast.Import):
                  for alias in item.names:
                      assert alias.name.split('.')[0] not in forbidden
              elif isinstance(item,ast.ImportFrom) and item.module:
                  assert item.module.split('.')[0] not in forbidden
              elif isinstance(item,ast.Call) and isinstance(item.func,ast.Name) and item.func.id=='open':
                  raise AssertionError('O57 membrane must not open files')
          print('PUBLIC_INPUTS=eye_pose_receipt,longitudinal_series')
          PY
          cat <<'EOF'
          POINT_OBSERVATION_GATE_ADMISSIBLE_CAN_BE_TRUE=true
          HISTORICAL_SERIES_ONLY=true
          TEMPORAL_OVERLAP_NE_SHARED_CURRENT_WORLD=true
          TEMPORAL_OVERLAP_NE_CAUSALITY=true
          POINT_CURRENT_NOW_PROVEN=false
          HISTORICAL_SERIES_CURRENT_NOW_PROVEN=false
          SHARED_CURRENT_WORLD_PROVEN=false
          SAME_HOST_PROVEN=false
          CALIBRATED_METRIC_EYE_TRUTH_PROVEN=false
          PHYSICAL_STEERING_AUTHORITY=false
          PERFORMANCE_CAUSALITY_PROVEN=false
          PRODUCER_AUTHENTICATED=false
          SEMANTIC_K27_AUTHORITY_PROVEN=false
          EFFECT_AUTHORITY_PROVEN=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          GATE10_PROMOTED=false
          EOF
