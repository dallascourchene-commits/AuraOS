name: Codex Final Index Digest Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: codex-final-index-digest-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c0-c2-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coding-relationship-compass-c0-c2-20260721
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified final Codex patch
        env:
          PATCH_B64: 
        run: |
          test "$(git rev-parse HEAD^)" = "29d6f47c917c1711d15f4073c9c05484e2da40a4"
          test "$(git log -1 --format=%s)" = "chore: trigger final Codex digest repair"
          STAGING_SHA="${{ github.event.pull_request.head.sha }}"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/codex-final.patch
          git reset --hard 29d6f47c917c1711d15f4073c9c05484e2da40a4
          git apply --check /tmp/codex-final.patch
          git apply /tmp/codex-final.patch
          printf '%s\n' "$STAGING_SHA" > /tmp/staging-sha

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio

      - name: Verify final digest binding
        run: |
          python -m py_compile aura_coding_relationship_compass.py tests/test_aura_coding_relationship_compass.py
          python -m pytest -q \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relationship_contracts.py \
            tests/test_aura_architecture_harness.py \
            test_aura_architect_loop.py

      - name: Publish clean two-file fix
        env:
          TARGET_BRANCH: work/coding-relationship-compass-c0-c2-20260721
        run: |
          EXPECTED_STAGING_SHA="$(cat /tmp/staging-sha)"
          git add aura_coding_relationship_compass.py tests/test_aura_coding_relationship_compass.py
          git config user.name 'AuraOS Review Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: validate supplied Relational Index digest'
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 2
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_STAGING_SHA}" \
            origin HEAD:"${TARGET_BRANCH}"
