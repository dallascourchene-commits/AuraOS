name: Aura Spatial final docs and CODEMAP

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-final-docs-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-spatial-final-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize-docs-and-codemap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy

      - name: Apply Codex fix and synchronize canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          workflow = root / '.github/workflows/aura-spatial-s5-s6-construction.yml'
          text = workflow.read_text()
          checkout_anchor = """      - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    submodules: false
          """.replace('                ', '        ')
          checkout_ref = '$' + '{{ github.event.pull_request.head.sha || github.sha }}'
          checkout_replacement = (
              "      - uses: actions/checkout@v4\n"
              "        with:\n"
              f"          ref: {checkout_ref}\n"
              "          fetch-depth: 0\n"
              "          submodules: false\n"
          )
          if f"ref: {checkout_ref}" not in text:
              if checkout_anchor not in text:
                  raise SystemExit('checkout anchor missing')
              text = text.replace(checkout_anchor, checkout_replacement, 1)
          workflow.write_text(text)

          readme = root / 'README.md'
          text = readme.read_text()
          construction_row = '| **Construction Arena** | Replays exact project state, evaluates blocked/admissible proposals, and projects bounded Human Agent and Observatory views | No physical work, payment, access, equipment, or professional authority |\n'
          spatial_row = '| **Spatial Arena** | Projects canonical domain state into immutable scenes and runs a governed `FRAME → GROUND → COMPILE_SCENE → PLAN_RENDER → PRESENT → INTERACT → PROVE → DECIDE → DISSOLVE` lifecycle | Presentation and proposal only; no domain mutation, renderer authority, raw-sensor retention, automatic resume, or merge |\n'
          if spatial_row not in text:
              if construction_row not in text:
                  raise SystemExit('README system-map anchor missing')
              text = text.replace(construction_row, construction_row + spatial_row, 1)
          spatial_section = '''
          <!-- AURA_SPATIAL_S5_S6:START -->
          ### Spatial Arena and Construction projection

          Spatial S5 completes Aura's governed presentation lifecycle, while the Construction-only S6 adapter projects exact `ConstructionProjectState` and its validated runtime packet without creating another Construction ledger.

          ```text
          canonical domain truth
            → privacy-minimized adapter
            → immutable SpatialSceneSnapshot
            → deterministic device/render plan
            → ephemeral presentation session
            → review-only interaction
            → render evidence + Attempt Archive + assessment-only checkpoint
            → read-only Observatory projection
            → human/domain decision packet
            → exact renderer-boundary receipt
            → lease and session dissolution
          ```

          The canonical lifecycle is:

          ```text
          FRAME → GROUND → COMPILE_SCENE → PLAN_RENDER → PRESENT
                → INTERACT → PROVE → DECIDE → DISSOLVE
          ```

          `DECIDE` emits a review packet; it does not apply a decision. `DISSOLVE` preserves the client's evidence class and requires exact session, scene, and render-plan bindings. Emergency close never fabricates renderer cleanup. Public Construction identifiers are hashed, restricted/sensitive projections remain local and abstract, and floor-plan manifests are admitted only when they are local, privacy-compatible, explicitly non-survey, and contain no person-level data.

          Validate the route and run the synthetic, non-persistent demonstration:

          ```bash
          python aura_spatial_cli.py --repo-root . validate-route
          python aura_spatial_cli.py --repo-root . synthetic-construction-demo
          ```

          See [`docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md`](docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md).
          <!-- AURA_SPATIAL_S5_S6:END -->

          '''.replace('          ', '')
          if '<!-- AURA_SPATIAL_S5_S6:START -->' not in text:
              anchor = '\n### Financial exact state\n'
              if anchor not in text:
                  raise SystemExit('README domain anchor missing')
              text = text.replace(anchor, '\n' + spatial_section + '### Financial exact state\n', 1)
          doc_link = '- [`docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md`](docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md) — governed Spatial lifecycle, Construction projection, privacy, evidence, checkpoints, Agent Bridge/MCP/CLI, and dissolution boundaries\n'
          if doc_link not in text:
              anchor = '- [`docs/AURA_GATE.md`](docs/AURA_GATE.md)'
              if anchor not in text:
                  raise SystemExit('README documentation anchor missing')
              text = text.replace(anchor, doc_link + anchor, 1)
          text = text.replace('AR experiences, public information networks, module marketplaces, and real-world Construction/Financial connectors', 'production spatial/XR deployments, public information networks, module marketplaces, and real-world Construction/Financial connectors')
          readme.write_text(text)

          guide = root / 'USER_GUIDE.md'
          text = guide.read_text()
          if '## 19. Run the governed Spatial Arena and Construction projection' not in text:
              for old, new in [(24, 25), (23, 24), (22, 23), (21, 22), (20, 21), (19, 20)]:
                  text = text.replace(f'## {old}. ', f'## {new}. ')
              section = '''
          ## 19. Run the governed Spatial Arena and Construction projection

          Use the Spatial Arena when a canonical domain owner needs a bounded visual or spatial projection without transferring truth or authority into the renderer. The Construction adapter is the implemented S6 domain slice. It accepts an exact `ConstructionProjectState` and validated Construction runtime packet; untyped JSON cannot prepare a Construction projection.

          Validate the finite route first:

          ```bash
          python aura_spatial_cli.py --repo-root . validate-route
          ```

          Run the synthetic demonstration:

          ```bash
          python aura_spatial_cli.py --repo-root . synthetic-construction-demo
          ```

          The demo uses a temporary state root, synthetic fixtures, no private data, no production connector, and no persistent demonstration state. Its output includes exact scene/render-plan/proof/checkpoint/decision/dissolution identities and keeps physical work, payment, access control, and automatic merge false.

          The lifecycle is exact:

          ```text
          FRAME
          → GROUND
          → COMPILE_SCENE
          → PLAN_RENDER
          → PRESENT
          → INTERACT
          → PROVE
          → DECIDE
          → DISSOLVE
          ```

          Operator rules:

          - `FRAME` binds objective, actor reference, privacy class, egress policy, and purpose digest.
          - `GROUND` binds one canonical domain owner and exact state/evidence digests.
          - `COMPILE_SCENE` admits one immutable, referentially valid scene.
          - `PLAN_RENDER` deterministically intersects the scene, device profile, preferred renderers, and budgets.
          - `PRESENT` allocates only the bounded ephemeral projection session.
          - `INTERACT` compiles review-only selection/navigation intent; it cannot mutate domain state.
          - `PROVE` records render evidence, Attempt Archive evidence, and an assessment-only checkpoint. Generic agent/MCP proof is `DERIVED`; measured browser evidence must pass the exact telemetry validator.
          - `DECIDE` creates a human/domain packet only. It does not apply a decision.
          - `DISSOLVE` requires a cleanup receipt bound to the exact session, scene, and render plan. Allocated renderers report `DISPOSED`; headless/synthetic paths report `NOT_ALLOCATED`.

          Privacy classes are `PUBLIC`, `PROJECT`, `RESTRICTED`, and `SENSITIVE`. Restricted and sensitive runs are local-only. Public Construction projections hash project, scope, and candidate identifiers. Restricted/sensitive projections reject floor-plan geometry. Project-level floor plans must be local or Aura-addressed, privacy-compatible, explicitly `survey_authority=false`, and explicitly `person_level_data_included=false`.

          Python-typed preparation is available through `aura_spatial_prepare_construction`. JSON MCP intentionally exposes only post-preparation tools:

          ```text
          aura_spatial_status
          aura_spatial_interact
          aura_spatial_prove
          aura_spatial_decide
          aura_spatial_observatory
          aura_spatial_restore_assessment
          aura_spatial_dissolve
          ```

          Restore is assessment-only and never resumes automatically. Emergency close does not claim renderer cleanup; absent client evidence remains unobserved and unreleased. No Spatial packet can authorize Construction work, payment, access, equipment, inspection, safety, engineering, law, regulation, survey truth, source mutation, commit, push, pull request, or merge.

          See `docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md` for the canonical ownership and evidence contract.

          '''.replace('          ', '')
              anchor = '\n## 20. Use the Financial exact-state layer\n'
              if anchor not in text:
                  raise SystemExit('USER_GUIDE financial anchor missing')
              text = text.replace(anchor, '\n' + section + '## 20. Use the Financial exact-state layer\n', 1)
          guide.write_text(text)

          architecture = root / '.aura/ARCHITECTURE.md'
          text = architecture.read_text()
          if '<!-- AURA_SPATIAL_SUBSTRATE_S0_S6:START -->' not in text:
              start_marker = '<!-- AURA_SPATIAL_SUBSTRATE_S0_S2:START -->'
              end_marker = '<!-- AURA_SPATIAL_SUBSTRATE_S0_S2:END -->'
              if start_marker not in text or end_marker not in text:
                  raise SystemExit('ARCHITECTURE spatial block missing')
              start = text.index(start_marker)
              end = text.index(end_marker) + len(end_marker)
              block = '''<!-- AURA_SPATIAL_SUBSTRATE_S0_S6:START -->
          #### Spatial Arena projection and governed presentation substrate

          Aura's Spatial architecture is a representation-independent projection layer over retained domain owners. It does not become a second CODEMAP, Coding Arena, Civic map, Construction state, event store, renderer authority, checkpoint owner, or mutation path.

          ```text
          canonical domain truth
            → bounded privacy-aware domain adapter
            → immutable SpatialSceneSnapshot
            → deterministic device profile and render plan
            → ephemeral presentation session
            → review-only interaction
            → exact render evidence and assessment-only continuity
            → human/domain decision packet
            → client-bound cleanup evidence
            → lease/session dissolution
          ```

          The governed S5 route is finite:

          ```text
          FRAME → GROUND → COMPILE_SCENE → PLAN_RENDER → PRESENT
                → INTERACT → PROVE → DECIDE → DISSOLVE
          ```

          Canonical ownership is split deliberately:

          - `aura_spatial_contracts.py` owns immutable frame, asset, entity, link, scene, interaction, device, render-plan, receipt, and dissolution contracts;
          - `aura_spatial_coordinate_frames.py` validates rooted frames and deterministic transforms;
          - `aura_spatial_asset_registry.py` validates content-addressed manifests without fetching, decoding, training, or rendering;
          - `aura_spatial_scene.py` compiles immutable scenes and enforces referential integrity;
          - `aura_spatial_projection.py` provides bounded domain projections and reuses retained topology/Coding owners;
          - `aura_spatial_render_plan.py` owns deterministic device compilation and renderer negotiation;
          - `aura_spatial_session.py` owns ephemeral projection sessions and immutable render/dissolution receipts;
          - browser adapters provide bounded accessible, headless, WebGL2, shadow WebGPU, explicit-gesture WebXR, interaction, and telemetry surfaces;
          - S4-A importers admit bounded local glTF/GLB and PLY interchange as derived projection assets;
          - S4-B Gaussian interchange follows the pinned `KHR_gaussian_splatting` release-candidate profile, retains deterministic point-cloud/accessibility/headless fallbacks, and enforces pre-allocation/resource/disposal ceilings;
          - `aura_spatial_arena.py` owns the S5 lifecycle and binds purpose, privacy, domain state, scene, render plan, session, read-only capsule/boundary/lease, evidence, checkpoint, archive, cost, decision, and dissolution identities;
          - `aura_spatial_construction.py` is the Construction-only S6 projector over exact `ConstructionProjectState` and a validated Construction runtime packet;
          - `aura_spatial_agent_bridge.py`, `aura_agent_arena_persistence_bridge.py`, `aura_agent_arena_mcp.py`, and `aura_spatial_mcp.py` expose typed preparation and bounded post-prepare review tools;
          - `aura_arena_persistence_adapters.py` owns payload-minimized, assessment-only Spatial checkpoint projection;
          - `.aura/arena_routes/spatial.v1.json` is the finite route grammar.

          `FRAME` binds the normalized objective, purpose digest, privacy class, egress policy, actor, and source references. `GROUND` binds one canonical external domain owner and exact state/evidence digests. `COMPILE_SCENE` admits one immutable scene. `PLAN_RENDER` deterministically intersects scene requirements, device capability, preference, and resource ceilings. `PRESENT` creates only an ephemeral session. `INTERACT` remains review-only. `PROVE` records render evidence, Attempt Archive evidence, calculated cost, and a parent-linked assessment-only checkpoint. `DECIDE` compiles a packet for an authorized human or domain owner but cannot apply it. `DISSOLVE` releases the lease/session only after a cleanup receipt is bound to the exact session, scene, and render plan.

          Evidence classes remain explicit. Generic Agent/MCP proof defaults to `DERIVED`. Browser evidence may be `MEASURED` only through the exact scene/render-plan/device/fixture-bound telemetry validator. Client-reported renderer cleanup remains `CLIENT_REPORTED`; Aura never upgrades it to independently verified disposal. Allocated renderers report `DISPOSED`; headless/synthetic paths report `NOT_ALLOCATED`. Emergency close never fabricates cleanup and records unobserved/unreleased boundaries honestly.

          Spatial privacy classes are `PUBLIC`, `PROJECT`, `RESTRICTED`, and `SENSITIVE`; egress is `LOCAL_ONLY` or `ADMITTED_RENDER_WORKER`. Restricted and sensitive runs are local-only. External render work requires allowlisted workers, pre-admitted capability digests, a network-enabled device profile, and a positive byte budget. The admission baton contains only bounded worker/capability/manifest identities and exact scene/plan/domain/lease digests—never asset URIs, scene payloads, raw domain state, raw sensor data, or person-level data.

          The Construction S6 projector verifies the nested Action Capsule, Boundary Contract, Arena Lease, evaluation digest, candidate identities, proposal boundaries, and human-release boundaries before projection. It emits abstract project/scope/proposal state, aggregate counts, uncertainty/evaluation identities, and privacy-compatible local non-survey floor-plan manifests. It excludes event/evidence payloads, actor/claimant/worker/person identity, consent records, raw sensors, survey-authoritative coordinates, and every physical-work/payment/access/equipment/professional/legal/engineering/regulatory authority. Public identifiers are hashed; restricted/sensitive projections are abstract and reject floor-plan geometry.

          All scene coordinates, layouts, topology assets, meshes, point clouds, Gaussian manifests, renderer hints, gestures, gaze, anchors, visual selections, device profiles, telemetry, checkpoints, and decision packets retain:

          ```yaml
          patch_authority: exact_source_spans_and_hashes_only
          renderer_authority: false
          execution_authority: false
          automatic_resume: false
          automatic_merge: false
          ```

          Production OpenXR deployments, capture/reconstruction/training pipelines, remote asset delivery, unrestricted sensor ingestion, additional S6 domain adapters, and consequential S7 promotion remain separately governed programs.
          <!-- AURA_SPATIAL_SUBSTRATE_S0_S6:END -->'''.replace('          ', '')
              text = text[:start] + block + text[end:]
              owner_anchor = '| Arena lifecycle | Arena runtime, route, manifest, lease, receipt | Browser/CLI status | Worker process |\n'
              owner_rows = '| Spatial scene truth | Canonical domain owner plus immutable `SpatialSceneSnapshot` | Renderer, browser, accessibility, Observatory, and decision projections | Visual state, renderer cache, telemetry, or checkpoint |\n| Spatial presentation lifecycle | `aura_spatial_arena.py`, route grammar, exact session/render receipts, and read-only lease | Agent Bridge, MCP, CLI, browser adapters | Domain truth, Construction ledger, renderer authority, or automatic resume |\n'
              if owner_anchor not in text:
                  raise SystemExit('ARCHITECTURE ownership anchor missing')
              text = text.replace(owner_anchor, owner_anchor + owner_rows, 1)
              text = text.replace('- AR and spatial experiences beyond current prototypes;', '- production WebXR/OpenXR deployments, capture/reconstruction/training, remote rendering, and additional governed Spatial domain adapters;')
          architecture.write_text(text)

          Path('.github/workflows/aura-spatial-final-docs-temp.yml').unlink()
          PY

      - name: Regenerate and validate final CODEMAP and topology
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json

      - name: Verify Spatial exact-head gates after documentation synchronization
        run: |
          set -euo pipefail
          python -m py_compile aura_spatial_arena.py aura_spatial_construction.py aura_spatial_agent_bridge.py aura_spatial_mcp.py aura_spatial_cli.py
          python -m ruff check aura_spatial_arena.py aura_spatial_construction.py aura_spatial_agent_bridge.py aura_spatial_mcp.py aura_spatial_cli.py tests/test_aura_spatial*.py
          python aura_spatial_cli.py --repo-root . validate-route
          python -m pytest -q --tb=short tests/test_aura_spatial*.py

      - name: Commit final documentation and generated maps
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Final Documentation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test ! -e .github/workflows/aura-spatial-final-docs-temp.yml
          git diff --cached --check
          git commit -m "docs: finalize Spatial S5/S6 and regenerate CODEMAP"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"$TARGET_BRANCH"
          unset AUTH_HEADER
