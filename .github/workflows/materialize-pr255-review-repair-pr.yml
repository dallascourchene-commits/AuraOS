name: Materialize PR255 repair from temporary PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repair/pr255-intent-spatial-contracts-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract and verify the stored payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          workflow = pathlib.Path('.github/workflows/materialize-pr255-review-repair.yml').read_text()
          match = re.search(r"printf '%s' '([A-Za-z0-9+/=]+)'", workflow)
          if match is None:
              raise SystemExit('stored payload was not found')
          archive = base64.b64decode(match.group(1), validate=True)
          expected = '7ebefeaa3d00c6b2324dd7974fffb525ef7afe88e59f7c0db5e1317ba0b4126b'
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'payload hash mismatch: {actual}')
          pathlib.Path('/tmp/pr255-review-repair.tar.gz').write_bytes(archive)
          PY
          tar -xzf /tmp/pr255-review-repair.tar.gz -C .
          rm -f .github/workflows/materialize-pr255-review-repair.yml
          rm -f .github/workflows/materialize-pr255-review-repair-pr.yml
          rm -f .aura/pr255_materialize_trigger
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python -m json.tool schemas/aura_project_context_projection.schema.json >/dev/null
          python -m json.tool schemas/aura_ephemeral_workspace_recipe.schema.json >/dev/null
          python -m json.tool schemas/aura_multimodal_spatial_observation.schema.json >/dev/null
          python -m pytest -q tests/test_aura_ephemeral_workspace_contracts.py
      - name: Commit the exact clean repair tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Review Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git commit -m 'fix(pr1): resolve exhaustive review findings'
          git push origin HEAD:${{ github.head_ref }}
