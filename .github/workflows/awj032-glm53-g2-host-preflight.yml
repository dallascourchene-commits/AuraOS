name: AWJ032 GLM53 G2 host canary preflight

on:
  pull_request:
    paths:
      - 'tools/awj032/glm53_backend_io_evidence_guard.py'
      - 'tools/awj032/test_glm53_backend_io_evidence_guard.py'
      - 'tools/awj032/glm53_host_canary_preflight.py'
      - 'tools/awj032/test_glm53_host_canary_preflight.py'
      - '.github/workflows/awj032-glm53-g2-host-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-preflight-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile W4 evidence and host preflight
        run: >-
          python -m py_compile
          tools/awj032/glm53_backend_io_evidence_guard.py
          tools/awj032/test_glm53_backend_io_evidence_guard.py
          tools/awj032/glm53_host_canary_preflight.py
          tools/awj032/test_glm53_host_canary_preflight.py
      - name: Re-run W4 backend evidence guard regressions
        working-directory: tools/awj032
        run: python -m unittest -v test_glm53_backend_io_evidence_guard.py
      - name: Run host/canary preflight regressions
        working-directory: tools/awj032
        run: python -m unittest -v test_glm53_host_canary_preflight.py
