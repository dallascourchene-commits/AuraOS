name: UMC Greptile review fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/umc-greptile-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: efbde812675bcce330198cf6937fd9c1a105cb60
      TARGET_BRANCH: refactor/unified-memory-continuity
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply transparent Greptile fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain=v1)"

          python - <<'PY'
          from pathlib import Path

          module_path = Path('aura_unified_memory_continuity.py')
          module = module_path.read_text(encoding='utf-8')
          old_guard = '''    if _timestamp(timestamp, "observed_at") < prediction.committed_at:
                  raise ValueError("P1 cannot precede P0")
          '''
          new_guard = '''    if _timestamp(timestamp, "observed_at") <= prediction.committed_at:
                  raise ValueError("P1 must occur strictly after P0")
          '''
          if module.count(old_guard) != 1:
              raise SystemExit('observe_prediction timestamp guard is ambiguous')
          module_path.write_text(module.replace(old_guard, new_guard, 1), encoding='utf-8')

          tests_path = Path('tests/test_aura_unified_memory_continuity.py')
          tests = tests_path.read_text(encoding='utf-8')
          old_test = '''def test_p1_cannot_precede_p0() -> None:
              intent, _, _, _, _, _, prediction, _, _ = _vertical_fixture()
              with pytest.raises(ValueError, match="cannot precede"):
                  observe_prediction(
                      prediction=prediction,
                      p0_digest=prediction.p0_digest,
                      objective_digest=intent.intent_digest,
                      purpose_digest=stable_digest(intent.purpose),
                      repository_head=HEAD,
                      source_digest=SOURCE_DIGEST,
                      observed_state_delta=(),
                      observed_evidence_refs=("test:pass",),
                      observed_cost={},
                      missing_measurements=(),
                      observer_id="observer",
                      observed_at=59.0,
                  )
          '''
          new_test = '''@pytest.mark.parametrize("observed_at", (59.0, 60.0))
          def test_p1_must_strictly_follow_p0(observed_at: float) -> None:
              intent, _, _, _, _, _, prediction, _, _ = _vertical_fixture()
              with pytest.raises(ValueError, match="strictly after"):
                  observe_prediction(
                      prediction=prediction,
                      p0_digest=prediction.p0_digest,
                      objective_digest=intent.intent_digest,
                      purpose_digest=stable_digest(intent.purpose),
                      repository_head=HEAD,
                      source_digest=SOURCE_DIGEST,
                      observed_state_delta=(),
                      observed_evidence_refs=("test:pass",),
                      observed_cost={},
                      missing_measurements=(),
                      observer_id="observer",
                      observed_at=observed_at,
                  )
          '''
          if tests.count(old_test) != 1:
              raise SystemExit('P1 timestamp regression block is ambiguous')
          tests_path.write_text(tests.replace(old_test, new_test, 1), encoding='utf-8')
          PY

          git rm -- \
            .github/workflows/unified-memory-continuity-final-66-materialize.yml \
            .aura/refactor_payloads/umc_deep_review.retry \
            .aura/refactor_payloads/umc_final_66.trigger \
            .aura/refactor_payloads/umc_publish_66.trigger \
            .aura/refactor_payloads/umc_verified_sync.trigger

          git diff --check
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' jsonschema ruff bandit
          python -m py_compile aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          ruff check aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          bandit -q -ll aura_unified_memory_continuity.py
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_relationship_compass_finalization.py

          git add -- \
            aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity.py

          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-paths.txt"
          printf '%s\n' \
            .aura/refactor_payloads/umc_deep_review.retry \
            .aura/refactor_payloads/umc_final_66.trigger \
            .aura/refactor_payloads/umc_publish_66.trigger \
            .aura/refactor_payloads/umc_verified_sync.trigger \
            .github/workflows/unified-memory-continuity-final-66-materialize.yml \
            aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity.py \
            | sort > "${RUNNER_TEMP}/expected-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/actual-paths.txt"

          latest="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$latest" = "$EXPECTED_HEAD"

          git config user.name 'AuraOS Greptile Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: address Greptile continuity review'
          git push origin "HEAD:${TARGET_BRANCH}"
