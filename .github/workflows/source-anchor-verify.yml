name: Verify source anchors

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
      - "analysis/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: source-anchor-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-anchors:
    name: Verify CODEMAP source anchors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source-anchor navigation tools
        run: |
          python -m py_compile \
            scripts/aura_source_anchor_map.py \
            scripts/aura_navigation_refresh.py
      - name: Verify committed anchor projection matches committed CODEMAP
        run: |
          python scripts/aura_source_anchor_map.py --root . --check
      - name: Run deterministic source-anchor regressions
        run: |
          python -m pip install --disable-pip-version-check "pytest>=8.2,<9.0"
          python -m pytest -q tests/test_aura_source_anchor_map.py
