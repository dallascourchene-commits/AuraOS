name: PR166 Final Codex Repair

on:
  push:
    branches:
      - feature/aura-spatial-s3a-render-session
    paths:
      - .github/workflows/pr166-final-codex-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact repair branch without checkout action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=2 origin feature/aura-spatial-s3a-render-session
          git checkout -B feature/aura-spatial-s3a-render-session FETCH_HEAD

      - name: Assert exact staged parent
        working-directory: repo
        run: test "$(git rev-parse HEAD^)" = "fffdd2d406e114d4f7541c357d820758c77d39da"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact manual repair
        working-directory: repo
        run: python scripts/pr166_final_codex_fix.py

      - name: Install verifier dependencies
        working-directory: repo
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Validate formatting and syntax
        working-directory: repo
        run: |
          ruff check aura_source_integrity.py tests/test_aura_source_integrity.py
          python -m py_compile aura_source_integrity.py tests/test_aura_source_integrity.py

      - name: Run focused source-integrity regressions
        working-directory: repo
        run: python -m pytest -q --tb=short tests/test_aura_source_integrity.py

      - name: Publish verified source and regression only
        working-directory: repo
        run: |
          rm scripts/pr166_final_codex_fix.py
          git diff --check
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add aura_source_integrity.py tests/test_aura_source_integrity.py scripts/pr166_final_codex_fix.py
          git commit -m "Recheck source identity immediately before mutation"
          git push origin HEAD:feature/aura-spatial-s3a-render-session
