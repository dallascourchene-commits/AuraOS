name: Materialize U6-U7 learning-to-reproof

on:
  push:
    branches:
      - analysis/u7-materialize-20260725

permissions:
  contents: write
  statuses: write

env:
  PYTHONPATH: ${{ github.workspace }}
  U7_BASE_SHA: de573d16ebf145c1b52487903d4a3d24a977ffc0

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/u7-materialize-20260725
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$U7_BASE_SHA"
          cat .aura/analysis/u7_payload_0.txt \
              .aura/analysis/u7_payload_1.txt \
              .aura/analysis/u7_payload_2.txt \
              .aura/analysis/u7_payload_3.txt > /tmp/u7.patch.gz.b64
          echo '1c5be8d5a765fad43200c24ef8f18613364ce3b2389449474e088281a89fa97f  /tmp/u7.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/u7.patch.gz.b64 | gzip -dc > /tmp/u7.patch
          echo '7262bbb29af42e6a47196f0950c33a909c206252e7fe9c0b2506fdcf33d66481  /tmp/u7.patch' | sha256sum -c -
          git reset --hard "$U7_BASE_SHA"
          git apply --check /tmp/u7.patch
          git apply /tmp/u7.patch

      - name: Install focused verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy>=1.26.4,<3.0' \
            'websockets>=12.0,<17.0' \
            'aiosqlite>=0.20.0,<1.0' \
            'ddgs>=6.0,<10.0' \
            'wasmtime>=20.0,<46.0' \
            'aiohttp>=3.9.0,<4.0' \
            'beautifulsoup4>=4.12.0,<5.0' \
            'httpx>=0.27.0,<1.0' \
            'cryptography>=41.0.0,<45.0' \
            pytest pytest-asyncio ruff

      - name: Run diagnostic verification matrix
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p u7-materializer-diagnostics
          FILES=(
            aura_agent_arena_bridge.py
            aura_agent_arena_mcp.py
            aura_arena_persistence_adapters.py
            aura_qdkt_observations.py
            aura_relationship_experience.py
            aura_unified_memory_continuity_learning.py
            aura_unified_memory_continuity_toolchain.py
            tests/test_aura_unified_memory_continuity_learning.py
          )
          ruff format "${FILES[@]}" > u7-materializer-diagnostics/ruff-format.log 2>&1
          echo $? > u7-materializer-diagnostics/ruff-format.exit
          ruff check --select E9,F63,F7,F82 "${FILES[@]}" > u7-materializer-diagnostics/ruff-check.log 2>&1
          echo $? > u7-materializer-diagnostics/ruff-check.exit
          python -m py_compile \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            > u7-materializer-diagnostics/py-compile.log 2>&1
          echo $? > u7-materializer-diagnostics/py-compile.exit
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_qdkt_observations.py \
            > u7-materializer-diagnostics/pytest.log 2>&1
          echo $? > u7-materializer-diagnostics/pytest.exit

          for path in \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json; do
            if git cat-file -e "$U7_BASE_SHA:$path" 2>/dev/null; then
              git checkout "$U7_BASE_SHA" -- "$path"
            fi
          done

          git diff --check > u7-materializer-diagnostics/diff-check.log 2>&1
          echo $? > u7-materializer-diagnostics/diff-check.exit
          printf '%s\n' \
            .aura/waboose_requests/unified_memory_continuity_learning.v1.json \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py \
            | sort > u7-materializer-diagnostics/expected-files.txt
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | grep -v '^u7-materializer-diagnostics/' | sort -u \
            > u7-materializer-diagnostics/actual-files.txt
          diff -u \
            u7-materializer-diagnostics/expected-files.txt \
            u7-materializer-diagnostics/actual-files.txt \
            > u7-materializer-diagnostics/file-scope.log 2>&1
          echo $? > u7-materializer-diagnostics/file-scope.exit
          git diff --stat > u7-materializer-diagnostics/diff-stat.txt
          git status --short > u7-materializer-diagnostics/status.txt
          cat u7-materializer-diagnostics/*.exit
          exit 0

      - name: Upload materializer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u7-materializer-diagnostics-${{ github.run_id }}
          path: u7-materializer-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce verification matrix
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for path in u7-materializer-diagnostics/*.exit; do
            code="$(cat "$path")"
            if [ "$code" != '0' ]; then
              echo "FAILED: $path exit=$code"
              failed=1
            fi
          done
          if [ "$failed" != '0' ]; then
            exit 1
          fi

      - name: Publish one clean verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS U7 Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .aura/waboose_requests/unified_memory_continuity_learning.v1.json \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py
          git commit -m 'refactor: complete governed learning-to-reproof runtime'
          git push origin HEAD:refs/heads/feature/unified-memory-learning-to-reproof --force

      - name: Publish materializer status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          STATE='success'
          if [ '${{ job.status }}' != 'success' ]; then STATE='failure'; fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context='aura-u7-materializer' \
            -f description="U6-U7 materializer: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
