name: P3.1 Planning event projection

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: p3-1-planning-events-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-planning-events:
    name: Planning events (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile planning event contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            aura_planning_regression.py \
            aura_planning_frontier.py \
            aura_planning_events.py \
            tests/test_aura_planning_events.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_planning_events.py \
            tests/test_aura_planning_events.py
      - name: Run focused planning event tests
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_regression.py \
            tests/test_aura_planning_regression_adversarial.py \
            tests/test_aura_planning_frontier.py \
            tests/test_aura_planning_events.py

  repair-c6-c9-review-findings:
    name: Repair Codex and CodeRabbit findings
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/coding-relationship-compass-c6-c9-20260721' && github.actor != 'github-actions[bot]'
    needs: focused-planning-events
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: work/coding-relationship-compass-c6-c9-20260721
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct and apply exact review repair
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet origin "$TARGET_BRANCH"
          git checkout -q -B "$TARGET_BRANCH" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          tr -d '\r\n' < .github/c6-c9-review-fix.py.gz.b64 | base64 -d | gzip -d > /tmp/c6-c9-review-fix.py
          echo 'b1d9e5cb7d79e1fa180bb3ddef2d25dc78102a8fc9d7bea907b744ce1197dd72  /tmp/c6-c9-review-fix.py' | sha256sum -c -
          git reset --hard 4ffdb6f6cb9c3b189ed79b56ed2fe4b3ef448764
          python /tmp/c6-c9-review-fix.py
          git diff --check
          printf '%s\n' \
            aura_agent_arena_persistence_bridge.py \
            aura_arena_experience_ledger.py \
            aura_change_graph.py \
            aura_coding_relationship_compass.py \
            aura_emergent_result_verifier.py \
            tests/test_aura_relationship_compass_finalization.py \
            | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Diagnose finalization and Compass compile
        run: |
          set -euo pipefail
          python3 -m venv /tmp/c6-c9-review-venv
          . /tmp/c6-c9-review-venv/bin/activate
          python -m pip install --quiet pytest==9.0.2 jsonschema==4.26.0 numpy==2.3.5
          python -m py_compile \
            aura_agent_arena_persistence_bridge.py \
            aura_arena_experience_ledger.py \
            aura_change_graph.py \
            aura_coding_relationship_compass.py \
            aura_emergent_result_verifier.py \
            tests/test_aura_relationship_compass_finalization.py
          PYTHONPATH=. pytest -q --tb=line \
            tests/test_aura_relationship_compass_finalization.py \
            tests/test_aura_coding_relationship_compass.py::test_compile_compass_combines_all_four_planes
      - name: Publish clean review repair commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aura_agent_arena_persistence_bridge.py \
            aura_arena_experience_ledger.py \
            aura_change_graph.py \
            aura_coding_relationship_compass.py \
            aura_emergent_result_verifier.py \
            tests/test_aura_relationship_compass_finalization.py
          git commit -m "fix: resolve C6-C9 Codex and CodeRabbit findings"
          NEW_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/${TARGET_BRANCH}:$EXPECTED_HEAD \
            origin "$NEW_HEAD":refs/heads/${TARGET_BRANCH}
