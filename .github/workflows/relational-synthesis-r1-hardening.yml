name: Relational Synthesis R1 Hardening

on:
  pull_request:
    branches:
      - main
      - feature/aura-relational-synthesis-r1
    paths:
      - .github/workflows/relational-synthesis-r1-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' bandit

      - name: Apply reviewed proof-bound patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/relational-synthesis-r1-proof-hardening.yml'
          ).read_text(encoding='utf-8')
          step = '      - name: Keep inferred roles and test meaning proof-bound\n'
          step_start = workflow.index(step)
          marker = "          python - <<'PY'\n"
          script_start = workflow.index(marker, step_start) + len(marker)
          script_end = workflow.index('\n          PY\n', script_start)
          lines = workflow[script_start:script_end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          exec(compile(script, 'relational-proof-hardening', 'exec'))

          # The embedded function literals are stored inside a YAML run block.
          # Lines whose intended indentation was >=10 spaces can lose the YAML
          # base indent during extraction, producing a residue of 2 modulo 4.
          # Valid Python indentation in these files is four-space aligned, so
          # repair only that impossible residue and leave all other lines exact.
          for target in (
              Path('aura_relational_synthesis.py'),
              Path('tests/test_aura_relational_synthesis.py'),
          ):
              repaired: list[str] = []
              for line in target.read_text(encoding='utf-8').splitlines():
                  indent = len(line) - len(line.lstrip(' '))
                  if line.strip() and indent % 4 == 2:
                      line = (' ' * 10) + line
                  repaired.append(line)
              target.write_text('\n'.join(repaired) + '\n', encoding='utf-8')
          PY

      - name: Compile hardened contracts
        run: |
          set -o pipefail
          python -m py_compile aura_relational_synthesis.py tests/test_aura_relational_synthesis.py \
            2>&1 | tee /tmp/relational-proof-compile.log

      - name: Run hardened regressions
        run: |
          set -o pipefail
          python -m pytest -q tests/test_aura_relational_synthesis.py \
            2>&1 | tee /tmp/relational-proof-pytest.log

      - name: Run hardened Ruff gate
        run: |
          set -o pipefail
          ruff check --select E9,F63,F7,F82 \
            aura_relational_synthesis.py tests/test_aura_relational_synthesis.py \
            2>&1 | tee /tmp/relational-proof-ruff.log

      - name: Run hardened Bandit gate
        run: |
          set -o pipefail
          bandit -q -ll aura_relational_synthesis.py \
            2>&1 | tee /tmp/relational-proof-bandit.log

      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relational-r1-proof-hardening-diagnostics
          path: |
            /tmp/relational-proof-compile.log
            /tmp/relational-proof-pytest.log
            /tmp/relational-proof-ruff.log
            /tmp/relational-proof-bandit.log
            aura_relational_synthesis.py
            tests/test_aura_relational_synthesis.py
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push validated permanent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aura_relational_synthesis.py tests/test_aura_relational_synthesis.py docs/AURA_RELATIONAL_SYNTHESIS_REFACTOR_PLAN.md
          git diff --cached --check
          git commit -m 'Keep relational role inference proof-bound'
          git push origin HEAD:feature/aura-relational-synthesis-r1
