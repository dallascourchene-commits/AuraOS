name: Bootstrap and finalize P1.1 relational authority

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/p1-1-bootstrap.yml
  push:
    branches:
      - refactor/relational-authority-p1-1
    paths:
      - .github/workflows/p1-1-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: p1-1-bootstrap
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relational-authority-p1-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Decode staged P1.1 sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zlib

          payloads = {
              "aura_relational_authority.py": ".p1_payload/authority.b64",
              "tests/test_aura_event_privacy_hardening.py": ".p1_payload/privacy_tests.b64",
              "tests/test_aura_relational_authority.py": ".p1_payload/authority_tests.b64",
              "tests/test_aura_workflow_authority_bridge.py": ".p1_payload/bridge_tests.b64",
              "scripts/p1_1_finalize.py": ".p1_payload/finalizer.b64",
          }
          for target, payload_path in payloads.items():
              encoded = Path(payload_path).read_text(encoding="utf-8").strip()
              decoded = zlib.decompress(base64.b64decode(encoded))
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decoded)
              print(f"decoded {target}")
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff

      - name: Apply canonical P1.1 changes
        id: apply_changes
        continue-on-error: true
        run: python scripts/p1_1_finalize.py > p1-1-finalizer.log 2>&1

      - name: Upload finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-1-finalizer-${{ github.run_id }}
          path: p1-1-finalizer.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce finalizer result
        if: steps.apply_changes.outcome != 'success'
        run: |
          cat p1-1-finalizer.log
          exit 1

      - name: Validate focused contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_relational_authority.py \
            aura_workflow_gates.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py
          ruff check --select E9,F63,F7,F82 \
            aura_event_contracts.py \
            aura_relational_authority.py \
            aura_workflow_gates.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py \
            tests/test_aura_workflow_gates.py

      - name: Remove one-shot staging artifacts
        run: |
          rm -rf .p1_payload
          rm -f scripts/p1_1_finalize.py
          rm -f p1-1-finalizer.log
          rm -f .github/workflows/p1-1-bootstrap.yml

      - name: Regenerate navigation artifacts
        run: python aura_codebase_navigator.py

      - name: Commit finalized P1.1 implementation
        run: |
          git config user.name "AuraOS Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(governance): add action-bound relational authority"
          git push origin HEAD:refactor/relational-authority-p1-1
