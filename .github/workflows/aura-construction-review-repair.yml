name: Aura Construction Deep Review Repair

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-review-repair.yml"
      - "aura_spatial_web/construction_overlay_pass.js"
      - "aura_spatial_web/construction_scene_renderer.js"
      - "tests/js/spatial-construction-demo.test.mjs"

permissions:
  contents: write

concurrency:
  group: aura-construction-deep-review-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact pull-request head
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth=128 --branch "$HEAD_REF" "https://github.com/${HEAD_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded deep-review repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: expected one repair span")
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if new not in text:
                  raise SystemExit(f"{path}: neither old nor repaired span is present")

          renderer = "aura_spatial_web/construction_scene_renderer.js"
          replace_once(
              renderer,
              "    this.presentationTransforms = new Map();\n    this.hasMeshes = false;\n",
              "    this.presentationTransforms = new Map();\n    this.basePresentationTransforms = new Map();\n    this.hasMeshes = false;\n",
          )
          replace_once(
              renderer,
              "    this.hasMeshes = this.scene.assets.some((item) => item.asset_type === \"MESH\");\n"
              "    this.hasSplats = this.scene.assets.some((item) => item.asset_type === \"GAUSSIAN_SPLAT\");\n"
              "    this.storeyFrames = Object.freeze(\n",
              "    this.hasMeshes = this.scene.assets.some((item) => item.asset_type === \"MESH\");\n"
              "    this.hasSplats = this.scene.assets.some((item) => item.asset_type === \"GAUSSIAN_SPLAT\");\n"
              "    if (this.hasSplats) {\n"
              "      const invalidManifest = this.scene.assets.some(\n"
              "        (asset) =>\n"
              "          asset.asset_type === \"GAUSSIAN_SPLAT\" &&\n"
              "          (asset.metadata?.gaussian_sh_degree !== 0 || asset.metadata?.sh_degree !== 0),\n"
              "      );\n"
              "      const invalidPayload = gaussianPayloads.some((payload) => payload?.sh_degree !== 0);\n"
              "      if (invalidManifest || invalidPayload) {\n"
              "        this.state = RENDERER_STATES.LOST;\n"
              "        throw new TypeError(\"Construction renderer accepts degree-0 Gaussian SPZ assets only\");\n"
              "      }\n"
              "    }\n"
              "    this.storeyFrames = Object.freeze(\n",
          )
          replace_once(
              renderer,
              "    for (const frameId of this.storeyFrames) {\n"
              "      this.presentationTransforms.set(frameId, Object.freeze({\n"
              "        translation: Object.freeze([0, 0, 0]),\n"
              "        rotation_xyzw: Object.freeze([0, 0, 0, 1]),\n"
              "        scale: Object.freeze([1, 1, 1]),\n"
              "      }));\n"
              "    }\n",
              "    const rawFrames = new Map(scenePayload.frames.map((frame) => [frame.frame_id, frame]));\n"
              "    for (const frameId of this.storeyFrames) {\n"
              "      const frame = rawFrames.get(frameId);\n"
              "      if (!frame) throw new TypeError(\"Construction storey frame is missing\");\n"
              "      const transform = Object.freeze({\n"
              "        translation: Object.freeze([...frame.translation]),\n"
              "        rotation_xyzw: Object.freeze([...frame.rotation_xyzw]),\n"
              "        scale: Object.freeze([...frame.scale]),\n"
              "      });\n"
              "      this.basePresentationTransforms.set(frameId, transform);\n"
              "      this.presentationTransforms.set(frameId, transform);\n"
              "    }\n",
          )
          replace_once(
              renderer,
              "      this.meshPass.initialize(scenePayload, meshPayloads);\n"
              "      this.overlayPass.initialize(scenePayload);\n"
              "      if (this.hasSplats) {\n",
              "      this.meshPass.initialize(scenePayload, meshPayloads);\n"
              "      this.overlayPass.initialize(scenePayload);\n"
              "      for (const [frameId, transform] of this.presentationTransforms) {\n"
              "        if (this.scene.assets.some((asset) => asset.asset_type === \"MESH\" && asset.frame_id === frameId)) {\n"
              "          this.meshPass.setPresentationTransform(frameId, transform);\n"
              "        }\n"
              "        this.overlayPass.setPresentationTransform(frameId, transform);\n"
              "      }\n"
              "      if (this.hasSplats) {\n",
          )
          old_explode = '''  explodeStoreys(spacing = 3) {
              const amount = finite(spacing, "explode spacing");
              if (amount < 0 || amount > 100) throw new RangeError("explode spacing must be in [0, 100]");
              this.storeyFrames.forEach((frameId, index) => {
                const transform = Object.freeze({
                  translation: Object.freeze([0, index * amount, 0]),
                  rotation_xyzw: Object.freeze([0, 0, 0, 1]),
                  scale: Object.freeze([1, 1, 1]),
                });
                this.presentationTransforms.set(frameId, transform);
                this.meshPass.setPresentationTransform(frameId, transform);
              });
            }
          '''
          new_explode = '''  explodeStoreys(spacing = 3) {
              const amount = finite(spacing, "explode spacing");
              if (amount < 0 || amount > 100) throw new RangeError("explode spacing must be in [0, 100]");
              this.storeyFrames.forEach((frameId, index) => {
                const base = this.basePresentationTransforms.get(frameId);
                const transform = Object.freeze({
                  translation: Object.freeze([
                    base.translation[0],
                    base.translation[1] + index * amount,
                    base.translation[2],
                  ]),
                  rotation_xyzw: base.rotation_xyzw,
                  scale: base.scale,
                });
                this.presentationTransforms.set(frameId, transform);
                if (this.scene.assets.some((asset) => asset.asset_type === "MESH" && asset.frame_id === frameId)) {
                  this.meshPass.setPresentationTransform(frameId, transform);
                }
                this.overlayPass.setPresentationTransform(frameId, transform);
              });
            }
          '''
          replace_once(renderer, old_explode, new_explode)
          old_collapse = '''  collapseStoreys() {
              this.meshPass.resetPresentationTransforms();
              for (const frameId of this.storeyFrames) {
                this.presentationTransforms.set(frameId, Object.freeze({
                  translation: Object.freeze([0, 0, 0]),
                  rotation_xyzw: Object.freeze([0, 0, 0, 1]),
                  scale: Object.freeze([1, 1, 1]),
                }));
              }
            }
          '''
          new_collapse = '''  collapseStoreys() {
              for (const frameId of this.storeyFrames) {
                const transform = this.basePresentationTransforms.get(frameId);
                this.presentationTransforms.set(frameId, transform);
                if (this.scene.assets.some((asset) => asset.asset_type === "MESH" && asset.frame_id === frameId)) {
                  this.meshPass.setPresentationTransform(frameId, transform);
                }
                this.overlayPass.setPresentationTransform(frameId, transform);
              }
            }
          '''
          replace_once(renderer, old_collapse, new_collapse)
          replace_once(
              renderer,
              "    this.presentationTransforms.clear();\n    this.storeyFrames = Object.freeze([]);\n",
              "    this.presentationTransforms.clear();\n    this.basePresentationTransforms.clear();\n    this.storeyFrames = Object.freeze([]);\n",
          )

          overlay = "aura_spatial_web/construction_overlay_pass.js"
          replace_once(
              overlay,
              "function deepFreeze(value) {\n",
              "function canonicalTransform(value, label = \"presentation_transform\") {\n"
              "  const source = value || {};\n"
              "  const vector = (item, length, name, fallback) => {\n"
              "    const candidate = item ?? fallback;\n"
              "    if (!Array.isArray(candidate) || candidate.length !== length || candidate.some((part) => typeof part !== \"number\" || !Number.isFinite(part))) {\n"
              "      throw new TypeError(`${label}.${name} must be a finite ${length}-vector`);\n"
              "    }\n"
              "    return Object.freeze([...candidate]);\n"
              "  };\n"
              "  const scale = vector(source.scale, 3, \"scale\", [1, 1, 1]);\n"
              "  if (scale.some((item) => item <= 0)) throw new RangeError(`${label}.scale must remain positive`);\n"
              "  return Object.freeze({\n"
              "    translation: vector(source.translation, 3, \"translation\", [0, 0, 0]),\n"
              "    rotation_xyzw: vector(source.rotation_xyzw, 4, \"rotation_xyzw\", [0, 0, 0, 1]),\n"
              "    scale,\n"
              "  });\n"
              "}\n\n"
              "function deepFreeze(value) {\n",
          )
          replace_once(
              overlay,
              "    this.visibleFrameIds = null;\n    this.disposer = null;\n",
              "    this.visibleFrameIds = null;\n    this.presentationTransforms = new Map();\n    this.disposer = null;\n",
          )
          replace_once(
              overlay,
              "    validateSceneProjection(scenePayload);\n    this.scene = deepFreeze(structuredClone(scenePayload));\n    this.initialized = true;\n",
              "    validateSceneProjection(scenePayload);\n    this.scene = deepFreeze(structuredClone(scenePayload));\n    for (const frame of this.scene.frames) {\n      this.presentationTransforms.set(frame.frame_id, canonicalTransform(frame));\n    }\n    this.initialized = true;\n",
          )
          replace_once(
              overlay,
              "  _frameVisible(frameId) {\n",
              "  setPresentationTransform(frameId, transform) {\n"
              "    if (!this.presentationTransforms.has(frameId)) {\n"
              "      throw new RangeError(\"unknown Construction overlay frame\");\n"
              "    }\n"
              "    this.presentationTransforms.set(frameId, canonicalTransform(transform));\n"
              "  }\n\n"
              "  resetPresentationTransforms() {\n"
              "    for (const frame of this.scene.frames) {\n"
              "      this.presentationTransforms.set(frame.frame_id, canonicalTransform(frame));\n"
              "    }\n"
              "  }\n\n"
              "  _frameVisible(frameId) {\n",
          )
          replace_once(
              overlay,
              "    const model = {\n      version: CONSTRUCTION_OVERLAY_PASS_VERSION,\n",
              "    const presentationTransform = (frameId) =>\n"
              "      this.presentationTransforms.get(frameId) || canonicalTransform(null);\n"
              "    const model = {\n"
              "      version: CONSTRUCTION_OVERLAY_PASS_VERSION,\n"
              "      presentation_transforms: Object.freeze(\n"
              "        Object.fromEntries(\n"
              "          [...this.presentationTransforms.entries()]\n"
              "            .sort(([left], [right]) => left.localeCompare(right)),\n"
              "        ),\n"
              "      ),\n",
          )
          replacements = [
              ("              source_transform_immutable: true,\n", "              source_transform_immutable: true,\n              presentation_transform: presentationTransform(item.frame_id),\n"),
              ("              label: item.label,\n            }))\n        : [],\n      trades", "              label: item.label,\n              presentation_transform: presentationTransform(item.frame_id),\n            }))\n        : [],\n      trades"),
              ("            .map((item) => ({ entity_id: item.entity_id, label: item.label }))\n", "            .map((item) => ({\n              entity_id: item.entity_id,\n              label: item.label,\n              presentation_transform: presentationTransform(item.frame_id),\n            }))\n"),
              ("              scheduled_day: item.metadata?.scheduled_day ?? null,\n", "              scheduled_day: item.metadata?.scheduled_day ?? null,\n              presentation_transform: presentationTransform(item.frame_id),\n"),
              ("              regulatory_authority: false,\n", "              regulatory_authority: false,\n              presentation_transform: presentationTransform(item.frame_id),\n"),
          ]
          for old, new in replacements:
              replace_once(overlay, old, new)
          replace_once(
              overlay,
              "      this.visibleFrameIds = null;\n      this.initialized = false;\n",
              "      this.visibleFrameIds = null;\n      this.presentationTransforms.clear();\n      this.initialized = false;\n",
          )

          tests = Path("tests/js/spatial-construction-demo.test.mjs")
          text = tests.read_text(encoding="utf-8")
          text = text.replace(
              '  assert.deepEqual(renderer.getAssetPresentationTransform("asset:splats").translation, [0, 0, 0]);\n',
              '  assert.deepEqual(renderer.getAssetPresentationTransform("asset:splats").translation, [0, 4, 0]);\n',
              1,
          )
          marker = "  assert.equal(receipt.overlay_receipt.model.dependencies.length, 0);\n"
          addition = marker + "  assert.deepEqual(\n    receipt.overlay_receipt.model.floor_plans[0].presentation_transform.translation,\n    [0, 4, 0],\n  );\n"
          if addition not in text:
              if marker not in text:
                  raise SystemExit("focused overlay assertion anchor is missing")
              text = text.replace(marker, addition, 1)
          marker = "  renderer.isolateStorey(\"frame:storey\");\n"
          addition = (
              "  renderer.explodeStoreys(3);\n"
              "  assert.deepEqual(\n"
              "    renderer.getAssetPresentationTransform(\"asset:splats:second\").translation,\n"
              "    [0, 11, 0],\n"
              "  );\n"
              "  assert.deepEqual(\n"
              "    renderer.overlayPass.buildModel().presentation_transforms[\"frame:storey:second\"].translation,\n"
              "    [0, 11, 0],\n"
              "  );\n"
              "  renderer.collapseStoreys();\n"
              "  assert.deepEqual(\n"
              "    renderer.getAssetPresentationTransform(\"asset:splats:second\").translation,\n"
              "    [0, 8, 0],\n"
              "  );\n\n"
              + marker
          )
          if addition not in text:
              if marker not in text:
                  raise SystemExit("storey isolation assertion anchor is missing")
              text = text.replace(marker, addition, 1)
          degree_test = '''

test("Construction renderer rejects non-degree-0 splats before renderer initialization", async () => {
  const { scene, plan } = constructionFixture();
  const gaussianManifest = scene.assets.find((asset) => asset.asset_id === "asset:splats");
  gaussianManifest.metadata.sh_degree = 2;
  gaussianManifest.metadata.gaussian_sh_degree = 2;
  gaussianManifest.metadata.representation_bytes_per_splat = 156;
  const presentation = new TestPresentationRenderer();
  const renderer = new ConstructionSceneRenderer({
    presentationRenderer: presentation,
    meshPass: new ConstructionMeshPass({ drawMeshPass: async () => () => {} }),
    overlayPass: new ConstructionOverlayPass(),
    gaussianRenderer: new GaussianRenderer({
      presentationRenderer: presentation,
      drawGaussianPass: async () => () => {},
      now: () => 0,
    }),
  });
  const altered = {
    ...gaussianPayload(),
    sh_degree: 2,
    sh_coefficients: [Array.from({ length: 27 }, () => 0)],
  };
  await assert.rejects(
    renderer.initialize(scene, plan, {
      meshPayloads: [{
        asset_id: "asset:mesh",
        source_digest: "1".repeat(64),
        decoded_byte_length: 256,
        resource: { local: true },
      }],
      gaussianPayloads: [altered],
    }),
    /degree-0/,
  );
  assert.equal(renderer.status().state, "LOST");
  assert.equal(presentation.disposed, 0);
});
'''
          if degree_test.strip() not in text:
              text += degree_test
          tests.write_text(text, encoding="utf-8")
          PY

          node --check aura_spatial_web/construction_overlay_pass.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check tests/js/spatial-construction-demo.test.mjs
          node --test tests/js/spatial-construction-demo.test.mjs
          npm run test:spatial

      - name: Commit and push repaired owners
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_owner() {
            path="$1"
            message="$2"
            if ! git diff --quiet -- "$path"; then
              git add "$path"
              git commit -m "$message"
            fi
          }
          commit_owner aura_spatial_web/construction_scene_renderer.js \
            "fix(construction): preserve storey transforms and splat contract"
          commit_owner aura_spatial_web/construction_overlay_pass.js \
            "fix(construction): align overlay presentation transforms"
          commit_owner tests/js/spatial-construction-demo.test.mjs \
            "test(construction): lock deep review renderer invariants"
          test -z "$(git status --short)"
          if test "$(git rev-parse HEAD)" = "$EVENT_HEAD"; then
            echo "Deep-review source repairs already present."
            exit 0
          fi
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
