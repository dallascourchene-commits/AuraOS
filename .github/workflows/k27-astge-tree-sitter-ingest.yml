name: K27 ASTGE Tree-sitter Ingestion Contract

on:
  pull_request:
    paths:
      - "native/aura-k27-astge/**"
      - ".github/workflows/k27-astge-tree-sitter-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k27-astge-ingest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tree-sitter-ingest:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run exact Tree-sitter ingestion and storage contracts
        run: cargo test --manifest-path native/aura-k27-astge/Cargo.toml --all-targets

      - name: Clippy fail closed
        run: cargo clippy --manifest-path native/aura-k27-astge/Cargo.toml --all-targets -- -D warnings

      - name: Emit proof and claim ceiling
        run: |
          echo "TREE_SITTER_RUST_AST_INGESTION_PROVEN=true"
          echo "AST_CHILD_EDGE_EQUIVALENCE_PROVEN=true"
          echo "SNAPSHOT_AFFECTED_CONE_EQUIVALENCE_PROVEN=true"
          echo "SOURCE_FILE_SPAN_BINDING_PROVEN=true"
          echo "K27_PHYSICAL_PLACEMENT_ONLY=true"
          echo "SYMBOL_CALL_GRAPH_PROVEN=false"
          echo "PHYSICAL_LOCALITY_SUPERIORITY_PROVEN=false"
          echo "NVME_COLD_PERFORMANCE_PROVEN=false"
          echo "AURAOS_RUNTIME_INTEGRATION_PROVEN=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
