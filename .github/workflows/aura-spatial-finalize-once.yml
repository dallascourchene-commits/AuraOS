name: Aura Spatial One-Shot Finalization

on:
  push:
    branches:
      - feature/aura-spatial-s0-s2
    paths:
      - .aura/tools/aura_spatial_finalize_once.py
      - .aura/tools/aura_spatial_finalize_trigger.py

permissions:
  contents: write

concurrency:
  group: aura-spatial-finalize-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-spatial-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and focused tooling
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff --quiet
      - name: Apply reviewed exact-source invariants
        run: python .aura/tools/aura_spatial_finalize_once.py
      - name: Compile and lint bounded spatial surface
        run: |
          python -m py_compile \
            aura_spatial_contracts.py \
            aura_spatial_coordinate_frames.py \
            aura_spatial_asset_registry.py \
            aura_spatial_scene.py \
            aura_spatial_projection.py \
            aura_spatial_interaction.py \
            aura_spatial_ws_guard.py \
            aura_spatial_breadboard.py \
            aura_topology_ws_bridge.py \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py
          ruff check --select E9,F63,F7,F82 \
            aura_spatial_contracts.py \
            aura_spatial_coordinate_frames.py \
            aura_spatial_asset_registry.py \
            aura_spatial_scene.py \
            aura_spatial_projection.py \
            aura_spatial_interaction.py \
            aura_spatial_ws_guard.py \
            aura_spatial_breadboard.py \
            aura_topology_ws_bridge.py \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py
          python -m json.tool schemas/aura_spatial_scene.schema.json >/dev/null
          git diff --check
      - name: Run focused spatial and compatibility circuit
        run: |
          python -m pytest -q \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_showcase_spatial_integration.py
      - name: Remove one-shot finalization machinery
        run: |
          rm -f \
            .aura/tools/aura_spatial_finalize_once.py \
            .aura/tools/aura_spatial_finalize_trigger.py \
            .github/workflows/aura-spatial-finalize-once.yml
      - name: Regenerate canonical CODEMAP and topology
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit finalized circuit and navigation evidence
        shell: bash
        run: |
          git config user.name "AuraOS Spatial Circuit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            aura_spatial_contracts.py \
            aura_spatial_projection.py \
            aura_spatial_ws_guard.py \
            tests/test_aura_spatial_substrate.py \
            docs/AURA_SPATIAL_COMPUTING.md \
            .aura/ARCHITECTURE.md \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .aura/tools/aura_spatial_finalize_once.py \
            .aura/tools/aura_spatial_finalize_trigger.py \
            .github/workflows/aura-spatial-finalize-once.yml
          if git diff --cached --quiet; then
            echo "Spatial source and CODEMAP are already finalized."
            exit 0
          fi
          git commit -m "Spatial S2: finalize projection invariants and regenerate CODEMAP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
