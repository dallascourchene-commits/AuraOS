name: UMC deep review v2 target materialize

on:
  pull_request_target:
    branches:
      - main
    types: [ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: umc-deep-review-v2-target-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.sha == 'b638a6af5e4571b3f320e5a37ec338e14bcf678a'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TRANSPORT_COMMIT: 0f4a334b17864a261fa48068191ad2f2ecb7879b
      EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact clean reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_HEAD" = 'b638a6af5e4571b3f320e5a37ec338e14bcf678a'
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run hash-locked deep-review materializer
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"
          test "$(sha256sum "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh" | awk '{print $1}')" = \
            '390cb20e035a21735cb9b83ec18cace34b745e483d17739924505a19bd10187a'
          bash "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"

      - name: Upload deep-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-deep-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.materialize.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = 'success' ]; then
            body='Deep-review v2 materialization succeeded: whole-tree compilation, full Ruff, Bandit, 65 regressions, zero-finding Waboose, Architecture Harness, generated maps, and bounded publication all passed.'
          else
            body='Deep-review v2 materialization failed closed. The exact head, ancestry, source hash, transport hash, or verification gates prevented publication; inspect the workflow evidence.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
