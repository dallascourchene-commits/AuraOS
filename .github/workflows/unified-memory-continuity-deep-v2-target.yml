name: "UMC deep review v2 target materialize"

"on":
  pull_request_target:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: "umc-deep-review-v2-target-${{ github.event.pull_request.number }}"
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.event.pull_request.number == 193 && github.event.pull_request.head.ref == 'refactor/unified-memory-continuity' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha == '2cdb398e05ca12c1622b20c43f98b04eaf170135' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TRANSPORT_COMMIT: 1de0f438b330ef91bfc99cead2d288d003181e22
      REVIEWED_CHECKPOINT: 968f417cf55895ec788d89c0a97f37e40cf0612a
      TRIGGER_PATH: .aura/refactor_payloads/umc_deep_review.retry
      EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact bounded reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_HEAD" = '2cdb398e05ca12c1622b20c43f98b04eaf170135'
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1)"
          git merge-base --is-ancestor "$REVIEWED_CHECKPOINT" HEAD
          git diff --name-only "$REVIEWED_CHECKPOINT" HEAD > "${RUNNER_TEMP}/bounded-history-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          paths = set((Path(os.environ['RUNNER_TEMP']) / 'bounded-history-paths.txt').read_text().splitlines())
          allowed = {
              'Aura_Sandbox/umc_deep_review_payload_v2/part-01',
              'Aura_Sandbox/umc_deep_review_payload_v2/part-02',
              'Aura_Sandbox/umc_deep_review_payload_v2/part-03',
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'topology_map.json',
              os.environ['TRIGGER_PATH'],
          }
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'unexpected bounded-history paths: {sorted(unexpected)}')
          PY
          test ! -e Aura_Sandbox/umc_deep_review_payload_v2
          test -f "$TRIGGER_PATH"
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = \
            bb5c0c50e62b8edbb4cbdad4f9810709f67adf7866fcd8b0700eda334a030ade
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = \
            edddf3af030fd5e4cdeb8bc0bb0c4b2751e3dc7857068ba46c28c5bd905d19ee

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run hash-locked 66-test deep-review materializer
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'umc_deep_review_v2_materialize.sh'
          text = path.read_text(encoding='utf-8')
          placeholder = "EXPECTED_HEAD='__EXPECTED_HEAD__'"
          replacement = "EXPECTED_HEAD='2cdb398e05ca12c1622b20c43f98b04eaf170135'"
          if text.count(placeholder) != 1:
              raise SystemExit('materializer expected-head placeholder is ambiguous')
          path.write_text(text.replace(placeholder, replacement, 1), encoding='utf-8')
          PY
          bash "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"

      - name: Upload deep-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-deep-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.materialize.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = 'success' ]; then
            body='Deep-review v2 materialization succeeded: five bounded PR files passed whole-tree compilation, Ruff, Bandit, 66 regressions, Aura PVM hard architecture checks, zero-finding Waboose, Architecture Harness, generated maps, and bounded publication.'
          else
            body='Deep-review v2 materialization failed closed. The exact head, ancestry, source hashes, transport payload, namespace gate, or verification gates prevented publication; inspect the workflow evidence.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
