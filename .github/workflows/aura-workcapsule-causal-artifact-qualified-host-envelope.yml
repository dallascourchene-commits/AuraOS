name: Aura WorkCapsule Causal Artifact Qualified Host Envelope

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR565_SHA: 6a717e1caeb42a2c4074ce4920b5fe1213329dee
  PR567_SHA: 4f107f06fcb8bf82a9c8adf188278f57f9443714
  CONVERGENCE_SHA: 15dc610a7b92ea87ca482566244dc75ade5b4752
  PR565_ARTIFACT_OWNER_BLOB: f46e65220d454d2c7bfeb974c56230072d2af002

jobs:
  exact-head-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact child and prove current PR565 plus PR567 convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=260 origin "$TARGET_SHA" "$CONVERGENCE_SHA" "$PR565_SHA" "$PR567_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mapfile -t parents < <(git cat-file -p "$CONVERGENCE_SHA" | awk '/^parent /{print $2}')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$PR565_SHA"
          test "${parents[1]}" = "$PR567_SHA"
          git merge-base --is-ancestor "$PR565_SHA" HEAD
          git merge-base --is-ancestor "$PR567_SHA" HEAD
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove current exact PR565 artifact owner on child tree
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/aura_workcapsule_artifact_qualified_host_observation.py)" = "$PR565_ARTIFACT_OWNER_BLOB"
          python3 -m py_compile scripts/aura_workcapsule_artifact_qualified_host_observation.py
          python3 -m unittest -v tests.test_aura_workcapsule_artifact_qualified_host_observation

      - name: Prove O32 adversarials
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/aura_workcapsule_causal_artifact_qualified_host_envelope.py
          python3 -m unittest -v tests.test_aura_workcapsule_causal_artifact_qualified_host_envelope

      - name: Fetch re-prove exact PR567 and emit actual envelope field set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr567 && mkdir -p /tmp/pr567
          git -C /tmp/pr567 init .
          git -C /tmp/pr567 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr567 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=240 origin "$PR567_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr567 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr567 rev-parse HEAD)" = "$PR567_SHA"
          cd /tmp/pr567
          python3 -m unittest -v tests.test_aura_workcapsule_causal_temporal_host_observation_admission
          python3 - <<'PY'
          import json
          from scripts.aura_workcapsule_causal_temporal_host_observation_admission import admit_causal_temporal_host_observation_admission
          from tests.test_aura_workcapsule_causal_temporal_host_observation_admission import causal_owner
          from tests.test_aura_workcapsule_temporal_host_observation_admission import observations
          with causal_owner():
              out = admit_causal_temporal_host_observation_admission(host_observations=observations())
          with open('/tmp/pr567_fields.json','w',encoding='utf-8') as h: json.dump(sorted(out),h)
          assert out['causal_temporal_owner_reproved'] is True
          assert out['pre_reentry_receipt_reused_for_post_o10'] is True
          assert out['fresh_post_reentry_receipt_substituted'] is False
          assert out['local_evidence_promoted_to_host_rank'] is False
          assert out['host_effect_ready'] is False
          PY
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Prove closed envelope schema equals exact PR567 output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from scripts.aura_workcapsule_causal_artifact_qualified_host_envelope import _CAUSAL_HOST_FIELDS
          with open('/tmp/pr567_fields.json',encoding='utf-8') as h: exact=set(json.load(h))
          assert exact == _CAUSAL_HOST_FIELDS, (sorted(exact-_CAUSAL_HOST_FIELDS), sorted(_CAUSAL_HOST_FIELDS-exact))
          PY

      - name: Assert boundary and consequence ceiling
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_causal_artifact_qualified_host_envelope import verify_causal_artifact_qualified_host_envelope
          params=set(inspect.signature(verify_causal_artifact_qualified_host_envelope).parameters)
          assert params == {'scoped_target_inputs','higher_owner_projection','raw_slice_receipt','causal_host_admission_receipt'}
          for x in ('host_admission_receipt','host_observation_resolver','temporal_receipt','post_closure_receipt','candidate_binding','effect_ready'): assert x not in params
          print('CURRENT_PR565_EXACT_HEAD_REPROVED=true')
          print('PR567_EXACT_CAUSAL_OWNER_REPROVED=true')
          print('CAUSAL_HOST_ADMISSION_REPROVED_BY_CHILD=false')
          print('CAUSAL_HOST_ADMISSION_PRODUCER_AUTHENTICATED=false')
          print('PRE_REENTRY_REUSED_FOR_POST_O10=true')
          print('FRESH_POST_REENTRY_SUBSTITUTED=false')
          print('RESOLVED_HOST_GATES_BOUND_TO_EXACT_ARTIFACT=true')
          print('HOST_RESOLVER_TRUST_PROVEN=false')
          print('HOST_OBSERVATION_AUTHORITY_PROVEN=false')
          print('HOST_EFFECT_READY=false')
          print('SEMANTIC_REPAIR_CORRECTNESS_PROVEN=false')
          print('PRODUCER_AUTHENTICATED=false')
          print('EXECUTION_AUTHORIZED=false')
          print('PROVIDER_EFFECT_AUTHORIZED=false')
          print('NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false')
          PY
