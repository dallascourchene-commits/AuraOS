name: Project006 O23 Exact Millisecond Time Repair

on:
  pull_request:
    paths:
      - "tools/project006/runtime_activation_transaction.py"
      - "tests/test_project006_runtime_activation_o23.py"
      - ".github/workflows/project006-o23-exact-ms-time-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-ms-time-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile exact repair surface
        run: |
          python -m py_compile \
            tools/project006/runtime_activation_transaction.py \
            tests/test_project006_runtime_activation_o23.py
      - name: Run focused activation regressions
        run: python -m unittest -v tests.test_project006_runtime_activation_o23
