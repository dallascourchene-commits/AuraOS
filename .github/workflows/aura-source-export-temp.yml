name: Aura Temporary Exact Tree Export

on:
  pull_request:
    paths:
      - ".github/workflows/aura-source-export-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ce70f458ce52ed009246eb7b34bb87a55011602e
          fetch-depth: 1
          submodules: false
      - name: Record exact reviewed tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ce70f458ce52ed009246eb7b34bb87a55011602e"
          git rev-parse 'HEAD^{tree}' > /tmp/reviewed-tree.txt
      - name: Upload exact reviewed tree
        uses: actions/upload-artifact@v4
        with:
          name: aura-pr168-reviewed-tree
          path: /tmp/reviewed-tree.txt
          if-no-files-found: error
          retention-days: 1
