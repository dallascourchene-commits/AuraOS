name: Aura Temporary S4-B Source Apply

on:
  pull_request:
    paths:
      - ".github/workflows/aura-source-export-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-s4b-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact S4-B branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 1
          submodules: false

      - name: Reconstruct and verify reviewed patch
        run: |
          set -euo pipefail
          cat .aura_temp/s4b_patch_00 \
              .aura_temp/s4b_patch_01 \
              .aura_temp/s4b_patch_02 \
              .aura_temp/s4b_patch_03 \
            | base64 --decode | gzip --decompress > /tmp/s4b.patch
          echo "a642f27ae9dfd05e2747053e563ee94d780c6969f1b8fc2cae5d241a6eb3ac05  /tmp/s4b.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/s4b.patch

      - name: Apply and verify permanent source
        run: |
          set -euo pipefail
          git apply /tmp/s4b.patch
          rm .github/workflows/aura-spatial-s4.yml
          git diff --check
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_importers/*.py \
            aura_spatial_render_plan.py \
            scripts/aura_spatial_s4b_architect_harness.py
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs

      - name: Commit and push permanent source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/aura-source-export-temp.yml' ':!.aura_temp'
          git commit -m "feat: implement spatial S4-B Gaussian interoperability"
          test -z "$(git diff --cached --name-only)"
          git push origin HEAD:feature/spatial-s4b-gaussian-security
