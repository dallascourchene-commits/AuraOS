name: Model Cognome Telemetry V2

on:
  pull_request:
    paths:
      - "aura_model_cognome_telemetry.py"
      - "aura_empirical_cost_ledger.py"
      - "tests/test_aura_model_cognome_telemetry.py"
      - "tests/test_aura_empirical_cost_ledger_v2.py"
      - ".github/workflows/model-cognome-telemetry-v2.yml"
  push:
    branches:
      - main
      - refactor/model-cognome-telemetry
    paths:
      - "aura_model_cognome_telemetry.py"
      - "aura_empirical_cost_ledger.py"
      - "tests/test_aura_model_cognome_telemetry.py"
      - "tests/test_aura_empirical_cost_ledger_v2.py"
      - ".github/workflows/model-cognome-telemetry-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Linked telemetry contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Clone exact source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --depth 1 --branch "${SOURCE_REF}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pytest ruff
      - name: Compile linked telemetry modules
        run: |
          python -m py_compile \
            aura_model_cognome_telemetry.py \
            aura_empirical_cost_ledger.py \
            aura_usage_normalizer.py \
            aura_pricing_registry.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_model_cognome_telemetry.py \
            aura_empirical_cost_ledger.py \
            tests/test_aura_model_cognome_telemetry.py \
            tests/test_aura_empirical_cost_ledger_v2.py
      - name: Run telemetry and migration contracts
        run: |
          python -m pytest -q \
            tests/test_aura_model_cognome_telemetry.py \
            tests/test_aura_empirical_cost_ledger_v2.py
