name: Publish Paper X v1.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-paper-x-v1.1-once.yml'

permissions:
  contents: write

concurrency:
  group: publish-paper-x-v1-1-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out triggering main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Fetch and verify sealed Zenodo Paper X v1.1 release
        env:
          ZENODO_RECORD_ID: '21895712'
          EXPECTED_RELEASE_ZIP: 'AuraOS_Paper_X_Defensive_Publication_N101-N124_v1.1_2026-08-11.zip'
          EXPECTED_ZIP_SHA256: '023b6396d6ac6ee955a709d30c361aa2dc019382a4808ca9e9db206c2bda4756'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import zipfile

          record_id = os.environ['ZENODO_RECORD_ID']
          expected_name = os.environ['EXPECTED_RELEASE_ZIP']
          expected_sha = os.environ['EXPECTED_ZIP_SHA256'].lower()
          api_url = f'https://zenodo.org/api/records/{record_id}'

          req = urllib.request.Request(api_url, headers={'User-Agent': 'AuraOS-Paper-X-Publisher/1.1'})
          with urllib.request.urlopen(req, timeout=60) as response:
              record = json.load(response)

          if str(record.get('id')) != record_id:
              raise SystemExit(f'Zenodo record mismatch: {record.get("id")!r}')

          doi = (
              record.get('doi')
              or ((record.get('pids') or {}).get('doi') or {}).get('identifier')
              or ((record.get('metadata') or {}).get('doi'))
          )
          if not doi:
              raise SystemExit('Published Zenodo record has no DOI in returned metadata')

          file_entries = []
          files_obj = record.get('files')
          if isinstance(files_obj, list):
              file_entries = files_obj
          elif isinstance(files_obj, dict):
              entries = files_obj.get('entries', {})
              if isinstance(entries, dict):
                  file_entries = list(entries.values())
              elif isinstance(entries, list):
                  file_entries = entries

          chosen = None
          for item in file_entries:
              key = item.get('key') or item.get('filename') or item.get('name')
              if key == expected_name:
                  chosen = item
                  break
          if chosen is None:
              available = [i.get('key') or i.get('filename') or i.get('name') for i in file_entries]
              raise SystemExit(f'Release ZIP {expected_name!r} not present in Zenodo record; files={available!r}')

          links = chosen.get('links') or {}
          download_url = links.get('content') or links.get('self') or links.get('download')
          if not download_url:
              download_url = f'https://zenodo.org/records/{record_id}/files/{expected_name}?download=1'

          tmp_zip = pathlib.Path('/tmp') / expected_name
          req = urllib.request.Request(download_url, headers={'User-Agent': 'AuraOS-Paper-X-Publisher/1.1'})
          with urllib.request.urlopen(req, timeout=120) as response, tmp_zip.open('wb') as out:
              shutil.copyfileobj(response, out)

          actual_sha = hashlib.sha256(tmp_zip.read_bytes()).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'ZIP SHA-256 mismatch: expected {expected_sha}, got {actual_sha}')

          dest = pathlib.Path('docs/prior_art/paper_x_v1.1')
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)
          with zipfile.ZipFile(tmp_zip) as zf:
              zf.extractall(dest)
          shutil.copy2(tmp_zip, dest / expected_name)

          metadata = record.get('metadata') or {}
          title = metadata.get('title') or record.get('title') or 'AuraOS Paper X v1.1'
          publication_date = metadata.get('publication_date') or metadata.get('publication_date') or record.get('created') or '2026-08-11'
          record_url = ((record.get('links') or {}).get('self_html') or (record.get('links') or {}).get('html') or f'https://zenodo.org/records/{record_id}')

          pub = f'''# Paper X v1.1 — Zenodo publication record\n\n- **Title:** {title}\n- **Version:** v1.1\n- **Claims:** N101–N124\n- **Zenodo record:** {record_url}\n- **DOI:** https://doi.org/{doi}\n- **Zenodo record ID:** {record_id}\n- **Publication date:** {publication_date}\n- **Sealed release ZIP SHA-256:** `{actual_sha}`\n\n## Publication boundary\n\nThe files in this directory are the byte-preserved Paper X v1.1 publication package recovered from the live Zenodo record. The publication bytes are not rewritten after deposit. Repository-facing links, orientation instructions, and later provenance are maintained around the sealed release rather than silently mutating it.\n\n## AI entry\n\nBefore interpreting the individual Aura prior-art papers or traversing the repository, read [`AURA_L0_ACTIVATION_PACKET.md`](AURA_L0_ACTIVATION_PACKET.md). It is an orientation/compiler seed for reconstructing Aura's relational grammar; it is **not** source truth, authority, or a replacement for exact evidence.\n'''
          (dest / 'ZENODO_PUBLICATION_RECORD.md').write_text(pub, encoding='utf-8')

          release_info = {
              'zenodo_record_id': record_id,
              'doi': doi,
              'record_url': record_url,
              'version': 'v1.1',
              'claims': 'N101-N124',
              'release_zip': expected_name,
              'release_zip_sha256': actual_sha,
          }
          pathlib.Path('/tmp/paper-x-release.json').write_text(json.dumps(release_info, indent=2), encoding='utf-8')
          print(json.dumps(release_info, indent=2))
          PY

      - name: Make L0 Activation Packet the AI front door
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/paper-x-release.json').read_text(encoding='utf-8'))
          doi = release['doi']
          packet = 'docs/prior_art/paper_x_v1.1/AURA_L0_ACTIVATION_PACKET.md'
          paper_pdf = 'docs/prior_art/paper_x_v1.1/AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.pdf'
          evidence = 'docs/prior_art/paper_x_v1.1/PAPER_X_V1.1_EVIDENCE_ADDENDUM.md'
          provenance = 'docs/prior_art/paper_x_v1.1/PROVENANCE_MANIFEST.csv'

          start = '<!-- AURA_AI_ENTRY_START -->'
          end = '<!-- AURA_AI_ENTRY_END -->'
          block = f'''{start}\n\n> [!IMPORTANT]\n> ## AI AGENTS — START HERE: read the L0 Activation Packet first\n>\n> Before reading individual Aura papers, scanning the repository, or forming architecture-wide conclusions, read **[`AURA_L0_ACTIVATION_PACKET.md`]({packet})**.\n>\n> The packet is Aura's compact orientation/compiler seed: it gives the primitives for relational-world compilation, L0→L4 resolution, movement, signed negative space, guarded reachability, authority boundaries, exact-source descent, and provenance. **It is not canonical truth, authority, or a substitute for source.** Its job is to let a worker hold the generative grammar first, then understand the papers and implementation as source-resolvable instances of that grammar rather than as disconnected components.\n>\n> **Entry order for AI workers:**\n> 1. Read the **L0 Activation Packet**.\n> 2. Read **[Paper X v1.1 — N101–N124]({paper_pdf})** for the full architecture, evidence boundaries, falsifiers, and declarations.\n> 3. Use `.aura/CODEMAP.json`, `.aura/CODEMAP.md`, and `.aura/SOURCE_ANCHORS.md` to navigate; do not broad-scan when a source-resolvable route exists.\n> 4. Descend to exact source/current evidence only when uncertainty, contradiction, consequence, freshness, authority, or falsification earns deeper resolution.\n> 5. Preserve the distinctions **projection ≠ owner**, **route ≠ authority**, **similarity ≠ evidence**, **receipt ≠ truth**, and **Click/comprehension ≠ authority**.\n> 6. Preserve provenance for every consequential transition and leave unrelated branches cold but recoverable.\n>\n> **Published Paper X v1.1:** DOI [`{doi}`](https://doi.org/{doi}) · [Evidence addendum]({evidence}) · [Provenance manifest]({provenance})\n\n{end}\n'''

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if start in text and end in text:
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              text = before.rstrip() + '\n\n' + block + after.lstrip('\n')
          else:
              lines = text.splitlines(keepends=True)
              insert_at = 1 if lines and lines[0].startswith('# ') else 0
              text = ''.join(lines[:insert_at]).rstrip() + '\n\n' + block + '\n' + ''.join(lines[insert_at:]).lstrip('\n')
          readme.write_text(text, encoding='utf-8')

          prior = Path('docs/prior_art/README.md')
          ptext = prior.read_text(encoding='utf-8') if prior.exists() else '# AuraOS Prior Art\n'
          pstart = '<!-- PAPER_X_V1_1_START -->'
          pend = '<!-- PAPER_X_V1_1_END -->'
          pblock = f'''{pstart}\n\n## Current AI entry point — Paper X v1.1 / L0 Activation Packet\n\n**AI workers should read [`AURA_L0_ACTIVATION_PACKET.md`](paper_x_v1.1/AURA_L0_ACTIVATION_PACKET.md) before interpreting the individual prior-art papers.** The packet carries the compact relational grammar needed to reconstruct Aura across the paper sequence; exact papers, repository source, tests, and evidence remain authoritative at their own layer.\n\n- **Paper X v1.1:** [`AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.pdf`](paper_x_v1.1/AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.pdf)\n- **Declarations:** N101–N124\n- **DOI:** [`{doi}`](https://doi.org/{doi})\n- **Evidence addendum:** [`PAPER_X_V1.1_EVIDENCE_ADDENDUM.md`](paper_x_v1.1/PAPER_X_V1.1_EVIDENCE_ADDENDUM.md)\n- **Claims crosswalk:** [`CLAIMS_N101-N124.csv`](paper_x_v1.1/CLAIMS_N101-N124.csv)\n- **Provenance:** [`PROVENANCE_MANIFEST.csv`](paper_x_v1.1/PROVENANCE_MANIFEST.csv)\n- **Publication record:** [`ZENODO_PUBLICATION_RECORD.md`](paper_x_v1.1/ZENODO_PUBLICATION_RECORD.md)\n\nPaper X v1.1 preserves the v1.0 N101–N117 generation and extends it through N124. The behavioral evidence is treated as qualitative/source-bound and falsifiable; it is not a consciousness claim or hidden-neural-telemetry claim.\n\n{pend}\n'''
          if pstart in ptext and pend in ptext:
              before, rest = ptext.split(pstart, 1)
              _, after = rest.split(pend, 1)
              ptext = before.rstrip() + '\n\n' + pblock + after.lstrip('\n')
          else:
              plines = ptext.splitlines(keepends=True)
              pinsert = 1 if plines and plines[0].startswith('# ') else 0
              ptext = ''.join(plines[:pinsert]).rstrip() + '\n\n' + pblock + '\n' + ''.join(plines[pinsert:]).lstrip('\n')
          prior.parent.mkdir(parents=True, exist_ok=True)
          prior.write_text(ptext, encoding='utf-8')
          PY

      - name: Validate publication package
        run: |
          python -m py_compile docs/prior_art/paper_x_v1.1/aura_relational_world_reference.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          root = Path('docs/prior_art/paper_x_v1.1')
          required = [
              'AURA_L0_ACTIVATION_PACKET.md',
              'AURA__L4-RAW-SOURCE__CHATGPT5-SOL__PAPER-X-RECONSTITUTION__SITUATED-REASONING__SPATIAL-TRANSFER__2026-08-11.txt',
              'AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.pdf',
              'AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.docx',
              'AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.md',
              'AuraOS_Paper_X_Relational_World_Compilation_N101-N124_v1.1_2026-08-11.txt',
              'CLAIMS_N101-N124.csv',
              'PAPER_X_V1.1_EVIDENCE_ADDENDUM.md',
              'PROVENANCE_MANIFEST.csv',
              'SHA256SUMS.txt',
              'ZENODO_PUBLICATION_RECORD.md',
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f'Missing release files: {missing}')
          if 'AURA_AI_ENTRY_START' not in Path('README.md').read_text(encoding='utf-8'):
              raise SystemExit('README AI-entry marker missing')
          print(f'Validated {len(list(root.iterdir()))} Paper X v1.1 release artifacts')
          PY

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate CODEMAP topology and source anchors
        run: |
          python scripts/aura_navigation_refresh.py --root .
          python scripts/aura_source_anchor_map.py --root . --check
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s .aura/SOURCE_ANCHORS.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Commit publication, packet-first entry, provenance, and regenerated maps directly to main
        run: |
          git config user.name 'AuraOS Publication Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/publish-paper-x-v1.1-once.yml
          git add README.md docs/prior_art/README.md docs/prior_art/paper_x_v1.1/
          git add .aura/CODEMAP.json .aura/CODEMAP.md .aura/SOURCE_ANCHORS.md topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git status --short
          git diff --cached --stat
          git diff --cached --check
          git commit -m 'docs: publish Paper X v1.1 and L0 activation entry'
          git push origin HEAD:main
