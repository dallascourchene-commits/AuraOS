name: AWJ032 AirLLM Tiny Runtime Proof

on:
  push:
    branches:
      - awj032/airllm-source-admission-20260830
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj032-airllm-tiny-runtime-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  tiny-runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          mkdir -p .awj032
          printf '%s\n' "$TARGET_SHA" > .awj032/aura_head.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize pinned training source and prove O1-O2-O3-R1 lifecycle suite
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/lyogavin/airllm.git .awj032_airllm_upstream_fixture
          git -C .awj032_airllm_upstream_fixture checkout --detach 55e435087d951da8c25ab3672e969025241a398e
          test "$(git -C .awj032_airllm_upstream_fixture rev-parse HEAD)" = "55e435087d951da8c25ab3672e969025241a398e"
          python - <<'PY'
          import json
          import unittest
          from pathlib import Path
          from tools.awj032.training_o1_reference import test_training_admission as o1
          from tools.awj032.training_o2_transition_reference import test_transition_envelope as o2
          from tools.awj032.training_o3_delegated_bridge_reference import test_delegated_training_bridge as o3
          from tools.awj032.training_r1_resolver_reference import test_resolver as r1

          loader = unittest.defaultTestLoader
          suite = unittest.TestSuite(loader.loadTestsFromModule(m) for m in (o1, o2, o3, r1))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.wasSuccessful(), result
          assert result.testsRun == 45, result.testsRun
          assert not result.skipped, result.skipped
          receipt = {
              'schema': 'AWJ032_O1_O2_O3_R1_EXACT_HEAD_SUITE_V1',
              'airllm_commit': '55e435087d951da8c25ab3672e969025241a398e',
              'modules': ['O1', 'O2', 'O3', 'R1'],
              'tests_run': result.testsRun,
              'skipped': len(result.skipped),
              'failures': len(result.failures),
              'errors': len(result.errors),
              'status': 'PASS',
              'claim_ceiling': 'PINNED_TRAINING_SOURCE_AND_D0_LIFECYCLE_CONTRACT_TEST_ONLY_NOT_RUNTIME_TRAINING_PROOF',
          }
          Path('.awj032/o1_o2_o3_r1_exact_head_suite.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2), encoding='utf-8'
          )
          print('O1_O2_O3_R1_EXACT_HEAD_SUITE_PASS', receipt)
          PY

      - name: Materialize pinned stock AirLLM v3.3.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/lyogavin/airllm.git airllm-upstream
          git -C airllm-upstream checkout --detach c92cea691412715a218306acb01fc9c2c681a8f2
          test "$(git -C airllm-upstream rev-parse HEAD)" = "c92cea691412715a218306acb01fc9c2c681a8f2"
          printf '%s\n' "$(git -C airllm-upstream rev-parse HEAD)" > .awj032/airllm_head.txt

      - name: Prove stock AirLLM is blocked by source gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/awj032/airllm_source_admission.py airllm-upstream --expected-version 3.3.0 > .awj032/stock_source_admission.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('.awj032/stock_source_admission.json').read_text())
          assert r['status'] == 'BLOCKED', r
          codes = {f['code'] for f in r['findings']}
          assert any(code.startswith('REMOTE_CODE_') for code in codes), codes
          print('STOCK_NEGATIVE_PROVEN', sorted(codes))
          PY

      - name: Apply exact pinned HARD_FALSE remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/awj032')
          from airllm_hard_false_remediation import PINNED_MUTATION_SPECS, remediate_pinned_policy_files

          root = Path('airllm-upstream')
          inputs = {path: (root / path).read_bytes() for path in PINNED_MUTATION_SPECS}
          outputs, receipt = remediate_pinned_policy_files(inputs)
          for path, raw in outputs.items():
              (root / path).write_bytes(raw)
          Path('.awj032/remediation_receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2), encoding='utf-8'
          )
          print('REMEDIATION_EDITS', receipt['total_edits'])
          PY

      - name: Re-audit remediated source with lexical-scope gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m tools.awj032.airllm_scope_aware_source_admission \
            airllm-upstream --expected-version 3.3.0 > .awj032/remediated_source_admission.json
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path('.awj032/remediated_source_admission.json').read_text())
          findings = r['findings']
          discharged = r['discharged_findings']
          allowed = {
              ('NESTED_PIP_MUTATION', 'air_llm/setup.py', 29, 'pip install'),
              ('NESTED_PIP_MUTATION', 'air_llm/airllm/airllm_base.py', 124, 'pip install'),
              ('REMOTE_CODE_OPAQUE_LOADER_KWARGS', 'air_llm/airllm/auto_model.py', 60,
               'get_module_class receives opaque **kwargs without explicit trust_remote_code=False'),
          }
          retired = (
              'REMOTE_CODE_OPAQUE_LOADER_KWARGS', 'air_llm/airllm/airllm_base.py', 298,
              'from_config receives opaque **kwargs without explicit trust_remote_code=False'
          )
          observed = {(f['code'], f['path'], f['line'], f['detail']) for f in findings}
          discharged_set = {(f['code'], f['path'], f['line'], f['detail']) for f in discharged}
          unexpected = observed - allowed
          assert not unexpected, {'unexpected_findings': sorted(unexpected), 'all_findings': findings}
          assert observed <= allowed, findings
          assert retired not in observed, {'retired_false_positive_reappeared': retired, 'all': findings}
          assert retired in discharged_set, {'structural_discharge_missing': retired, 'discharged': discharged}

          # Structural self-falsification: the same coarse finding at a different line is not
          # discharged merely because it resembles today's fixture scar.
          known_wrong = (
              'REMOTE_CODE_OPAQUE_LOADER_KWARGS', 'air_llm/airllm/airllm_base.py', 299,
              'from_config receives opaque **kwargs without explicit trust_remote_code=False'
          )
          assert known_wrong not in discharged_set, 'scope gate discharged line-drift by identity allowlist'

          adjudication = {
              'schema': 'AWJ032_FIXTURE_SOURCE_ADJUDICATION_V2_LEXICAL_SCOPE',
              'base_source_gate_status': r['status'],
              'source_digest': r['source_digest'],
              'known_scanner_residuals': findings,
              'structurally_discharged_findings': discharged,
              'unexpected_findings': [],
              'fixture_path_admitted': True,
              'structural_self_falsification': 'PASS_NO_LINE_IDENTITY_ALLOWLIST',
              'reason': (
                  'two NESTED_PIP matches are non-executing text in the exact pinned source; '
                  'the airllm_base.py from_config false positive is discharged only because lexical-scope '
                  'analysis proves the remediated local kwargs mapping is mutation-bounded with '
                  'trust_remote_code literal False; caller-supplied same-scope kwargs at auto_model.py '
                  'remain opaque and explicitly adjudicated as an internal AirLLM routing boundary; '
                  'actual Transformers loader boundaries are independently enforced by RuntimeHardFalseGuard'
              ),
              'claim_ceiling': 'PINNED_TINY_FIXTURE_PATH_ONLY_NOT_GENERAL_SOURCE_GATE_PASS',
          }
          Path('.awj032/remediated_fixture_adjudication.json').write_text(
              json.dumps(adjudication, sort_keys=True, indent=2), encoding='utf-8'
          )
          print('REMEDIATED_FIXTURE_SOURCE_ADMITTED', r['source_digest'], len(findings), len(discharged))
          PY

      - name: Install isolated AirLLM runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "torch>=2.4" \
            "transformers>=4.49,<5.13" \
            "accelerate>=1.0" \
            safetensors \
            huggingface-hub \
            scipy \
            sentencepiece \
            tqdm
          python -m pip install --no-deps -e ./airllm-upstream/air_llm
          python -m pip freeze --all | sort > .awj032/dependency_freeze.txt

      - name: Execute tiny safetensors AirLLM split-load-generate-reopen proof
        shell: bash
        run: |
          set -euo pipefail
          python tools/awj032/airllm_tiny_fixture_probe.py \
            --device cpu \
            --cache-dir .awj032/hf-cache \
            --shard-dir .awj032/tiny-llama-split \
            --receipt .awj032/AWJ032_TINY_RUNTIME_RECEIPT.json

      - name: Display compact runtime receipt
        if: always()
        shell: bash
        run: |
          if [ -f .awj032/AWJ032_TINY_RUNTIME_RECEIPT.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('.awj032/AWJ032_TINY_RUNTIME_RECEIPT.json').read_text())
          compact = {
              'status': r.get('status'),
              'claim': r.get('claim'),
              'error_type': r.get('error_type'),
              'error': r.get('error'),
              'versions': r.get('versions'),
              'first_generation': r.get('first_generation'),
              'reopen_generation': r.get('reopen_generation'),
              'split_files': len(r.get('split_manifest', [])),
          }
          print(json.dumps(compact, sort_keys=True))
          PY
          fi

      - name: Upload AWJ032 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awj032-airllm-tiny-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: .awj032/
          if-no-files-found: error
          include-hidden-files: true
