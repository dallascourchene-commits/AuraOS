name: Bilateral Intent PR2

on:
  pull_request:
    paths:
      - "aura_bilateral_intent_canonical.py"
      - "aura_arena_gate_dialogue.py"
      - "aura_human_agent_guidance.py"
      - "aura_showcase/gate-dialogue.js"
      - "tests/test_aura_showcase_gate_dialogue.py"
      - "tests/test_bilateral_intent_pr2_evidence.py"
      - ".aura/refactor_objectives/bilateral_intent_guardrail_foundry_pr2*.json"
      - ".aura/waboose_requests/bilateral_intent_guardrail_foundry_pr2.v1.json"
      - ".github/workflows/bilateral-intent-pr2.yml"
  push:
    branches:
      - "refactor/bilateral-intent-pr2-canonical-gate"

permissions:
  contents: read

concurrency:
  group: bilateral-intent-pr2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: "0"

jobs:
  bounded-proof:
    name: Bounded proof (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies and proof tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile bounded Python surface
        run: |
          python -m py_compile \
            aura_bilateral_intent_canonical.py \
            aura_arena_gate_dialogue.py \
            aura_human_agent_guidance.py \
            aura_intent_refinement.py \
            aura_bilateral_intent_ingestion.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_bilateral_intent_pr2_evidence.py
      - name: Fatal Ruff checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_intent_canonical.py \
            aura_arena_gate_dialogue.py \
            aura_human_agent_guidance.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_bilateral_intent_pr2_evidence.py
      - name: Validate browser syntax
        run: node --check aura_showcase/gate-dialogue.js
      - name: Run PR1 and PR2 focused proof
        run: |
          python -m pytest -q \
            tests/test_aura_intent_refinement.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_bilateral_intent_pr1_evidence.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_bilateral_intent_pr2_evidence.py
