name: Publish verified continuity patch from main trigger

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: umc-main-verified-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'ci: trigger verified unified continuity publication'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: refactor/unified-memory-continuity
      TRANSPORT_COMMIT: 1de0f438b330ef91bfc99cead2d288d003181e22
      EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-v2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report start
        shell: bash
        run: gh api repos/${{ github.repository }}/issues/193/comments -f body='Main-triggered verified unified-continuity publication started.'

      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bind exact draft branch and run immutable publisher
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/pulls/193 > "${RUNNER_TEMP}/pr.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          pr = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pr.json').read_text())
          assert pr['state'] == 'open', pr
          assert pr['draft'] is True, pr
          assert pr['head']['ref'] == 'refactor/unified-memory-continuity', pr
          assert pr['head']['repo']['full_name'] == '${{ github.repository }}', pr
          PY
          event_head="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"
          python - "$event_head" <<'PY'
          import os
          import sys
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'umc_deep_review_v2_materialize.sh'
          text = path.read_text(encoding='utf-8')
          placeholder = "EXPECTED_HEAD='__EXPECTED_HEAD__'"
          replacement = f"EXPECTED_HEAD='{sys.argv[1]}'"
          if text.count(placeholder) != 1:
              raise SystemExit('materializer expected-head placeholder is ambiguous')
          path.write_text(text.replace(placeholder, replacement, 1), encoding='utf-8')
          PY
          bash "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-main-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Report result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body='Main-triggered publication succeeded: five bounded files passed 66 regressions, PVM hard gates, Ruff, Bandit, zero-finding Waboose, Architecture Harness, map regeneration, and atomic publication.'
          else
            body='Main-triggered publication failed closed; no partial source commit was accepted.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
