name: Diagnose combined Construction G7-G8 tests

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-combined-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt jsonschema pytest ruff
      - name: Apply pending source repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("aura_construction_demo_director.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from dataclasses import dataclass\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\n",
              1,
          ).replace("from typing import Any, Mapping\n", "from typing import Any\n", 1)
          text = text.replace(
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        }\n    )\n',
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        },\n        digest_size=32,\n    )\n',
              1,
          ).replace(
              "    def do_GET(self) -> None:  # noqa: N802 - stdlib callback name\n",
              "    def do_GET(self) -> None:\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff check --fix aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py
          ruff format aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py
      - name: Reproduce docs and cleanup mutations
        run: |
          printf '\n<!-- AURA_CONSTRUCTION_G7_G8 -->\nConstruction finalization diagnostic.\n' >> README.md
          printf '\n<!-- AURA_CONSTRUCTION_G7_G8 -->\nConstruction finalization diagnostic.\n' >> USER_GUIDE.md
          printf '\n<!-- AURA_CONSTRUCTION_G7_G8 -->\nConstruction finalization diagnostic.\n' >> .aura/ARCHITECTURE.md
          rm -f .github/pull_request_template_construction_g7_g8.md
          rm -f .github/workflows/aura-construction-g7-g8-finalize.yml
          rm -f .github/workflows/aura-construction-g7-g8-repair.yml
          rm -f .github/workflows/aura-construction-g7-g8-publish.yml
          rm -f docs/AURA_CONSTRUCTION_ARENA_G7_G8_{COMPLETION_ORDER,DEFINITION_OF_DONE,DOC_SYNC_REQUIREMENTS,EXACT_HEAD_POLICY,FINAL_HANDOFF,FINAL_REVIEW_PROMPT,MERGE_GATES,NO_NEW_AUTHORITY,OPERATOR_CHECKLIST,PROOF_MATRIX,RECOVERY_POINT,RELEASE_NOTES,SCOPE_LOCK,TEST_INVENTORY,VERIFICATION_COMMANDS}.md
      - name: Reproduce navigation generation
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Run combined suite and capture output
        id: combined
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=long \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            > /tmp/combined-pytest.txt 2>&1
          status=$?
          echo "$status" > /tmp/combined-pytest.status
          tail -100 /tmp/combined-pytest.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: construction-g7-g8-combined-pytest
          path: |
            /tmp/combined-pytest.txt
            /tmp/combined-pytest.status
          retention-days: 2
      - name: Enforce combined result
        run: test "$(cat /tmp/combined-pytest.status)" = "0"
