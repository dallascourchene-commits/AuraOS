name: SCO Construction E7-E8 Advisory Runtime Audit

on:
  push:
    branches:
      - refactor/sco-construction-e7-e8
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sco-construction-e7-e8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'refactor/sco-construction-e7-e8'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Phase 3 source
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          cat > .git/info/sparse-checkout <<'EOF'
          /*
          !/Aura_Memory/
          !/Aura_Sandbox/
          EOF
          git -c protocol.version=2 fetch \
            --no-tags \
            --filter=blob:none \
            --depth=128 \
            origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          git config --unset-all http.https://github.com/.extraheader
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1 coverage==7.9.2 ruff==0.5.0
      - name: Compile and run fatal static checks
        run: |
          python -m py_compile \
            aura_construction_adapter.py \
            aura_construction_fixtures.py \
            aura_construction_benchmark.py \
            aura_construction_learning.py \
            aura_construction_architect_refactor.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_adapter_hardening.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            tests/test_aura_construction_learning.py \
            tests/test_aura_construction_grammar.py \
            tests/test_aura_construction_architect_refactor.py
          ruff check --select E9,F63,F7,F82,F401,F811,B006 \
            aura_construction_adapter.py \
            aura_construction_fixtures.py \
            aura_construction_benchmark.py \
            aura_construction_learning.py \
            aura_construction_architect_refactor.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_adapter_hardening.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            tests/test_aura_construction_learning.py \
            tests/test_aura_construction_grammar.py \
            tests/test_aura_construction_architect_refactor.py
          git diff --check
      - name: Run focused Phase 3 coverage gate
        run: |
          set -o pipefail
          python -m pytest --collect-only -q \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_adapter_hardening.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            tests/test_aura_construction_learning.py \
            tests/test_aura_construction_grammar.py \
            tests/test_aura_construction_architect_refactor.py \
            2>&1 | tee /tmp/sco-phase3-collect.txt
          COLLECTED="$(grep -Eo '[0-9]+ tests collected' /tmp/sco-phase3-collect.txt | tail -1 | awk '{print $1}')"
          test "${COLLECTED:-0}" -ge 70
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_adapter_hardening.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            tests/test_aura_construction_learning.py \
            tests/test_aura_construction_grammar.py \
            tests/test_aura_construction_architect_refactor.py \
            2>&1 | tee /tmp/sco-phase3-tests.txt
          python -m coverage report -m \
            --include='aura_construction_adapter.py,aura_construction_fixtures.py,aura_construction_benchmark.py' \
            --fail-under=88 \
            2>&1 | tee /tmp/sco-phase3-coverage.txt
          python -m coverage report -m \
            --include='aura_construction_learning.py' \
            --fail-under=80 \
            2>&1 | tee /tmp/sco-phase3-learning-coverage.txt
      - name: Run prior Construction and canonical-owner regressions
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_construction_refactor_plan.py \
            tests/test_aura_refactor_skeleton.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py \
            test_aura_liquid_planning_arena.py \
            tests/test_aura_arena_wfst_phase_a.py \
            tests/test_aura_event_contracts.py \
            tests/test_aura_relational_authority.py \
            test_aura_architect_loop.py \
            tests/test_aura_architect_controls_vault_and_surfaces.py \
            tests/test_aura_crucible_phase_b.py \
            2>&1 | tee /tmp/sco-phase3-regressions.txt
      - name: Run Aura native Architect Council and Surgeon gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-7edd80484629378af0658bfca0d7d4e351361831}"
          python aura_construction_architect_refactor.py \
            --base-sha "${BASE_SHA}" \
            --output-dir Aura_Staging/sco_construction_phase3_architect
          test -s Aura_Staging/sco_construction_phase3_architect/architect_refactor_report.json
      - name: Run deterministic benchmark and governed learning projection
        run: |
          python aura_construction_benchmark.py --iterations 250 --seed 1337 --json
          python aura_construction_learning.py \
            --repo-root . \
            --output-dir Aura_Staging/sco_construction_phase3_learning \
            --experience-count 15 \
            --iterations-per-experience 25 \
            --seed-base 1337
          test -s Aura_Staging/sco_construction_phase3_learning/sco_phase3_learning_evidence.json
          test -s Aura_Staging/sco_construction_phase3_learning/arena_experience.db
          test -s Aura_Staging/sco_construction_phase3_learning/crucible.db
      - name: Upload focused, Architect, benchmark, and Crucible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sco-phase3-audit-evidence-${{ github.sha }}
          path: |
            /tmp/sco-phase3-collect.txt
            /tmp/sco-phase3-tests.txt
            /tmp/sco-phase3-coverage.txt
            /tmp/sco-phase3-learning-coverage.txt
            /tmp/sco-phase3-regressions.txt
            Aura_Staging/sco_construction_phase3_architect
            Aura_Staging/sco_construction_phase3_learning
          if-no-files-found: warn
          retention-days: 14
      - name: Synchronize verified docs and evidence once
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          python tools/sco_phase3_finalize.py
          rm -f \
            tools/sco_phase3_finalize.py \
            .github/workflows/sco-phase3-finalize.yml
      - name: Regenerate and verify exact topology in audit workspace
        run: |
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
          git diff --check
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ]; then
            git diff --exit-code -- \
              README.md \
              USER_GUIDE.md \
              .aura/ARCHITECTURE.md \
              docs/AURA_SCO_PHASE3_E7_E8_EXECUTION_PLAN.md \
              docs/evidence/AURA_SCO_PHASE3_E7_E11_VERIFICATION.json \
              .aura/CODEMAP.json \
              .aura/CODEMAP.md \
              topology_map.json
          fi
      - name: Commit synchronized documentation and topology
        if: github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Phase 3 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize SCO Construction Phase 3 evidence and topology"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="${AUTH_HEADER}" \
            push origin HEAD:"${HEAD_REF}"
