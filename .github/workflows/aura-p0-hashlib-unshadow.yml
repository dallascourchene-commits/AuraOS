name: Aura P0 Hashlib Unshadow

on:
  pull_request:
    paths:
      - ".github/workflows/aura-p0-hashlib-unshadow.yml"

permissions:
  contents: write

concurrency:
  group: aura-p0-hashlib-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone exact pull-request branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HEAD_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Remove function-local hashlib shadow
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          from pathlib import Path
          path = Path("aura_node.py")
          source = path.read_text(encoding="utf-8")
          old = "                import hashlib\n                from aura_qdkt import UnifiedQDKT\n"
          new = "                from aura_qdkt import UnifiedQDKT\n"
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
          elif new not in source:
              raise RuntimeError("hashlib shadow anchor is unavailable")
          PY
          python -m py_compile aura_node.py
          python -m pip install ruff --quiet
          ruff check --select E9,F63,F7,F82 aura_node.py

      - name: Commit exact repair when needed
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd repo
          git add aura_node.py
          if git diff --cached --quiet; then
            echo "hashlib shadow already removed"
            exit 0
          fi
          git config user.name "Aura P0 Repair Harness"
          git config user.email "aura-p0@users.noreply.github.com"
          git commit -m "fix: remove main-loop hashlib shadow"
          git push origin "HEAD:${HEAD_REF}"
