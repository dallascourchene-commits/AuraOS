name: Diagnose Construction G7-G8 Python tests

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-test-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements.txt jsonschema pytest ruff
      - name: Apply pending director repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("aura_construction_demo_director.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        }\n    )\n',
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        },\n        digest_size=32,\n    )\n',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Director tests
        run: python -m pytest -q --tb=short tests/test_aura_construction_demo_director.py
      - name: Fixture tests
        if: always()
        run: python -m pytest -q --tb=short tests/test_aura_construction_demo_fixture.py
      - name: Projection tests
        if: always()
        run: python -m pytest -q --tb=short tests/test_aura_construction_demo_projection.py
