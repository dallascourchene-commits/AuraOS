name: Update Architect Benchmark README

on:
  push:
    branches:
      - analysis/architect-benchmark
    paths:
      - docs/AURA_ARCHITECT_CONSOLIDATION_BENCHMARK.md
      - scripts/update_architect_benchmark_readme.py
      - .github/workflows/update-architect-benchmark-readme.yml

permissions:
  contents: write

concurrency:
  group: update-architect-benchmark-readme
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/architect-benchmark
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update README from verified benchmark evidence
        run: |
          python scripts/update_architect_benchmark_readme.py
          git diff --check
          grep -q "First Architect Consolidation Benchmark" README.md
          grep -q "89.88%" README.md
          grep -q "Council normalization lost plan-level contracts" README.md
      - name: Commit documentation update
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document first Architect benchmark in README"
          git push origin HEAD:analysis/architect-benchmark
