name: WO Phase3 exact local gate bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wo-phase3-local-gate-bundle-001.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/phase3-compass-bounded-projection
          fetch-depth: 0
      - name: Bind exact uncommitted branch base
        run: test "$(git rev-parse HEAD)" = '25a103b02752f3f58f95946352d40bf798e6cfda'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply deterministic repair without commit
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/phase3_patch.py
          python /tmp/phase3_patch.py
          python -m py_compile aura_coding_relationship_compass.py
          git diff --check
      - name: Build Python 3.13 local wheelhouse
        run: |
          mkdir -p /tmp/wheelhouse
          python -m pip download --dest /tmp/wheelhouse --only-binary=:all: \
            --python-version 3.13 --implementation cp \
            --platform manylinux_2_34_x86_64 --platform manylinux_2_28_x86_64 \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux1_x86_64 --abi cp313 --abi abi3 --abi none \
            'aiosqlite>=0.20,<1' 'ddgs>=6,<10' 'wasmtime>=20,<46' \
            'arxiv>=1.4,<3' 'watchdog>=3,<5' 'zstandard>=0.23,<1' \
            'pytest-asyncio>=0.23,<1' 'cryptography>=41,<47'
      - name: Package uncommitted repaired source tree
        run: |
          tar --exclude=.git -czf /tmp/phase3-local-repair-tree.tar.gz .
          sha256sum /tmp/phase3-local-repair-tree.tar.gz /tmp/wheelhouse/* > /tmp/phase3-local-bundle.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: wo-phase3-local-gate-bundle-${{ github.run_id }}
          path: |
            /tmp/phase3-local-repair-tree.tar.gz
            /tmp/phase3-local-bundle.sha256
            /tmp/wheelhouse
          if-no-files-found: error
          retention-days: 7
