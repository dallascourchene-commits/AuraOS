name: PR255 Nested Record Repair V7

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr255-arch-v2-nested-record-materializer.yml

permissions:
  contents: write

jobs:
  prove_and_promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Checkout frozen PR head
        uses: actions/checkout@v4
        with:
          ref: 9c179fcfb753752830415a525634ae02729ad59b
          path: work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove and promote exact repair
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../control/.github/pr255_nested_record_runner.sh
