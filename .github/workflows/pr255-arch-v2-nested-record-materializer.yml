name: PR255 ARCH v2 Nested Record Materializer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pr255-arch-v2-nested-record-materializer
  cancel-in-progress: false

jobs:
  prove-and-promote:
    if: github.event.issue.title == 'PR255 ARCH v2 nested-record repair 9c179fcf'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable frozen PR head
        uses: actions/checkout@v4
        with:
          ref: 9c179fcfb753752830415a525634ae02729ad59b
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9c179fcfb753752830415a525634ae02729ad59b"
          git fetch --no-tags origin 879b5fb056b70d150b1646e082223330a36c2912
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact nested-record admission transaction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          code_path = Path("aura_ephemeral_workspace_contracts.py")
          code = code_path.read_text(encoding="utf-8")

          authority_anchor = '''def _exact_authority_envelope(value: Any, name: str) -> AuthorityEnvelope:
              """Admit only the exact record type or one detached serialized mapping."""
              if type(value) is AuthorityEnvelope:
                  return value
              if isinstance(value, Mapping):
                  return AuthorityEnvelope.from_dict(value)
              raise ValueError(f"{name} must be an exact AuthorityEnvelope or serialized object")


          @dataclass(frozen=True)
          class CanonicalReference:
          '''
          authority_replacement = '''def _exact_authority_envelope(value: Any, name: str) -> AuthorityEnvelope:
              """Admit only the exact record type or one detached serialized mapping."""
              if type(value) is AuthorityEnvelope:
                  return value
              if isinstance(value, Mapping):
                  return AuthorityEnvelope.from_dict(value)
              raise ValueError(f"{name} must be an exact AuthorityEnvelope or serialized object")


          def _exact_contract_record(value: Any, record_type: type[Any], name: str) -> Any:
              """Admit an exact contract record or parse one detached serialized mapping."""
              if type(value) is record_type:
                  return value
              if isinstance(value, Mapping):
                  return record_type.from_dict(value)
              raise ValueError(
                  f"{name} must be an exact {record_type.__name__} or serialized object"
              )


          @dataclass(frozen=True)
          class CanonicalReference:
          '''
          code = replace_once(code, authority_anchor, authority_replacement, "generic exact-record helper")

          code = replace_once(
              code,
              '''        reference = raw_reference if isinstance(raw_reference, CanonicalReference) else CanonicalReference.from_dict(raw_reference)
          ''',
              '''        reference = _exact_contract_record(
                      raw_reference, CanonicalReference, f"{name} reference"
                  )
          ''',
              "reference-map exactness",
          )

          code = replace_once(
              code,
              '''        if not isinstance(self.repository_identity, RepositoryIdentity):
                      object.__setattr__(self, "repository_identity", RepositoryIdentity.from_dict(self.repository_identity))
          ''',
              '''        object.__setattr__(
                      self,
                      "repository_identity",
                      _exact_contract_record(
                          self.repository_identity,
                          RepositoryIdentity,
                          "project.repository_identity",
                      ),
                  )
          ''',
              "repository identity exactness",
          )

          code = replace_once(
              code,
              '''            refs = tuple(item if isinstance(item, CanonicalReference) else CanonicalReference.from_dict(item) for item in items)
          ''',
              '''            refs = tuple(
                          _exact_contract_record(
                              item, CanonicalReference, f"project.{name} item"
                          )
                          for item in items
                      )
          ''',
              "project reference exactness",
          )

          code = replace_once(
              code,
              '''    result = tuple(
                  item if isinstance(item, CanonicalReference) else CanonicalReference.from_dict(item)
                  for item in items
              )
          ''',
              '''    result = tuple(
                  _exact_contract_record(item, CanonicalReference, f"{name} item")
                  for item in items
              )
          ''',
              "recipe reference exactness",
          )

          code = replace_once(
              code,
              '''        if not isinstance(self.base_manifest_ref, CanonicalReference):
                      object.__setattr__(self, "base_manifest_ref", CanonicalReference.from_dict(self.base_manifest_ref))
          ''',
              '''        object.__setattr__(
                      self,
                      "base_manifest_ref",
                      _exact_contract_record(
                          self.base_manifest_ref,
                          CanonicalReference,
                          "recipe.base_manifest_ref",
                      ),
                  )
          ''',
              "base-manifest reference exactness",
          )

          code = replace_once(
              code,
              '''        if not isinstance(self.budgets, WorkspaceBudget):
                      object.__setattr__(self, "budgets", WorkspaceBudget.from_dict(self.budgets))
          ''',
              '''        object.__setattr__(
                      self,
                      "budgets",
                      _exact_contract_record(self.budgets, WorkspaceBudget, "recipe.budgets"),
                  )
          ''',
              "recipe budget exactness",
          )

          code = replace_once(
              code,
              '''        expected_manifest = expected_base_manifest_ref if isinstance(expected_base_manifest_ref, CanonicalReference) else CanonicalReference.from_dict(expected_base_manifest_ref)
          ''',
              '''        expected_manifest = _exact_contract_record(
                      expected_base_manifest_ref,
                      CanonicalReference,
                      "expected_base_manifest_ref",
                  )
          ''',
              "expected manifest reference exactness",
          )

          code = replace_once(
              code,
              '''        if not isinstance(self.evidence_ref, CanonicalReference):
                      object.__setattr__(self, "evidence_ref", CanonicalReference.from_dict(self.evidence_ref))
          ''',
              '''        object.__setattr__(
                      self,
                      "evidence_ref",
                      _exact_contract_record(
                          self.evidence_ref,
                          CanonicalReference,
                          "referent.evidence_ref",
                      ),
                  )
          ''',
              "referent evidence exactness",
          )

          code = replace_once(
              code,
              '''    elif isinstance(budgets, WorkspaceBudget):
                  budget = budgets
              else:
                  budget = WorkspaceBudget.from_dict(budgets)
          ''',
              '''    else:
                  budget = _exact_contract_record(budgets, WorkspaceBudget, "budgets")
          ''',
              "compiler budget exactness",
          )

          forbidden_fragments = (
              "isinstance(raw_reference, CanonicalReference)",
              "isinstance(item, CanonicalReference)",
              "isinstance(self.repository_identity, RepositoryIdentity)",
              "isinstance(self.base_manifest_ref, CanonicalReference)",
              "isinstance(self.budgets, WorkspaceBudget)",
              "isinstance(expected_base_manifest_ref, CanonicalReference)",
              "isinstance(self.evidence_ref, CanonicalReference)",
              "isinstance(budgets, WorkspaceBudget)",
          )
          for fragment in forbidden_fragments:
              if fragment in code:
                  raise SystemExit(f"stale subclass-retaining branch remains: {fragment}")
          code_path.write_text(code, encoding="utf-8")

          test_path = Path("tests/test_aura_ephemeral_workspace_contracts.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_nested_contract_subclasses_are_rejected_before_parent_signing()"
          if marker in tests:
              raise SystemExit("nested-record regression already exists")
          tests += '''


def test_nested_contract_subclasses_are_rejected_before_parent_signing() -> None:
              """Nested records must be exact types or detached serialized mappings."""
              class RedirectedReference(CanonicalReference):
                  def to_dict(self) -> dict[str, Any]:
                      payload = super().to_dict()
                      payload["owner"] = "attacker.owner"
                      return payload

              class RedirectedRepository(RepositoryIdentity):
                  def to_dict(self) -> dict[str, Any]:
                      payload = super().to_dict()
                      payload["repository"] = "attacker/repository"
                      return payload

              class RedirectedBudget(WorkspaceBudget):
                  def to_dict(self) -> dict[str, int]:
                      payload = super().to_dict()
                      payload["memory_mb"] = 1
                      return payload

              redirected_reference = RedirectedReference(
                  "adapter:subclass",
                  "canonical.owner",
                  "owner://adapter:subclass",
                  D["2"],
              )
              with pytest.raises(ValueError, match="exact CanonicalReference"):
                  recipe(adapters=(redirected_reference,))

              trusted_project = project()
              repository = trusted_project.repository_identity
              redirected_repository = RedirectedRepository(
                  repository.repository,
                  repository.ref,
                  repository.commit_sha,
                  repository.source_tree_digest,
              )
              with pytest.raises(ValueError, match="exact RepositoryIdentity"):
                  replace(trusted_project, repository_identity=redirected_repository)

              redirected_budget = RedirectedBudget(memory_mb=512)
              with pytest.raises(ValueError, match="exact WorkspaceBudget"):
                  recipe(budgets=redirected_budget)
          '''
          test_path.write_text(tests, encoding="utf-8")

          docs_path = Path("docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = replace_once(
              docs,
              "The focused suite contains **43 tests** covering the original review waves plus the structural repair:",
              "The focused suite contains **44 tests** covering the original review waves plus the structural repair:",
              "documentation test count",
          )
          docs = replace_once(
              docs,
              "- manifest/recipe TTL, complete resource-budget ceilings, and exact authority-record admission;",
              "- manifest/recipe TTL, complete resource-budget ceilings, and exact authority/nested-record admission;",
              "documentation nested-record coverage",
          )
          docs = replace_once(
              docs,
              "- focused tests: **43 passed**;",
              "- focused tests: **44 passed**;",
              "documentation verification receipt",
          )
          docs_path.write_text(docs, encoding="utf-8")
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            aura_ephemeral_workspace_contracts.py
            docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md
            tests/test_aura_ephemeral_workspace_contracts.py
          )
          printf '%s\n' "${changed[@]}" > /tmp/pr255-changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/pr255-expected.txt
          diff -u /tmp/pr255-expected.txt /tmp/pr255-changed.txt

      - name: Install focused verification tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema ruff

      - name: Prove compilation tests lint and schemas
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_contracts.py | tee /tmp/pr255-pytest.txt
          grep -Eq '^44 passed in ' /tmp/pr255-pytest.txt
          python -m pytest --collect-only -q tests/test_aura_ephemeral_workspace_contracts.py | tee /tmp/pr255-collect.txt
          grep -Eq '^44 tests collected in ' /tmp/pr255-collect.txt
          ruff check --select F401,F821,F841 aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for name in (
              "aura_project_context_projection.schema.json",
              "aura_ephemeral_workspace_recipe.schema.json",
              "aura_multimodal_spatial_observation.schema.json",
          ):
              schema = json.loads((Path("schemas") / name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          PY

      - name: Prove final PR scope and negative evidence
        run: |
          set -euo pipefail
          BASE=879b5fb056b70d150b1646e082223330a36c2912
          mapfile -t final_changed < <(git diff --name-only "$BASE" -- | sort)
          cat > /tmp/pr255-final-expected.txt <<'EOF'
          .aura/refactor_objectives/intent_native_spatial_workspace_pr1.v1.json
          .aura/waboose_requests/intent_native_spatial_workspace_pr1.v1.json
          aura_ephemeral_workspace_contracts.py
          docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md
          schemas/aura_ephemeral_workspace_recipe.schema.json
          schemas/aura_multimodal_spatial_observation.schema.json
          schemas/aura_project_context_projection.schema.json
          tests/test_aura_ephemeral_workspace_contracts.py
          EOF
          sort -o /tmp/pr255-final-expected.txt /tmp/pr255-final-expected.txt
          printf '%s\n' "${final_changed[@]}" > /tmp/pr255-final-actual.txt
          diff -u /tmp/pr255-final-expected.txt /tmp/pr255-final-actual.txt
          git diff --exit-code "$BASE" -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json
          test ! -e .github/workflows/pr255-arch-v2-nested-record-materializer.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -E 'CODEMAP|topology_map|live_topology_ast|pr255-arch-v2-nested-record-materializer' || true)"

      - name: Race guard commit and promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=refactor/intent-native-spatial-workspace-pr1
          FROZEN=9c179fcfb753752830415a525634ae02729ad59b
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$FROZEN"
          git config user.name 'AuraOS ARCH v2 Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add aura_ephemeral_workspace_contracts.py \
            tests/test_aura_ephemeral_workspace_contracts.py \
            docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix(pr1): close nested record serialization gaps'
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$FROZEN"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:"refs/heads/$BRANCH"
          unset AUTH_HEADER

      - name: Report completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "PR255 nested-record materializer completed with status: ${{ job.status }}."
