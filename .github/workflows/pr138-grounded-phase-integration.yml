name: Grounded Phase Capsule Integration Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr138-grounded-phase-audit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.ref == 'refactor/grounded-phase-capsule-compiler') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/grounded-phase-capsule-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1 ruff==0.5.0
      - name: Compile and statically verify integration
        run: |
          python -m py_compile \
            aura_cockpit_planner.py \
            aura_cost_experiment_runner.py \
            aura_empirical_cost_ledger.py \
            aura_showcase_observatory_handoff.py \
            tests/test_aura_cockpit_planner.py \
            tests/test_aura_empirical_cost_ledger_v2.py \
            tests/test_aura_showcase_observatory_crucible.py
          ruff check --select E9,F63,F7,F82,F401,F811,B006 \
            aura_cockpit_planner.py \
            aura_cost_experiment_runner.py \
            aura_empirical_cost_ledger.py \
            aura_showcase_observatory_handoff.py \
            tests/test_aura_cockpit_planner.py \
            tests/test_aura_empirical_cost_ledger_v2.py \
            tests/test_aura_showcase_observatory_crucible.py
          git diff --check
      - name: Run focused and canonical owner regressions
        run: |
          python -m pytest -q \
            tests/test_aura_cockpit_planner.py \
            tests/test_aura_coding_arena_grounding.py \
            tests/test_aura_empirical_cost_ledger_v2.py \
            tests/test_aura_empirical_cost_observatory.py \
            tests/test_aura_showcase_observatory_crucible.py
      - name: Regenerate and verify exact topology
        run: |
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
          git diff --check
      - name: Commit generated topology locally
        run: |
          git config user.name 'AuraOS Topology Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            Aura_Memory/live_topology_ast.json \
            topology_map.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'TOPOLOGY_COMMIT_NEEDED=false' >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -m 'docs: synchronize PR138 grounded capsule topology [skip ci]'
          echo 'TOPOLOGY_COMMIT_NEEDED=true' >> "$GITHUB_ENV"
      - name: Publish generated topology
        if: env.TOPOLOGY_COMMIT_NEEDED == 'true'
        run: |
          git push origin HEAD:refs/heads/refactor/grounded-phase-capsule-compiler
