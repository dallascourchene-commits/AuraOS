name: Aura GitHub Review Triad Gate

# SECURITY MODEL
# This enforcement workflow is useful only after it exists on the trusted default
# branch. It intentionally uses default-branch-triggered events and executes the
# default branch copy of the verifier. The pull request that initially installs
# this workflow is therefore a bootstrap HOLD and cannot self-certify admission.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  check_run:
    types: [completed]
  status:

permissions:
  contents: read

concurrency:
  group: >-
    aura-review-triad-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.check_run.head_sha ||
      github.event.sha ||
      github.sha
    }}
  cancel-in-progress: true

jobs:
  trusted-review-triad:
    # Provider-event filtering prevents arbitrary comments/checks from fanning out
    # trusted gate runs. Evidence classification is still performed independently
    # by the verifier using pinned actor/App identities.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.sender.id == 199175422 || github.event.sender.id == 136622811)) ||
      (github.event_name == 'check_run' &&
       (github.event.check_run.app.slug == 'codacy' ||
        github.event.check_run.app.slug == 'coderabbitai' ||
        github.event.check_run.app.slug == 'chatgpt-codex-connector')) ||
      (github.event_name == 'status' &&
       (github.event.sender.id == 199175422 ||
        github.event.sender.id == 136622811 ||
        contains(github.event.context, 'Codacy') ||
        contains(github.event.context, 'codacy')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: read
      issues: read
    steps:
      - name: Resolve PR and exact current head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          accept='Accept: application/vnd.github+json'
          version='X-GitHub-Api-Version: 2022-11-28'

          case "${{ github.event_name }}" in
            pull_request_target)
              PR_NUMBER='${{ github.event.pull_request.number }}'
              ;;
            issue_comment)
              PR_NUMBER='${{ github.event.issue.number }}'
              ;;
            check_run)
              PR_NUMBER='${{ github.event.check_run.pull_requests[0].number }}'
              if [ -z "$PR_NUMBER" ]; then
                HEAD_INPUT='${{ github.event.check_run.head_sha }}'
                PR_NUMBER="$(curl -fsSL \
                  -H "Authorization: Bearer $GH_TOKEN" -H "$accept" -H "$version" \
                  "$api/commits/$HEAD_INPUT/pulls?per_page=100" |
                  python3 -c 'import json,sys; xs=json.load(sys.stdin); print(xs[0]["number"] if xs else "")')"
              fi
              ;;
            status)
              HEAD_INPUT='${{ github.event.sha }}'
              PR_NUMBER="$(curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" -H "$accept" -H "$version" \
                "$api/commits/$HEAD_INPUT/pulls?per_page=100" |
                python3 -c 'import json,sys; xs=json.load(sys.stdin); print(xs[0]["number"] if xs else "")')"
              ;;
            *)
              exit 2
              ;;
          esac

          test -n "$PR_NUMBER"
          PR_JSON="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" -H "$accept" -H "$version" \
            "$api/pulls/$PR_NUMBER")"
          HEAD_SHA="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          DEFAULT_BRANCH="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["repo"]["default_branch"])')"
          test -n "$HEAD_SHA"
          test -n "$DEFAULT_BRANCH"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Fetch trusted default-branch verifier
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ steps.resolve.outputs.default_branch }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" = 'HEAD'
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -f scripts/aura_github_review_triad_gate.py
          test -f tests/test_aura_github_review_triad_gate.py

      - name: Re-prove trusted gate contract
        run: |
          python3 -m py_compile scripts/aura_github_review_triad_gate.py tests/test_aura_github_review_triad_gate.py
          python3 -m unittest -v tests.test_aura_github_review_triad_gate

      - name: Evaluate exact-head Codex + CodeRabbit + Codacy outcome
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AURA_PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          AURA_REVIEW_HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set +e
          python3 scripts/aura_github_review_triad_gate.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$AURA_PR_NUMBER" \
            --head "$AURA_REVIEW_HEAD_SHA" \
            --output aura-review-triad-receipt.json
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Revalidate PR head after evidence collection
        id: revalidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/$PR_NUMBER" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')"
          echo "current_head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_HEAD" = "$EXPECTED_HEAD" ]; then
            echo 'head_stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'head_stable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish trusted triad status on PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          GATE_RC: ${{ steps.gate.outputs.exit_code }}
          HEAD_STABLE: ${{ steps.revalidate.outputs.head_stable }}
        run: |
          set -euo pipefail
          state='failure'
          description='Review triad HOLD: inspect receipt'
          if [ "$GATE_RC" = '0' ] && [ "$HEAD_STABLE" = 'true' ]; then
            state='success'
            description='Codex + CodeRabbit + Codacy clean on exact head'
          elif [ "$HEAD_STABLE" != 'true' ]; then
            description='Review triad HOLD: PR head changed during evaluation'
          fi
          payload="$(python3 - "$state" "$description" <<'PY'
          import json, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": "Aura GitHub Review Triad Gate",
              "description": sys.argv[2],
          }))
          PY
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/$HEAD_SHA" \
            -d "$payload" >/dev/null
          test "$state" = 'success'

      - name: Upload trusted exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-review-triad-${{ steps.resolve.outputs.head_sha }}
          path: aura-review-triad-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Emit non-authority ceiling
        if: always()
        run: |
          echo 'TRUSTED_VERIFIER_FROM_DEFAULT_BRANCH=true'
          echo 'CODEX_REQUIRED=true'
          echo 'CODERABBIT_REQUIRED=true'
          echo 'CODACY_REQUIRED=true'
          echo 'UNRESOLVED_PROVIDER_FINDING_BLOCKS=true'
          echo 'REPAIR_PUSH_REQUIRES_FRESH_TRIAD=true'
          echo 'REVIEW_TRIAD_IS_MERGE_AUTHORITY=false'
          echo 'SEMANTIC_CORRECTNESS_MINTED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
