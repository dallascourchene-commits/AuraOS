name: PR236 repository identity repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refactor/bilateral-intent-pr3-enforcement

      - name: Install repository test requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply repository identity repair
        run: python .github/pr236_identity_fix.py.tmp

      - name: Verify focused bilateral behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_aura_bilateral_planning_enforcement.py
          python -m ruff check \
            aura_arena_architect_connector.py \
            aura_architect_loop.py \
            tests/test_aura_bilateral_planning_enforcement.py \
            --select E9,F63,F7,F82
          python -m py_compile \
            aura_arena_architect_connector.py \
            aura_architect_loop.py \
            tests/test_aura_bilateral_planning_enforcement.py

      - name: Publish verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add -- \
            aura_arena_architect_connector.py \
            aura_architect_loop.py \
            tests/test_aura_bilateral_planning_enforcement.py
          git commit -m "fix(pr236): fail closed on repository identity errors"
          git push origin HEAD:refactor/bilateral-intent-pr3-enforcement
