name: PR236 manual review repairs

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refactor/bilateral-intent-pr3-enforcement

      - name: Apply manually authored repairs
        run: python .github/pr236_manual_repairs.py

      - name: Run bilateral enforcement tests
        run: python -m pytest -q tests/test_aura_bilateral_planning_enforcement.py

      - name: Run focused static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            aura_coding_relationship_compass.py \
            aura_external_llm_session.py \
            aura_arena_architect_connector.py \
            tests/test_aura_bilateral_planning_enforcement.py \
            --select E9,F63,F7,F82
          python -m py_compile \
            aura_coding_relationship_compass.py \
            aura_external_llm_session.py \
            aura_arena_architect_connector.py \
            tests/test_aura_bilateral_planning_enforcement.py

      - name: Commit repairs and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr236-source-materialize.yml
          rm -f .github/pr236_manual_repairs.py
          rm -f .aura/pr236_source_materialization.trigger
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add -A -- \
            aura_coding_relationship_compass.py \
            aura_external_llm_session.py \
            aura_arena_architect_connector.py \
            tests/test_aura_bilateral_planning_enforcement.py \
            .github/workflows/pr236-source-materialize.yml \
            .github/pr236_manual_repairs.py \
            .aura/pr236_source_materialization.trigger
          git commit -m "fix(pr236): manually resolve remaining review findings"
          git push origin HEAD:refactor/bilateral-intent-pr3-enforcement
