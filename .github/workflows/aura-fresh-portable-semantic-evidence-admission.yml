name: Aura Fresh Portable Semantic Evidence Admission

on:
  pull_request:
    paths:
      - "tools/aura_fresh_portable_semantic_evidence_admission.py"
      - "tools/aura_semantic_generation_freshness.py"
      - "tools/arena_portable_semantic_evidence_transfer.py"
      - "tests/test_aura_fresh_portable_semantic_evidence_admission.py"
      - ".github/workflows/aura-fresh-portable-semantic-evidence-admission.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fresh-portable-semantic-evidence-admission:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact A6 head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact A5 x O61 convergence and materialized owners
        shell: bash
        run: |
          set -euo pipefail
          CONVERGENCE=a205d851d6ee251316b690727d5f29ac374cf950
          A5=6926acabaf1a6543b52e0af4042fcb4bcac45d2f
          O61=1e37cf78cb1aee0a6605f7b8fc99ec3632279b11
          test "$(git show -s --format=%P "$CONVERGENCE")" = "$A5 $O61"
          git merge-base --is-ancestor "$CONVERGENCE" HEAD
          test "$(git rev-parse "$O61:tools/arena_portable_semantic_evidence_transfer.py")" = "$(git rev-parse HEAD:tools/arena_portable_semantic_evidence_transfer.py)"
          git cat-file -e "$A5:tools/aura_semantic_generation_freshness.py"
          echo A6_TRUE_TWO_PARENT_CONVERGENCE=true

      - name: Revalidate exact parent hosted generations and semantic times
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, urllib.request

          cut=datetime.fromisoformat('2026-08-31T13:12:59+00:00')
          expected=[
              (33396232285,'6926acabaf1a6543b52e0af4042fcb4bcac45d2f','Aura Semantic Generation Freshness',99501302648),
              (33396234209,'1e37cf78cb1aee0a6605f7b8fc99ec3632279b11','Aura Arena Portable Semantic Evidence Transfer',99501304240),
          ]
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          for run_id,head,name,job_id in expected:
              run=get(f'actions/runs/{run_id}')
              assert run['status']=='completed' and run['conclusion']=='success',run
              assert run['head_sha']==head,(run_id,run['head_sha'],head)
              assert run['name']==name,(run_id,run['name'],name)
              jobs=get(f'actions/runs/{run_id}/jobs')['jobs']
              job=[j for j in jobs if j['id']==job_id]
              assert len(job)==1 and job[0]['conclusion']=='success',jobs
              commit=get(f'commits/{head}')
              semantic_at=datetime.fromisoformat(commit['commit']['committer']['date'].replace('Z','+00:00')).astimezone(timezone.utc)
              assert semantic_at > cut,(head,semantic_at,cut)
          print('A6_PARENT_GENERATIONS_EXACT_GREEN_AND_POST_CUT=true')
          PY

      - name: Prove O61 producer generations are historically pre-cut
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          cut=datetime.fromisoformat('2026-08-31T13:12:59+00:00')
          expected={
            '4137aabd972feff9c4412bb4786ef8fd4de207e0':'2026-08-31T07:52:28+00:00',
            '21e67a4a744806d7637f6d6d68e97801f692fef6':'2026-08-31T07:52:30+00:00',
          }
          for head,iso in expected.items():
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/commits/{head}',headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: c=json.load(r)
              observed=datetime.fromisoformat(c['commit']['committer']['date'].replace('Z','+00:00')).astimezone(timezone.utc)
              assert observed==datetime.fromisoformat(iso), (head,observed,iso)
              assert observed < cut,(head,observed,cut)
          print('A6_HISTORICAL_PRODUCER_GENERATIONS_PRE_CUT=true')
          PY

      - name: Compile and run A5 plus A6 adversarial contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/aura_semantic_generation_freshness.py \
            tools/arena_portable_semantic_evidence_transfer.py \
            tools/aura_fresh_portable_semantic_evidence_admission.py \
            tests/test_aura_fresh_portable_semantic_evidence_admission.py
          PYTHONPATH=. python3 -m unittest -v \
            tests.test_aura_fresh_portable_semantic_evidence_admission

      - name: Emit exact A6 fixture and enforce nonpromotion
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 tools/aura_fresh_portable_semantic_evidence_admission.py | tee /tmp/a6.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/a6.json',encoding='utf-8'))
          for lane in ('q6','r3'):
              x=r[lane]
              assert x['portable_semantic_evidence_admitted'] is True
              assert x['portable_evidence_reuse_allowed'] is True
              assert x['freshness_disposition']=='PRE_CUT_SEMANTIC_GENERATION'
              assert x['semantic_sibling_credit'] is False
              for key in ('producer_generation_authenticated','semantic_truth_minted','broader_claims_inherited','effect_authority_granted','semantic_k27_authority_minted','native_private_transformer_kv_accessed','gate10_promoted','merge_or_deployment_authorized'):
                  assert x[key] is False,key
          print('A6_PORTABLE_REUSE_WITHOUT_FRESHNESS_LAUNDERING=true')
          print('A6_RECEIPT_DIGEST='+r['receipt_digest'])
          PY

      - name: Consequence ceiling
        run: |
          echo 'PortableEvidenceReusable != FreshSemanticSibling.'
          echo 'TransferTime != ProducerSemanticGenerationTime.'
          echo 'K27 coordinate/replica growth != semantic-generation advance.'
          echo 'No semantic truth, native/private KV access, Gate-10, merge, deployment, provider, public or human effect.'
