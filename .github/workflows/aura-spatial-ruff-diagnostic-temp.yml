name: Aura Spatial Ruff Diagnostic Temp

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-ruff-diagnostic-temp.yml"
      - "aura_spatial_construction.py"
      - "aura_review_lessons_security.py"
      - "tests/test_aura_spatial_waboose_precision.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone exact PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --no-tags --depth=1 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff
      - name: Capture diagnostics
        run: |
          mkdir -p /tmp/aura-ruff-diagnostic
          python -m ruff check --output-format=json \
            aura_spatial_construction.py \
            aura_review_lessons_security.py \
            tests/test_aura_spatial_waboose_precision.py \
            > /tmp/aura-ruff-diagnostic/check.json || true
          python -m ruff format --check \
            aura_spatial_construction.py \
            aura_review_lessons_security.py \
            tests/test_aura_spatial_waboose_precision.py \
            > /tmp/aura-ruff-diagnostic/format.txt 2>&1 || true
          cat /tmp/aura-ruff-diagnostic/check.json
          cat /tmp/aura-ruff-diagnostic/format.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-ruff-diagnostic-${{ github.sha }}
          path: /tmp/aura-ruff-diagnostic
          retention-days: 1
