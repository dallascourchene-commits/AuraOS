name: TEMP PR3 Apply CodeRabbit Minor Fixes

on:
  push:
    branches:
      - "analysis/pr3-coderabbit-minors-20260808"

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-first-project-context-pr3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff>=0.5" "pytest>=8.2,<9" "jsonschema>=4.23,<5"
      - name: Apply verified PR3 boundary fixes and regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path("aura_project_context_compiler.py")
          text = compiler.read_text(encoding="utf-8")

          old_conflict = '''        if self.conflict_key:\n            object.__setattr__(self, "conflict_key", _id(self.conflict_key, "conflict_key"))\n'''
          new_conflict = '''        if type(self.conflict_key) is not str:\n            raise TypeError("conflict_key must be a string")\n        if self.conflict_key:\n            object.__setattr__(self, "conflict_key", _id(self.conflict_key, "conflict_key"))\n'''
          if old_conflict not in text:
              raise SystemExit("expected conflict_key block not found")
          text = text.replace(old_conflict, new_conflict, 1)

          old_candidate_map = '''    candidate_map = {item.candidate_id: item for item in candidates}\n    if len(candidate_map) != len(candidates):\n        raise ValueError("duplicate candidate_id")\n    reference_ids = [\n'''
          new_candidate_map = '''    candidate_map = {item.candidate_id: item for item in candidates}\n    if len(candidate_map) != len(candidates):\n        raise ValueError("duplicate candidate_id")\n    if MISSING_SELECTED_SOURCE_ID in candidate_map:\n        raise ValueError(\n            f"candidate_id {MISSING_SELECTED_SOURCE_ID!r} is reserved for the "\n            "missing exact-current answer-determining source receipt marker"\n        )\n    reference_ids = [\n'''
          if old_candidate_map not in text:
              raise SystemExit("expected candidate_map block not found")
          text = text.replace(old_candidate_map, new_candidate_map, 1)
          compiler.write_text(text, encoding="utf-8")

          tests = Path("tests/test_aura_project_context_compiler.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_conflict_key_rejects_falsy_non_string_values"
          if marker not in test_text:
              test_text += '''\n\n@pytest.mark.parametrize("bad_conflict_key", [None, 0, False])\ndef test_conflict_key_rejects_falsy_non_string_values(bad_conflict_key) -> None:\n    with pytest.raises(TypeError, match="conflict_key must be a string"):\n        _candidate(\n            "decision:bad-conflict",\n            CandidateCategory.DECISION,\n            D["2"],\n            conflict_key=bad_conflict_key,\n        )\n\n\ndef test_reserved_missing_source_marker_cannot_be_candidate_id() -> None:\n    reserved = _candidate(\n        "source:selected",\n        CandidateCategory.SOURCE,\n        D["2"],\n        answer_determining=True,\n    )\n    with pytest.raises(ValueError, match="reserved"):\n        _compile((reserved,))\n'''
              tests.write_text(test_text, encoding="utf-8")

          docs = Path("docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md")
          doc_text = docs.read_text(encoding="utf-8")
          doc_text = doc_text.replace(
              "- optional conflict key;\n",
              "- optional conflict key, which is always a string and is canonically validated when non-empty;\n",
              1,
          )
          security_anchor = "- graph edges reference candidates outside the task-conditioned set;\n"
          security_new = (
              "- caller-supplied candidate IDs collide with the reserved `source:selected` missing-source receipt marker;\n"
              + security_anchor
          )
          if security_new not in doc_text:
              if security_anchor not in doc_text:
                  raise SystemExit("expected security anchor not found")
              doc_text = doc_text.replace(security_anchor, security_new, 1)
          docs.write_text(doc_text, encoding="utf-8")
          PY
      - name: Validate patch surface
        run: |
          python -m py_compile aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          ruff check --select E9,F63,F7,F82 aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          git diff --check
          python -m pytest -q tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
      - name: Commit to PR3 branch
        run: |
          git config user.name "AuraOS PR3 Verification Worker"
          git config user.email "actions@users.noreply.github.com"
          git add aura_project_context_compiler.py tests/test_aura_project_context_compiler.py docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
          git commit -m "PR3: validate conflict key and reserve source sentinel"
          git push origin HEAD:refactor/source-first-project-context-pr3
