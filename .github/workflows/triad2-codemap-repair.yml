name: Triad2 CODEMAP Repair

on:
  push:
    paths:
      - '.github/workflows/triad2-codemap-repair.yml'

permissions:
  contents: write

concurrency:
  group: triad2-ci-codemap-repair-main
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[TRIAD2-FULL-CODEMAP-REPAIR]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase execution lane onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B triad2-full-codemap-repair origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install governed test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Patch CODEMAP and Architect compatibility contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(source: str, name: str, replacement: str) -> str:
              pattern = re.compile(rf'^def {re.escape(name)}\(.*?(?=^def |\Z)', re.MULTILINE | re.DOTALL)
              matches = list(pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one function {name}, found {len(matches)}')
              match = matches[0]
              return source[:match.start()] + replacement.rstrip() + '\n\n' + source[match.end():]

          nav_path = Path('aura_codebase_navigator.py')
          text = nav_path.read_text(encoding='utf-8')

          text = replace_function(text, 'load_or_compile_topology', r'''
          def load_or_compile_topology(
              root: Path,
              *,
              topology_path: Path | None = None,
              refresh: bool = False,
          ) -> tuple[dict[str, Any], str]:
              """Load or compile the canonical source-indexable deep topology."""
              target = topology_path or DEFAULT_TOPOLOGY_PATH
              absolute = target if target.is_absolute() else root / target

              def is_deep(payload: dict[str, Any]) -> bool:
                  meta = payload.get("meta") if isinstance(payload.get("meta"), dict) else {}
                  deep_marker = (
                      str(payload.get("status") or "") == "SYS_TOPOLOGY_DEEP_ACTIVE"
                      or str(meta.get("generated_by") or "") == "aura_topology_manager"
                  )
                  return deep_marker and bool(_topology_file_index(payload))

              if absolute.exists() and not refresh:
                  try:
                      existing = json.loads(absolute.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      existing = None
                  if isinstance(existing, dict) and is_deep(existing):
                      return existing, "compiled_deep_topology"

              previous_cwd = Path.cwd()
              try:
                  os.chdir(root)
                  topology = compile_topology_map(deep=True)
              finally:
                  os.chdir(previous_cwd)
              if not isinstance(topology, dict) or not is_deep(topology):
                  raise RuntimeError("deep topology compilation did not produce a source-indexable deep graph")
              if absolute != root / DEFAULT_TOPOLOGY_PATH:
                  absolute.parent.mkdir(parents=True, exist_ok=True)
                  absolute.write_text(json.dumps(topology, indent=2), encoding="utf-8")
              return topology, "compiled_deep_topology"
          ''')

          text = replace_function(text, '_topology_file_index', r'''
          def _topology_file_index(topology: dict[str, Any]) -> dict[str, dict[str, Any]]:
              """Normalize legacy dict/from-to and deep list/source-target topology schemas."""
              per_file: dict[str, dict[str, Any]] = defaultdict(lambda: {
                  "node_count": 0,
                  "out_edges": 0,
                  "in_edges": 0,
                  "kinds": Counter(),
                  "symbols": [],
                  "neighbor_files": set(),
                  "edge_kinds": Counter(),
              })
              raw_nodes = topology.get("nodes", {})
              if isinstance(raw_nodes, dict):
                  node_items = list(raw_nodes.items())
              elif isinstance(raw_nodes, list):
                  node_items = [
                      (str(node.get("id") or f"node_{index}"), node)
                      for index, node in enumerate(raw_nodes)
                      if isinstance(node, dict)
                  ]
              else:
                  node_items = []

              node_to_file: dict[str, str] = {}
              for node_id, node in node_items:
                  if not isinstance(node, dict):
                      continue
                  file_path = _node_file(str(node_id), node)
                  if not file_path:
                      continue
                  node_to_file[str(node_id)] = file_path
                  slot = per_file[file_path]
                  slot["node_count"] += 1
                  slot["kinds"][str(node.get("kind", "unknown"))] += 1
                  symbol = str(node.get("symbol") or node.get("label") or "")
                  if symbol and symbol != "global_scope" and len(slot["symbols"]) < 12 and symbol not in slot["symbols"]:
                      slot["symbols"].append(symbol)

              for edge in topology.get("edges", []) or []:
                  if not isinstance(edge, dict):
                      continue
                  source_id = str(edge.get("from") or edge.get("source") or "")
                  target_id = str(edge.get("to") or edge.get("target") or "")
                  source_file = node_to_file.get(source_id)
                  target_file = node_to_file.get(target_id)
                  kind = str(edge.get("kind") or edge.get("type") or "unknown")
                  if source_file:
                      per_file[source_file]["out_edges"] += 1
                      per_file[source_file]["edge_kinds"][kind] += 1
                  if target_file:
                      per_file[target_file]["in_edges"] += 1
                      per_file[target_file]["edge_kinds"][kind] += 1
                  if source_file and target_file and source_file != target_file:
                      per_file[source_file]["neighbor_files"].add(target_file)
                      per_file[target_file]["neighbor_files"].add(source_file)

              out: dict[str, dict[str, Any]] = {}
              for file_path, payload in per_file.items():
                  out_edges = int(payload["out_edges"])
                  in_edges = int(payload["in_edges"])
                  node_count = int(payload["node_count"])
                  degree = out_edges + in_edges
                  out[file_path] = {
                      "node_count": node_count,
                      "edge_count": degree,
                      "degree": degree,
                      "symbols": sorted(str(item) for item in payload["symbols"]),
                      "neighbor_files": sorted(str(item) for item in payload["neighbor_files"]),
                      "edge_kinds": dict(sorted(payload["edge_kinds"].items())),
                      "nodes": node_count,
                      "out_edges": out_edges,
                      "in_edges": in_edges,
                      "kinds": dict(sorted(payload["kinds"].items())),
                  }
              return out
          ''')

          if '"binary": is_binary,' not in text:
              old = '        "role": classify_file(path),\n        "bytes": len(raw),'
              new = '        "role": classify_file(path),\n        "binary": is_binary,\n        "bytes": len(raw),'
              if text.count(old) != 1:
                  raise SystemExit('unable to locate _scan_file binary insertion point')
              text = text.replace(old, new, 1)

          if '"binary": bool(card.get("binary", False)),' not in text:
              old = '            "role": card["role"],\n            "bytes": card["bytes"],'
              new = '            "role": card["role"],\n            "binary": bool(card.get("binary", False)),\n            "bytes": card["bytes"],'
              if text.count(old) != 1:
                  raise SystemExit('unable to locate compact-card binary insertion point')
              text = text.replace(old, new, 1)

          if '"all_included_paths_sorted": sorted(source_paths),' not in text:
              marker = '        "repo_file_count": len(cards),\n        "source_paths_without_topology": missing_source_paths[:100],'
              replacement = '        "repo_file_count": len(cards),\n        "all_included_paths_sorted": sorted(source_paths),\n        "source_paths_without_topology": missing_source_paths[:100],'
              if text.count(marker) != 1:
                  raise SystemExit('unable to locate coverage compatibility insertion point')
              text = text.replace(marker, replacement, 1)

          text = replace_function(text, 'build_navigation_system', r'''
          def build_navigation_system(
              root: Path,
              *,
              include_topology: bool = True,
              topology_path: Path | None = None,
              refresh_topology: bool = False,
          ) -> dict[str, Any]:
              started = time.perf_counter()
              cards = scan_repository(root)
              topology: dict[str, Any] | None = None
              topology_source = "disabled"
              topology_index: dict[str, dict[str, Any]] = {}
              if include_topology:
                  topology, topology_source = load_or_compile_topology(
                      root,
                      topology_path=topology_path,
                      refresh=refresh_topology,
                  )
                  topology_index = _topology_file_index(topology)
                  cards = _attach_topology(cards, topology_index)
              payload = {
                  "status": "AURA_CODEMAP_ACTIVE",
                  "generated_by": "aura_codebase_navigator",
                  "generated_at_unix": int(time.time()),
                  "root": root.as_posix(),
                  "intent_packet": "[OP:NAVIGATE][DOMAIN:TOPOLOGY][TARGET:CODEMAP][ENV:PYTHON][CONSTRAINT:TOKEN_SPARING]",
                  "coverage": _coverage_report(cards, topology),
                  "rings": _navigation_rings(cards),
                  "symbol_index": _symbol_index(cards),
                  "command_index": _command_index(cards),
                  "top_hubs": _top_hubs(cards),
                  "files": _compact_file_cards(cards),
                  "topology": {"source": topology_source, "file_index": topology_index},
                  "summary": {
                      "file_count": len(cards),
                      "total_bytes": sum(int(card.get("bytes", 0)) for card in cards),
                      "text_tokens_est": sum(int(card.get("tokens_est", 0)) for card in cards),
                      "role_counts": dict(sorted(Counter(str(card.get("role", "support_file")) for card in cards).items())),
                      "topology_nodes": len((topology or {}).get("nodes", {})),
                      "topology_edges": len((topology or {}).get("edges", [])),
                      "topology_source": topology_source,
                      "elapsed_ms": round((time.perf_counter() - started) * 1000.0, 2),
                  },
                  "navigation_protocol": [
                      "Read .aura/CODEMAP.md first.",
                      "Use command_index for bang commands before opening the REPL monolith.",
                      "Use symbol_index semantic_id/signature_hash entries first, then current line ranges.",
                      "Open only the top query hits plus their topology.neighbor_files.",
                      "After any successful file write, run --refresh on touched paths instead of rebuilding the whole map.",
                  ],
              }
              return payload
          ''')
          nav_path.write_text(text, encoding='utf-8')

          architect_path = Path('aura_architect_loop.py')
          architect = architect_path.read_text(encoding='utf-8')
          architect = replace_function(architect, '_refresh_plan_codemap_targets', r'''
          def _refresh_plan_codemap_targets(plan: FractalPlanCapsule, repo_root: str | Path) -> None:
              root = Path(repo_root)
              # Refresh may update an existing snapshot, but must never create truth
              # in a repository that has no CODEMAP. Grounding fails closed there.
              if not (root / ".aura" / "CODEMAP.json").is_file():
                  return
              targets = sorted({
                  normalized
                  for normalized in (_normalize_path(act.target_file) for act in plan.act_capsules)
                  if normalized
              })
              if not targets:
                  return
              try:
                  refresh_codemap_for_paths(targets, root=root, include_topology=True)
              except Exception as exc:
                  _LOG.debug("CODEMAP target preflight refresh skipped: %s", type(exc).__name__)
                  return
          ''')
          architect = replace_function(architect, '_codemap_paths', r'''
          def _codemap_paths(codemap: dict[str, Any]) -> set[str]:
              coverage = codemap.get("coverage", {})
              paths = set()
              for item in coverage.get("all_included_paths_sorted", []) or []:
                  normalized = _normalize_path(str(item))
                  if normalized:
                      paths.add(normalized)
              for key in ("file_cards", "files"):
                  for card in codemap.get(key, []) or []:
                      if not isinstance(card, dict):
                          continue
                      normalized = _normalize_path(str(card.get("path", "")))
                      if normalized:
                          paths.add(normalized)
              return paths
          ''')
          architect = replace_function(architect, '_file_card', r'''
          def _file_card(codemap: dict[str, Any], target_file: str | None) -> dict[str, Any]:
              normalized = _normalize_path(target_file)
              if not normalized:
                  return {}
              for key in ("file_cards", "files"):
                  for card in codemap.get(key, []) or []:
                      if not isinstance(card, dict):
                          continue
                      if _normalize_path(str(card.get("path", ""))) == normalized:
                          return card
              return {}
          ''')
          architect_path.write_text(architect, encoding='utf-8')
          PY
      - name: Regenerate deep topology and CODEMAP
        run: python aura_codebase_navigator.py --refresh-topology
      - name: Verify CODEMAP and grounded Architect contracts
        run: |
          python -m aura_codemap_verify
          python -m pytest -q tests/test_aura_codemap_verify.py test_aura_architect_loop.py
      - name: Commit validated repair and rebase currentness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aura Triad2 CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add aura_codebase_navigator.py aura_architect_loop.py .aura/CODEMAP.json .aura/CODEMAP.md
          git add topology_map.json Aura_Memory/live_topology_ast.json || true
          if git diff --cached --quiet; then
            echo 'No repair delta to commit.'
            exit 0
          fi
          git commit -m 'fix(ci): repair CODEMAP topology and Architect grounding contracts'
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
          git push origin HEAD:main
