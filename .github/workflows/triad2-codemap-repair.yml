name: Triad2 Minimal CODEMAP Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/triad2-codemap-repair.yml'

permissions:
  contents: write

concurrency:
  group: triad2-minimal-codemap-repair-main
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONPATH: ${{ github.workspace }}

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[TRIAD2-MINIMAL-CODEMAP-REPAIR]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bind exact current main generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install governed verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt hypothesis bandit

      - name: Repair Architect CODEMAP generation compatibility only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('aura_architect_loop.py')
          text = path.read_text(encoding='utf-8')

          def replace_function(source: str, name: str, replacement: str) -> str:
              pattern = re.compile(rf'^def {re.escape(name)}\(.*?(?=^def |\Z)', re.MULTILINE | re.DOTALL)
              matches = list(pattern.finditer(source))
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one function {name}, found {len(matches)}')
              match = matches[0]
              return source[:match.start()] + replacement.rstrip() + '\n\n' + source[match.end():]

          text = replace_function(text, '_refresh_plan_codemap_targets', r'''
          def _refresh_plan_codemap_targets(plan: FractalPlanCapsule, repo_root: str | Path) -> None:
              root = Path(repo_root)
              # Refresh is maintenance on an existing navigation plane. It must
              # never manufacture CODEMAP authority for a repository that has none.
              if not (root / ".aura" / "CODEMAP.json").is_file():
                  return
              targets = sorted({
                  normalized
                  for normalized in (_normalize_path(act.target_file) for act in plan.act_capsules)
                  if normalized
              })
              if not targets:
                  return
              try:
                  refresh_codemap_for_paths(targets, root=root, include_topology=True)
              except Exception as exc:
                  _LOG.debug("CODEMAP target preflight refresh skipped: %s", type(exc).__name__)
                  return
          ''')

          text = replace_function(text, '_codemap_paths', r'''
          def _codemap_paths(codemap: dict[str, Any]) -> set[str]:
              coverage = codemap.get("coverage", {})
              paths = set()
              for item in coverage.get("all_included_paths_sorted", []) or []:
                  normalized = _normalize_path(str(item))
                  if normalized:
                      paths.add(normalized)
              cards = codemap.get("files")
              if not isinstance(cards, list):
                  cards = codemap.get("file_cards", [])
              for card in cards or []:
                  if not isinstance(card, dict):
                      continue
                  normalized = _normalize_path(str(card.get("path", "")))
                  if normalized:
                      paths.add(normalized)
              return paths
          ''')

          text = replace_function(text, '_file_card', r'''
          def _file_card(codemap: dict[str, Any], target_file: str | None) -> dict[str, Any]:
              normalized = _normalize_path(target_file)
              if not normalized:
                  return {}
              cards = codemap.get("files")
              if not isinstance(cards, list):
                  cards = codemap.get("file_cards", [])
              for card in cards or []:
                  if not isinstance(card, dict):
                      continue
                  if _normalize_path(str(card.get("path", ""))) == normalized:
                      return card
              return {}
          ''')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify current and legacy CODEMAP consumer schemas
        run: |
          python - <<'PY'
          import aura_architect_loop as loop
          current = {"files": [{"path": "aura_fusion.py", "topology": {}}], "coverage": {}}
          legacy = {"file_cards": [{"path": "aura_fusion.py", "topology": {}}], "coverage": {}}
          for payload in (current, legacy):
              assert loop._codemap_paths(payload) == {"aura_fusion.py"}
              assert loop._file_card(payload, "aura_fusion.py")["path"] == "aura_fusion.py"
          PY

      - name: Regenerate canonical deep CODEMAP and source anchors
        run: |
          python aura_codebase_navigator.py --refresh-topology
          python scripts/aura_source_anchor_map.py --root .
          python scripts/aura_source_anchor_map.py --root . --check
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.aura/CODEMAP.json').read_text(encoding='utf-8'))
          cards = data.get('files', [])
          paths = {str(card.get('path')) for card in cards if isinstance(card, dict)}
          assert 'aura_architect_loop.py' in paths
          assert 'aura_fusion.py' in paths
          hits = data.get('symbol_index', {}).get('build_task_capsule', [])
          assert any(item.get('file') == 'aura_fusion.py' for item in hits if isinstance(item, dict))
          assert Path('topology_map.json').stat().st_size > 0
          assert Path('Aura_Memory/live_topology_ast.json').stat().st_size > 0
          print(f"CODEMAP files={len(cards)} topology_nodes={data.get('summary', {}).get('topology_nodes')} topology_edges={data.get('summary', {}).get('topology_edges')}")
          PY

      - name: Run exact P7 regression and fail-closed surface
        run: |
          python -m py_compile aura_architect_loop.py aura_codebase_navigator.py
          ruff check --select E4,E7,E9,F --ignore E721 aura_architect_loop.py
          python -m pytest -q \
            tests/test_aura_coding_arena_planning.py \
            tests/test_aura_coding_arena_planning_hardening.py \
            tests/test_aura_coding_arena_planning_contracts.py \
            tests/test_aura_coding_arena_planning_integrity.py \
            tests/test_aura_coding_arena_planning_benchmark.py \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_regression.py \
            tests/test_aura_planning_frontier.py \
            tests/test_aura_planning_events.py \
            test_aura_architect_loop.py \
            test_aura_liquid_planning_arena.py

      - name: Publish only if source generation remained current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$START_HEAD" ]; then
            echo "main advanced during verification; refusing stale CODEMAP publication"
            exit 1
          fi
          git config user.name 'Aura Triad2 CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add aura_architect_loop.py .aura/CODEMAP.json .aura/CODEMAP.md .aura/SOURCE_ANCHORS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repair delta produced.'
            exit 0
          fi
          git commit -m 'fix(ci): repair Architect CODEMAP grounding contract'
          git push origin HEAD:main
