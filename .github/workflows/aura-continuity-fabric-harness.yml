name: Aura Continuity Fabric Architecture Scan

on:
  pull_request:
    branches:
      - "work/ai-safe-architecture-harness-20260722"
    paths:
      - ".aura/CONTINUITY_FABRIC_HARNESS_REQUEST"
      - "docs/AURA_CONTINUITY_FABRIC_RESEARCH_INPUT.md"
      - ".github/workflows/aura-continuity-fabric-harness.yml"

permissions:
  contents: read
  statuses: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact analysis snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare Aura architecture harness
        run: |
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            prepare \
            --venv "${RUNNER_TEMP}/aura-harness-venv" \
            --install-requirements

      - name: Validate Aura architecture surfaces
        run: |
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            doctor \
            --venv "${RUNNER_TEMP}/aura-harness-venv" \
            > "${RUNNER_TEMP}/aura-harness-doctor.json"

      - name: Run exact-target Coding Relationship Compass
        env:
          OUTPUT_DIR: ${{ runner.temp }}/aura-continuity-compass-run
          AURA_VENV: ${{ runner.temp }}/aura-harness-venv
        run: |
          mkdir -p "${OUTPUT_DIR}"
          "${AURA_VENV}/bin/python" - <<'PY'
          import json
          import os
          import sys
          import traceback
          from pathlib import Path
          from aura_coding_relationship_compass import compile_coding_relationship_compass

          objective = (
              "Integrate purpose-conditioned consequence sensitivity, protected pathways, safe-update budgets, "
              "adaptive memory admission, exact-evidence retention, recurrence-gated consolidation, sensitivity-weighted "
              "Crucible replay, evidence-sufficiency retrieval, adaptive ST3GG fidelity, model-route sensitivity, and "
              "topology consequence mapping into Aura's existing canonical owners without duplicate truth, execution, "
              "memory, routing, continuity, or authority planes."
          )
          full_files = (
              "aura_coding_relationship_compass.py",
              "aura_relationship_contracts.py",
              "aura_change_graph.py",
              "aura_relationship_experience.py",
              "aura_qdkt_observations.py",
              "aura_qdkt.py",
              "aura_continuity_packet.py",
              "aura_st3gg_contracts.py",
              "aura_crucible_store.py",
              "aura_empirical_software_lab.py",
              "aura_harness_evolver.py",
              "aura_dikwp_router_pipeline.py",
              "aura_jspace_codec.py",
              "aura_model_cognome.py",
              "aura_planning_board.py",
              "aura_coding_waboose_breadboard.py",
          )
          focused_files = (
              "aura_coding_relationship_compass.py",
              "aura_relationship_contracts.py",
              "aura_change_graph.py",
              "aura_relationship_experience.py",
              "aura_qdkt_observations.py",
              "aura_qdkt.py",
              "aura_continuity_packet.py",
              "aura_st3gg_contracts.py",
              "aura_crucible_store.py",
              "aura_empirical_software_lab.py",
              "aura_harness_evolver.py",
          )
          target_symbols = (
              "compile_coding_relationship_compass",
              "evaluate_typed_relationship_compatibility",
              "build_compass_change_graph",
              "compile_compass_act_capsules",
              "lesson_eligibility",
              "crucible_replay_scenarios",
              "project_relationship_experience_advisory",
              "_check_crystallization",
              "crystallize",
              "J2ContinuityPacket",
              "ST3GGDecision",
              "prepare_st3gg_artifact",
              "record_run",
              "record_proposal",
              "define_empirical_task",
              "record_empirical_result",
              "analyze_transaction_outcome",
              "record_harness_prediction",
              "DIKWPEnvelope",
              "TaskContext",
              "AuraJState",
              "PlanningBoard",
              "compile_relationship_breadboard",
          )
          attempts = (
              {
                  "name": "objective_deep_exact_targets",
                  "target_files": full_files,
                  "target_symbols": target_symbols,
                  "atlas_profile": "OBJECTIVE_DEEP",
                  "max_hops": 2,
                  "max_nodes": 128,
                  "max_edges": 512,
                  "max_pairs": 4096,
              },
              {
                  "name": "objective_standard_exact_targets",
                  "target_files": full_files,
                  "target_symbols": target_symbols,
                  "atlas_profile": "OBJECTIVE_STANDARD",
                  "max_hops": 1,
                  "max_nodes": 96,
                  "max_edges": 384,
                  "max_pairs": 3072,
              },
              {
                  "name": "objective_standard_file_grounded",
                  "target_files": focused_files,
                  "target_symbols": (),
                  "atlas_profile": "OBJECTIVE_STANDARD",
                  "max_hops": 1,
                  "max_nodes": 64,
                  "max_edges": 256,
                  "max_pairs": 2016,
              },
          )
          output = Path(os.environ["OUTPUT_DIR"])
          errors = []
          packet = None
          succeeded_attempt = ""
          for attempt in attempts:
              try:
                  packet = compile_coding_relationship_compass(
                      objective,
                      repo_root=".",
                      target_files=attempt["target_files"],
                      target_symbols=attempt["target_symbols"],
                      max_target_files=16,
                      max_target_symbols=32,
                      max_atomic_nodes=72,
                      max_atlas_participants=64,
                      max_atlas_assessments=192,
                      max_required_tests=48,
                      max_neighborhood_hops=attempt["max_hops"],
                      max_neighborhood_nodes=attempt["max_nodes"],
                      max_neighborhood_edges=attempt["max_edges"],
                      max_neighborhood_candidate_pairs=attempt["max_pairs"],
                      max_neighborhood_output_bytes=4_000_000,
                      max_neighborhood_elapsed_ms=90_000,
                      atlas_profile=attempt["atlas_profile"],
                      include_source=False,
                      max_emergent_candidates=24,
                  )
                  succeeded_attempt = attempt["name"]
                  break
              except Exception as exc:
                  errors.append({
                      "attempt": attempt["name"],
                      "exception_type": type(exc).__name__,
                      "message": str(exc),
                      "traceback": traceback.format_exc(),
                  })

          diagnostics = {
              "ok": packet is not None,
              "succeeded_attempt": succeeded_attempt,
              "attempt_errors": errors,
              "proposal_only": True,
              "production_mutation": False,
              "patch_authority": "exact_source_spans_and_hashes_only",
          }
          (output / "objective_relationship_compass_diagnostics.json").write_text(
              json.dumps(diagnostics, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if packet is None:
              print(json.dumps(diagnostics, indent=2), file=sys.stderr)
              sys.exit(0)

          (output / "objective_relationship_compass.json").write_text(
              json.dumps(packet, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          verification = packet.get("bounded_emergent_verification") or {}
          graph = packet.get("change_graph") or {}
          summary = {
              "version": packet.get("version"),
              "succeeded_attempt": succeeded_attempt,
              "objective": packet.get("objective"),
              "compass_digest": packet.get("compass_digest"),
              "grounding_receipt_digest": packet.get("grounding_receipt_digest"),
              "matched_components": packet.get("matched_components"),
              "target_file": packet.get("target_file"),
              "target_symbol": packet.get("target_symbol"),
              "recommended_targets": packet.get("recommended_targets"),
              "required_tests": packet.get("required_tests"),
              "capability_classes": packet.get("capability_classes"),
              "typed_compatibility": packet.get("typed_compatibility"),
              "relationships_to_preserve": packet.get("relationships_to_preserve"),
              "prohibitions": packet.get("prohibitions"),
              "missing_roles": packet.get("missing_roles"),
              "required_adapters": packet.get("required_adapters"),
              "authority_constraints": packet.get("authority_constraints"),
              "accepted_emergent_candidates": verification.get("accepted_candidates", []),
              "rejected_emergent_candidates": verification.get("rejected_candidates", []),
              "change_graph_node_count": len(graph.get("nodes", []) or []),
              "phase_capsules": graph.get("phase_capsules", []),
              "council_route": packet.get("council_route"),
              "experience_projection_template": packet.get("experience_projection_template"),
              "safe_to_patch": packet.get("safe_to_patch"),
              "production_mutation": packet.get("production_mutation"),
              "human_review_required": packet.get("human_review_required"),
              "patch_authority": packet.get("patch_authority"),
          }
          (output / "objective_relationship_compass_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Record exact source identity
        env:
          OUTPUT_DIR: ${{ runner.temp }}/aura-continuity-compass-run
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path(os.environ["OUTPUT_DIR"])
          payload = {
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_branch": os.environ.get("GITHUB_HEAD_REF") or os.environ.get("GITHUB_REF_NAME", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "authority": "read_only_proposal_only_architecture_analysis",
          }
          (out / "source_identity.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Aura architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: aura-continuity-compass-${{ github.sha }}
          path: |
            ${{ runner.temp }}/aura-continuity-compass-run/**
            ${{ runner.temp }}/aura-harness-doctor.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish discoverable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="aura-continuity-fabric-harness" \
            -f description="Aura-native continuity Compass scan; run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
