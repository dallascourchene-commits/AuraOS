name: Architect Refactor V2 Tests

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "refactor/**"
      - main

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Compile V2 surfaces
        run: |
          python -m py_compile \
            aura_architect_council_v2.py \
            aura_cognitive_labor_router.py \
            aura_refactor_chronicle.py \
            aura_refactor_chronicle_recorded.py \
            aura_refactor_state_ledger.py \
            aura_external_llm_session_recorded.py \
            aura_external_llm_session_persistent.py \
            aura_hybrid_refactor_benchmark.py \
            tests/test_aura_refactor_chronicle_and_length.py
      - name: Run V2 tests with durable diagnostics
        run: |
          set -o pipefail
          python -m pytest -q tests/test_aura_refactor_chronicle_and_length.py 2>&1 | tee architect-v2-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-refactor-v2-test-diagnostics
          path: architect-v2-tests.log
          if-no-files-found: error
          retention-days: 14

  finalize-review:
    needs: v2-tests
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'reopened' &&
      github.event.pull_request.head.ref == 'analysis/architect-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/architect-benchmark
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Apply deterministic reconciliation
        run: |
          PYTHONPATH=. python scripts/pr131_finalize_reconciliation.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/architect-consolidation-benchmark.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'grep -q "Benchmark quality: **93.50**"',
              'grep -Fq "Benchmark quality: **93.50**"',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile reviewed fixes
        run: |
          python -m py_compile \
            aura_external_llm_session.py \
            aura_architect_benchmark_report.py \
            scripts/update_architect_benchmark_readme.py
      - name: Run external-session regressions
        run: python -m pytest -q tests/test_aura_external_llm_session.py
      - name: Run Council regressions
        run: python -m pytest -q tests/test_aura_architect_council_v2_contracts.py
      - name: Verify README evidence
        run: |
          grep -Fq "168,569" README.md
          grep -Fq "18 attempted, 18 recorded, 0 failed" README.md
          grep -Fq "Benchmark quality: **93.50**" README.md
      - name: Prepare final workspace shape
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:.github/workflows/architect-refactor-v2-tests.yml > .github/workflows/architect-refactor-v2-tests.yml
          rm -f \
            scripts/pr131_finalize_reconciliation.py \
            .github/workflows/pr131-finalize-reconciliation.yml \
            .github/workflows/pr131-apply-final-review.yml \
            .github/workflows/pr131-sync-final-benchmark-readme.yml
      - name: Regenerate CODEMAP against final workspace
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Publish reconciled code atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: analysis/architect-benchmark
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          api_root = f'https://api.github.com/repos/{repository}'

          def request(method: str, path: str, payload: dict | None = None) -> dict:
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'AuraOS-PR131-Finalizer',
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} failed: {exc.code} {detail}') from exc
              return json.loads(body or b'{}')

          ref_path = '/git/ref/heads/' + branch
          ref = request('GET', ref_path)
          current_head = ref['object']['sha']
          checked_out = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          if current_head != checked_out:
              raise RuntimeError(
                  f'branch moved during validation: checked_out={checked_out} current={current_head}'
              )

          base_commit = request('GET', f'/git/commits/{current_head}')
          paths = [
              'aura_external_llm_session.py',
              'tests/test_aura_external_llm_session.py',
              'README.md',
              'aura_architect_benchmark_report.py',
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
          ]
          entries: list[dict] = []
          for rel in paths:
              content = Path(rel).read_bytes()
              blob = request(
                  'POST',
                  '/git/blobs',
                  {
                      'content': base64.b64encode(content).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              entries.append(
                  {'path': rel, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}
              )

          tree = request(
              'POST',
              '/git/trees',
              {'base_tree': base_commit['tree']['sha'], 'tree': entries},
          )
          commit = request(
              'POST',
              '/git/commits',
              {
                  'message': 'fix(review): reconcile remaining inline findings',
                  'tree': tree['sha'],
                  'parents': [current_head],
              },
          )
          request(
              'PATCH',
              '/git/refs/heads/' + branch,
              {'sha': commit['sha'], 'force': False},
          )
          print(commit['sha'])
          PY
