name: Architect Refactor V2 Tests

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "refactor/**"
      - main

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Compile V2 surfaces
        run: |
          python -m py_compile \
            aura_architect_council_v2.py \
            aura_cognitive_labor_router.py \
            aura_refactor_chronicle.py \
            aura_refactor_chronicle_recorded.py \
            aura_refactor_state_ledger.py \
            aura_external_llm_session_recorded.py \
            aura_external_llm_session_persistent.py \
            aura_hybrid_refactor_benchmark.py \
            tests/test_aura_refactor_chronicle_and_length.py
      - name: Run V2 tests with durable diagnostics
        run: |
          set -o pipefail
          python -m pytest -q tests/test_aura_refactor_chronicle_and_length.py 2>&1 | tee architect-v2-tests.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-refactor-v2-test-diagnostics
          path: architect-v2-tests.log
          if-no-files-found: error
          retention-days: 14

  finalize-review:
    needs: v2-tests
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'analysis/architect-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/architect-benchmark
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Apply deterministic reconciliation
        run: PYTHONPATH=. python scripts/pr131_finalize_reconciliation.py
      - name: Compile reviewed fixes
        run: |
          python -m py_compile \
            aura_external_llm_session.py \
            aura_architect_benchmark_report.py \
            scripts/update_architect_benchmark_readme.py
      - name: Run external-session regressions
        run: python -m pytest -q tests/test_aura_external_llm_session.py
      - name: Run Council regressions
        run: python -m pytest -q tests/test_aura_architect_council_v2_contracts.py
      - name: Verify README evidence
        run: |
          grep -Fq "168,569" README.md
          grep -Fq "18 attempted, 18 recorded, 0 failed" README.md
          grep -Fq "Benchmark quality: **93.50**" README.md
      - name: Regenerate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit canonical reconciliation
        run: |
          git show HEAD^:.github/workflows/architect-refactor-v2-tests.yml > .github/workflows/architect-refactor-v2-tests.yml
          rm -f \
            scripts/pr131_finalize_reconciliation.py \
            .github/workflows/pr131-finalize-reconciliation.yml \
            .github/workflows/pr131-apply-final-review.yml \
            .github/workflows/pr131-sync-final-benchmark-readme.yml
          git config user.name "AuraOS Review Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_external_llm_session.py \
            tests/test_aura_external_llm_session.py \
            README.md \
            aura_architect_benchmark_report.py \
            .github/workflows/architect-consolidation-benchmark.yml \
            .github/workflows/architect-external-llm-session.yml \
            .github/workflows/architect-refactor-v2-tests.yml \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md
          git add -u \
            scripts/pr131_finalize_reconciliation.py \
            .github/workflows/pr131-finalize-reconciliation.yml \
            .github/workflows/pr131-apply-final-review.yml \
            .github/workflows/pr131-sync-final-benchmark-readme.yml
          git commit -m "fix(review): reconcile all inline findings and publish benchmarks"
          git push origin HEAD:analysis/architect-benchmark
