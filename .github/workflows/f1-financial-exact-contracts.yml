name: F1 Financial Exact-State Contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: f1-financial-exact-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  validate-financial-contracts:
    name: Financial contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0,<9.0" "ruff>=0.9,<1.0"
      - name: Compile exact-state surfaces
        run: |
          python -m py_compile \
            aura_financial_contracts.py \
            tests/test_aura_financial_contracts.py \
            tests/test_aura_financial_contracts_regressions.py
      - name: Fatal and static correctness lint
        run: |
          ruff check --select E4,E7,E9,F --ignore E721 \
            aura_financial_contracts.py \
            tests/test_aura_financial_contracts.py \
            tests/test_aura_financial_contracts_regressions.py
      - name: Run adversarial exact-state tests
        run: |
          python -m pytest -q \
            tests/test_aura_financial_contracts.py \
            tests/test_aura_financial_contracts_regressions.py \
            --junitxml="f1-financial-contracts-${{ matrix.python-version }}.xml"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-financial-contracts-${{ matrix.python-version }}
          path: f1-financial-contracts-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14
