name: Harness Fix 202-204 Materialize

on:
  push:
    branches:
      - fix/harness-grounding-202-204
    paths:
      - .aura/HARNESS_FIX_202_204_REQUEST

permissions:
  contents: write

concurrency:
  group: harness-fix-202-204-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/harness-grounding-202-204
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test tooling
        run: python -m pip install pytest numpy
      - name: Reassemble and apply exact reviewed patch
        run: |
          cat .aura/HARNESS_FIX_202_204.patch.0* > /tmp/HARNESS_FIX_202_204.patch
          git apply --check /tmp/HARNESS_FIX_202_204.patch
          git apply /tmp/HARNESS_FIX_202_204.patch
      - name: Compile changed Python
        run: |
          python -m py_compile \
            scripts/aura_architecture_harness_core.py \
            aura_coding_relationship_compass.py \
            tests/test_aura_architecture_harness.py \
            tests/test_aura_coding_relationship_compass.py
      - name: Run focused and adjacent regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_aura_architecture_harness.py \
            tests/test_aura_architecture_harness_original_github_routing.py \
            tests/test_aura_architecture_harness_git_tree_routing.py \
            tests/test_aura_architecture_harness_export_workflow.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relationship_compass_finalization.py
      - name: Verify repaired doctor and exact objective grounding
        env:
          PYTHONPATH: .
        run: |
          python scripts/aura_architecture_harness.py --repo-root . doctor > /tmp/harness-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import aura_architecture_harness as harness

          doctor = json.loads(Path('/tmp/harness-doctor.json').read_text())
          assert doctor['codemap']['symbol_count'] > 10000
          assert doctor['codemap']['symbol_count_source'] == 'symbol_index_member_count'
          grounded = harness._objective_grounded_architect_tasks(
              Path('.').resolve(),
              'Implement aura_intent_ingestion.py::_extract_keywords, '
              'aura_event_contracts.py::stable_digest, IntentPacket, and SemanticLedger; '
              'preserve tests/test_aura_intent_ingestion.py.',
              [],
          )
          assert [item['target_symbol'] for item in grounded['act_tasks']] == [
              '_extract_keywords', 'stable_digest', 'IntentPacket', 'SemanticLedger'
          ]
          assert grounded['explicit_test_targets'] == ['tests/test_aura_intent_ingestion.py']
          PY
      - name: Regenerate and verify navigation
        env:
          PYTHONPATH: .
        run: |
          python aura_codebase_navigator.py --root .
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Remove one-time materializer and commit
        run: |
          rm -f \
            .aura/HARNESS_FIX_202_204.patch.00 \
            .aura/HARNESS_FIX_202_204.patch.01 \
            .aura/HARNESS_FIX_202_204.patch.02 \
            .aura/HARNESS_FIX_202_204.patch.03 \
            .aura/HARNESS_FIX_202_204.patch.04 \
            .aura/HARNESS_FIX_202_204_REQUEST \
            .github/workflows/harness-fix-202-204-materialize.yml
          git diff --check
          git config user.name 'aura-harness-fix[bot]'
          git config user.email 'aura-harness-fix[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(harness): ground exact targets and preserve focal tests'
          git push origin HEAD:fix/harness-grounding-202-204
