name: Aura GLM53 Pre-Read Source Addendum

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_prefetch_pre_read_source_addendum.py"
      - "tools/awj032/test_glm53_prefetch_pre_read_source_addendum.py"
      - ".github/workflows/aura-glm53-pre-read-source-addendum.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pre-read-source-addendum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exact immutable checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            EXPECTED="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED="${GITHUB_SHA}"
          fi
          git fetch --no-tags --depth=1 origin "${EXPECTED}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${EXPECTED}"

      - name: Authenticate canonical PR720 post-read owner and PR338 pager
        run: |
          set -euo pipefail
          test "$(git hash-object tools/awj032/glm53_router_separated_prefetch.py)" = "3abb810257f4e26b006186daac73e8726aa69d07"
          test "$(git hash-object tools/awj032/test_glm53_router_separated_prefetch.py)" = "55ea4b322c98b2267ee4c7386f0dd6f1e54af70e"
          test "$(git hash-object tools/awj032/glm53_packed_expert_pager.py)" = "2b9b50e23b8ed963be4c1981598d30adb04dc1fe"

      - name: Compile and run canonical plus addendum tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/awj032/glm53_router_separated_prefetch.py \
            tools/awj032/glm53_prefetch_pre_read_source_addendum.py
          python3 -m unittest \
            tools.awj032.test_glm53_router_separated_prefetch \
            tools.awj032.test_glm53_prefetch_pre_read_source_addendum

      - name: Enforce collision quotient and zero-read law
        run: |
          set -euo pipefail
          grep -q 'CollisionOverlapPostRead=>PR720CanonicalOwner' tools/awj032/glm53_prefetch_pre_read_source_addendum.py
          grep -q 'WrongPagerSource=>ZeroTransferCalls' tools/awj032/glm53_prefetch_pre_read_source_addendum.py
          grep -q 'PreReadSourceProof+PostReadResultProof!=ExecutionAuthorization' tools/awj032/glm53_prefetch_pre_read_source_addendum.py
          echo "GLM53_PRE_READ_SOURCE_ADDENDUM=PASS"
