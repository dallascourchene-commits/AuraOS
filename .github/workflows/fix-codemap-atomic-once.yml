name: Final Reviewed CODEMAP Refresh Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Clone exact review branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --branch refactor/model-cognome-replay-probes \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Generate stable reviewed maps and upload commit
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-codemap-atomic-once.yml
          rm -f .aura/runtime/civic_sessions.sqlite3 .aura/MODULE_MANIFEST.json
          python aura_codebase_navigator.py
          cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.review-final.json"
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.review-final.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "chore(codemap): refresh final reviewed topology"
          mkdir -p "${RUNNER_TEMP}/reviewed-codemap-report"
          git rev-parse HEAD > "${RUNNER_TEMP}/reviewed-codemap-report/commit_sha.txt"
          git status --short > "${RUNNER_TEMP}/reviewed-codemap-report/status.txt"
          git push origin HEAD:refs/heads/refactor/model-cognome-replay-probes \
            > "${RUNNER_TEMP}/reviewed-codemap-report/push.log" 2>&1 || true
      - name: Upload final map commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-codemap-final-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-codemap-report/
          if-no-files-found: warn
          retention-days: 3
