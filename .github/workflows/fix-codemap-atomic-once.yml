name: Fix CODEMAP Atomic Writes Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --branch refactor/model-cognome-replay-probes \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Patch atomic writer and validate full tree
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_codebase_navigator.py")
          text = path.read_text(encoding="utf-8")
          if "import tempfile\n" not in text:
              text = text.replace("import re\n", "import re\nimport tempfile\n", 1)
          helper = '''\n\ndef _atomic_write_text(path: Path, text: str) -> None:\n    """Publish a text artifact atomically so concurrent readers never see truncation."""\n    path.parent.mkdir(parents=True, exist_ok=True)\n    descriptor, temporary_name = tempfile.mkstemp(\n        prefix=f".{path.name}.", suffix=".tmp", dir=str(path.parent)\n    )\n    temporary_path = Path(temporary_name)\n    try:\n        with os.fdopen(descriptor, "w", encoding="utf-8") as handle:\n            handle.write(text)\n            handle.flush()\n            os.fsync(handle.fileno())\n        os.replace(temporary_path, path)\n    finally:\n        temporary_path.unlink(missing_ok=True)\n\n\n'''
          marker = "def write_navigation_artifacts(\n"
          if "def _atomic_write_text(" not in text:
              if marker not in text:
                  raise SystemExit("write_navigation_artifacts marker missing")
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              '        json_path.write_text(json.dumps(payload, indent=2), encoding="utf-8")',
              '        _atomic_write_text(json_path, json.dumps(payload, indent=2))',
              1,
          )
          text = text.replace(
              '    md_path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")',
              '    _atomic_write_text(md_path, "\\n".join(lines) + "\\n")',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile aura_codebase_navigator.py aura_codemap_auto_refresh.py
          ruff check --select E9,F63,F7,F82 \
            aura_codebase_navigator.py aura_codemap_auto_refresh.py test_codemap_auto_refresh.py
          python -m pytest -q test_codemap_auto_refresh.py
          python -m pytest -q --disable-warnings \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py
          git rm .github/workflows/fix-codemap-atomic-once.yml
          rm -f .aura/runtime/civic_sessions.sqlite3 .aura/MODULE_MANIFEST.json
          python aura_codebase_navigator.py
          cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.atomic-first.json"
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.atomic-first.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(codemap): publish navigation artifacts atomically"
          mkdir -p "${RUNNER_TEMP}/atomic-codemap-report"
          git rev-parse HEAD > "${RUNNER_TEMP}/atomic-codemap-report/commit_sha.txt"
          git status --short > "${RUNNER_TEMP}/atomic-codemap-report/status.txt"
          git push origin HEAD:refs/heads/refactor/model-cognome-replay-probes \
            > "${RUNNER_TEMP}/atomic-codemap-report/push.log" 2>&1 || true
      - name: Upload final commit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-codemap-commit-${{ github.run_id }}
          path: ${{ runner.temp }}/atomic-codemap-report/
          if-no-files-found: warn
          retention-days: 3
