name: Manual Review Finalizer Once

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Clone exact review branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --branch refactor/model-cognome-replay-probes \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Apply manual review findings
        run: python tools/manual_review_finalize_pr91.py
      - name: Compile and lint reviewed modules
        run: |
          python -m py_compile \
            aura_codebase_navigator.py \
            aura_model_cognome_replay.py \
            aura_model_cognome_drift.py \
            aura_model_cognome_promotion.py \
            aura_model_cognome_federation.py \
            aura_open_weight_jacobian_adapter.py \
            tests/test_aura_model_cognome_manual_review.py
          ruff check --select E9,F63,F7,F82 \
            aura_codebase_navigator.py \
            aura_model_cognome_replay.py \
            aura_model_cognome_drift.py \
            aura_model_cognome_promotion.py \
            aura_model_cognome_federation.py \
            aura_open_weight_jacobian_adapter.py \
            tests/test_aura_model_cognome_replay_probes.py \
            tests/test_aura_model_cognome_manual_review.py
      - name: Run reviewed and full native contracts
        run: |
          python -m pytest -q \
            tests/test_aura_model_cognome_replay_probes.py \
            tests/test_aura_model_cognome_manual_review.py \
            test_aura_icm_workspace.py
          python -m pytest -q --disable-warnings \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py
      - name: Generate stable clean maps and upload commit
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-codemap-atomic-once.yml tools/manual_review_finalize_pr91.py
          rm -f .aura/runtime/civic_sessions.sqlite3 .aura/MODULE_MANIFEST.json
          python aura_codebase_navigator.py
          cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.review-first.json"
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.review-first.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(cognome): address manual review findings"
          mkdir -p "${RUNNER_TEMP}/manual-review-report"
          git rev-parse HEAD > "${RUNNER_TEMP}/manual-review-report/commit_sha.txt"
          git status --short > "${RUNNER_TEMP}/manual-review-report/status.txt"
          git diff HEAD^ --stat > "${RUNNER_TEMP}/manual-review-report/stat.txt"
          git push origin HEAD:refs/heads/refactor/model-cognome-replay-probes \
            > "${RUNNER_TEMP}/manual-review-report/push.log" 2>&1 || true
      - name: Upload manual review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-review-final-${{ github.run_id }}
          path: ${{ runner.temp }}/manual-review-report/
          if-no-files-found: warn
          retention-days: 3
