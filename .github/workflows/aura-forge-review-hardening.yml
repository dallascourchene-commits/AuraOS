name: Aura Forge V1 Review Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/harden_aura_forge_v1_review.py
      - .github/workflows/aura-forge-review-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-forge-v1-review-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aura-forge-verified-engineering-os
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit

      - name: Apply post-finalization review hardening
        run: python scripts/harden_aura_forge_v1_review.py

      - name: Compile and verify Forge plus canonical owners
        run: |
          python -m py_compile aura_forge.py tests/test_aura_forge.py
          python -m pytest -q \
            tests/test_aura_forge.py \
            tests/test_aura_external_llm_session.py \
            tests/test_aura_architect_controls_vault_and_surfaces.py
          ruff check --select E9,F63,F7,F82 aura_forge.py tests/test_aura_forge.py
          bandit -q -ll aura_forge.py

      - name: Remove temporary hardening machinery
        run: |
          rm scripts/harden_aura_forge_v1_review.py
          rm .github/workflows/aura-forge-review-hardening.yml

      - name: Regenerate and verify CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json

      - name: Commit reviewed head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Aura Forge review and contract consistency"
          git push origin HEAD:feature/aura-forge-verified-engineering-os
