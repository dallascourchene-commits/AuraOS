name: PR2 review hardening 269 round 3

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-review-hardening-269-round3
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve round-three patcher and checkout exact PR2 head
        run: |
          cp tools/pr2_review_hardening_269_round3.py /tmp/pr2_review_hardening_269_round3.py
          git fetch --no-tags origin refactor/verified-ephemeral-workspace-pr2-clean
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "3e7d28a0a9c6391f5ab9358490a717bfa03cb0f2"

      - name: Apply certificate-expiry cleanup and reuse regression hardening
        run: python /tmp/pr2_review_hardening_269_round3.py

      - name: Normalize patched test EOF
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_aura_ephemeral_workspace_runtime_v2.py")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile PR2 sources
        run: |
          python -m py_compile \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Fatal Ruff classes
        run: |
          python -m ruff check --select E9,F63,F7,F82 \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Focused PR2 tests
        run: python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Retained V1 Phase0 and PR1 tests
        run: |
          python -m pytest -q \
            tests/test_aura_ephemeral_runtime.py \
            tests/test_aura_ephemeral_phase0_hardening.py \
            tests/test_aura_ephemeral_workspace_contracts.py

      - name: Schema meta-validation
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in (
              "schemas/aura_workspace_execution_graph_v2.schema.json",
              "schemas/aura_spatial_action_certificate_v2.schema.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  Draft202012Validator.check_schema(json.load(handle))
          PY

      - name: Diff whitespace gate
        run: git diff --check

      - name: Publish ordinary PR2 round-three source commit
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Review Hardener"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m "PR2: Dissolve expired certificate workspaces"
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean
