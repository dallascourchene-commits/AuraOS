name: PR2 review hardening 269

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-review-hardening-269
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patcher and checkout exact clean PR2 head
        run: |
          cp tools/pr2_review_hardening_269.py /tmp/pr2_review_hardening_269.py
          git fetch --no-tags origin refactor/verified-ephemeral-workspace-pr2-clean
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "7bf5728cbd7b7fd229cc0067d212514f005fc518"

      - name: Apply reviewed hardening transaction
        run: |
          python /tmp/pr2_review_hardening_269.py
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_ephemeral_adapter_registry.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def execute(self, adapter_id: str, *, params: dict[str, Any] | None = None,
                lease_active: bool = True) -> dict[str, Any]:
        params = {} if params is None else _strict_mapping(params, "params")
        meta = self._adapters.get(adapter_id)'''
          new = '''    def execute(self, adapter_id: str, *, params: dict[str, Any] | None = None,
                lease_active: bool = True) -> dict[str, Any]:
        try:
            params = {} if params is None else _strict_mapping(params, "params")
        except ValueError as exc:
            return {"ok": False, "error": f"invalid_adapter_params: {exc}",
                    "failure_class": "structural",
                    "patch_authority": PATCH_AUTHORITY,
                    "vsa_patch_authority": VSA_PATCH_AUTHORITY}
        meta = self._adapters.get(adapter_id)'''
          if text.count(old) != 1:
              raise SystemExit("adapter params normalization marker mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_aura_ephemeral_workspace_runtime_v2.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''    assert result["error"] == "adapter_result_missing_status"
    assert result["failure_class"] == "structural"
'''
          addition = '''    assert result["error"] == "adapter_result_missing_status"
    assert result["failure_class"] == "structural"

    malformed = registry.execute("adapter.redeclare", params={1: "bad"})  # type: ignore[dict-item]
    assert malformed["ok"] is False
    assert malformed["failure_class"] == "structural"
    assert malformed["error"].startswith("invalid_adapter_params:")
'''
          if tests.count(marker) != 1:
              raise SystemExit("adapter params regression marker mismatch")
          tests = tests.replace(marker, addition, 1)
          test_path.write_text(tests.rstrip() + "\n", encoding="utf-8")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify hardened PR2 transaction
        run: |
          python -m py_compile \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m ruff check --select E9,F63,F7,F82 \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py
          git diff --check
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in (
              "schemas/aura_workspace_execution_graph_v2.schema.json",
              "schemas/aura_spatial_action_certificate_v2.schema.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  Draft202012Validator.check_schema(json.load(handle))
          PY

      - name: Publish ordinary source hardening commit
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Review Hardener"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            schemas/aura_workspace_execution_graph_v2.schema.json \
            schemas/aura_spatial_action_certificate_v2.schema.json \
            tests/test_aura_ephemeral_workspace_runtime_v2.py
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git diff --cached --check
          git commit -m "PR2: Harden verified workspace lifecycle after review"
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean
