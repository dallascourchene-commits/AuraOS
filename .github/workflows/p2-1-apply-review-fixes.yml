name: P2.1 apply review fixes

# Triggered after the workflow exists so GitHub runs the one-shot repair.
on:
  push:
    branches:
      - refactor/planning-board-p2-1
    paths:
      - .github/workflows/p2-1-apply-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: p2-1-review-fixes
  cancel-in-progress: false

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planning-board-p2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for CODEMAP synchronization
        run: sleep 75
      - name: Refresh branch head
        run: |
          git fetch origin refactor/planning-board-p2-1
          git reset --hard origin/refactor/planning-board-p2-1
      - name: Apply review fixes
        run: |
          test -f scripts/p2_1_review_fixes.patch
          git apply --check scripts/p2_1_review_fixes.patch
          git apply scripts/p2_1_review_fixes.patch
      - name: Validate review fixes
        run: |
          python -m pip install pytest ruff
          python -m py_compile aura_planning_board.py tests/test_aura_planning_board.py
          ruff check --select E9,F63,F7,F82 aura_planning_board.py tests/test_aura_planning_board.py
          python -m pytest -q tests/test_aura_event_contracts.py tests/test_aura_planning_board.py
      - name: Remove one-shot artifacts
        run: |
          rm scripts/p2_1_review_fixes.patch
          rm .github/workflows/p2-1-apply-review-fixes.yml
      - name: Commit review fixes
        run: |
          git config user.name "AuraOS Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(planning): preserve GOAP membership and constraint evidence"
          git pull --rebase origin refactor/planning-board-p2-1
          git push origin HEAD:refactor/planning-board-p2-1
