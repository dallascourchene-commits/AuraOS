name: PR2 final CODEMAP audit 269

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: read

concurrency:
  group: pr2-final-codemap-audit-269
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact PR2 head
        run: |
          git fetch --no-tags origin refactor/verified-ephemeral-workspace-pr2-clean
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "b746773df5cf46548e8afa1950ff942f111f8c16"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate CODEMAP without publishing
        run: |
          cp .aura/CODEMAP.json /tmp/CODEMAP.committed.json
          python aura_codebase_navigator.py
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Classify committed-to-generated drift
        run: |
          set +e
          python -m aura_codemap_verify --compare-json /tmp/CODEMAP.committed.json > /tmp/codemap-comparison.json
          comparison_status=$?
          set -e
          cat /tmp/codemap-comparison.json
          printf '%s\n' "$comparison_status" > /tmp/codemap-comparison-exit-code.txt
          git diff --name-only | sort | tee /tmp/codemap-generated-files.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'Aura_Memory/live_topology_ast.json',
              'topology_map.json',
          }
          changed = {
              line.strip()
              for line in Path('/tmp/codemap-generated-files.txt').read_text(encoding='utf-8').splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected non-generated CODEMAP drift: {unexpected}')
          print(f'generated_navigation_files={sorted(changed)}')
          PY

      - name: Validate regenerated navigation snapshot
        run: |
          cp .aura/CODEMAP.json /tmp/CODEMAP.generated.json
          python -m aura_codemap_verify --compare-json /tmp/CODEMAP.generated.json

      - name: Upload final CODEMAP audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2-final-codemap-audit-${{ github.run_id }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
            /tmp/codemap-comparison.json
            /tmp/codemap-comparison-exit-code.txt
            /tmp/codemap-generated-files.txt
          if-no-files-found: error
          retention-days: 14
