name: PR2 final convergence, CODEMAP, and publish

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-final-convergence-269
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact heads and integrate current main
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/refactor/verified-ephemeral-workspace-pr2-clean refs/heads/main
          test "$(git rev-parse origin/refactor/verified-ephemeral-workspace-pr2-clean)" = "6a701595910e9a32e5df909c4fe361de772bbe90"
          test "$(git rev-parse origin/main)" = "c1d896ff7b5f15471d8170cbd0594b0f4ed0c163"
          git checkout -B pr2-final-candidate origin/refactor/verified-ephemeral-workspace-pr2-clean
          git merge --no-ff --no-edit origin/main

      - name: Apply low-risk Codacy and test-stability cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_ephemeral_adapter_registry.py")
          text = path.read_text(encoding="utf-8")
          old = "import inspect\nimport json\n"
          if old not in text or "import math\n" in text:
              raise SystemExit("unexpected import block")
          text = text.replace(old, "import inspect\nimport json\nimport math\n", 1)
          old = '''    if deadline_monotonic != deadline_monotonic or deadline_monotonic in {float("inf"), float("-inf")} \\\n            or deadline_monotonic <= 0:\n'''
          if old not in text:
              raise SystemExit("deadline guard not found")
          text = text.replace(old, "    if not math.isfinite(deadline_monotonic) or deadline_monotonic <= 0:\n", 1)
          marker = "\n\n@dataclass\nclass AdapterMetadata:"
          if marker not in text:
              raise SystemExit("AdapterMetadata marker not found")
          text = text.replace(marker, '\n\ndef _default_host_compatibility() -> list[str]:\n    return ["python-stdlib"]\n\n\n@dataclass\nclass AdapterMetadata:', 1)
          old = '    host_compatibility: list[str] = field(default_factory=lambda: ["python-stdlib"])\n'
          if old not in text:
              raise SystemExit("default_factory not found")
          text = text.replace(old, '    host_compatibility: list[str] = field(default_factory=_default_host_compatibility)\n', 1)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_aura_ephemeral_workspace_runtime_v2.py")
          text = path.read_text(encoding="utf-8")
          old = '''    recipe = _recipe(ttl=2, wall_time_ms=1000)\n'''
          new = '''    # Leave ample process-startup margin so this proves in-flight TTL cancellation,\n    # rather than racing expiry before the spawned callback can begin.\n    recipe = _recipe(ttl=4, wall_time_ms=5000)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected TTL test recipe occurrence count")
          text = text.replace(old, new, 1)
          old = '''    if remaining > 0.35:\n        time.sleep(remaining - 0.35)\n'''
          new = '''    if remaining > 1.5:\n        time.sleep(remaining - 1.5)\n'''
          if text.count(old) != 1:
              raise SystemExit("unexpected TTL sleep occurrence count")
          text = text.replace(old, new, 1)
          old = '''            "delay_seconds": 1.0,\n'''
          # Replace only the delay inside this TTL test, anchored by its function region.
          start = text.index("def test_workspace_ttl_expiry_during_callback_kills_execution_and_cleans")
          end = text.index("\ndef test_workspace_cumulative_wall_time_budget_blocks_new_callback", start)
          region = text[start:end]
          if region.count(old) != 1:
              raise SystemExit("unexpected TTL delay occurrence count")
          region = region.replace(old, '''            "delay_seconds": 3.0,\n''', 1)
          text = text[:start] + region + text[end:]
          old = '''    time.sleep(0.9)\n    assert not completed_path.exists()\n'''
          new = '''    time.sleep(0.5)\n    assert not completed_path.exists()\n'''
          if region.count(old) != 1:
              raise SystemExit("unexpected TTL post-cancel sleep occurrence count")
          # region was already inserted above, so replace in full text within the same function only.
          start = text.index("def test_workspace_ttl_expiry_during_callback_kills_execution_and_cleans")
          end = text.index("\ndef test_workspace_cumulative_wall_time_budget_blocks_new_callback", start)
          region = text[start:end]
          if region.count(old) != 1:
              raise SystemExit("unexpected TTL post-cancel sleep occurrence count after delay patch")
          region = region.replace(old, new, 1)
          text = text[:start] + region + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Ruff and tests
        run: |
          python -m py_compile aura_ephemeral_adapter_registry.py aura_ephemeral_registry_store.py aura_ephemeral_workspace_runtime_v2.py tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m ruff check --select E9,F63,F7,F82 aura_ephemeral_adapter_registry.py aura_ephemeral_registry_store.py aura_ephemeral_workspace_runtime_v2.py tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m pytest -q tests/test_aura_ephemeral_runtime.py tests/test_aura_ephemeral_phase0_hardening.py tests/test_aura_ephemeral_workspace_contracts.py

      - name: Schema meta-validation
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in ("schemas/aura_workspace_execution_graph_v2.schema.json", "schemas/aura_spatial_action_certificate_v2.schema.json"):
              with open(path, encoding="utf-8") as handle:
                  Draft202012Validator.check_schema(json.load(handle))
          PY

      - name: Regenerate and verify CODEMAP
        run: |
          set -euo pipefail
          cp .aura/CODEMAP.json /tmp/aura-codemap-reference.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify --compare-json /tmp/aura-codemap-reference.json > /tmp/aura-codemap-comparison.json
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/aura-codemap-comparison.json').read_text(encoding='utf-8'))
          print(json.dumps({'errors': result.get('errors', []), 'missing_paths': result.get('missing_paths', []), 'missing_symbols': result.get('missing_symbols', [])}, sort_keys=True))
          if result.get('missing_paths') or result.get('missing_symbols'):
              raise SystemExit('CODEMAP has missing paths or symbols')
          PY
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Commit final candidate and enforce scope
        run: |
          set -euo pipefail
          git add aura_ephemeral_adapter_registry.py tests/test_aura_ephemeral_workspace_runtime_v2.py .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "PR2: finalize Codacy disposition and synchronize CODEMAP"
          fi
          python - <<'PY'
          import subprocess
          allowed = {
              '.aura/refactor_objectives/intent_native_ephemeral_workspace_pr2.v1.json',
              '.aura/waboose_requests/intent_native_ephemeral_workspace_pr2.v1.json',
              'aura_ephemeral_adapter_registry.py', 'aura_ephemeral_registry_store.py',
              'aura_ephemeral_workspace_runtime_v2.py', 'docs/AURA_VERIFIED_EPHEMERAL_WORKSPACE_PR2.md',
              'schemas/aura_spatial_action_certificate_v2.schema.json', 'schemas/aura_workspace_execution_graph_v2.schema.json',
              'tests/test_aura_ephemeral_workspace_runtime_v2.py', '.aura/CODEMAP.json', '.aura/CODEMAP.md',
              'topology_map.json', 'Aura_Memory/live_topology_ast.json',
          }
          required = allowed - {'.aura/CODEMAP.json', '.aura/CODEMAP.md', 'topology_map.json', 'Aura_Memory/live_topology_ast.json'}
          files = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines())
          print('final PR files:', sorted(files))
          if files - allowed:
              raise SystemExit(f'unexpected final PR files: {sorted(files - allowed)}')
          if required - files:
              raise SystemExit(f'missing PR2 source files: {sorted(required - files)}')
          PY

      - name: Publish final PR2 candidate
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2-final-convergence-${{ github.sha }}
          path: |
            /tmp/aura-codemap-comparison.json
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
          if-no-files-found: warn
          retention-days: 14
