name: PR2 independent audit hardening 269 round 9

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-independent-audit-hardening-269-round9
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve patcher and checkout exact PR2 head
        run: |
          cp tools/pr2_review_hardening_269_round9.py /tmp/pr2_review_hardening_269_round9.py
          python -m py_compile /tmp/pr2_review_hardening_269_round9.py
          test "$(git hash-object /tmp/pr2_review_hardening_269_round9.py)" = "cbd7fbcacd30e075080e9342ad3c643edaf66b7c"
          git fetch --no-tags origin refactor/verified-ephemeral-workspace-pr2-clean
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "decbcc876435b81eb683e4543e15487124c4d5f6"

      - name: Apply final review hardening
        run: python /tmp/pr2_review_hardening_269_round9.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile PR2 sources and tests
        run: |
          python -m py_compile \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Fatal Ruff classes
        run: |
          python -m ruff check --select E9,F63,F7,F82 \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Focused PR2 final review suite
        run: python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Retained V1 Phase0 and PR1 tests
        run: |
          python -m pytest -q \
            tests/test_aura_ephemeral_runtime.py \
            tests/test_aura_ephemeral_phase0_hardening.py \
            tests/test_aura_ephemeral_workspace_contracts.py

      - name: Schema meta-validation
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in (
              "schemas/aura_workspace_execution_graph_v2.schema.json",
              "schemas/aura_spatial_action_certificate_v2.schema.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  Draft202012Validator.check_schema(json.load(handle))
          PY

      - name: Exact round-nine scope and whitespace gate
        run: |
          printf '%s\n' \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py \
            | sort > /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --check

      - name: Publish PR2 round-nine hardening commit
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Independent Audit Hardener"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m "PR2: Close final review hardening gaps"
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean
