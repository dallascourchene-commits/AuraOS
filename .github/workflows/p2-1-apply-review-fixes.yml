name: PR2 master exit-gate audit 269 round 4

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-master-exit-gate-269-round4
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve master exit-gate patcher and checkout exact PR2 head
        run: |
          cp tools/pr2_master_exit_gate_tests_269.py /tmp/pr2_master_exit_gate_tests_269.py
          git fetch --no-tags origin refactor/verified-ephemeral-workspace-pr2-clean
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "63980c1e42172e25d78855f4fbdd6863b6ee28b7"

      - name: Add explicit master-plan adversarial regressions
        run: python /tmp/pr2_master_exit_gate_tests_269.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile PR2 sources and tests
        run: |
          python -m py_compile \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Fatal Ruff classes
        run: |
          python -m ruff check --select E9,F63,F7,F82 \
            aura_ephemeral_adapter_registry.py \
            aura_ephemeral_registry_store.py \
            aura_ephemeral_workspace_runtime_v2.py \
            tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Focused PR2 tests with master exit-gate regressions
        run: python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py

      - name: Retained V1 Phase0 and PR1 tests
        run: |
          python -m pytest -q \
            tests/test_aura_ephemeral_runtime.py \
            tests/test_aura_ephemeral_phase0_hardening.py \
            tests/test_aura_ephemeral_workspace_contracts.py

      - name: Schema meta-validation
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for path in (
              "schemas/aura_workspace_execution_graph_v2.schema.json",
              "schemas/aura_spatial_action_certificate_v2.schema.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  Draft202012Validator.check_schema(json.load(handle))
          PY

      - name: Exact test-only scope and whitespace gate
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "tests/test_aura_ephemeral_workspace_runtime_v2.py"
          git diff --check

      - name: Publish PR2 master exit-gate regression commit
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Exit Gate"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_aura_ephemeral_workspace_runtime_v2.py
          test "$(git diff --cached --name-only)" = "tests/test_aura_ephemeral_workspace_runtime_v2.py"
          git diff --cached --check
          git commit -m "PR2: Prove master adversarial exit gates"
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean
