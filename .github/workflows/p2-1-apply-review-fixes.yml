name: PR2 final convergence, CODEMAP, and publish

on:
  push:
    branches:
      - "analysis/pr2-review-hardening-269"

permissions:
  contents: write

concurrency:
  group: pr2-final-convergence-269
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from exact PR head and current main
        run: |
          set -euo pipefail
          git config user.name "AuraOS PR2 Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/refactor/verified-ephemeral-workspace-pr2-clean refs/heads/main
          PR_HEAD="$(git rev-parse origin/refactor/verified-ephemeral-workspace-pr2-clean)"
          test "$PR_HEAD" = "6a701595910e9a32e5df909c4fe361de772bbe90"
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          git checkout -B pr2-final-candidate origin/refactor/verified-ephemeral-workspace-pr2-clean
          git merge --no-ff --no-edit origin/main

      - name: Apply justified Codacy cleanup and deterministic TTL regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_ephemeral_adapter_registry.py")
          text = path.read_text(encoding="utf-8")
          old = "import inspect\nimport json\n"
          if old not in text or "import math\n" in text:
              raise SystemExit("unexpected adapter import block")
          text = text.replace(old, "import inspect\nimport json\nimport math\n", 1)

          lines = text.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if "if deadline_monotonic != deadline_monotonic" in line]
          if len(matches) != 1:
              raise SystemExit(f"unexpected deadline finite-guard match count: {len(matches)}")
          i = matches[0]
          if i + 1 >= len(lines) or "or deadline_monotonic <= 0:" not in lines[i + 1]:
              raise SystemExit("deadline finite guard continuation not found")
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i + 2] = [f"{indent}if not math.isfinite(deadline_monotonic) or deadline_monotonic <= 0:\n"]
          text = "".join(lines)

          marker = "\n\n@dataclass\nclass AdapterMetadata:"
          if marker not in text:
              raise SystemExit("AdapterMetadata marker not found")
          text = text.replace(marker, '\n\ndef _default_host_compatibility() -> list[str]:\n    return ["python-stdlib"]\n\n\n@dataclass\nclass AdapterMetadata:', 1)
          old = '    host_compatibility: list[str] = field(default_factory=lambda: ["python-stdlib"])\n'
          if old not in text:
              raise SystemExit("host compatibility factory not found")
          text = text.replace(old, '    host_compatibility: list[str] = field(default_factory=_default_host_compatibility)\n', 1)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_aura_ephemeral_workspace_runtime_v2.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def test_workspace_ttl_expiry_during_callback_kills_execution_and_cleans")
          end = text.index("\ndef test_workspace_cumulative_wall_time_budget_blocks_new_callback", start)
          region = text[start:end]
          replacements = [
              ('    recipe = _recipe(ttl=2, wall_time_ms=1000)\n',
               '    # The compiler floors remaining TTL; 10 requested seconds yields a 9-second effective TTL.\n    # Match that budget so TTL remains the earliest authority deadline while leaving child startup margin.\n    recipe = _recipe(ttl=10, wall_time_ms=9000)\n'),
              ('    if remaining > 0.35:\n        time.sleep(remaining - 0.35)\n',
               '    if remaining > 2.0:\n        time.sleep(remaining - 2.0)\n'),
              ('            "delay_seconds": 1.0,\n', '            "delay_seconds": 5.0,\n'),
              ('    time.sleep(0.9)\n    assert not completed_path.exists()\n',
               '    time.sleep(0.5)\n    assert not completed_path.exists()\n'),
          ]
          for old, new in replacements:
              if region.count(old) != 1:
                  raise SystemExit(f"unexpected TTL regression anchor count for {old!r}")
              region = region.replace(old, new, 1)
          text = text[:start] + region + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run exact PR2 gates
        run: |
          set -euo pipefail
          python -m py_compile aura_ephemeral_adapter_registry.py aura_ephemeral_registry_store.py aura_ephemeral_workspace_runtime_v2.py tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m ruff check --select E9,F63,F7,F82 aura_ephemeral_adapter_registry.py aura_ephemeral_registry_store.py aura_ephemeral_workspace_runtime_v2.py tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_runtime_v2.py
          python -m pytest -q tests/test_aura_ephemeral_runtime.py tests/test_aura_ephemeral_phase0_hardening.py tests/test_aura_ephemeral_workspace_contracts.py
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          for p in ("schemas/aura_workspace_execution_graph_v2.schema.json", "schemas/aura_spatial_action_certificate_v2.schema.json"):
              with open(p, encoding="utf-8") as f:
                  Draft202012Validator.check_schema(json.load(f))
          PY
          git diff --check

      - name: Regenerate and verify CODEMAP and topology
        run: |
          set -euo pipefail
          cp .aura/CODEMAP.json /tmp/codemap-before.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify --compare-json /tmp/codemap-before.json > /tmp/codemap-drift.json
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/codemap-drift.json').read_text(encoding='utf-8'))
          print(json.dumps({k: r.get(k, []) for k in ('errors','missing_paths','missing_symbols')}, sort_keys=True))
          if r.get('missing_paths') or r.get('missing_symbols'):
              raise SystemExit('CODEMAP missing paths or symbols')
          PY
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Commit candidate and enforce final scope
        run: |
          set -euo pipefail
          git add aura_ephemeral_adapter_registry.py tests/test_aura_ephemeral_workspace_runtime_v2.py .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "PR2: finalize Codacy cleanup and synchronize CODEMAP"
          fi
          python - <<'PY'
          import subprocess
          allowed = {
              '.aura/refactor_objectives/intent_native_ephemeral_workspace_pr2.v1.json',
              '.aura/waboose_requests/intent_native_ephemeral_workspace_pr2.v1.json',
              'aura_ephemeral_adapter_registry.py', 'aura_ephemeral_registry_store.py',
              'aura_ephemeral_workspace_runtime_v2.py', 'docs/AURA_VERIFIED_EPHEMERAL_WORKSPACE_PR2.md',
              'schemas/aura_spatial_action_certificate_v2.schema.json', 'schemas/aura_workspace_execution_graph_v2.schema.json',
              'tests/test_aura_ephemeral_workspace_runtime_v2.py', '.aura/CODEMAP.json', '.aura/CODEMAP.md',
              'topology_map.json', 'Aura_Memory/live_topology_ast.json',
          }
          required = allowed - {'.aura/CODEMAP.json', '.aura/CODEMAP.md', 'topology_map.json', 'Aura_Memory/live_topology_ast.json'}
          files = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          print('final PR files:', sorted(files))
          if files - allowed:
              raise SystemExit(f'unexpected final PR files: {sorted(files - allowed)}')
          if required - files:
              raise SystemExit(f'missing PR2 source files: {sorted(required - files)}')
          PY

      - name: Recheck main and publish exact candidate
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git push origin HEAD:refs/heads/refactor/verified-ephemeral-workspace-pr2-clean

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2-final-closeout-${{ github.sha }}
          path: |
            /tmp/codemap-drift.json
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
          if-no-files-found: warn
          retention-days: 14
