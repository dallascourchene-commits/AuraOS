name: UMC five-file verified publish

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 193 &&
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Publish exactly five verified files
        shell: bash
        run: |
          git fetch --no-tags origin main
          git show origin/main:.github/scripts/umc_publish_five_files.sh > "${RUNNER_TEMP}/umc_publish_five_files.sh"
          bash "${RUNNER_TEMP}/umc_publish_five_files.sh"
