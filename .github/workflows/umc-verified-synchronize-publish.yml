name: UMC verified synchronize publish

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 193 &&
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: refactor/unified-memory-continuity
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TRANSPORT_COMMIT: 1de0f438b330ef91bfc99cead2d288d003181e22
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clone and run immutable verified publisher
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1)"
          git fetch --quiet --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" > "${RUNNER_TEMP}/umc_publish.sh"
          test "$(grep -c __EXPECTED_HEAD__ "${RUNNER_TEMP}/umc_publish.sh")" = 1
          sed -i "s/__EXPECTED_HEAD__/${EVENT_HEAD}/" "${RUNNER_TEMP}/umc_publish.sh"
          bash -x "${RUNNER_TEMP}/umc_publish.sh"
