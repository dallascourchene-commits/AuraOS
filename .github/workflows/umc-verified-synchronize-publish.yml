name: UMC five-file verified publish

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.number == 193 &&
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish exactly five verified files
        shell: bash
        run: |
          set -euxo pipefail
          work="${RUNNER_TEMP}/umc-five-file-repo"
          rm -rf "$work"
          git init -q "$work"
          cd "$work"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "+refs/heads/refactor/unified-memory-continuity:refs/remotes/origin/refactor/unified-memory-continuity"
          git checkout -q --detach "$EVENT_HEAD"
          git fetch -q --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          git show refs/remotes/origin/main:.github/scripts/umc_publish_five_files.sh > "${RUNNER_TEMP}/umc_publish_five_files.sh"
          bash -x "${RUNNER_TEMP}/umc_publish_five_files.sh"
