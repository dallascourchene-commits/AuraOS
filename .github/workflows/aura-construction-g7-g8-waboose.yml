name: Aura Construction G7-G8 Waboose Scan

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-waboose.yml"

permissions:
  contents: read

concurrency:
  group: aura-construction-g7-g8-waboose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  waboose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          lfs: false
          submodules: false

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded scanner dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r requirements.txt
          python -m pip install -q --disable-pip-version-check bandit jsonschema pytest ruff

      - name: Compile focused Waboose request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          changed_files = [
              "aura_construction_demo_contracts.py",
              "aura_construction_demo_director.py",
              "aura_construction_demo_fixture.py",
              "aura_construction_demo_fixture_builder.py",
              "aura_construction_demo_projection.py",
              "aura_spatial_cli.py",
              "scripts/aura_fetch_construction_demo_source.py",
              "scripts/aura_prepare_construction_demo_assets_core.py",
              "scripts/aura_verify_construction_demo_assets.py",
              "aura_spatial_web/construction_demo_app.js",
              "aura_spatial_web/construction_mesh_pass.js",
              "aura_spatial_web/construction_overlay_pass.js",
              "aura_spatial_web/construction_scene_renderer.js",
              "aura_spatial_web/gaussian_renderer.js",
              "aura_spatial_web/webgl2_gaussian_pass.js",
              "tests/test_aura_construction_demo_contracts.py",
              "tests/test_aura_construction_demo_director.py",
              "tests/test_aura_construction_demo_fixture.py",
              "tests/test_aura_construction_demo_projection.py",
              "tests/test_aura_fetch_construction_demo_source.py",
              "tests/test_aura_spatial_cli_construction_security.py",
              "tests/js/spatial-construction-demo.test.mjs",
              "tests/js/spatial-construction-review-regressions.test.mjs",
              "tests/js/spatial-gaussian-covariance.test.mjs",
              ".github/workflows/aura-construction-demo-g7-g8.yml",
          ]
          request = {
              "objective": (
                  "Final adversarial review of the exact Construction Arena G0-G8 security, "
                  "provenance, lifecycle, browser state, authority, and verification surface."
              ),
              "mode": "files",
              "profile": "exhaustive",
              "changed_files": changed_files,
              "invariants": [
                  "all local HTTP paths remain under explicit allowlisted roots",
                  "physical work, payment, access, certification, publication, and merge authority remain false",
                  "failed or cancelled renderer resources remain visible and retryable until proven released",
                  "real asset identities are never replaced by fallback geometry",
                  "source and generated asset provenance fail closed",
              ],
              "risk_map": [
                  "path traversal and symlink escape",
                  "renderer cancellation, device loss, partial allocation, and double cleanup",
                  "browser tour races and unsupported representation claims",
                  "digest, manifest, storey, and asset-role cross-binding",
                  "workflow exact-head and generated-navigation drift",
              ],
              "graph_depth": 2,
              "graph_node_budget": 240,
              "run_tests": False,
              "run_optional_tools": True,
          }
          Path("/tmp/waboose-request.json").write_text(
              json.dumps(request, sort_keys=True, indent=2), encoding="utf-8"
          )
          PY

      - name: Prepare exact review contract
        run: |
          set +e
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/waboose-state.json \
            prepare --request /tmp/waboose-request.json \
            > /tmp/waboose-prepare.json
          status=$?
          echo "$status" > /tmp/waboose-prepare.status
          cat /tmp/waboose-prepare.json
          exit 0

      - name: Run deterministic Waboose scan
        run: |
          set +e
          REVIEW_ID="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/waboose-prepare.json'))['review_id'])
          PY
          )"
          printf '%s' "$REVIEW_ID" > /tmp/waboose-review-id.txt
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/waboose-state.json \
            scan --review-id "$REVIEW_ID" \
            > /tmp/waboose-scan.json
          status=$?
          echo "$status" > /tmp/waboose-scan.status
          cat /tmp/waboose-scan.json
          exit 0

      - name: Finalize repair-eligible findings
        run: |
          set +e
          REVIEW_ID="$(cat /tmp/waboose-review-id.txt)"
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/waboose-state.json \
            finalize --review-id "$REVIEW_ID" \
            > /tmp/waboose-final.json
          status=$?
          echo "$status" > /tmp/waboose-final.status
          cat /tmp/waboose-final.json
          exit 0

      - name: Build concise finding summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path('/tmp/waboose-scan.json'), Path('/tmp/waboose-final.json')]
          packets = []
          for path in paths:
              try:
                  packets.append(json.loads(path.read_text(encoding='utf-8')))
              except Exception as exc:
                  packets.append({'ok': False, 'error': str(exc), 'path': str(path)})
          findings = []
          for packet in packets:
              for key in ('deterministic_findings', 'findings'):
                  value = packet.get(key, []) if isinstance(packet, dict) else []
                  if isinstance(value, list):
                      findings.extend(item for item in value if isinstance(item, dict))
          unique = {}
          for item in findings:
              key = (
                  item.get('rule'), item.get('file'), item.get('line_start'),
                  item.get('title'), item.get('message')
              )
              unique[key] = item
          summary = {
              'review_id': Path('/tmp/waboose-review-id.txt').read_text(),
              'finding_count': len(unique),
              'findings': sorted(
                  unique.values(),
                  key=lambda x: (
                      str(x.get('severity', '')),
                      str(x.get('file', '')),
                      int(x.get('line_start') or 0),
                  ),
              ),
              'forge_repair_requests': packets[-1].get('forge_repair_requests', [])
                  if isinstance(packets[-1], dict) else [],
              'automatic_fix': False,
              'automatic_merge': False,
              'human_review_required': True,
          }
          Path('/tmp/waboose-summary.json').write_text(
              json.dumps(summary, sort_keys=True, indent=2, default=str), encoding='utf-8'
          )
          print(json.dumps(summary, sort_keys=True, indent=2, default=str))
          PY

      - name: Upload complete Waboose evidence
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-g7-g8-waboose
          path: |
            /tmp/waboose-request.json
            /tmp/waboose-state.json
            /tmp/waboose-prepare.json
            /tmp/waboose-scan.json
            /tmp/waboose-final.json
            /tmp/waboose-summary.json
            /tmp/waboose-*.status
            /tmp/waboose-review-id.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce scanner execution
        run: |
          set -euo pipefail
          test "$(cat /tmp/waboose-prepare.status)" = "0"
          test "$(cat /tmp/waboose-scan.status)" = "0"
          if test "$(cat /tmp/waboose-final.status)" != "0"; then
            python - <<'PY'
            import json
            packet = json.load(open('/tmp/waboose-final.json'))
            if packet.get('error') != 'semantic_review_incomplete':
                raise SystemExit('Waboose finalization failed outside the documented semantic-completeness boundary')
            PY
          fi
