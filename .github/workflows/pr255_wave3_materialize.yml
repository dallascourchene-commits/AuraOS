name: PR255 final review repair materializer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'repair/pr255-final-review-wave3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact temporary branch
        uses: actions/checkout@v4
        with:
          ref: repair/pr255-final-review-wave3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused verification tools
        run: python -m pip install --disable-pip-version-check pytest jsonschema ruff

      - name: Apply exact review repair
        run: python .aura/pr255_wave3_patch.py

      - name: Compile and run focused regressions
        run: |
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          pytest -q tests/test_aura_ephemeral_workspace_contracts.py

      - name: Run focused lint and schema gates
        run: |
          ruff check --select F401,F821 aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in sorted(Path('schemas').glob('aura_*spatial*.schema.json')) + [Path('schemas/aura_project_context_projection.schema.json')]:
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f'schema_ok={path}')
          PY

      - name: Restore generated navigation and remove transport artifacts
        run: |
          git checkout b379c62d255c556040918e97c46c53f4a8fbc51f -- .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json || true
          git checkout b379c62d255c556040918e97c46c53f4a8fbc51f -- Aura_Memory/live_topology_ast.json || true
          rm -f .aura/pr255_wave3_patch.py .aura/pr255_wave3_marker .github/workflows/pr255_wave3_materialize.yml

      - name: Audit exact eight-file PR scope
        run: |
          BASE=879b5fb056b70d150b1646e082223330a36c2912
          git diff --exit-code "$BASE" -- .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json Aura_Memory/live_topology_ast.json
          cat > /tmp/expected_paths <<'EOF'
          .aura/refactor_objectives/intent_native_spatial_workspace_pr1.v1.json
          .aura/waboose_requests/intent_native_spatial_workspace_pr1.v1.json
          aura_ephemeral_workspace_contracts.py
          docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md
          schemas/aura_ephemeral_workspace_recipe.schema.json
          schemas/aura_multimodal_spatial_observation.schema.json
          schemas/aura_project_context_projection.schema.json
          tests/test_aura_ephemeral_workspace_contracts.py
          EOF
          git diff --name-only "$BASE" | sort > /tmp/actual_paths
          sort -o /tmp/expected_paths /tmp/expected_paths
          diff -u /tmp/expected_paths /tmp/actual_paths

      - name: Publish one clean commit over verified head
        env:
          BRANCH: repair/pr255-final-review-wave3
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --soft b379c62d255c556040918e97c46c53f4a8fbc51f
          git reset
          git add aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md
          git diff --cached --check
          git commit -m 'fix(pr1): close final CodeRabbit and Codex findings'
          git push --force origin HEAD:"$BRANCH"
