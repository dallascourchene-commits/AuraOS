name: P2.1 Planning Board contracts

on:
  pull_request:
    paths:
      - "aura_planning_board.py"
      - "tests/test_aura_planning_board.py"
      - ".github/workflows/p2-1-planning-board.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-board-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile contracts
        run: python -m py_compile aura_planning_board.py tests/test_aura_planning_board.py
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_aura_planning_board.py
