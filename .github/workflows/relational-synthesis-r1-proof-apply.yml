name: Relational Synthesis R1 Proof Apply

on:
  push:
    branches:
      - feature/aura-relational-synthesis-r1
    paths:
      - .github/workflows/relational-synthesis-r1-proof-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' bandit

      - name: Apply reviewed proof-bound patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/relational-synthesis-r1-hardening.yml'
          ).read_text(encoding='utf-8')
          step = '      - name: Keep inferred roles and test meaning proof-bound\n'
          step_start = workflow.index(step)
          marker = "          python - <<'PY'\n"
          script_start = workflow.index(marker, step_start) + len(marker)
          script_end = workflow.index('\n          PY\n', script_start)
          lines = workflow[script_start:script_end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          exec(compile(script, 'relational-proof-hardening', 'exec'))
          PY

      - name: Validate permanent proof boundaries
        run: |
          python -m py_compile aura_relational_synthesis.py tests/test_aura_relational_synthesis.py
          python -m pytest -q tests/test_aura_relational_synthesis.py
          ruff check --select E9,F63,F7,F82 aura_relational_synthesis.py tests/test_aura_relational_synthesis.py
          bandit -q -ll aura_relational_synthesis.py

      - name: Commit and push validated permanent files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aura_relational_synthesis.py tests/test_aura_relational_synthesis.py docs/AURA_RELATIONAL_SYNTHESIS_REFACTOR_PLAN.md
          git diff --cached --check
          git commit -m 'Keep relational role inference proof-bound'
          git push origin HEAD:feature/aura-relational-synthesis-r1
