name: K27 ASTGE Typed Scope-Aware Source Review

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-generation-domain/**"
      - "crates/aura-k27-astge-typed-source-review/**"
      - "crates/aura-k27-astge-scope-review/**"
      - "crates/aura-k27-astge-typed-scope-review/**"
      - "tools/k27_astge_python_scope_oracle.py"
      - ".github/workflows/k27-astge-typed-scope-aware-source-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed-scope-aware-source-review:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact candidate head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Verify toolchains
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Re-prove scope-aware review owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets
          python3 tools/k27_astge_python_scope_oracle.py
          cargo clippy --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Re-prove typed source-generation owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets -- -D warnings

      - name: Verify typed scope-aware composition
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-typed-scope-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-typed-scope-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-typed-scope-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-typed-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Emit claim ceiling
        run: |
          echo "TYPED_SCOPE_AWARE_SOURCE_REVIEW_EXECUTED=true"
          echo "LEXICAL_OWNER_SCOPE_BOUND=true"
          echo "SOURCE_GENERATION_TYPE_BOUND=true"
          echo "CROSS_AXIS_SCOPE_AWARE_REVIEW_COMPILES=false"
          echo "IDENTIFIER_USE_RESOLUTION_PROVEN=false"
          echo "RUNTIME_BINDING_WINNER_PROVEN=false"
          echo "SEMANTIC_CORRECTNESS_PROVEN=false"
          echo "B_MINUS_APPROVED=false"
          echo "COMMIT_AUTHORIZED=false"
          echo "EXECUTION_AUTHORIZED=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
          echo "COMPOSED_RUST_1_80_PROVEN=false"
