name: PR184 final remediation

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - .github/workflows/pr184-final-remediation.yml

permissions:
  contents: write

concurrency:
  group: pr184-final-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: 11f185522b3b05e93fd66cd5d2c6583c4d30f13c
      TARGET_BRANCH: work/construction-arena-real-asset-pack-g4-20260722
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Apply, validate, and publish exact result
        shell: bash
        run: |
          set -u
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          test "${GITHUB_REF_NAME}" = "$TARGET_BRANCH"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          : > remediation.log
          python scripts/pr184_final_remediation.py >>remediation.log 2>&1
          patch_rc=$?
          install_rc=99
          test_rc=99
          if [ "$patch_rc" -eq 0 ]; then
            python -m pip install --upgrade pip >>remediation.log 2>&1
            python -m pip install "numpy>=1.26,<3" "trimesh>=4,<5" pytest >>remediation.log 2>&1
            install_rc=$?
          fi
          if [ "$patch_rc" -eq 0 ] && [ "$install_rc" -eq 0 ]; then
            python -m compileall -q \
              scripts/aura_architecture_harness.py \
              scripts/aura_architecture_harness_core.py \
              scripts/aura_mesh_to_gaussian.py \
              scripts/aura_prepare_construction_demo_assets.py \
              scripts/aura_prepare_construction_demo_assets_core.py >>remediation.log 2>&1 && \
            python -m pytest -q \
              tests/test_aura_architecture_harness.py \
              tests/test_aura_architecture_harness_git_tree_routing.py \
              tests/test_aura_architecture_harness_original_github_routing.py \
              tests/test_aura_prepare_construction_demo_assets_temp_cleanup.py \
              tests/test_aura_mesh_to_gaussian.py >>remediation.log 2>&1 && \
            git diff --check >>remediation.log 2>&1
            test_rc=$?
          fi

          git config user.name "AuraOS Review Remediation"
          git config user.email "actions@users.noreply.github.com"
          if [ "$patch_rc" -eq 0 ] && [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then
            rm .github/workflows/pr184-final-remediation.yml scripts/pr184_final_remediation.py
            git add \
              scripts/aura_architecture_harness.py \
              scripts/aura_architecture_harness_core.py \
              scripts/aura_mesh_to_gaussian.py \
              scripts/aura_prepare_construction_demo_assets.py \
              scripts/aura_prepare_construction_demo_assets_core.py \
              .github/workflows/pr184-final-remediation.yml \
              scripts/pr184_final_remediation.py
            git commit -m "fix(review): apply final Codex remediation"
          else
            git reset --hard "$GITHUB_SHA"
            mkdir -p .aura
            PATCH_RC="$patch_rc" INSTALL_RC="$install_rc" TEST_RC="$test_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path
          log = Path("remediation.log").read_text(encoding="utf-8", errors="replace")[-6000:]
          payload = {
              "version": "PR184_FINAL_REMEDIATION_FAILURE_V1",
              "patch_rc": int(os.environ["PATCH_RC"]),
              "install_rc": int(os.environ["INSTALL_RC"]),
              "test_rc": int(os.environ["TEST_RC"]),
              "log_tail": log,
          }
          Path(".aura/pr184-final-remediation-failure.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            git add .aura/pr184-final-remediation-failure.json
            git commit -m "chore(review): record PR184 remediation failure"
          fi

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${TARGET_BRANCH}"
