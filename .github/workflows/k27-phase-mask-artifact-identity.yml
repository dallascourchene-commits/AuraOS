name: K27 phase-mask artifact identity

on:
  pull_request:
    paths:
      - "tools/k27_phase_mask_artifact_contract.py"
      - "tests/test_k27_phase_mask_artifact_contract.py"
      - ".github/workflows/k27-phase-mask-artifact-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run phase-mask identity and ABA battery
        run: python -m unittest tests/test_k27_phase_mask_artifact_contract.py -v
