name: MC-O14R Full-Source TECC Effect Admission Proof

on:
  push:
    branches:
      - project006/mc-o14r-full-source-tecc-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Three fresh venv proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mc_o14_proof
          mkdir -p .mc_o14_proof
          for e in 1 2 3; do
            python -m venv ".mc_o14_proof/venv${e}"
            py=".mc_o14_proof/venv${e}/bin/python"
            "$py" -m unittest tests.test_tecc_effect_admission_bridge -v > ".mc_o14_proof/test${e}.out" 2>&1
            "$py" tools/project006/campaign_tecc_effect_admission_bridge.py > ".mc_o14_proof/campaign${e}.json"
            "$py" tools/project006/mc_o14_lattice8.py > ".mc_o14_proof/omega8_${e}.json"
            "$py" tools/project006/mc_o14_sweep13d.py > ".mc_o14_proof/sweep13d_${e}.json"
            "$py" tools/project006/mc_o14_hs1000.py > ".mc_o14_proof/hs1000_${e}.json"
          done
          for stem in campaign omega8_ sweep13d_ hs1000_; do
            if [ "$stem" = campaign ]; then
              cmp .mc_o14_proof/campaign1.json .mc_o14_proof/campaign2.json
              cmp .mc_o14_proof/campaign1.json .mc_o14_proof/campaign3.json
            else
              cmp ".mc_o14_proof/${stem}1.json" ".mc_o14_proof/${stem}2.json"
              cmp ".mc_o14_proof/${stem}1.json" ".mc_o14_proof/${stem}3.json"
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.mc_o14_proof')
          c=json.loads((r/'campaign1.json').read_text())
          o=json.loads((r/'omega8_1.json').read_text())
          s=json.loads((r/'sweep13d_1.json').read_text())
          h=json.loads((r/'hs1000_1.json').read_text())
          assert c['candidate_false_bind']==0 and c['candidate_false_hold']==0 and c['effect_ready']==0
          assert c['legacy_unproofed_false_ready']==21819 and c['legacy_same_digest_source_collision']==2181 and c['cases']==24000
          assert o['states']==6561 and o['bind']==1 and o['invalid_bind']==0 and o['effect_ready']==0
          assert s['cartesian_states']==1594323 and s['lawful_contextual_bind']==243 and s['hard_invalid_context_repair']==0 and s['effect_ready']==0
          assert h['raw']==1000 and h['quotients']==100 and h['top27_count']==27
          print('MC_O14R_EXACT_HEAD_PROOF=PASS')
          PY
