name: GLM53 E8 Page Plan Projection

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  q5-e8-page-plan-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install exact numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5

      - name: Prove exact Q2 x E8 convergence and green parent runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          convergence = '86d0f573076a4da56ff661bcd9cef971c3c5058c'
          q2 = 'cb9f50fc2fd05006f4f5af0a2f143f2c74aee62f'
          e8 = 'b8fd399ee0ca6b45a4ec7db58750e6d4105ae3ae'
          parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', convergence], text=True).strip().split()
          assert parents == [convergence, q2, e8], parents
          token = os.environ['GH_TOKEN']; repo = os.environ['GH_REPO']
          for run_id, head in ((33367433407, q2), (33367948262, e8)):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run['conclusion'] == 'success', (run_id, run['conclusion'])
              assert run['head_sha'] == head, (run_id, run['head_sha'], head)
          print('Q5_EXACT_TWO_PARENT_GREEN=true')
          PY

      - name: Compile exact parent and Q5 surfaces
        run: |
          python3 -m py_compile \
            tools/quantization/aura_glm53_packed_expert_quantization_plan.py \
            tools/quantization/test_aura_glm53_packed_expert_quantization_plan.py \
            tools/quantization/aura_glm53_e8_indexed_expert_page_reference.py \
            tools/quantization/test_aura_glm53_e8_indexed_expert_page_reference.py \
            tools/quantization/aura_glm53_e8_page_plan_projection.py \
            tools/quantization/test_aura_glm53_e8_page_plan_projection.py

      - name: Re-prove both parents and run Q5 adversarials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tools.quantization.test_aura_glm53_packed_expert_quantization_plan
          python3 tools/quantization/test_aura_glm53_e8_indexed_expert_page_reference.py
          python3 -m unittest -v tools.quantization.test_aura_glm53_e8_page_plan_projection

      - name: Assert exact projection constants and nonpromotion
        shell: bash
        run: |
          python3 - <<'PY'
          import tools.quantization.aura_glm53_e8_page_plan_projection as q5
          rep = q5.e8_q2_representation()
          assert q5.Q2_EXACT_HEAD == 'cb9f50fc2fd05006f4f5af0a2f143f2c74aee62f'
          assert q5.Q2_EXACT_RUN == 33367433407
          assert q5.E8_EXACT_HEAD == 'b8fd399ee0ca6b45a4ec7db58750e6d4105ae3ae'
          assert q5.E8_EXACT_RUN == 33367948262
          assert q5.Q5_CONVERGENCE_COMMIT == '86d0f573076a4da56ff661bcd9cef971c3c5058c'
          assert rep.vector_dim == 8
          assert rep.index_bits_per_vector == 16
          assert rep.scale_group_weights == 64
          assert rep.scale_bits_per_group == 16
          assert abs(rep.effective_bits_per_weight - 2.25) < 1e-12
          assert q5.e8_codebook_bytes() == 58112 * 8 * 4
          print('Q5_PROJECTION_CONSTANTS_EXACT=true')
          PY

      - name: Emit Q5 consequence ceiling
        run: |
          cat <<'EOF'
          E8_CODEC_PROJECTS_TO_Q2_2P25_BPW=true
          E8_CODEBOOK_IS_BOUNDED_BANK_COMPANION=true
          SELECTED_PAGE_ROLE_COVERAGE_REQUIRED=true
          Q2_CODEC_WORKING_SET_CAN_MATCH_CONCRETE_PAGE_CODEC=true
          Q2_CODEC_BYTES_NE_SERIALIZED_PAGE_BYTES=true
          PAGE_HEADERS_ACCOUNTED_IN_Q2_CACHE_BUDGET=false
          SOURCE_TENSOR_BYTES_AUTHENTICATED=false
          PLANNED_LAYOUT_EXECUTED_PROVEN=false
          SELECTED_EXPERTS_ACTUALLY_SERVED_PROVEN=false
          PHYSICAL_IO_OBSERVED=false
          MODEL_EXECUTION_PERFORMED=false
          GLM53_QUALITY_PRESERVED_PROVEN=false
          GENERAL_PERFORMANCE_WINNER_PROVEN=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          SEMANTIC_K27_AUTHORITY_MINTED=false
          GATE10_PROMOTED=false
          DEPLOYMENT_AUTHORIZED=false
          EOF
