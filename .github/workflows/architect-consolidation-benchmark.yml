name: Architect Consolidation Benchmark

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "refactor/**"
      - main

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  architect-benchmark:
    name: Ground, deliberate, and score Architect benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Aura runtime and focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Compile benchmark and external LLM surfaces
        run: |
          python -m py_compile \
            aura_architect_consolidation_benchmark.py \
            aura_architect_consolidation_benchmark_refined.py \
            aura_architect_benchmark_report.py \
            aura_external_llm_session.py \
            aura_external_llm_session_safe.py \
            aura_agent_arena_mcp_external_llm.py \
            benchmarks/architect_consolidation/generate_gpt56_pilot_fixture.py \
            scripts/update_architect_benchmark_readme.py
      - name: Regenerate CODEMAP and topology from tested commit
        run: |
          python aura_codebase_navigator.py
          test -s .aura/CODEMAP.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.aura/CODEMAP.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert isinstance(payload, dict)
          file_count = len(payload.get('files', []) or payload.get('file_cards', []) or [])
          symbol_count = len(payload.get('symbol_index', {}) or {})
          assert file_count > 0, file_count
          assert symbol_count > 0, symbol_count
          print({'codemap_bytes': path.stat().st_size, 'files': file_count, 'symbols': symbol_count})
          PY
      - name: Prepare RAW and Aura-slice prompts
        run: |
          rm -rf benchmark-output
          python aura_architect_consolidation_benchmark_refined.py prepare \
            --repo-root . \
            --output-dir benchmark-output \
            > benchmark-prepare.log
          cat benchmark-prepare.log
      - name: Validate benchmark preparation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('benchmark-output')
          required = {
              'raw_prompt.txt',
              'aura_slice_prompt.txt',
              'prepare_manifest.json',
              'responses.template.json',
          }
          assert required <= {path.name for path in root.iterdir()}
          manifest = json.loads((root / 'prepare_manifest.json').read_text(encoding='utf-8'))
          assert manifest['codemap']['bytes'] > 0
          assert manifest['repository_inventory']['file_count'] > 0
          assert manifest['prompts']['raw']['token_proxy'] > 0
          assert manifest['prompts']['aura_slice']['token_proxy'] > 0
          assert manifest['aura_slice_packet']['source_slice_count'] >= 8
          assert manifest['aura_slice_packet']['test_slice_count'] >= 2
          assert manifest['prompts']['aura_slice']['token_proxy'] < manifest['prompts']['raw']['token_proxy']
          print(json.dumps({
              'repo_token_proxy': manifest['repository_inventory']['token_proxy'],
              'raw_prompt_tokens': manifest['prompts']['raw']['token_proxy'],
              'slice_prompt_tokens': manifest['prompts']['aura_slice']['token_proxy'],
              'source_slices': manifest['aura_slice_packet']['source_slice_count'],
              'test_slices': manifest['aura_slice_packet']['test_slice_count'],
          }, indent=2))
          PY
      - name: Materialize reproducible GPT-5.6 pilot responses
        run: |
          python benchmarks/architect_consolidation/generate_gpt56_pilot_fixture.py \
            --output benchmark-output/responses.gpt-5.6-thinking.json
          python -m json.tool benchmark-output/responses.gpt-5.6-thinking.json > /dev/null
      - name: Run real Architect Council and score all arms
        run: |
          python aura_architect_consolidation_benchmark_refined.py score \
            --repo-root . \
            --output-dir benchmark-output \
            --responses benchmark-output/responses.gpt-5.6-thinking.json \
            --input-rate 1.0 \
            --output-rate 3.0 \
            > benchmark-score.log
          cat benchmark-score.log
      - name: Finalize truth-preserving findings and README section
        run: |
          python aura_architect_benchmark_report.py \
            --report benchmark-output/architect_consolidation_benchmark.json \
            --responses benchmark-output/responses.gpt-5.6-thinking.json \
            --skeleton benchmark-output/architect_consolidation_skeleton.json \
            > benchmark-findings.log
          cat benchmark-findings.log
      - name: Validate scored benchmark and skeleton
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('benchmark-output')
          report = json.loads((root / 'architect_consolidation_benchmark.json').read_text(encoding='utf-8'))
          skeleton = json.loads((root / 'architect_consolidation_skeleton.json').read_text(encoding='utf-8'))
          assert report['production_mutation'] is False
          assert report['measurement_class']['tokens'] == 'ESTIMATED_CHAR4_PROXY'
          assert report['arms']['raw_broad_context']['model_calls'] == 1
          assert report['arms']['aura_slice_single']['model_calls'] == 1
          assert report['arms']['aura_architect_council']['model_calls'] >= 10
          assert report['comparison']['slice_input_reduction_pct'] > 50
          assert report['findings']
          assert report['claims']['not_yet_supported']
          for arm in report['arms'].values():
              quality = arm['quality']
              assert 0.0 <= quality['quality_score'] <= 1.0
              assert quality['task_count'] > 0
              assert quality['exact_file_rate'] == 1.0
              assert quality['output_contract_rate'] == 1.0
          assert skeleton['production_mutation'] is False
          assert skeleton['next_gate'] == 'HUMAN_REVIEW_BEFORE_REFACTOR'
          assert skeleton['repair_requirements']
          assert len(skeleton['selected_plan']['act_tasks']) >= 6
          assert (root / 'README_ARCHITECT_BENCHMARK.md').is_file()
          print(json.dumps(report['comparison'], indent=2, sort_keys=True))
          PY
      - name: Generate exact updated README artifact
        run: |
          python scripts/update_architect_benchmark_readme.py
          grep -q "First Architect Consolidation Benchmark" README.md
          grep -q "89.88%" README.md
          grep -q "Council normalization lost plan-level contracts" README.md
          cp README.md benchmark-output/README.updated.md
      - name: Upload benchmark evidence and refactor skeleton
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-consolidation-benchmark
          path: |
            benchmark-output/
            benchmark-prepare.log
            benchmark-score.log
            benchmark-findings.log
            aura_architect_consolidation_benchmark.py
            aura_architect_consolidation_benchmark_refined.py
            aura_architect_benchmark_report.py
            benchmarks/architect_consolidation/generate_gpt56_pilot_fixture.py
          if-no-files-found: error
          retention-days: 30
