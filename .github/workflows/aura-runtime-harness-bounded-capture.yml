name: Diagnose Aura Runtime Harness hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-runtime-harness-bounded-capture.yml"
      - "tools/runtime_harness_bounded_capture/**"

permissions:
  contents: read

concurrency:
  group: aura-runtime-harness-hardening-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diagnostic dependencies
        run: python -m pip install ruff

      - name: Apply prepared hardening and capture status
        run: |
          mkdir -p /tmp/aura-runtime-hardening-diagnostics
          set +e
          python tools/runtime_harness_bounded_capture/apply.py \
            > /tmp/aura-runtime-hardening-diagnostics/apply.log 2>&1
          apply_status=$?
          python tools/runtime_harness_bounded_capture/apply_review_fixes.py \
            > /tmp/aura-runtime-hardening-diagnostics/review-fixes.log 2>&1
          review_status=$?
          printf '%s\n' "$apply_status" > /tmp/aura-runtime-hardening-diagnostics/apply.status
          printf '%s\n' "$review_status" > /tmp/aura-runtime-hardening-diagnostics/review-fixes.status
          exit 0

      - name: Capture exact Ruff residue
        run: |
          set +e
          ruff format \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py \
            > /tmp/aura-runtime-hardening-diagnostics/format.log 2>&1
          format_status=$?
          ruff check --fix \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py \
            > /tmp/aura-runtime-hardening-diagnostics/ruff-fix.log 2>&1
          fix_status=$?
          ruff format \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py \
            >> /tmp/aura-runtime-hardening-diagnostics/format.log 2>&1
          second_format_status=$?
          ruff check --output-format concise \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py \
            > /tmp/aura-runtime-hardening-diagnostics/ruff-final.log 2>&1
          final_status=$?
          git diff --check > /tmp/aura-runtime-hardening-diagnostics/diff-check.log 2>&1
          diff_status=$?
          git diff --stat > /tmp/aura-runtime-hardening-diagnostics/diff-stat.log 2>&1
          printf '%s\n' "$format_status" > /tmp/aura-runtime-hardening-diagnostics/format.status
          printf '%s\n' "$fix_status" > /tmp/aura-runtime-hardening-diagnostics/ruff-fix.status
          printf '%s\n' "$second_format_status" > /tmp/aura-runtime-hardening-diagnostics/format-second.status
          printf '%s\n' "$final_status" > /tmp/aura-runtime-hardening-diagnostics/ruff-final.status
          printf '%s\n' "$diff_status" > /tmp/aura-runtime-hardening-diagnostics/diff-check.status
          exit 0

      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-runtime-hardening-diagnostics
          path: /tmp/aura-runtime-hardening-diagnostics
          if-no-files-found: error
          retention-days: 3
