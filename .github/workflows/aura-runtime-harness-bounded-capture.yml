name: Publish verified Aura Runtime Refactor Harness

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-runtime-harness-bounded-capture.yml"
      - "tools/runtime_harness_bounded_capture/**"

permissions:
  contents: write

concurrency:
  group: aura-runtime-harness-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic transformation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff jsonschema

      - name: Rebuild the already-verified final tree
        run: |
          python tools/runtime_harness_bounded_capture/apply.py
          python tools/runtime_harness_bounded_capture/apply_review_fixes.py
          python tools/runtime_harness_bounded_capture/apply_final_fixes.py
          python tools/runtime_harness_bounded_capture/apply_screenshot_visual_proof.py
          ruff format \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py
          ruff check --fix \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py
          ruff format \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py
          ruff check \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py
          python -m pytest -q --tb=short tests/test_aura_runtime_refactor_harness.py
          node --check tests/runtime/construction_demo_browser_probe.cjs
          git rm -rf \
            .github/workflows/aura-runtime-harness-bounded-capture.yml \
            tools/runtime_harness_bounded_capture
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          git diff --check

      - name: Attempt exact leased publication
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p /tmp/aura-runtime-publication
          set +e
          {
            set -x
            git config user.name "AuraOS Runtime Harness"
            git config user.email "aura-runtime-harness@users.noreply.github.com"
            git status --short
            git add -A
            git diff --cached --stat
            git commit -m "fix(runtime): repair Construction demo and integrate E2E harness"
            commit_status=$?
            remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            remote_status=$?
            printf 'expected_head=%s\nremote_head=%s\n' "$EXPECTED_HEAD" "$remote_head"
            lease_status=0
            if [ -z "$remote_head" ] || [ "$remote_head" != "$EXPECTED_HEAD" ]; then
              lease_status=1
            fi
            push_status=125
            if [ "$commit_status" -eq 0 ] && [ "$remote_status" -eq 0 ] && [ "$lease_status" -eq 0 ]; then
              git push origin "HEAD:refs/heads/$TARGET_BRANCH"
              push_status=$?
            fi
            printf 'commit_status=%s\nremote_status=%s\nlease_status=%s\npush_status=%s\n' \
              "$commit_status" "$remote_status" "$lease_status" "$push_status" \
              > /tmp/aura-runtime-publication/status.env
            exit 0
          } > /tmp/aura-runtime-publication/publication.log 2>&1
          exit 0

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-runtime-publication-evidence
          path: /tmp/aura-runtime-publication
          if-no-files-found: error
          retention-days: 3

      - name: Enforce publication result
        run: |
          . /tmp/aura-runtime-publication/status.env
          test "$commit_status" -eq 0
          test "$remote_status" -eq 0
          test "$lease_status" -eq 0
          test "$push_status" -eq 0
