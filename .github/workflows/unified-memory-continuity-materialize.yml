name: Materialize unified continuity deep review

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: unified-memory-continuity-final-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 193 &&
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: refactor/unified-memory-continuity
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TRANSPORT_COMMIT: 0f4a334b17864a261fa48068191ad2f2ecb7879b
      REVIEWED_CHECKPOINT: 968f417cf55895ec788d89c0a97f37e40cf0612a
      TRIGGER_PATH: .aura/refactor_payloads/umc_deep_review.retry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind human checkpoint and bounded branch history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          sleep 20
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          latest="$(git rev-parse "origin/${TARGET_BRANCH}")"
          git diff --name-only "$EVENT_HEAD" "$latest" > "${RUNNER_TEMP}/post-event-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          paths = set((Path(os.environ['RUNNER_TEMP']) / 'post-event-paths.txt').read_text().splitlines())
          allowed = {'.aura/CODEMAP.json', '.aura/CODEMAP.md', 'topology_map.json'}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'unexpected post-event paths: {sorted(unexpected)}')
          PY
          git reset --hard "$latest"
          git merge-base --is-ancestor "$REVIEWED_CHECKPOINT" HEAD
          git diff --name-only "$REVIEWED_CHECKPOINT" HEAD > "${RUNNER_TEMP}/bounded-history-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          paths = set((Path(os.environ['RUNNER_TEMP']) / 'bounded-history-paths.txt').read_text().splitlines())
          allowed = {
              'Aura_Sandbox/umc_deep_review_payload_v2/part-01',
              'Aura_Sandbox/umc_deep_review_payload_v2/part-02',
              'Aura_Sandbox/umc_deep_review_payload_v2/part-03',
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'topology_map.json',
              '.github/workflows/unified-memory-continuity-materialize.yml',
              os.environ['TRIGGER_PATH'],
          }
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f'unexpected bounded-history paths: {sorted(unexpected)}')
          PY
          test ! -e Aura_Sandbox/umc_deep_review_payload_v2
          test ! -e .github/workflows/unified-memory-continuity-final-branch-materialize.yml
          test ! -e .aura/refactor_payloads/umc_final_deep_review.trigger
          test -f "$TRIGGER_PATH"
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = \
            bb5c0c50e62b8edbb4cbdad4f9810709f67adf7866fcd8b0700eda334a030ade
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = \
            edddf3af030fd5e4cdeb8bc0bb0c4b2751e3dc7857068ba46c28c5bd905d19ee
          git rev-parse HEAD | tee "${RUNNER_TEMP}/settled-head.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared and review dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' jsonschema ruff bandit

      - name: Run exact hash-locked deep materializer
        id: materialize
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/umc-deep-review-v2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          git show "$TRANSPORT_COMMIT:.aura/refactor_payloads/umc_deep_review_v2_materialize.sh" \
            > "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'umc_deep_review_v2_materialize.sh'
          text = path.read_text(encoding='utf-8')
          settled = (Path(os.environ['RUNNER_TEMP']) / 'settled-head.txt').read_text().strip()
          text, count = re.subn(
              r"EXPECTED_HEAD='[^']+'",
              f"EXPECTED_HEAD='{settled}'",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('materializer expected-head binding is ambiguous')
          start = text.index('git diff --name-only "$REVIEWED_PAYLOAD_CHECKPOINT" HEAD')
          end = text.index('test "$(sha256sum aura_unified_memory_continuity.py', start)
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          bash "${RUNNER_TEMP}/umc_deep_review_v2_materialize.sh"

      - name: Upload deep-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-deep-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-deep-review-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.materialize.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = 'success' ]; then
            body='Deep-review v2 materialization succeeded: five bounded PR files passed whole-tree compilation, Ruff, Bandit, 65 regressions, zero-finding Waboose, the Architecture Harness, map regeneration, and bounded publication.'
          else
            body='Deep-review v2 materialization failed closed; no unverified source publication was accepted. Inspect the Materialize unified continuity deep review workflow evidence.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
