name: Aura WorkCapsule Recursive Portable Current Shared Owner

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_scoped_portable_target_identity.py'
      - 'scripts/aura_workcapsule_scoped_higher_owner_portable_continuity.py'
      - 'tests/test_aura_workcapsule_recursive_portable_current_shared_owner.py'
      - '.github/workflows/aura-workcapsule-recursive-portable-current-shared-owner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-shared-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR558_SHA: a374f3efc7c562583b7cf1edeffde7dcc4b4f666
      PR555_SHA: 45cb1fd86b7038892d113f8b07ce04ce165109f0
      PR555_SHARED_OWNER_BLOB: 72ddc12aad21a8871e958b3726c65f2e143b2934
    steps:
      - name: Fetch exact child head and prove both parents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=120 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$PR558_SHA" HEAD
          git merge-base --is-ancestor "$PR555_SHA" HEAD
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          echo 'PR558_PARENT_BOUND=true'
          echo 'PR555_PARENT_BOUND=true'

      - name: Prove PR555 canonical shared owner is byte-identical in child
        run: |
          test "$(git hash-object scripts/aura_workcapsule_scoped_portable_target_identity.py)" = "$PR555_SHARED_OWNER_BLOB"
          python3 -m py_compile scripts/aura_workcapsule_scoped_portable_target_identity.py
          python3 - <<'PY'
          from scripts.aura_workcapsule_scoped_portable_target_identity import verify_shared_target_coordinates
          assert callable(verify_shared_target_coordinates)
          print('PR555_SHARED_TARGET_OWNER_MATERIALIZED_EXACTLY=true')
          PY

      - name: Re-prove exact PR555 owner reduction in isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr555
          git -C /tmp/pr555 init .
          git -C /tmp/pr555 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr555 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR555_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr555 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr555 rev-parse HEAD)" = "$PR555_SHA"
          test "$(git -C /tmp/pr555 hash-object /tmp/pr555/scripts/aura_workcapsule_scoped_portable_target_identity.py)" = "$PR555_SHARED_OWNER_BLOB"
          test -z "$(git -C /tmp/pr555 config --local --get-all http.https://github.com/.extraheader || true)"
          cd /tmp/pr555
          python3 -m py_compile scripts/aura_workcapsule_scoped_portable_target_identity.py scripts/aura_workcapsule_portable_derived_scoped_rebind.py
          python3 -m unittest -v tests.test_aura_workcapsule_shared_target_owner_reduction

      - name: Re-prove PR558 recursive canonicalization on current owner
        run: |
          python3 -m py_compile scripts/aura_workcapsule_scoped_higher_owner_portable_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_scoped_higher_owner_portable_continuity

      - name: Prove live delegation to current shared-coordinate owner
        run: |
          python3 -m unittest -v tests.test_aura_workcapsule_recursive_portable_current_shared_owner

      - name: Assert owner-currentness boundary
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          lower = Path('scripts/aura_workcapsule_scoped_portable_target_identity.py').read_text()
          higher = Path('scripts/aura_workcapsule_scoped_higher_owner_portable_continuity.py').read_text()
          assert 'verify_shared_target_coordinates' in lower
          assert 'admit_scoped_portable_target_identity' in higher
          assert 'verify_scoped_portable_target_identity' in higher
          tree = ast.parse(lower)
          names = {n.name for n in ast.walk(tree) if isinstance(n, ast.FunctionDef)}
          assert 'verify_shared_target_coordinates' in names
          print('CURRENT_SHARED_COORDINATE_OWNER=true')
          print('RECURSIVE_PORTABLE_CONSUMER_REPROVED=true')
          print('SECOND_SHARED_COORDINATE_OWNER_MINTED=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'PR555_CANONICAL_SHARED_OWNER_CURRENT=true'
          echo 'PR558_RECURSIVE_CANONICALIZATION_REPROVED=true'
          echo 'ORDINAL_SPAN_HANDLE_OWNER_CURRENT=true'
          echo 'PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_REPAIR_CORRECTNESS_PROVEN=false'
          echo 'REENTRY_CLOSED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
