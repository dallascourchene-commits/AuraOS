name: Temporary Full Repository Export

on:
  push:
    branches:
      - analysis/full-repo-export-20260720
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact main snapshot without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 0c55838a952a617122f3975f41f676906aab8cdc
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Archive every Git-tracked file
        run: |
          git archive \
            --format=zip \
            --prefix=AuraOS/ \
            --output=AuraOS-full-repository.zip \
            HEAD
          sha256sum AuraOS-full-repository.zip > AuraOS-full-repository.zip.sha256
          git ls-files -z | tr -cd '\0' | wc -c > AuraOS-full-repository.tracked-file-count.txt
      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-full-repository-0c55838a
          path: |
            AuraOS-full-repository.zip
            AuraOS-full-repository.zip.sha256
            AuraOS-full-repository.tracked-file-count.txt
          if-no-files-found: error
          retention-days: 7
