name: GLM53 Representation-Specific Source Trial Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-q7-source-trial-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact child head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Q6 x Q5-source convergence and green parent runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          convergence='0fa19da9f6cad19fdf66daa5cd806b6098f5ec28'
          q6='4137aabd972feff9c4412bb4786ef8fd4de207e0'
          q5='730426b82235b0ff4e75fef1cff00707877a84ad'
          parents=subprocess.check_output(['git','rev-list','--parents','-n','1',convergence], text=True).strip().split()
          assert parents == [convergence, q6, q5], parents
          token=os.environ['GH_TOKEN']; repo=os.environ['GH_REPO']
          for run_id, head in ((33370305329,q6),(33369967425,q5)):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
              )
              with urllib.request.urlopen(req,timeout=30) as response:
                  run=json.load(response)
              assert run['conclusion']=='success', (run_id,run['conclusion'])
              assert run['head_sha']==head, (run_id,run['head_sha'],head)
          print('Q7_EXACT_TWO_PARENT_GREEN=true')
          PY

      - name: Regenerate exact current Q5 source-admission state from parent producer
        shell: bash
        run: |
          set -euo pipefail
          git show 730426b82235b0ff4e75fef1cff00707877a84ad:tools/quantization/aura_glm53_official_source_admission.py > /tmp/q5_source_admission.py
          python3 - <<'PY'
          from dataclasses import asdict
          import importlib.util, json, sys
          spec=importlib.util.spec_from_file_location('q5_source_admission','/tmp/q5_source_admission.py')
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          spec.loader.exec_module(mod)
          state=asdict(mod.current_public_state())
          json.dump(state,open('/tmp/q5-current.json','w',encoding='utf-8'),sort_keys=True,separators=(',',':'))
          assert state['header_trial_eligible'] is False
          assert state['index_bytes_verified'] is False
          assert state['representative_headers_observed'] is False
          assert state['candidate_representation_bound'] is True
          print('Q5_CURRENT_HOLD_REGENERATED=true')
          PY

      - name: Compile and run Q6 plus Q7 adversarial suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/quantization/aura_glm53_quantization_evidence_transfer.py \
            tools/quantization/aura_glm53_representation_specific_source_trial_gate.py \
            tools/quantization/test_aura_glm53_quantization_evidence_transfer.py \
            tools/quantization/test_aura_glm53_representation_specific_source_trial_gate.py
          python3 -m unittest -v \
            tools.quantization.test_aura_glm53_quantization_evidence_transfer \
            tools.quantization.test_aura_glm53_representation_specific_source_trial_gate

      - name: Emit exact Q7 current receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 -m tools.quantization.aura_glm53_representation_specific_source_trial_gate \
            --source-json /tmp/q5-current.json | tee /tmp/q7.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/q7.json',encoding='utf-8'))
          assert r['exact_parent_heads']==[
              '4137aabd972feff9c4412bb4786ef8fd4de207e0',
              '730426b82235b0ff4e75fef1cff00707877a84ad',
          ]
          assert r['source_header_eligible'] is False
          assert r['exact_target_representation_identity_bound'] is True
          assert r['disposition']=='HOLD_SOURCE_HEADER_NOT_ELIGIBLE'
          assert r['header_bound_representation_trial_candidate'] is False
          for key in (
              'source_tensor_payload_bound','real_tensor_quantization_eligible',
              'evidence_transfer_authorized','glm53_quality_evidence','runtime_evidence',
              'semantic_k27_authority','native_private_transformer_kv_accessed',
              'gate10_promoted','deployment_authorized'):
              assert r[key] is False, key
          print('Q7_CURRENT_FAIL_CLOSED=true')
          PY

      - name: Consequence ceiling
        run: |
          cat <<'EOF'
          OFFICIAL_SOURCE_OBJECT_IDENTITY_IS_NOT_TRIAL_AUTHORITY=true
          HEADER_TRIAL_ELIGIBLE=false
          CURRENT_DISPOSITION=HOLD_SOURCE_HEADER_NOT_ELIGIBLE
          EXACT_REPRESENTATION_IDENTITY_IS_REQUIRED_FOR_FUTURE_HEADER_CANDIDATE=true
          SOURCE_TENSOR_PAYLOAD_BOUND=false
          REAL_TENSOR_QUANTIZATION_ELIGIBLE=false
          EVIDENCE_TRANSFER_AUTHORIZED=false
          GLM53_QUALITY_EVIDENCE=false
          RUNTIME_EVIDENCE=false
          SEMANTIC_K27_AUTHORITY=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          GATE10_PROMOTED=false
          DEPLOYMENT_AUTHORIZED=false
          EOF
