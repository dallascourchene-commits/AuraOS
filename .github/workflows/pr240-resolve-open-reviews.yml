name: PR240 Resolve Open Reviews

on:
  push:
    branches:
      - analysis/bilateral-intent-final-b11-b15
    paths:
      - "scripts/pr240_resolve_open_reviews.py"
      - "scripts/pr240_followup_review_fixes.py"
      - ".github/workflows/pr240-resolve-open-reviews.yml"

permissions:
  contents: write

env:
  TARGET_BRANCH: analysis/bilateral-intent-final-b11-b15

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused verifier dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema ruff pyyaml

      - name: Apply verified still-current review fixes
        run: |
          python scripts/pr240_resolve_open_reviews.py
          python scripts/pr240_followup_review_fixes.py

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/pr240_resolve_open_reviews.py
          rm scripts/pr240_followup_review_fixes.py
          rm .github/workflows/pr240-resolve-open-reviews.yml

      - name: Compile patched source and tests
        run: |
          python -m py_compile \
            aura_arena_attempt_archive.py \
            aura_bilateral_live_repair_foundry.py \
            aura_bilateral_live_repair_foundry_contracts.py \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py

      - name: Run fatal Ruff checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_arena_attempt_archive.py \
            aura_bilateral_live_repair_foundry.py \
            aura_bilateral_live_repair_foundry_contracts.py \
            aura_bilateral_live_repair_foundry_capture.py \
            aura_bilateral_live_repair_foundry_service.py \
            aura_bilateral_live_repair_foundry_service_capture.py \
            aura_bilateral_live_repair_foundry_service_runtime.py \
            aura_bilateral_live_repair_foundry_service_preview.py \
            aura_showcase_live_repair_server.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py

      - name: Run focused B11-B15 verification
        run: |
          pytest -q \
            tests/test_aura_bilateral_live_repair_foundry.py \
            tests/test_aura_bilateral_live_repair_foundry_hardening.py \
            tests/test_aura_showcase_live_repair_server.py \
            tests/test_aura_showcase_attempt_archive.py
          node --check aura_showcase/live-repair-foundry.js

      - name: Commit verified patch locally
        id: commit
        run: |
          git config user.name "Aura PR240 Review Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve remaining PR240 review findings"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch exact base for Aura-native harness
        run: git fetch --depth=1 --no-tags origin main:refs/remotes/origin/main

      - name: Run Aura Architect, Council V3, Surgeon, Connectome, Emergent, Waboose, and Crucible harness
        run: |
          python scripts/aura_review_learning_architect_harness.py \
            --repo-root . \
            --base-ref origin/main \
            --head-ref "${{ steps.commit.outputs.sha }}" \
            --output /tmp/pr240-review-harness-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/pr240-review-harness-receipt.json').read_text())
          assert receipt['status'] == 'PASSED', receipt
          assert receipt['repository']['head']
          assert receipt['checks']['waboose_prepare_ok'] is True
          assert receipt['checks']['waboose_scan_ok'] is True
          assert receipt['checks']['waboose_finalize_ok'] is True
          assert receipt['checks']['crucible_passed'] is True
          assert receipt['production_mutation'] is False
          assert receipt['automatic_commit'] is False
          assert receipt['automatic_push'] is False
          assert receipt['automatic_merge'] is False
          assert receipt['human_review_required'] is True
          PY

      - name: Push verified fix commit
        run: git push origin "HEAD:${TARGET_BRANCH}"
