name: Apply canonical docs on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/human-agent-observatory-crucible'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/human-agent-observatory-crucible

      - name: Execute embedded documentation updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/docs-update-once.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'docs-update-once', 'exec'), {'__name__': '__main__'})
          PY

      - name: Refresh CODEMAP
        run: python3 aura_codebase_navigator.py

      - name: Commit applied documentation
        shell: bash
        run: |
          rm -f .github/workflows/docs-pr-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md USER_GUIDE.md .aura/ARCHITECTURE.md .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json .github/workflows/docs-update-once.yml .github/workflows/docs-pr-apply.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: document governed learning loop and benchmarks"
          git push origin HEAD:docs/human-agent-observatory-crucible
