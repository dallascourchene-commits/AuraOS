name: PR3 immutable input closure bounds guard
on:
  push:
    branches: [analysis/pr3-immutable-input-closure-bounds]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-first-project-context-pr3
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aura_project_context_compiler.py
            aura_ephemeral_workspace_contracts.py
            aura_ephemeral_path_policy.py
            tests/test_aura_project_context_compiler.py
            tests/test_aura_project_context_acceptance.py
            schemas/aura_projection_selection_receipt_v1.schema.json
            docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "99e3c74f83ec401651268b9a5fdf0a3db8b98b90"
      - name: Patch immutable bounds and closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aura_project_context_compiler.py'); s=p.read_text()

          s=s.replace(
'''    if type(raw_bindings) not in (tuple, list):
        raise TypeError("temporal_bindings must be a bounded built-in tuple or list")
''',
'''    if type(raw_bindings) is not tuple:
        raise TypeError("temporal_bindings must be an exact immutable tuple")
''',1)

          old='''    if existing is None:
        object.__setattr__(
            candidate,
            "temporal_bindings",
            tuple(
                sorted(
                    (*candidate.temporal_bindings, reference_binding),
                    key=lambda item: item.key,
                )
            ),
        )
'''
          new='''    if existing is None:
        if len(candidate.temporal_bindings) >= MAX_TEMPORAL_BINDINGS:
            raise ValueError(
                "temporal_bindings leaves no room for canonical-reference identity binding"
            )
        object.__setattr__(
            candidate,
            "temporal_bindings",
            tuple(
                sorted(
                    (*candidate.temporal_bindings, reference_binding),
                    key=lambda item: item.key,
                )
            ),
        )
        if len(candidate.temporal_bindings) > MAX_TEMPORAL_BINDINGS:
            raise ValueError("temporal_bindings exceeds the bounded record ceiling")
'''
          if s.count(old)!=1: raise SystemExit('reference binding anchor mismatch')
          s=s.replace(old,new,1)

          old='''    if type(raw_selected) not in (tuple, list):
        raise TypeError("selected_candidates must be a bounded built-in tuple or list")
'''
          new='''    if type(raw_selected) is not tuple:
        raise TypeError("selected_candidates must be an exact immutable tuple")
'''
          if s.count(old)!=1: raise SystemExit('public selected anchor mismatch')
          s=s.replace(old,new,1)

          old='''    if type(raw_edges) not in (tuple, list):
        raise TypeError("graph_edges must be a bounded built-in tuple or list")
'''
          new='''    if type(raw_edges) is not tuple:
        raise TypeError("graph_edges must be an exact immutable tuple")
'''
          if s.count(old)!=1: raise SystemExit('public graph anchor mismatch')
          s=s.replace(old,new,1)

          old='''    if isinstance(candidates, (str, bytes, bytearray)) or not isinstance(
        candidates, Sequence
    ):
        raise TypeError("candidates must be a sequence")
    if len(candidates) > MAX_CANDIDATES or any(
        type(item) is not ProjectContextCandidate for item in candidates
    ):
        raise ValueError(
            "candidates must be a bounded sequence of exact ProjectContextCandidate records"
        )
'''
          new='''    if type(candidates) is not tuple:
        raise TypeError("candidates must be an exact immutable tuple")
    if len(candidates) > MAX_CANDIDATES:
        raise ValueError("candidates exceed the bounded candidate ceiling")
    if any(type(item) is not ProjectContextCandidate for item in candidates):
        raise ValueError(
            "candidates must contain exact ProjectContextCandidate records"
        )
'''
          if s.count(old)!=1: raise SystemExit('candidate input anchor mismatch')
          s=s.replace(old,new,1)

          old='''    if type(edges) not in (tuple, list):
        raise TypeError("edges must be a sequence backed by an exact built-in tuple or list")
'''
          new='''    if type(edges) is not tuple:
        raise TypeError("edges must be an exact immutable tuple")
'''
          if s.count(old)!=1: raise SystemExit('edge input anchor mismatch')
          s=s.replace(old,new,1)

          old='''    eligible = mandatory - invalid
    if len(eligible) > budget.max_nodes:
'''
          new='''    eligible = mandatory - invalid
    while True:
        orphaned = {
            candidate_id
            for candidate_id in eligible
            if any(
                dependency_id not in eligible
                for dependency_id in candidate_map[candidate_id].dependency_ids
            )
        }
        if not orphaned:
            break
        buckets["mandatory_evidence_missing"].update(orphaned)
        eligible.difference_update(orphaned)
    if len(eligible) > budget.max_nodes:
'''
          if s.count(old)!=1: raise SystemExit('mandatory closure anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s.rstrip()+'\n')

          t=Path('tests/test_aura_project_context_compiler.py'); x=t.read_text().rstrip()
          block='''


def test_compile_rejects_mutable_candidate_list_before_traversal() -> None:
    source = _candidate("source:target", CandidateCategory.SOURCE, D["2"], answer_determining=True)
    with pytest.raises(TypeError, match="candidates must be an exact immutable tuple"):
        compile_project_context_projection(
            "Fix the exact behavior without losing proof context.",
            project_ref="project:auraos-pr3",
            repository_identity=_repo(), candidates=[source], edges=(),
            budget=ProjectionBudget(max_nodes=64, max_edges=256),
            freshness_timestamp_ms=1_786_180_000_000,
        )


def test_compile_rejects_mutable_edge_list_before_traversal() -> None:
    source = _candidate("source:target", CandidateCategory.SOURCE, D["2"], answer_determining=True)
    with pytest.raises(TypeError, match="edges must be an exact immutable tuple"):
        compile_project_context_projection(
            "Fix the exact behavior without losing proof context.",
            project_ref="project:auraos-pr3",
            repository_identity=_repo(), candidates=(source,), edges=[],
            budget=ProjectionBudget(max_nodes=64, max_edges=256),
            freshness_timestamp_ms=1_786_180_000_000,
        )


def test_compile_rejects_hostile_candidate_sequence_without_protocol_calls() -> None:
    class HostileCandidates:
        def __len__(self):
            raise AssertionError("hostile candidate length must not run")
        def __iter__(self):
            raise AssertionError("hostile candidate iterator must not run")
    with pytest.raises(TypeError, match="candidates must be an exact immutable tuple"):
        compile_project_context_projection(
            "Fix the exact behavior without losing proof context.",
            project_ref="project:auraos-pr3", repository_identity=_repo(),
            candidates=HostileCandidates(), edges=(),
            budget=ProjectionBudget(max_nodes=64, max_edges=256),
            freshness_timestamp_ms=1_786_180_000_000,
        )


def test_incomplete_mandatory_selection_remains_dependency_closed() -> None:
    source = _candidate(
        "source:target", CandidateCategory.SOURCE, D["2"],
        answer_determining=True, deps=("test:missing",),
    )
    result = _compile((source,))
    assert result.selection_receipt.status is SelectionStatus.INCOMPLETE
    assert result.projection is None
    assert result.selected_candidates == ()
    assert "test:missing" in result.selection_receipt.mandatory_evidence_missing
    assert "source:target" in result.selection_receipt.mandatory_evidence_missing


def test_authoritative_candidate_reserves_slot_for_reference_binding() -> None:
    bindings = tuple(
        TemporalBinding(TemporalBindingKind.LEASE, f"lease:{index}", f"{index + 1:064x}")
        for index in range(64)
    )
    with pytest.raises(ValueError, match="no room for canonical-reference identity binding"):
        _candidate(
            "source:target", CandidateCategory.SOURCE, D["2"],
            answer_determining=True, bindings=bindings,
        )
'''
          if 'test_compile_rejects_mutable_candidate_list_before_traversal' in x: raise SystemExit('new tests already exist')
          t.write_text((x+block).rstrip()+'\n')

          a=Path('tests/test_aura_project_context_acceptance.py'); y=a.read_text()
          y=y.replace('match="selected_candidates must be a bounded built-in"','match="selected_candidates must be an exact immutable tuple"')
          y=y.replace('match="graph_edges must be a bounded built-in"','match="graph_edges must be an exact immutable tuple"')
          y=y.replace('match="temporal_bindings must be a bounded built-in"','match="temporal_bindings must be an exact immutable tuple"')
          a.write_text(y.rstrip()+'\n')

          d=Path('docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md'); z=d.read_text()
          z=z.replace('Candidate input edges must be an exact built-in `tuple` or `list`; arbitrary custom `Sequence` implementations are rejected before calling their length, indexing, or iteration protocols.', 'Candidate and edge inputs must be exact immutable built-in `tuple` values; mutable lists and arbitrary custom `Sequence` implementations are rejected before calling caller-controlled length, indexing, or iteration protocols.')
          z=z.replace('caller-controlled selected-candidate, graph-edge, or temporal-binding iterables are not materialized before exact finite-container and declared-length bounds are proven;', 'caller-controlled candidate, selected-candidate, graph-edge, edge-input, or temporal-binding collections must be exact immutable tuples and satisfy declared-length bounds before traversal;')
          d.write_text(z.rstrip()+'\n')
          PY
      - name: Install
        run: python -m pip install --quiet pytest jsonschema ruff
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          python -m ruff check --select E9,F63,F7,F82 aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('aura_project_context_compiler.py').read_text())
          funcs=[n for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
          coverage=sum(ast.get_docstring(n) is not None for n in funcs)/len(funcs)
          print(f'production docstring coverage={coverage:.2%}')
          assert coverage >= .80
          for name in ('aura_project_context_compiler.py','tests/test_aura_project_context_compiler.py','tests/test_aura_project_context_acceptance.py','docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md'):
              data=Path(name).read_text()
              assert data.endswith('\n') and not data.endswith('\n\n'), name
              assert all(line.rstrip(' \t')==line for line in data.splitlines()), name
          PY
          python -m pytest -q tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aura PR3 Guarded Repair"
          git config user.email "actions@users.noreply.github.com"
          git add aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
          git commit -m "PR3: enforce immutable bounded inputs and diagnostic closure"
          git fetch --depth=1 origin refactor/source-first-project-context-pr3
          test "$(git rev-parse FETCH_HEAD)" = "99e3c74f83ec401651268b9a5fdf0a3db8b98b90"
          git push origin HEAD:refactor/source-first-project-context-pr3
