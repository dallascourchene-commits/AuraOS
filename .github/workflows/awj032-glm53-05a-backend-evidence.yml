name: AWJ032 GLM53-05A backend evidence guard

on:
  pull_request:
    paths:
      - 'tools/awj032/glm53_backend_io_evidence_guard.py'
      - 'tools/awj032/test_glm53_backend_io_evidence_guard.py'
      - '.github/workflows/awj032-glm53-05a-backend-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile tools/awj032/glm53_backend_io_evidence_guard.py tools/awj032/test_glm53_backend_io_evidence_guard.py
      - name: Regressions
        working-directory: tools/awj032
        run: python -m unittest -v test_glm53_backend_io_evidence_guard.py
