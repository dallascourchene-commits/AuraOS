name: P1.1 CI concurrency repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-concurrency:
    if: github.event.pull_request.number == 96 && github.event.pull_request.head.ref == 'refactor/relational-authority-p1-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/relational-authority-p1-1
          fetch-depth: 0
      - name: Bind CI concurrency to the exact head SHA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '  group: aura-ci-${{ github.workflow }}-${{ github.ref }}\n'
          new = '  group: aura-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('AuraOS CI concurrency group did not match the expected source span')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit CI ordering repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "fix(ci): isolate validation runs by head SHA"
          git fetch origin refactor/relational-authority-p1-1
          git rebase origin/refactor/relational-authority-p1-1
          git push origin HEAD:refactor/relational-authority-p1-1
