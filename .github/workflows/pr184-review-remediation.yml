name: PR184 Review Remediation

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - ".github/workflows/pr184-review-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr184-review-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: work/construction-arena-real-asset-pack-g4-20260722
      EXPECTED_HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Bind remediation to exact branch head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            PyYAML \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard==0.25.0" \
            "ifcopenshell==0.8.5"

      - name: Apply Codex and CodeRabbit remediation set
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()
          TARGET_BRANCH = "work/construction-arena-real-asset-pack-g4-20260722"
          CASE_HEAD = "e67d6bdf96e6ba909846295ff9f5fd50d87697e4"
          CASE_TREE = subprocess.check_output(
              ["git", "rev-parse", f"{CASE_HEAD}^{{tree}}"], text=True
          ).strip()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, observed {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacements, observed {count}: {old!r}"
                  )
              write(path, text.replace(old, new))

          # Codex/CodeRabbit: raw IfcConvert GLBs must never survive canonicalization.
          replace_once(
              "scripts/aura_prepare_construction_demo_assets.py",
              """        except Exception:\n            temporary.unlink(missing_ok=True)\n            job_output.unlink(missing_ok=True)\n            raise\n""",
              """        except Exception:\n            job_output.unlink(missing_ok=True)\n            raise\n        finally:\n            temporary.unlink(missing_ok=True)\n""",
          )

          # Codex: final run digest must be calculated from the digest-free final summary.
          replace_once(
              "scripts/aura_architecture_harness.py",
              """    output = _ORIGINAL_RUN_ARCHITECTURE(root, **kwargs)\n    output[\"github_publication_route\"] = _github_publication_route_policy()\n    output[\"run_digest\"] = _core._digest(output)\n""",
              """    output = _ORIGINAL_RUN_ARCHITECTURE(root, **kwargs)\n    output.pop(\"run_digest\", None)\n    output[\"github_publication_route\"] = _github_publication_route_policy()\n    output[\"run_digest\"] = _core._digest(output)\n""",
          )

          # Codex: route records must distinguish the head commit from its exact tree.
          route_path = "aura_architecture_harness_git_tree_routing.py"
          replace_once(
              route_path,
              """    expected_head_sha: str,\n    blobs: Iterable[GitTreeBlobIntent],\n""",
              """    expected_head_sha: str,\n    expected_head_tree_sha: str,\n    blobs: Iterable[GitTreeBlobIntent],\n""",
          )
          replace_once(
              route_path,
              """    head = _sha1(expected_head_sha, \"expected_head_sha\")\n    blob_rows = tuple(sorted(tuple(blobs), key=lambda item: item.path))\n""",
              """    head = _sha1(expected_head_sha, \"expected_head_sha\")\n    head_tree = _sha1(expected_head_tree_sha, \"expected_head_tree_sha\")\n    if head_tree == head:\n        raise GitTreeRoutingError(\n            \"expected_head_tree_sha must be the resolved tree object, not the head commit\"\n        )\n    blob_rows = tuple(sorted(tuple(blobs), key=lambda item: item.path))\n""",
          )
          replace_once(
              route_path,
              """        \"expected_head_sha\": head,\n        \"blob_intents\": [item.to_dict() for item in blob_rows],\n""",
              """        \"expected_head_sha\": head,\n        \"expected_head_tree_sha\": head_tree,\n        \"blob_intents\": [item.to_dict() for item in blob_rows],\n""",
          )
          replace_once(
              route_path,
              """            \"the pull request is open and its head SHA exactly equals expected_head_sha\",\n            \"all file bytes already passed the requested validation gate\",\n""",
              """            \"the pull request is open and its head SHA exactly equals expected_head_sha\",\n            \"expected_head_tree_sha was resolved from that exact commit and independently verified\",\n            \"all file bytes already passed the requested validation gate\",\n""",
          )
          route_text = read(route_path)
          sequence_pattern = re.compile(
              r'        \"connector_sequence\": \[\n.*?        \],\n        \"workflow_discovery\":',
              re.S,
          )
          sequence = f'''        "connector_sequence": [
            {{
                "order": 1,
                "action": "get_pr_info",
                "assertions": ["open PR", "expected branch", "exact expected_head_sha"],
            }},
            {{
                "order": 2,
                "action": "get_commit",
                "commit_sha": head,
                "resolved_tree_sha": head_tree,
                "assertions": [
                    "commit still equals the live PR head",
                    "commit tree exactly equals expected_head_tree_sha",
                ],
            }},
            {{
                "order": 3,
                "action": "create_blob",
                "per_file": True,
                "assertions": ["exact bytes", "local SHA-256", "regular-file mode only"],
            }},
            {{
                "order": 4,
                "action": "create_tree",
                "base_tree_sha": head_tree,
                "assertions": [
                    "base tree is the exact tree resolved from the current PR head commit",
                    "base_tree_sha is not a commit SHA alias",
                    "tree contains the complete replacement/add/delete set",
                    "temporary transport cleanup is included in the same tree",
                ],
            }},
            {{
                "order": 5,
                "action": "create_commit",
                "parent_sha": head,
                "assertions": ["one parent", "one atomic tree", "reviewable message"],
            }},
            {{
                "order": 6,
                "action": "update_ref",
                "branch": branch,
                "force": False,
                "assertions": ["fast-forward only", "never update the base branch"],
            }},
            {{
                "order": 7,
                "action": "verify",
                "assertions": [
                    "PR head equals the created commit",
                    "changed filenames equal the intended allowlist",
                    "temporary transport files are absent",
                    "tests and CODEMAP verification pass on the final tree",
                    "PR remains unmerged unless separately authorized",
                ],
            }},
        ],
        "workflow_discovery":'''
          route_text, count = sequence_pattern.subn(sequence, route_text, count=1)
          if count != 1:
              raise SystemExit("routing connector sequence replacement failed")
          write(route_path, route_text)
          replace_once(
              route_path,
              f'''        expected_head_sha="{CASE_HEAD}",\n        blobs=(placeholder,),\n''',
              f'''        expected_head_sha="{CASE_HEAD}",\n        expected_head_tree_sha="{CASE_TREE}",\n        blobs=(placeholder,),\n''',
          )
          replace_once(
              route_path,
              """        \"confirmed_base_tree_accepts_commit_sha\": True,\n        \"confirmed_force_required\": False,\n""",
              f"""        \"resolved_head_tree_sha\": \"{CASE_TREE}\",\n        \"base_tree_is_commit_sha\": False,\n        \"confirmed_force_required\": False,\n""",
          )

          # CodeRabbit + Codex: synchronize the durable routing playbook.
          doc_path = "docs/AURA_ARCHITECTURE_HARNESS_GIT_TREE_ROUTING.md"
          replace_once(
              doc_path,
              "**Version:** `AURA_ARCHITECTURE_HARNESS_GIT_TREE_ROUTING_V1`  ",
              "**Version:** `AURA_ARCHITECTURE_HARNESS_GIT_TREE_ROUTING_V2`  ",
          )
          replace_once(
              doc_path,
              """1. **Resolve the live PR identity.** Read the PR and require an open state, the expected\n   head branch, and an exact expected head SHA. Any head drift aborts the route.\n""",
              """1. **Resolve the live PR identity and tree.** Read the PR and require an open state,\n   the expected head branch, and an exact expected head commit SHA. Resolve that commit,\n   record its exact tree SHA separately, and abort on commit or tree drift.\n""",
          )
          replace_once(
              doc_path,
              """3. **Create one tree.** Call `create_tree` with the exact PR head SHA as\n   `base_tree_sha`. Include every addition/replacement and every cleanup deletion in the\n   same tree. PR #184 confirmed that the connector accepts the commit SHA as the base\n   tree identity.\n""",
              """3. **Create one tree.** Call `create_tree` with the tree SHA resolved from the exact\n   PR head commit as `base_tree_sha`. Never substitute the commit SHA for the tree SHA.\n   Include every addition/replacement and every cleanup deletion in the same tree.\n""",
          )
          replace_once(
              doc_path,
              """get_pr_info(expected head)\n  → create_blob(file 1..N)\n  → create_tree(base_tree_sha = exact PR head; replacements + deletions)\n  → create_commit(parent = exact PR head)\n""",
              """get_pr_info(expected head commit)\n  → get_commit(expected head commit; resolve exact tree SHA)\n  → create_blob(file 1..N)\n  → create_tree(base_tree_sha = resolved head tree; replacements + deletions)\n  → create_commit(parent = exact head commit)\n""",
          )
          replace_once(
              doc_path,
              "- exact expected PR head SHA and branch;\n",
              "- exact expected PR head commit SHA, resolved tree SHA, and branch;\n",
          )

          # Routing tests now bind both the commit and the independently resolved tree.
          test_path = "tests/test_aura_architecture_harness_git_tree_routing.py"
          replace_once(
              test_path,
              'HEAD = "e67d6bdf96e6ba909846295ff9f5fd50d87697e4"\n',
              'HEAD = "e67d6bdf96e6ba909846295ff9f5fd50d87697e4"\nTREE = "1111111111111111111111111111111111111111"\n',
          )
          replace_count(
              test_path,
              "        expected_head_sha=HEAD,\n",
              "        expected_head_sha=HEAD,\n        expected_head_tree_sha=TREE,\n",
              4,
          )
          replace_once(
              test_path,
              '            expected_head_sha="bad",\n',
              '            expected_head_sha="bad",\n            expected_head_tree_sha=TREE,\n',
          )
          replace_once(
              test_path,
              '        "get_pr_info",\n        "create_blob",\n',
              '        "get_pr_info",\n        "get_commit",\n        "create_blob",\n',
          )
          replace_once(
              test_path,
              """    assert next(item for item in first[\"connector_sequence\"] if item[\"action\"] == \"update_ref\")[\"force\"] is False\n    assert first[\"authority\"] == AUTHORITY_CONTRACT\n""",
              """    tree_step = next(\n        item for item in first[\"connector_sequence\"] if item[\"action\"] == \"create_tree\"\n    )\n    assert tree_step[\"base_tree_sha\"] == TREE\n    assert tree_step[\"base_tree_sha\"] != HEAD\n    assert next(item for item in first[\"connector_sequence\"] if item[\"action\"] == \"update_ref\")[\"force\"] is False\n    assert first[\"authority\"] == AUTHORITY_CONTRACT\n""",
          )
          replace_once(
              test_path,
              '    assert record["case_study"]["confirmed_base_tree_accepts_commit_sha"] is True\n',
              '    assert record["case_study"]["base_tree_is_commit_sha"] is False\n    assert record["case_study"]["resolved_head_tree_sha"] != record["expected_head_sha"]\n',
          )

          # Codex digest regression: an inherited digest must not feed the final digest.
          original_test = "tests/test_aura_architecture_harness_original_github_routing.py"
          replace_once(
              original_test,
              '        lambda root, **kwargs: {"ok": True, "version": "test"},\n',
              '        lambda root, **kwargs: {"ok": True, "version": "test", "run_digest": "stale"},\n',
          )
          replace_once(
              original_test,
              """    assert summary[\"run_digest\"] == result[\"run_digest\"]\n    assert summary[\"github_publication_route\"][\"authority\"][\n""",
              """    assert summary[\"run_digest\"] == result[\"run_digest\"]\n    digest_free = dict(result)\n    digest = digest_free.pop(\"run_digest\")\n    assert digest != \"stale\"\n    assert digest == harness._core._digest(digest_free)\n    assert summary[\"github_publication_route\"][\"authority\"][\n""",
          )

          # CodeRabbit: repair YAML and Codex: bind every writing workflow to its trigger.
          writer_jobs = {
              ".github/workflows/apply-pr184-g4-adapter.yml": "publish",
              ".github/workflows/construction-demo-ifc-proof.yml": "publish-g4-adapter",
              ".github/workflows/construction-demo-spz-build-diagnostics.yml": "publish-g4-adapter",
              ".github/workflows/construction-demo-toolchain-diagnostics.yml": "publish-g4-adapter",
              ".github/workflows/construction-demo-documentation-sync.yml": "synchronize",
          }
          invalid_names = "          expected_names='chunk00\nchunk01\nchunk02\nchunk03\nREADY'"
          valid_names = "          expected_names=$'chunk00\\nchunk01\\nchunk02\\nchunk03\\nREADY'"
          payload_workflows = set(writer_jobs) - {
              ".github/workflows/construction-demo-documentation-sync.yml"
          }
          old_checkout = f"""      - uses: actions/checkout@v4\n        with:\n          ref: {TARGET_BRANCH}\n          fetch-depth: 0\n"""
          new_checkout = """      - name: Checkout exact triggering head\n        uses: actions/checkout@v4\n        with:\n          ref: ${{ env.EXPECTED_HEAD_SHA }}\n          fetch-depth: 0\n\n      - name: Bind publication to triggering head\n        run: |\n          set -euo pipefail\n          test \"$(git rev-parse HEAD)\" = \"${EXPECTED_HEAD_SHA}\"\n          git fetch --no-tags origin \"refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}\"\n          test \"$(git rev-parse \"refs/remotes/origin/${TARGET_BRANCH}\")\" = \"${EXPECTED_HEAD_SHA}\"\n"""
          push_line = f"          git push origin HEAD:{TARGET_BRANCH}"
          guarded_push = """          git fetch --no-tags origin \"refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}\"\n          test \"$(git rev-parse \"refs/remotes/origin/${TARGET_BRANCH}\")\" = \"${EXPECTED_HEAD_SHA}\"\n          git push origin \"HEAD:refs/heads/${TARGET_BRANCH}\""""
          env_block = f"""    env:\n      TARGET_BRANCH: {TARGET_BRANCH}\n      EXPECTED_HEAD_SHA: ${{{{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}}}\n"""
          for workflow, job_name in writer_jobs.items():
              if workflow in payload_workflows:
                  replace_once(workflow, invalid_names, valid_names)
              replace_once(workflow, f"  {job_name}:\n", f"  {job_name}:\n{env_block}")
              replace_once(workflow, old_checkout, new_checkout)
              replace_once(workflow, push_line, guarded_push)

          # Behavioral regression for the leaked raw GLB, plus workflow policy checks.
          regression_path = ROOT / "tests/test_pr184_review_remediations.py"
          regression_path.write_text(
              '''from __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\n\nfrom scripts import aura_prepare_construction_demo_assets as assets\n\n\nclass _CommandReceipt:\n    def to_content_dict(self):\n        return {"returncode": 0, "timed_out": False}\n\n\ndef test_convert_ifc_assets_removes_successful_raw_glb_temp(tmp_path, monkeypatch) -> None:\n    source = tmp_path / "source.ifc"\n    source.write_bytes(b"IFC")\n    executable = tmp_path / "IfcConvert"\n    executable.write_text("#!/bin/sh\\nexit 0\\n", encoding="utf-8")\n    executable.chmod(0o755)\n    output = tmp_path / "generated"\n\n    monkeypatch.setattr(\n        assets,\n        "_capture_ifcconvert_identity",\n        lambda *args, **kwargs: {"identity_digest": "ifcconvert"},\n    )\n    monkeypatch.setattr(assets, "_validate_split_receipt", lambda *args, **kwargs: ())\n    monkeypatch.setattr(assets, "_validate_digest_record", lambda *args, **kwargs: None)\n    monkeypatch.setattr(assets, "atomic_json", lambda *args, **kwargs: None)\n\n    def fake_run(command, **kwargs):\n        Path(command[-1]).write_bytes(b"raw-glb")\n        return _CommandReceipt()\n\n    monkeypatch.setattr(assets, "run_bounded_command", fake_run)\n\n    def canonicalize(raw: Path, destination: Path, *, repo_root: Path):\n        assert raw.is_file()\n        destination.write_bytes(b"canonical-glb")\n        return {\n            "receipt_digest": "accepted-by-test-double",\n            "import_receipt_digest": "runtime-import",\n            "verification": {"accepted": True},\n        }\n\n    assets.convert_ifc_assets(\n        source=source,\n        split_receipt={"receipt_digest": "split"},\n        output_dir=output,\n        repo_root=tmp_path,\n        ifcconvert=executable,\n        workers=1,\n        source_manifest_digest="manifest",\n        hierarchy_digest="hierarchy",\n        glb_canonicalizer=canonicalize,\n    )\n\n    assert sorted(path.relative_to(output).as_posix() for path in output.rglob("*.glb")) == [\n        "building-full.glb"\n    ]\n    assert not list(output.rglob(".*.ifcconvert.*.glb"))\n\n\ndef test_writing_workflows_are_exact_head_bound_and_yaml_safe() -> None:\n    target = "work/construction-arena-real-asset-pack-g4-20260722"\n    workflows = [\n        Path(".github/workflows/apply-pr184-g4-adapter.yml"),\n        Path(".github/workflows/construction-demo-ifc-proof.yml"),\n        Path(".github/workflows/construction-demo-spz-build-diagnostics.yml"),\n        Path(".github/workflows/construction-demo-toolchain-diagnostics.yml"),\n        Path(".github/workflows/construction-demo-documentation-sync.yml"),\n    ]\n    for path in workflows:\n        text = path.read_text(encoding="utf-8")\n        assert f"TARGET_BRANCH: {target}" in text\n        assert "EXPECTED_HEAD_SHA:" in text\n        assert "ref: ${{ env.EXPECTED_HEAD_SHA }}" in text\n        assert "refs/remotes/origin/${TARGET_BRANCH}" in text\n        assert "git push origin \\\"HEAD:refs/heads/${TARGET_BRANCH}\\\"" in text\n    for path in workflows[:4]:\n        text = path.read_text(encoding="utf-8")\n        assert "expected_names=$'chunk00\\\\nchunk01\\\\nchunk02\\\\nchunk03\\\\nREADY'" in text\n        assert "\\nchunk01\\n" not in text\n''',
              encoding="utf-8",
          )
          PY

      - name: Validate syntax, YAML, routing, and Construction conversions
        run: |
          set -euo pipefail
          python -m compileall -q \
            aura_architecture_harness_git_tree_routing.py \
            scripts/aura_architecture_harness.py \
            scripts/aura_architecture_harness_core.py \
            scripts/aura_prepare_construction_demo_assets.py \
            tests/test_pr184_review_remediations.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open(encoding='utf-8') as handle:
                  yaml.safe_load(handle)
          PY
          python -m pytest -q \
            tests/test_aura_architecture_harness_git_tree_routing.py \
            tests/test_aura_architecture_harness_original_github_routing.py \
            tests/test_pr184_review_remediations.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py

      - name: Publish one reviewed remediation commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr184-review-remediation.yml
          git diff --check
          git config user.name "AuraOS Review Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(review): address Codex and CodeRabbit findings"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "${EXPECTED_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
