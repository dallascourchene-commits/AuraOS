name: Aura EKI Coordinate Memory Candidate

on:
  pull_request:
    paths:
      - 'tools/aura_external_knowledge_ingress.py'
      - 'tests/test_aura_external_knowledge_ingress.py'
      - 'tools/aura_external_cognition_resolve_adapter.py'
      - 'tests/test_aura_external_cognition_resolve_adapter.py'
      - 'tools/aura_external_knowledge_coordinate_memory_candidate.py'
      - 'tests/test_aura_external_knowledge_coordinate_memory_candidate.py'
      - '.github/workflows/aura-eki-coordinate-memory-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONVERGENCE_COMMIT: a0fd34ae6c9196a757af642d815f23e5386e5c1b
  EKI_HEAD: 719698bb456ace375205a92c859ef347655a178a
  WP03_HEAD: 9865c42f3ada2520141bd2fe30a439ce160ce2f8
  EKI_SOURCE_BLOB: 7a5e113568bef07019146005c2a00b8acf196e60
  EKI_TEST_BLOB: 021ab1d75b5d446d298ea87ce0ff6dd3b31583e6
  WP03_SOURCE_BLOB: 53de9d551c81a0eb495eb180294c0aba5eb359d0
  WP03_TEST_BLOB: 577b96492b090a6c7fb19b0c92add007e594d57c
  CANDIDATE_SOURCE_BLOB: df97ed2a9195b2e772e071b2ffcdae45d73b9537
  CANDIDATE_TEST_BLOB: 8110db301339860c2fb0c4cbdfd805337c225d3a
  EKI_RUN_ID: '33416243609'
  EKI_JOB_ID: '99567465502'
  WP03_RUN_ID: '33416056653'
  WP03_JOB_ID: '99566849919'

jobs:
  eki-coordinate-memory-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact convergence descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate exact two-parent Diamond and source blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONVERGENCE_COMMIT" HEAD
          parents="$(git show -s --format=%P "$CONVERGENCE_COMMIT")"
          test "$parents" = "$EKI_HEAD $WP03_HEAD"
          git fetch -q --no-tags origin "$EKI_HEAD" "$WP03_HEAD"
          test "$(git rev-parse "$EKI_HEAD:tools/aura_external_knowledge_ingress.py")" = "$EKI_SOURCE_BLOB"
          test "$(git rev-parse "$EKI_HEAD:tests/test_aura_external_knowledge_ingress.py")" = "$EKI_TEST_BLOB"
          test "$(git rev-parse "$WP03_HEAD:tools/aura_external_cognition_resolve_adapter.py")" = "$WP03_SOURCE_BLOB"
          test "$(git rev-parse "$WP03_HEAD:tests/test_aura_external_cognition_resolve_adapter.py")" = "$WP03_TEST_BLOB"
          test "$(git rev-parse HEAD:tools/aura_external_knowledge_coordinate_memory_candidate.py)" = "$CANDIDATE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_aura_external_knowledge_coordinate_memory_candidate.py)" = "$CANDIDATE_TEST_BLOB"
          echo 'EXACT_EKI_WP03_DIAMOND=true'

      - name: Revalidate exact hosted parent producer runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          pairs = [
              (os.environ['EKI_RUN_ID'], os.environ['EKI_HEAD'], 'EKI'),
              (os.environ['WP03_RUN_ID'], os.environ['WP03_HEAD'], 'WP03'),
          ]
          for run_id, expected_head, label in pairs:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.load(resp)
              assert data['head_sha'] == expected_head, (label, data['head_sha'], expected_head)
              assert data['status'] == 'completed', (label, data['status'])
              assert data['conclusion'] == 'success', (label, data['conclusion'])
              print(f'{label}_HOSTED_PRODUCER_SUCCESS=true')
          PY

      - name: Reexecute exact parent adversarial contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_external_knowledge_ingress.py \
            tools/aura_external_cognition_resolve_adapter.py
          python -m unittest tests.test_aura_external_knowledge_ingress -v
          python -m unittest tests.test_aura_external_cognition_resolve_adapter -v

      - name: Run ingress-to-coordinate-memory adversarial contract
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_external_knowledge_coordinate_memory_candidate.py \
            tests/test_aura_external_knowledge_coordinate_memory_candidate.py
          python -m unittest tests.test_aura_external_knowledge_coordinate_memory_candidate -v

      - name: Independently prove identity and non-writing boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_aura_external_knowledge_coordinate_memory_candidate import exact_card
          from tools.aura_external_knowledge_coordinate_memory_candidate import (
              READY,
              project_external_knowledge_candidate,
          )

          card = exact_card()
          decision = project_external_knowledge_candidate(card=card)
          assert decision.disposition == READY
          candidate = decision.candidate
          assert candidate is not None
          assert candidate.semantic_key == card.semantic_id
          assert candidate.source_generation_id == card.generation_id
          assert candidate.eki_k27_locality_key != candidate.semantic_key
          assert candidate.wp03_placement_hint is None
          assert candidate.proposed_row['K'] == card.semantic_id
          assert candidate.store_mutated is False
          assert candidate.writer_admission_required is True
          assert candidate.write_authority is False
          assert candidate.effect_authority is False
          assert candidate.semantic_k27_authority is False
          print('EKI_TO_COORDINATE_MEMORY_CANDIDATE_PROVEN=true')
          PY

      - name: Consequence ceiling
        run: |
          echo 'ExternalSemanticID!=SourceGeneration'
          echo 'EKI27TritLocality!=WP03PlacementHint!=SemanticIdentity'
          echo 'ReadOnlyReferenceReady!=SemanticTruth'
          echo 'CoordinateMemoryCandidate!=PersistentStoreMutation'
          echo 'CandidateRowCompatibility!=WriterAdmission'
          echo 'ExternalStanding!=InstructionAuthority'
          echo 'CoordinateMemory!=MODEL_PREFIX_KV'
          echo 'K27Routing!=EvidenceTruth!=WriteAuthority'
