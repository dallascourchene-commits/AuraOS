name: Phase C3 CODEMAP Refresh

on:
  push:
    branches:
      - feature/phase-c3-trial-crucible

permissions:
  contents: write

concurrency:
  group: phase-c3-codemap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-c3-trial-crucible
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Remove one-shot helper before topology compilation
        run: rm .github/workflows/phase-c3-codemap-refresh.yml
      - name: Regenerate authoritative topology artifacts
        run: python aura_codebase_navigator.py
      - name: Commit exact final-tree maps and helper removal
        run: |
          git config user.name "aura-codemap[bot]"
          git config user.email "aura-codemap[bot]@users.noreply.github.com"
          git add -A .github/workflows/phase-c3-codemap-refresh.yml .aura/CODEMAP.md .aura/CODEMAP.json topology_map.json
          if git diff --cached --quiet; then
            echo "CODEMAP already current and helper removed"
            exit 0
          fi
          git commit -m "chore(c3): refresh final CODEMAP and remove helper"
          git push origin HEAD:feature/phase-c3-trial-crucible
