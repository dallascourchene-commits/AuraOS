name: project006-o23-runtime-activation-proof
on:
  pull_request:
    paths:
      - 'tools/project006/runtime_activation_transaction.py'
      - 'tests/test_project006_runtime_activation_o23.py'
      - 'tools/project006/o23_reference/proof_o23.py'
      - 'artifacts/arena/project006_o23_runtime_activation/PROOF_RECEIPT_O23.json'
      - '.github/workflows/project006-o23-runtime-activation-proof.yml'
jobs:
  exact-head-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact publication bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,pathlib
          expected={
            'tools/project006/runtime_activation_transaction.py':'540e0df8d633b0c4a706b6322cb71004da41cbcb735ba89a56f5071f9e1dea8f',
            'tests/test_project006_runtime_activation_o23.py':'ca6f07ce819ab9eec959301d4b0a393bd9ca9fcd3edf29305db0e754951cd5f7',
            'tools/project006/o23_reference/proof_o23.py':'9ec0b4270094b620dd46295c837163c091d51f4125beed4a6e23fd3f9af58472'
          }
          for p,h in expected.items():
              got=hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest(); assert got==h,(p,got,h)
          print('O23_SOURCE_HASHES=PASS')
          PY
      - name: Three fresh venvs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            rm -rf ".o23-venv-$i"
            python -m venv ".o23-venv-$i"
            ".o23-venv-$i/bin/python" -m unittest -q tests/test_project006_runtime_activation_o23.py
            ".o23-venv-$i/bin/python" tools/project006/o23_reference/proof_o23.py > "o23-proof-$i.json"
          done
          cmp o23-proof-1.json o23-proof-2.json
          cmp o23-proof-1.json o23-proof-3.json
          printf '%s  %s\n' '536c0053a911693a42aa29ebc70e2b4a4eabae3b09f4f2fd516fc4fc4fd1de40' o23-proof-1.json | sha256sum -c -
          echo O23_EXACT_HEAD_PROOF=PASS
