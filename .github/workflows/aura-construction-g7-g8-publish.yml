name: Publish Construction G7-G8 finalization

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-publish.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install jsonschema ruff

      - name: Apply exact G7-G8 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          director_path = Path("aura_construction_demo_director.py")
          director = director_path.read_text(encoding="utf-8")
          director = director.replace(
              "from dataclasses import dataclass\n",
              "from collections.abc import Mapping\nfrom dataclasses import dataclass\n",
              1,
          ).replace("from typing import Any, Mapping\n", "from typing import Any\n", 1)
          director = director.replace(
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        }\n    )\n',
              '            "asset_pack_digest": asset_pack.asset_pack_digest,\n        },\n        digest_size=32,\n    )\n',
              1,
          ).replace(
              "    def do_GET(self) -> None:  # noqa: N802 - stdlib callback name\n",
              "    def do_GET(self) -> None:\n",
              1,
          )
          director_path.write_text(director, encoding="utf-8")

          gate_path = Path(".github/workflows/aura-construction-demo-g7-g8.yml")
          gate = gate_path.read_text(encoding="utf-8")
          gate = gate.replace("numpy pytest ruff zstandard", "jsonschema numpy pytest ruff zstandard", 1)
          for old, new in {
              "max_target_files=16": "max_target_files=8",
              "max_target_symbols=24": "max_target_symbols=12",
              "max_atomic_nodes=64": "max_atomic_nodes=24",
              "max_atlas_participants=64": "max_atlas_participants=16",
              "max_atlas_assessments=160": "max_atlas_assessments=40",
              "max_required_tests=40": "max_required_tests=20",
              "max_neighborhood_nodes=128": "max_neighborhood_nodes=32",
              "max_neighborhood_edges=512": "max_neighborhood_edges=96",
              "max_neighborhood_candidate_pairs=4096": "max_neighborhood_candidate_pairs=256",
          }.items():
              gate = gate.replace(old, new, 1)
          gate = gate.replace(
              "                  max_neighborhood_candidate_pairs=256,\n                  include_source=False,\n",
              "                  max_neighborhood_candidate_pairs=256,\n"
              "                  max_neighborhood_output_bytes=400_000,\n"
              "                  max_neighborhood_elapsed_ms=30_000,\n"
              "                  max_emergent_candidates=6,\n"
              "                  include_source=False,\n",
              1,
          )
          gate_path.write_text(gate, encoding="utf-8")

          app_path = Path("aura_spatial_web/construction_demo_app.js")
          app = app_path.read_text(encoding="utf-8")
          app = app.replace(
              '  if (state.disposed && step.action !== "DISSOLVE") return;\n',
              '  if (state.disposed && step.action !== "DISSOLVE") return;\n'
              '  if ($("#evidence-dialog").open) $("#evidence-dialog").close();\n',
              1,
          ).replace(
              '      document.querySelector(`input[data-layer="${step.target}"]`)?.toggleAttribute("checked", step.value !== "off");\n',
              '      const layerInput = document.querySelector(`input[data-layer="${step.target}"]`);\n'
              '      if (layerInput) layerInput.checked = step.value !== "off";\n',
              1,
          )
          app_path.write_text(app, encoding="utf-8")
          PY

      - name: Format repaired Python
        run: |
          ruff check --fix aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py
          ruff format aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py

      - name: Synchronize canonical documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          additions = {
              "README.md": """<!-- AURA_CONSTRUCTION_G7_G8 -->
          ## Construction Arena G0–G8 — complete refactor

          The complete Construction Arena chain is implemented: open-source fictional BIM acquisition and immutable asset contracts; deterministic IFC-to-storey GLB/SVG compilation; bounded degree-0 Gaussian PLY/SPZ compilation; a full synthetic Construction fixture; Spatial Projection V2; local WebGL2 mesh/Gaussian/overlay composition; and a deterministic cinematic director.

          Launch it with `python aura_spatial_cli.py --repo-root . construction-video-demo --tour full --serve`, then open `http://127.0.0.1:8767/demo/construction?tour=full`. The surface supports mesh, splats, hybrid mode, storey isolation, exploded floors, floor plans, work status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline replay, picking, Observatory evidence, a human decision packet, and exact renderer dissolution.

          The source BIM is fictional and attributed under CC BY 4.0. All project records are synthetic. The Arena cannot authorize physical work, payment, access, professional certification, legal/regulatory action, survey truth, production mutation, publication, or merge. Unsafe drilling remains hard-blocked and the safe alternative remains human-review-only. See [`docs/AURA_CONSTRUCTION_ARENA_G7_G8.md`](docs/AURA_CONSTRUCTION_ARENA_G7_G8.md).
          """,
              "USER_GUIDE.md": """<!-- AURA_CONSTRUCTION_G7_G8 -->
          ## 27. Run the cinematic Construction Arena demo

          Compile a deterministic packet with `python aura_spatial_cli.py --repo-root . construction-video-demo --tour full --output /tmp/aura-construction-demo.packet.json`. Launch the local surface with `python aura_spatial_cli.py --repo-root . construction-video-demo --tour full --serve`, then open `http://127.0.0.1:8767/demo/construction?tour=full`.

          Supported tours are `full`, `blocked-work`, `alternatives`, and `timeline`. Controls include orbit, zoom, storey isolation, show all, explode/collapse, mesh/splats/hybrid, floor plans, status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline scrub, picking, reset, play, pause, next, and dissolve.

          Pass `--asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json` when the generated pack exists. Otherwise the director uses a deterministic five-storey local fallback for recording and tests; it is presentation-only, not survey geometry. Every packet keeps physical work, payment, access, certification, legal/regulatory authority, survey authority, renderer authority, automatic execution, publication, and merge false. The decision packet is human-review-only.
          """,
              ".aura/ARCHITECTURE.md": """<!-- AURA_CONSTRUCTION_G7_G8 -->
          ## Construction Arena G7–G8 presentation and proof layer

          `ConstructionProjectState`, `ConstructionArenaAdapter`, `ConstructionDemoAssetPack`, the G4 fixture, `project_construction_demo_to_scene`, and `ConstructionSceneRenderer` remain the canonical truth, runtime, asset, projection, and renderer owners. `aura_construction_demo_director.py` owns presentation sequencing only: admitted asset pack → G4 fixture/runtime packet → G5 scene → negotiated render plan → G6 renderer → bounded tour → read-only Observatory/human decision packet → exact disposal.

          Prohibited edges include director-to-ledger mutation, browser-to-work release, recommendation-to-automatic execution, renderer-to-payment/access/professional authority, fallback-to-survey truth, and review-bot-to-merge authority. The local server exposes static files plus the deterministic `/api/construction-demo` packet and requires no runtime external network.
          """,
          }
          for filename, block in additions.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "<!-- AURA_CONSTRUCTION_G7_G8 -->" in text:
                  continue
              normalized = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
              path.write_text(text.rstrip() + "\n\n" + normalized.strip() + "\n", encoding="utf-8")
          PY

      - name: Remove temporary publication files and redundant notes
        run: |
          rm -f .github/pull_request_template_construction_g7_g8.md
          rm -f .github/workflows/aura-construction-g7-g8-finalize.yml
          rm -f .github/workflows/aura-construction-g7-g8-repair.yml
          rm -f .github/workflows/aura-construction-g7-g8-publish.yml
          rm -f docs/AURA_CONSTRUCTION_ARENA_G7_G8_{COMPLETION_ORDER,DEFINITION_OF_DONE,DOC_SYNC_REQUIREMENTS,EXACT_HEAD_POLICY,FINAL_HANDOFF,FINAL_REVIEW_PROMPT,MERGE_GATES,NO_NEW_AUTHORITY,OPERATOR_CHECKLIST,PROOF_MATRIX,RECOVERY_POINT,RELEASE_NOTES,SCOPE_LOCK,TEST_INVENTORY,VERIFICATION_COMMANDS}.md

      - name: Regenerate and validate navigation
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json

      - name: Verify repaired static surface
        run: |
          python -m py_compile aura_construction_demo_director.py aura_spatial_cli.py
          ruff check aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py
          ruff format --check aura_construction_demo_director.py aura_spatial_cli.py tests/test_aura_construction_demo_director.py

      - name: Verify repaired Python tests
        run: python -m pytest -q --tb=short tests/test_aura_construction_demo_director.py tests/test_aura_construction_demo_fixture.py tests/test_aura_construction_demo_projection.py

      - name: Verify repaired browser controller
        run: node --check aura_spatial_web/construction_demo_app.js

      - name: Verify repaired CLI packet
        run: python aura_spatial_cli.py --repo-root . construction-video-demo --tour full --output /tmp/aura-construction-demo.packet.json

      - name: Publish one verified finalization commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "AuraOS Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(g8): repair and finalize Construction refactor"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"$TARGET_BRANCH"
