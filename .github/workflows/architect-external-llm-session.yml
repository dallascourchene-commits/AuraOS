name: Architect External LLM Slice Sessions

on:
  pull_request:
  push:
    branches:
      - "analysis/**"
      - "refactor/**"
      - main

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  slice-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact PR head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Aura runtime and focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8.0,<9.0"
      - name: Compile recorded slice-session surfaces
        run: |
          python -m py_compile \
            aura_external_llm_session.py \
            aura_local_inference_gateway.py \
            aura_refactor_chronicle.py \
            aura_refactor_chronicle_recorded.py \
            aura_refactor_state_identity.py \
            aura_refactor_state_ledger_core.py \
            aura_refactor_state_ledger_metrics.py \
            aura_refactor_state_ledger.py \
            aura_cognitive_labor_router.py \
            aura_cognitive_labor_router_core.py \
            aura_external_llm_session_recorded.py \
            aura_external_llm_session_persistent.py \
            aura_external_llm_session_safe.py \
            aura_agent_arena_mcp_external_llm.py \
            tests/test_aura_external_llm_session.py \
            tests/test_aura_local_inference_gateway.py \
            tests/test_aura_local_inference_gateway_repair002.py
      - name: Run focused slice-session and local inference tests
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_external_llm_session.py \
            tests/test_aura_local_inference_gateway.py \
            tests/test_aura_local_inference_gateway_repair002.py \
            2>&1 | tee external-session-tests.log
      - name: Verify additive MCP discovery
        run: |
          python aura_agent_arena_mcp_external_llm.py --list-tools > external-llm-tools.json
          python - <<'PY'
          import json
          from pathlib import Path

          tools = json.loads(Path("external-llm-tools.json").read_text(encoding="utf-8"))
          names = {tool["name"] for tool in tools}
          required = {
              "aura_repo_digest",
              "aura_prepare_arena",
              "aura_read_slice",
              "aura_stage_patch",
              "aura_verify_arena",
              "aura_repair_packet",
              "aura_llm_session_open",
              "aura_llm_session_next",
              "aura_llm_session_submit",
              "aura_llm_session_status",
              "aura_llm_session_export",
          }
          missing = sorted(required - names)
          assert not missing, missing
          export_tool = next(tool for tool in tools if tool["name"] == "aura_llm_session_export")
          assert "Aura_Staging/external_llm_sessions" in export_tool["description"]
          PY
      - name: Upload tool manifest and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-external-llm-tools
          path: |
            external-llm-tools.json
            external-session-tests.log
          if-no-files-found: warn
          retention-days: 14
