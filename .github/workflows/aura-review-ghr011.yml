name: Aura Review GHR-011 Context Invocation Binding

on:
  pull_request:
    paths:
      - "tools/aura_review/review_context_invocation_membrane.py"
      - "tools/aura_review/test_review_context_invocation_membrane.py"
      - "tools/aura_review/aura_review_context_compiler.py"
      - "tools/aura_review/test_aura_review_context_compiler.py"
      - ".github/workflows/aura-review-ghr011.yml"

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile GHR-011 and inherited GHR-002
        run: |
          python -m py_compile tools/aura_review/review_context_invocation_membrane.py
          python -m py_compile tools/aura_review/aura_review_context_compiler.py
      - name: GHR-011 focused regressions
        run: python -m unittest -v tools.aura_review.test_review_context_invocation_membrane
      - name: Inherited GHR-002 regressions
        run: python -m unittest -v tools.aura_review.test_aura_review_context_compiler
