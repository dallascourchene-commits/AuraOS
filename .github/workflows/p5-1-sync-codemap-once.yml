name: P5.1 one-time CODEMAP synchronization

on:
  push:
    branches:
      - refactor/st3gg-contracts-p5-1
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: p5-1-one-time-codemap-sync
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/st3gg-contracts-p5-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest
      - name: Apply exact identity and measurement hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label} target count was {text.count(old)}, expected 1")
              return text.replace(old, new, 1)

          module_path = Path("aura_st3gg_contracts.py")
          module = module_path.read_text(encoding="utf-8")

          module = replace_once(
              module,
              (
                  "        if self.pointer is not None:\n"
                  "            parse_canonical_pointer(self.pointer)\n"
                  "        if self.exact_ref is not None and not _EXACT_REF_RE.fullmatch(self.exact_ref):\n"
                  "            raise ValueError(\"exact_ref_not_canonical\")\n"
              ),
              (
                  "        if self.pointer is not None:\n"
                  "            parse_canonical_pointer(self.pointer)\n"
                  "            if self.pointer != canonical_pointer(self.namespace, self.original_digest):\n"
                  "                raise ValueError(\"pointer_digest_mismatch\")\n"
                  "        if self.exact_ref is not None:\n"
                  "            if not _EXACT_REF_RE.fullmatch(self.exact_ref):\n"
                  "                raise ValueError(\"exact_ref_not_canonical\")\n"
                  "            if self.exact_ref != exact_ref_for(self.namespace, self.original_digest):\n"
                  "                raise ValueError(\"exact_ref_digest_mismatch\")\n"
              ),
              "identity binding",
          )
          module = replace_once(
              module,
              (
                  "        for name, value in (\n"
                  "            (\"savings_ratio\", self.savings_ratio),\n"
                  "            (\"minimum_savings_ratio\", self.minimum_savings_ratio),\n"
                  "        ):\n"
                  "            if type(value) is not float or not math.isfinite(value) or not 0.0 <= value <= 1.0:\n"
                  "                raise ValueError(f\"{name}_invalid\")\n"
                  "        if not _DIGEST_RE.fullmatch(self.original_digest):\n"
              ),
              (
                  "        for name, value in (\n"
                  "            (\"savings_ratio\", self.savings_ratio),\n"
                  "            (\"minimum_savings_ratio\", self.minimum_savings_ratio),\n"
                  "        ):\n"
                  "            if type(value) is not float or not math.isfinite(value) or not 0.0 <= value <= 1.0:\n"
                  "                raise ValueError(f\"{name}_invalid\")\n"
                  "        if self.final_units != self.candidate_units + self.overhead_units:\n"
                  "            raise ValueError(\"final_units_do_not_match_candidate_plus_overhead\")\n"
                  "        if self.savings_ratio != _ratio(self.raw_units, self.final_units):\n"
                  "            raise ValueError(\"savings_ratio_not_derived_from_final_units\")\n"
                  "        if not _DIGEST_RE.fullmatch(self.original_digest):\n"
              ),
              "measurement arithmetic",
          )
          module = replace_once(
              module,
              (
                  "        if self.enabled:\n"
                  "            if self.final_units >= self.raw_units:\n"
              ),
              (
                  "        if self.enabled:\n"
                  "            if self.candidate_units == 0:\n"
                  "                raise ValueError(\"enabled_artifact_empty_candidate\")\n"
                  "            if self.final_units >= self.raw_units:\n"
              ),
              "empty candidate",
          )
          module = replace_once(
              module,
              "    savings = _legacy_float(legacy, \"savings_ratio\")\n",
              (
                  "    supplied_savings = _legacy_float(legacy, \"savings_ratio\")\n"
                  "    measured_savings = _ratio(raw_units, candidate_units)\n"
              ),
              "legacy arena savings",
          )
          module = replace_once(
              module,
              (
                  "    warnings = _unique(tuple(_legacy_get(legacy, \"warnings\", ()) or ()))\n"
                  "    if enabled:\n"
              ),
              (
                  "    warnings = _unique(tuple(_legacy_get(legacy, \"warnings\", ()) or ()))\n"
                  "    if supplied_savings != measured_savings:\n"
                  "        warnings = _unique((*warnings, \"legacy_savings_recomputed\"))\n"
                  "    if enabled:\n"
              ),
              "legacy arena warning",
          )
          module = replace_once(
              module,
              "        savings_ratio=savings if candidate_units < raw_units else 0.0,\n",
              "        savings_ratio=measured_savings,\n",
              "legacy arena derived ratio",
          )
          module = replace_once(
              module,
              "        enabled=candidate_units < raw_units,\n        reason=\"legacy_ast_lossy_advisory_projection\",\n",
              "        enabled=0 < candidate_units < raw_units,\n        reason=\"legacy_ast_lossy_advisory_projection\",\n",
              "legacy AST empty candidate",
          )
          module = replace_once(
              module,
              "        pointer=canonical_pointer(\"AST\", original_digest) if candidate_units < raw_units else None,\n",
              "        pointer=canonical_pointer(\"AST\", original_digest) if 0 < candidate_units < raw_units else None,\n",
              "legacy AST pointer",
          )
          module = replace_once(
              module,
              "    enabled = candidate_units < raw_units\n",
              "    enabled = 0 < candidate_units < raw_units\n",
              "legacy report empty candidate",
          )
          module_path.write_text(module, encoding="utf-8")

          test_path = Path("tests/test_aura_st3gg_contracts.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\n\n@dataclass(frozen=True)\nclass LegacyArenaDecision:"
          additions = "\n".join(
              [
                  "",
                  "",
                  "def test_decision_rejects_pointer_not_bound_to_original_digest() -> None:",
                  "    original_digest = digest_text(\"original\")",
                  "    wrong_pointer = canonical_pointer(\"ARENA\", digest_text(\"other\"))",
                  "    with pytest.raises(ValueError, match=\"pointer_digest_mismatch\"):",
                  "        ST3GGDecision(enabled=True, reason=\"invalid\", namespace=\"ARENA\", measurement_class=ST3GGMeasurementClass.BYTE_EXACT, raw_units=100, candidate_units=10, final_units=20, overhead_units=10, savings_ratio=0.8, minimum_savings_ratio=0.08, restoration_mode=ST3GGRestorationMode.LOSSY_ADVISORY, original_digest=original_digest, compact_digest=digest_text(\"compact\"), pointer=wrong_pointer)",
                  "",
                  "",
                  "def test_decision_rejects_exact_ref_not_bound_to_original_digest() -> None:",
                  "    original_digest = digest_text(\"original\")",
                  "    with pytest.raises(ValueError, match=\"exact_ref_digest_mismatch\"):",
                  "        ST3GGDecision(enabled=True, reason=\"invalid\", namespace=\"ARENA\", measurement_class=ST3GGMeasurementClass.BYTE_EXACT, raw_units=100, candidate_units=10, final_units=20, overhead_units=10, savings_ratio=0.8, minimum_savings_ratio=0.08, restoration_mode=ST3GGRestorationMode.EXACT_RECALL, original_digest=original_digest, compact_digest=digest_text(\"compact\"), pointer=canonical_pointer(\"ARENA\", original_digest), exact_ref=exact_ref_for(\"ARENA\", digest_text(\"other\")))",
                  "",
                  "",
                  "def test_decision_rejects_inconsistent_measurement_arithmetic() -> None:",
                  "    with pytest.raises(ValueError, match=\"final_units_do_not_match_candidate_plus_overhead\"):",
                  "        ST3GGDecision(enabled=False, reason=\"invalid\", namespace=\"ARENA\", measurement_class=ST3GGMeasurementClass.BYTE_EXACT, raw_units=100, candidate_units=20, final_units=30, overhead_units=5, savings_ratio=0.7, minimum_savings_ratio=0.08, restoration_mode=ST3GGRestorationMode.NONE, original_digest=digest_text(\"original\"))",
                  "",
                  "",
                  "def test_decision_rejects_caller_supplied_savings_ratio() -> None:",
                  "    with pytest.raises(ValueError, match=\"savings_ratio_not_derived_from_final_units\"):",
                  "        ST3GGDecision(enabled=False, reason=\"invalid\", namespace=\"ARENA\", measurement_class=ST3GGMeasurementClass.BYTE_EXACT, raw_units=100, candidate_units=20, final_units=20, overhead_units=0, savings_ratio=0.9, minimum_savings_ratio=0.08, restoration_mode=ST3GGRestorationMode.NONE, original_digest=digest_text(\"original\"))",
                  "",
                  "",
                  "def test_legacy_empty_compact_payload_is_not_enabled() -> None:",
                  "    decision = adapt_legacy_report_result(\"original\" * 20, \"\", 1.0, \"ST3GG_PTR:empty\")",
                  "    assert decision.enabled is False",
                  "    assert decision.pointer is None",
              ]
          )
          if tests.count(marker) != 1:
              raise SystemExit(f"test insertion point count was {tests.count(marker)}, expected 1")
          test_path.write_text(tests.replace(marker, additions + marker, 1), encoding="utf-8")
          PY
          python -m py_compile aura_st3gg_contracts.py tests/test_aura_st3gg_contracts.py
          python -m pytest -q tests/test_aura_st3gg_contracts.py
      - name: Remove helper and regenerate exact navigation artifacts
        run: |
          rm .github/workflows/p5-1-sync-codemap-once.yml
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit synchronized tree
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: synchronize CODEMAP and harden P5.1 ST3GG contracts"
          git push origin HEAD:refactor/st3gg-contracts-p5-1
