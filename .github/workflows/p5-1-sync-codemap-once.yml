name: P5.1 one-time CODEMAP synchronization

on:
  push:
    branches:
      - refactor/st3gg-contracts-p5-1

permissions:
  contents: write

concurrency:
  group: p5-1-one-time-codemap-sync
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/st3gg-contracts-p5-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest
      - name: Apply exact identity hardening and adversarial regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path("aura_st3gg_contracts.py")
          module = module_path.read_text(encoding="utf-8")
          old = '''        if self.pointer is not None:
                      parse_canonical_pointer(self.pointer)
                  if self.exact_ref is not None and not _EXACT_REF_RE.fullmatch(self.exact_ref):
                      raise ValueError("exact_ref_not_canonical")
          '''
          new = '''        if self.pointer is not None:
                      parse_canonical_pointer(self.pointer)
                      if self.pointer != canonical_pointer(self.namespace, self.original_digest):
                          raise ValueError("pointer_digest_mismatch")
                  if self.exact_ref is not None:
                      if not _EXACT_REF_RE.fullmatch(self.exact_ref):
                          raise ValueError("exact_ref_not_canonical")
                      if self.exact_ref != exact_ref_for(self.namespace, self.original_digest):
                          raise ValueError("exact_ref_digest_mismatch")
          '''
          if old not in module:
              raise SystemExit("canonical identity patch target not found")
          module_path.write_text(module.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_aura_st3gg_contracts.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "\n\n@dataclass(frozen=True)\nclass LegacyArenaDecision:"
          additions = '''

          def test_decision_rejects_pointer_not_bound_to_original_digest() -> None:
              original_digest = digest_text("original")
              wrong_pointer = canonical_pointer("ARENA", digest_text("other"))

              with pytest.raises(ValueError, match="pointer_digest_mismatch"):
                  ST3GGDecision(
                      enabled=True,
                      reason="invalid",
                      namespace="ARENA",
                      measurement_class=ST3GGMeasurementClass.BYTE_EXACT,
                      raw_units=100,
                      candidate_units=10,
                      final_units=20,
                      overhead_units=10,
                      savings_ratio=0.8,
                      minimum_savings_ratio=0.08,
                      restoration_mode=ST3GGRestorationMode.LOSSY_ADVISORY,
                      original_digest=original_digest,
                      compact_digest=digest_text("compact"),
                      pointer=wrong_pointer,
                  )


          def test_decision_rejects_exact_ref_not_bound_to_original_digest() -> None:
              original_digest = digest_text("original")

              with pytest.raises(ValueError, match="exact_ref_digest_mismatch"):
                  ST3GGDecision(
                      enabled=True,
                      reason="invalid",
                      namespace="ARENA",
                      measurement_class=ST3GGMeasurementClass.BYTE_EXACT,
                      raw_units=100,
                      candidate_units=10,
                      final_units=20,
                      overhead_units=10,
                      savings_ratio=0.8,
                      minimum_savings_ratio=0.08,
                      restoration_mode=ST3GGRestorationMode.EXACT_RECALL,
                      original_digest=original_digest,
                      compact_digest=digest_text("compact"),
                      pointer=canonical_pointer("ARENA", original_digest),
                      exact_ref=exact_ref_for("ARENA", digest_text("other")),
                  )
          '''
          if marker not in tests:
              raise SystemExit("adversarial regression insertion point not found")
          test_path.write_text(tests.replace(marker, additions + marker), encoding="utf-8")
          PY
          python -m py_compile aura_st3gg_contracts.py tests/test_aura_st3gg_contracts.py
          python -m pytest -q tests/test_aura_st3gg_contracts.py
      - name: Remove helper and regenerate exact navigation artifacts
        run: |
          rm .github/workflows/p5-1-sync-codemap-once.yml
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit synchronized tree
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows/p5-1-sync-codemap-once.yml \
            aura_st3gg_contracts.py tests/test_aura_st3gg_contracts.py \
            .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          git commit -m "chore: synchronize CODEMAP and harden P5.1 ST3GG identities"
          git push origin HEAD:refactor/st3gg-contracts-p5-1
