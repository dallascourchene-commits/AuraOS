name: Aura O67 Proposal Support Lifecycle Lineage Proof

on:
  pull_request:
    paths:
      - 'tools/aura_proposal_support_lifecycle_lineage.py'
      - 'tests/test_aura_proposal_support_lifecycle_lineage.py'
      - '.github/workflows/aura-o67-proposal-support-lifecycle-lineage-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  o67-proposal-support-lifecycle-lineage-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: dallascourchene-commits/AuraOS
      SEMANTIC_HEAD: 4ce6c457aa294fb5bae235a8733e5a0f71224299
      SOURCE_BLOB: 70b17c1f91bc7a930c7c43c1471314ef97499b37
      TEST_BLOB: 9f55393b18d6292d20ba8277fb3fe571bb5ba69c
      O65R_SEMANTIC_HEAD: fff1e38f78c54c387c1131543ce332d115ad7f5c
      O65R_PROOF_HEAD: 361b01579ab2debc34f4b836c3ea605de635a8c3
      O65R_RUN: '33411109692'
      O65R_JOB: '99550605797'
      O65R_WORKFLOW: Aura O65-R Authority Materialization Proposal Conformance Proof
      O65R_SOURCE_BLOB: bdaa9b0338cdab05c48dc0337ab46522b40ac42f
      O65R_TEST_BLOB: d71563cbfa3e0a29b86056fbd5ac27916e039624
      Q21_SEMANTIC_HEAD: e83d18126cae4e95abf679f74ee585e6a4025831
      Q21_RUN: '33410723482'
      Q21_JOB: '99549322339'
      Q21_WORKFLOW: Aura Q21 Pre-Attempt Lifecycle Lineage
      Q21_SOURCE_BLOB: 9557192fc857a1fa05ef45803bddf863b44ddbe1
      Q21_TEST_BLOB: 1eb25d6c4c57ec8722941fb9e984eb75d97c894f
      PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact O67 proof world in one transaction
        shell: bash
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init -q
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --no-tags origin \
            "${PR_HEAD}" "${SEMANTIC_HEAD}" \
            "${O65R_SEMANTIC_HEAD}" "${O65R_PROOF_HEAD}" "${Q21_SEMANTIC_HEAD}"
          git checkout -q --detach "${PR_HEAD}"
          test "$(git rev-parse HEAD)" = "${PR_HEAD}"
          test ! -f .git/shallow

      - name: Authenticate O67 and exact parent semantic blobs
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git rev-parse "${SEMANTIC_HEAD}:tools/aura_proposal_support_lifecycle_lineage.py")" = "${SOURCE_BLOB}"
          test "$(git rev-parse "${SEMANTIC_HEAD}:tests/test_aura_proposal_support_lifecycle_lineage.py")" = "${TEST_BLOB}"
          test "$(git rev-parse HEAD:tools/aura_proposal_support_lifecycle_lineage.py)" = "${SOURCE_BLOB}"
          test "$(git rev-parse HEAD:tests/test_aura_proposal_support_lifecycle_lineage.py)" = "${TEST_BLOB}"
          test "$(git rev-parse "${O65R_SEMANTIC_HEAD}:tools/aura_authority_materialization_proposal_conformance.py")" = "${O65R_SOURCE_BLOB}"
          test "$(git rev-parse "${O65R_SEMANTIC_HEAD}:tests/test_aura_authority_materialization_proposal_conformance.py")" = "${O65R_TEST_BLOB}"
          test "$(git rev-parse "${Q21_SEMANTIC_HEAD}:tools/aura_pre_attempt_lifecycle_lineage.py")" = "${Q21_SOURCE_BLOB}"
          test "$(git rev-parse "${Q21_SEMANTIC_HEAD}:tests/test_aura_pre_attempt_lifecycle_lineage.py")" = "${Q21_TEST_BLOB}"
          git show "${O65R_SEMANTIC_HEAD}:tools/aura_authority_materialization_proposal_conformance.py" > /tmp/o65r_parent.py
          git show "${Q21_SEMANTIC_HEAD}:tools/aura_pre_attempt_lifecycle_lineage.py" > /tmp/q21_parent.py

      - name: Revalidate exact hosted O65-R and Q21 parent jobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          expected = [
              (int(os.environ['O65R_RUN']), int(os.environ['O65R_JOB']), os.environ['O65R_PROOF_HEAD'], os.environ['O65R_WORKFLOW']),
              (int(os.environ['Q21_RUN']), int(os.environ['Q21_JOB']), os.environ['Q21_SEMANTIC_HEAD'], os.environ['Q21_WORKFLOW']),
          ]

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          for run_id, job_id, head, workflow_name in expected:
              run = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
              assert run['head_sha'] == head, (run_id, run['head_sha'], head)
              assert run['name'] == workflow_name, (run_id, run['name'], workflow_name)
              assert run['status'] == 'completed' and run['conclusion'] == 'success', run
              jobs = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')['jobs']
              job = next(j for j in jobs if j['id'] == job_id)
              assert job['status'] == 'completed' and job['conclusion'] == 'success', job
              assert job['head_sha'] == head, (job_id, job['head_sha'], head)
              print(f'parent_exact_success run={run_id} job={job_id} head={head}')
          PY

      - name: Compile O67 and parent semantic surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python -m py_compile \
            tools/aura_proposal_support_lifecycle_lineage.py \
            tests/test_aura_proposal_support_lifecycle_lineage.py \
            /tmp/o65r_parent.py /tmp/q21_parent.py

      - name: Run O67 adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python -m unittest discover -s tests -p 'test_aura_proposal_support_lifecycle_lineage.py' -v

      - name: Execute both parents and prove exact support lineage
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          from dataclasses import asdict, replace
          import importlib.util
          import json
          import sys

          from tools import aura_proposal_support_lifecycle_lineage as o67

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              sys.modules[name] = mod
              spec.loader.exec_module(mod)
              return mod

          o65r = load('o65r_parent', '/tmp/o65r_parent.py')
          q21 = load('q21_parent', '/tmp/q21_parent.py')

          evidence = o65r.AuthorityScopedEvidenceProjection(
              proof_head=o65r.O64_PROOF_HEAD,
              semantic_head=o65r.O64_SEMANTIC_HEAD,
              run_id=o65r.O64_RUN,
              job_id=o65r.O64_JOB,
              workflow_name=o65r.O64_WORKFLOW,
              authority_fingerprint='1' * 64,
              admission_policy_fingerprint='2' * 64,
              evidence_admission_fingerprint='3' * 64,
              representation_fingerprint=o65r.q20_representation_fingerprint(),
              representation_family=o65r.Q20_REPRESENTATION_FAMILY,
              representation_digest=o65r.Q20_Q19_REPRESENTATION_IDENTITY,
              accounting_domain=o65r.Q20_ACCOUNTING_DOMAIN,
              accounting_contract_digest=o65r.q20_accounting_contract_digest(),
              rate_numerator=o65r.Q20_RATE_NUMERATOR,
              rate_denominator=o65r.Q20_RATE_DENOMINATOR,
              bounded_scope_digest=o65r.q20_scope_digest(),
              evidence_scope_digest=o65r.q20_scope_digest(),
              currentness_roots=('authority:o67', 'source:o67', 'policy:o67'),
              disposition='VERIFIED_BOUNDED',
              score_mass_eligible=True,
              proposal_mass_eligible=True,
          )
          support_result = o65r.prove_proposal_evidence_conformance(
              proposal=o65r.exact_q20_projection(), evidence=evidence
          )
          assert support_result.disposition == 'CONFORMANT_BOUNDED_SUPPORT'
          assert support_result.bounded_evidence_supports_exact_proposal is True
          assert support_result.live_proposal_currentness_resolved is False

          support = o67.BoundedProposalSupportProjection(
              schema=o65r.SCHEMA,
              semantic_head=o67.O65R_SEMANTIC_HEAD,
              proof_head=o67.O65R_PROOF_HEAD,
              run_id=o67.O65R_RUN,
              job_id=o67.O65R_JOB,
              workflow_name=o67.O65R_WORKFLOW,
              proposal_basis_digest=support_result.proposal_basis_digest,
              materialization_relation_digest=support_result.materialization_relation_digest,
              proposal_representation_fingerprint=support_result.proposal_representation_fingerprint,
              authority_fingerprint=support_result.authority_fingerprint,
              admission_policy_fingerprint=support_result.admission_policy_fingerprint,
              evidence_admission_fingerprint=support_result.evidence_admission_fingerprint,
              proposal_evidence_support_digest=support_result.proposal_evidence_support_digest,
              conformance_receipt_digest=support_result.receipt_digest,
              bounded_evidence_supports_exact_proposal=True,
          )

          o65_receipt = q21.example_o65()
          lifecycle_receipt = q21.example_lifecycle()
          o65_receipt['proposal_basis_digest'] = support_result.proposal_basis_digest
          lifecycle_receipt['proposal_basis_digest'] = support_result.proposal_basis_digest
          q21_result = q21.bind_pre_attempt_lifecycle(
              o65_receipt=o65_receipt, lifecycle_receipt=lifecycle_receipt
          )
          assert q21_result.lineage_association_bound is True
          assert q21_result.effect_boundary_revalidation_still_required is True
          assert q21_result.pre_attempt_caused_execution is False

          lineage = o67.PreAttemptLifecycleLineageProjection(
              schema=q21_result.schema,
              semantic_head=o67.Q21_SEMANTIC_HEAD,
              run_id=o67.Q21_RUN,
              job_id=o67.Q21_JOB,
              workflow_name=o67.Q21_WORKFLOW,
              proposal_id=q21_result.proposal_id,
              proposal_basis_digest=q21_result.proposal_basis_digest,
              pre_attempt_id=q21_result.pre_attempt_id,
              owner_state_epoch=q21_result.owner_state_epoch,
              pre_attempt_policy_generation=q21_result.pre_attempt_policy_generation,
              lifecycle_model_attempt_id=q21_result.lifecycle_model_attempt_id,
              lifecycle_model_output_digest=q21_result.lifecycle_model_output_digest,
              lifecycle_semantic_commit_key=q21_result.lifecycle_semantic_commit_key,
              lineage_digest=q21_result.lineage_digest,
              lineage_receipt_digest=q21_result.receipt_digest,
              proposal_identity_shared=q21_result.proposal_identity_shared,
              lineage_association_bound=q21_result.lineage_association_bound,
              effect_boundary_revalidation_still_required=q21_result.effect_boundary_revalidation_still_required,
          )

          result = o67.attach_bounded_support_to_lineage(support=support, lineage=lineage)
          assert result.disposition == 'EXACT_BOUNDED_SUPPORT_LINEAGE'
          assert result.bounded_support_attached_to_exact_lineage is True
          assert result.proposal_basis_digest == o67.Q20_MATERIALIZATION_BOUND_PROPOSAL_BASIS
          assert result.support_lineage_digest
          assert not any((
              result.live_proposal_currentness_resolved,
              result.host_consumption_or_causality_proven,
              result.lifecycle_terminality_reinterpreted,
              result.execution_authorized,
              result.provider_effect_authorized,
              result.semantic_k27_authority,
              result.native_private_transformer_kv_accessed,
              result.gate10_promoted,
              result.merge_deploy_spend_public_financial_human_effect_authorized,
          ))

          mismatch = o67.attach_bounded_support_to_lineage(
              support=support,
              lineage=replace(lineage, proposal_basis_digest='d' * 64),
          )
          assert mismatch.disposition == 'REVIEW'
          assert mismatch.support_lineage_digest is None

          receipt = {**asdict(result), 'receipt_digest': result.receipt_digest}
          with open('/tmp/o67-proof.json', 'w', encoding='utf-8') as handle:
              json.dump(receipt, handle, sort_keys=True, indent=2)
              handle.write('\n')
          print(json.dumps(receipt, sort_keys=True, indent=2))
          PY

      - name: Preserve O67 proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: o67-proposal-support-lifecycle-lineage-proof
          path: /tmp/o67-proof.json
          retention-days: 90

      - name: Consequence ceiling
        run: |
          echo 'BoundedProposalSupport!=LiveProposalCurrentness'
          echo 'SupportAttachedToLineage!=HostConsumptionOrCausality'
          echo 'LifecycleLineage!=LifecycleTerminalityReinterpretation'
          echo 'ProposalBasisEqualityIsRequiredForSupportAttachment'
          echo 'K27Coordinate!=SupportTruth!=LineageAuthority'
          echo 'NoExecutionEffectNativeKVGate10MergeDeployAuthority=true'
