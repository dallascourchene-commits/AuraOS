name: P2.1 Planning Board contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: p2-1-planning-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-planning-board:
    name: Planning Board contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile Planning Board contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            tests/test_aura_planning_board.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_planning_board.py \
            tests/test_aura_planning_board.py
      - name: Run focused Planning Board regressions
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_planning_board.py

  apply-review-fixes:
    name: Apply analyzed review fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/planning-board-p2-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planning-board-p2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for CODEMAP synchronization
        run: sleep 75
      - name: Refresh exact branch head
        run: |
          git fetch origin refactor/planning-board-p2-1
          git reset --hard origin/refactor/planning-board-p2-1
      - name: Apply analyzed review fixes
        run: |
          test -f scripts/p2_1_apply_review_fixes.py
          python scripts/p2_1_apply_review_fixes.py
      - name: Validate review fixes
        run: |
          python -m pip install pytest ruff
          python -m py_compile aura_planning_board.py tests/test_aura_planning_board.py
          ruff check --select E9,F63,F7,F82 aura_planning_board.py tests/test_aura_planning_board.py
          python -m pytest -q tests/test_aura_event_contracts.py tests/test_aura_planning_board.py
      - name: Commit reviewed code only
        run: |
          git config user.name "AuraOS Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_planning_board.py tests/test_aura_planning_board.py
          git commit -m "fix(planning): preserve GOAP membership and constraint evidence"
          git fetch origin refactor/planning-board-p2-1
          git rebase origin/refactor/planning-board-p2-1
          git push origin HEAD:refactor/planning-board-p2-1
