name: P2.1 Planning Board contracts

on:
  pull_request:
  push:
    branches:
      - refactor/planning-board-p2-1
    paths:
      - .github/workflows/p2-1-planning-board-contracts.yml

permissions:
  contents: write

concurrency:
  group: p2-1-planning-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-planning-board:
    name: Planning Board contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile Planning Board contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            tests/test_aura_planning_board.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_planning_board.py \
            tests/test_aura_planning_board.py
      - name: Run focused Planning Board regressions
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_planning_board.py

  apply-continuity-hardening:
    name: Apply bounded continuity hardening
    if: github.event_name == 'push' && github.ref_name == 'refactor/planning-board-p2-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planning-board-p2-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for concurrent CODEMAP synchronization
        run: sleep 90
      - name: Refresh exact branch head
        run: |
          git fetch origin refactor/planning-board-p2-1
          git reset --hard origin/refactor/planning-board-p2-1
      - name: Apply reviewed hardening patch
        run: |
          test -f scripts/p2_1_hardening.patch
          test -f scripts/p2_1_clean_workflow.yml
          git apply --check scripts/p2_1_hardening.patch
          git apply scripts/p2_1_hardening.patch
      - name: Validate hardened contracts
        run: |
          python -m pip install pytest ruff
          python -m py_compile aura_planning_board.py tests/test_aura_planning_board.py
          ruff check --select E9,F63,F7,F82 aura_planning_board.py tests/test_aura_planning_board.py
          python -m pytest -q tests/test_aura_event_contracts.py tests/test_aura_planning_board.py
      - name: Restore clean workflow and remove temporary files
        run: |
          cp scripts/p2_1_clean_workflow.yml .github/workflows/p2-1-planning-board-contracts.yml
          rm scripts/p2_1_clean_workflow.yml
          rm scripts/p2_1_hardening.patch
          rm .github/workflows/p2-1-finalize-hardening.yml
      - name: Commit hardened contracts
        run: |
          git config user.name "AuraOS Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(planning): bind continuity evidence to exact actions"
          git pull --rebase origin refactor/planning-board-p2-1
          git push origin HEAD:refactor/planning-board-p2-1
