name: AURA-ADOPT ZF-10 Adoption Economics

on:
  pull_request:
    paths:
      - 'tools/aura_adopt/adoption_economics.py'
      - 'tools/aura_adopt/test_adoption_economics.py'
      - 'schemas/adoption_economics_receipt_v1.schema.json'
      - '.github/workflows/aura-adopt-zf10-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zf10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Compile economics contract
        run: python -m py_compile tools/aura_adopt/adoption_economics.py tools/aura_adopt/test_adoption_economics.py
      - name: Run economics and schema regressions
        run: python -m unittest -v tools.aura_adopt.test_adoption_economics
      - name: Validate Draft 2020-12 schema
        run: python -c "import json; from jsonschema import Draft202012Validator; s=json.load(open('schemas/adoption_economics_receipt_v1.schema.json', encoding='utf-8')); Draft202012Validator.check_schema(s)"
