name: K27 ASTGE Immutable Generation Store

on:
  pull_request:
    paths:
      - 'crates/aura-k27-astge/**'
      - '.github/workflows/k27-astge-generation-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-store:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Verify generation publication contract
        run: |
          rustc --version
          cargo --version
          cargo test --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets -- -D warnings
          echo 'K27_ASTGE_IMMUTABLE_GENERATION_STORE_EXECUTED=true'
          echo 'INTERRUPTED_PUBLICATION_ISOLATION_PROVEN=true'
          echo 'COMMITTED_CORRUPTION_FAIL_CLOSED=true'
          echo 'IN_PLACE_COMMITTED_FILE_MUTATION_ALLOWED=false'
          echo 'MMAP_QUERY_PROVEN=false'
          echo 'POWER_LOSS_HARDWARE_PROVEN=false'
          echo 'MULTI_WRITER_CONCURRENCY_PROVEN=false'
          echo 'PERFORMANCE_SUPERIORITY_PROVEN=false'
          echo 'AURAOS_RUNTIME_INTEGRATION_PROVEN=false'
