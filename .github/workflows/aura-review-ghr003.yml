name: Aura Review GHR-003 QDKT Cache

on:
  pull_request:
    paths:
      - 'tools/aura_review/aura_review_cache_policy.py'
      - 'tools/aura_review/test_aura_review_cache_policy.py'
      - '.github/workflows/aura-review-ghr003.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdkt-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile focused source
        run: python -m py_compile tools/aura_review/aura_review_cache_policy.py tools/aura_review/test_aura_review_cache_policy.py
      - name: Run focused regressions
        run: python -m unittest tools.aura_review.test_aura_review_cache_policy
