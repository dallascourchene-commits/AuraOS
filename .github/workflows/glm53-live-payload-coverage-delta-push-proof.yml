name: GLM53 Live Payload Coverage Delta Push Proof

on:
  push:
    branches:
      - arena/glm53-q11-partial-live-payload-coverage-delta-gpt56sol-20260831

permissions:
  contents: read
  actions: read

jobs:
  q11-push-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Q11 branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Revalidate exact parent generations and convergence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          CONVERGENCE=2943d00059247b86696df1899d5d7878be81008f
          PR650=e8e0eecb5fce9f95bf1b71e97b528776ecd8b51c
          PR649=aa004558af8c46bb9bedeedad3cbd2e4e212ab17
          git fetch --no-tags origin "$CONVERGENCE" "$PR650" "$PR649"
          test "$(git rev-list --parents -n 1 "$CONVERGENCE")" = "$CONVERGENCE $PR650 $PR649"
          python3 - <<'PY'
          import json, os, urllib.request
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          for run_id, head in ((33374008643,'e8e0eecb5fce9f95bf1b71e97b528776ecd8b51c'),(33373165058,'aa004558af8c46bb9bedeedad3cbd2e4e212ab17')):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{run_id}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  run=json.load(response)
              assert run['status']=='completed' and run['conclusion']=='success', (run_id,run['status'],run['conclusion'])
              assert run['head_sha']==head, (run_id,run['head_sha'],head)
          print('Q11_PUSH_PROOF_PARENTS_GREEN=true')
          PY

      - name: Run Q11 adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/quantization/aura_glm53_live_official_tensor_payload_canary.py tools/quantization/aura_glm53_live_payload_coverage_delta.py tests/test_aura_glm53_live_payload_coverage_delta.py
          python3 -m unittest -v tools.quantization.test_aura_glm53_live_official_tensor_payload_canary tests.test_aura_glm53_live_payload_coverage_delta
          PYTHONPATH=. python3 -m tools.quantization.aura_glm53_live_payload_coverage_delta | tee /tmp/q11.json

      - name: Reobserve exact gate payload pair and prove delta
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m tools.quantization.aura_glm53_live_official_tensor_payload_canary > /tmp/q11-live.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/q11.json',encoding='utf-8'))
          live=json.load(open('/tmp/q11-live.json',encoding='utf-8'))
          assert live['weight_payload_sha256']==d['live_gate_weight_sha256']=='2d4e5f36478b598043431b3691ce6a48639e01b6f804b1db62ca4af4d14063e8'
          assert live['scale_payload_sha256']==d['live_gate_scale_sha256']=='671dd3b32b3f4cc651b93f3420ae47957ae09c1f745d278c0795d56e5d511c55'
          assert d['observed_slice_count']==2 and d['remaining_slice_count']==4 and d['total_slice_count']==6
          assert d['observed_payload_bytes']==12_585_984
          assert d['remaining_payload_bytes']==25_171_968
          assert d['total_representative_payload_bytes']==37_757_952
          assert d['full_representative_expert_payload_observed'] is False
          assert d['payload_coverage_complete'] is False
          for key in ('block_fp8_dequantization_semantics_bound','exact_official_tensor_to_concrete_source_tensor_set_relation','candidate_page_materialization_owner_bound','real_tensor_quantization_eligible','semantic_k27_authority','native_private_transformer_kv_accessed','gate10_promoted','deployment_authorized'):
              assert d[key] is False,key
          print('Q11_PUSH_PROOF_PARTIAL_DELTA_GREEN=true')
          PY