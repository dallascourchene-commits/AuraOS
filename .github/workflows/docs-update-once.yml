name: One-time canonical documentation update

on:
  push:
    branches:
      - docs/human-agent-observatory-crucible

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/human-agent-observatory-crucible

      - name: Update canonical documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_block(path: str, start: str, end: str, body: str, *, before: str | None = None) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              block = f"{start}\n{dedent(body).strip()}\n{end}"
              if start in text and end in text:
                  prefix, remainder = text.split(start, 1)
                  _, suffix = remainder.split(end, 1)
                  text = prefix.rstrip() + "\n\n" + block + suffix
              elif before and before in text:
                  text = text.replace(before, block + "\n\n" + before, 1)
              else:
                  raise RuntimeError(f"anchor not found for {path}: {before!r}")
              target.write_text(text, encoding="utf-8")

          def ensure_after(path: str, anchor: str, additions: list[str]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              missing = [line for line in additions if line not in text]
              if missing:
                  text = text.replace(anchor, anchor + "".join(line + "\n" for line in missing), 1)
                  target.write_text(text, encoding="utf-8")

          ensure_after(
              "README.md",
              "- [What Aura Does](#what-aura-does)\n",
              [
                  "- [Governed Human-Agent Learning Loop](#governed-human-agent-learning-loop)",
                  "- [Benchmark Evidence Dashboard](#benchmark-evidence-dashboard)",
              ],
          )

          replace_block(
              "README.md",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:END -->",
              '''
              ## Governed Human-Agent Learning Loop

              Aura separates **understanding**, **governed execution**, and **learning** so evidence cannot silently become authority.

              | Surface | Role | Authority boundary |
              |---|---|---|
              | **Aura Observatory** | Explains how an intention was parsed, routed, localized, compressed, and bounded | Review-only; it does not stage changes, run workers, mutate production, or grant permission |
              | **Human Agent Arena** | Human/Aura/agent command centre for `FRAME → GROUND → PLAN → ACT → PROVE → DECIDE` | Actions pass guarded WFST admission; exact spans, hashes, tests, verifiers, leases, and human approval remain authoritative |
              | **Emergent Refactor Workspace** | Imports and searches emergent findings, preserves provenance, gathers bounded arXiv/GitHub evidence, and compiles reviewable refactor packets | Findings and research are evidence inputs only; unresolved selections fail closed and context is committed only after guarded admission |
              | **Learning Arena / Crucible** | Mines complete verified `ArenaExperience` records and proposes empirical-uncertainty updates | TRAIN/VALIDATION/SHADOW separation; proposal-only crystallization; no automatic grammar, policy, code, commit, push, PR, or merge authority |

              ```text
              ordinary human intention
                → Aura Observatory
                → bounded Human Agent task
                → governed execution
                → verifier evidence
                → OutcomeVector
                → ArenaExperience V3
                → Learning Arena / Crucible
                → TRAIN / VALIDATION / SHADOW
                → CRYSTALLIZATION_PROPOSED
                → verifier and human review
              ```

              The emergent-research surface adds content-addressed run/evidence storage, exact seed provenance verification, bounded public research, normalized tool-run records, and a local UI for selecting findings and research evidence. It does **not** bypass the Arena lifecycle or promote hypotheses into production authority.

              See [`docs/AURA_HUMAN_AGENT_ARENA.md`](docs/AURA_HUMAN_AGENT_ARENA.md) and [`docs/AURA_OBSERVATORY_CRUCIBLE_HANDOFF.md`](docs/AURA_OBSERVATORY_CRUCIBLE_HANDOFF.md).

              ## Benchmark Evidence Dashboard

              Read the evidence by class. Executable gate results are stronger than deterministic token proxies; deterministic proxies are stronger than structural projections; discovery scans identify opportunities but do not prove implementation quality.

              | Evidence class | Comparison or scope | Result | Status / claim boundary |
              |---|---|---|---|
              | **Context localization fixture** | Broad context `131,655` vs Aura slice `14,431` total-token proxy | **89.04% lower** total proxy; quality `0.9550 → 0.9607` (`+0.0057`) | Deterministic fixture proxy; not provider billing |
              | **Selective Council V3 + Surgeon** | Council V2 `18` calls / `158,545` total proxy vs V3 `12` calls / `106,494` | **33.33% fewer calls**, **32.83% lower** total proxy, same selected plan, patch digest, and accepted quality | Controlled executable fixture |
              | **Executable cross-module fixture** | V3 visible `3/3`, hidden `3/3`, regression `2/2` | `WORKING`, `ACCEPTED`; observed `100.00`, benchmark `97.50` | Required API, scope, security, compilation, and static-analysis gates passed |
              | **Real AuraOS refactor trial** | Visible/property `32/32`, review-derived `35/35`, focused regression `21/21` | `WORKING`, `ACCEPTED`; observed `100.00`, benchmark `93.50` | Real branch trial; frozen assisted planning artifacts, not blinded independent providers |
              | **State Ledger continuity** | Step-7 ledger `234` vs full history `6,140` proxy tokens | **96.19% less context**, state preservation `1.0000`, drift `0.0000` | Synthetic multi-step continuity test |
              | **Emergent capacity scan** | `708` Python files, `10,815` topology nodes, `20,764` edges, `15` probes | `0` probe failures; strongest recurring missing wire appeared `5` times | Discovery evidence only; recurrence is not patch correctness |
              | **Grounded new-capacity projections** | `7` capacity probes | `0` probe failures, but all candidates remained `NEEDS_GROUNDING` | No production-readiness or code-quality claim |
              | **Shared grounding evidence projection** | Proposed PR #138 head `15bea1a`: repeated evidence `2,004` vs shared evidence `938` token proxy | `1,066` proxy tokens avoided; **53.1936% projected savings** | `ESTIMATED` / `PROJECTED_STRUCTURAL_TOKEN_PROXY`; proposed-branch evidence, not provider billing or a merged-main implementation claim |

              Detailed benchmark sections below preserve the full methods, gates, and limitations rather than collapsing unlike evidence into one score.
              ''',
              before="## Architect Benchmark Prompt",
          )

          guide = Path("USER_GUIDE.md")
          guide_text = guide.read_text(encoding="utf-8").replace(
              "**Operator documentation audit:** June 14–July 16, 2026 (through draft PR #131)",
              "**Operator documentation audit:** June 14–July 16, 2026 (through merged PR #133 and the canonical Human Agent documentation sync)",
          )
          guide.write_text(guide_text, encoding="utf-8")

          replace_block(
              "USER_GUIDE.md",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:END -->",
              '''
              ### 10.5 Governed Human Agent lifecycle

              The workflow is phase-gated rather than a free-form agent loop:

              ```text
              FRAME → GROUND → PLAN → ACT → PROVE → DECIDE
              ```

              A route may inspect or preview evidence before admission, but workflow evidence is committed only after the guarded action or command succeeds. A denied operation must not mutate the active workflow. Visual topology, VSA resonance, JSpace, ST3GG, summaries, and emergent hypotheses remain advisory.

              ### 10.6 Emergent Refactor Workspace

              The Human Agent Arena includes a local evidence workspace for studying and applying Aura's stored emergent-property reports. It can:

              - import exact report objects and preserve source metadata;
              - list stored runs and inspect individual findings;
              - search findings by objective and status;
              - store content-addressed research evidence;
              - search bounded official arXiv and GitHub APIs for missing evidence;
              - attach selected finding IDs and research-evidence IDs to a refactor packet;
              - register special tool executions in the normal Human Agent tool-run ledger;
              - expose the compiled packet to the guarded workflow only after admission.

              The committed seed run under `Aura_Memory/emergent_results/seed_runs/2026-07-16/` is validated against `provenance.jsonl`; byte-size or SHA-256 mismatches fail verification. Stored files are authoritative over secondary JSONL indexes, which are reconciled to recover interrupted writes.

              ```text
              GET  /api/human-agent/emergent/runs
              GET  /api/human-agent/emergent/runs/{run_id}
              GET  /api/human-agent/emergent/search?q=...
              GET  /api/human-agent/emergent/findings/{finding_id}
              POST /api/human-agent/emergent/import
              POST /api/human-agent/emergent/refactor-packet

              POST /api/human-agent/research/search
              GET  /api/human-agent/research/evidence
              GET  /api/human-agent/research/evidence/{evidence_id}
              ```

              Research metadata is not automatically patch evidence. Optional PDF/README sidecars are explicitly untrusted text, network operations have bounded deadlines, and rendered links allow only HTTP/HTTPS schemes.

              ### 10.7 Observatory handoff and Crucible boundary

              The Observatory is an explanation and review surface. Its Human Agent handoff clears stale showcase evidence and carries only bounded observable facts: objective, exact localized files/symbols, source spans and hashes, focused tests, route decisions, compressed context, and selected topology identifiers.

              ```text
              POST /api/showcase/observatory/handoff/human
              POST /api/showcase/observatory/handoff/learning
              ```

              The learning handoff is deliberately pre-experience:

              ```yaml
              status: AWAITING_VERIFIED_EXPERIENCE
              eligible_for_crucible: false
              ```

              Crucible eligibility begins only after governed execution produces verifier evidence, an `OutcomeVector`, and a complete sanitized `ArenaExperience V3`. The Crucible separates TRAIN, VALIDATION, and SHADOW records and may create only `CRYSTALLIZATION_PROPOSED` packets for verifier and human review.

              The allowed learned surface is limited to `soft_weight_profile.empirical_uncertainty`. It cannot alter hard guards, states, transitions, capabilities, risk classes, verifier requirements, source code, or active grammar manifests, and it cannot automatically commit, push, open a pull request, or merge.
              ''',
              before="---\n\n## 11. Ephemeral Organ Runtime",
          )

          replace_block(
              "USER_GUIDE.md",
              "<!-- AURA_BENCHMARK_DASHBOARD:START -->",
              "<!-- AURA_BENCHMARK_DASHBOARD:END -->",
              '''
              ### 15.4 Organized benchmark dashboard

              Do not combine unlike evidence into one headline score. Use this order:

              1. executable gate results;
              2. deterministic comparative token proxies;
              3. estimated structural projections;
              4. discovery and capacity-projection scans.

              | Benchmark | Key result | Evidence class |
              |---|---|---|
              | Context localization | `131,655 → 14,431` total proxy; **89.04% lower**; quality `+0.0057` | Deterministic comparative fixture |
              | Selective Council V3 | `18 → 12` calls; `158,545 → 106,494` total proxy; **32.83% lower**, same accepted patch/quality | Controlled executable fixture |
              | Executable cross-module patch | visible `3/3`, hidden `3/3`, regression `2/2`; observed `100.00`, benchmark `97.50` | Executable gate evidence |
              | Real AuraOS refactor | `32/32`, `35/35`, `21/21`; observed `100.00`, benchmark `93.50` | Real branch gate evidence |
              | State Ledger | step 7 `234` vs `6,140`; **96.19% less context**, preservation `1.0000`, drift `0.0000` | Synthetic continuity fixture |
              | Emergent capacity scan | `708` Python files, `10,815` nodes, `20,764` edges, `15` probes, `0` failures | Discovery evidence |
              | Grounded capacity projections | `7` probes, `0` failures; every candidate still `NEEDS_GROUNDING` | Projection, not implementation proof |
              | Shared grounding evidence (PR #138) | `2,004 → 938` proxy; **53.1936% projected savings** | `ESTIMATED`; proposed branch, not provider billing |

              The structural shared-evidence result compares the serialized phase-capsule output against a counterfactual that repeats the same grounding evidence in all nine capsules. It does not measure provider prompts, inference latency, or invoices. Keep it `SAVINGS_PROVISIONAL` until governed executions supply comparable quality and usage records.
              ''',
              before="---\n\n## 16. Common Workflows",
          )

          architecture = Path(".aura/ARCHITECTURE.md")
          architecture_text = architecture.read_text(encoding="utf-8").replace(
              "**Architecture audit:** June 14–July 16, 2026 (through draft PR #131)",
              "**Architecture audit:** June 14–July 16, 2026 (through merged PR #133 and the canonical Human Agent documentation sync)",
          )
          architecture.write_text(architecture_text, encoding="utf-8")

          replace_block(
              ".aura/ARCHITECTURE.md",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->",
              "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:END -->",
              '''
              ## 1C. Human Agent, Observatory, Emergent Evidence, and Crucible

              Aura uses four connected but non-collapsible surfaces:

              ```text
              OBSERVATORY (explain and bound)
                → HUMAN AGENT ARENA (admit and execute)
                → EXPERIENCE LEDGER (record verified outcome)
                → CRUCIBLE (mine and propose)
              ```

              | Surface | Inputs | Outputs | Forbidden authority |
              |---|---|---|---|
              | Observatory | intention, six-slot packet, route decision, exact localization, bounded topology/context | review trace and bounded handoff | execution, staging, mutation, permission, learning eligibility |
              | Human Agent Arena | human command, exact evidence, selected findings/research, capability and lifecycle state | guarded workflow state, staged/verified work, tool-run records, `ArenaExperience` lineage | bypassing WFST admission or treating visuals/semantic matches as patch authority |
              | Emergent Refactor Workspace | imported reports, seed provenance, objective search, bounded public research | content-addressed findings/evidence and reviewable refactor packets | silent evidence dropping, unbounded network work, pre-admission workflow mutation |
              | Crucible | complete sanitized `ArenaExperience V3`, verifier evidence, `OutcomeVector`, current grammar digest | TRAIN/VALIDATION/SHADOW evaluation and `CRYSTALLIZATION_PROPOSED` packets | hard-guard changes, source mutation, active grammar promotion, automatic deployment |

              ```text
              ordinary intention
                → Observatory trace
                → bounded Human Agent handoff
                → FRAME → GROUND → PLAN → ACT → PROVE → DECIDE
                → verifier evidence + OutcomeVector
                → ArenaExperience V3
                → Crucible TRAIN / VALIDATION / SHADOW
                → CRYSTALLIZATION_PROPOSED
                → verifier and human review
              ```

              The emergent workspace is a grounding aid inside this lineage, not a parallel authority channel. Exact seed artifacts are provenance-checked; content identities exclude volatile timestamps; files under the run/research stores are authoritative over recoverable indexes; missing requested finding or evidence IDs fail closed; and special executions are normalized into the Human Agent tool-run registry.

              The Observatory-to-learning adapter always begins with `eligible_for_crucible: false`. Only a subsequent governed, verified experience can cross that boundary.

              ### Benchmark evidence hierarchy

              | Tier | Evidence | Current examples |
              |---:|---|---|
              | 1 | Executable gates with retained failures and quality | V3 fixture `3/3 + 3/3 + 2/2`; real refactor `32/32 + 35/35 + 21/21` |
              | 2 | Deterministic comparative proxies | Aura slices `89.04%` lower total proxy; V3 `32.83%` lower than Council V2; State Ledger `96.19%` less context at step 7 |
              | 3 | Estimated structural projections | Shared grounding evidence `53.1936%` projected reduction on proposed PR #138 head `15bea1a` |
              | 4 | Discovery/projection scans | Emergent scan `708` Python files, `10,815` nodes, `20,764` edges, `15` probes; seven capacity projections remained `NEEDS_GROUNDING` |

              Tier 3 and Tier 4 evidence cannot be promoted into Tier 1 claims without governed execution, comparable quality evidence, and verifier review.

              ```yaml
              patch_authority: exact_source_spans_and_hashes_only
              vsa_patch_authority: false
              visual_topology_patch_authority: false
              research_metadata_patch_authority: false
              learned_weight_patch_authority: false
              crystallization_patch_authority: false
              active_grammar_mutation: false
              automatic_grammar_promotion: false
              automatic_commit: false
              automatic_push: false
              automatic_pull_request: false
              automatic_merge: false
              ```
              ''',
              before="## 2. Truth and Authority Model",
          )

          for path, marker in [
              ("README.md", "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->"),
              ("USER_GUIDE.md", "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->"),
              ("USER_GUIDE.md", "<!-- AURA_BENCHMARK_DASHBOARD:START -->"),
              (".aura/ARCHITECTURE.md", "<!-- AURA_HUMAN_OBSERVATORY_CRUCIBLE:START -->"),
          ]:
              if Path(path).read_text(encoding="utf-8").count(marker) != 1:
                  raise RuntimeError(f"documentation marker validation failed: {path} {marker}")

          Path(".github/workflows/docs-update-once.yml").unlink()
          PY

      - name: Refresh CODEMAP after documentation changes
        shell: bash
        run: python3 aura_codebase_navigator.py

      - name: Validate and commit documentation update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md USER_GUIDE.md .aura/ARCHITECTURE.md .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json .github/workflows/docs-update-once.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: document governed learning loop and benchmarks"
          git push origin HEAD:docs/human-agent-observatory-crucible
