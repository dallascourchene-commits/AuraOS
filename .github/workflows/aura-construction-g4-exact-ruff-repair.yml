name: Aura Construction G4-G5 Exact Ruff Repair

on:
  push:
    branches:
      - work/construction-arena-g4-g6-continuation-20260722
    paths:
      - ".github/workflows/aura-construction-g4-exact-ruff-repair.yml"
      - "aura_construction_demo_fixture.py"
      - "aura_construction_demo_fixture_builder.py"
      - "aura_construction_demo_projection.py"
      - "tests/test_aura_construction_demo_fixture.py"
      - "tests/test_aura_construction_demo_projection.py"

permissions:
  contents: write

concurrency:
  group: aura-construction-g4-g5-exact-ruff-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone exact branch
        env:
          HEAD_REF: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth=16 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply one safe Ruff repair commit per owner
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check ruff
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          repair_owner() {
            file="$1"
            message="$2"
            ruff check --fix --unsafe-fixes=false "$file"
            ruff check "$file"
            if ! git diff --quiet -- "$file"; then
              changed="$(git diff --name-only)"
              test "$changed" = "$file"
              git add "$file"
              git commit -m "$message"
            fi
          }

          repair_owner aura_construction_demo_fixture.py \
            "style(construction): lint G4 fixture contracts"
          repair_owner aura_construction_demo_fixture_builder.py \
            "style(construction): lint G4 fixture builder"
          repair_owner aura_construction_demo_projection.py \
            "style(spatial): lint G5 Construction projection"
          repair_owner tests/test_aura_construction_demo_fixture.py \
            "style(construction): lint G4 fixture tests"
          repair_owner tests/test_aura_construction_demo_projection.py \
            "style(spatial): lint G5 projection tests"

          ruff check \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py
          test -z "$(git status --short)"

      - name: Push exact repair commits
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"; then
            echo "No repair required."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
