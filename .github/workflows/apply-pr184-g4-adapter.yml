name: Apply PR184 G4 Adapter

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - ".aura/pr184-g4-adapter/READY"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pr184-g4-adapter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-real-asset-pack-g4-20260722
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Authenticate and extract exact G4 payload
        env:
          EXPECTED_ARCHIVE_SHA256: 7757d0c3ed63f9e581e6502dc7fb213735384f5e1fc35ca58866f3c437ea9556
        run: |
          set -euo pipefail
          root=.aura/pr184-g4-adapter
          test -f "${root}/READY"
          expected_names='chunk00
chunk01
chunk02
chunk03
READY'
          test "$(find "${root}" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' "${expected_names}" | sort)"
          echo 'd137f0addfd1737714af3dc3742d7b3a00aa36104305fa784ec5d335d0284bc3  .aura/pr184-g4-adapter/chunk00' | sha256sum --check --strict
          echo 'b49cb1a06b6ff4b1342b12fe0fae0ac17c10999bfca3318db8f62f37e59c13e2  .aura/pr184-g4-adapter/chunk01' | sha256sum --check --strict
          echo '8840b571f7b79df3e3e1b3012a2ca0ec7f3cefb4ffbe5c5b397e310e42696923  .aura/pr184-g4-adapter/chunk02' | sha256sum --check --strict
          echo '7e7996673dc0db12b955aeb906812e10d9de76ea53428f7cb542c2b99efd1787  .aura/pr184-g4-adapter/chunk03' | sha256sum --check --strict
          cat "${root}"/chunk0{0,1,2,3} | base64 --decode > "${RUNNER_TEMP}/pr184-g4-adapter.tar.gz"
          echo "${EXPECTED_ARCHIVE_SHA256}  ${RUNNER_TEMP}/pr184-g4-adapter.tar.gz" | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          archive = Path("${RUNNER_TEMP}/pr184-g4-adapter.tar.gz")
          allowed = {
              "aura_construction_demo_contracts.py",
              "aura_construction_demo_asset_pack.py",
              "tests/test_aura_construction_demo_contracts.py",
              "tests/test_aura_construction_demo_asset_pack.py",
          }
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              names = {member.name for member in members}
              if names != allowed:
                  raise SystemExit(f"payload allowlist mismatch: {sorted(names)}")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or any(part in {"", ".", ".."} for part in path.parts):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular payload member: {member.name}")
              handle.extractall(".", filter="data")
          PY

      - name: Install bounded test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest "numpy>=1.26.4,<3.0" "trimesh>=4.7.1,<5.0" "zstandard==0.25.0"

      - name: Compile and run full Construction resolver gate
        run: |
          set -euo pipefail
          python -m compileall -q \
            aura_construction_demo_contracts.py \
            aura_construction_demo_asset_pack.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_ifc_storey_index.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            scripts/aura_verify_construction_demo_assets.py
          tests=(
            tests/test_aura_construction_demo_contracts.py
            tests/test_aura_construction_demo_asset_pack.py
            tests/test_aura_fetch_construction_demo_source.py
            tests/test_aura_ifc_storey_index.py
            tests/test_aura_verify_construction_demo_assets.py
            tests/test_aura_mesh_to_gaussian.py
            tests/test_aura_prepare_construction_demo_assets.py
            tests/test_aura_spatial_asset_resolver.py
            tests/test_aura_spatial_s6_construction.py
            tests/test_aura_capability_resolver.py
          )
          existing=()
          for path in "${tests[@]}"; do
            test -f "${path}" && existing+=("${path}")
          done
          python -m pytest -q "${existing[@]}"

      - name: Commit validated G4 adapter and remove transport
        run: |
          set -euo pipefail
          rm -rf .aura/pr184-g4-adapter
          rm -f .github/workflows/apply-pr184-g4-adapter.yml
          git config user.name "AuraOS Construction G4 Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_construction_demo_contracts.py \
            aura_construction_demo_asset_pack.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_asset_pack.py \
            .aura/pr184-g4-adapter \
            .github/workflows/apply-pr184-g4-adapter.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(construction): assemble runtime-admitted G4 asset pack"
          git push origin HEAD:work/construction-arena-real-asset-pack-g4-20260722
