name: Aura WorkCapsule Portable Higher-Owner Closed Lifecycle

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'tests/test_aura_workcapsule_post_repair_source_projection_continuity.py'
      - 'scripts/aura_workcapsule_portable_higher_owner_closed_lifecycle.py'
      - 'tests/test_aura_workcapsule_portable_higher_owner_closed_lifecycle.py'
      - '.github/workflows/aura-workcapsule-portable-higher-owner-closed-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-higher-owner-closed-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR541_SHA: 12e9d4ad114faa08230cbbffc2f8bea40e0a2bfe
    steps:
      - name: Fetch exact child head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR539 POST source-instance continuity owner
        run: |
          python3 -m py_compile scripts/aura_workcapsule_post_repair_source_projection_continuity.py
          python3 -m unittest -v tests.test_aura_workcapsule_post_repair_source_projection_continuity

      - name: Fetch PR541 exact second parent into isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pr541
          git -C /tmp/pr541 init .
          git -C /tmp/pr541 remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C /tmp/pr541 -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR541_SHA"
          unset AUTH_HEADER GH_TOKEN
          git -C /tmp/pr541 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/pr541 rev-parse HEAD)" = "$PR541_SHA"
          test -z "$(git -C /tmp/pr541 config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR541 reduced owner chain and nested projection
        run: |
          for manifest in \
            /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-owner-reduction/Cargo.toml \
            /tmp/pr541/crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml \
            /tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/Cargo.toml
          do
            cargo fmt --check --manifest-path "$manifest"
            cargo test --manifest-path "$manifest" --all-targets
            cargo test --manifest-path "$manifest" --doc
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done

      - name: Prove stable PR541 cross-runtime owner-chain schema agreement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rust = Path('/tmp/pr541/crates/aura-k27-astge-canonical-higher-owner-portable-projection/src/lib.rs').read_text()
          py = Path('scripts/aura_workcapsule_portable_higher_owner_closed_lifecycle.py').read_text()
          required = [
              'AURA_ASTGE_CANONICAL_HIGHER_OWNER_OWNER_CHAIN_PROJECTION_V1',
              'AURA_SERDE_JSON_STRUCT_ORDER_COMPACT_V1',
              'canonical_target_projection',
              'continuous_semantic_handle_digest_hex',
              'outer_constructor_reproved_by_inner_owner',
              'one_canonical_post_edit_consequence',
              'higher_owner_semantic_handle_continuity_proven',
              'producer_authenticated',
              'semantic_patch_correctness_proven',
              'commit_authorized',
          ]
          for token in required:
              assert token in rust, token
              assert token in py, token
          assert 'producer_authenticated: false' in rust
          assert 'caller_lower_astge_projection_accepted": False' in py
          print('PR541_SECOND_PARENT_EXECUTED_AT_EXACT_SHA=true')
          print('PR541_SCHEMA_MATCHED_ACROSS_RUNTIME=true')
          print('OUTER_CHAIN_IS_SOLE_ASTGE_TRANSPORT_INPUT=true')
          print('PROJECTION_PRODUCER_AUTHENTICATED=false')
          PY

      - name: Prove portable higher-owner chain inside exact POST-CLOSED lifecycle
        run: |
          python3 -m py_compile scripts/aura_workcapsule_portable_higher_owner_closed_lifecycle.py
          python3 -m unittest -v tests.test_aura_workcapsule_portable_higher_owner_closed_lifecycle

      - name: Assert no second lower projection or lower-owner escape hatch
        run: |
          python3 - <<'PY'
          import inspect
          from pathlib import Path
          from scripts.aura_workcapsule_portable_higher_owner_closed_lifecycle import verify_portable_higher_owner_chain_inside_closed_lifecycle
          params = inspect.signature(verify_portable_higher_owner_chain_inside_closed_lifecycle).parameters
          assert 'portable_owner_chain_projection' in params
          for forbidden in ('astge_projection', 'canonical_target_projection', 'candidate_binding', 'source_observation_receipt', 'projection_owner_receipt'):
              assert forbidden not in params, forbidden
          source = Path('scripts/aura_workcapsule_portable_higher_owner_closed_lifecycle.py').read_text()
          assert 'verify_post_repair_source_projection_continuity' in source
          assert 'admit_post_repair_source_projection_continuity' in source
          for forbidden in ('compile_source_reentry_observations', 'derive_post_reentry_candidate', 'compile_observation_bound_reentry_closure'):
              assert forbidden not in source, forbidden
          print('CALLER_SECOND_LOWER_PROJECTION_ACCEPTED=false')
          print('LOWER_WORKCAPSULE_REPLAY_REIMPLEMENTED_BY_CHILD=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'PORTABLE_HIGHER_OWNER_CHAIN_INSIDE_POST_CLOSED_LIFECYCLE=true'
          echo 'SAME_NESTED_PROJECTION_USED_BY_LIFECYCLE=true'
          echo 'CONTINUOUS_HIGHER_OWNER_HANDLE_BOUND_TO_NESTED_TARGET=true'
          echo 'PR539_SOURCE_INSTANCE_CONTINUITY_REPROVED=true'
          echo 'PR541_SECOND_PARENT_EXECUTED_AT_EXACT_SHA=true'
          echo 'CALLER_SECOND_LOWER_PROJECTION_ACCEPTED=false'
          echo 'PROJECTION_PRODUCER_AUTHENTICATED=false'
          echo 'CANONICAL_TARGET_PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_REPAIR_CORRECTNESS_MINTED=false'
          echo 'RUNTIME_NAME_RESOLUTION_PROVEN=false'
          echo 'CALL_GRAPH_PROVEN=false'
          echo 'B_MINUS_APPROVED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
