name: Aura External Knowledge Ingress

on:
  pull_request:
    paths:
      - 'tools/aura_external_knowledge_ingress.py'
      - 'tools/aura_external_discovery.py'
      - 'tools/aura_external_discovery_cli.py'
      - 'tools/Invoke-AuraExternalDiscovery.ps1'
      - 'tests/test_aura_external_knowledge_ingress.py'
      - 'tests/test_aura_external_discovery.py'
      - 'docs/arena/EXTERNAL_KNOWLEDGE_INGRESS_V1.md'
      - '.github/workflows/aura-external-knowledge-ingress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-knowledge-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact authenticated checkout without mutable checkout action
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch -q --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "EKI1_HEAD=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Compile ingress and discovery surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/aura_external_knowledge_ingress.py \
            tools/aura_external_discovery.py \
            tools/aura_external_discovery_cli.py \
            tests/test_aura_external_knowledge_ingress.py \
            tests/test_aura_external_discovery.py

      - name: Run adversarial ingress contracts without network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tests.test_aura_external_knowledge_ingress \
            tests.test_aura_external_discovery

      - name: Parse PowerShell wrapper
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/Invoke-AuraExternalDiscovery.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'EKI1_POWERSHELL_PARSE=PASS'

      - name: Prove coordinate and authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.aura_external_knowledge_ingress import (
              ExternalObservation,
              ExternalSubject,
              HydrationPayload,
              KnowledgeState,
              LAWS,
              build_external_knowledge_node,
          )

          subject = ExternalSubject(
              provider='GITHUB',
              source_kind='REPOSITORY',
              canonical_id='owner/repo',
              canonical_uri='https://github.com/owner/repo',
              sector='06_RUN',
          )
          observation = ExternalObservation(
              provider_revision='a' * 40,
              content_digest='b' * 64,
              observed_at='2026-08-31T16:45:00Z',
              source_generated_at='2026-08-31T16:30:00Z',
              exact_source_uri='https://github.com/owner/repo/tree/' + 'a' * 40,
              verifier_generation='eki1-proof-v1',
              verified_fields=('canonical_id', 'exact_source_uri', 'provider_revision'),
          )
          hydration = (
              HydrationPayload(level='L0', data={'title':'repo','thesis':'tooling'}, derivation_method='PROVIDER_METADATA_EXTRACT'),
              HydrationPayload(level='L1', data={'purpose':'agent tooling'}, derivation_method='SOURCE_BOUND_SUMMARY'),
          )
          node = build_external_knowledge_node(
              subject=subject,
              observation=observation,
              knowledge_state=KnowledgeState.CURRENT_REFERENCE,
              hydration=hydration,
              validator_generation='eki1-proof-v1',
          )
          required = {
              'ExternalSubjectIdentity!=ExternalEvidenceGeneration',
              'HydrationLevel!=VerificationLevel!=ToolUseAuthority',
              'CoordinateProjection!=SemanticIdentity!=EvidenceTruth',
              'CacheHit!=Currentness!=Authority',
              'ToolUseRequiresSeparateOwnerAdmission',
              'NativePrivateTransformerKVAccessed=false',
          }
          assert required <= set(LAWS), required - set(LAWS)
          assert node.coordinate.tesseract_vertex == (1, 1, 1, 0)
          assert node.read_only_reference_admissible is True
          assert node.tool_use_requires_separate_admission is True
          assert node.code_execution_authorized is False
          assert node.model_download_authorized is False
          assert node.remote_code_authorized is False
          assert node.network_write_authorized is False
          assert node.provider_effect_authorized is False
          assert node.semantic_k27_authority is False
          assert node.native_private_transformer_kv_accessed is False
          print('EKI1_SOURCE_RESOLVABLE_CURRENT_REFERENCE=true')
          print('EKI1_13D_TRIT_COORDINATE=true')
          print('EKI1_K27_TOROIDAL_INDEX=true')
          print('EKI1_TESSERACT_EFFECT_BIT=0')
          print('EKI1_TOOL_EFFECT_AUTHORITY=false')
          print('EKI1_NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false')
          print('EKI1_HEAD=' + __import__('os').environ['EKI1_HEAD'])
          PY
