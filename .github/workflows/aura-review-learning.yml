name: Aura Review Learning

on:
  pull_request:
    paths:
      - "aura_coding_waboose_review_lessons.py"
      - "aura_review_lessons_contracts.py"
      - "aura_review_lessons_external.py"
      - "aura_review_lessons_security.py"
      - "aura_review_lessons_determinism.py"
      - "aura_review_lessons_engine.py"
      - "aura_review_lessons_registry.py"
      - "aura_review_lessons_replay.py"
      - "aura_review_lessons_source_scan.py"
      - "aura_source_integrity.py"
      - "aura_node.py"
      - "aura_coding_waboose_review_learning.py"
      - "aura_agent_arena_review_learning_bridge.py"
      - "aura_agent_arena_review_learning_mcp.py"
      - "schemas/aura_review_lesson.schema.json"
      - ".aura/review_lessons/pr164_spatial_review_lessons.json"
      - ".aura/AFFORDANCE_MAP.json"
      - "scripts/aura_review_learning_architect_harness.py"
      - "tests/test_aura_coding_waboose_review_lessons.py"
      - "tests/test_aura_coding_waboose_review_learning.py"
      - "tests/test_aura_agent_arena_review_learning.py"
      - "tests/test_aura_review_lessons_codex_regressions.py"
      - "tests/test_aura_source_integrity.py"
      - "tests/test_aura_review_learning_mcp_codex.py"
      - "docs/AURA_CODING_WABOOSE_REVIEW_LEARNING.md"
      - ".github/workflows/aura-review-learning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-review-learning:
    runs-on: ubuntu-latest
    env:
      AURA_REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AURA_REVIEW_BASE_REF: ${{ github.base_ref || 'main' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AURA_REVIEW_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base ref without retaining credentials
        run: git fetch --no-tags --depth=1 origin "$AURA_REVIEW_BASE_REF:refs/remotes/origin/$AURA_REVIEW_BASE_REF"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused verifier dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema ruff

      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$AURA_REVIEW_HEAD_SHA"

      - name: Compile focused source and regressions
        run: |
          python -m py_compile \
            aura_coding_waboose_review_lessons.py \
            aura_review_lessons_contracts.py \
            aura_review_lessons_external.py \
            aura_review_lessons_security.py \
            aura_review_lessons_determinism.py \
            aura_review_lessons_engine.py \
            aura_review_lessons_registry.py \
            aura_review_lessons_replay.py \
            aura_review_lessons_source_scan.py \
            aura_source_integrity.py \
            aura_node.py \
            aura_coding_waboose_review_learning.py \
            aura_agent_arena_review_learning_bridge.py \
            aura_agent_arena_review_learning_mcp.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_learning_mcp_codex.py

      - name: Run focused Ruff checks
        run: |
          ruff check \
            aura_coding_waboose_review_lessons.py \
            aura_review_lessons_contracts.py \
            aura_review_lessons_external.py \
            aura_review_lessons_security.py \
            aura_review_lessons_determinism.py \
            aura_review_lessons_engine.py \
            aura_review_lessons_registry.py \
            aura_review_lessons_replay.py \
            aura_review_lessons_source_scan.py \
            aura_source_integrity.py \
            aura_coding_waboose_review_learning.py \
            aura_agent_arena_review_learning_bridge.py \
            aura_agent_arena_review_learning_mcp.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_learning_mcp_codex.py

      - name: Validate Draft 2020-12 schema and canonical lesson registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from aura_coding_waboose_review_lessons import validate_review_lesson_registry

          schema = json.loads(Path("schemas/aura_review_lesson.schema.json").read_text(encoding="utf-8"))
          registry = json.loads(Path(".aura/review_lessons/pr164_spatial_review_lessons.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(registry)
          validated = validate_review_lesson_registry(registry)
          assert validated["registry_digest"] == registry["registry_digest"]
          assert validated["authority"]["production_mutation"] is False
          assert validated["authority"]["automatic_merge"] is False
          PY

      - name: Verify exact-head source integrity evidence
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from aura_source_integrity import scan_utf8_source_tree

          packet = scan_utf8_source_tree(
              Path("."),
              expected_repository_head=os.environ["AURA_REVIEW_HEAD_SHA"],
              require_git_tree=True,
          )
          assert packet["status"] == "PASSED", packet["failures"]
          assert packet["git_tree_bound"] is True
          assert packet["repository_head"] == os.environ["AURA_REVIEW_HEAD_SHA"]
          assert len(packet["repository_tree"]) == 40
          assert len(packet["source_digest"]) == 64
          PY

      - name: Run focused tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_learning_mcp_codex.py \
            tests/test_aura_coding_waboose.py \
            tests/test_aura_waboose_learning.py

      - name: Run Aura-native Architect, Council, Surgeon, Connectome, Emergent, and Waboose harness
        if: matrix.python-version == '3.12'
        env:
          AURA_BASE_REF: origin/${{ env.AURA_REVIEW_BASE_REF }}
          AURA_HEAD_REF: HEAD
        run: |
          python scripts/aura_review_learning_architect_harness.py \
            --repo-root . \
            --base-ref "$AURA_BASE_REF" \
            --head-ref "$AURA_HEAD_REF" \
            --output Aura_Staging/review_learning_harness/architect_receipt.json

      - name: Assert review-only authority envelope
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("Aura_Staging/review_learning_harness/architect_receipt.json").read_text(encoding="utf-8")
          )
          assert receipt["status"] == "PASSED"
          assert receipt["repository_head"] == "${{ env.AURA_REVIEW_HEAD_SHA }}"
          assert receipt["production_mutation"] is False
          assert receipt["automatic_fix"] is False
          assert receipt["automatic_commit"] is False
          assert receipt["automatic_push"] is False
          assert receipt["automatic_pull_request"] is False
          assert receipt["automatic_merge"] is False
          assert receipt["human_review_required"] is True
          assert receipt["crucible"]["failed_count"] == 0
          assert set(receipt["council_v3"]["selected_lanes"]) == {
              "scope", "tests", "sequence", "continuity", "rollback", "cost"
          }
          PY

      - name: Upload exact-head harness receipt
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: aura-review-learning-receipt-${{ env.AURA_REVIEW_HEAD_SHA }}
          path: Aura_Staging/review_learning_harness/architect_receipt.json
          if-no-files-found: error
          retention-days: 14
