name: Align Construction G7-G8 renderer claims

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-honesty.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-honesty-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Align UI and canonical documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact span, observed {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "aura_spatial_web/construction_demo_app.js",
              '''  await state.renderer.initialize(scene, packet.render_plan, {\n    meshPayloads,\n    gaussianPayloads,\n  });\n  return state.renderer.status();\n}\n''',
              '''  await state.renderer.initialize(scene, packet.render_plan, {\n    meshPayloads,\n    gaussianPayloads,\n  });\n  state.renderer.setRepresentationMode("SPLATS");\n  document.querySelectorAll("button[data-mode]").forEach((button) => {\n    const supported = button.dataset.mode === "SPLATS";\n    button.disabled = !supported;\n    if (!supported) {\n      button.title = "Browser GLB decoding and mesh drawing are not implemented; mode is fail-closed";\n    }\n  });\n  return state.renderer.status();\n}\n''',
          )

          replace_once(
              "README.md",
              '''The Construction Arena implementation now covers the complete G0–G8 chain: architecture/dependency lock; open-source fictional BIM acquisition and immutable asset contracts; deterministic IFC-to-storey GLB/SVG compilation; bounded degree-0 Gaussian PLY/SPZ compilation; an asset-bound synthetic Construction project fixture; Spatial Projection V2; local WebGL2 mesh/Gaussian/overlay composition; and a deterministic cinematic director surface.\n''',
              '''The Construction Arena implementation now covers the complete G0–G8 chain: architecture/dependency lock; open-source fictional BIM acquisition and immutable asset contracts; deterministic IFC-to-storey GLB/SVG compilation; bounded degree-0 Gaussian PLY/SPZ compilation; an asset-bound synthetic Construction project fixture; Spatial Projection V2; local WebGL2 Gaussian/graph/overlay composition; and a deterministic cinematic director surface. Mesh contracts remain implemented, but the recording client keeps mesh/hybrid modes disabled until a browser GLB decoder and real mesh draw pass are installed.\n''',
          )
          replace_once(
              "README.md",
              '''Open `http://127.0.0.1:8767/demo/construction?tour=full`. The surface supports mesh, splats, hybrid mode, storey isolation, exploded floors, floor plans, work status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline replay, picking, read-only Observatory evidence, a non-executing human decision packet, and exact renderer dissolution.\n''',
              '''Open `http://127.0.0.1:8767/demo/construction?tour=full`. The current recording client renders the deterministic Gaussian fallback plus graph and overlay context, with storey isolation, exploded floors, floor plans, work status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline replay, picking, read-only Observatory evidence, a non-executing human decision packet, and exact renderer dissolution. It refuses real-pack synthetic substitution and disables mesh/hybrid controls until real browser decoders exist.\n''',
          )

          replace_once(
              "USER_GUIDE.md",
              '''Supported tours are `full`, `blocked-work`, `alternatives`, and `timeline`. The full tour contains 18 bounded presentation steps: attribution; complete hybrid building; orbit; exploded storeys; floor plans; timeline replay; blocked drilling; missing dispositive evidence; the hard-blocked unsafe option; safe alternate work; trade history; dependencies; synthetic-rule and inspection gates; schedule/budget comparison; a human-review recommendation; Observatory; a human decision packet; and dissolution.\n\nControls include orbit, zoom, storey isolation, show all, explode/collapse, mesh/splats/hybrid, floor plans, work status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline scrub, picking, reset, play, pause, next step, and dissolve.\n\nSupply `--asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json` when an admitted generated pack exists. Without it, the director uses a deterministic five-storey local fallback for recording and testing. The fallback is presentation-only and is not survey geometry.\n''',
              '''Supported tours are `full`, `blocked-work`, `alternatives`, and `timeline`. The full tour contains 18 bounded presentation steps: attribution; the deterministic Gaussian building view; orbit; exploded storeys; floor plans; timeline replay; blocked drilling; missing dispositive evidence; the hard-blocked unsafe option; safe alternate work; trade history; dependencies; synthetic-rule and inspection gates; schedule/budget comparison; a human-review recommendation; Observatory; a human decision packet; and dissolution.\n\nControls include orbit, zoom, storey isolation, show all, explode/collapse, splats, floor plans, work status, trades, blockers, budgets, inspections, dependencies, synthetic rules, timeline scrub, picking, reset, play, pause, next step, and dissolve. Mesh and hybrid controls are visible but disabled until a browser GLB decoder and real mesh draw pass exist.\n\nUse `--asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json` for deterministic packet compilation and contract validation only. The browser recording client currently refuses admitted real packs because GLB/SPZ browser decoding is not implemented; it will not substitute fabricated geometry. Omit `--asset-pack` to use the deterministic five-storey fallback for recording and testing. The fallback is presentation-only and is not survey geometry.\n''',
          )

          replace_once(
              "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
              '''→ G6 local WebGL2 mesh/Gaussian/overlay composition\n''',
              '''→ G6 local WebGL2 Gaussian/graph/overlay composition with fail-closed mesh contracts\n''',
          )
          replace_once(
              "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
              '''Use an admitted generated asset pack when available:\n\n```bash\npython aura_spatial_cli.py \\\n  --repo-root . \\\n  construction-video-demo \\\n  --asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json \\\n  --tour full \\\n  --serve\n```\n\nWhen no pack path is supplied, the director uses a deterministic five-storey local fallback. The fallback preserves the same immutable contracts and uses bounded degree-0 Gaussian presentation data; it is not survey geometry and must not be described as a real construction site.\n''',
              '''Use an admitted generated asset pack for deterministic packet compilation and contract validation:\n\n```bash\npython aura_spatial_cli.py \\\n  --repo-root . \\\n  construction-video-demo \\\n  --asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json \\\n  --tour full \\\n  --output /tmp/aura-construction-real-pack.packet.json\n```\n\nThe browser recording client intentionally refuses a real pack until repository-owned GLB/SPZ browser decoders and a real mesh draw pass are implemented. It never replaces admitted real-pack digests with fallback geometry. When no pack path is supplied, the director uses a deterministic five-storey local fallback. The fallback preserves the same immutable contracts and uses bounded degree-0 Gaussian presentation data; it is not survey geometry and must not be described as a real construction site.\n''',
          )
          replace_once(
              "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
              '''The full sequence shows attribution, the hybrid building, orbit and exploded floors, floor-plan overlays, timeline replay, blocked drilling, missing dispositive asbestos evidence, the hard-blocked unsafe option, safe alternate work, trade history, dependencies, synthetic rule and inspection gates, budget/schedule comparison, Observatory evidence, a human decision packet, and exact renderer dissolution.\n''',
              '''The full sequence shows attribution, the deterministic Gaussian building view, orbit and exploded floors, floor-plan overlays, timeline replay, blocked drilling, missing dispositive asbestos evidence, the hard-blocked unsafe option, safe alternate work, trade history, dependencies, synthetic rule and inspection gates, budget/schedule comparison, Observatory evidence, a human decision packet, and exact renderer dissolution.\n''',
          )
          replace_once(
              "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
              '''orbit · zoom · storey isolation · show all · explode · collapse\nmesh · splats · hybrid\nfloor plans · status · trades · blockers · budgets · inspections\n''',
              '''orbit · zoom · storey isolation · show all · explode · collapse\nsplats · mesh/hybrid visibly disabled until real browser decoding exists\nfloor plans · status · trades · blockers · budgets · inspections\n''',
          )

          test_path = Path("tests/js/spatial-construction-review-regressions.test.mjs")
          text = test_path.read_text(encoding="utf-8")
          addition = '''\n\ntest("Construction recording UI advertises only implemented representation modes", async () => {\n  const { readFile } = await import("node:fs/promises");\n  const source = await readFile(\n    new URL("../../aura_spatial_web/construction_demo_app.js", import.meta.url),\n    "utf8",\n  );\n  assert.match(source, /setRepresentationMode\("SPLATS"\)/);\n  assert.match(source, /button\.disabled = !supported/);\n  assert.match(source, /Browser GLB decoding and mesh drawing are not implemented/);\n});\n'''
          if "advertises only implemented representation modes" not in text:
              test_path.write_text(text + addition, encoding="utf-8")
          PY

      - name: Verify aligned recording client
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --test tests/js/spatial-construction-review-regressions.test.mjs
          git diff --check

      - name: Commit and publish aligned claims
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md USER_GUIDE.md docs/AURA_CONSTRUCTION_ARENA_G7_G8.md \
            aura_spatial_web/construction_demo_app.js \
            tests/js/spatial-construction-review-regressions.test.mjs
          git commit -m "fix(g8): fail closed on unsupported browser render modes"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
