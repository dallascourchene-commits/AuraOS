name: Materialize verified harness repair 202-204

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .aura/HARNESS_REPAIR_202_204_REQUEST

permissions:
  contents: write
  issues: write

concurrency:
  group: harness-repair-202-204-v4-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.ref == 'harness/repair-202-204-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: harness/repair-202-204-v4
          fetch-depth: 0

      - name: Verify exact base and transport identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          request=.aura/HARNESS_REPAIR_202_204_REQUEST
          source_main_sha="$(awk -F= '$1 == "source_main_sha" {print $2}' "$request")"
          patch_transport_commit="$(awk -F= '$1 == "patch_transport_commit" {print $2}' "$request")"
          patch_sha256="$(awk -F= '$1 == "patch_sha256" {print $2}' "$request")"
          test "$source_main_sha" = "$(git merge-base HEAD origin/main)"
          test "$source_main_sha" = "$(git rev-parse origin/main)"
          git cat-file -e "${patch_transport_commit}^{commit}"
          git merge-base --is-ancestor "$patch_transport_commit" HEAD

          mapfile -t current_parts < <(find .aura/harness-repair-202-204 -maxdepth 1 -type f -name 'part-*.patch' -printf '%p\n' | sort)
          mapfile -t recorded_parts < <(git ls-tree -r --name-only "$patch_transport_commit" -- .aura/harness-repair-202-204 | sort)
          test "${#current_parts[@]}" -gt 0
          test "${#current_parts[@]}" -eq "${#recorded_parts[@]}"
          for index in "${!current_parts[@]}"; do
            test "${current_parts[$index]}" = "${recorded_parts[$index]}"
            git show "$patch_transport_commit:${recorded_parts[$index]}" > "/tmp/recorded-part-$index.patch"
            cmp "/tmp/recorded-part-$index.patch" "${current_parts[$index]}"
          done
          cat "${current_parts[@]}" > /tmp/harness-repair-202-204.patch
          test "$(sha256sum /tmp/harness-repair-202-204.patch | awk '{print $1}')" = "$patch_sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest jsonschema

      - name: Apply exact reviewed patch and remove transport
        run: |
          git apply --check /tmp/harness-repair-202-204.patch
          git apply /tmp/harness-repair-202-204.patch
          git rm -r .aura/harness-repair-202-204
          git rm .aura/HARNESS_REPAIR_202_204_REQUEST
          git diff --check

      - name: Compile changed Python
        run: |
          python -m py_compile \
            scripts/aura_architecture_harness_core.py \
            aura_coding_relationship_compass.py \
            tests/test_aura_architecture_harness.py \
            tests/test_aura_coding_relationship_compass.py

      - name: Run focused and adjacent regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          set +e
          python -m pytest -q \
            tests/test_aura_architecture_harness.py \
            tests/test_aura_architecture_harness_original_github_routing.py \
            tests/test_aura_architecture_harness_git_tree_routing.py \
            tests/test_aura_architecture_harness_export_workflow.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relationship_compass_finalization.py \
            2>&1 | tee /tmp/harness-repair-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '### Harness repair pytest failure'
              echo
              echo '```text'
              tail -n 220 /tmp/harness-repair-pytest.log
              echo '```'
            } > /tmp/harness-repair-pytest-tail.md
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/harness-repair-pytest-tail.md
            exit "$status"
          fi

      - name: Upload pytest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-repair-pytest-${{ github.event.pull_request.head.sha }}
          path: /tmp/harness-repair-pytest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify repaired doctor and exact objective grounding
        env:
          PYTHONPATH: .
        run: |
          python scripts/aura_architecture_harness.py --repo-root . doctor > /tmp/harness-doctor.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import aura_architecture_harness as harness

          doctor = json.loads(Path('/tmp/harness-doctor.json').read_text())
          assert doctor['codemap']['symbol_count'] > 10000
          assert doctor['codemap']['symbol_count_source'] == 'symbol_index_member_count'
          grounded = harness._objective_grounded_architect_tasks(
              Path('.').resolve(),
              'Implement aura_intent_ingestion.py::_extract_keywords, '
              'aura_event_contracts.py::stable_digest, IntentPacket, and SemanticLedger; '
              'preserve tests/test_aura_intent_ingestion.py.',
              [],
          )
          assert [item['target_symbol'] for item in grounded['act_tasks']] == [
              '_extract_keywords', 'stable_digest', 'IntentPacket', 'SemanticLedger'
          ]
          assert grounded['explicit_test_targets'] == ['tests/test_aura_intent_ingestion.py']
          PY

      - name: Regenerate and verify navigation
        env:
          PYTHONPATH: .
        run: |
          python aura_codebase_navigator.py --root .
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          git diff --check

      - name: Commit and publish verified repair
        run: |
          git config user.name 'AuraOS Harness Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(harness): ground exact targets and preserve focal tests'
          git push origin HEAD:harness/repair-202-204-v4
