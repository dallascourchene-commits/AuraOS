name: Frontier-27 Implementation Proof

on:
  pull_request:
    paths:
      - "tools/arena/frontier27_runtime.py"
      - "tests/test_frontier27_runtime.py"
      - "tests/test_frontier27_cumulative_energy.py"
      - "benchmarks/benchmark_frontier27.py"
      - "benchmarks/check_frontier27_thresholds.py"
      - "docs/FRONTIER27_IMPLEMENTATION.md"
      - ".github/workflows/frontier27-proof.yml"
  push:
    branches:
      - "arena/frontier27-implementation-benchmark-20260905-sol"

permissions:
  contents: read

jobs:
  proof:
    name: Frontier-27 proof (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout exact semantic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-09-05
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          printf 'exact_checkout_head=%s\n' "$actual"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed 2026-09-05
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Frontier-27 runtime
        run: |
          python -m py_compile tools/arena/frontier27_runtime.py tests/test_frontier27_runtime.py tests/test_frontier27_cumulative_energy.py benchmarks/benchmark_frontier27.py benchmarks/check_frontier27_thresholds.py
      - name: Run all Frontier-27 mechanism and review-regression tests
        run: python -m unittest -v tests.test_frontier27_runtime tests.test_frontier27_cumulative_energy
      - name: Run deterministic before/after benchmark
        run: python benchmarks/benchmark_frontier27.py > frontier27-benchmark.json
      - name: Enforce deterministic efficiency + retrieval-quality floors
        run: python benchmarks/check_frontier27_thresholds.py frontier27-benchmark.json
      - name: Show benchmark
        run: cat frontier27-benchmark.json
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 observed 2026-09-05
        with:
          name: frontier27-benchmark-${{ matrix.python-version }}-${{ github.run_id }}
          path: frontier27-benchmark.json
          retention-days: 14
