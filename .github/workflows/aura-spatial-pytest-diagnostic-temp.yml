name: Aura Spatial pytest diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-pytest-diagnostic-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-spatial-pytest:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy
      - name: Capture full Spatial pytest output
        run: |
          set +e
          python -m pytest -q --tb=short --maxfail=10 tests/test_aura_spatial*.py > spatial-pytest.log 2>&1
          status=$?
          echo "$status" > spatial-pytest-status.txt
          cat spatial-pytest.log
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-pytest-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            spatial-pytest.log
            spatial-pytest-status.txt
          if-no-files-found: error
          retention-days: 7
