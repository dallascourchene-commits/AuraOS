name: Aura Spatial Final CODEMAP Sync

on:
  push:
    branches:
      - feature/aura-spatial-s0-s2
    paths:
      - .aura/tools/aura_spatial_codemap_finalize.trigger

permissions:
  contents: write

concurrency:
  group: aura-spatial-final-codemap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-final-navigation-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install navigator dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" --quiet
      - name: Validate final evidence receipts
        run: |
          python -m json.tool .aura/research/AURA_SPATIAL_BREADBOARD_RECEIPT.json >/dev/null
          test -s .aura/research/AURA_SPATIAL_COUNCIL_V3_BREADBOARD_2026-07-19.md
      - name: Remove one-shot synchronization machinery
        run: |
          rm -f \
            .aura/tools/aura_spatial_codemap_finalize.trigger \
            .github/workflows/aura-spatial-codemap-finalize-once.yml
      - name: Regenerate and verify final CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          git diff --check
      - name: Commit final navigation evidence
        shell: bash
        run: |
          git config user.name "AuraOS Spatial Circuit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .aura/tools/aura_spatial_codemap_finalize.trigger \
            .github/workflows/aura-spatial-codemap-finalize-once.yml
          if git diff --cached --quiet; then
            echo "CODEMAP is already synchronized."
            exit 0
          fi
          git commit -m "Spatial S2: synchronize final CODEMAP evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
