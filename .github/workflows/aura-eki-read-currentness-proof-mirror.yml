name: Aura EKI Read Currentness Hosted Proof Mirror

on:
  push:
    branches:
      - 'feature/arena-eki-read-currentness-hosted-proof-20260831-sol'

permissions:
  contents: read
  actions: read

env:
  PR735_HEAD: 89a66cdb972d3eab19c9408356b7061d1529947d
  PR735_RUN: '33417664825'
  WP03_HEAD: 9865c42f3ada2520141bd2fe30a439ce160ce2f8
  WP03_RUN: '33416056653'
  CANDIDATE_SOURCE_BLOB: fed7003630487af41586ce07a00b83b8fbf66835
  WP03_SOURCE_BLOB: 53de9d551c81a0eb495eb180294c0aba5eb359d0
  READ_GUARD_SOURCE_BLOB: 7dfaaf755a802e0a20a23ce06ba520fe47028f56

jobs:
  eki-read-currentness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact mirror head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authenticate exact semantic surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/aura_external_knowledge_coordinate_memory_candidate.py)" = "$CANDIDATE_SOURCE_BLOB"
          test "$(git hash-object tools/aura_external_cognition_resolve_adapter.py)" = "$WP03_SOURCE_BLOB"
          test "$(git hash-object tools/aura_external_knowledge_coordinate_memory_read_guard.py)" = "$READ_GUARD_SOURCE_BLOB"
          grep -q 'CURRENT_REFERENCE@Projection!=Current@Read' tools/aura_external_knowledge_coordinate_memory_read_guard.py
          grep -q 'Required(source)+NOT_REQUIRED(source)=>FailClosed' tools/aura_external_knowledge_coordinate_memory_read_guard.py
          echo 'EKIR1_SEMANTIC_SURFACES_EXACT=true'

      - name: Revalidate exact hosted parent generations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          expected=((int(os.environ['PR735_RUN']),os.environ['PR735_HEAD'],'Aura EKI Coordinate Memory Candidate'),(int(os.environ['WP03_RUN']),os.environ['WP03_HEAD'],'Aura External Cognition Resolve Adapter'))
          for run_id,head,name in expected:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
              assert run['head_sha']==head,(run_id,run['head_sha'],head)
              assert run['name']==name,(run_id,run['name'],name)
              assert run['status']=='completed' and run['conclusion']=='success'
          print('EKIR1_PARENTS_EXACT_GREEN=true')
          PY

      - name: Replay candidate reader and read-currentness adversarials
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_external_knowledge_coordinate_memory_candidate.py \
            tools/aura_external_cognition_resolve_adapter.py \
            tools/aura_external_knowledge_coordinate_memory_read_guard.py \
            tests/test_aura_external_knowledge_coordinate_memory_candidate.py \
            tests/test_aura_external_cognition_resolve_adapter.py \
            tests/test_aura_external_knowledge_coordinate_memory_read_guard.py
          python -m unittest \
            tests.test_aura_external_knowledge_coordinate_memory_candidate \
            tests.test_aura_external_cognition_resolve_adapter \
            tests.test_aura_external_knowledge_coordinate_memory_read_guard -v

      - name: Independently prove use-time source currentness gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.aura_external_cognition_resolve_adapter import CurrentnessStatus, ResolveDisposition
          from tools.aura_external_knowledge_coordinate_memory_candidate import project_external_knowledge_candidate
          from tools.aura_external_knowledge_coordinate_memory_read_guard import resolve_with_read_currentness
          from tests.test_aura_external_knowledge_coordinate_memory_read_guard import current_node, materialize, guarded, context

          candidate=project_external_knowledge_candidate(node=current_node()).candidate
          assert candidate is not None
          snapshot_bytes, adapter=materialize(candidate)
          contract=guarded(candidate,snapshot_bytes)

          missing=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context())
          assert missing.disposition is ResolveDisposition.SOURCE_REVALIDATION_REQUIRED
          stale=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.STALE))
          assert stale.disposition is ResolveDisposition.CURRENTNESS_REOPEN
          current=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.RESOLVED_CURRENT))
          assert current.disposition is ResolveDisposition.FOUND_VERIFIED
          assert current.candidate is not None
          assert current.candidate.source_currentness == CurrentnessStatus.RESOLVED_CURRENT.value
          assert current.candidate.instruction_authority is False
          assert current.candidate.write_authority is False
          assert current.candidate.effect_authority is False
          try:
              resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.NOT_REQUIRED))
          except ValueError as exc:
              assert str(exc) == 'EKI_READ_REQUIRED_SOURCE_AXIS_CANNOT_BE_NOT_REQUIRED'
          else:
              raise AssertionError('NOT_REQUIRED must fail closed')
          print('CURRENT_REFERENCE_AT_PROJECTION_NE_CURRENT_AT_READ=true')
          print('MISSING_SOURCE_REVALIDATION_REQUIRED=true')
          print('STALE_SOURCE_REOPENS=true')
          print('CURRENT_SOURCE_RETURNS_CANDIDATE_ONLY=true')
          print('NOT_REQUIRED_FAILS_CLOSED=true')
          print('K27_NE_SOURCE_CURRENTNESS=true')
          PY
