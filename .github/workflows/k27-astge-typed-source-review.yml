name: K27 ASTGE Typed Source Review

on:
  pull_request:
    paths:
      - 'crates/aura-k27-astge-generation-domain/**'
      - 'crates/aura-k27-astge-source-review/**'
      - 'crates/aura-k27-astge-typed-source-review/**'
      - '.github/workflows/k27-astge-typed-source-review.yml'

permissions:
  contents: read

jobs:
  typed-source-review:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Re-prove source review owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-source-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-source-review/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-source-review/Cargo.toml --all-targets -- -D warnings
      - name: Re-prove generation domain owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets -- -D warnings
      - name: Verify typed source review membrane
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets -- -D warnings
      - name: Emit claim ceiling
        run: |
          echo "TYPED_SOURCE_REVIEW_EXECUTED=true"
          echo "SOURCE_GENERATION_TYPE_BOUND=true"
          echo "CROSS_AXIS_SOURCE_REVIEW_COMPILES=false"
          echo "SEMANTIC_CORRECTNESS_PROVEN=false"
          echo "B_MINUS_APPROVED=false"
          echo "COMMIT_AUTHORIZED=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
