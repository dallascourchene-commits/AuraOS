name: AWJ032 GLM53 G1 Metadata Contract

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_checkpoint_layout_probe.py"
      - "tools/awj032/glm53_checkpoint_source_binding.py"
      - "tools/awj032/glm53_checkpoint_extra_layer_classification.py"
      - "tools/awj032/test_glm53_checkpoint_layout_probe.py"
      - "tools/awj032/test_glm53_checkpoint_source_binding.py"
      - "tools/awj032/test_glm53_checkpoint_extra_layer_classification.py"
      - ".github/workflows/awj032-glm53-g1-metadata-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj032-glm53-g1-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-metadata-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8.2,<9.0"
      - name: Run GLM53 G1 metadata contract
        run: |
          python -m py_compile \
            tools/awj032/glm53_checkpoint_layout_probe.py \
            tools/awj032/glm53_checkpoint_source_binding.py \
            tools/awj032/glm53_checkpoint_extra_layer_classification.py
          python -m pytest -q \
            tools/awj032/test_glm53_checkpoint_layout_probe.py \
            tools/awj032/test_glm53_checkpoint_source_binding.py \
            tools/awj032/test_glm53_checkpoint_extra_layer_classification.py
