name: AuraOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused-contracts:
    name: Focused contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Compile Phase A and Phase B modules
        run: |
          python -m py_compile \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_codemap_verify.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_codemap_verify.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_codemap_verify.py
      - name: Run focused Arena and Crucible tests
        run: |
          python -m pytest -q \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arena_live_cli.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py

  full-pytest-suite:
    name: Full pytest-native suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio
      - name: Run all pytest-native tests
        id: full_pytest
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q --disable-warnings --maxfail=1 \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --junitxml=full-pytest-junit.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-junit-${{ github.run_id }}
          path: full-pytest-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce pytest result
        if: steps.full_pytest.outcome != 'success'
        run: |
          echo "The pytest-native suite failed. Inspect the uploaded JUnit artifact."
          exit 1

  legacy-validator:
    name: Legacy validator (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script:
          - test_aura_functions.py
          - test_synthesis_upgrades.py
          - test_syntax_fixes.py
          - test_codemap_hooks_simple.py
          - test_pvm_logic.py
          - test_aura_substrate.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Run validator through its intended entry point
        id: validator
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p legacy-validator-report
          set +e
          timeout 1200 python "${{ matrix.script }}" \
            > legacy-validator-report/output.log 2>&1
          code=$?
          set -e
          printf '%s\n' "${code}" > legacy-validator-report/exit_code
          printf '%s\n' "${{ matrix.script }}" > legacy-validator-report/script
          exit "${code}"
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.script }}-${{ github.run_id }}
          path: legacy-validator-report/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce validator result
        if: steps.validator.outcome != 'success'
        run: |
          echo "${{ matrix.script }} failed. Inspect its uploaded report."
          exit 1

  topology:
    name: Regenerate and verify CODEMAP topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # CODEMAP is a committed artifact of the source branch. Test jobs exercise
          # GitHub's synthetic merge ref, while this job verifies the exact source
          # tree that produced the committed navigation artifacts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Preserve committed CODEMAP snapshot
        run: cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.committed.json"
      - name: Regenerate deep CODEMAP
        run: python aura_codebase_navigator.py
      - name: Verify topology and stable committed structure
        run: python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.committed.json"
