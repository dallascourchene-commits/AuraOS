name: U6-U7 learning-to-reproof verified materializer

on:
  push:
    branches:
      - refactor/unified-memory-learning-to-reproof

permissions:
  contents: write
  statuses: write

env:
  PYTHONPATH: ${{ github.workspace }}
  BASE_SHA: de573d16ebf145c1b52487903d4a3d24a977ffc0
  PATCH_B64_SHA256: 1c5be8d5a765fad43200c24ef8f18613364ce3b2389449474e088281a89fa97f
  PATCH_SHA256: 7262bbb29af42e6a47196f0950c33a909c206252e7fe9c0b2506fdcf33d66481
  TARGET_BRANCH: refactor/unified-memory-learning-to-reproof

concurrency:
  group: u7-learning-materializer
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'auraos-u7-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-learning-to-reproof
          fetch-depth: 0

      - name: Publish discoverable pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=u7-learning-materializer \
            -f description="Run ${GITHUB_RUN_ID} is verifying U6-U7" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .aura/analysis/u7_patch.part{0,1,2,3,4} > /tmp/u7.patch.gz.b64
          test "$(sha256sum /tmp/u7.patch.gz.b64 | awk '{print $1}')" = "$PATCH_B64_SHA256"
          base64 --decode /tmp/u7.patch.gz.b64 > /tmp/u7.patch.gz
          gzip -dc /tmp/u7.patch.gz > /tmp/u7.patch
          test "$(sha256sum /tmp/u7.patch | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check /tmp/u7.patch

      - name: Restore canonical transport and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$BASE_SHA" -- .github/workflows/ci.yml
          rm -f .aura/analysis/u7_patch.part{0,1,2,3,4}
          git apply /tmp/u7.patch
          git checkout "$BASE_SHA" -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json

      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Format and lint exact review surface
        shell: bash
        run: |
          set -euo pipefail
          ruff format \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py
          ruff format --check \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py
          ruff check --select E9,F63,F7,F82 \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py

      - name: Compile and run focused regression ring
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_arena_persistence_adapters.py \
            aura_qdkt_observations.py \
            aura_relationship_experience.py \
            aura_unified_memory_continuity_learning.py \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity_learning.py
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py

      - name: Create exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'auraos-u7-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: complete U6-U7 learning-to-reproof runtime'

      - name: Run Coding Waboose exact-head review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from aura_coding_waboose import CodingWaboose

          request = json.load(open('.aura/waboose_requests/unified_memory_continuity_learning.v1.json', encoding='utf-8'))
          runtime = CodingWaboose('.')
          prepared = runtime.prepare({
              'objective': request['objective'],
              'base_ref': 'de573d16ebf145c1b52487903d4a3d24a977ffc0',
              'head_ref': 'HEAD',
              'changed_files': request['changed_files'],
              'run_tests': False,
              'run_optional_tools': False,
          })
          assert prepared.get('ok') is True, prepared
          scanned = runtime.scan(prepared['review_id'])
          assert scanned.get('ok') is True, scanned
          final = runtime.finalize(prepared['review_id'])
          assert final.get('ok') is True, final
          assert final.get('status') == 'READY_FOR_HUMAN_REVIEW', final
          assert not final.get('findings'), final
          assert final.get('automatic_merge') is False, final
          print(json.dumps({
              'review_id': final.get('review_id'),
              'status': final.get('status'),
              'finding_count': len(final.get('findings') or []),
              'automatic_merge': final.get('automatic_merge'),
          }, sort_keys=True))
          PY

      - name: Enforce exact final diff and publish
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          .aura/waboose_requests/unified_memory_continuity_learning.v1.json
          aura_agent_arena_bridge.py
          aura_agent_arena_mcp.py
          aura_arena_persistence_adapters.py
          aura_qdkt_observations.py
          aura_relationship_experience.py
          aura_unified_memory_continuity_learning.py
          aura_unified_memory_continuity_toolchain.py
          tests/test_aura_unified_memory_continuity_learning.py
          EOF
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          test -z "$(git status --porcelain=v1)"
          git push --force-with-lease origin HEAD:"$TARGET_BRANCH"

      - name: Publish discoverable final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          description="Run ${GITHUB_RUN_ID} verified and published U6-U7"
          if [ "${{ job.status }}" != success ]; then
            state=failure
            description="Run ${GITHUB_RUN_ID} failed closed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=u7-learning-materializer \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
