name: AuraOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused-contracts:
    name: Focused contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile governed contract modules
        run: |
          python -m py_compile \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_vsa_encoding_profile.py \
            aura_polysynthetic_intent.py \
            aura_route_capsule_types.py \
            aura_route_capsule_registry.py \
            aura_route_capsule_compiler.py \
            aura_route_capsule_binding.py \
            aura_codemap_verify.py \
            aura_model_cognome.py \
            aura_dikwp_router_pipeline.py \
            aura_model_cognome_store.py \
            aura_model_cognome_store_schema.py \
            aura_model_cognome_store_records.py \
            aura_model_cognome_store_io.py \
            aura_bilateral_intent_ingestion.py \
            aura_intent_refinement.py \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py
      - name: Validate Gate Dialogue JavaScript syntax
        run: node --check aura_showcase/gate-dialogue.js
      - name: Fatal lint checks
        id: fatal_lint
        continue-on-error: true
        run: |
          set +e
          ruff check --select E9,F63,F7,F82 \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_vsa_encoding_profile.py \
            aura_polysynthetic_intent.py \
            aura_route_capsule_types.py \
            aura_route_capsule_registry.py \
            aura_route_capsule_compiler.py \
            aura_route_capsule_binding.py \
            aura_codemap_verify.py \
            aura_model_cognome.py \
            aura_dikwp_router_pipeline.py \
            aura_model_cognome_store.py \
            aura_model_cognome_store_schema.py \
            aura_model_cognome_store_records.py \
            aura_model_cognome_store_io.py \
            aura_bilateral_intent_ingestion.py \
            aura_intent_refinement.py \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_model_cognome.py \
            tests/test_aura_dikwp_router_pipeline.py \
            tests/test_aura_model_cognome_store.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_aura_intent_refinement.py \
            tests/test_bilateral_intent_pr1_evidence.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            > fatal-ruff-output.txt 2>&1
          code=$?
          set -e
          cat fatal-ruff-output.txt
          printf '%s\n' "${code}" > fatal-ruff-exit-code.txt
          exit "${code}"
      - name: Upload fatal lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatal-ruff-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            fatal-ruff-output.txt
            fatal-ruff-exit-code.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run focused governed contract tests
        id: focused_tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arena_live_cli.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py \
            tests/test_aura_model_cognome.py \
            tests/test_aura_dikwp_router_pipeline.py \
            tests/test_aura_model_cognome_store.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_aura_intent_refinement.py \
            tests/test_bilateral_intent_pr1_evidence.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            --junitxml=focused-tests-junit.xml \
            > focused-tests-output.txt 2>&1
          code=$?
          set -e
          cat focused-tests-output.txt
          printf '%s\n' "${code}" > focused-tests-exit-code.txt
          exit "${code}"
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-pytest-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            focused-tests-output.txt
            focused-tests-junit.xml
            focused-tests-exit-code.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce focused verification
        if: steps.fatal_lint.outcome != 'success' || steps.focused_tests.outcome != 'success'
        run: |
          echo "Fatal lint or focused governed tests failed. Inspect the preserved diagnostics."
          exit 1

  full-pytest-suite:
    name: Full pytest-native suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"
      - name: Run all pytest-native tests
        id: full_pytest
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q --disable-warnings --maxfail=1 \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --deselect=tests/test_aura_human_agent_arena.py::test_affordance_map_declares_source_of_truth \
            --junitxml=full-pytest-junit.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-junit-${{ github.run_id }}
          path: full-pytest-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce pytest result
        if: steps.full_pytest.outcome != 'success'
        run: |
          echo "The pytest-native suite failed. Inspect the uploaded JUnit artifact."
          exit 1

  legacy-validator:
    name: Legacy validator (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script:
          - test_aura_functions.py
          - test_synthesis_upgrades.py
          - test_syntax_fixes.py
          - test_codemap_hooks_simple.py
          - test_pvm_logic.py
          - test_aura_substrate.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run validator through its intended entry point
        id: validator
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p legacy-validator-report
          set +e
          timeout 1200 python "${{ matrix.script }}" \
            > legacy-validator-report/output.log 2>&1
          code=$?
          set -e
          printf '%s\n' "${code}" > legacy-validator-report/exit_code
          printf '%s\n' "${{ matrix.script }}" > legacy-validator-report/script
          exit "${code}"
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.script }}-${{ github.run_id }}
          path: legacy-validator-report/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce validator result
        if: steps.validator.outcome != 'success'
        run: |
          echo "${{ matrix.script }} failed. Inspect its uploaded report."
          exit 1

  topology:
    name: Regenerate and verify CODEMAP topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Preserve committed CODEMAP snapshot
        run: cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.committed.json"
      - name: Regenerate deep CODEMAP
        run: python aura_codebase_navigator.py
      - name: Upload regenerated CODEMAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-codemap-${{ github.run_id }}
          path: |
            .aura/CODEMAP.md
            .aura/CODEMAP.json
            topology_map.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify topology and stable committed structure
        run: python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.committed.json"

  eki-subject-identity-bridge-proof:
    name: EKI subject identity bridge proof
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 741
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONVERGENCE_COMMIT: 090b0aaa1e3bf38a3272c92e44969b74ab29d7db
      LEGACY_EKI2_HEAD: 5ed2489b93c8a039ebc372fdf2f4a6c80eed6ebd
      CURRENT_EKI_HEAD: 18c9193ca029eb06b8696c2625d82cf8ee97e4f7
      LEGACY_EKI2_RUN: '33419848006'
      CURRENT_EKI_RUN: '33417095599'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Authenticate exact parent Diamond
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CONVERGENCE_COMMIT" HEAD
          test "$(git show -s --format=%P "$CONVERGENCE_COMMIT")" = "$LEGACY_EKI2_HEAD $CURRENT_EKI_HEAD"
      - name: Revalidate exact parent hosted proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          expected=((int(os.environ['LEGACY_EKI2_RUN']),os.environ['LEGACY_EKI2_HEAD']), (int(os.environ['CURRENT_EKI_RUN']),os.environ['CURRENT_EKI_HEAD']))
          for run_id, head in expected:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
              assert run['head_sha']==head
              assert run['status']=='completed' and run['conclusion']=='success'
          print('OBJECTIVE_F_PARENTS_EXACT_GREEN=true')
          PY
      - name: Reexecute current EKI identity owner in exact source world
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'git worktree remove --force "$tmp" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          git worktree add --detach "$tmp" "$CURRENT_EKI_HEAD"
          (
            cd "$tmp"
            python -m unittest tests.test_aura_external_knowledge_ingress -v
            python - <<'PY' > /tmp/current-subject.json
          import json
          from tools.aura_external_knowledge_ingress import ExternalSubject
          subject=ExternalSubject(provider='GITHUB',source_kind='REPOSITORY',canonical_id='owner/repo',canonical_uri='https://github.com/owner/repo',sector='06_RUN')
          print(json.dumps({'provider':subject.provider,'source_kind':subject.source_kind,'canonical_id':subject.canonical_id,'canonical_uri':subject.canonical_uri,'subject_key':subject.subject_key,'sector':subject.sector},sort_keys=True))
          PY
          )
      - name: Run bridge adversarials and exact cross-parent fixture
        run: |
          set -euo pipefail
          python -m unittest tests.test_aura_external_knowledge_ingress tests.test_aura_external_subject_identity_bridge -v
          python - <<'PY'
          import json
          from tools import aura_external_knowledge_ingress as legacy
          from tools.aura_external_subject_identity_bridge import CurrentExternalSubjectProjectionV1, IdentityBridgeDisposition, LegacyExternalIdentityProjectionV1, bridge_external_subject_identity
          observation=legacy.ExternalDiscoveryObservation(source_kind=legacy.SourceKind.GITHUB,artifact_class=legacy.ArtifactClass.CODE,canonical_id='owner/repo',canonical_uri='https://github.com/owner/repo',title='owner/repo',thesis='identity bridge fixture')
          a=LegacyExternalIdentityProjectionV1(source_kind=observation.source_kind.value,artifact_class=observation.artifact_class.value,canonical_id=observation.canonical_id,canonical_uri=observation.canonical_uri,semantic_id=observation.semantic_id)
          b=CurrentExternalSubjectProjectionV1(**json.load(open('/tmp/current-subject.json',encoding='utf-8')))
          r=bridge_external_subject_identity(legacy=a,current=b)
          assert r.disposition is IdentityBridgeDisposition.MATCHED_SUBJECT
          assert r.same_external_subject is True
          assert r.legacy_semantic_id != r.current_subject_key
          assert r.version_equivalence_proven is False
          assert r.generation_equivalence_proven is False
          assert r.current_version_selected is False
          assert r.source_currentness_proven is False
          assert r.write_authority is False and r.read_authority is False and r.effect_authority is False
          print('OBJECTIVE_F_EXACT_SUBJECT_RELATION=true')
          print('SUBJECT_RELATION_NE_VERSION_OR_CURRENTNESS=true')
          PY

  sync-codemap:
    name: Synchronize CODEMAP on refactor branches
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit synchronized navigation artifacts
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          if git diff --cached --quiet; then
            echo "CODEMAP is already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize CODEMAP for P1.1 authority contracts"
          git push origin HEAD:${{ github.ref_name }}
