name: AuraOS CI

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr198-review-repair
  cancel-in-progress: false

jobs:
  pr198-review-repair:
    if: github.head_ref == 'refactor/unified-memory-continuity-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity-completion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Apply exact review fixes
        run: python .github/scripts/apply_pr198_review_fixes.py

      - name: Format and lint changed review surface
        shell: bash
        run: |
          python -m ruff format \
            aura_unified_memory_continuity_toolchain.py \
            aura_architect_council_v3.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity_toolchain.py
          python -m ruff check aura_unified_memory_continuity_toolchain.py
          python -m ruff check --select F821,E9 \
            aura_architect_council_v3.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity_toolchain.py

      - name: Compile and run focused regression suite
        shell: bash
        run: |
          python -m py_compile \
            aura_unified_memory_continuity_toolchain.py \
            aura_architect_council_v3.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity_toolchain.py
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_forge.py \
            tests/test_aura_arena_persistence_adapters.py

      - name: Run focused Coding Waboose review
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('.aura/waboose_requests/unified_memory_continuity.v1.json')
          request = json.loads(source.read_text(encoding='utf-8'))
          request['changed_files'] = [
              'aura_unified_memory_continuity.py',
              'aura_unified_memory_continuity_toolchain.py',
              'aura_agent_arena_bridge.py',
              'aura_agent_arena_mcp.py',
              'aura_architect_council_v3.py',
              'aura_arena_persistence_adapters.py',
              'aura_forge.py',
              'tests/test_aura_unified_memory_continuity.py',
              'tests/test_aura_unified_memory_continuity_toolchain.py',
          ]
          Path('/tmp/pr198-waboose.json').write_text(
              json.dumps(request, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python aura_coding_waboose_cli.py run --request /tmp/pr198-waboose.json

      - name: Restore canonical transport and generated artifacts
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/ci.yml \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json
          git rm -f \
            .github/scripts/apply_pr198_review_fixes.py \
            .github/workflows/pr198-review-fixes.yml

      - name: Commit verified review fixes
        shell: bash
        run: |
          git config user.name "AuraOS Refactor Harness"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            aura_unified_memory_continuity_toolchain.py \
            aura_architect_council_v3.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity_toolchain.py
          git diff --cached --check
          git commit -m "fix: resolve unified memory continuity review findings"
          git push origin HEAD:refactor/unified-memory-continuity-completion
