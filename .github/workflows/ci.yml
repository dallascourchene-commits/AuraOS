name: AuraOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: aura-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  focused-contracts:
    name: Focused contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile governed contract modules
        run: |
          python -m py_compile \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_vsa_encoding_profile.py \
            aura_polysynthetic_intent.py \
            aura_route_capsule_types.py \
            aura_route_capsule_registry.py \
            aura_route_capsule_compiler.py \
            aura_route_capsule_binding.py \
            aura_codemap_verify.py \
            aura_model_cognome.py \
            aura_dikwp_router_pipeline.py \
            aura_model_cognome_store.py \
            aura_model_cognome_store_schema.py \
            aura_model_cognome_store_records.py \
            aura_model_cognome_store_io.py \
            aura_bilateral_intent_ingestion.py \
            aura_intent_refinement.py \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py
      - name: Validate Gate Dialogue JavaScript syntax
        run: node --check aura_showcase/gate-dialogue.js
      - name: Fatal lint checks
        id: fatal_lint
        continue-on-error: true
        run: |
          set +e
          ruff check --select E9,F63,F7,F82 \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            aura_arena_wfst_runtime.py \
            aura_arena_crucible.py \
            aura_crucible_types.py \
            aura_crucible_miner.py \
            aura_crucible_validation.py \
            aura_crucible_store.py \
            aura_crucible_cli.py \
            aura_vsa_encoding_profile.py \
            aura_polysynthetic_intent.py \
            aura_route_capsule_types.py \
            aura_route_capsule_registry.py \
            aura_route_capsule_compiler.py \
            aura_route_capsule_binding.py \
            aura_codemap_verify.py \
            aura_model_cognome.py \
            aura_dikwp_router_pipeline.py \
            aura_model_cognome_store.py \
            aura_model_cognome_store_schema.py \
            aura_model_cognome_store_records.py \
            aura_model_cognome_store_io.py \
            aura_bilateral_intent_ingestion.py \
            aura_intent_refinement.py \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_model_cognome.py \
            tests/test_aura_dikwp_router_pipeline.py \
            tests/test_aura_model_cognome_store.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_aura_intent_refinement.py \
            tests/test_bilateral_intent_pr1_evidence.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            > fatal-ruff-output.txt 2>&1
          code=$?
          set -e
          cat fatal-ruff-output.txt
          printf '%s\n' "${code}" > fatal-ruff-exit-code.txt
          exit "${code}"
      - name: Upload fatal lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatal-ruff-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            fatal-ruff-output.txt
            fatal-ruff-exit-code.txt
          if-no-files-found: error
          retention-days: 14
      - name: Run focused governed contract tests
        id: focused_tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arena_live_cli.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py \
            tests/test_aura_model_cognome.py \
            tests/test_aura_dikwp_router_pipeline.py \
            tests/test_aura_model_cognome_store.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_aura_intent_refinement.py \
            tests/test_bilateral_intent_pr1_evidence.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            --junitxml=focused-tests-junit.xml \
            > focused-tests-output.txt 2>&1
          code=$?
          set -e
          cat focused-tests-output.txt
          printf '%s\n' "${code}" > focused-tests-exit-code.txt
          exit "${code}"
      - name: Upload focused pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-pytest-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            focused-tests-output.txt
            focused-tests-junit.xml
            focused-tests-exit-code.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce focused verification
        if: steps.fatal_lint.outcome != 'success' || steps.focused_tests.outcome != 'success'
        run: |
          echo "Fatal lint or focused governed tests failed. Inspect the preserved diagnostics."
          exit 1

  full-pytest-suite:
    name: Full pytest-native suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"
      - name: Run all pytest-native tests
        id: full_pytest
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q --disable-warnings --maxfail=1 \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --deselect=tests/test_aura_human_agent_arena.py::test_affordance_map_declares_source_of_truth \
            --junitxml=full-pytest-junit.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pytest-junit-${{ github.run_id }}
          path: full-pytest-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce pytest result
        if: steps.full_pytest.outcome != 'success'
        run: |
          echo "The pytest-native suite failed. Inspect the uploaded JUnit artifact."
          exit 1

  legacy-validator:
    name: Legacy validator (${{ matrix.script }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script:
          - test_aura_functions.py
          - test_synthesis_upgrades.py
          - test_syntax_fixes.py
          - test_codemap_hooks_simple.py
          - test_pvm_logic.py
          - test_aura_substrate.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run validator through its intended entry point
        id: validator
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p legacy-validator-report
          set +e
          timeout 1200 python "${{ matrix.script }}" \
            > legacy-validator-report/output.log 2>&1
          code=$?
          set -e
          printf '%s\n' "${code}" > legacy-validator-report/exit_code
          printf '%s\n' "${{ matrix.script }}" > legacy-validator-report/script
          exit "${code}"
      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.script }}-${{ github.run_id }}
          path: legacy-validator-report/
          if-no-files-found: error
          retention-days: 14
      - name: Enforce validator result
        if: steps.validator.outcome != 'success'
        run: |
          echo "${{ matrix.script }} failed. Inspect its uploaded report."
          exit 1

  topology:
    name: Regenerate and verify CODEMAP topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Preserve committed CODEMAP snapshot
        run: cp .aura/CODEMAP.json "${RUNNER_TEMP}/CODEMAP.committed.json"
      - name: Regenerate deep CODEMAP
        run: python aura_codebase_navigator.py
      - name: Upload regenerated CODEMAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-codemap-${{ github.run_id }}
          path: |
            .aura/CODEMAP.md
            .aura/CODEMAP.json
            topology_map.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify topology and stable committed structure
        run: python -m aura_codemap_verify --compare-json "${RUNNER_TEMP}/CODEMAP.committed.json"

  eki-read-currentness-proof:
    name: EKI read currentness exact proof
    if: github.event_name == 'push' && github.ref_name == 'feature/arena-eki-read-currentness-hosted-proof-20260831-sol'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR735_HEAD: 89a66cdb972d3eab19c9408356b7061d1529947d
      PR735_RUN: '33417664825'
      WP03_HEAD: 9865c42f3ada2520141bd2fe30a439ce160ce2f8
      WP03_RUN: '33416056653'
      CANDIDATE_SOURCE_BLOB: fed7003630487af41586ce07a00b83b8fbf66835
      WP03_SOURCE_BLOB: 53de9d551c81a0eb495eb180294c0aba5eb359d0
      READ_GUARD_SOURCE_BLOB: 7dfaaf755a802e0a20a23ce06ba520fe47028f56
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Authenticate exact semantic surfaces
        run: |
          set -euo pipefail
          test "$(git hash-object tools/aura_external_knowledge_coordinate_memory_candidate.py)" = "$CANDIDATE_SOURCE_BLOB"
          test "$(git hash-object tools/aura_external_cognition_resolve_adapter.py)" = "$WP03_SOURCE_BLOB"
          test "$(git hash-object tools/aura_external_knowledge_coordinate_memory_read_guard.py)" = "$READ_GUARD_SOURCE_BLOB"
          grep -q 'CURRENT_REFERENCE@Projection!=Current@Read' tools/aura_external_knowledge_coordinate_memory_read_guard.py
          grep -q 'Required(source)+NOT_REQUIRED(source)=>FailClosed' tools/aura_external_knowledge_coordinate_memory_read_guard.py
      - name: Revalidate exact hosted parent generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          expected=((int(os.environ['PR735_RUN']),os.environ['PR735_HEAD'],'Aura EKI Coordinate Memory Candidate'),(int(os.environ['WP03_RUN']),os.environ['WP03_HEAD'],'Aura External Cognition Resolve Adapter'))
          for run_id,head,name in expected:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response: run=json.load(response)
              assert run['head_sha']==head,(run_id,run['head_sha'],head)
              assert run['name']==name,(run_id,run['name'],name)
              assert run['status']=='completed' and run['conclusion']=='success'
          print('EKIR1_PARENTS_EXACT_GREEN=true')
          PY
      - name: Replay candidate reader and read-currentness adversarials
        run: |
          set -euo pipefail
          python -m py_compile tools/aura_external_knowledge_coordinate_memory_candidate.py tools/aura_external_cognition_resolve_adapter.py tools/aura_external_knowledge_coordinate_memory_read_guard.py tests/test_aura_external_knowledge_coordinate_memory_candidate.py tests/test_aura_external_cognition_resolve_adapter.py tests/test_aura_external_knowledge_coordinate_memory_read_guard.py
          python -m unittest tests.test_aura_external_knowledge_coordinate_memory_candidate tests.test_aura_external_cognition_resolve_adapter tests.test_aura_external_knowledge_coordinate_memory_read_guard -v
      - name: Independently prove use-time source currentness gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.aura_external_cognition_resolve_adapter import CurrentnessStatus, ResolveDisposition
          from tools.aura_external_knowledge_coordinate_memory_candidate import project_external_knowledge_candidate
          from tools.aura_external_knowledge_coordinate_memory_read_guard import resolve_with_read_currentness
          from tests.test_aura_external_knowledge_coordinate_memory_read_guard import current_node, materialize, guarded, context
          candidate=project_external_knowledge_candidate(node=current_node()).candidate
          assert candidate is not None
          snapshot_bytes,adapter=materialize(candidate)
          contract=guarded(candidate,snapshot_bytes)
          missing=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context())
          assert missing.disposition is ResolveDisposition.SOURCE_REVALIDATION_REQUIRED
          stale=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.STALE))
          assert stale.disposition is ResolveDisposition.CURRENTNESS_REOPEN
          current=resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.RESOLVED_CURRENT))
          assert current.disposition is ResolveDisposition.FOUND_VERIFIED
          assert current.candidate is not None
          assert current.candidate.source_currentness == CurrentnessStatus.RESOLVED_CURRENT.value
          assert current.candidate.instruction_authority is False and current.candidate.write_authority is False and current.candidate.effect_authority is False
          try:
              resolve_with_read_currentness(adapter=adapter,contract=contract,context=context(CurrentnessStatus.NOT_REQUIRED))
          except ValueError as exc:
              assert str(exc)=='EKI_READ_REQUIRED_SOURCE_AXIS_CANNOT_BE_NOT_REQUIRED'
          else:
              raise AssertionError('NOT_REQUIRED must fail closed')
          print('CURRENT_REFERENCE_AT_PROJECTION_NE_CURRENT_AT_READ=true')
          print('MISSING_SOURCE_REVALIDATION_REQUIRED=true')
          print('STALE_SOURCE_REOPENS=true')
          print('CURRENT_SOURCE_RETURNS_CANDIDATE_ONLY=true')
          print('NOT_REQUIRED_FAILS_CLOSED=true')
          print('K27_NE_SOURCE_CURRENTNESS=true')
          PY

  sync-codemap:
    name: Synchronize CODEMAP on refactor branches
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/refactor/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regenerate and validate CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit synchronized navigation artifacts
        run: |
          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          if git diff --cached --quiet; then
            echo "CODEMAP is already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize CODEMAP for P1.1 authority contracts"
          git push origin HEAD:${{ github.ref_name }}
