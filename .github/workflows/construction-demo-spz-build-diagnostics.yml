name: Construction Demo SPZ Build Diagnostics

on:
  pull_request:
    paths:
      - ".aura/run-construction-spz-diagnostics"
      - ".github/workflows/construction-demo-spz-build-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: construction-demo-spz-build-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-spz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public branch without credentials
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/dallascourchene-commits/AuraOS.git
          git -c protocol.version=2 fetch --depth=1 origin \
            work/construction-arena-real-asset-pack-g4-20260722
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve exact SPZ tag and install declared prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "nanobind>=2.7.0,<3.0" \
            "scikit-build-core>=0.10.7,<1.0" \
            "cmake>=3.30,<5.0" \
            "ninja>=1.11,<2.0" \
            "python_devtools"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def fetch(url: str):
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "AuraOS-Construction-SPZ-Diagnostics/1",
                  },
              )
              with urlopen(request, timeout=45) as response:
                  return json.load(response)

          ref = fetch("https://api.github.com/repos/nianticlabs/spz/git/ref/tags/v3.0.0")
          obj = ref["object"]
          if obj["type"] == "tag":
              obj = fetch(obj["url"])["object"]
          if obj["type"] != "commit":
              raise SystemExit(f"SPZ tag did not resolve to commit: {obj}")
          Path(os.environ["RUNNER_TEMP"], "spz-commit.txt").write_text(obj["sha"])
          print(json.dumps({"tag": "v3.0.0", "commit_sha": obj["sha"]}, indent=2))
          PY
          SPZ_COMMIT_SHA="$(cat "${RUNNER_TEMP}/spz-commit.txt")"
          git clone --filter=blob:none --no-checkout \
            https://github.com/nianticlabs/spz.git "${RUNNER_TEMP}/spz"
          git -C "${RUNNER_TEMP}/spz" checkout --detach "${SPZ_COMMIT_SHA}"
          git -C "${RUNNER_TEMP}/spz" submodule update --init --recursive --depth 1
          test "$(git -C "${RUNNER_TEMP}/spz" rev-parse HEAD)" = "${SPZ_COMMIT_SHA}"

      - name: Build SPZ and capture full log
        id: spz_build
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install --verbose --no-build-isolation "${RUNNER_TEMP}/spz" \
            2>&1 | tee "${RUNNER_TEMP}/spz-build.log"

      - name: Capture environment and repository metadata
        if: always()
        run: |
          set -euo pipefail
          {
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version 2>&1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "ninja=$(ninja --version)"
            echo "compiler=$(c++ --version | head -1)"
            echo "tag=v3.0.0"
            echo "commit=$(cat "${RUNNER_TEMP}/spz-commit.txt" 2>/dev/null || true)"
            echo "tree:" 
            find "${RUNNER_TEMP}/spz" -maxdepth 2 -type f -printf '%P\n' | sort | head -200
          } > "${RUNNER_TEMP}/spz-environment.txt"

      - name: Upload complete SPZ diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-spz-build-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/spz-build.log
            ${{ runner.temp }}/spz-environment.txt
          retention-days: 3
          if-no-files-found: error

      - name: Enforce successful SPZ build
        if: steps.spz_build.outcome != 'success'
        run: exit 1

      - name: Verify SPZ import
        if: steps.spz_build.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          import spz
          print(json.dumps({"spz_module": spz.__file__}, indent=2, sort_keys=True))
          PY
