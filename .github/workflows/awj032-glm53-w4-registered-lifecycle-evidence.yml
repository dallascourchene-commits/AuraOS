name: AWJ032 GLM53 W4 registered lifecycle evidence

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_w4_host_preflight.py"
      - "tools/awj032/glm53_w4_cache_policy_decision.py"
      - "tools/awj032/glm53_w4_owner_host_measurement_admission.py"
      - "tools/awj032/glm53_w4_registered_lifecycle_evidence.py"
      - "tools/awj032/test_glm53_w4_registered_lifecycle_evidence.py"
      - ".github/workflows/awj032-glm53-w4-registered-lifecycle-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj032-glm53-w4-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  registered-lifecycle-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile lifecycle proof plane
        run: |
          python -m py_compile \
            tools/awj032/glm53_w4_host_preflight.py \
            tools/awj032/glm53_w4_cache_policy_decision.py \
            tools/awj032/glm53_w4_owner_host_measurement_admission.py \
            tools/awj032/glm53_w4_registered_lifecycle_evidence.py \
            tools/awj032/test_glm53_w4_registered_lifecycle_evidence.py
      - name: Run W4 inherited and lifecycle registry regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/awj032
        run: |
          python -m unittest -v \
            tools.awj032.test_glm53_w4_host_preflight \
            tools.awj032.test_glm53_w4_cache_policy_decision \
            tools.awj032.test_glm53_w4_owner_host_measurement_admission \
            tools.awj032.test_glm53_w4_registered_lifecycle_evidence
      - name: Prove production lifecycle path remains producer-gated
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/awj032
        run: |
          python - <<'PY'
          import inspect
          from tools.awj032.glm53_w4_registered_lifecycle_evidence import (
              TRUSTED_LIFECYCLE_MEASUREMENT_REGISTRY,
              admit_registered_lifecycle_measurement,
              build_registered_cache_policy_observation,
          )
          assert dict(TRUSTED_LIFECYCLE_MEASUREMENT_REGISTRY) == {}
          assert tuple(inspect.signature(admit_registered_lifecycle_measurement).parameters) == (
              "lifecycle_receipt_ref", "expected_policy_id", "preflight", "host_admission"
          )
          params = tuple(inspect.signature(build_registered_cache_policy_observation).parameters)
          for forbidden in ("registry", "energy_joules", "lifecycle_metrics_attested", "measurement_current", "correctness_reference_equivalent"):
              assert forbidden not in params
          print("REAL_OWNER_HOST_LIFECYCLE_RECEIPT_PRESENT=false")
          print("REAL_W4_POLICY_WINNER_PROVEN=false")
          print("LIFECYCLE_BOUNDARY=LIFECYCLE_MEASUREMENT_PRODUCER_REQUIRED")
          PY
