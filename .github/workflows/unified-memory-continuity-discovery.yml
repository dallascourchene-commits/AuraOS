name: Unified Memory Continuity Discovery

on:
  push:
    branches:
      - refactor/unified-memory-continuity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-memory-continuity-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Record exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../AuraOS-unified-memory-continuity-discovery/commands
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "status_begin"
            git status --porcelain=v1
            echo "status_end"
            sha256sum .aura/CODEMAP.md .aura/CODEMAP.json 2>/dev/null || true
          } | tee ../AuraOS-unified-memory-continuity-discovery/repository_identity.txt

      - name: Prepare Aura architecture harness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            prepare \
            --venv ../.AuraOS-architecture-harness-venv \
            --install-requirements \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/harness_prepare.log

      - name: Diagnose Aura architecture harness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            doctor \
            --venv ../.AuraOS-architecture-harness-venv \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/harness_doctor.log

      - name: Export AI-safe source handoff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            handoff \
            --output-dir ../AuraOS-unified-memory-continuity-discovery/handoff \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/harness_handoff.log

      - name: Run Aura-native discovery
        shell: bash
        run: |
          set -o pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            run \
            --venv ../.AuraOS-architecture-harness-venv \
            --objective "compile minimum sufficient model-relative Act Capsules and preserve verified continuity through prediction error and current reproof without duplicate memory or authority owners" \
            --combine-with Connectome "Relational Synthesis" Atlas \
            --atlas-profile MINIMAL \
            --output-dir ../AuraOS-unified-memory-continuity-discovery/architecture-run \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/harness_run.log
          status=${PIPESTATUS[0]}
          echo "harness_run_exit=${status}" | tee ../AuraOS-unified-memory-continuity-discovery/harness_run_status.txt
          if [[ "${status}" -ne 0 && "${status}" -ne 124 ]]; then
            exit "${status}"
          fi

      - name: Run navigation and persistence health
        shell: bash
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/navigator.log
          python aura_codebase_navigator.py --query "unified manufactured memory saturation, model-relative execution, prediction-error learning, continuity sensitivity, and learning-to-reproof" 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/navigator_query.log
          python -m aura_agent_arena_cli topology-health 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/topology_health.log
          python -m aura_agent_arena_cli stabilization-status 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/stabilization_status.log
          python -m aura_agent_arena_cli digest 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/agent_arena_digest.log
          python -m aura_persistence_cli --repo-root . verify-registry 2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/persistence_registry.log
          python -m aura_agent_arena_cli resolve-capabilities \
            --objective "compile minimum sufficient model-relative Act Capsules and learn only from independently verified prediction error without duplicate memory or authority owners" \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/capability_resolution.log

      - name: Run pre-mutation Coding Waboose
        shell: bash
        run: |
          set -euo pipefail
          cat > ../AuraOS-unified-memory-continuity-discovery/pre_mutation_waboose_request.json <<'JSON'
          {
            "objective": "Pre-mutation review of the unified manufactured-memory and continuity refactor: locate canonical owners, duplicate risks, learning-to-reproof gaps, authority hazards, protected pathways, and required tests before implementation.",
            "mode": "files",
            "profile": "precision",
            "changed_files": [
              "aura_runtime_intent_packet.py",
              "aura_coding_arena_planning.py",
              "aura_architect_loop.py",
              "aura_coding_relationship_compass.py",
              "aura_relationship_atlas.py",
              "aura_relationship_experience.py",
              "aura_qdkt_observations.py",
              "aura_model_cognome_store.py",
              "aura_adaptive_model_router.py",
              "aura_agent_arena_bridge.py",
              "aura_forge.py",
              "aura_coding_waboose.py"
            ],
            "risk_map": [
              "duplicate_truth_owner",
              "duplicate_memory_owner",
              "authority_expansion",
              "stale_repository_identity",
              "prediction_rewrite_after_observation",
              "self_verification",
              "model_profile_drift",
              "negative_transfer",
              "compression_evidence_loss",
              "learning_without_current_reproof"
            ],
            "invariants": [
              "Canonical human intent survives model-specific prompt compilation",
              "P0 is committed before P1 is observed",
              "Cross-model disagreement is an uncertainty signal and never voting authority",
              "Continuity receipts remain proposal-only and reference raw exact evidence",
              "Learning requires Crucible proposal, current reproof, independent verification, and human or community disposition",
              "No new memory, truth, routing, verification, policy, publication, or merge authority plane is created",
              "Waboose, models, summaries, semantic similarity, and compact frames never gain patch or promotion authority"
            ],
            "run_tests": false
          }
          python aura_coding_waboose_cli.py run \
            --request ../AuraOS-unified-memory-continuity-discovery/pre_mutation_waboose_request.json \
            2>&1 | tee ../AuraOS-unified-memory-continuity-discovery/commands/waboose_pre_mutation.log

      - name: Prove repository remained unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain=v1 | tee ../AuraOS-unified-memory-continuity-discovery/final_status.txt
          test ! -s ../AuraOS-unified-memory-continuity-discovery/final_status.txt

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-discovery-${{ github.sha }}
          path: ../AuraOS-unified-memory-continuity-discovery
          if-no-files-found: warn
          retention-days: 14
