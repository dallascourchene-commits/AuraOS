name: Aura Four-Tab Render Demo

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.coding-arena"
      - "render.yaml"
      - "aura_showcase/**"
      - "aura_showcase_server.py"
      - "tests/test_render_four_tab_deployment.py"
      - ".github/workflows/render-four-tab-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-tab-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest ruff
      - run: python -m py_compile tests/test_render_four_tab_deployment.py
      - run: ruff check --select E9,F63,F7,F82 tests/test_render_four_tab_deployment.py
      - run: python -m pytest -q tests/test_render_four_tab_deployment.py

  render-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build default Render image
        run: docker build -t auraos-render-four-tab .
      - name: Launch and verify all four tabs
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name auraos-render-four-tab -p 10000:10000 -e PORT=10000 auraos-render-four-tab
          cleanup() {
            docker logs auraos-render-four-tab || true
            docker stop auraos-render-four-tab >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:10000"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(base + "/api/showcase/status", timeout=2) as response:
                      status = json.load(response)
                  if status.get("ok"):
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("unified showcase did not become ready")

          with urllib.request.urlopen(base + "/", timeout=5) as response:
              index = response.read().decode("utf-8")

          labels = (
              "Civic Arena",
              "Human Agent Coding Arena",
              "Aura Observatory",
              "Learning Arena / Crucible",
          )
          for label in labels:
              assert label in index, label

          assert status["observatory_available"] is True
          assert status["learning_arena_available"] is True
          assert status["human_gate_dialogue_available"] is True
          print(json.dumps({"ok": True, "tabs": labels}))
          PY
