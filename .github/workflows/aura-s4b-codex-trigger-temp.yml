name: Aura Temporary S4-B Codex Repair Export

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/aura-s4b-codex-trigger-temp.yml"

permissions:
  contents: read

concurrency:
  group: aura-s4b-codex-repair-export
  cancel-in-progress: false

jobs:
  export-verified-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 1
          submodules: false

      - name: Apply deterministic Codex repair
        run: |
          set -euo pipefail
          python scripts/aura_s4b_codex_repair_temp.py
          git diff --check
          python -m py_compile \
            aura_spatial_importers/gaussian_gltf.py \
            tests/test_aura_spatial_gaussian_gltf.py
          node --check aura_spatial_web/gaussian_renderer.js
          node --check tests/js/spatial-gaussian.test.mjs

      - name: Package verified repaired files
        run: |
          set -euo pipefail
          mkdir -p /tmp/s4b-repair/aura_spatial_importers
          mkdir -p /tmp/s4b-repair/aura_spatial_web
          mkdir -p /tmp/s4b-repair/tests/js
          cp aura_spatial_importers/gaussian_gltf.py /tmp/s4b-repair/aura_spatial_importers/
          cp aura_spatial_web/gaussian_renderer.js /tmp/s4b-repair/aura_spatial_web/
          cp tests/test_aura_spatial_gaussian_gltf.py /tmp/s4b-repair/tests/
          cp tests/js/spatial-gaussian.test.mjs /tmp/s4b-repair/tests/js/

      - uses: actions/upload-artifact@v4
        with:
          name: s4b-codex-repair-files
          path: /tmp/s4b-repair
          if-no-files-found: error
          retention-days: 1
