name: Aura Temporary S4-B Codex Repair Publisher

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/aura-s4b-codex-trigger-temp.yml"

permissions:
  contents: write

concurrency:
  group: aura-s4b-codex-repair-publisher
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Apply exact Codex findings and regressions
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py.gz.b64 <<'EOF'
          
          EOF
          base64 --decode /tmp/repair.py.gz.b64 > /tmp/repair.py.gz
          echo "aa773386214919fd3b9c46afdef4d78b4a153d4d7232f0f73cb2bbf241b01d16  /tmp/repair.py.gz" | sha256sum --check --strict
          gzip -dc /tmp/repair.py.gz > /tmp/repair.py
          echo "35e020ca3864e389a447a34a7c437e90d7ad821d0b5a73b0d404968a3e78225f  /tmp/repair.py" | sha256sum --check --strict
          python /tmp/repair.py
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify repaired S4-B source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy
          python -m py_compile aura_spatial_importers/gaussian_gltf.py
          ruff check aura_spatial_importers/gaussian_gltf.py tests/test_aura_spatial_gaussian_gltf.py
          ruff format --check aura_spatial_importers/gaussian_gltf.py tests/test_aura_spatial_gaussian_gltf.py
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_spz.py
          node --test tests/js/spatial-gaussian.test.mjs tests/js/spatial-mixed-scene.test.mjs
          npm run test:spatial

      - name: Commit permanent repair and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/spatial-s4b-gaussian-security"
          git config user.name "Aura Spatial Review"
          git config user.email "aura-spatial-review@users.noreply.github.com"
          git rm -f \
            .github/workflows/aura-s4b-codex-trigger-temp.yml \
            .github/workflows/aura-s4b-codex-round-temp.yml
          git add \
            aura_spatial_importers/gaussian_gltf.py \
            aura_spatial_web/gaussian_renderer.js \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/js/spatial-gaussian.test.mjs
          git diff --cached --check
          git commit -m "fix: complete S4-B Codex preflight and cleanup hardening"
          git fetch --no-tags origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
