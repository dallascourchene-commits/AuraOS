name: K27 Cross-ISA Hamming Replay

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  exact-two-parent-replay:
    runs-on: ubuntu-latest
    env:
      SEMANTIC_SHA: 75347bbac820b9ed0ec9a60ad225252db6f0876d
      PR613_SHA: 9f6d324f0b5650544310b22e13db8d3959e9b7c1
      PR613_RUN: "33365472682"
      PR623_SHA: 84524fbe907e5d78db1bb257e448f34ff7fbfe02
      PR623_RUN: "33366346680"
      CORPUS_SHA256: 30014dc3d6e16454a41c91599460dddb2b72aa947fbf297f7b6985e543884b85
      MAP_SHA256: 471fe69d6247d90991629386a39226d3ca57a17a25890e44a83ffe8babcf0c16
    steps:
      - name: Fetch exact child head and both exact parents
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git -c http.extraheader="$AUTH" fetch --no-tags --depth=1 origin "$PR613_SHA" "$PR623_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Prove exact semantic two-parent convergence and bounded generated drift
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          semantic = os.environ["SEMANTIC_SHA"]
          target = os.environ["TARGET_SHA"]
          expected = [os.environ["PR623_SHA"], os.environ["PR613_SHA"]]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          commit = get(f"https://api.github.com/repos/{repo}/git/commits/{semantic}")
          parents = [p["sha"] for p in commit["parents"]]
          assert parents == expected, (parents, expected)

          if target != semantic:
              compare = get(
                  f"https://api.github.com/repos/{repo}/compare/"
                  f"{urllib.parse.quote(semantic, safe='')}...{urllib.parse.quote(target, safe='')}"
              )
              assert compare["status"] in {"ahead", "identical"}, compare["status"]
              assert compare["merge_base_commit"]["sha"] == semantic, compare["merge_base_commit"]["sha"]
              allowed = {".aura/CODEMAP.json", ".aura/CODEMAP.md", ".github/workflows/k27-cross-isa-hamming-replay.yml"}
              changed = {f["filename"] for f in compare.get("files", [])}
              assert changed <= allowed, changed
              print("GENERATED_OR_PROOF_ONLY_HEAD_DRIFT=true")
          else:
              print("GENERATED_OR_PROOF_ONLY_HEAD_DRIFT=false")

          print("TRUE_TWO_PARENT_SEMANTIC_CONVERGENCE=true")
          print("SHALLOW_LOCAL_HISTORY_NE_COMMIT_PARENT_TRUTH=true")
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Revalidate exact parent hosted generations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          for sha_key, run_key in (("PR613_SHA", "PR613_RUN"), ("PR623_SHA", "PR623_RUN")):
              sha = os.environ[sha_key]
              run = os.environ[run_key]
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              assert data["head_sha"] == sha, (run, data["head_sha"], sha)
              assert data["status"] == "completed" and data["conclusion"] == "success", data
              print(f"PARENT_RUN_OK={run}:{sha}")
          PY

      - name: Prove frozen corpus, canonical wire and exact PR623 replay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/k27_cross_isa_hamming_replay.py tests/test_k27_cross_isa_hamming_replay.py
          python -m unittest -v tests.test_k27_cross_isa_hamming_replay
          python tools/k27_cross_isa_hamming_replay.py --verify-pr623
          mkdir -p /tmp/k27-replay
          python tools/k27_cross_isa_hamming_replay.py --emit-tsv /tmp/k27-replay/corpus.tsv

      - name: Replay exact PR613 source on the same eight vectors
        shell: bash
        run: |
          set -euo pipefail
          git show "$PR613_SHA":tools/k27_thinkpad_simd_capability.cpp > /tmp/k27-replay/pr613_exact.cpp
          cp tests/fixtures/k27_cross_isa_pr613_replay.cpp /tmp/k27-replay/replay.cpp
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic /tmp/k27-replay/replay.cpp -o /tmp/k27-replay/replay
          /tmp/k27-replay/replay /tmp/k27-replay/corpus.tsv | tee /tmp/k27-replay/pr613.tsv

      - name: Emit cross-ISA replay receipt and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python tools/k27_cross_isa_hamming_replay.py --receipt /tmp/k27-replay/pr613.tsv | tee /tmp/k27-replay/receipt.json
          python - <<'PY'
          import json
          r = json.load(open("/tmp/k27-replay/receipt.json", encoding="utf-8"))
          assert r["cross_isa_consequence_agreement"] is True
          assert r["canonical_wire_map_self_consistent"] is True
          for key in (
              "pr613_native_wire_compatibility_proven",
              "pr623_native_wire_compatibility_proven",
              "compiler_abi_compatibility_proven",
              "architectural_register_compatibility_proven",
              "riscv_simulator_execution_proven",
              "rtl_implementation_proven",
              "hardware_performance_equality_proven",
              "semantic_k27_authority_proven",
              "effect_authority_proven",
              "native_private_transformer_kv_accessed",
              "gate10_promoted",
          ):
              assert r[key] is False, key
          print("CROSS_ISA_CONSEQUENCE_AGREEMENT=true")
          print("CANONICAL_WIRE_MAP_SELF_CONSISTENT=true")
          print("ABI_HARDWARE_PERFORMANCE_EFFECT_AUTHORITY=false")
          PY
