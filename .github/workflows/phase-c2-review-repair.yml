name: Adaptive Router CODEMAP Finalizer Once

on:
  push:
    branches:
      - refactor/model-cognome-live-compat

permissions:
  contents: write

concurrency:
  group: adaptive-router-codemap-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Restore permanent workflow and validate adaptive contracts
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-c2-review-repair.yml
          python -m py_compile \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py
          ruff check --select E9,F63,F7,F82 \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py \
            tests/test_aura_ai_router_dynamic.py tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py tests/test_aura_adaptive_security.py
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py
      - name: Regenerate and verify clean CODEMAP
        run: |
          set -euo pipefail
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --deep \
            --out .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md
          cp .aura/CODEMAP.json /tmp/CODEMAP.first.json
          cp .aura/CODEMAP.md /tmp/CODEMAP.first.md
          python aura_codebase_navigator.py \
            --deep \
            --out .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md
          python aura_phase_c2_codemap_verify.py \
            --committed-json /tmp/CODEMAP.first.json \
            --generated-json .aura/CODEMAP.json \
            --committed-markdown /tmp/CODEMAP.first.md \
            --generated-markdown .aura/CODEMAP.md
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
      - name: Commit final clean tree
        run: |
          set -euo pipefail
          git config user.name "Aura Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/phase-c2-review-repair.yml \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No CODEMAP update required"
            exit 0
          fi
          git commit -m "Refresh CODEMAP for adaptive router compatibility"
          git push origin HEAD:refactor/model-cognome-live-compat
