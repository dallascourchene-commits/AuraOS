name: AURA-ADOPT ZF-02 Android Provisioner

on:
  pull_request:
    paths:
      - 'tools/aura_adopt/android_adaptive_provisioner.py'
      - 'tools/aura_adopt/test_android_adaptive_provisioner.py'
      - '.github/workflows/aura-adopt-zf02.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-provisioner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/aura_adopt/android_adaptive_provisioner.py tools/aura_adopt/test_android_adaptive_provisioner.py
      - name: Focused regressions
        run: python -m unittest -v tools.aura_adopt.test_android_adaptive_provisioner
