name: CS Arena Sync AS-04 local outbox

on:
  pull_request:
    paths:
      - "aura_local_artifact_outbox.py"
      - "aura_arena_artifact_event_core.py"
      - "tests/test_aura_local_artifact_outbox.py"
      - "tests/test_aura_arena_artifact_event_core.py"
      - ".github/workflows/cs-arena-sync-as04.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-as04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile staged modules
        run: python -m py_compile aura_arena_artifact_event_core.py aura_local_artifact_outbox.py
      - name: Run AS-02 inherited and AS-04 focused tests
        run: python -m unittest tests.test_aura_arena_artifact_event_core tests.test_aura_local_artifact_outbox
