name: Aura WorkCapsule Observation-Bound Closure

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - 'scripts/aura_workcapsule_reentry_closure.py'
      - 'tests/test_aura_workcapsule_reentry_closure.py'
      - 'scripts/aura_workcapsule_observation_bound_closure.py'
      - 'tests/test_aura_workcapsule_observation_bound_closure.py'
      - '.github/workflows/aura-workcapsule-observation-bound-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-bound-closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR509 source observation owner
        run: |
          python3 -m py_compile scripts/aura_source_anchor_map.py scripts/aura_astge_anchor_hydration.py scripts/aura_workcapsule_source_reentry_observation.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration
          python3 -m unittest -v tests.test_aura_workcapsule_source_reentry_observation

      - name: Re-prove PR512 closure owner
        run: |
          python3 -m py_compile scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py scripts/aura_workcapsule_reentry_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_context_binding
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_invalidation
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure

      - name: Prove observation-bound closure membrane
        run: |
          python3 -m py_compile scripts/aura_workcapsule_observation_bound_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_observation_bound_closure

      - name: Assert caller candidate escape hatch is absent
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_observation_bound_closure import compile_observation_bound_reentry_closure
          params = inspect.signature(compile_observation_bound_reentry_closure).parameters
          assert 'candidate_binding' not in params
          assert 'root' in params and 'witness_manifest' in params and 'candidate_graph_witness' in params
          print('CALLER_CANDIDATE_BINDING_PARAMETER_PRESENT=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'SOURCE_CANDIDATE_DERIVED_FROM_RAW_CURRENTNESS_INPUTS=true'
          echo 'CALLER_CANDIDATE_BINDING_ACCEPTED=false'
          echo 'PR509_SOURCE_OBSERVATION_REUSED=true'
          echo 'PR512_CLOSURE_OWNER_REUSED=true'
          echo 'SOURCE_GENERATION_DOMAIN_PRESERVED=true'
          echo 'GRAPH_WITNESS_PRODUCER_PROVEN=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
