name: BugHound authority registry consumer (superseded historical challenger)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-challenger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Historical-only notice
        run: |
          echo "SUPERSEDED_BY_PR433=true"
          echo "NO_CURRENT_PROOF_OWNERSHIP=true"
