name: K27 Projection Format Diagnostic

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-post-edit-canonical-projection/**"
      - ".github/workflows/k27-projection-format-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Format projection working tree
        run: cargo fmt --manifest-path crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml

      - name: Test formatted projection
        run: |
          cargo test --manifest-path crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-post-edit-canonical-projection/Cargo.toml --all-targets -- -D warnings

      - name: Stage formatted files
        if: always()
        run: |
          mkdir -p /tmp/k27-projection-formatted/src /tmp/k27-projection-formatted/tests/common
          cp crates/aura-k27-astge-post-edit-canonical-projection/src/lib.rs /tmp/k27-projection-formatted/src/lib.rs
          cp crates/aura-k27-astge-post-edit-canonical-projection/tests/projection.rs /tmp/k27-projection-formatted/tests/projection.rs
          cp crates/aura-k27-astge-post-edit-canonical-projection/tests/common/mod.rs /tmp/k27-projection-formatted/tests/common/mod.rs
          git diff -- crates/aura-k27-astge-post-edit-canonical-projection > /tmp/k27-projection-formatted/rustfmt.diff || true

      - name: Upload formatter diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k27-projection-formatted
          path: /tmp/k27-projection-formatted
          if-no-files-found: error
