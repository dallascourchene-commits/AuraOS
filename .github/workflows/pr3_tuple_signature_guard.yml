name: PR3 tuple signature guard
on:
  push:
    branches:
      - analysis/pr3-tuple-api-signatures
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-first-project-context-pr3
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aura_project_context_compiler.py
            aura_ephemeral_workspace_contracts.py
            aura_ephemeral_path_policy.py
            tests/test_aura_project_context_compiler.py
            tests/test_aura_project_context_acceptance.py
            schemas/aura_projection_selection_receipt_v1.schema.json
            docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
      - name: Check exact source
        run: test "$(git rev-parse HEAD)" = "94f7b9fa2a89ce9e8da3d67a9e1ce04a97c51a45"
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin analysis/pr3-tuple-api-signatures
          git show FETCH_HEAD:analysis_pr3_tuple_signature_patch.py > /tmp/pr3_tuple_signature_patch.py
          python /tmp/pr3_tuple_signature_patch.py
      - name: Install tools
        run: python -m pip install --quiet pytest jsonschema ruff
      - name: Verify focused PR3
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          python -m ruff check --select E9,F63,F7,F82 aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          python -m pytest -q tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
      - name: Publish verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aura PR3 Guarded Repair"
          git config user.email "actions@users.noreply.github.com"
          git add aura_project_context_compiler.py docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
          git commit -m "PR3: align public tuple input signatures"
          git fetch --depth=1 origin refactor/source-first-project-context-pr3
          test "$(git rev-parse FETCH_HEAD)" = "94f7b9fa2a89ce9e8da3d67a9e1ce04a97c51a45"
          git push origin HEAD:refactor/source-first-project-context-pr3
