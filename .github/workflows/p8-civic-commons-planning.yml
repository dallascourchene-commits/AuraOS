name: P8 Civic Commons Planning Board

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p8-civic-commons-planning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  focused-civic-planning:
    name: Civic Commons Planning Board (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "pytest>=8.0,<9.0" \
            "ruff>=0.9,<1.0"
      - name: Compile Civic, Planning Board, and P8 surfaces
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            aura_civic_authority.py \
            aura_civic_profiles.py \
            aura_civic_projects.py \
            aura_civic_runtime.py \
            aura_civic_result_projector.py \
            aura_civic_planning_types.py \
            aura_civic_planning_inventory.py \
            aura_civic_planning.py \
            aura_civic_planning_benchmark.py \
            tests/test_aura_civic_planning_projection.py \
            tests/test_aura_civic_planning_behavior.py \
            tests/test_aura_civic_planning_contracts.py \
            tests/test_aura_civic_planning_stress.py \
            tests/test_aura_civic_planning_inventory.py
      - name: Fatal and static correctness lint
        run: |
          ruff check --select E4,E7,E9,F --ignore E721 \
            aura_civic_planning_types.py \
            aura_civic_planning_inventory.py \
            aura_civic_planning.py \
            aura_civic_planning_benchmark.py \
            tests/test_aura_civic_planning_projection.py \
            tests/test_aura_civic_planning_behavior.py \
            tests/test_aura_civic_planning_contracts.py \
            tests/test_aura_civic_planning_stress.py \
            tests/test_aura_civic_planning_inventory.py
      - name: Run deterministic structural parity benchmark
        run: |
          python aura_civic_planning_benchmark.py \
            --output "p8-civic-planning-benchmark-${{ matrix.python-version }}.json" \
            --repeats 4
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_event_contracts import canonical_json

          files = tuple(Path('.').glob('p8-civic-planning-benchmark-*.json'))
          assert len(files) == 1
          text = files[0].read_text(encoding='utf-8')
          payload = json.loads(text)
          assert text == canonical_json(payload) + '\n'
          assert payload['version'] == 'AURA_CIVIC_PLANNING_BENCHMARK_P8'
          assert payload['measurement_class'] == 'EMPIRICAL_FIXTURE_WITH_HEURISTIC_TOKEN_PROXY'
          assert payload['total_cases'] == payload['passed_cases'] == 6
          assert payload['total_workstreams'] == payload['mapped_actions'] == 12
          assert payload['action_coverage'] == 1.0
          assert payload['deterministic_case_rate'] == 1.0
          assert payload['all_governance_blocked'] is True
          assert payload['mutation_drift_count'] == 0
          assert payload['authority_drift_count'] == 0
          assert payload['identifier_collision_count'] == 0
          assert payload['gate_passed'] is True
          assert payload['baseline_bytes'] > 0
          assert payload['candidate_bytes'] > 0
          assert payload['limitations']
          PY
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-civic-planning-benchmark-${{ matrix.python-version }}
          path: p8-civic-planning-benchmark-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Run focused and inherited Civic/Planning regressions
        id: focused-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_civic_planning_projection.py \
            tests/test_aura_civic_planning_behavior.py \
            tests/test_aura_civic_planning_contracts.py \
            tests/test_aura_civic_planning_stress.py \
            tests/test_aura_civic_planning_inventory.py \
            tests/test_aura_civic_commons_arena.py \
            tests/test_aura_civic_completion.py \
            tests/test_aura_civic_snapshots_and_store.py \
            tests/test_aura_showcase_guided_project.py \
            tests/test_aura_planning_board.py \
            > "p8-pytest-${{ matrix.python-version }}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "p8-pytest-${{ matrix.python-version }}.txt"
          exit 0
      - name: Upload diagnostics on failure
        if: steps.focused-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: p8-pytest-${{ matrix.python-version }}
          path: p8-pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce focused test result
        if: steps.focused-tests.outputs.status != '0'
        run: exit 1
