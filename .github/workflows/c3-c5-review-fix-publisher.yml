name: C3-C5 Review Fix Publisher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: c3-c5-review-fix-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c3-c5-20260721' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reconstruct, verify, and apply exact review patch
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=2 origin work/coding-relationship-compass-c3-c5-20260721
          git checkout -q -B work/coding-relationship-compass-c3-c5-20260721 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          BASE_HEAD=c8f09dc6ed60af5db5c7dde24413680a92466ba4
          test "$(git rev-parse HEAD^)" = "$BASE_HEAD"
          test "$(wc -c < .github/c3-c5-review-fixes.patch.gz.b64)" -eq 4840
          echo '68742ac7c605ff467295d7a9c6ec642cc5d38bdaaede9c36ba3a76e329a2ab9b  .github/c3-c5-review-fixes.patch.gz.b64' | sha256sum -c -
          base64 -d .github/c3-c5-review-fixes.patch.gz.b64 | gzip -d > /tmp/c3-c5-review-fixes.patch
          echo '54b999a9793b3af443d3b4dbbf0a4b0f9c3b7aeb24abee1a3aa63977243a28b9  /tmp/c3-c5-review-fixes.patch' | sha256sum -c -
          git reset --hard "$BASE_HEAD"
          git apply --index --whitespace=error-all /tmp/c3-c5-review-fixes.patch
          git diff --cached --check
          printf '%s\n' \
            aura_relational_index.py \
            aura_relationship_atlas.py \
            aura_relationship_contracts.py \
            tests/test_aura_relational_index.py \
            tests/test_aura_relationship_contracts.py \
            > /tmp/expected-files
          git diff --cached --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Verify C3-C5 review fixes
        run: |
          set -euo pipefail
          python3 -m venv /tmp/c3-c5-review-venv
          . /tmp/c3-c5-review-venv/bin/activate
          python -m pip install --quiet pytest==9.0.2 jsonschema==4.26.0 numpy==2.3.5
          python -m py_compile \
            aura_relationship_atlas.py \
            aura_relationship_contracts.py \
            aura_relational_index.py
          PYTHONPATH=. pytest -q \
            tests/test_aura_planning_board.py \
            tests/test_aura_coding_arena_planning.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_coding_waboose_breadboard.py \
            tests/test_aura_relational_index.py \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_relationship_contracts.py \
            test_aura_architect_loop.py \
            tests/test_aura_architecture_harness.py
      - name: Publish clean review-fix commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close C3-C5 review integrity gaps"
          NEW_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/work/coding-relationship-compass-c3-c5-20260721:$EXPECTED_HEAD \
            origin "$NEW_HEAD":refs/heads/work/coding-relationship-compass-c3-c5-20260721
