name: K27 ASTGE Mmap Lifecycle Contract

on:
  pull_request:
    paths:
      - 'tools/k27_astge_reference.py'
      - 'tools/k27_astge_mmap_lifecycle.py'
      - 'tests/test_k27_astge_reference.py'
      - 'tests/test_k27_astge_mmap_lifecycle.py'
      - '.github/workflows/k27-astge-mmap-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mmap-lifecycle:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run reference and lifecycle contracts
        run: |
          python -m py_compile \
            tools/k27_astge_reference.py \
            tools/k27_astge_mmap_lifecycle.py \
            tests/test_k27_astge_reference.py \
            tests/test_k27_astge_mmap_lifecycle.py
          PYTHONPATH=tools python -m unittest -v \
            tests/test_k27_astge_reference.py \
            tests/test_k27_astge_mmap_lifecycle.py
          PYTHONPATH=tools python tools/k27_astge_reference.py self-test
          PYTHONPATH=tools python - <<'PY'
          import os, tempfile
          import k27_astge_reference as ref
          import k27_astge_mmap_lifecycle as life
          with tempfile.TemporaryDirectory() as td:
              nodes = os.path.join(td, 'nodes')
              edges = os.path.join(td, 'edges')
              ref.serialize_graph(nodes, edges, ref.build_balanced_tree(4, 3))
              with life.LifecycleGuardedMmapGraphReader(nodes, edges) as reader:
                  receipt = reader.validate_generation()
                  assert receipt.observed_generation_current is True
                  assert receipt.path_identity_verified is True
                  assert receipt.exact_size_verified is True
                  assert receipt.full_content_digest_verified is True
                  assert receipt.concurrent_mutation_race_proven_safe is False
                  assert receipt.sigbus_impossible_proven is False
                  assert receipt.native_engine_safety_proven is False
                  assert receipt.external_effect is False
                  reader.query_affected_cone(0, 3)
                  print('ASTGE_MMAP_LIFECYCLE_CONTRACT=PASS')
                  print('OBSERVED_GENERATION_CURRENT=true')
                  print('CONCURRENT_MUTATION_RACE_PROVEN_SAFE=false')
                  print('SIGBUS_IMPOSSIBLE_PROVEN=false')
                  print('NATIVE_ENGINE_SAFETY_PROVEN=false')
          PY
