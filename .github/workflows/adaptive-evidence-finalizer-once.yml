name: Adaptive Evidence Finalizer Once

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/model-cognome-live-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply evidence binding and exact panel call count
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f"marker missing in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "aura_adaptive_model_router.py",
              '''def _forced_direct(assessment: CandidateAssessment) -> PolicyOption:
''',
              '''def _candidate_set_digest(candidates: Sequence[Mapping[str, Any]]) -> str:
    normalized = [dict(item) for item in candidates]
    normalized.sort(key=lambda item: str(item.get("profile_id") or ""))
    return stable_digest(normalized)


def _forced_direct(assessment: CandidateAssessment) -> PolicyOption:
''',
          )
          replace_once(
              "aura_adaptive_model_router.py",
              '''        self.executor_factory = executor_factory
''',
              '''        self.executor_factory = executor_factory
        self._used_authorization_ids: set[str] = set()
''',
          )
          replace_once(
              "aura_adaptive_model_router.py",
              '''        evidence_digest = stable_digest({
            "shadow": shadow.to_dict(),
            "forced_model": forced_model or "",
            "topology_digest": routing.get("topology_digest", ""),
            "path_digest": path_resolution.get("path_digest", ""),
        })
''',
              '''        candidate_evidence_digest = _candidate_set_digest(
            path_resolution.get("model_candidates", []) or []
        )
        evidence_digest = stable_digest({
            "shadow": shadow.to_dict(),
            "forced_model": forced_model or "",
            "topology_digest": routing.get("topology_digest", ""),
            "path_digest": path_resolution.get("path_digest", ""),
            "candidate_evidence_digest": candidate_evidence_digest,
        })
''',
          )
          replace_once(
              "aura_adaptive_model_router.py",
              '''            "candidate_records": candidate_records,
            "routing": routing,
''',
              '''            "candidate_records": candidate_records,
            "candidate_evidence_digest": candidate_evidence_digest,
            "routing": routing,
''',
          )
          replace_once(
              "aura_adaptive_model_router.py",
              '''                "capability_path_digest": path_resolution.get("path_digest", ""),
                "topology_digest": routing.get("topology_digest", ""),
''',
              '''                "capability_path_digest": path_resolution.get("path_digest", ""),
                "candidate_evidence_digest": candidate_evidence_digest,
                "topology_digest": routing.get("topology_digest", ""),
''',
          )
          replace_once(
              "aura_adaptive_model_router.py",
              '''        if current.get("graph_digest") != plan.get("path_resolution", {}).get("graph_digest"):
            errors.append("capability graph changed after route planning")
        for profile_id in plan.get("selected_option", {}).get("profile_ids", []) or []:
''',
              '''        if current.get("graph_digest") != plan.get("path_resolution", {}).get("graph_digest"):
            errors.append("capability graph changed after route planning")
        expected_evidence = str(
            plan.get("candidate_evidence_digest")
            or _candidate_set_digest(plan.get("path_resolution", {}).get("model_candidates", []) or [])
        )
        current_evidence = _candidate_set_digest(current.get("model_candidates", []) or [])
        if current_evidence != expected_evidence:
            errors.append("candidate evidence changed after route planning")
        for profile_id in plan.get("selected_option", {}).get("profile_ids", []) or []:
''',
          )
          replace_once(
              "aura_adaptive_model_executor.py",
              '''        estimated_calls = 0 if policy_mode == ZERO_MODEL else len(profile_ids) + (1 if policy_mode == PANEL else 0)
''',
              '''        estimated_calls = 0 if policy_mode == ZERO_MODEL else len(profile_ids)
''',
          )
          PY
      - name: Install and validate
        run: |
          python -m pip install pytest ruff "numpy>=1.26.4,<3.0"
          python -m py_compile aura_adaptive_model_router.py aura_adaptive_model_executor.py
          ruff check --select E9,F63,F7,F82 \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            tests/test_aura_adaptive_planner.py tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py
      - name: Upload reviewed final files
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-evidence-final-${{ github.run_id }}
          path: |
            aura_adaptive_model_router.py
            aura_adaptive_model_executor.py
