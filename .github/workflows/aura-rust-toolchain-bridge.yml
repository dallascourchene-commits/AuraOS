name: Aura Rust Toolchain Bridge

on:
  push:
    paths:
      - '.github/workflows/aura-rust-toolchain-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-rust:
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: '1.98.1'
      TARGET: x86_64-unknown-linux-gnu
      RELEASE_TAG: aura-rust-1.98.1-x86_64-unknown-linux-gnu
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Package self-contained toolchain
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          BASE="$(dirname "$SYSROOT")"
          NAME="$(basename "$SYSROOT")"
          ARCHIVE="rust-${RUST_VERSION}-${TARGET}.tar.gz"
          tar -C "$BASE" -czf "$ARCHIVE" "$NAME"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"

      - name: Validate packaged bytes, rustc, and offline Cargo
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="rust-${RUST_VERSION}-${TARGET}.tar.gz"
          sha256sum -c "${ARCHIVE}.sha256"
          mkdir -p "$RUNNER_TEMP/aura-rust-verify"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/aura-rust-verify"
          TOOLCHAIN_DIR="$(find "$RUNNER_TEMP/aura-rust-verify" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -x "$TOOLCHAIN_DIR/bin/rustc"
          test -x "$TOOLCHAIN_DIR/bin/cargo"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export RUSTC="$TOOLCHAIN_DIR/bin/rustc"
          rustc --version --verbose | tee rustc-version.txt
          cargo --version --verbose | tee cargo-version.txt

          cat > "$RUNNER_TEMP/aura_rust_hello.rs" <<'RS'
          fn main() { println!("AURA_RUST_RUSTC_OK"); }
          RS
          rustc "$RUNNER_TEMP/aura_rust_hello.rs" -o "$RUNNER_TEMP/aura_rust_hello"
          test "$("$RUNNER_TEMP/aura_rust_hello")" = "AURA_RUST_RUSTC_OK"

          mkdir -p "$RUNNER_TEMP/aura-cargo-smoke/src"
          cat > "$RUNNER_TEMP/aura-cargo-smoke/Cargo.toml" <<'TOML'
          [package]
          name = "aura-rust-smoke"
          version = "0.1.0"
          edition = "2024"
          TOML
          cat > "$RUNNER_TEMP/aura-cargo-smoke/src/main.rs" <<'RS'
          fn main() { println!("AURA_RUST_CARGO_OK"); }
          RS
          cargo build --offline --manifest-path "$RUNNER_TEMP/aura-cargo-smoke/Cargo.toml"
          test "$("$RUNNER_TEMP/aura-cargo-smoke/target/debug/aura-rust-smoke")" = "AURA_RUST_CARGO_OK"

          ARCHIVE_SHA256="$(cut -d' ' -f1 "${ARCHIVE}.sha256")"
          RUSTC_VERSION="$(rustc --version)"
          CARGO_VERSION="$(cargo --version)"
          cat > aura-rust-bridge-manifest.json <<JSON
          {
            "schema": "aura.rust.toolchain.bridge.v1",
            "rust_version": "${RUST_VERSION}",
            "target": "${TARGET}",
            "archive": "${ARCHIVE}",
            "archive_sha256": "${ARCHIVE_SHA256}",
            "rustc": "${RUSTC_VERSION}",
            "cargo": "${CARGO_VERSION}",
            "rustc_smoke": "AURA_RUST_RUSTC_OK",
            "cargo_offline_smoke": "AURA_RUST_CARGO_OK",
            "source_commit": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          JSON
          cat aura-rust-bridge-manifest.json

      - name: Upload short-lived Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-rust-1.98.1-x86_64-unknown-linux-gnu
          path: |
            rust-1.98.1-x86_64-unknown-linux-gnu.tar.gz
            rust-1.98.1-x86_64-unknown-linux-gnu.tar.gz.sha256
            aura-rust-bridge-manifest.json
            rustc-version.txt
            cargo-version.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish or refresh public bootstrap release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="rust-${RUST_VERSION}-${TARGET}.tar.gz"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ARCHIVE" "${ARCHIVE}.sha256" aura-rust-bridge-manifest.json rustc-version.txt cargo-version.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "$ARCHIVE" "${ARCHIVE}.sha256" aura-rust-bridge-manifest.json rustc-version.txt cargo-version.txt \
              --target "$GITHUB_SHA" \
              --title "Aura Rust Bootstrap ${RUST_VERSION} (${TARGET})" \
              --notes "Self-contained Rust ${RUST_VERSION} toolchain for Aura laptop/WSL bootstrap. The workflow verifies SHA-256, relocatable rustc execution, a compiled rustc smoke binary, and an offline Cargo build/run before publishing." \
              --repo "$GITHUB_REPOSITORY"
          fi
