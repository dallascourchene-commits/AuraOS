name: Aura Rust Toolchain Bridge

on:
  push:
    paths:
      - '.github/workflows/aura-rust-toolchain-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Package self-contained toolchain
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          BASE="$(dirname "$SYSROOT")"
          NAME="$(basename "$SYSROOT")"
          tar -C "$BASE" -cJf rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz "$NAME"
          sha256sum rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz > rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz.sha256
          cat rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz.sha256
      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-rust-1.98.1-x86_64-unknown-linux-gnu
          path: |
            rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz
            rust-1.98.1-x86_64-unknown-linux-gnu.tar.xz.sha256
          if-no-files-found: error
          retention-days: 1
