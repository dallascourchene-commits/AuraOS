name: Phase C2 Live Route Capsules

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/phase-c2-*"

permissions:
  contents: read

concurrency:
  group: phase-c2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  c2-contracts:
    name: C2 contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Compile C1 and C2 modules
        run: |
          python -m py_compile \
            aura_arena_wfst_types.py \
            aura_arena_wfst_runtime.py \
            aura_route_capsule_types.py \
            aura_route_capsule_compiler.py \
            aura_route_capsule_binding.py \
            aura_route_capsule_materializer.py \
            aura_runtime_intent_packet.py \
            aura_route_capsule_live_runtime.py \
            aura_coding_workbench_capsule_adapter.py \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_arena_wfst_types.py \
            aura_route_capsule_materializer.py \
            aura_runtime_intent_packet.py \
            aura_route_capsule_live_runtime.py \
            aura_coding_workbench_capsule_adapter.py \
            aura_arena_experience.py \
            aura_arena_experience_ledger.py \
            tests/test_aura_phase_c2_live_route_capsules.py
      - name: Run focused C2 and regression contracts
        run: |
          python -m pytest -q \
            tests/test_aura_phase_c2_live_route_capsules.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py
