name: Emergent Spine Agent Bridge Waboose V2

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_emergent_spine_agent_bridge_waboose_repairs.py
      - .github/workflows/emergent-spine-agent-bridge-waboose-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergent-spine-agent-bridge-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit
      - name: Apply integration and Waboose repairs
        run: |
          python scripts/apply_emergent_spine_agent_bridge.py
          python scripts/apply_emergent_spine_agent_bridge_waboose_repairs.py
      - name: Compile and test capsule two
        run: |
          python -m py_compile aura_emergent_evidence_spine.py aura_agent_arena_persistence_bridge.py aura_agent_arena_mcp.py tests/test_aura_emergent_agent_bridge.py tests/test_aura_emergent_agent_bridge_mcp.py
          python -m pytest -q tests/test_aura_emergent_evidence_spine.py tests/test_aura_emergent_agent_bridge.py tests/test_aura_emergent_agent_bridge_mcp.py
          python -m pytest -q tests/test_aura_agent_arena_mcp.py
          python -m pytest -q tests/test_aura_agent_arena_bridge.py
          python -m pytest -q tests/test_aura_forge.py
          python -m pytest -q tests/test_aura_external_llm_session.py
      - name: Full static and security checks
        run: |
          ruff check aura_emergent_evidence_spine.py aura_agent_arena_persistence_bridge.py aura_agent_arena_mcp.py tests/test_aura_emergent_agent_bridge.py tests/test_aura_emergent_agent_bridge_mcp.py
          bandit -q -ll aura_emergent_evidence_spine.py aura_agent_arena_persistence_bridge.py aura_agent_arena_mcp.py
      - name: Remove temporary capsule-two machinery
        run: |
          rm -f scripts/apply_emergent_spine_agent_bridge.py
          rm -f scripts/apply_emergent_spine_agent_bridge_waboose_repairs.py
          rm -f .github/workflows/emergent-spine-agent-bridge-waboose.yml
          rm -f .github/workflows/emergent-spine-agent-bridge-waboose-v2.yml
      - name: Commit permanent capsule locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire emergent evidence into Agent Bridge"
      - name: Build Waboose request
        run: |
          python - <<'PY'
          import json
          request = {
            "objective": "Review the repaired Emergent Evidence Spine Agent Bridge and MCP integration for explicit-target precedence, exact atomic inventory exposure, affinity fail-closed behavior, MCP parity, session isolation, and unchanged authority.",
            "mode": "range", "base_ref": "origin/main", "head_ref": "HEAD",
            "profile": "precision", "graph_depth": 2, "graph_node_budget": 200,
            "run_tests": True, "run_optional_tools": True,
            "focus_directives": [
              {"name":"explicit_target_precedence","question":"Can inferred targets override or mismatch explicit targets?","risk":"correctness","direction":"both","target_patterns":["_primary_emergent_target","target_file","target_symbol"],"required_evidence":["exact_source","regression_test"],"suggested_tools":["pytest"],"max_depth":2,"max_nodes":140},
              {"name":"affinity_fail_closed","question":"Can affinity-only or malformed evidence reach Architect preparation?","risk":"authority","direction":"callees","target_patterns":["grounding_ok","missing_grounding","super().aura_prepare_arena"],"required_evidence":["contract_invariant","malformed_packet","regression_test"],"suggested_tools":["pytest"],"max_depth":2,"max_nodes":140},
              {"name":"mcp_parity","question":"Do tool schemas, handlers, and bridge methods remain in exact parity?","risk":"contract","direction":"both","target_patterns":["TOOL_DEFINITIONS","aura_atomic_function_inventory","aura_emergent_evidence","use_emergent_evidence"],"required_evidence":["exact_source","schema_runtime_parity","regression_test"],"suggested_tools":["pytest"],"max_depth":2,"max_nodes":160},
              {"name":"authority_isolation","question":"Can emergent evidence mutate production, alter patch authority, or contaminate sessions?","risk":"authority","direction":"both","target_patterns":["emergent_evidence","_sessions","patch_authority","automatic_merge"],"required_evidence":["exact_source","contract_invariant","regression_test"],"suggested_tools":["pytest"],"max_depth":2,"max_nodes":140}
            ],
            "invariants": [
              "Emergent enrichment is opt-in.",
              "Explicit targets always take precedence.",
              "Affinity-only evidence fails before preparation.",
              "Schemas and handlers remain in parity.",
              "Production mutation and automatic merge remain false."
            ],
            "risk_map": ["contract","authority","session_state","target_binding","dependency_graph"]
          }
          open('/tmp/emergent-bridge-waboose.json','w').write(json.dumps(request))
          PY
      - name: Run and enforce Coding Waboose
        run: |
          python aura_coding_waboose_cli.py --repo-root . --state-file /tmp/emergent-bridge-state.json run --request /tmp/emergent-bridge-waboose.json | tee /tmp/emergent-bridge-result.json
          python - <<'PY'
          import json
          packet=json.load(open('/tmp/emergent-bridge-result.json'))
          assert packet.get('ok') is True, packet
          if packet.get('forge_repair_requests'):
              raise SystemExit(f"Waboose repairs remain: {packet['forge_repair_requests']}")
          assert packet.get('production_mutation') is False
          assert packet.get('automatic_merge') is False
          PY
      - name: Push reviewed capsule
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || 'feature/aura-emergent-evidence-spine' }}
        run: git push origin HEAD:"$HEAD_REF"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emergent-spine-agent-bridge-waboose-v2
          path: |
            /tmp/emergent-bridge-result.json
            /tmp/emergent-bridge-state.json
          if-no-files-found: warn
          retention-days: 3
