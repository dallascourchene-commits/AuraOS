name: P5.1 canonical ST3GG contracts

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p5-1-st3gg-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-st3gg-contracts:
    name: ST3GG contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff
      - name: Compile canonical and legacy ST3GG surfaces
        run: |
          python -m py_compile \
            aura_st3gg_contracts.py \
            aura_st3gg_codec.py \
            aura_st3gg_recall.py \
            aura_arena_st3gg_codec.py \
            aura_arena_st3gg_egress.py \
            tests/test_aura_st3gg_contracts.py \
            tests/test_aura_st3gg_codec.py \
            test_aura_st3gg_recall.py \
            test_aura_arena_st3gg_codec.py
      - name: Static correctness lint
        run: |
          ruff check --select E4,E7,E9,F \
            aura_st3gg_contracts.py \
            tests/test_aura_st3gg_contracts.py
      - name: Run focused ST3GG compatibility tests
        id: focused-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_st3gg_contracts.py \
            tests/test_aura_st3gg_codec.py \
            test_aura_st3gg_recall.py \
            test_aura_arena_st3gg_codec.py \
            tests/test_aura_emergent_result_verifier.py \
            > "p5-1-pytest-${{ matrix.python-version }}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "p5-1-pytest-${{ matrix.python-version }}.txt"
          exit 0
      - name: Upload focused diagnostics on failure
        if: steps.focused-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: p5-1-pytest-${{ matrix.python-version }}
          path: p5-1-pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce focused test result
        if: steps.focused-tests.outputs.status != '0'
        run: exit 1
