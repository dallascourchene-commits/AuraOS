name: Phase B Full Suite Diagnostic

on:
  push:
    branches:
      - feature/arena-crucible-phase-b

permissions:
  contents: write

concurrency:
  group: phase-b-full-suite-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arena-crucible-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio
      - name: Run suite and preserve failure tail
        run: |
          rm .github/workflows/phase-b-full-suite-diagnostic.yml
          rm -f PHASE_B_FULL_SUITE_DIAGNOSTIC.txt
          set +e
          PYTHONHASHSEED=0 python -m pytest -q --disable-warnings --maxfail=1 > /tmp/full-suite.log 2>&1
          code=$?
          set -e
          {
            echo "exit_code=$code"
            echo "---- last 400 lines ----"
            tail -400 /tmp/full-suite.log
          } > PHASE_B_FULL_SUITE_DIAGNOSTIC.txt
      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE_B_FULL_SUITE_DIAGNOSTIC.txt
          git add -u .github/workflows/phase-b-full-suite-diagnostic.yml
          git commit -m "chore(ci): record full-suite failure diagnostic"
          git push origin HEAD:feature/arena-crucible-phase-b
