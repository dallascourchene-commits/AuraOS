name: Aura Winnipeg Showcase

on:
  pull_request:
    paths:
      - "aura_civic_authority.py"
      - "aura_civic_winnipeg_fixture.py"
      - "aura_civic_projects.py"
      - "aura_civic_guided_steps.py"
      - "aura_civic_project_runtime.py"
      - "aura_civic_guided_project.py"
      - "aura_human_agent_guidance.py"
      - "aura_showcase_handoff.py"
      - "aura_showcase_spatial.py"
      - "aura_showcase_intent.py"
      - "aura_showcase_intent_topology.py"
      - "aura_showcase_observatory_handoff.py"
      - "aura_showcase_crucible.py"
      - "aura_showcase_server.py"
      - "aura_llm_egress.py"
      - "aura_provider_registry.py"
      - "aura_pricing.py"
      - "aura_showcase/**"
      - "tests/test_aura_showcase_guided_project.py"
      - "tests/test_aura_showcase_guided_interface.py"
      - "tests/test_aura_showcase_spatial_integration.py"
      - "tests/test_aura_showcase_intent_routing.py"
      - "tests/test_aura_showcase_observatory_crucible.py"
      - "tests/test_aura_showcase_human_guided_tour.py"
      - "docs/AURA_WINNIPEG_PATHWAYS_DEMO.md"
      - "docs/AURA_SHOWCASE_BUTTON_WALKTHROUGH.md"
      - "docs/AURA_SHOWCASE_SPATIAL_INTEGRATION.md"
      - "docs/AURA_SHOWCASE_INTENT_ROUTING_DEMO.md"
      - "docs/AURA_OBSERVATORY_CRUCIBLE_HANDOFF.md"
      - "docs/AURA_HUMAN_AGENT_GUIDED_SHOWCASE.md"
      - "Dockerfile.aura-showcase"
      - "docker-compose.showcase.yml"
      - ".github/workflows/aura-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout exact workflow ref without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused runtime and test dependencies
        run: |
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest ruff
      - name: Compile showcase and egress modules
        run: >-
          python -m py_compile
          aura_civic_authority.py
          aura_civic_winnipeg_fixture.py
          aura_civic_projects.py
          aura_civic_guided_steps.py
          aura_civic_project_runtime.py
          aura_civic_guided_project.py
          aura_human_agent_guidance.py
          aura_showcase_handoff.py
          aura_showcase_spatial.py
          aura_showcase_intent.py
          aura_showcase_intent_topology.py
          aura_showcase_observatory_handoff.py
          aura_showcase_crucible.py
          aura_showcase_server.py
          aura_llm_egress.py
          aura_provider_registry.py
          aura_pricing.py
          tests/test_aura_showcase_guided_project.py
          tests/test_aura_showcase_guided_interface.py
          tests/test_aura_showcase_spatial_integration.py
          tests/test_aura_showcase_intent_routing.py
          tests/test_aura_showcase_observatory_crucible.py
          tests/test_aura_showcase_human_guided_tour.py
      - name: Fatal lint checks
        run: >-
          ruff check --select E9,F63,F7,F82
          aura_civic_authority.py
          aura_civic_winnipeg_fixture.py
          aura_civic_projects.py
          aura_civic_guided_steps.py
          aura_civic_project_runtime.py
          aura_civic_guided_project.py
          aura_human_agent_guidance.py
          aura_showcase_handoff.py
          aura_showcase_spatial.py
          aura_showcase_intent.py
          aura_showcase_intent_topology.py
          aura_showcase_observatory_handoff.py
          aura_showcase_crucible.py
          aura_showcase_server.py
          aura_llm_egress.py
          aura_provider_registry.py
          aura_pricing.py
          tests/test_aura_showcase_guided_project.py
          tests/test_aura_showcase_guided_interface.py
          tests/test_aura_showcase_spatial_integration.py
          tests/test_aura_showcase_intent_routing.py
          tests/test_aura_showcase_observatory_crucible.py
          tests/test_aura_showcase_human_guided_tour.py
      - name: Check browser JavaScript syntax
        run: |
          node --check aura_showcase/app.js
          node --check aura_showcase/civic.js
          node --check aura_showcase/human.js
          node --check aura_showcase/topology.js
          node --check aura_showcase/intent.js
          node --check aura_showcase/crucible.js
      - name: Run guided showcase contracts
        run: >-
          python -m pytest -q
          tests/test_aura_showcase_guided_project.py
          tests/test_aura_showcase_guided_interface.py
          tests/test_aura_showcase_spatial_integration.py
          tests/test_aura_showcase_intent_routing.py
          tests/test_aura_showcase_observatory_crucible.py
          tests/test_aura_showcase_human_guided_tour.py
          tests/test_aura_civic_commons_arena.py
          tests/test_aura_human_agent_workflow.py
          test_aura_context_crusher.py
          test_universal_llm_logging.py
      - name: Exercise unified server
        shell: bash
        run: |
          set -euo pipefail
          python aura_showcase_server.py --host 127.0.0.1 --port 18091 --demo-project winnipeg_pathways > /tmp/aura-showcase.log 2>&1 &
          server_pid=$!
          cleanup() {
            cat /tmp/aura-showcase.log || true
            kill "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:18091"

          def get(path, timeout=15):
              with urllib.request.urlopen(base + path, timeout=timeout) as response:
                  return json.load(response)

          def post(path, payload, timeout=20):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"content-type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          for _ in range(40):
              try:
                  status = get("/api/showcase/status", timeout=1)
                  if status.get("ok"):
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("showcase server did not become ready")

          session_id = status["default_session_id"]
          assert session_id
          assert status["basemap_tile_url_template"]
          assert status["bounded_topology_projection"] is True
          assert status["full_topology_sent_to_browser"] is False
          assert status["observatory_available"] is True
          assert status["learning_arena_available"] is True
          assert status["learning_arena_identity"] == "LEARNING_ARENA_CRUCIBLE"
          assert status["deterministic_bulk_intent_compiler"] is True
          assert status["model_calls_before_handoff"] == 0
          assert status["english_lexicon_expected_primitives"] == 4096
          assert status["automatic_grammar_promotion"] is False

          tasks = get("/api/showcase/coding-tasks")
          assert tasks["task_count"] == 4

          spatial = get("/api/showcase/topology/tasks/civic_map_overlay?depth=1")
          assert spatial["ok"] is True
          assert spatial["workspace"]["nodes"]
          assert spatial["workspace"]["returned_node_count"] <= spatial["bounds"]["node_limit"]

          intent = post("/api/showcase/intent/compile", {
              "text": "Improve compile_intent_packet routing and preserve its tests.",
              "include_grounding": False,
              "include_topology": False,
          })
          assert intent["ok"] is True
          assert intent["model_calls_made"] == 0
          assert intent["lexical_codebook"]["primitive_count"] == 4096
          assert set(intent["six_slot_packet"]["slots"]) == {"DIR", "ASP", "CLASS", "SUBJ", "VOICE", "STEM"}
          assert intent["machine_route"]["rule_name"]
          assert intent["agent_handoff"]["compressed_context"]
          assert intent["automatic_merge"] is False

          intake = post("/api/showcase/observatory/handoff/learning", {"trace": intent})
          assert intake["ok"] is True
          assert intake["eligible_for_crucible"] is False
          assert intake["status"] == "AWAITING_VERIFIED_EXPERIENCE"

          learning = get("/api/showcase/learning/status")
          assert learning["identity"] == "LEARNING_ARENA_CRUCIBLE"
          assert learning["intake"]["observatory_trace_digest"] == intake["observatory_trace_digest"]
          assert learning["dataset_split"] == ["TRAIN", "VALIDATION", "SHADOW"]
          assert learning["terminal_status"] == "CRYSTALLIZATION_PROPOSED"
          assert learning["automatic_grammar_promotion"] is False

          guide = post(f"/api/showcase/sessions/{session_id}/advance", {})
          assert guide["ok"] is True
          assert guide["patch_authority"] == "exact_source_spans_and_hashes_only"
          actions = guide.get("available_actions")
          assert isinstance(actions, list) and actions
          required = {
              "action_id", "label", "effect", "route_weight", "why_available",
              "intent_slots", "activates", "args", "binding",
          }
          for action in actions:
              assert isinstance(action, dict)
              assert required <= set(action)
              assert set(action["intent_slots"]) == {"DIR", "ASP", "CLASS", "SUBJ", "VOICE", "STEM"}
          PY

  showcase-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow ref without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - name: Build showcase container
        run: docker build -f Dockerfile.aura-showcase -t aura-showcase:test .
      - name: Exercise container default command
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 18092:8091 aura-showcase:test)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18092/api/showcase/status", timeout=1) as response:
                      payload = json.load(response)
                  if payload.get("ok"):
                      assert payload["default_session_id"]
                      assert payload["automatic_merge"] is False
                      assert payload["automatic_grammar_promotion"] is False
                      assert payload["basemap_tile_url_template"]
                      assert payload["bounded_topology_projection"] is True
                      assert payload["observatory_available"] is True
                      assert payload["learning_arena_available"] is True
                      assert payload["learning_arena_identity"] == "LEARNING_ARENA_CRUCIBLE"
                      assert payload["model_calls_before_handoff"] == 0
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("container showcase did not become ready")
          PY
