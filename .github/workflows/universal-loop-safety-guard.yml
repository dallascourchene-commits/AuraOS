name: Universal Loop Safety Guard

on:
  pull_request:
    paths:
      - "tools/aura_execution_loop_guard.py"
      - "tests/test_aura_execution_loop_guard.py"
      - "docs/UNIVERSAL_LOOP_SAFETY_PREFLIGHT.md"
      - ".github/workflows/universal-loop-safety-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Exact checkout without mutable third-party action
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Compile guard
        run: |
          python -m py_compile tools/aura_execution_loop_guard.py
          python -m py_compile tests/test_aura_execution_loop_guard.py

      - name: Run guard tests
        run: python -m unittest tests.test_aura_execution_loop_guard -v
