name: Aura Construction G5 Purpose Digest Repair

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g5-purpose-digest-repair.yml"
      - "tests/test_aura_construction_demo_projection.py"

permissions:
  contents: write

concurrency:
  group: aura-construction-g5-purpose-digest-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone exact pull-request head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth=32 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical purpose digest repair
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check numpy pytest ruff zstandard
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_aura_construction_demo_projection.py")
          text = path.read_text(encoding="utf-8")
          old = '        purpose_digest="9" * 32,\n'
          new = '        purpose_digest="9" * 64,\n'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("expected exactly one G5 purpose digest repair span")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("G5 purpose digest span is missing")
          PY
          ruff check tests/test_aura_construction_demo_projection.py
          ruff format --check tests/test_aura_construction_demo_projection.py
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py

      - name: Commit and push exact test repair
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/test_aura_construction_demo_projection.py; then
            echo "G5 purpose digest repair already present."
            exit 0
          fi
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_aura_construction_demo_projection.py
          git commit -m "test(spatial): use canonical G5 purpose digest"
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"
