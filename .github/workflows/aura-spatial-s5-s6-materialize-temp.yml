name: Aura Temporary S5-S6 Exact Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s5-s6-materialize-temp.yml"
      - ".github/workflows/aura-spatial-s5-s6-bootstrap-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-exact-spatial-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused verification dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy

      - name: Restore exact verified permanent files
        shell: bash
        run: |
          set -euo pipefail
          source_commit="9d494be2bf312975654b636ba5d2b02101de36df"
          git cat-file -e "${source_commit}^{commit}"
          {
            git show "${source_commit}:.aura/tmp/s5s6-payload/chunk-000"
            git show "${source_commit}:.aura/tmp/s5s6-payload/chunk-001"
            git show "${source_commit}:.aura/tmp/s5s6-payload/part-000"
          } > /tmp/aura-s5-s6-payload.b64
          base64 --decode /tmp/aura-s5-s6-payload.b64 > /tmp/aura-s5-s6-payload.tar.gz
          echo "752aab15d35df78e89da3fa6e2c0e74758c66a8a29d7563b7a8142cdcb58d948  /tmp/aura-s5-s6-payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/aura-s5-s6-payload.tar.gz -- \
            ./.aura/ARCHITECTURE.md \
            ./README.md \
            ./USER_GUIDE.md \
            ./aura_agent_arena_mcp.py \
            ./aura_agent_arena_persistence_bridge.py \
            ./aura_arena_persistence_adapters.py \
            ./aura_spatial_arena.py \
            ./aura_spatial_construction.py \
            ./scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            ./tests/test_aura_spatial_s5_arena.py \
            ./tests/test_aura_spatial_s6_construction.py
          rm -f \
            .github/workflows/aura-spatial-s5-s6-bootstrap-temp.yml \
            .github/workflows/aura-spatial-s5-s6-materialize-temp.yml

      - name: Repair import ordering and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_arena_persistence_adapters.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            tests/test_aura_spatial_agent_bridge_mcp.py \
            tests/test_aura_spatial_cli.py \
            tests/test_aura_spatial_s5_arena.py \
            tests/test_aura_spatial_s5_s6_harness.py \
            tests/test_aura_spatial_s6_construction.py
          python -m ruff format \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_arena_persistence_adapters.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            tests/test_aura_spatial_agent_bridge_mcp.py \
            tests/test_aura_spatial_cli.py \
            tests/test_aura_spatial_s5_arena.py \
            tests/test_aura_spatial_s5_s6_harness.py \
            tests/test_aura_spatial_s6_construction.py
          python -m py_compile \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py
          python aura_spatial_cli.py --repo-root . validate-route
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_s5_arena.py \
            tests/test_aura_spatial_s6_construction.py \
            tests/test_aura_spatial_agent_bridge_mcp.py \
            tests/test_aura_spatial_cli.py \
            tests/test_aura_spatial_s5_s6_harness.py

      - name: Commit exact materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aura-spatial-materializer[bot]"
          git config user.email "aura-spatial-materializer[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialization changes were required."
            exit 0
          fi
          git commit -m "Materialize permanent Spatial S5/S6 implementation"
          git push origin HEAD:feature/spatial-s4b-gaussian-security
