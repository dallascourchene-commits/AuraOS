name: SCO Phase 3 Refactor Skeleton PR Bridge

on:
  pull_request:
    branches: [refactor/sco-construction-e7-e8]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'repair/sco-phase3-refactor-skeleton' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          printf '/*\n!/Aura_Memory/\n!/Aura_Sandbox/\n' > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=128 origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Aura verifier environment
        run: python -m pip install -q -r requirements.txt pytest==8.4.1
      - name: Run exact Aura repair capsule
        run: |
          set -o pipefail
          python tools/sco_phase3_refactor_skeleton_repair.py \
            2>&1 | tee /tmp/sco-skeleton-repair.log
          rm -f \
            tools/sco_phase3_refactor_skeleton_repair.py \
            .github/workflows/sco-phase3-refactor-skeleton-repair.yml \
            .aura/sco_phase3_refactor_skeleton_repair.trigger \
            .github/workflows/sco-phase3-refactor-skeleton-dedicated.yml \
            .aura/sco_phase3_refactor_skeleton_dedicated.trigger
      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sco-phase3-refactor-skeleton-diagnostics-${{ github.event.pull_request.head.sha }}
          path: /tmp/sco-skeleton-repair.log
          if-no-files-found: warn
          retention-days: 7
      - name: Commit repair to isolated head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Native Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair RefactorSkeleton identity syntax through Aura Surgeon"
          git push origin HEAD:"${HEAD_REF}"
