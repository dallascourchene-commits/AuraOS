name: SCO Phase 3 Refactor Skeleton PR Bridge

on:
  pull_request:
    branches:
      - refactor/sco-construction-e7-e8

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'repair/sco-phase3-refactor-skeleton' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          cat > .git/info/sparse-checkout <<'EOF'
          /*
          !/Aura_Memory/
          !/Aura_Sandbox/
          EOF
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=128 origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact verifier environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
      - name: Run Aura Council and exact Surgeon patch
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import time

          from aura_architect_control import normalize_control_profile
          from aura_arena_architect_connector import AuraArenaArchitectConnector

          root = Path('.').resolve()
          target = root / 'aura_refactor_skeleton.py'
          objective = (
              'Repair the Python 3.11 syntax defect in RefactorSkeleton canonical '
              'identity validation without changing its identity payload.'
          )
          required = [
              'syntax_integrity',
              'canonical_identity_equivalence',
              'bounded_patch_scope',
              'direct_skeleton_tests',
              'construction_plan_regression',
              'rollback',
          ]
          broad = {
              'candidate_id': 'BROAD_REWRITE',
              'arm_family': 'BROAD_IMPLEMENTER',
              'provenance': {'generation': 'frozen_local_plan', 'model_calls': 0},
              'token_usage': {'provider_reported': None, 'measurement_class': 'NOT_MEASURED'},
              'plan': {
                  'architecture_decision': 'Rewrite skeleton validation broadly.',
                  'act_tasks': [{
                      'task_id': 'BROAD-1',
                      'objective': 'Rewrite validation.',
                      'target_file': 'aura_refactor_skeleton.py',
                      'target_symbol': 'RefactorSkeleton',
                      'acceptance': 'Tests pass.',
                      'expected_output': 'UNIFIED_DIFF',
                      'size': 'L',
                  }],
                  'acceptance_criteria': ['Tests pass.'],
                  'rollback_conditions': ['Revert file.'],
                  'risk_map': ['Broad identity rewrite.'],
                  'constraints': ['No production mutation.'],
                  'coverage_tags': ['syntax_integrity'],
                  'architecture_reuse': False,
              },
          }
          exact = {
              'candidate_id': 'EXACT_IDENTITY_SYNTAX_SURGEON',
              'arm_family': 'SELECTIVE_COUNCIL_V3_PLUS_SURGEON',
              'provenance': {'generation': 'frozen_local_plan', 'model_calls': 0},
              'token_usage': {'provider_reported': None, 'measurement_class': 'NOT_MEASURED'},
              'plan': {
                  'architecture_decision': (
                      'Preserve the identity payload and replace only the Python 3.11 '
                      'incompatible multiline f-string expression.'
                  ),
                  'act_tasks': [{
                      'task_id': 'SKELETON-ID-EXPRESSION',
                      'objective': 'Repair the exact canonical ID expression.',
                      'target_file': 'aura_refactor_skeleton.py',
                      'target_symbol': 'RefactorSkeleton.__post_init__',
                      'acceptance': 'Compile and direct plus Construction tests pass.',
                      'expected_output': 'UNIFIED_DIFF',
                      'allowed_scope': 'one canonical identity expression',
                      'size': 'S',
                  }],
                  'acceptance_criteria': [
                      'Python 3.11 compile passes.',
                      'Direct skeleton tests pass.',
                      'Construction plan regression passes.',
                      'Identity arguments are unchanged.',
                  ],
                  'rollback_conditions': ['Any failure blocks commit.'],
                  'risk_map': ['Identity semantics must remain equivalent.'],
                  'constraints': [
                      'One source file only.',
                      'No public API or authority changes.',
                      'Human review required.',
                  ],
                  'coverage_tags': required,
                  'architecture_reuse': True,
                  'existing_modules': [
                      'aura_architect_control.py',
                      'aura_arena_architect_connector.py',
                      'aura_refactor_skeleton.py',
                  ],
              },
          }
          comparison = AuraArenaArchitectConnector(root, bridge=object()).compare_plans(
              objective=objective,
              candidates=[broad, exact],
              required_capabilities=required,
              control=normalize_control_profile({
                  'surface': 'native',
                  'council_mode': 'SELECTIVE_V3',
                  'council_call_budget': 4,
                  'critic_lanes': ['scope', 'tests', 'rollback', 'cost'],
                  'surgeon_mode': 'STAGE_AND_VERIFY',
                  'surgeon_max_turns': 4,
                  'surgeon_max_local_repairs': 1,
                  'record_outputs': False,
              }),
              surface='native',
              record=False,
              benchmark=False,
          )
          if comparison['selected_candidate_id'] != exact['candidate_id']:
              raise SystemExit(f"unexpected plan: {comparison['selected_candidate_id']}")

          before = target.read_bytes()
          old = '''        expected_id = f"RFS-{_digest(_skeleton_identity(
              objective=self.objective,
              domain=self.domain,
              baseline_commit=self.baseline_commit,
              source_plan_digest=self.source_plan_digest,
              addendum_digest=self.addendum_digest,
          ))[:20]}"
          '''
          new = '''        identity_digest = _digest(
              _skeleton_identity(
                  objective=self.objective,
                  domain=self.domain,
                  baseline_commit=self.baseline_commit,
                  source_plan_digest=self.source_plan_digest,
                  addendum_digest=self.addendum_digest,
              )
          )
          expected_id = f"RFS-{identity_digest[:20]}"
          '''
          text = before.decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'exact span count {text.count(old)} != 1')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'py_compile', str(target)], check=True)

          tests = []
          for test_path in (
              'tests/test_aura_refactor_skeleton.py',
              'tests/test_aura_construction_refactor_plan.py',
          ):
              started = time.perf_counter()
              completed = subprocess.run(
                  [sys.executable, '-m', 'pytest', '-q', test_path],
                  text=True,
                  capture_output=True,
                  timeout=240,
                  check=False,
              )
              row = {
                  'test': test_path,
                  'ok': completed.returncode == 0,
                  'returncode': completed.returncode,
                  'elapsed_ms': round((time.perf_counter() - started) * 1000.0, 3),
                  'stdout_tail': completed.stdout[-2000:],
                  'stderr_tail': completed.stderr[-2000:],
              }
              tests.append(row)
              if not row['ok']:
                  raise SystemExit(json.dumps(row, indent=2))

          after = target.read_bytes()
          evidence = {
              'version': 'AURA_SCO_PHASE3_REFACTOR_SKELETON_SURGEON_REPAIR_V1',
              'objective': objective,
              'selected_plan_id': comparison['selected_candidate_id'],
              'actual_model_calls': comparison['actual_model_calls'],
              'council_comparison': comparison,
              'source': {
                  'path': 'aura_refactor_skeleton.py',
                  'before_sha256': hashlib.sha256(before).hexdigest(),
                  'after_sha256': hashlib.sha256(after).hexdigest(),
                  'exact_span_replacements': 1,
                  'identity_arguments_changed': False,
              },
              'tests': tests,
              'claim_boundaries': {
                  'provider_tokens': 'NOT_MEASURED',
                  'provider_cost': 'NOT_MEASURED',
                  'production_mutation': False,
                  'human_review_required': True,
              },
          }
          evidence_path = root / 'docs/evidence/AURA_SCO_PHASE3_REFACTOR_SKELETON_SURGEON_REPAIR.json'
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          rm -f \
            .github/workflows/sco-phase3-refactor-skeleton-repair.yml \
            .aura/sco_phase3_refactor_skeleton_repair.trigger \
            .github/workflows/sco-phase3-refactor-skeleton-dedicated.yml \
            .aura/sco_phase3_refactor_skeleton_dedicated.trigger
      - name: Commit repair to the isolated head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Native Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair RefactorSkeleton identity syntax through Aura Surgeon"
          git push origin HEAD:"${HEAD_REF}"
