name: K27 ASTGE Current Profiled Scope Review

on:
  pull_request:
    paths:
      - 'crates/aura-k27-astge-current-profiled-scope-review/**'
      - 'crates/aura-k27-astge-current-profiled-scopes/**'
      - 'crates/aura-k27-astge-profiled-scope-review/**'
      - 'crates/aura-k27-astge-current-syntax/**'
      - 'crates/aura-k27-astge-generation-domain/**'
      - 'crates/aura-k27-astge-profiled-scopes/**'
      - 'crates/aura-k27-astge-syntax-profile/**'
      - 'tools/k27_astge_python_scope_oracle.py'
      - '.github/workflows/k27-astge-current-profiled-scope-review.yml'

permissions:
  contents: read

jobs:
  exact-head-current-profiled-scope-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prove exact detached head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD_SHA=$(git rev-parse HEAD)"

      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/aura-k27-astge-current-profiled-scopes/Cargo.toml -- --check
          cargo fmt --manifest-path crates/aura-k27-astge-profiled-scope-review/Cargo.toml -- --check
          cargo fmt --manifest-path crates/aura-k27-astge-current-profiled-scope-review/Cargo.toml -- --check

      - name: Reprove current typed profiled owner
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/aura-k27-astge-current-profiled-scopes/Cargo.toml
          cargo test --doc --manifest-path crates/aura-k27-astge-current-profiled-scopes/Cargo.toml
          cargo clippy --manifest-path crates/aura-k27-astge-current-profiled-scopes/Cargo.toml --all-targets -- -D warnings

      - name: Reprove profiled scope review owner
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/aura-k27-astge-profiled-scope-review/Cargo.toml
          cargo clippy --manifest-path crates/aura-k27-astge-profiled-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Prove producer-bound current profiled review membrane
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/aura-k27-astge-current-profiled-scope-review/Cargo.toml
          cargo test --doc --manifest-path crates/aura-k27-astge-current-profiled-scope-review/Cargo.toml
          cargo clippy --manifest-path crates/aura-k27-astge-current-profiled-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Independent CPython scope oracle
        shell: bash
        run: |
          set -euo pipefail
          python tools/k27_astge_python_scope_oracle.py

      - name: Producer plus observer trust HOLD and canonical public-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          entry=crates/aura-k27-astge-current-profiled-scope-review/src/lib.rs
          lower=crates/aura-k27-astge-current-profiled-scope-review/src/producer_bound.rs
          trust=crates/aura-k27-astge-current-profiled-scope-review/src/trusted_registry.rs

          grep -q '^mod producer_bound;' "$entry"
          grep -q '^mod trusted_registry;' "$entry"
          ! grep -q '^pub use producer_bound::\*;' "$entry"
          grep -q 'validate_current_profiled_scope_review_candidate' "$entry"
          grep -q 'admit_current_profiled_scope_review' "$entry"
          grep -q 'CurrentProfiledScopeReviewAdmissionV2' "$entry"

          grep -q 'pub fn validate_current_profiled_scope_review_candidate' "$lower"
          grep -q 'lower_review_context_validated: true' "$lower"
          grep -q 'hydration_producer_trust_proven: false' "$lower"
          grep -q 'ready_for_current_profiled_scope_semantic_review: false' "$lower"

          grep -q 'pub fn admit_current_profiled_scope_review' "$trust"
          grep -q 'ASTGE_HYDRATION_PRODUCER_TRUST_REGISTRY_HOLD_V2' "$trust"
          grep -q 'const PRODUCTION_HYDRATION_PRODUCER_TRUST: &\[HydrationProducerTrustRecordV2\] = &\[\];' "$trust"
          grep -q 'producer_generation:' "$trust"
          grep -q 'producer_currentness_ref:' "$trust"
          grep -q 'observer_ref:' "$trust"
          grep -q 'observer_generation:' "$trust"
          grep -q 'observer_currentness_ref:' "$trust"
          grep -q 'row.producer_ref != row.observer_ref' "$trust"
          grep -q '!row.revoked' "$trust"

          sig="$(sed -n '/pub fn admit_current_profiled_scope_review(/,/^)/p' "$trust")"
          ! grep -q 'selected_scope_id' <<<"$sig"
          ! grep -q 'source_owner_ref' <<<"$sig"
          ! grep -q 'expected_source_generation' <<<"$sig"
          ! grep -q 'expected_producer' <<<"$sig"
          ! grep -q 'expected_observer' <<<"$sig"
          ! grep -q 'registry:' <<<"$sig"
          ! grep -q 'trusted' <<<"$sig"
          ! grep -q 'grammar' <<<"$sig"
          ! grep -q 'profile_ref' <<<"$sig"
          ! grep -q 'graph_sha' <<<"$sig"

          grep -q 'runtime_name_resolution_proven: false' "$trust"
          grep -q 'semantic_correctness_proven: false' "$trust"
          grep -q 'b_minus_approved: false' "$trust"
          grep -q 'commit_authorized: false' "$trust"
          grep -q 'external_effect_authorized: false' "$trust"

          echo 'LOWER_REVIEW_CONTEXT_VALIDATION_PROVEN=true'
          echo 'HYDRATION_PRODUCER_TRUST_REGISTRY_GENERATION=ASTGE_HYDRATION_PRODUCER_TRUST_REGISTRY_HOLD_V2'
          echo 'PRODUCTION_HYDRATION_PRODUCER_TRUST_RECORDS=0'
          echo 'PRODUCER_GENERATION_REQUIRED=true'
          echo 'PRODUCER_CURRENTNESS_REQUIRED=true'
          echo 'DISTINCT_OBSERVER_REQUIRED=true'
          echo 'OBSERVER_GENERATION_REQUIRED=true'
          echo 'OBSERVER_CURRENTNESS_REQUIRED=true'
          echo 'REVOKED_RECORD_ADMITTED=false'
          echo 'HYDRATION_PRODUCER_TRUST_PROVEN=false'
          echo 'CURRENT_PROFILED_SCOPE_REVIEW_READY=false'
          echo 'CALLER_REGISTRY_OVERRIDE=false'
          echo 'CALLER_EXPECTED_PRODUCER_OVERRIDE=false'
          echo 'CALLER_EXPECTED_OBSERVER_OVERRIDE=false'
          echo 'RUNTIME_NAME_RESOLUTION_PROVEN=false'
          echo 'SEMANTIC_CORRECTNESS_PROVEN=false'
          echo 'B_MINUS_APPROVED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'EXTERNAL_EFFECT_AUTHORIZED=false'
