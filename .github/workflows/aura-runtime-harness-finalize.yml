name: Finalize Aura Runtime Refactor Harness

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-runtime-harness-finalize.yml"
      - "tools/runtime_harness_finalize/apply_docs.py"

permissions:
  contents: write

concurrency:
  group: aura-runtime-harness-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff jsonschema

      - name: Apply canonical runtime-harness documentation
        run: python tools/runtime_harness_finalize/apply_docs.py

      - name: Compile harness source
        run: |
          python -m py_compile \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py

      - name: Lint Runtime Refactor Harness
        run: |
          ruff check \
            scripts/aura_runtime_refactor_harness.py \
            tests/test_aura_runtime_refactor_harness.py

      - name: Verify Runtime Refactor Harness contracts
        run: python -m pytest -q --tb=short tests/test_aura_runtime_refactor_harness.py

      - name: Verify retained Construction Python contracts
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_spatial_render_plan.py

      - name: Verify retained Construction browser contracts
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/construction_wireframe_pass.js
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          git diff --check

      - name: Remove one-time finalizer
        run: |
          git rm -rf \
            .github/workflows/aura-runtime-harness-finalize.yml \
            tools/runtime_harness_finalize

      - name: Regenerate final repository navigation
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Publish exact verified harness tree
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Runtime Harness"
          git config user.email "aura-runtime-harness@users.noreply.github.com"
          git add -A
          git commit -m "feat(harness): integrate runtime refactor verification"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
