name: Materialize verified provider-routing refactor

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: provider-routing-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.issue.title == 'Aura: materialize verified provider routing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Provider-routing materializer started against immutable base 020f514f34db106e299a8fd3e9414f9246a2873e."

      - name: Checkout exact refactor head
        uses: actions/checkout@v4
        with:
          ref: refactor/deepseek-first-provider-routing
          fetch-depth: 0

      - name: Verify immutable provenance
        env:
          EXPECTED_BASE_SHA: 020f514f34db106e299a8fd3e9414f9246a2873e
        run: |
          git fetch --no-tags origin main
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE_SHA"

      - name: Reconstruct and apply inspectable patch
        run: |
          cat .aura/provider-routing-patch/part-*.patch > /tmp/provider-routing.patch
          test -s /tmp/provider-routing.patch
          git apply --check /tmp/provider-routing.patch
          git apply /tmp/provider-routing.patch
          git rm -r .aura/provider-routing-patch
          git rm .github/workflows/provider-routing-materialize.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile provider-routing owners
        run: |
          python -m py_compile \
            aura_api_rotator.py \
            aura_provider_registry.py \
            aura_llm_egress.py \
            aura_fusion.py \
            aura_agent_arena_fireworks.py \
            aura_live_architect.py

      - name: Run bounded Council Fusion and Bridge tests
        run: |
          python -m pytest -q \
            tests/test_aura_provider_routing.py \
            test_aura_fusion.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_cli.py \
            tests/test_aura_architect_council_v3.py \
            test_aura_live_architect.py \
            --disable-warnings

      - name: Commit verified refactor and remove transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "AuraOS Refactor Harness"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: make provider routing DeepSeek-first and resilient"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:refactor/deepseek-first-provider-routing

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "Provider-routing materializer finished with job status: ${{ job.status }}."
