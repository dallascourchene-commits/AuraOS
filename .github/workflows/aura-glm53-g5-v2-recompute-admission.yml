name: Aura GLM53 G5 V2 Recompute Admission

on:
  push:
    branches:
      - arena/glm53-g5-g4v2-currentness-rebase-v2-20260831-sol
  pull_request:
    paths:
      - 'tools/awj032/glm53_g5_recompute_admission.py'
      - 'tools/awj032/test_glm53_g5_recompute_admission.py'
      - 'tools/awj032/glm53_g4_prefetch_plan_revalidation.py'
      - 'tools/awj032/test_glm53_g4_prefetch_plan_revalidation.py'
      - '.github/workflows/aura-glm53-g5-v2-recompute-admission.yml'
      - 'docs/arena/AWJ032_G5_G4V2_ALIAS_STABLE_RECOMPUTE_ADMISSION_20260831.md'

permissions:
  contents: read
  actions: read

jobs:
  g5-v2-recompute-admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and G4-v2 ancestry
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          G4_V2_HEAD: 025d619d24d95dd6acc29981b1bd61bce92e25a3
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$G4_V2_HEAD" HEAD
          test "$(git rev-parse "$G4_V2_HEAD:tools/awj032/glm53_g4_prefetch_plan_revalidation.py")" = "3e5686c3fe635f59e85768e1270be98175983e03"
          test "$(git rev-parse "$G4_V2_HEAD:tools/awj032/test_glm53_g4_prefetch_plan_revalidation.py")" = "f0b0b6e0c62588e6325452b57bbd8bae246de6a0"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate exact foreign parent generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          repo = "dallascourchene-commits/AuraOS"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def blob(ref, path, expected):
              obj = get(f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}")
              if obj.get("sha") != expected:
                  raise SystemExit(f"BLOB_MISMATCH:{ref}:{path}:{obj.get('sha')}")

          def proof(run_id, job_id, head):
              run = get(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              if run.get("conclusion") != "success" or run.get("head_sha") != head:
                  raise SystemExit(f"RUN_NOT_EXACT_SUCCESS:{run_id}:{run.get('head_sha')}:{run.get('conclusion')}")
              job = get(f"https://api.github.com/repos/{repo}/actions/jobs/{job_id}")
              if job.get("conclusion") != "success":
                  raise SystemExit(f"JOB_NOT_SUCCESS:{job_id}:{job.get('conclusion')}")

          # PR #759 semantic owner + proof-only hosted generation.
          blob("658b3bc651ee39454f6b94039d26ff76d48f73d8", "tools/aura_retrieval_progress_k27_alias_guard.py", "1abd821beb2a8a9a96b5ac2f0956195b20a321c7")
          blob("658b3bc651ee39454f6b94039d26ff76d48f73d8", "tests/test_aura_retrieval_progress_k27_alias_guard.py", "ddc88a73f49d6a09d67b388cf5c4958317e10ae2")
          proof(33436588718, 99634405807, "cf6b07e5c498d7c429e6679a8ba5cec5e1e46ca6")

          # PR #755 EKI-4 exact semantic/proof generation.
          blob("162fdb9c69f288090845453a67d1f41da28e8a53", "tools/aura_external_version_transition_envelope.py", "7ac33764ee238098a2887af96344ed642565ac48")
          blob("162fdb9c69f288090845453a67d1f41da28e8a53", "tests/test_aura_external_version_transition_envelope.py", "10c83c2432636908b237fe171eebd0714a10788f")
          proof(33435683382, 99631408076, "162fdb9c69f288090845453a67d1f41da28e8a53")
          PY

      - name: Compile proof surfaces
        run: |
          python3 -m py_compile \
            tools/awj032/glm53_g4_prefetch_plan_revalidation.py \
            tools/awj032/test_glm53_g4_prefetch_plan_revalidation.py \
            tools/awj032/glm53_g5_recompute_admission.py \
            tools/awj032/test_glm53_g5_recompute_admission.py

      - name: Reexecute current G4-v2 adversarial contract
        run: python3 -m unittest tools.awj032.test_glm53_g4_prefetch_plan_revalidation -v

      - name: Execute G5-v2 adversarial contract
        run: python3 -m unittest tools.awj032.test_glm53_g5_recompute_admission -v

      - name: Exhaust bounded G5-v2 control lattice
        run: |
          python3 - <<'PY'
          from tools.awj032.glm53_g5_recompute_admission import prove_finite_recompute_lattice
          proof = prove_finite_recompute_lattice()
          if proof.get("states") != 108:
              raise SystemExit(f"G5_V2_LATTICE_SIZE_MISMATCH:{proof}")
          required = (
              "HOLD_G4_OWNER_CURRENTNESS_REQUIRED",
              "HOLD_ALIAS_RESOLUTION_REQUIRED",
              "HOLD_RETRIEVAL_AXIS_CHANGE_REQUIRED",
              "COLLAPSE_RECOMPUTE_CONE",
              "HOLD_VERSION_TRANSITION_REQUIRED",
              "HOLD_SOURCE_READ_CURRENTNESS_REQUIRED",
              "ADMIT_BOUNDED_G3_RECOMPUTE_ATTEMPT",
          )
          for outcome in required:
              if proof.get(outcome, 0) <= 0:
                  raise SystemExit(f"G5_V2_OUTCOME_UNREACHED:{outcome}:{proof}")
          print(proof)
          PY

      - name: Enforce stale-shape rejection and nonpromotion ceiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("tools/awj032/glm53_g5_recompute_admission.py").read_text()
          required = (
              'G4_STRUCTURAL_MATCH_OWNER_AUTH_REQUIRED = "STRUCTURAL_MATCH_OWNER_AUTH_REQUIRED"',
              'HOLD_G4_OWNER_CURRENTNESS_REQUIRED = "HOLD_G4_OWNER_CURRENTNESS_REQUIRED"',
              'HOLD_ALIAS_RESOLUTION_REQUIRED = "HOLD_ALIAS_RESOLUTION_REQUIRED"',
              'recompute_executed_by_this_contract: bool = False',
              'native_private_transformer_kv_accessed: bool = False',
              'semantic_k27_authority_minted: bool = False',
              'gate10_promoted: bool = False',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"G5_V2_REQUIRED_MARKER_MISSING:{marker}")
          if 'G4_REVALIDATED_UNCHANGED = "REVALIDATED_UNCHANGED"' in text:
              raise SystemExit("G5_V2_LEGACY_G4_SUCCESS_CONSTANT_PRESENT")
          PY
