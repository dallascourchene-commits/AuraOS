name: WO Phase4 Triad2 Ephemeral Commit Proof V16

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wo-phase4-ephemeral-commit-proof-v16.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/wo-triad2-ci-codemap-repair-001
          fetch-depth: 0

      - name: Record source head
        run: git rev-parse HEAD | tee /tmp/phase4-source-head.txt

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python 3.12 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"

      - name: Apply validated Phase4 repair transforms
        run: |
          set -euo pipefail
          python tools/wo_triad2_ci_codemap_repair.py
          python tools/wo_triad2_ci_codemap_failclosed_patch.py
          python tools/wo_triad2_ci_codemap_command_index_patch.py
          python tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          python tools/wo_triad2_ci_skillweaver_codemap_patch.py
          python tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          python tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          python tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          python tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          python tools/wo_triad2_ci_pascal_receipt_test_patch.py

      - name: Repair remaining CODEMAP consumers and provenance binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          # Hermes: current CODEMAP file count is canonical in summary.file_count.
          path = Path('aura_hermes_arena_mode.py')
          text = path.read_text(encoding='utf-8')
          old = '''    coverage = codemap.get("coverage", {})\n    file_count = int(coverage.get("included_file_count", 0))\n    all_paths = coverage.get("all_included_paths_sorted", []) or []\n    if not file_count and all_paths:\n        file_count = len(all_paths)\n'''
          new = '''    coverage = codemap.get("coverage", {})\n    summary = codemap.get("summary", {})\n    file_count = int(\n        summary.get("file_count")\n        or coverage.get("included_file_count")\n        or coverage.get("repo_file_count")\n        or 0\n    )\n    all_paths = coverage.get("all_included_paths_sorted", []) or []\n    if not file_count and all_paths:\n        file_count = len(all_paths)\n    if not file_count and isinstance(codemap.get("files"), list):\n        file_count = len(codemap["files"])\n'''
          if old not in text:
              raise SystemExit('Hermes CODEMAP consumer patch anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Topology Health: same schema correction, preserving older CODEMAP fallback.
          path = Path('aura_topology_health.py')
          text = path.read_text(encoding='utf-8')
          old = '''    coverage = cm.get("coverage", {})\n    file_count = int(coverage.get("included_file_count", 0))\n    topo = cm.get("topology", {})\n    summary = cm.get("summary", {})\n'''
          new = '''    coverage = cm.get("coverage", {})\n    summary = cm.get("summary", {})\n    file_count = int(\n        summary.get("file_count")\n        or coverage.get("included_file_count")\n        or coverage.get("repo_file_count")\n        or 0\n    )\n    if not file_count and isinstance(cm.get("files"), list):\n        file_count = len(cm["files"])\n    topo = cm.get("topology", {})\n'''
          if old not in text:
              raise SystemExit('Topology Health CODEMAP consumer patch anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Restore the current README completion contract without expanding authority.
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = 'Construction Human Agent profile'
          if marker not in text:
              anchor = '- **Source-defeasible hydration** — compact representations must remain defeasible by exact/current source evidence.\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'README completion marker anchor count={text.count(anchor)}')
              addition = ('- **Construction Human Agent profile** — review-only projection over canonical Construction state and Observatory evidence; '
                          'it grants no physical-work, payment, access, equipment, professional, deployment, or merge authority.\n')
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text, encoding='utf-8')

          # The CI-matrix repair legitimately changes ci.yml. Rebind the existing
          # PR1 candidate-source receipt to the exact current Git blob bytes.
          ci = Path('.github/workflows/ci.yml').read_bytes()
          ci_blob = hashlib.sha1(f'blob {len(ci)}\\0'.encode('ascii') + ci).hexdigest()
          obj_path = Path('.aura/refactor_objectives/bilateral_intent_guardrail_foundry_pr1.v1.json')
          obj = json.loads(obj_path.read_text(encoding='utf-8'))
          obj['candidate_source_blobs']['.github/workflows/ci.yml'] = ci_blob
          obj_path.write_text(json.dumps(obj, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          print('ci_blob=' + ci_blob)
          PY

      - name: Restore historical UMC provenance boundary
        run: |
          cat > .github/workflows/unified-memory-continuity-deep-v2-target.yml <<'EOF'
          name: UMC deep review v2 target materialize (historical)

          # Historical PR #193 exact-head materializer.
          # PR #193 is merged and its exact reviewed generation is no longer an active
          # development head. Keeping an automatic pull_request_target trigger here caused
          # definition-level/zero-job failures after the historical binding became stale.
          # Preserve this file as auditable provenance, but require explicit manual review
          # before any historical replay.
          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            historical-boundary:
              runs-on: ubuntu-latest
              steps:
                - name: Explain historical boundary
                  shell: bash
                  run: |
                    cat <<'INNER'
                    This workflow is retained as provenance for the merged PR #193 deep-v2
                    materializer. Its former exact-head pull_request_target binding is
                    intentionally retired. Current continuity contracts are validated by
                    the active repository test suites and current CI workflows.
                    INNER
          EOF

      - name: Remove branch-local repair bootstrap files
        run: |
          rm -f tools/wo_triad2_ci_codemap_repair.py
          rm -f tools/wo_triad2_ci_codemap_failclosed_patch.py
          rm -f tools/wo_triad2_ci_codemap_command_index_patch.py
          rm -f tools/wo_triad2_ci_codemap_incremental_stability_patch.py
          rm -f tools/wo_triad2_ci_skillweaver_codemap_patch.py
          rm -f tools/wo_triad2_ci_codemap_iterator_compat_patch.py
          rm -f tools/wo_triad2_ci_agent_bridge_codemap_patch.py
          rm -f tools/wo_triad2_ci_compass_intent_fidelity_patch.py
          rm -f tools/wo_triad2_ci_compass_bounded_handoff_patch.py
          rm -f tools/wo_triad2_ci_pascal_receipt_test_patch.py
          rm -f .github/workflows/wo-triad2-ci-codemap-repair-bootstrap.yml

      - name: Compile and regenerate final CODEMAP generation
        run: |
          python -m py_compile \
            aura_codebase_navigator.py aura_codemap_verify.py aura_architect_loop.py \
            aura_topological_scanner.py aura_topology_manager.py aura_fusion.py \
            aura_skillweaver.py aura_agent_arena_bridge.py aura_coding_relationship_compass.py \
            aura_topology_health.py aura_hermes_arena_mode.py \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py
          python aura_codebase_navigator.py --refresh-topology
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python -m aura_codemap_verify
          git diff --check

      - name: Create local-only committed-state proof head
        run: |
          git config user.name 'Aura Phase4 Local Proof'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test(wc02): ephemeral committed-state Phase4 proof'
          git status --porcelain
          git rev-parse HEAD | tee /tmp/phase4-proof-head.txt
          git rev-parse HEAD^{tree} | tee /tmp/phase4-proof-tree.txt
          python -m aura_codemap_verify

      - name: Python 3.12 focused contracts
        id: contracts312
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_aura_topology_health.py \
            tests/test_aura_hermes_arena_mode.py::TestPreflight::test_preflight_repo_digest_has_codemap_status \
            tests/test_aura_system_stabilization.py::TestStabilization::test_codemap_counts \
            tests/test_bilateral_intent_pr1_evidence.py::test_recorded_candidate_source_blobs_match_checkout \
            tests/test_aura_source_integrity.py::test_repository_python_sources_are_strict_utf8 \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            --junitxml=phase4-focused-py312.xml 2>&1 | tee phase4-focused-py312.txt

      - name: Python 3.12 full pytest-native suite
        id: full312
        continue-on-error: true
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings \
            --ignore=test_aura_functions.py \
            --ignore=test_synthesis_upgrades.py \
            --ignore=test_syntax_fixes.py \
            --ignore=test_codemap_hooks_simple.py \
            --ignore=test_pvm_logic.py \
            --ignore=test_aura_substrate.py \
            --deselect=tests/test_aura_human_agent_arena.py::test_affordance_map_declares_source_of_truth \
            --junitxml=phase4-full-py312.xml 2>&1 | tee phase4-full-py312.txt

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python 3.10 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Python 3.10 focused contracts
        id: contracts310
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_aura_topology_health.py \
            tests/test_aura_hermes_arena_mode.py::TestPreflight::test_preflight_repo_digest_has_codemap_status \
            tests/test_aura_system_stabilization.py::TestStabilization::test_codemap_counts \
            tests/test_bilateral_intent_pr1_evidence.py::test_recorded_candidate_source_blobs_match_checkout \
            tests/test_aura_source_integrity.py::test_repository_python_sources_are_strict_utf8 \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            --junitxml=phase4-focused-py310.xml 2>&1 | tee phase4-focused-py310.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo-phase4-v16-diagnostics-${{ github.run_id }}
          path: |
            phase4-focused-py312.txt
            phase4-focused-py312.xml
            phase4-full-py312.txt
            phase4-full-py312.xml
            phase4-focused-py310.txt
            phase4-focused-py310.xml
            /tmp/phase4-source-head.txt
            /tmp/phase4-proof-head.txt
            /tmp/phase4-proof-tree.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce all proof gates
        if: steps.contracts312.outcome != 'success' || steps.full312.outcome != 'success' || steps.contracts310.outcome != 'success'
        run: |
          echo "Committed-state proof is not 100% green; refusing proof bundle."
          echo "py312 focused=${{ steps.contracts312.outcome }}"
          echo "py312 full=${{ steps.full312.outcome }}"
          echo "py310 focused=${{ steps.contracts310.outcome }}"
          exit 1

      - name: Package exact committed-state proof bundle
        run: |
          git bundle create /tmp/wo-phase4-proof.bundle HEAD
          git archive --format=tar.gz --output=/tmp/wo-phase4-proof-tree.tar.gz HEAD
          cp /tmp/phase4-source-head.txt /tmp/wo-phase4-source-head.txt
          cp /tmp/phase4-proof-head.txt /tmp/wo-phase4-proof-head.txt
          cp /tmp/phase4-proof-tree.txt /tmp/wo-phase4-proof-tree.txt
          sha256sum \
            /tmp/wo-phase4-proof.bundle \
            /tmp/wo-phase4-proof-tree.tar.gz \
            /tmp/wo-phase4-source-head.txt \
            /tmp/wo-phase4-proof-head.txt \
            /tmp/wo-phase4-proof-tree.txt \
            > /tmp/wo-phase4-proof.sha256

      - name: Upload exact committed-state proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: wo-phase4-committed-proof-${{ github.run_id }}
          path: |
            /tmp/wo-phase4-proof.bundle
            /tmp/wo-phase4-proof-tree.tar.gz
            /tmp/wo-phase4-source-head.txt
            /tmp/wo-phase4-proof-head.txt
            /tmp/wo-phase4-proof-tree.txt
            /tmp/wo-phase4-proof.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Confirm no remote mutation
        run: |
          echo 'Proof commit exists only inside this disposable runner.'
          echo 'No push, PR, merge, release, or deployment occurred.'
