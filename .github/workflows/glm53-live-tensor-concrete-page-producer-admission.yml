name: GLM53 Live Tensor Concrete Page Producer Admission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  q9-live-producer-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Q9 head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact PR645 x PR646 convergence and hosted parents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          convergence = "fa9f17fba4f9e0011c35fc6404789bf13692b4ec"
          pr645 = "e97c584e79439f599f7a443d86df23a11cab75ad"
          pr646 = "71d4816cf0702a39b57ecf7d6bae6298ec239800"
          parents = subprocess.check_output(
              ["git", "rev-list", "--parents", "-n", "1", convergence],
              text=True,
          ).strip().split()
          assert parents == [convergence, pr645, pr646], parents

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          for run_id, head in (
              (33371374486, pr645),
              (33371459229, pr646),
          ):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run["status"] == "completed", (run_id, run["status"])
              assert run["conclusion"] == "success", (run_id, run["conclusion"])
              assert run["head_sha"] == head, (run_id, run["head_sha"], head)

          print("Q9_EXACT_PARENT_RUNS_GREEN=true")
          PY

      - name: Prove exact parent source blobs are retained
        shell: bash
        run: |
          set -euo pipefail
          PR645=e97c584e79439f599f7a443d86df23a11cab75ad
          PR646=71d4816cf0702a39b57ecf7d6bae6298ec239800
          PROV=tools/quantization/aura_glm53_official_source_concrete_page_provenance_join.py
          HIST=tools/quantization/aura_glm53_historical_official_w2_bridge.py
          test "$(git rev-parse "$PR645:$PROV")" = "7951124182a0ed9396cf294a8c811bf8555391a9"
          test "$(git rev-parse "$PR646:$HIST")" = "77a90ea9f5a438aa438103acd4de05432fe7875a"
          test "$(git rev-parse "HEAD:$PROV")" = "7951124182a0ed9396cf294a8c811bf8555391a9"
          test "$(git rev-parse "HEAD:$HIST")" = "77a90ea9f5a438aa438103acd4de05432fe7875a"
          echo "Q9_EXACT_PARENT_SOURCE_BLOBS_RETAINED=true"

      - name: Run Q9 adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/quantization/aura_glm53_official_source_concrete_page_provenance_join.py \
            tools/quantization/aura_glm53_historical_official_w2_bridge.py \
            tools/quantization/aura_glm53_live_tensor_concrete_page_producer_admission.py \
            tests/test_aura_glm53_live_tensor_concrete_page_producer_admission.py
          python3 -m unittest -v tests.test_aura_glm53_live_tensor_concrete_page_producer_admission
          PYTHONPATH=. python3 -m tools.quantization.aura_glm53_live_tensor_concrete_page_producer_admission | tee /tmp/q9.json

      - name: Assert temporal provenance boundary and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          r = json.load(open("/tmp/q9.json", encoding="utf-8"))
          assert r["disposition"] == "HOLD_LIVE_OFFICIAL_TENSOR_TO_CONCRETE_PAGE_PRODUCER"
          assert r["historical_representative_header_schema_qualified"] is True
          assert r["historical_representative_header_provenance_bound"] is True
          assert r["historical_fp8_companion_geometry_bound"] is True
          assert r["historical_evidence_reduces_header_schema_uncertainty"] is True
          assert r["historical_header_evidence_sufficient_for_live_producer"] is False
          assert r["current_consumer_raw_index_bytes_materialized"] is False
          assert r["current_consumer_raw_header_prefixes_materialized"] is False
          assert r["live_official_tensor_payload_observed"] is False
          assert r["exact_live_official_tensor_to_concrete_source_tensor_set_relation"] is False
          assert r["candidate_page_materialization_owner_bound"] is False
          assert r["baseline_same_live_official_source_tensor_set_proven"] is False
          assert r["live_tensor_to_concrete_page_producer_admissible"] is False
          assert r["currentness_revalidation_required_at_use"] is True
          assert r["representative_scope_only"] is True
          assert len(r["required_live_evidence"]) == 4
          for key in (
              "real_tensor_quantization_eligible",
              "model_execution_eligible",
              "generalized_quality_proven",
              "runtime_performance_proven",
              "semantic_k27_authority",
              "native_private_transformer_kv_accessed",
              "gate10_promoted",
              "deployment_authorized",
          ):
              assert r[key] is False, key

          print("Q9_FAIL_CLOSED_TEMPORAL_PRODUCER_ADMISSION=true")
          PY
