name: AWJ032 GLM53 W4 cache policy decision

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_w4_host_preflight.py"
      - "tools/awj032/test_glm53_w4_host_preflight.py"
      - "tools/awj032/glm53_w4_cache_policy_decision.py"
      - "tools/awj032/test_glm53_w4_cache_policy_decision.py"
      - ".github/workflows/awj032-glm53-w4-cache-policy-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj032-glm53-w4-cache-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cache-policy-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile W4 verifier planes
        run: |
          python -m py_compile \
            tools/awj032/glm53_w4_host_preflight.py \
            tools/awj032/test_glm53_w4_host_preflight.py \
            tools/awj032/glm53_w4_cache_policy_decision.py \
            tools/awj032/test_glm53_w4_cache_policy_decision.py
      - name: Run inherited PR408 W4 counter contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/awj032
        run: |
          python -m unittest tools.awj032.test_glm53_w4_host_preflight -v
      - name: Run cache-policy decision contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/awj032
        run: |
          python -m unittest tools.awj032.test_glm53_w4_cache_policy_decision -v
