name: PR863 K27 Gate10 Replay

on:
  push:
    branches:
      - arena/wave2-k27-runtime-binding-e4b9-addendum
    paths:
      - '.github/workflows/pr863-k27-gate10-replay.yml'
      - 'tools/arena/k27_memory/**'
      - 'tools/arena/k27_memory_runtime.py'
      - 'tools/arena/k27_memory_city_spatial_seam/**'
      - 'tests/test_k27_*.py'
      - 'tests/test_frame_address_immutability.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr863-k27-gate10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  epoch-cas-replay:
    name: Gate10 epoch/CAS replay Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute campaign-oracle regressions
        run: python -m unittest -v tests.test_k27_gate10_campaign_oracle
      - name: Execute 5x750 Gate10 campaign
        run: |
          python tools/arena/k27_memory/campaign_epoch_invalidation_gate10.py > gate10-receipt.json
          cat gate10-receipt.json
      - name: Enforce hard invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('gate10-receipt.json').read_text())
          expected = {
              'workers': 5,
              'rounds': 750,
              'attempts': 3750,
              'false_accept': 0,
              'false_hold': 0,
              'aba_violations': 0,
              'stale_dependency_violations': 0,
              'omega8_keepers': 1,
              'routing13_hard_invalid_repairs': 0,
              'routing13_decision_variations': 0,
              'routing13_vectors_checked': 15066,
              'campaign_complete': True,
              'completed_rounds': 750,
              'round_failures': 0,
          }
          bad = {k: (r.get(k), v) for k, v in expected.items() if r.get(k) != v}
          if bad:
              raise SystemExit(f'Gate10 invariant failure: {bad}')
          final = r.get('final') or {}
          if final.get('root_scope') != 'POST_DEPENDENCY_REPAIR':
              raise SystemExit(f"Gate10 root-scope failure: {final.get('root_scope')}")
          if not isinstance(final.get('root'), str) or len(final['root']) != 64:
              raise SystemExit('Gate10 final root is not one SHA-256 digest')
          print('GATE10_EPOCH_CAS_REPLAY_PASS', r['campaign_root'], final['root'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr863-gate10-epoch-cas-py${{ matrix.python }}-${{ github.sha }}
          path: gate10-receipt.json
          if-no-files-found: error
          retention-days: 30
