name: Aura Construction runtime diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-construction-runtime-diagnostic.yml"
      - ".aura/runtime_profiles/construction_demo.v1.json"
      - "scripts/aura_architecture_harness.py"
      - "scripts/aura_runtime_refactor_harness.py"
      - "tests/test_aura_runtime_refactor_harness.py"
      - "tests/runtime/construction_demo_browser_probe.cjs"
      - "aura_spatial_web/**"
      - "aura_construction_demo_*.py"
      - "aura_spatial_cli.py"

permissions:
  contents: read

concurrency:
  group: aura-construction-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Runtime Refactor Harness contracts
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q tests/test_aura_runtime_refactor_harness.py
          python -m py_compile \
            scripts/aura_architecture_harness.py \
            scripts/aura_runtime_refactor_harness.py

      - name: Install bounded browser runtime
        run: |
          mkdir -p /tmp/aura-playwright
          cd /tmp/aura-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Construction Runtime Refactor Harness
        env:
          NODE_PATH: /tmp/aura-playwright/node_modules
        run: |
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            runtime \
            --profile .aura/runtime_profiles/construction_demo.v1.json \
            --output-dir /tmp/aura-construction-runtime \
            --venv /tmp/aura-construction-venv \
            --install-requirements

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-runtime-evidence
          path: /tmp/aura-construction-runtime
          if-no-files-found: error
          retention-days: 7
