name: Apply PR183 Codex Round 3 Fixes

on:
  pull_request:
    paths:
      - ".aura/apply-pr183-codex-round3"

permissions:
  contents: write

concurrency:
  group: apply-pr183-codex-round3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply manually verified fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target")
              target.write_text(text.replace(old, new), encoding="utf-8")

          def append_once(path: str, marker: str, payload: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if marker in text:
                  return
              target.write_text(text.rstrip() + "\n\n\n" + payload.strip() + "\n", encoding="utf-8")

          replace_once(
              "scripts/aura_prepare_construction_demo_assets.py",
