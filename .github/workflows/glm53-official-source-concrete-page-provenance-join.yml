name: GLM53 Official Source Concrete Page Provenance Join

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-provenance-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Q9 head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove original Q642 x Q641 convergence and historical W2 convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          original='22625150948c3143b57400e58a6d09af418a9a28'
          bridge='023cc10c25372f0e871f287cc5a22b9196c8a094'
          concrete='a8d4605a36e04d64cf03f43f457be4bde553e602'
          p=subprocess.check_output(['git','rev-list','--parents','-n','1',original],text=True).strip().split()
          assert p == [original,bridge,concrete], p
          convergence='718c51ddc07463912a16a5ff43cdc2387a367cef'
          q8parent='570e8706fd453e91441abb0b7b57b6229779b06d'
          historical='71d4816cf0702a39b57ecf7d6bae6298ec239800'
          p=subprocess.check_output(['git','rev-list','--parents','-n','1',convergence],text=True).strip().split()
          assert p == [convergence,q8parent,historical], p
          git_head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.check_call(['git','merge-base','--is-ancestor',convergence,git_head])
          print('Q9_HISTORICAL_W2_TRUE_CONVERGENCE=true')
          PY

      - name: Revalidate exact hosted generations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          expected=(
              (33370777504,'023cc10c25372f0e871f287cc5a22b9196c8a094'),
              (33370700852,'a8d4605a36e04d64cf03f43f457be4bde553e602'),
              (33371459229,'71d4816cf0702a39b57ecf7d6bae6298ec239800'),
          )
          headers={
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          for run_id,head in expected:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{run_id}",headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  run=json.load(response)
              assert run['status']=='completed', (run_id,run['status'])
              assert run['conclusion']=='success', (run_id,run['conclusion'])
              assert run['head_sha']==head, (run_id,run['head_sha'],head)
              print(f'EXACT_HOSTED_GREEN={run_id}:{head}')
          PY

      - name: Prove exact historical W2 producer bridge is materialized
        shell: bash
        run: |
          set -euo pipefail
          HIST=71d4816cf0702a39b57ecf7d6bae6298ec239800
          BLOB=77a90ea9f5a438aa438103acd4de05432fe7875a
          test "$(git rev-parse HEAD:tools/quantization/aura_glm53_historical_official_w2_bridge.py)" = "$BLOB"
          test "$(git show "$HIST:tools/quantization/aura_glm53_historical_official_w2_bridge.py" | git hash-object --stdin)" = "$BLOB"
          echo "HISTORICAL_W2_EXACT_BRIDGE_MATERIALIZED=true"

      - name: Recompute historical W2 consequence and Q9 frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/quantization/aura_glm53_official_source_admission.py \
            tools/quantization/aura_glm53_historical_official_w2_bridge.py \
            tools/quantization/aura_glm53_official_source_concrete_page_provenance_join.py \
            tools/quantization/test_aura_glm53_official_source_concrete_page_provenance_join.py
          python3 -m unittest -v tools.quantization.test_aura_glm53_official_source_concrete_page_provenance_join
          python3 -m tools.quantization.aura_glm53_official_source_concrete_page_provenance_join | tee /tmp/q9.json

      - name: Assert historical positive plane and current provenance ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/q9.json',encoding='utf-8'))
          assert r['historical_raw_index_verification_observed'] is True
          assert r['historical_weight_map_relation_observed'] is True
          assert r['historical_representative_headers_observed'] is True
          assert r['historical_fp8_companions_bound'] is True
          assert r['historical_payload_bytes_read'] == 0
          assert r['historical_representative_header_geometry_conforms_current_schema'] is True
          assert r['historical_representative_layer'] == 3
          assert r['historical_representative_expert'] == 0
          assert r['representative_per_expert_serialization_proven'] is True
          assert r['all_layers_experts_uniformity_proven'] is False
          assert r['current_consumer_raw_index_bytes_materialized'] is False
          assert r['current_consumer_raw_header_prefixes_materialized'] is False
          assert r['official_source_transport_frontier_complete'] is False
          assert r['official_source_tensor_payload_observed'] is False
          assert r['official_source_byte_domain_bound_to_trial'] is False
          assert r['concrete_page_source_tensor_set_bound_to_official_source'] is False
          assert r['candidate_page_materialization_owner_bound'] is False
          assert r['baseline_same_official_source_tensor_set_proven'] is False
          assert r['historical_header_evidence_closes_current_transport'] is False
          assert r['historical_header_evidence_closes_materialization_provenance'] is False
          assert r['source_transport_repair_alone_sufficient'] is False
          assert r['disposition']=='HOLD_OFFICIAL_SOURCE_TO_CONCRETE_PAGE_PROVENANCE'
          for key in ('real_tensor_quantization_eligible','generalized_quality_proven','runtime_performance_proven','semantic_k27_authority','native_private_transformer_kv_accessed','gate10_promoted','deployment_authorized'):
              assert r[key] is False, key
          print('HISTORICAL_HEADERS_NE_CURRENT_BYTES=true')
          print('HISTORICAL_HEADERS_NE_SOURCE_TO_PAGE_PROVENANCE=true')
          print('Q9_FAIL_CLOSED_PROVENANCE_FRONTIER=true')
          PY
