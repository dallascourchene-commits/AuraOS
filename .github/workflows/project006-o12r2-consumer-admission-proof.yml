name: Project006 O12R2 Canonical Consumer Admission Proof

on:
  pull_request:
    paths:
      - "tools/project006/consumer_admitted_currentness.py"
      - "tools/project006/o12r2_reference/**"
      - "tests/test_project006_consumer_admitted_currentness_o12r2.py"
      - ".github/workflows/project006-o12r2-consumer-admission-proof.yml"

permissions:
  contents: read

jobs:
  exact-three-venv-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run exact source in three fresh virtual environments
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            rm -rf ".venv-o12r2-$i"
            python -m venv ".venv-o12r2-$i"
            PY=".venv-o12r2-$i/bin/python"
            "$PY" -m unittest -q tests/test_project006_consumer_admitted_currentness_o12r2.py
            (cd tools/project006/o12r2_reference && PYTHONPATH="$GITHUB_WORKSPACE/tools/project006:$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$PY" -m unittest -q test_consumer_admitted_currentness.py)
            (cd tools/project006/o12r2_reference && PYTHONPATH="$GITHUB_WORKSPACE/tools/project006:$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$PY" campaign_o12r2.py) > "o12r2-campaign-$i.json"
            (cd tools/project006/o12r2_reference && PYTHONPATH="$GITHUB_WORKSPACE/tools/project006:$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/$PY" hyperscale_o12r2.py) > "o12r2-hyperscale-$i.json"
          done
          cmp o12r2-campaign-1.json o12r2-campaign-2.json
          cmp o12r2-campaign-1.json o12r2-campaign-3.json
          cmp o12r2-hyperscale-1.json o12r2-hyperscale-2.json
          cmp o12r2-hyperscale-1.json o12r2-hyperscale-3.json
          python - <<'PY'
          import json
          c=json.load(open('o12r2-campaign-1.json')); h=json.load(open('o12r2-hyperscale-1.json'))
          assert c['cases']==30000 and c['oracle_mismatches']==0 and c['unsafe_candidate_provider_permits']==0
          assert c['structural_currentness_false_permits']>0
          assert h['omega8']['states']==6561 and h['omega8']['keepers']==1
          assert h['d13']['states']==1594323 and h['d13']['hard_invalid_context_repairs']==0
          assert h['hs1000']['cells']==1000 and h['claim_breakthroughs']==0
          PY
          git diff --exit-code
