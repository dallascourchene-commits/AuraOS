name: Bilateral PR2 confirmation currency finalizer

on:
  push:
    branches:
      - refactor/bilateral-intent-pr2
    paths:
      - .github/workflows/bilateral-pr2-currency-finalize.yml

permissions:
  contents: write

concurrency:
  group: bilateral-pr2-confirmation-currency-finalizer
  cancel-in-progress: false

jobs:
  patch-prove-sync-and-dissolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilateral-intent-pr2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Exclude the confirmation audit ledger from its own currency identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_arena_gate_dialogue.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def _phase_hash(state: dict[str, Any]) -> str:\n")
          end = text.index("\n\ndef _intent_summary", start)
          replacement = '''def _phase_hash(state: dict[str, Any]) -> str:
              evidence = {
                  str(key): value
                  for key, value in dict(state.get("evidence") or {}).items()
                  if key != "approved_gate_intents"
              }
              routed = dict(state.get("state_packet") or {})
              return _digest(
                  {
                      "workflow_id": state.get("workflow_id"),
                      "phase": state.get("current_phase"),
                      "objective": state.get("objective"),
                      "evidence": evidence,
                      "grammar_version": state.get("grammar_version"),
                      "routed_state": routed.get("state") or routed.get("current_state") or "",
                  }
              )
          '''.replace("          ", "")
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Run focused source, lifecycle, and compatibility proof
        run: |
          python -m py_compile aura_bilateral_intent_compiler.py aura_arena_gate_dialogue.py
          node --check aura_showcase/gate-dialogue.js
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            tests/test_aura_showcase_gate_dialogue.py
          python -m pytest -q \
            tests/test_aura_bilateral_gate_dialogue.py \
            tests/test_aura_showcase_gate_dialogue.py
      - name: Dissolve finalizer before regenerating navigation artifacts
        run: rm .github/workflows/bilateral-pr2-currency-finalize.yml
      - name: Regenerate and verify exact navigation artifacts
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Publish verified result
        run: |
          git config user.name "AuraOS PR2 Currency Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_arena_gate_dialogue.py \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .github/workflows/bilateral-pr2-currency-finalize.yml
          git commit -m "fix(intent): keep fresh confirmations current"
          git push origin HEAD:refactor/bilateral-intent-pr2
