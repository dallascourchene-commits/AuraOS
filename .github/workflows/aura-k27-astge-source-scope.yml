name: Aura K27 ASTGE Source Scope Contract

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-scope/**"
      - ".github/workflows/aura-k27-astge-source-scope.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-k27-astge-source-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-scope-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Format contract
        run: cargo fmt --manifest-path crates/aura-k27-astge-scope/Cargo.toml -- --check

      - name: Test source confinement
        run: cargo test --manifest-path crates/aura-k27-astge-scope/Cargo.toml --all-targets

      - name: Clippy fail-closed
        run: cargo clippy --manifest-path crates/aura-k27-astge-scope/Cargo.toml --all-targets -- -D warnings

      - name: Emit claim ceiling
        run: |
          echo 'SOURCE_SCOPE_CONFINEMENT_PROVEN=true'
          echo 'SEMANTIC_CORRECTNESS_PROVEN=false'
          echo 'K27_MUTATION_AUTHORITY_GRANTED=false'
          echo 'TREE_SITTER_MUTATION_AUTHORITY_GRANTED=false'
          echo 'MERGE_DEPLOY_EFFECT_AUTHORITY=false'
