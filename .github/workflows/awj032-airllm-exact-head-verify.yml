name: AWJ032 AirLLM Exact Head Verify

on:
  push:
    branches:
      - awj032/airllm-source-admission-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.2,<9.0"
      - name: Compile AWJ032 source gate modules
        run: |
          python -m py_compile \
            tools/awj032/airllm_source_admission.py \
            tools/awj032/airllm_hard_false_remediation.py \
            tools/awj032/airllm_hard_false_inspected_tree.py
      - name: Run focused AirLLM source suites
        run: |
          python -m pytest -q \
            tools/awj032/test_airllm_source_admission.py \
            tools/awj032/test_airllm_binding_mutation_soundness.py \
            tools/awj032/test_airllm_hard_false_remediation.py \
            tools/awj032/test_airllm_hard_false_inspected_tree.py
