name: Aura Temporary S4-B Hardening Apply

on:
  pull_request:
    paths:
      - ".github/workflows/aura-s4b-hardening-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact S4-B branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 1
          submodules: false

      - name: Reconstruct and verify reviewed patch
        run: |
          set -euo pipefail
          cat \
            .aura_temp/s4b_hardening_00.b64 \
            .aura_temp/s4b_hardening_01a.b64 \
            .aura_temp/s4b_hardening_01b.b64 \
            .aura_temp/s4b_hardening_01c.b64 \
            | base64 --decode | gzip --decompress > /tmp/s4b-hardening.patch
          echo "fcc25bf193838041c5319a035d82432e68cfb1d195c0c16c0c1980cc8f525ac9  /tmp/s4b-hardening.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/s4b-hardening.patch

      - name: Apply and push permanent source
        run: |
          set -euo pipefail
          git apply /tmp/s4b-hardening.patch
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/aura-s4b-hardening-temp.yml' ':!.aura_temp'
          git commit -m "fix: harden spatial S4-B fallback and asset boundaries"
          git push origin HEAD:feature/spatial-s4b-gaussian-security
