name: Finalize Runtime Harness Review Cleanup

on:
  pull_request:
    types: [synchronize]
    paths:
      - "tools/runtime_review_cleanup/**"

permissions:
  contents: write

concurrency:
  group: aura-runtime-review-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove checkout credential before repository execution
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Apply exact review cleanup
        run: python tools/runtime_review_cleanup/apply.py

      - name: Validate cleanup
        run: |
          ruff check scripts/aura_runtime_refactor_harness.py tests/test_aura_runtime_refactor_harness.py
          python -m pytest -q --tb=short tests/test_aura_runtime_refactor_harness.py
          node --check tests/runtime/construction_demo_browser_probe.cjs
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/aura-waboose-state.json \
            run \
            --request .aura/waboose_requests/construction_demo.v1.json \
            > /tmp/aura-waboose-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/aura-waboose-result.json').read_text(encoding='utf-8'))
          assert result.get('ok') is True, result
          assert result.get('findings') == [], result.get('findings')
          assert result.get('forge_repair_requests') == [], result.get('forge_repair_requests')
          PY
          git diff --check

      - name: Remove one-time patch script
        run: git rm -rf tools/runtime_review_cleanup

      - name: Publish exact verified cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Runtime Harness"
          git config user.email "aura-runtime-harness@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): separate Waboose request and complete fresh-run docs"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
          unset AUTH_HEADER
