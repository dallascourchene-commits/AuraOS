name: Aura Spatial final reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s5-s6-construction.yml"

permissions:
  contents: write

concurrency:
  group: aura-spatial-final-reconciliation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize-combined-tree:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy

      - name: Restore permanent workflow and remove temporary runners
        run: |
          set -euo pipefail
          cp .aura/tmp/final-spatial-workflow.yml .github/workflows/aura-spatial-s5-s6-construction.yml
          rm .aura/tmp/final-spatial-workflow.yml
          rm -f .github/workflows/aura-spatial-reconcile-temp.yml

      - name: Regenerate and verify CODEMAP and topology
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json

      - name: Verify combined source surface
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py
          python -m ruff check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py
          python -m ruff format --check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py
          python aura_spatial_cli.py --repo-root . validate-route
          python -m pytest -q --tb=short tests/test_aura_spatial*.py
          python -m pytest -q --tb=short tests/test_aura_construction*.py
          python -m pytest -q --tb=short \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_agent_arena_github_bridge.py
          npm run test:spatial

      - name: Publish verified combined artifacts
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Reconciliation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test ! -e .github/workflows/aura-spatial-reconcile-temp.yml
          test ! -e .aura/tmp/final-spatial-workflow.yml
          git diff --cached --check
          git commit -m "chore: finalize combined Spatial and GitHub publication artifacts"
          git push origin HEAD:"$TARGET_BRANCH"
