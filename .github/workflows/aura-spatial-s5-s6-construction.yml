name: Aura Spatial S5 and S6 Construction

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s5-s6-construction.yml"
      - ".aura/arena_routes/spatial.v1.json"
      - "aura_spatial_*.py"
      - "aura_construction_runtime_binding.py"
      - "aura_review_lessons_security.py"
      - "aura_arena_persistence_adapters.py"
      - "aura_agent_arena_persistence_bridge.py"
      - "aura_agent_arena_mcp.py"
      - "scripts/aura_spatial_s5_s6_construction_architect_harness.py"
      - "tests/test_aura_spatial*.py"
      - "tests/test_aura_construction*.py"
      - "tests/test_aura_arena_persistence_adapters.py"
      - "tests/test_aura_agent_arena_mcp.py"
      - "README.md"
      - "USER_GUIDE.md"
      - ".aura/ARCHITECTURE.md"
      - "docs/AURA_SPATIAL_S5_S6_CONSTRUCTION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-spatial-s5-s6-construction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-s5-s6-construction:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONHASHSEED: "0"
      AURA_S5_S6_ARCHITECT_TIMEOUT_SECONDS: "300"
      AURA_S5_S6_ARCHITECT_TOTAL_TIMEOUT_SECONDS: "900"
    steps:
      - name: Clone bounded pull-request history
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth=256 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXPECTED_HEAD"
          echo "$observed" > /tmp/spatial_s5_s6_exact_head.txt

      - name: Fetch bounded base reference
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy

      - name: Publish final URI and Waboose precision repair once
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure_replace(path: str, old: str, new: str, marker: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new, 1)
                  target.write_text(text, encoding="utf-8")
              elif marker not in text:
                  raise SystemExit(f"missing old and new forms in {path}: {marker}")

          ensure_replace(
              "aura_spatial_construction.py",
              "import hashlib\nimport math\nfrom typing import Any\n",
              "import hashlib\nimport math\nfrom pathlib import PurePosixPath\nimport re\nfrom typing import Any\nfrom urllib.parse import unquote, urlsplit\n",
              "from urllib.parse import unquote, urlsplit",
          )
          ensure_replace(
              "aura_spatial_construction.py",
              '_ALLOWED_ASSET_SCHEMES = ("aura://", "file://")\n',
              "_MAX_CONSTRUCTION_ASSET_URI_BYTES = 4096\n",
              "_MAX_CONSTRUCTION_ASSET_URI_BYTES",
          )
          ensure_replace(
              "aura_spatial_construction.py",
              '''    if not asset.uri.startswith(_ALLOWED_ASSET_SCHEMES):
                  raise ValueError("Construction floor-plan assets must be local or Aura-addressed")
          ''',
              "    _validate_local_asset_uri(asset.uri)\n",
              "_validate_local_asset_uri(asset.uri)",
          )
          ensure_replace(
              "aura_spatial_construction.py",
              "def _validate_floor_plan_asset(asset: SpatialAssetManifest, privacy: SpatialPrivacyClass) -> None:\n",
              '''def _validate_local_asset_uri(value: Any) -> str:
              if type(value) is not str:
                  raise ValueError("Construction floor-plan asset URI must be a string")
              uri = value.strip()
              if uri != value or not uri or len(uri.encode("utf-8")) > _MAX_CONSTRUCTION_ASSET_URI_BYTES:
                  raise ValueError("Construction floor-plan asset URI is empty, padded, or oversized")
              if any(ord(char) < 32 or ord(char) == 127 for char in uri):
                  raise ValueError("Construction floor-plan asset URI contains control characters")
              lowered = uri.casefold()
              if "\\" in uri or re.search(r"%(?:2f|5c)", lowered):
                  raise ValueError("Construction floor-plan asset URI contains an encoded or aliased separator")
              decoded = unquote(uri)
              if decoded.count("/") != uri.count("/") or decoded.count("\\") != uri.count("\\"):
                  raise ValueError("Construction floor-plan asset URI changes separators when decoded")
              parsed = urlsplit(uri)
              if parsed.scheme not in {"aura", "file"}:
                  raise ValueError("Construction floor-plan assets must be local or Aura-addressed")
              scheme, separator, remainder = uri.partition(":")
              if separator != ":" or scheme != parsed.scheme or not remainder.startswith("//"):
                  raise ValueError("Construction floor-plan asset URI must use a canonical hierarchical scheme")
              if parsed.username is not None or parsed.password is not None or parsed.query or parsed.fragment:
                  raise ValueError("Construction floor-plan asset URI cannot contain credentials, query, or fragment")
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise ValueError("Construction floor-plan asset URI contains a malformed authority") from exc
              if port is not None:
                  raise ValueError("Construction floor-plan asset URI cannot contain a port")
              if parsed.scheme == "aura":
                  if not parsed.netloc or parsed.netloc != parsed.netloc.casefold():
                      raise ValueError("Aura asset URI requires a canonical lowercase authority")
              elif parsed.netloc not in {"", "localhost"}:
                  raise ValueError("file asset URI cannot name a remote host")
              path = parsed.path
              if not path.startswith("/") or "//" in path or (len(path) > 1 and path.endswith("/")):
                  raise ValueError("Construction floor-plan asset URI path is not canonical")
              if any(part in {".", ".."} for part in PurePosixPath(path).parts):
                  raise ValueError("Construction floor-plan asset URI path contains a dot segment")
              return uri


          def _validate_floor_plan_asset(asset: SpatialAssetManifest, privacy: SpatialPrivacyClass) -> None:
          ''',
              "def _validate_local_asset_uri",
          )

          ensure_replace(
              "aura_review_lessons_security.py",
              "def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:\n",
              '''def _is_spatial_no_authority_envelope(candidate: Any) -> bool:
              return bool(
                  isinstance(candidate, Mapping)
                  and candidate.get("projection_only") is True
                  and candidate.get("renderer_authority") is False
                  and candidate.get("execution_authority") is False
                  and candidate.get("patch_authority") is False
                  and candidate.get("production_mutation") is False
              )


          def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:
          ''',
              "def _is_spatial_no_authority_envelope",
          )
          ensure_replace(
              "aura_review_lessons_security.py",
              '''    findings: list[dict[str, Any]] = []
              for path, key, value in _walk_metadata(candidate):
          ''',
              '''    findings: list[dict[str, Any]] = []
              spatial_no_authority = _is_spatial_no_authority_envelope(candidate)
              for path, key, value in _walk_metadata(candidate):
          ''',
              "spatial_no_authority = _is_spatial_no_authority_envelope(candidate)",
          )
          ensure_replace(
              "aura_review_lessons_security.py",
              '''        expected = _PROTECTED_AUTHORITY_EXPECTED[key]
              if value == "<dynamic>":
          ''',
              '''        expected = _PROTECTED_AUTHORITY_EXPECTED[key]
              if key == "patch_authority" and path == "$.patch_authority" and spatial_no_authority:
                  continue
              if value == "<dynamic>":
          ''',
              'path == "$.patch_authority" and spatial_no_authority',
          )
          ensure_replace(
              "aura_review_lessons_security.py",
              '''        uri = str(value or "").strip()
              lowered = uri.casefold()
          ''',
              '''        uri = str(value or "").strip()
              scheme, separator, remainder = uri.partition(":")
              if separator == ":" and remainder == "//" and re.fullmatch(r"[A-Za-z][A-Za-z0-9+.-]*", scheme):
                  continue
              lowered = uri.casefold()
          ''',
              'remainder == "//"',
          )

          test = Path("tests/test_aura_spatial_waboose_precision.py")
          if not test.exists():
              test.write_text(
                  '''from __future__ import annotations

          import ast
          from dataclasses import replace

          import pytest

          from aura_coding_waboose_review_learning import scan_python_review_lessons
          from aura_review_lessons_security import (
              detect_protected_metadata_overrides,
              detect_uri_alias_encoding,
          )
          from aura_spatial_construction import project_construction_state_to_scene
          from tests.test_aura_spatial_s6_construction import _fixture_packet, _floor_asset


          def test_review_lesson_uri_detector_ignores_canonical_scheme_prefix_tokens() -> None:
              assert detect_uri_alias_encoding("aura://") == []
              assert detect_uri_alias_encoding("file://") == []
              assert detect_uri_alias_encoding("aura:////forged")
              assert detect_uri_alias_encoding("aura://construction/%2fsecret")


          def test_review_lesson_authority_detector_accepts_typed_spatial_no_authority_envelope() -> None:
              envelope = {
                  "projection_only": True,
                  "renderer_authority": False,
                  "execution_authority": False,
                  "patch_authority": False,
                  "production_mutation": False,
              }
              assert detect_protected_metadata_overrides(envelope) == []
              assert detect_protected_metadata_overrides({**envelope, "patch_authority": "full_repository"})
              source = "packet = " + repr(envelope)
              findings = scan_python_review_lessons(file="tests/fixture.py", source=source, tree=ast.parse(source))
              assert not any(item.get("rule") == "detect_protected_metadata_overrides" for item in findings)


          @pytest.mark.parametrize(
              "uri",
              [
                  "aura:////construction/floor-plan",
                  "aura://construction//floor-plan",
                  "aura://construction/%2fsecret",
                  "aura://construction/../floor-plan",
                  "aura://user@construction/floor-plan",
                  "aura://construction/floor-plan?token=secret",
                  "file://remote-host/tmp/floor.glb",
                  "https://example.test/floor.glb",
              ],
          )
          def test_construction_projection_rejects_noncanonical_floor_asset_uris(uri: str) -> None:
              fixture, packet = _fixture_packet()
              with pytest.raises(ValueError, match="URI|local or Aura-addressed|remote host"):
                  project_construction_state_to_scene(
                      fixture.state,
                      packet,
                      purpose_digest="6" * 64,
                      floor_plan_assets=(_floor_asset(uri=uri),),
                  )


          def test_construction_projection_accepts_canonical_aura_and_local_file_uris() -> None:
              fixture, packet = _fixture_packet()
              aura_scene = project_construction_state_to_scene(
                  fixture.state,
                  packet,
                  purpose_digest="7" * 64,
                  floor_plan_assets=(_floor_asset(),),
              )
              file_asset = replace(_floor_asset(), uri="file:///tmp/aura/floor.glb")
              file_scene = project_construction_state_to_scene(
                  fixture.state,
                  packet,
                  purpose_digest="8" * 64,
                  floor_plan_assets=(file_asset,),
              )
              assert len(aura_scene.assets) == 2
              assert len(file_scene.assets) == 2
          ''',
                  encoding="utf-8",
              )

          spatial = Path("aura_spatial_construction.py").read_text(encoding="utf-8")
          security = Path("aura_review_lessons_security.py").read_text(encoding="utf-8")
          assert "_ALLOWED_ASSET_SCHEMES" not in spatial
          assert "def _validate_local_asset_uri" in spatial
          assert "def _is_spatial_no_authority_envelope" in security
          assert test.exists()
          PY
          files=(aura_spatial_construction.py aura_review_lessons_security.py tests/test_aura_spatial_waboose_precision.py)
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          python -m py_compile "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "dallascourchene-commits"
            git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
            git add "${files[@]}"
            git commit -m "fix(spatial): harden URI and Waboose authority precision"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD_REF"
          fi

      - name: Compile, lint, and validate route
        run: |
          set -euo pipefail
          python -m py_compile             aura_spatial_arena.py             aura_spatial_construction.py             aura_spatial_session.py             aura_construction_runtime_binding.py             aura_review_lessons_security.py             aura_spatial_agent_bridge.py             aura_spatial_mcp.py             aura_spatial_cli.py             aura_arena_persistence_adapters.py             aura_agent_arena_persistence_bridge.py             aura_agent_arena_mcp.py             scripts/aura_spatial_s5_s6_construction_architect_harness.py
          ruff check             aura_spatial_arena.py             aura_spatial_construction.py             aura_spatial_session.py             aura_construction_runtime_binding.py             aura_review_lessons_security.py             aura_spatial_agent_bridge.py             aura_spatial_mcp.py             aura_spatial_cli.py             aura_arena_persistence_adapters.py             aura_agent_arena_persistence_bridge.py             aura_agent_arena_mcp.py             scripts/aura_spatial_s5_s6_construction_architect_harness.py             tests/test_aura_spatial_s5_arena.py             tests/test_aura_spatial_s6_construction.py             tests/test_aura_spatial_codex_repairs.py             tests/test_aura_spatial_waboose_precision.py             tests/test_aura_spatial_agent_bridge_mcp.py             tests/test_aura_spatial_cli.py             tests/test_aura_spatial_s5_s6_harness.py
          ruff format --check             aura_spatial_arena.py             aura_spatial_construction.py             aura_spatial_session.py             aura_construction_runtime_binding.py             aura_review_lessons_security.py             aura_spatial_agent_bridge.py             aura_spatial_mcp.py             aura_spatial_cli.py             aura_arena_persistence_adapters.py             aura_agent_arena_persistence_bridge.py             aura_agent_arena_mcp.py             scripts/aura_spatial_s5_s6_construction_architect_harness.py             tests/test_aura_spatial_s5_arena.py             tests/test_aura_spatial_s6_construction.py             tests/test_aura_spatial_codex_repairs.py             tests/test_aura_spatial_waboose_precision.py             tests/test_aura_spatial_agent_bridge_mcp.py             tests/test_aura_spatial_cli.py             tests/test_aura_spatial_s5_s6_harness.py
          python aura_spatial_cli.py --repo-root . validate-route

      - name: Run Codex and Waboose trust-boundary regressions
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_codex_repairs.py \
            tests/test_aura_spatial_waboose_precision.py

      - name: Run retained Spatial and Construction regressions with evidence
        run: |
          set -euo pipefail
          mkdir -p /tmp/aura-spatial-s5-s6-receipts
          log=/tmp/aura-spatial-s5-s6-receipts/retained-regressions.log
          : > "$log"
          for test_file in tests/test_aura_spatial*.py; do
            echo "=== $test_file ===" | tee -a "$log"
            python -m pytest -q --tb=short "$test_file" 2>&1 | tee -a "$log"
          done
          for test_file in tests/test_aura_construction*.py; do
            echo "=== $test_file ===" | tee -a "$log"
            python -m pytest -q --tb=short "$test_file" 2>&1 | tee -a "$log"
          done
          echo "=== persistence and MCP retained set ===" | tee -a "$log"
          python -m pytest -q --tb=short             tests/test_aura_arena_persistence_adapters.py             tests/test_aura_agent_arena_mcp.py             tests/test_aura_spatial_agent_bridge_mcp.py 2>&1 | tee -a "$log"
          echo "=== npm spatial ===" | tee -a "$log"
          npm run test:spatial 2>&1 | tee -a "$log"

      - name: Run structural architecture proof
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/aura-spatial-s5-s6-receipts
          python scripts/aura_spatial_s5_s6_construction_architect_harness.py             --repo-root .             --base-ref "origin/$BASE_REF"             --head-ref HEAD             --observed-head "$(git rev-parse HEAD)"             --receipt /tmp/aura-spatial-s5-s6-receipts/structural.json             --structural-only

      - name: Run full Aura architecture proof
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          python scripts/aura_spatial_s5_s6_construction_architect_harness.py             --repo-root .             --base-ref "origin/$BASE_REF"             --head-ref HEAD             --observed-head "$(git rev-parse HEAD)"             --receipt /tmp/aura-spatial-s5-s6-receipts/full.json

      - name: Verify architecture analysis did not mutate tracked source
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':!Aura_Staging/**'
          git diff --cached --exit-code

      - name: Upload S5/S6 architecture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-s5-s6-construction-receipts-${{ github.sha }}
          path: /tmp/aura-spatial-s5-s6-receipts
          if-no-files-found: warn
          retention-days: 14
