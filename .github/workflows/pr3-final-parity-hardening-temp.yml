name: TEMP PR3 Codacy Complexity Refactor

on:
  push:
    branches:
      - "analysis/pr3-final-parity-hardening-20260808"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-first-project-context-pr3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff>=0.5" "pytest>=8.2,<9" "radon>=6,<7"
      - name: Refactor PR3 validation surfaces
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("aura_project_context_compiler.py")
          text = path.read_text(encoding="utf-8")

          def span_replace(source: str, start: str, end: str, replacement: str) -> str:
              start_at = source.index(start)
              end_at = source.index(end, start_at)
              return source[:start_at] + replacement + source[end_at:]

          # Preserve exact-type semantics while collapsing generic linter noise to one
          # documented security boundary.
          text = re.sub(
              r"type\(([^()\n]+)\) is not ([A-Za-z_][A-Za-z0-9_]*)",
              r"not _exact_type(\1, \2)",
              text,
          )
          text = re.sub(
              r"type\(([^()\n]+)\) is ([A-Za-z_][A-Za-z0-9_]*)",
              r"_exact_type(\1, \2)",
              text,
          )
          exact_helper = '''def _exact_type(value: Any, expected: type[Any]) -> bool:\n    """Reject subclasses at contract boundaries; isinstance() is intentionally too broad."""\n    return type(value) is expected  # pylint: disable=unidiomatic-typecheck\n\n\n'''
          marker = "def _text(value: Any, name: str, *, maximum: int = MAX_TEXT_BYTES) -> str:\n"
          if exact_helper not in text:
              text = text.replace(marker, exact_helper + marker, 1)

          candidate_helpers = '''def _normalize_candidate_identity(candidate: Any) -> None:\n    object.__setattr__(candidate, "candidate_id", _id(candidate.candidate_id, "candidate_id"))\n    object.__setattr__(candidate, "category", _enum(CandidateCategory, candidate.category, "category"))\n    object.__setattr__(candidate, "source_adapter", _id(candidate.source_adapter, "source_adapter"))\n    object.__setattr__(candidate, "origin_ref", _text(candidate.origin_ref, "origin_ref"))\n    object.__setattr__(\n        candidate,\n        "authority_class",\n        _enum(ContextAuthorityClass, candidate.authority_class, "authority_class"),\n    )\n    object.__setattr__(\n        candidate,\n        "truth_class",\n        _enum(CandidateTruthClass, candidate.truth_class, "truth_class"),\n    )\n    object.__setattr__(\n        candidate,\n        "availability",\n        _enum(CandidateAvailability, candidate.availability, "availability"),\n    )\n    object.__setattr__(\n        candidate,\n        "relevance_score",\n        _int(candidate.relevance_score, "relevance_score", maximum=1_000_000),\n    )\n\n\ndef _normalize_candidate_relationships(candidate: Any) -> None:\n    if not _exact_type(candidate.required, bool) or not _exact_type(candidate.answer_determining, bool):\n        raise TypeError("required and answer_determining must be booleans")\n    object.__setattr__(\n        candidate,\n        "dependency_ids",\n        _ids(candidate.dependency_ids, "dependency_ids", maximum=MAX_DEPENDENCIES),\n    )\n    if not _exact_type(candidate.conflict_key, str):\n        raise TypeError("conflict_key must be a string")\n    if candidate.conflict_key:\n        object.__setattr__(candidate, "conflict_key", _id(candidate.conflict_key, "conflict_key"))\n    bindings = tuple(candidate.temporal_bindings)\n    if len(bindings) > MAX_TEMPORAL_BINDINGS or any(\n        not _exact_type(item, TemporalBinding) for item in bindings\n    ):\n        raise ValueError("temporal_bindings must contain bounded exact TemporalBinding records")\n    if len({item.key for item in bindings}) != len(bindings):\n        raise ValueError("temporal_bindings contains duplicate binding keys")\n    object.__setattr__(\n        candidate,\n        "temporal_bindings",\n        tuple(sorted(bindings, key=lambda item: item.key)),\n    )\n\n\ndef _validate_candidate_reference(candidate: Any) -> None:\n    if candidate.availability is CandidateAvailability.AVAILABLE:\n        if not _exact_type(candidate.reference, CanonicalReference):\n            raise ValueError("available candidate requires an exact CanonicalReference")\n        return\n    if candidate.reference is not None:\n        raise ValueError("unavailable candidate must not carry a canonical reference")\n\n\ndef _validate_candidate_authority(candidate: Any) -> None:\n    authoritative = {\n        CandidateTruthClass.EXACT_CURRENT,\n        CandidateTruthClass.DERIVED_VERIFIED,\n    }\n    if candidate.truth_class not in authoritative:\n        if candidate.authority_class is not ContextAuthorityClass.ADVISORY_NONE:\n            raise ValueError(\n                "advisory/hypothesis/stale/unavailable candidates cannot carry authority"\n            )\n        return\n    if candidate.reference is None or candidate.reference.truth_class != "EXACT":\n        raise ValueError("authoritative read candidate requires an EXACT canonical reference")\n    expected = (\n        ContextAuthorityClass.CANONICAL_READ\n        if candidate.truth_class is CandidateTruthClass.EXACT_CURRENT\n        else ContextAuthorityClass.DERIVED_READ\n    )\n    if candidate.authority_class is not expected:\n        raise ValueError("candidate authority class does not match its truth class")\n    if candidate.origin_ref != candidate.reference.canonical_ref:\n        raise ValueError(\n            "authoritative candidate origin_ref must equal its canonical reference origin"\n        )\n\n\n'''
          candidate_class = "@dataclass(frozen=True)\nclass ProjectContextCandidate:\n"
          if candidate_helpers not in text:
              text = text.replace(candidate_class, candidate_helpers + candidate_class, 1)
          candidate_start = text.index(candidate_class)
          post_start = text.index("    def __post_init__(self) -> None:\n", candidate_start)
          post_end = text.index("    @property\n    def origin_bound", post_start)
          candidate_post = '''    def __post_init__(self) -> None:\n        _normalize_candidate_identity(self)\n        _normalize_candidate_relationships(self)\n        _validate_candidate_reference(self)\n        _validate_candidate_authority(self)\n\n'''
          text = text[:post_start] + candidate_post + text[post_end:]

          compilation_start = text.index("@dataclass(frozen=True)\nclass ProjectContextCompilation:\n")
          compilation_post = text.index("    def __post_init__(self) -> None:\n", compilation_start)
          compilation_to_dict = text.index("    def to_dict(self, *, include_digest: bool = True)", compilation_post)
          compact_post = '''    def __post_init__(self) -> None:\n        _validate_compilation_identity(self)\n        selected = _canonical_compilation_candidates(self)\n        _validate_compilation_candidates(self, selected)\n        _canonicalize_compilation_edges(self, selected)\n        _validate_compilation_projection(self, selected)\n        _finalize_compilation(self)\n\n'''
          text = text[:compilation_post] + compact_post + text[compilation_to_dict:]

          compilation_helpers = '''def _validate_compilation_identity(compilation: ProjectContextCompilation) -> None:\n    if compilation.version != PROJECT_CONTEXT_COMPILATION_VERSION:\n        raise ValueError("unsupported project-context compilation version")\n    object.__setattr__(compilation, "objective", _text(compilation.objective, "objective"))\n    object.__setattr__(\n        compilation,\n        "objective_digest",\n        _digest(compilation.objective_digest, "objective_digest"),\n    )\n    if compilation.objective_digest != stable_digest({"objective": compilation.objective}):\n        raise ValueError("objective_digest is not bound to objective")\n    if not _exact_type(compilation.repository_identity, RepositoryIdentity):\n        raise ValueError("compilation requires exact RepositoryIdentity")\n    if compilation.projection is not None and not _exact_type(\n        compilation.projection, ProjectContextProjection\n    ):\n        raise ValueError("projection must be exact ProjectContextProjection")\n    if not _exact_type(compilation.selection_receipt, ProjectionSelectionReceipt):\n        raise ValueError("selection_receipt must be exact ProjectionSelectionReceipt")\n    if compilation.selection_receipt.objective_digest != compilation.objective_digest:\n        raise ValueError("selection receipt objective is not bound to compilation")\n    if (\n        compilation.selection_receipt.repository_identity_digest\n        != compilation.repository_identity.identity_digest\n    ):\n        raise ValueError("selection receipt repository identity is not bound to compilation")\n    status = compilation.selection_receipt.status\n    if status is SelectionStatus.COMPLETE and compilation.projection is None:\n        raise ValueError("COMPLETE selection must emit the canonical PR1 projection")\n    if status is SelectionStatus.INCOMPLETE and compilation.projection is not None:\n        raise ValueError("INCOMPLETE selection must not expose a canonical PR1 projection")\n\n\ndef _canonical_compilation_candidates(\n    compilation: ProjectContextCompilation,\n) -> tuple[ProjectContextCandidate, ...]:\n    selected = tuple(compilation.selected_candidates)\n    if any(not _exact_type(item, ProjectContextCandidate) for item in selected):\n        raise ValueError("selected_candidates must be exact records")\n    selected = tuple(sorted(selected, key=lambda item: item.candidate_id))\n    if len({item.candidate_id for item in selected}) != len(selected):\n        raise ValueError("selected_candidates contains duplicate candidate ids")\n    reference_ids = [\n        item.reference.reference_id for item in selected if item.reference is not None\n    ]\n    if len(set(reference_ids)) != len(selected):\n        raise ValueError("selected candidates must have unique canonical references")\n    object.__setattr__(compilation, "selected_candidates", selected)\n    return selected\n\n\ndef _validate_compilation_candidates(\n    compilation: ProjectContextCompilation,\n    selected: tuple[ProjectContextCandidate, ...],\n) -> None:\n    selected_ids = tuple(item.candidate_id for item in selected)\n    if selected_ids != compilation.selection_receipt.selected:\n        raise ValueError("selected candidate identities do not match selection receipt")\n    if len(selected) > compilation.selection_receipt.budget.max_nodes:\n        raise ValueError("selected candidates exceed selection receipt node budget")\n    selected_map = {item.candidate_id: item for item in selected}\n    missing_dependencies = sorted(\n        (item.candidate_id, dependency_id)\n        for item in selected\n        for dependency_id in item.dependency_ids\n        if dependency_id not in selected_map\n    )\n    if missing_dependencies:\n        raise ValueError(\n            "selected candidate dependency closure is incomplete: "\n            f"{missing_dependencies}"\n        )\n    ineligible = {\n        item.candidate_id: problem\n        for item in selected\n        if (problem := _problem(item)) is not None\n    }\n    if ineligible:\n        raise ValueError(\n            "selected candidates must remain compiler-eligible: "\n            f"{sorted(ineligible.items())}"\n        )\n    conflicts = _conflicts(selected_map)\n    if conflicts:\n        raise ValueError(\n            "selected candidates must not contain unresolved conflicts: "\n            f"{sorted(conflicts)}"\n        )\n    if compilation.selection_receipt.status is SelectionStatus.COMPLETE and not any(\n        item.category is CandidateCategory.SOURCE\n        and item.truth_class is CandidateTruthClass.EXACT_CURRENT\n        and item.answer_determining\n        for item in selected\n    ):\n        raise ValueError(\n            "COMPLETE selection requires an exact-current answer-determining source"\n        )\n\n\ndef _canonicalize_compilation_edges(\n    compilation: ProjectContextCompilation,\n    selected: tuple[ProjectContextCandidate, ...],\n) -> None:\n    edges = tuple(compilation.graph_edges)\n    if len(edges) > compilation.selection_receipt.budget.max_edges:\n        raise ValueError("compiled graph edges exceed selection receipt edge budget")\n    if any(not _exact_type(item, ProjectContextEdge) for item in edges):\n        raise ValueError("graph_edges must be exact records")\n    selected_ids = {item.candidate_id for item in selected}\n    if any(\n        edge.source_id not in selected_ids or edge.target_id not in selected_ids\n        for edge in edges\n    ):\n        raise ValueError("compiled graph edge escapes selected candidate set")\n    object.__setattr__(\n        compilation,\n        "graph_edges",\n        tuple(\n            sorted(\n                edges,\n                key=lambda item: (\n                    item.source_id,\n                    item.target_id,\n                    item.relation,\n                    item.truth_class.value,\n                ),\n            )\n        ),\n    )\n\n\ndef _validate_compilation_projection(\n    compilation: ProjectContextCompilation,\n    selected: tuple[ProjectContextCandidate, ...],\n) -> None:\n    projection = compilation.projection\n    if projection is None:\n        return\n    if projection.objective_digest != compilation.objective_digest:\n        raise ValueError("projection objective is not bound to compilation")\n    if projection.canonical_owner != PROJECT_CANONICAL_OWNER:\n        raise ValueError("projection canonical owner is not bound to PR3 owner")\n    if projection.repository_identity.to_dict() != compilation.repository_identity.to_dict():\n        raise ValueError("projection repository identity is not bound to compilation")\n    expected: dict[str, list[CanonicalReference]] = {\n        name: [] for name in set(_CATEGORY_FIELD.values())\n    }\n    for item in selected:\n        if item.reference is None:\n            raise ValueError("selected candidate is missing canonical reference")\n        expected[_CATEGORY_FIELD[item.category]].append(item.reference)\n    for field_name, expected_refs in expected.items():\n        actual_refs = getattr(projection, field_name)\n        canonical_expected = tuple(sorted(expected_refs, key=lambda ref: ref.reference_id))\n        if tuple(ref.to_dict() for ref in actual_refs) != tuple(\n            ref.to_dict() for ref in canonical_expected\n        ):\n            raise ValueError(\n                f"projection {field_name} references do not match selected candidates"\n            )\n\n\ndef _finalize_compilation(compilation: ProjectContextCompilation) -> None:\n    if not _exact_type(compilation.admissible, bool):\n        raise TypeError("admissible must be a boolean")\n    expected_admission = compilation.selection_receipt.status is SelectionStatus.COMPLETE\n    if compilation.admissible != expected_admission:\n        raise ValueError("admissible must equal COMPLETE receipt with emitted projection")\n    expected = stable_digest(compilation.to_dict(include_digest=False))\n    if compilation.compilation_digest and compilation.compilation_digest != expected:\n        raise ValueError("project-context compilation digest mismatch")\n    object.__setattr__(compilation, "compilation_digest", expected)\n\n\n'''
          problem_marker = "def _problem(candidate: ProjectContextCandidate) -> str | None:\n"
          if compilation_helpers not in text:
              text = text.replace(problem_marker, compilation_helpers + problem_marker, 1)
          text = text.replace(
              '''    assert candidate.reference is not None\n    if candidate.reference.freshness_class not in {"CURRENT", "BOUNDED"}:\n''',
              '''    if candidate.reference is None:\n        raise ValueError("eligible candidate is missing canonical reference")\n    if candidate.reference.freshness_class not in {"CURRENT", "BOUNDED"}:\n''',
              1,
          )

          compile_block = '''def _validate_compile_inputs(\n    repository_identity: RepositoryIdentity,\n    candidates: Sequence[ProjectContextCandidate],\n    edges: Sequence[ProjectContextEdge],\n    budget: ProjectionBudget,\n) -> tuple[dict[str, ProjectContextCandidate], tuple[ProjectContextEdge, ...]]:\n    if not _exact_type(repository_identity, RepositoryIdentity):\n        raise ValueError("repository_identity must be exact PR1 RepositoryIdentity")\n    if not _exact_type(budget, ProjectionBudget):\n        raise ValueError("budget must be exact ProjectionBudget")\n    if isinstance(candidates, (str, bytes, bytearray)) or not isinstance(candidates, Sequence):\n        raise TypeError("candidates must be a sequence")\n    if len(candidates) > MAX_CANDIDATES or any(\n        not _exact_type(item, ProjectContextCandidate) for item in candidates\n    ):\n        raise ValueError(\n            "candidates must be a bounded sequence of exact ProjectContextCandidate records"\n        )\n    candidate_map = {item.candidate_id: item for item in candidates}\n    if len(candidate_map) != len(candidates):\n        raise ValueError("duplicate candidate_id")\n    if MISSING_SELECTED_SOURCE_ID in candidate_map:\n        raise ValueError(\n            f"candidate_id {MISSING_SELECTED_SOURCE_ID!r} is reserved for the "\n            "missing exact-current answer-determining source receipt marker"\n        )\n    reference_ids = [\n        item.reference.reference_id for item in candidates if item.reference is not None\n    ]\n    if len(set(reference_ids)) != len(reference_ids):\n        raise ValueError(\n            "task-conditioned candidates must not alias one canonical reference into multiple roles"\n        )\n    edge_items = tuple(edges)\n    if len(edge_items) > min(MAX_EDGES, budget.max_edges * 4) or any(\n        not _exact_type(item, ProjectContextEdge) for item in edge_items\n    ):\n        raise ValueError("edges must be a bounded sequence of exact ProjectContextEdge records")\n    unknown = sorted(\n        endpoint\n        for edge in edge_items\n        for endpoint in (edge.source_id, edge.target_id)\n        if endpoint not in candidate_map\n    )\n    if unknown:\n        raise ValueError(\n            f"edge endpoint is outside the task-conditioned candidate set: {unknown[:5]}"\n        )\n    return candidate_map, edge_items\n\n\n_SELECTION_BUCKET_NAMES = (\n    "omitted_irrelevant",\n    "omitted_by_budget",\n    "stale",\n    "unavailable",\n    "conflicting",\n    "source_adapter_missing",\n    "mandatory_evidence_missing",\n)\n\n\ndef _classify_selection_candidates(\n    candidates: Sequence[ProjectContextCandidate],\n    candidate_map: Mapping[str, ProjectContextCandidate],\n) -> tuple[set[str], dict[str, set[str]]]:\n    conflicts = _conflicts(candidate_map)\n    buckets = {name: set() for name in _SELECTION_BUCKET_NAMES}\n    buckets["conflicting"].update(conflicts)\n    for candidate in candidates:\n        problem = _problem(candidate)\n        if problem is not None:\n            buckets[problem].add(candidate.candidate_id)\n    return conflicts, buckets\n\n\ndef _select_mandatory_context(\n    candidates: Sequence[ProjectContextCandidate],\n    candidate_map: Mapping[str, ProjectContextCandidate],\n    conflicts: set[str],\n    buckets: dict[str, set[str]],\n    budget: ProjectionBudget,\n) -> tuple[set[str], set[str]]:\n    seeds = {\n        item.candidate_id\n        for item in candidates\n        if item.required or item.answer_determining or item.category in _HARD_INCLUDE_CATEGORIES\n    }\n    mandatory: set[str] = set()\n    for seed in sorted(seeds):\n        closure, missing = _closure(seed, candidate_map)\n        mandatory.update(closure)\n        buckets["mandatory_evidence_missing"].update(missing)\n    invalid = {\n        item\n        for item in mandatory\n        if item in conflicts or _problem(candidate_map[item]) is not None\n    }\n    buckets["mandatory_evidence_missing"].update(invalid)\n    eligible = mandatory - invalid\n    if len(eligible) > budget.max_nodes:\n        buckets["omitted_by_budget"].update(eligible)\n        buckets["mandatory_evidence_missing"].update(eligible)\n        return mandatory, set()\n    return mandatory, set(eligible)\n\n\ndef _extend_optional_context(\n    candidates: Sequence[ProjectContextCandidate],\n    candidate_map: Mapping[str, ProjectContextCandidate],\n    mandatory: set[str],\n    conflicts: set[str],\n    buckets: dict[str, set[str]],\n    budget: ProjectionBudget,\n    selected: set[str],\n) -> None:\n    optional = sorted(\n        (\n            item\n            for item in candidates\n            if item.candidate_id not in mandatory\n            and item.candidate_id not in conflicts\n            and _problem(item) is None\n        ),\n        key=lambda item: (\n            -item.relevance_score,\n            _CATEGORY_PRIORITY[item.category],\n            item.candidate_id,\n        ),\n    )\n    for candidate in optional:\n        if candidate.relevance_score == 0:\n            buckets["omitted_irrelevant"].add(candidate.candidate_id)\n            continue\n        closure, missing = _closure(candidate.candidate_id, candidate_map)\n        if missing or any(\n            member in conflicts or _problem(candidate_map[member]) is not None\n            for member in closure\n        ):\n            buckets["omitted_irrelevant"].add(candidate.candidate_id)\n            continue\n        needed = closure - selected\n        if len(selected) + len(needed) > budget.max_nodes:\n            buckets["omitted_by_budget"].add(candidate.candidate_id)\n            continue\n        selected.update(needed)\n\n\ndef _bound_selected_edges(\n    edges: tuple[ProjectContextEdge, ...],\n    selected: set[str],\n    budget: ProjectionBudget,\n) -> tuple[ProjectContextEdge, ...]:\n    selected_edges = tuple(\n        edge for edge in edges if edge.source_id in selected and edge.target_id in selected\n    )\n    if len(selected_edges) > budget.max_edges:\n        raise ValueError(\n            "selected project-context edges exceed the declared edge budget; "\n            "silent edge clipping is prohibited"\n        )\n    return selected_edges\n\n\ndef _build_selection_receipt(\n    objective_digest: str,\n    repository_identity: RepositoryIdentity,\n    selected: set[str],\n    buckets: Mapping[str, set[str]],\n    budget: ProjectionBudget,\n) -> ProjectionSelectionReceipt:\n    missing = tuple(sorted(buckets["mandatory_evidence_missing"]))\n    status = SelectionStatus.INCOMPLETE if missing else SelectionStatus.COMPLETE\n    return ProjectionSelectionReceipt(\n        objective_digest=objective_digest,\n        repository_identity_digest=repository_identity.identity_digest,\n        canonical_owner=PROJECT_CANONICAL_OWNER,\n        selected=tuple(sorted(selected)),\n        omitted_irrelevant=tuple(sorted(buckets["omitted_irrelevant"] - selected)),\n        omitted_by_budget=tuple(sorted(buckets["omitted_by_budget"] - selected)),\n        stale=tuple(sorted(buckets["stale"] - selected)),\n        unavailable=tuple(sorted(buckets["unavailable"] - selected)),\n        conflicting=tuple(sorted(buckets["conflicting"] - selected)),\n        source_adapter_missing=tuple(sorted(buckets["source_adapter_missing"] - selected)),\n        mandatory_evidence_missing=missing,\n        status=status,\n        budget=budget,\n    )\n\n\ndef _selection_warnings(receipt: ProjectionSelectionReceipt) -> tuple[str, ...]:\n    warnings: list[str] = []\n    if receipt.mandatory_evidence_missing:\n        warnings.append(\n            "Mandatory project evidence is missing, stale, conflicting, unavailable, "\n            "source-less, or budget-blocked."\n        )\n    if receipt.omitted_by_budget:\n        warnings.append(\n            "Optional project context was omitted by the declared task-conditioned budget."\n        )\n    if receipt.stale:\n        warnings.append(\n            "Stale project context remains receipt-visible but is not projected as current truth."\n        )\n    if receipt.conflicting:\n        warnings.append(\n            "Conflicting project context remains explicit and is not collapsed into one truth claim."\n        )\n    if receipt.unavailable or receipt.source_adapter_missing:\n        warnings.append(\n            "Unavailable project context or missing source adapters remain receipt-visible."\n        )\n    return tuple(warnings)\n\n\ndef compile_project_context_projection(\n    objective: str,\n    *,\n    project_ref: str,\n    repository_identity: RepositoryIdentity,\n    candidates: Sequence[ProjectContextCandidate],\n    edges: Sequence[ProjectContextEdge] = (),\n    budget: ProjectionBudget = ProjectionBudget(),\n    freshness_timestamp_ms: int,\n) -> ProjectContextCompilation:\n    """Compile a deterministic minimum-sufficient read-only project projection."""\n    objective = _text(objective, "objective")\n    project_ref = _text(project_ref, "project_ref")\n    candidate_map, edge_items = _validate_compile_inputs(\n        repository_identity, candidates, edges, budget\n    )\n    conflicts, buckets = _classify_selection_candidates(candidates, candidate_map)\n    mandatory, selected = _select_mandatory_context(\n        candidates, candidate_map, conflicts, buckets, budget\n    )\n    _extend_optional_context(\n        candidates, candidate_map, mandatory, conflicts, buckets, budget, selected\n    )\n    selected_candidates = tuple(candidate_map[item] for item in sorted(selected))\n    if not any(\n        candidate.category is CandidateCategory.SOURCE\n        and candidate.truth_class is CandidateTruthClass.EXACT_CURRENT\n        and candidate.answer_determining\n        for candidate in selected_candidates\n    ):\n        buckets["mandatory_evidence_missing"].add(MISSING_SELECTED_SOURCE_ID)\n    selected_edges = _bound_selected_edges(edge_items, selected, budget)\n    objective_digest = stable_digest({"objective": objective})\n    receipt = _build_selection_receipt(\n        objective_digest, repository_identity, selected, buckets, budget\n    )\n    timestamp_ms = _int(\n        freshness_timestamp_ms, "freshness_timestamp_ms", maximum=2**63 - 1\n    )\n    projection = None\n    if receipt.status is SelectionStatus.COMPLETE:\n        projection = _projection(\n            objective,\n            project_ref,\n            repository_identity,\n            selected_candidates,\n            timestamp_ms,\n            _selection_warnings(receipt),\n        )\n    return ProjectContextCompilation(\n        objective=objective,\n        objective_digest=objective_digest,\n        repository_identity=repository_identity,\n        projection=projection,\n        selection_receipt=receipt,\n        selected_candidates=selected_candidates,\n        graph_edges=selected_edges,\n        admissible=receipt.status is SelectionStatus.COMPLETE,\n    )\n\n\n'''
          text = span_replace(\n              text,\n              "def compile_project_context_projection(\n",\n              "def trace_project_context_provenance(\n",\n              compile_block,\n          )

          provenance_block = '''def _incoming_provenance_edges(\n    compilation: ProjectContextCompilation,\n) -> dict[str, list[ProjectContextEdge]]:\n    incoming = {item.candidate_id: [] for item in compilation.selected_candidates}\n    for edge in compilation.graph_edges:\n        incoming[edge.target_id].append(edge)\n    for values in incoming.values():\n        values.sort(\n            key=lambda edge: (edge.source_id, edge.relation, edge.truth_class.value)\n        )\n    return incoming\n\n\ndef _traverse_provenance(\n    starts: tuple[str, ...],\n    incoming: Mapping[str, list[ProjectContextEdge]],\n    max_hops: int,\n    max_nodes: int,\n) -> tuple[set[str], set[ProjectContextEdge], set[str]]:\n    seen = set(starts)\n    frontier = list(starts)\n    traversed: set[ProjectContextEdge] = set()\n    truncated: set[str] = set()\n    for _ in range(max_hops):\n        next_frontier: list[str] = []\n        for target in sorted(frontier):\n            for edge in incoming.get(target, ()):\n                if edge.source_id in seen:\n                    traversed.add(edge)\n                    continue\n                if len(seen) >= max_nodes:\n                    truncated.add(edge.source_id)\n                    continue\n                seen.add(edge.source_id)\n                next_frontier.append(edge.source_id)\n                traversed.add(edge)\n        if not next_frontier:\n            break\n        frontier = sorted(set(next_frontier))\n    else:\n        for target in frontier:\n            truncated.update(\n                edge.source_id\n                for edge in incoming.get(target, ())\n                if edge.source_id not in seen\n            )\n    return seen, traversed, truncated\n\n\ndef _provenance_source_summary(\n    node_map: Mapping[str, ProjectContextCandidate],\n    seen: set[str],\n    incoming: Mapping[str, list[ProjectContextEdge]],\n    traversed: set[ProjectContextEdge],\n) -> tuple[list[ProjectContextCandidate], list[str], list[str], list[str], bool]:\n    nodes = [node_map[item] for item in sorted(seen)]\n    source_ids = [\n        item.candidate_id for item in nodes if item.category is CandidateCategory.SOURCE\n    ]\n    exact_source_ids = [\n        item.candidate_id\n        for item in nodes\n        if item.category is CandidateCategory.SOURCE\n        and item.truth_class is CandidateTruthClass.EXACT_CURRENT\n    ]\n    root_ids = sorted(\n        node_id\n        for node_id in seen\n        if not any(edge.source_id in seen for edge in incoming.get(node_id, ()))\n    )\n    roots_are_exact_sources = bool(root_ids) and all(\n        node_map[node_id].category is CandidateCategory.SOURCE\n        and node_map[node_id].truth_class is CandidateTruthClass.EXACT_CURRENT\n        for node_id in root_ids\n    )\n    authoritative_path = all(\n        edge.truth_class in _AUTHORITATIVE_EDGE_TRUTH for edge in traversed\n    )\n    return nodes, source_ids, exact_source_ids, root_ids, (\n        roots_are_exact_sources and authoritative_path\n    )\n\n\ndef trace_project_context_provenance(\n    compilation: ProjectContextCompilation,\n    start_ids: Sequence[str],\n    *,\n    max_hops: int = 4,\n    max_nodes: int = 64,\n) -> dict[str, Any]:\n    """Trace a bounded authoritative predecessor closure without overclaiming completeness."""\n    if not _exact_type(compilation, ProjectContextCompilation):\n        raise ValueError("compilation must be exact ProjectContextCompilation")\n    starts = _ids(start_ids, "start_ids", maximum=64)\n    max_hops = _int(max_hops, "max_hops", minimum=1, maximum=16)\n    max_nodes = _int(max_nodes, "max_nodes", minimum=1, maximum=256)\n    if len(starts) > max_nodes:\n        raise ValueError("provenance start_ids exceed max_nodes")\n    node_map = {item.candidate_id: item for item in compilation.selected_candidates}\n    missing = sorted(set(starts) - set(node_map))\n    if missing:\n        raise ValueError(f"provenance start is outside selected context: {missing}")\n    incoming = _incoming_provenance_edges(compilation)\n    seen, traversed, truncated = _traverse_provenance(\n        starts, incoming, max_hops, max_nodes\n    )\n    nodes, source_ids, exact_source_ids, root_ids, authoritative_complete = (\n        _provenance_source_summary(node_map, seen, incoming, traversed)\n    )\n    authoritative_path = all(\n        edge.truth_class in _AUTHORITATIVE_EDGE_TRUTH for edge in traversed\n    )\n    result = {\n        "version": PROJECT_CONTEXT_PROVENANCE_VERSION,\n        "compilation_digest": compilation.compilation_digest,\n        "start_ids": list(starts),\n        "node_ids": [item.candidate_id for item in nodes],\n        "nodes": [item.to_dict() for item in nodes],\n        "edges": [\n            item.to_dict()\n            for item in sorted(\n                traversed,\n                key=lambda edge: (\n                    edge.source_id, edge.target_id, edge.relation, edge.truth_class.value\n                ),\n            )\n        ],\n        "source_ids": source_ids,\n        "exact_source_ids": exact_source_ids,\n        "source_reached": bool(source_ids),\n        "provenance_root_ids": root_ids,\n        "truncated_frontier": sorted(truncated),\n        "authoritative_path": authoritative_path,\n        "source_complete": authoritative_complete and not truncated,\n        "bounded": True,\n    }\n    result["trace_digest"] = stable_digest(result)\n    return result\n\n\n'''
          text = span_replace(\n              text,\n              "def trace_project_context_provenance(\n",\n              "def validate_project_context_freshness(\n",\n              provenance_block,\n          )

          freshness_block = '''def _normalize_current_bindings(current_bindings: Mapping[str, str]) -> dict[str, str]:\n    if not isinstance(current_bindings, Mapping):\n        raise TypeError("current_bindings must be a mapping")\n    normalized: dict[str, str] = {}\n    for key, value in current_bindings.items():\n        normalized_key = _text(key, "binding key")\n        if normalized_key in normalized:\n            raise ValueError("current_bindings contains duplicate normalized keys")\n        normalized[normalized_key] = _digest(value, "binding digest")\n    return normalized\n\n\ndef _freshness_reasons(\n    compilation: ProjectContextCompilation,\n    current_repository_identity: RepositoryIdentity,\n    normalized_bindings: Mapping[str, str],\n    observed_at_ms: int,\n) -> list[str]:\n    reasons: list[str] = []\n    if compilation.repository_identity.to_dict() != current_repository_identity.to_dict():\n        reasons.append("repository_identity_changed")\n    for candidate in compilation.selected_candidates:\n        if candidate.reference is None:\n            reasons.append(f"selected_reference_missing:{candidate.candidate_id}")\n            continue\n        if candidate.reference.freshness_class not in {"CURRENT", "BOUNDED"}:\n            reasons.append(f"reference_stale:{candidate.candidate_id}")\n        for binding in candidate.temporal_bindings:\n            current = normalized_bindings.get(binding.key)\n            if current is None:\n                reasons.append(f"binding_missing:{binding.key}")\n            elif current != binding.digest:\n                reasons.append(f"binding_changed:{binding.key}")\n            if binding.expires_at_ms and observed_at_ms >= binding.expires_at_ms:\n                reasons.append(f"binding_expired:{binding.key}")\n    return sorted(set(reasons))\n\n\ndef validate_project_context_freshness(\n    compilation: ProjectContextCompilation,\n    *,\n    current_repository_identity: RepositoryIdentity,\n    current_bindings: Mapping[str, str],\n    observed_at_ms: int,\n) -> dict[str, Any]:\n    """Require recompilation after repository or selected temporal identity drift."""\n    if not _exact_type(compilation, ProjectContextCompilation):\n        raise ValueError("compilation must be exact ProjectContextCompilation")\n    if not _exact_type(current_repository_identity, RepositoryIdentity):\n        raise ValueError("current_repository_identity must be exact RepositoryIdentity")\n    observed_at_ms = _int(observed_at_ms, "observed_at_ms", maximum=2**63 - 1)\n    normalized = _normalize_current_bindings(current_bindings)\n    reasons = _freshness_reasons(\n        compilation, current_repository_identity, normalized, observed_at_ms\n    )\n    result = {\n        "version": PROJECT_CONTEXT_FRESHNESS_VERSION,\n        "compilation_digest": compilation.compilation_digest,\n        "valid": not reasons,\n        "recompile_required": bool(reasons),\n        "reasons": reasons,\n        "observed_at_ms": observed_at_ms,\n        "mutation_performed": False,\n    }\n    result["validation_digest"] = stable_digest(result)\n    return result\n\n\n'''
          text = span_replace(\n              text,\n              "def validate_project_context_freshness(\n",\n              "__all__ = [\n",\n              freshness_block,\n          )

          path.write_text(text, encoding="utf-8")
          PY
