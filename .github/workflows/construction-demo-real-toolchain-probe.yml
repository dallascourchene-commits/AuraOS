name: Construction Demo Real Toolchain Probe

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - ".aura/run-construction-real-toolchain-probe"
      - ".github/workflows/construction-demo-real-toolchain-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-demo-real-toolchain-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded Python build dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "ifcopenshell==0.8.5" \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "nanobind>=2.7.0,<3.0" \
            "scikit-build-core>=0.10.7,<1.0" \
            "cmake>=3.30,<5.0" \
            "ninja>=1.11,<2.0"
          python - <<'PY'
          import ifcopenshell
          import ifcpatch
          print("ifcopenshell", ifcopenshell.version)
          print("ifcpatch", ifcpatch.__file__)
          PY

      - name: Resolve and authenticate IfcConvert 0.8.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ifcconvert"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen

          request = Request(
              "https://api.github.com/repos/IfcOpenShell/IfcOpenShell/releases/tags/ifcconvert-0.8.5",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "AuraOS-Construction-Toolchain-Probe/1",
              },
          )
          with urlopen(request, timeout=45) as response:
              release = json.load(response)
          candidates = [
              asset for asset in release.get("assets", [])
              if re.search(r"linux.*(?:x86_64|x64|64)", asset.get("name", ""), re.I)
              and asset.get("name", "").lower().endswith((".zip", ".tar.gz"))
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  f"expected one Linux x64 IfcConvert asset, observed "
                  f"{[item.get('name') for item in candidates]}"
              )
          asset = candidates[0]
          digest = asset.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("IfcConvert release asset lacks a GitHub SHA-256 digest")
          metadata = {
              "release_id": release["id"],
              "tag_name": release["tag_name"],
              "target_commitish": release["target_commitish"],
              "asset_id": asset["id"],
              "asset_name": asset["name"],
              "asset_size": asset["size"],
              "asset_digest": digest,
              "browser_download_url": asset["browser_download_url"],
          }
          Path(os.environ["RUNNER_TEMP"], "ifcconvert-release.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"IFCCONVERT_URL={asset['browser_download_url']}\n")
              handle.write(
                  f"IFCCONVERT_ARCHIVE_SHA256={digest.removeprefix('sha256:')}\n"
              )
              handle.write(f"IFCCONVERT_ASSET_NAME={asset['name']}\n")
          PY
          curl --fail --silent --show-error --location --retry 3 \
            "${IFCCONVERT_URL}" -o "${RUNNER_TEMP}/${IFCCONVERT_ASSET_NAME}"
          echo "${IFCCONVERT_ARCHIVE_SHA256}  ${RUNNER_TEMP}/${IFCCONVERT_ASSET_NAME}" \
            | sha256sum --check --strict
          case "${IFCCONVERT_ASSET_NAME}" in
            *.zip) unzip -q "${RUNNER_TEMP}/${IFCCONVERT_ASSET_NAME}" -d "${RUNNER_TEMP}/ifcconvert" ;;
            *.tar.gz) tar -xzf "${RUNNER_TEMP}/${IFCCONVERT_ASSET_NAME}" -C "${RUNNER_TEMP}/ifcconvert" ;;
            *) exit 1 ;;
          esac
          IFCCONVERT_PATH="$(find "${RUNNER_TEMP}/ifcconvert" -type f -name IfcConvert -print -quit)"
          test -n "${IFCCONVERT_PATH}"
          chmod +x "${IFCCONVERT_PATH}"
          echo "IFCCONVERT_PATH=${IFCCONVERT_PATH}" >> "${GITHUB_ENV}"
          "${IFCCONVERT_PATH}" --version

      - name: Resolve and install Niantic SPZ v3.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def fetch(url: str):
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "AuraOS-Construction-Toolchain-Probe/1",
                  },
              )
              with urlopen(request, timeout=45) as response:
                  return json.load(response)

          ref = fetch("https://api.github.com/repos/nianticlabs/spz/git/ref/tags/v3.0.0")
          obj = ref["object"]
          if obj["type"] == "tag":
              obj = fetch(obj["url"])["object"]
          if obj["type"] != "commit":
              raise SystemExit(f"SPZ tag does not resolve to a commit: {obj}")
          Path(os.environ["RUNNER_TEMP"], "spz-tag.json").write_text(
              json.dumps(
                  {"tag": "v3.0.0", "commit_sha": obj["sha"]},
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SPZ_COMMIT_SHA={obj['sha']}\n")
          PY
          git clone --filter=blob:none --no-checkout \
            https://github.com/nianticlabs/spz.git "${RUNNER_TEMP}/spz"
          git -C "${RUNNER_TEMP}/spz" checkout --detach "${SPZ_COMMIT_SHA}"
          test "$(git -C "${RUNNER_TEMP}/spz" rev-parse HEAD)" = "${SPZ_COMMIT_SHA}"
          git -C "${RUNNER_TEMP}/spz" submodule update --init --recursive --depth 1
          python -m pip install "${RUNNER_TEMP}/spz"
          python - <<'PY'
          import spz
          print("spz", spz.__file__)
          PY

      - name: Acquire and authoritatively index the pinned IFC
        run: |
          set -euo pipefail
          mkdir -p build/construction-source build/construction-proof
          python scripts/aura_fetch_construction_demo_source.py \
            --repo-root . \
            --output-dir build/construction-source \
            --record-doi 10.48436/a185k-86v39 \
            --accept-network-download
          python scripts/aura_ifc_storey_index.py index \
            --source build/construction-source/CustomTestModel-EscapeRouteAnalysis-ZDB-v2.ifc \
            --source-sha256 29945f654c636d758a95b66eb0e107ec35afc7e1c7857a7ff652586e7728ba29 \
            --source-ref demo_assets/construction_tuwien/source/CustomTestModel-EscapeRouteAnalysis-ZDB-v2.ifc \
            --output build/construction-proof/ifc-hierarchy.json

      - name: Write authenticated toolchain probe receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import ifcopenshell
          import ifcpatch
          import spz

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  while chunk := handle.read(1024 * 1024):
                      digest.update(chunk)
              return digest.hexdigest()

          ifcconvert = Path(os.environ["IFCCONVERT_PATH"]).resolve(strict=True)
          version = subprocess.run(
              [str(ifcconvert), "--version"],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          )
          release = json.loads(
              Path(os.environ["RUNNER_TEMP"], "ifcconvert-release.json").read_text(
                  encoding="utf-8"
              )
          )
          spz_tag = json.loads(
              Path(os.environ["RUNNER_TEMP"], "spz-tag.json").read_text(encoding="utf-8")
          )
          hierarchy = json.loads(
              Path("build/construction-proof/ifc-hierarchy.json").read_text(encoding="utf-8")
          )
          source = Path(
              "build/construction-source/CustomTestModel-EscapeRouteAnalysis-ZDB-v2.ifc"
          )
          receipt = {
              "version": "AURA_CONSTRUCTION_REAL_TOOLCHAIN_PROBE_V1",
              "toolchain_ready": True,
              "ifcopenshell_version": str(ifcopenshell.version),
              "ifcopenshell_module": str(Path(ifcopenshell.__file__).resolve()),
              "ifcpatch_module": str(Path(ifcpatch.__file__).resolve()),
              "ifcconvert_release": release,
              "ifcconvert_binary_sha256": sha256_file(ifcconvert),
              "ifcconvert_version_stdout": version.stdout.strip(),
              "ifcconvert_version_stderr": version.stderr.strip(),
              "spz_tag": spz_tag,
              "spz_module": str(Path(spz.__file__).resolve()),
              "source_sha256": sha256_file(source),
              "source_byte_length": source.stat().st_size,
              "hierarchy_digest": hierarchy["hierarchy_digest"],
              "counts": hierarchy["counts"],
              "survey_authority": False,
              "production_mutation": False,
              "human_review_required": True,
          }
          encoded = json.dumps(
              receipt, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          receipt["probe_digest"] = hashlib.blake2b(encoded, digest_size=16).hexdigest()
          Path("build/construction-proof/toolchain-probe.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload proof-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: construction-real-toolchain-probe-${{ github.sha }}
          path: |
            build/construction-proof/toolchain-probe.json
            build/construction-proof/ifc-hierarchy.json
            build/construction-source/source-manifest.json
          retention-days: 7
          if-no-files-found: error

  publish:
    if: github.actor != 'github-actions[bot]'
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-real-asset-pack-g4-20260722
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: construction-real-toolchain-probe-${{ github.sha }}
          path: build/construction-proof

      - name: Validate and publish sanitized probe evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_SHA}" HEAD
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          proof = Path("build/construction-proof")
          receipt_path = proof / "toolchain-probe.json"
          hierarchy_path = proof / "ifc-hierarchy.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          hierarchy = json.loads(hierarchy_path.read_text(encoding="utf-8"))
          digest = receipt.pop("probe_digest")
          encoded = json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode(
              "utf-8"
          )
          if hashlib.blake2b(encoded, digest_size=16).hexdigest() != digest:
              raise SystemExit("toolchain probe digest mismatch")
          if receipt.get("toolchain_ready") is not True:
              raise SystemExit("toolchain probe is not ready")
          if receipt.get("source_sha256") != (
              "29945f654c636d758a95b66eb0e107ec35afc7e1c7857a7ff652586e7728ba29"
          ):
              raise SystemExit("source identity mismatch")
          if hierarchy.get("hierarchy_digest") != receipt.get("hierarchy_digest"):
              raise SystemExit("hierarchy digest mismatch")
          if hierarchy.get("ifcopenshell_validated") is not True:
              raise SystemExit("hierarchy lacks IfcOpenShell authority")

          lock_body = {
              "version": "AURA_CONSTRUCTION_REAL_TOOLCHAIN_LOCK_V1",
              "ifcopenshell_version": receipt["ifcopenshell_version"],
              "ifcconvert_release": receipt["ifcconvert_release"],
              "ifcconvert_binary_sha256": receipt["ifcconvert_binary_sha256"],
              "ifcconvert_version_stdout": receipt["ifcconvert_version_stdout"],
              "ifcconvert_version_stderr": receipt["ifcconvert_version_stderr"],
              "spz_tag": receipt["spz_tag"],
              "source_sha256": receipt["source_sha256"],
              "source_byte_length": receipt["source_byte_length"],
              "hierarchy_digest": receipt["hierarchy_digest"],
              "counts": receipt["counts"],
              "survey_authority": False,
              "production_mutation": False,
              "human_review_required": True,
          }
          lock_encoded = json.dumps(
              lock_body, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          lock = {
              **lock_body,
              "toolchain_lock_digest": hashlib.blake2b(
                  lock_encoded, digest_size=16
              ).hexdigest(),
          }
          target = Path("demo_assets/construction_tuwien/toolchain")
          target.mkdir(parents=True, exist_ok=True)
          (target / "toolchain-lock.json").write_text(
              json.dumps(lock, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (target / "ifc-hierarchy.json").write_text(
              json.dumps(hierarchy, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          counts = receipt["counts"]
          evidence = f"""# Aura Construction Arena — Real Toolchain Probe Evidence

```yaml
status: REAL_TOOLCHAIN_PROBE_COMPLETE
ifcopenshell_version: {receipt['ifcopenshell_version']}
ifcconvert_asset: {receipt['ifcconvert_release']['asset_name']}
ifcconvert_asset_digest: {receipt['ifcconvert_release']['asset_digest']}
ifcconvert_binary_sha256: {receipt['ifcconvert_binary_sha256']}
spz_tag: {receipt['spz_tag']['tag']}
spz_commit_sha: {receipt['spz_tag']['commit_sha']}
source_sha256: {receipt['source_sha256']}
hierarchy_digest: {receipt['hierarchy_digest']}
storeys: {counts['storeys']}
spaces: {counts['spaces']}
elements: {counts['elements']}
toolchain_lock_digest: {lock['toolchain_lock_digest']}
survey_authority: false
production_mutation: false
human_review_required: true
```

The official pinned toolchain imported successfully, the TU Wien IFC bytes matched the
repository pin, and IfcOpenShell produced an authoritative hierarchy agreeing with the
STEP preflight. No GLB, SVG, PLY, SPZ, importer receipt, or G4 fixture is claimed by this
probe; those remain the next gated build.
"""
          Path("docs/AURA_CONSTRUCTION_ARENA_REAL_TOOLCHAIN_PROBE_EVIDENCE.md").write_text(
              evidence, encoding="utf-8"
          )
          PY
          rm -f .aura/run-construction-real-toolchain-probe
          git config user.name "AuraOS Construction Toolchain Probe"
          git config user.email "actions@users.noreply.github.com"
          git add \
            demo_assets/construction_tuwien/toolchain/toolchain-lock.json \
            demo_assets/construction_tuwien/toolchain/ifc-hierarchy.json \
            docs/AURA_CONSTRUCTION_ARENA_REAL_TOOLCHAIN_PROBE_EVIDENCE.md \
            .aura/run-construction-real-toolchain-probe
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "build(construction): lock verified real asset toolchain"
          git push origin HEAD:work/construction-arena-real-asset-pack-g4-20260722
