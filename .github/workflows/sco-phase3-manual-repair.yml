name: SCO Phase 3 Manual Repair

on:
  push:
    branches:
      - refactor/sco-construction-e7-e8

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sco-construction-e7-e8
      - name: Apply exact manual review repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('aura_construction_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          old_priority = '''_AUTHORITY_PRIORITY = {
              ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED.value: 0,
              ConstructionAuthorityRoute.PROFESSIONAL_REVIEW_REQUIRED.value: 1,
              ConstructionAuthorityRoute.REGULATORY_OR_LEGAL_REVIEW_REQUIRED.value: 2,
          }


          '''
          if old_priority not in text:
              raise SystemExit('authority-priority block not found')
          text = text.replace(old_priority, '', 1)

          old_options = '''        for item in selectors:
                      if item.candidate_id not in options:
                          options.append(item.candidate_id)

              next_authority = ""
              if ranked:
                  next_authority = max(
                      (item.authority_route for item in ranked),
                      key=lambda value: _AUTHORITY_PRIORITY[value],
                  )
          '''
          new_options = '''        for item in selectors:
                      if item.candidate_id not in options:
                          options.append(item.candidate_id)
                  for item in ranked:
                      if item.candidate_id not in options:
                          options.append(item.candidate_id)
                      if len(options) >= 4:
                          break

              next_authority = ""
              if recommended_id:
                  next_authority = candidate_by_id[recommended_id].authority_route
          '''
          if old_options not in text:
              raise SystemExit('option/authority block not found')
          adapter.write_text(text.replace(old_options, new_options, 1), encoding='utf-8')

          tests = Path('tests/test_aura_construction_adapter.py')
          test_text = tests.read_text(encoding='utf-8')
          old_test = '''def test_multiple_admissible_candidates_use_multi_lane_route():
              evaluation = evaluate()
              assert evaluation.route_class == ConstructionRouteClass.MULTI_LANE_COMPARISON.value
              assert evaluation.next_authority_route in {
                  ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED.value,
                  ConstructionAuthorityRoute.PROFESSIONAL_REVIEW_REQUIRED.value,
              }
          '''
          new_test = '''def test_multiple_admissible_candidates_use_multi_lane_route():
              demo = fixture()
              evaluation = evaluate()
              recommended = next(
                  item
                  for item in demo.candidates
                  if item.candidate_id == evaluation.recommended_candidate_id
              )
              assert evaluation.route_class == ConstructionRouteClass.MULTI_LANE_COMPARISON.value
              assert evaluation.next_authority_route == recommended.authority_route
          '''
          if old_test not in test_text:
              raise SystemExit('authority-route regression test not found')
          tests.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          python -m py_compile aura_construction_adapter.py tests/test_aura_construction_adapter.py
          rm .github/workflows/sco-phase3-manual-repair.yml
      - name: Commit exact repairs
        run: |
          git config user.name "AuraOS Phase 3 Manual Review"
          git config user.email "actions@users.noreply.github.com"
          git add aura_construction_adapter.py tests/test_aura_construction_adapter.py .github/workflows/sco-phase3-manual-repair.yml
          git commit -m "fix: harden construction option and authority routing"
          git push origin HEAD:refactor/sco-construction-e7-e8
