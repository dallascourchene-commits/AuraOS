name: Finalize Unified Memory Completion

on:
  push:
    branches:
      - refactor/unified-memory-continuity-completion
    paths:
      - .github/workflows/unified-memory-completion-cleanup.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity-completion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install verification dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Restore generated maps from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json

      - name: Verify clean unified memory integration
        shell: bash
        run: |
          python -m ruff format --check aura_unified_memory_continuity_toolchain.py
          python -m ruff check \
            aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_unified_memory_continuity.py
          python -m ruff check --select F821,E9 \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_architect_council_v3.py \
            aura_arena_persistence_adapters.py \
            aura_forge.py
          python -m py_compile \
            aura_unified_memory_continuity.py \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_agent_arena_mcp.py \
            aura_architect_council_v3.py \
            aura_arena_persistence_adapters.py \
            aura_forge.py
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_forge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py
          python aura_coding_waboose_cli.py run \
            --request .aura/waboose_requests/unified_memory_continuity.v1.json

      - name: Remove temporary harness transport
        shell: bash
        run: |
          git rm -f \
            .github/scripts/apply_umc_completion.py \
            .github/scripts/fix_umc_generated_test.py \
            .github/workflows/unified-memory-completion-apply.yml \
            .github/workflows/unified-memory-completion-probe.yml \
            .github/workflows/unified-memory-completion-cleanup.yml

      - name: Commit clean verified PR state
        shell: bash
        run: |
          git config user.name "AuraOS Refactor Harness"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json
          git commit -m "chore: finalize verified unified memory integration"
          git push origin HEAD:refactor/unified-memory-continuity-completion
