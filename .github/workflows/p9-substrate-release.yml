name: P9 Cognitive Substrate Release

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p9-substrate-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  generate-release-evidence:
    name: Generate release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate canonical artifacts
        run: |
          python aura_substrate_manifest.py --output /tmp/aura_substrate_manifest.v1.json
          python aura_substrate_release.py --root . --output /tmp/aura_substrate_release_index.v1.json
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-generated-release-evidence
          path: |
            /tmp/aura_substrate_manifest.v1.json
            /tmp/aura_substrate_release_index.v1.json
          if-no-files-found: error
          retention-days: 14

  validate-substrate:
    name: Substrate contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0,<9.0" "ruff>=0.9,<1.0"
      - name: Compile P9 surfaces
        run: |
          python -m py_compile \
            aura_substrate_contracts.py \
            aura_substrate_manifest.py \
            aura_substrate_release.py \
            aura_substrate_verifier.py
      - name: Fatal and static correctness lint
        run: |
          ruff check --select E4,E7,E9,F --ignore E721 \
            aura_substrate_contracts.py \
            aura_substrate_manifest.py \
            aura_substrate_release.py \
            aura_substrate_verifier.py
      - name: Regenerate and compare manifest
        run: |
          python aura_substrate_manifest.py --output /tmp/aura_substrate_manifest.v1.json
          cmp docs/aura_substrate_manifest.v1.json /tmp/aura_substrate_manifest.v1.json
      - name: Require committed release index
        run: test -f docs/aura_substrate_release_index.v1.json
