name: Phase C2 Final CODEMAP Refresh

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: phase-c2-final-codemap-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 72 &&
      github.event.pull_request.head.ref == 'feature/phase-c2-live-route-capsules'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-c2-live-route-capsules
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install navigator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Remove helper before topology generation
        run: rm .github/workflows/phase-c2-codemap-refresh.yml
      - name: Regenerate and verify C2 topology
        run: |
          python aura_codebase_navigator.py
          python -m aura_phase_c2_codemap_verify
      - name: Commit refreshed topology and helper deletion
        run: |
          git config user.name "aura-codemap[bot]"
          git config user.email "aura-codemap[bot]@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md .github/workflows/phase-c2-codemap-refresh.yml
          git commit -m "chore(c2): refresh CODEMAP for live route capsules"
          git push origin HEAD:feature/phase-c2-live-route-capsules
