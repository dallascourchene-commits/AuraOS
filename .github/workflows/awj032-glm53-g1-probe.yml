name: AWJ032 GLM53 G1 compatibility probe

on:
  pull_request:
    paths:
      - 'tools/awj032/glm53_compatibility_probe.py'
      - 'tools/awj032/test_glm53_compatibility_probe.py'
      - '.github/workflows/awj032-glm53-g1-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-glm53-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile probe
        run: python -m py_compile tools/awj032/glm53_compatibility_probe.py tools/awj032/test_glm53_compatibility_probe.py
      - name: Run focused regressions
        working-directory: tools/awj032
        run: python -m unittest -v test_glm53_compatibility_probe.py
