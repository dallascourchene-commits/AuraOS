name: TEMP PR3 Focused Verification

on:
  push:
    branches:
      - "analysis/pr3-focused-verification-20260808"

permissions:
  contents: read

jobs:
  pr3-focused:
    name: PR3 source-first exact-boundary verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0"
      - name: Verify authored diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Compile PR3 source and adversarial suites
        run: |
          python -m py_compile \
            aura_project_context_compiler.py \
            tests/test_aura_project_context_compiler.py \
            tests/test_aura_project_context_acceptance.py
      - name: Fatal lint PR3 source and adversarial suites
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_project_context_compiler.py \
            tests/test_aura_project_context_compiler.py \
            tests/test_aura_project_context_acceptance.py
      - name: Run exact PR3 adversarial suites
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q \
            tests/test_aura_project_context_compiler.py \
            tests/test_aura_project_context_acceptance.py
