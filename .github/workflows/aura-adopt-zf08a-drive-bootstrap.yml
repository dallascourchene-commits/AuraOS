name: AURA ADOPT ZF-08A Drive Bootstrap

on:
  pull_request:
    paths:
      - "tools/aura_adopt/aura_drive_bootstrap.py"
      - "tools/aura_adopt/test_aura_drive_bootstrap.py"
      - ".github/workflows/aura-adopt-zf08a-drive-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile tools/aura_adopt/aura_drive_bootstrap.py tools/aura_adopt/test_aura_drive_bootstrap.py
      - name: Focused regressions
        run: python -m unittest -v tools.aura_adopt.test_aura_drive_bootstrap
