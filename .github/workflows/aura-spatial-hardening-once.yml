name: Aura Spatial One-Shot Hardening

on:
  push:
    branches:
      - feature/aura-spatial-s0-s2
    paths:
      - .aura/tools/aura_spatial_hardening_once.py

permissions:
  contents: write

concurrency:
  group: aura-spatial-hardening-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-exact-source-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded exact-source transformations
        run: python .aura/tools/aura_spatial_hardening_once.py
      - name: Verify transformed Python and patch hygiene
        run: |
          python -m py_compile \
            aura_spatial_contracts.py \
            aura_spatial_asset_registry.py \
            aura_spatial_projection.py \
            aura_spatial_ws_guard.py \
            aura_topology_ws_bridge.py \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py
          git diff --check
      - name: Commit exact-source hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aura_spatial_contracts.py \
            aura_spatial_asset_registry.py \
            aura_spatial_projection.py \
            aura_topology_ws_bridge.py \
            schemas/aura_spatial_scene.schema.json \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            docs/AURA_SPATIAL_COMPUTING.md
          if git diff --cached --quiet; then
            echo "No hardening changes were required."
            exit 0
          fi
          git commit -m "Spatial S2: harden serialization, selection, and hotswap boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
