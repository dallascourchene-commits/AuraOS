name: Project006 Provider Handoff Integration

on:
  push:
    branches:
      - p0plus/project006-provider-handoff-integration-v1
  pull_request:
    paths:
      - 'tools/project006/provider_sidecar_reference/**'
      - 'tools/project006/local_runner_preflight.py'
      - 'tools/project006/test_local_runner_preflight.py'
      - '.github/workflows/project006-provider-handoff-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-provider-handoff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile exact integration files
        run: |
          python -m py_compile \
            tools/project006/provider_sidecar_reference/provider_sidecar.py \
            tools/project006/provider_sidecar_reference/provider_handoff.py \
            tools/project006/provider_sidecar_reference/test_provider_sidecar.py \
            tools/project006/provider_sidecar_reference/test_provider_sidecar_repair_r1.py \
            tools/project006/provider_sidecar_reference/test_provider_sidecar_repair_g3.py \
            tools/project006/provider_sidecar_reference/test_provider_sidecar_repair_g3_followup.py \
            tools/project006/provider_sidecar_reference/test_provider_handoff.py \
            tools/project006/local_runner_preflight.py \
            tools/project006/test_local_runner_preflight.py
      - name: Run exact WP04 sidecar, handoff, and WP10 preflight suites
        run: |
          python -m unittest -v \
            tools.project006.provider_sidecar_reference.test_provider_sidecar \
            tools.project006.provider_sidecar_reference.test_provider_sidecar_repair_r1 \
            tools.project006.provider_sidecar_reference.test_provider_sidecar_repair_g3 \
            tools.project006.provider_sidecar_reference.test_provider_sidecar_repair_g3_followup \
            tools.project006.provider_sidecar_reference.test_provider_handoff \
            tools.project006.test_local_runner_preflight
