name: Isolate and publish Construction renderer review repairs

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-review-repair-v5.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-review-repair-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply complete reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact span, observed {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/aura-construction-g7-g8-review-repair-v3.yml")
          source = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n\n      - name: Install focused", start)
          exec(compile(textwrap.dedent(source[start:end]), str(workflow), "exec"), {})

          # Do not immediately retry an already-failing previous-frame disposer.
          replace_once(
              "aura_spatial_web/construction_mesh_pass.js",
              '''    try {\n      await this.releaseDrawResources();\n      const visible = this.meshes.filter(\n''',
              '''    try {\n      await this.releaseDrawResources();\n    } catch (error) {\n      this.initialized = false;\n      this.disposed = true;\n      throw error;\n    }\n    try {\n      const visible = this.meshes.filter(\n''',
          )
          replace_once(
              "aura_spatial_web/construction_overlay_pass.js",
              '''    try {\n      await this.releaseDrawResources();\n      const model = this.buildModel();\n''',
              '''    try {\n      await this.releaseDrawResources();\n    } catch (error) {\n      this.initialized = false;\n      this.disposed = true;\n      throw error;\n    }\n    try {\n      const model = this.buildModel();\n''',
          )

          # Gaussian previous-frame cleanup failure is terminal, but is not retried in the same stack.
          gaussian = Path("aura_spatial_web/gaussian_renderer.js")
          text = gaussian.read_text(encoding="utf-8")
          old = '''    const started = this.now();\n    try {\n      await this._releaseDrawResources();\n      visibleAssets =\n'''
          new = '''    const started = this.now();\n    try {\n      await this._releaseDrawResources();\n    } catch (error) {\n      const errors = [error];\n      try {\n        await this._disposePresentationRenderer();\n      } catch (cleanup) {\n        errors.push(cleanup);\n      }\n      this.scene = null;\n      this.plan = null;\n      this.limits = null;\n      this.visibleAssetIds = null;\n      this.cancelled = true;\n      this.state = RENDERER_STATES.LOST;\n      if (errors.length > 1) {\n        throw new AggregateError(errors, "Gaussian cleanup failed");\n      }\n      throw error;\n    }\n    try {\n      visibleAssets =\n'''
          if text.count(old) != 1:
              raise RuntimeError("Gaussian initial cleanup span changed")
          gaussian.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Correct and strengthen the cleanup regression generated by the primary patch.
          test_path = Path("tests/js/spatial-construction-demo.test.mjs")
          text = test_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''test\("Construction mesh cleanup failure is terminal and preserves both errors", async \(\) => \{.*?\n\}\);\n''',
              re.DOTALL,
          )
          replacement = '''test("Construction mesh cleanup failure is terminal", async () => {\n  const { scene } = constructionFixture();\n  const pass = new ConstructionMeshPass({\n    drawMeshPass: async () => () => { throw new Error("forced mesh cleanup failure"); },\n  });\n  pass.initialize(scene, [{\n    asset_id: "asset:mesh",\n    source_digest: "1".repeat(64),\n    decoded_byte_length: 256,\n    resource: { local: true },\n  }]);\n  await pass.present();\n  await assert.rejects(pass.present(), /forced mesh cleanup failure/);\n  assert.equal(pass.status().disposed, true);\n  assert.equal(pass.status().initialized, false);\n});\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"mesh cleanup regression count was {count}")
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r requirements.txt
          python -m pip install -q --disable-pip-version-check pytest ruff

      - name: Format and verify Python boundaries
        run: |
          ruff check --fix aura_construction_demo_director.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_fetch_construction_demo_source.py
          ruff format aura_construction_demo_director.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_fetch_construction_demo_source.py
          python -m py_compile aura_construction_demo_director.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py
          ruff check aura_construction_demo_director.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_fetch_construction_demo_source.py
          python -m pytest -q --tb=short tests/test_aura_construction_demo_director.py
          python -m pytest -q --tb=short tests/test_aura_spatial_cli_construction_security.py
          python -m pytest -q --tb=short tests/test_aura_fetch_construction_demo_source.py

      - name: Verify JavaScript syntax
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --check aura_spatial_web/construction_mesh_pass.js
          node --check aura_spatial_web/construction_overlay_pass.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/gaussian_renderer.js
          node --check aura_spatial_web/webgl2_gaussian_pass.js

      - name: Verify abort cleanup regression
        run: node --test --test-name-pattern="abort releases" tests/js/spatial-construction-demo.test.mjs

      - name: Verify terminal mesh cleanup regression
        run: node --test --test-name-pattern="mesh cleanup failure" tests/js/spatial-construction-demo.test.mjs

      - name: Verify partial GPU allocation regression
        run: node --test --test-name-pattern="partial buffer allocation" tests/js/spatial-construction-demo.test.mjs

      - name: Verify complete renderer contracts
        run: node --test tests/js/spatial-construction-demo.test.mjs

      - name: Verify review and covariance regressions
        run: |
          node --test tests/js/spatial-construction-review-regressions.test.mjs
          node --test tests/js/spatial-gaussian-covariance.test.mjs

      - name: Publish exact verified tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_construction_demo_director.py aura_spatial_cli.py \
            aura_spatial_web/construction_demo_app.js \
            aura_spatial_web/construction_mesh_pass.js \
            aura_spatial_web/construction_overlay_pass.js \
            aura_spatial_web/construction_scene_renderer.js \
            aura_spatial_web/gaussian_renderer.js \
            aura_spatial_web/webgl2_gaussian_pass.js \
            scripts/aura_fetch_construction_demo_source.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs
          git commit -m "fix(g8): resolve adversarial Construction review findings"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_HEAD" "origin/$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:"$TARGET_BRANCH"
