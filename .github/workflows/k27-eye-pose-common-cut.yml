name: K27 eye-pose common-cut contract

on:
  pull_request:
    paths:
      - "tools/k27_eye_pose_observation_contract.py"
      - "tests/test_k27_eye_pose_observation_contract.py"
      - ".github/workflows/k27-eye-pose-common-cut.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run eye-pose common-cut adversarial battery
        run: python -m unittest tests/test_k27_eye_pose_observation_contract.py -v
