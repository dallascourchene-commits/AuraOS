name: Finalize Construction G7-G8 Waboose fixes

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-waboose-fixes-v2.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-waboose-fixes-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r requirements.txt
          python -m pip install -q --disable-pip-version-check bandit defusedxml jsonschema pytest ruff

      - name: Apply Waboose security corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          original = Path(".github/workflows/aura-construction-g7-g8-waboose-fixes.yml")
          source = original.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n\n      - name: Apply Ruff", start)
          exec(compile(textwrap.dedent(source[start:end]), str(original), "exec"), {})

          for relative in (
              "scripts/aura_prepare_construction_demo_assets_core.py",
              "scripts/aura_verify_construction_demo_assets.py",
          ):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              marker = "from __future__ import annotations\n"
              directive = marker + "\n# ruff: noqa: E402 - standalone script bootstraps repository imports\n"
              if "# ruff: noqa: E402" not in text:
                  if text.count(marker) != 1:
                      raise RuntimeError(f"{relative}: future-import marker changed")
                  path.write_text(text.replace(marker, directive, 1), encoding="utf-8")
          PY

      - name: Apply Ruff safe fixes and formatting
        run: |
          ruff check --fix \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py
          ruff format \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py

      - name: Verify Ruff and medium-high Bandit
        run: |
          ruff check \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py
          bandit -q -ll \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py

      - name: Verify focused Python regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py

      - name: Verify retained browser regressions
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --check aura_spatial_web/construction_mesh_pass.js
          node --check aura_spatial_web/construction_overlay_pass.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/gaussian_renderer.js
          node --check aura_spatial_web/webgl2_gaussian_pass.js
          node --test tests/js/spatial-construction-demo.test.mjs
          node --test tests/js/spatial-construction-review-regressions.test.mjs
          node --test tests/js/spatial-gaussian-covariance.test.mjs

      - name: Remove temporary Waboose workflows
        run: |
          git rm -f \
            .github/workflows/aura-construction-g7-g8-waboose.yml \
            .github/workflows/aura-construction-g7-g8-waboose-fixes.yml \
            .github/workflows/aura-construction-g7-g8-waboose-fixes-v2.yml

      - name: Commit and publish verified Waboose fixes
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Waboose Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(g8): apply Waboose security and lint findings"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
