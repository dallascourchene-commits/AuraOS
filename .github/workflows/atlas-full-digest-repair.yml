name: Atlas Full Digest Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: atlas-full-digest-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c0-c2-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coding-relationship-compass-c0-c2-20260721
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply complete serialized-content digest patch
        env:
          PATCH_B64: 
        run: |
          test "$(git log -1 --format=%s)" = "chore: trigger complete Atlas digest coverage"
          STAGING_SHA="${{ github.event.pull_request.head.sha }}"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/atlas-full-digest.patch
          git reset --hard dee26a63ffc29871acde27bf84b70c23d6a49ed4
          git apply --check /tmp/atlas-full-digest.patch
          git apply /tmp/atlas-full-digest.patch
          printf '%s\n' "$STAGING_SHA" > /tmp/staging-sha

      - name: Verify complete digest coverage
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m py_compile aura_relationship_atlas.py tests/test_aura_relationship_atlas.py
          python -m pytest -q tests/test_aura_relationship_atlas.py

      - name: Publish clean two-file fix
        env:
          TARGET_BRANCH: work/coding-relationship-compass-c0-c2-20260721
        run: |
          EXPECTED_STAGING_SHA="$(cat /tmp/staging-sha)"
          git add aura_relationship_atlas.py tests/test_aura_relationship_atlas.py
          git config user.name 'AuraOS Review Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: hash complete serialized Atlas content'
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 2
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_STAGING_SHA}" \
            origin HEAD:"${TARGET_BRANCH}"
