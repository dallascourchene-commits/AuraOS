name: Aura Temporary S4-B Repair Apply

on:
  push:
    branches:
      - feature/spatial-s4b-gaussian-security
    paths:
      - ".github/workflows/aura-s4b-repair-apply-temp.yml"
      - ".aura_temp/s4b_repair_*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-s4b-repair-apply
  cancel-in-progress: false

jobs:
  apply-reviewed-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact S4-B branch
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0
          submodules: false

      - name: Reconstruct and verify reviewed payload
        run: |
          set -euo pipefail
          cat \
            .aura_temp/s4b_repair_00 \
            .aura_temp/s4b_repair_01 \
            .aura_temp/s4b_repair_02 \
            .aura_temp/s4b_repair_03 \
            .aura_temp/s4b_repair_04 \
            .aura_temp/s4b_repair_05 \
            .aura_temp/s4b_repair_06 \
            .aura_temp/s4b_repair_07 \
            | base64 --decode > /tmp/s4b_repair.tar.gz
          echo "fcc46d16c7090f6d50b940b5a6cec489e980fae60c277316c244408c597568a5  /tmp/s4b_repair.tar.gz" \
            | sha256sum --check --strict
          tar -tzf /tmp/s4b_repair.tar.gz

      - name: Apply permanent repair and remove all transport surfaces
        run: |
          set -euo pipefail
          tar -xzf /tmp/s4b_repair.tar.gz
          rm -rf .aura_temp scripts/.s4b_fix
          git rm --ignore-unmatch \
            .github/workflows/aura-s4b-codex-fix-temp.yml \
            .github/workflows/aura-s4b-repair-apply-temp.yml
          git diff --check
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_render_plan.py \
            aura_spatial_importers/*.py \
            scripts/aura_spatial_s4b_architect_harness.py
          node --test \
            tests/js/spatial-gaussian.test.mjs \
            tests/js/spatial-mixed-scene.test.mjs

      - name: Commit exact permanent Codex repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden S4-B after Codex review"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/spatial-s4b-gaussian-security
