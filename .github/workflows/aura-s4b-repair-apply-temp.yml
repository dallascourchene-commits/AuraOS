name: Aura Temporary S4-B Repair Reconciler

on:
  push:
    branches:
      - feature/spatial-s4b-gaussian-security
    paths:
      - ".github/workflows/aura-s4b-repair-apply-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-s4b-repair-reconciler
  cancel-in-progress: false

jobs:
  reconcile-reviewed-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out S4-B branch with full history
        uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0
          submodules: false

      - name: Reconstruct and verify immutable reviewed payload
        run: |
          set -euo pipefail
          cat \
            .aura_temp/s4b_repair_00 \
            .aura_temp/s4b_repair_01 \
            .aura_temp/s4b_repair_02 \
            .aura_temp/s4b_repair_03 \
            .aura_temp/s4b_repair_04 \
            .aura_temp/s4b_repair_05 \
            .aura_temp/s4b_repair_06 \
            .aura_temp/s4b_repair_07 \
            | base64 --decode > /tmp/s4b_repair.tar.gz
          echo "fcc46d16c7090f6d50b940b5a6cec489e980fae60c277316c244408c597568a5  /tmp/s4b_repair.tar.gz" \
            | sha256sum --check --strict
          tar -tzf /tmp/s4b_repair.tar.gz

      - name: Reconcile latest remote head and push permanent tree
        run: |
          set -euo pipefail
          branch="feature/spatial-s4b-gaussian-security"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Reconciliation attempt ${attempt}"
            git fetch --no-tags origin "${branch}"
            git reset --hard "origin/${branch}"

            tar -xzf /tmp/s4b_repair.tar.gz
            rm -rf \
              .aura_temp \
              scripts/.s4b_fix \
              scripts/.s4b_round2 \
              scripts/.s4b_round3
            rm -f \
              .github/workflows/aura-s4b-codex-fix-temp.yml \
              .github/workflows/aura-s4b-repair-apply-temp.yml \
              .github/workflows/aura-s4b-round2-apply-temp.yml \
              .github/workflows/aura-s4b-round3-apply-temp.yml

            git add -A
            git diff --cached --check
            python -m py_compile \
              aura_spatial_asset_registry.py \
              aura_spatial_render_plan.py \
              aura_spatial_importers/*.py \
              scripts/aura_spatial_s4b_architect_harness.py
            node --test \
              tests/js/spatial-gaussian.test.mjs \
              tests/js/spatial-mixed-scene.test.mjs

            if git diff --cached --quiet; then
              echo "Remote branch is already reconciled."
              exit 0
            fi

            git commit -m "fix: harden S4-B after Codex review"
            if git push origin "HEAD:${branch}"; then
              test -z "$(git status --porcelain)"
              exit 0
            fi

            echo "Remote advanced during reconciliation; retrying from its new head."
            sleep 2
          done

          echo "Unable to reconcile S4-B branch after five exact-head attempts." >&2
          exit 1
