name: Aura WorkCapsule Two-Phase Observation-Bound Exact Replay

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_reentry_exact_verifier.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'scripts/aura_workcapsule_source_bound_exact_reentry.py'
      - 'scripts/aura_workcapsule_reentry_closure.py'
      - 'scripts/aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'scripts/aura_workcapsule_observation_bound_closure.py'
      - 'scripts/aura_workcapsule_observation_bound_exact_verifier.py'
      - 'scripts/aura_workcapsule_two_phase_source_bound_closure.py'
      - 'scripts/aura_workcapsule_two_phase_observation_bound_exact.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_exact_verifier.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_source_bound_exact_reentry.py'
      - 'tests/test_aura_workcapsule_reentry_closure.py'
      - 'tests/test_aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'tests/test_aura_workcapsule_observation_bound_closure.py'
      - 'tests/test_aura_workcapsule_observation_bound_exact_verifier.py'
      - 'tests/test_aura_workcapsule_two_phase_source_bound_closure.py'
      - 'tests/test_aura_workcapsule_two_phase_observation_bound_exact.py'
      - '.github/workflows/aura-workcapsule-two-phase-observation-bound-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-phase-observation-bound-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove raw source observation and exact re-entry owners
        run: |
          python3 -m py_compile scripts/aura_astge_anchor_hydration.py scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py scripts/aura_workcapsule_reentry_exact_verifier.py scripts/aura_workcapsule_source_reentry_observation.py scripts/aura_workcapsule_source_bound_exact_reentry.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration tests.test_aura_workcapsule_context_binding tests.test_aura_workcapsule_reentry_invalidation tests.test_aura_workcapsule_reentry_exact_verifier tests.test_aura_workcapsule_source_reentry_observation tests.test_aura_workcapsule_source_bound_exact_reentry

      - name: Re-prove closure and exact observation-bound owners
        run: |
          python3 -m py_compile scripts/aura_workcapsule_reentry_closure.py scripts/aura_workcapsule_reentry_closure_exact_verifier.py scripts/aura_workcapsule_observation_bound_closure.py scripts/aura_workcapsule_observation_bound_exact_verifier.py
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure tests.test_aura_workcapsule_reentry_closure_exact_verifier tests.test_aura_workcapsule_observation_bound_closure tests.test_aura_workcapsule_observation_bound_exact_verifier

      - name: Re-prove PR518 two-phase lifecycle
        run: |
          python3 -m py_compile scripts/aura_workcapsule_two_phase_source_bound_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_two_phase_source_bound_closure

      - name: Prove O26 two-phase observation-bound exact replay
        run: |
          python3 -m py_compile scripts/aura_workcapsule_two_phase_observation_bound_exact.py
          python3 -m unittest -v tests.test_aura_workcapsule_two_phase_observation_bound_exact

      - name: Assert caller evidence escape hatches are absent
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_two_phase_observation_bound_exact import verify_two_phase_observation_bound_exact
          params = inspect.signature(verify_two_phase_observation_bound_exact).parameters
          assert 'candidate_binding' not in params
          assert 'observed_source_witnesses' not in params
          assert {'pre_root','post_root','previous_binding','reentry_receipt','observation_bound_receipt'} <= set(params)
          print('CALLER_CANDIDATE_BINDING_ACCEPTED=false')
          print('CALLER_SOURCE_WITNESSES_ACCEPTED=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'TWO_PHASE_OBSERVATION_BOUND_EXACT_REPRODUCTION=true'
          echo 'PRE_POST_EVIDENCE_ROOTS_DISTINCT=true'
          echo 'PRE_REENTRY_RAW_OWNER_REPLAYED=true'
          echo 'POST_PR519_OBSERVATION_RECEIPT_REPLAYED=true'
          echo 'CLOSED_INNER_PR518_LIFECYCLE_REPLAYED=true'
          echo 'EXACT_HOLD_PRESERVED_WITHOUT_INNER_CLOSURE_FABRICATION=true'
          echo 'SOURCE_CURRENTNESS_MINTED=false'
          echo 'PRODUCER_IDENTITY_AUTHENTICATED=false'
          echo 'PRE_GRAPH_PRODUCER_AUTHENTICATED=false'
          echo 'POST_GRAPH_PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
