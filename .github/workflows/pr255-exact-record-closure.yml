name: PR255 Exact Record Closure V3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr255-exact-record-closure.yml

permissions:
  contents: write

concurrency:
  group: pr255-exact-record-closure
  cancel-in-progress: true

jobs:
  prove_and_promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control files
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Checkout exact frozen PR head
        uses: actions/checkout@v4
        with:
          ref: 38946f117da77285c318747fee232c6a663179a9
          path: work
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove and promote exact repair
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../control/.github/pr255_exact_record_closure_runner.sh
