name: K27 ASTGE Canonical Definition Scope Review

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge/**"
      - "crates/aura-k27-astge-ingest/**"
      - "crates/aura-k27-astge-materialize/**"
      - "crates/aura-k27-astge-scope/**"
      - "crates/aura-k27-astge-source-review/**"
      - "crates/aura-k27-astge-scopes/**"
      - "crates/aura-k27-astge-scope-review/**"
      - "crates/aura-k27-astge-generation-domain/**"
      - "crates/aura-k27-astge-typed-source-review/**"
      - "crates/aura-k27-astge-typed-nested-scope-review/**"
      - "crates/aura-k27-astge-canonical-scope-review/**"
      - "tools/k27_astge_python_scope_oracle.py"
      - ".github/workflows/k27-astge-canonical-definition-scope-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k27-astge-canonical-definition-scope-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-definition-scope-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove lexical scope inventory and CPython oracle
        run: |
          rustc --version
          cargo --version
          python3 --version
          cargo fmt --manifest-path crates/aura-k27-astge-scopes/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets -- -D warnings
          python3 tools/k27_astge_python_scope_oracle.py

      - name: Re-prove PR503 typed nested-scope review plane
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-scope-review/Cargo.toml --all-targets -- -D warnings
          cargo fmt --check --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-generation-domain/Cargo.toml --all-targets -- -D warnings
          cargo fmt --check --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-typed-source-review/Cargo.toml --all-targets -- -D warnings
          cargo fmt --check --manifest-path crates/aura-k27-astge-typed-nested-scope-review/Cargo.toml
          cargo test --manifest-path crates/aura-k27-astge-typed-nested-scope-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-typed-nested-scope-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-typed-nested-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Verify canonical owner-target convergence
        run: |
          cargo fmt --check --manifest-path crates/aura-k27-astge-canonical-scope-review/Cargo.toml
          cargo test --manifest-path crates/aura-k27-astge-canonical-scope-review/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-canonical-scope-review/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-canonical-scope-review/Cargo.toml --all-targets -- -D warnings

      - name: Verify public relation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('crates/aura-k27-astge-canonical-scope-review/src/lib.rs').read_text()
          assert 'binding.target_scope_id == selected_scope_id' in text
          assert 'binding.owner_scope_id != selected_parent_scope_id' in text
          assert 'expected_source_generation: SourceGenerationV1' in text
          assert 'admit_typed_nested_scope_source_review(' in text
          print('DEFINITION_OWNER_TARGET_RELATION_EXPLICIT=true')
          print('SELECTED_REVIEW_SCOPE_IS_BINDING_TARGET=true')
          print('BINDING_OWNER_IS_SELECTED_PARENT=true')
          print('TYPED_SOURCE_GENERATION_PRESERVED=true')
          PY

      - name: Safe-path unsafe scan
        run: |
          if grep -R --line-number -E 'unsafe\s*\{' \
            crates/aura-k27-astge-scopes/src \
            crates/aura-k27-astge-scope-review/src \
            crates/aura-k27-astge-typed-nested-scope-review/src \
            crates/aura-k27-astge-canonical-scope-review/src; then
            echo 'unsafe block found in canonical scope-review safe path' >&2
            exit 1
          fi

      - name: Emit claim ceiling
        run: |
          echo "CANONICAL_DEFINITION_SCOPE_REVIEW_EXECUTED=true"
          echo "DEFINITION_OWNER_SCOPE_EQUALS_TARGET_SCOPE=false"
          echo "SELECTED_REVIEW_SCOPE_IS_BINDING_TARGET=true"
          echo "BINDING_OWNER_IS_SELECTED_PARENT=true"
          echo "SAME_NAME_SELECTS_BINDING=false"
          echo "SOURCE_GENERATION_TYPED=true"
          echo "DESCENDANT_SCOPE_PROTECTION_RETAINED=true"
          echo "POST_EDIT_SCOPE_AST_CURRENTNESS_PROVEN=false"
          echo "IDENTIFIER_USE_RESOLUTION_PROVEN=false"
          echo "RUNTIME_BINDING_WINNER_PROVEN=false"
          echo "CALL_GRAPH_PROVEN=false"
          echo "SEMANTIC_PATCH_CORRECTNESS_PROVEN=false"
          echo "B_MINUS_APPROVED=false"
          echo "COMMIT_AUTHORIZED=false"
          echo "HUMAN_AUTHORITY=false"
          echo "EXTERNAL_EFFECT=false"
