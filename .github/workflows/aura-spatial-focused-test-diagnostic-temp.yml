name: Aura Spatial Focused Repair Diagnostic Temp

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-focused-test-diagnostic-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --no-tags --depth=1 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy
      - name: Capture proposed repair tests
        run: |
          mkdir -p /tmp/aura-focused-repair-diagnostic
          python - <<'PY'
          from pathlib import Path

          spatial = Path("aura_spatial_construction.py")
          text = spatial.read_text(encoding="utf-8")
          text = text.replace(
              '    if parsed.scheme not in {"aura", "file"}:\n        raise ValueError("Construction floor-plan assets must be local or Aura-addressed")\n',
              '    if parsed.scheme != "aura":\n        raise ValueError("Construction floor-plan assets must be Aura-addressed")\n',
              1,
          )
          text = text.replace(
              '    if parsed.scheme == "aura":\n        if not parsed.netloc or parsed.netloc != parsed.netloc.casefold():\n            raise ValueError("Aura asset URI requires a canonical lowercase authority")\n    elif parsed.netloc not in {"", "localhost"}:\n        raise ValueError("file asset URI cannot name a remote host")\n',
              '    if not parsed.netloc or parsed.netloc != parsed.netloc.casefold():\n        raise ValueError("Aura asset URI requires a canonical lowercase authority")\n',
              1,
          )
          spatial.write_text(text, encoding="utf-8")

          test = Path("tests/test_aura_spatial_waboose_precision.py")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              '        "file://remote-host/tmp/floor.glb",\n        "https://example.test/floor.glb",\n',
              '        "file://remote-host/tmp/floor.glb",\n        "file:///tmp/aura/floor.glb",\n        "https://example.test/floor.glb",\n',
              1,
          )
          text = text.replace(
              'match=r"(?:URI|local or Aura-addressed|remote host)"',
              'match=r"(?:URI|Aura-addressed|remote host)"',
              1,
          )
          start = text.index("def test_construction_projection_accepts_canonical_aura_and_local_file_uris()")
          text = text[:start] + '''def test_construction_projection_accepts_canonical_aura_uri() -> None:
              fixture, packet = _fixture_packet()
              scene = project_construction_state_to_scene(
                  fixture.state,
                  packet,
                  purpose_digest="7" * 64,
                  floor_plan_assets=(_floor_asset(),),
              )
              assert len(scene.assets) == 2
          '''
          text = text.replace("from dataclasses import replace\n\n", "")
          test.write_text(text, encoding="utf-8")
          PY
          files=(aura_spatial_construction.py tests/test_aura_spatial_waboose_precision.py)
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          git diff -- "${files[@]}" > /tmp/aura-focused-repair-diagnostic/diff.patch
          set +e
          python -m pytest -vv --tb=long \
            tests/test_aura_spatial_codex_repairs.py \
            tests/test_aura_spatial_waboose_precision.py \
            tests/test_aura_spatial_s6_construction.py \
            2>&1 | tee /tmp/aura-focused-repair-diagnostic/pytest.log
          echo "${PIPESTATUS[0]}" > /tmp/aura-focused-repair-diagnostic/status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-focused-repair-diagnostic-${{ github.sha }}
          path: /tmp/aura-focused-repair-diagnostic
          retention-days: 1
