name: Codex Round 4 Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: codex-round4-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c0-c2-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coding-relationship-compass-c0-c2-20260721
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified Codex round 4 patch
        env:
          PATCH_B64: 
        run: |
          test "$(git log -1 --format=%s)" = "chore: trigger Codex round 4 repair"
          STAGING_SHA="${{ github.event.pull_request.head.sha }}"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/codex-round4.patch
          git reset --hard ae18de23a23aa44a60c30cf28503cca284eaef6b
          git apply --check /tmp/codex-round4.patch
          git apply /tmp/codex-round4.patch
          printf '%s\n' "$STAGING_SHA" > /tmp/staging-sha

      - name: Verify trust-boundary repairs
        run: |
          python -m pip install --disable-pip-version-check pytest pytest-asyncio
          python -m py_compile \
            aura_relationship_atlas.py \
            aura_coding_relationship_compass.py \
            aura_live_architect.py \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_coding_relationship_compass.py
          python -m pytest -q \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relationship_contracts.py \
            tests/test_aura_architecture_harness.py \
            test_aura_architect_loop.py

      - name: Publish clean five-file fix
        env:
          TARGET_BRANCH: work/coding-relationship-compass-c0-c2-20260721
        run: |
          EXPECTED_STAGING_SHA="$(cat /tmp/staging-sha)"
          git add \
            aura_relationship_atlas.py \
            aura_coding_relationship_compass.py \
            aura_live_architect.py \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_coding_relationship_compass.py
          git config user.name 'AuraOS Review Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: fail closed across Compass trust boundaries'
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 5
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_STAGING_SHA}" \
            origin HEAD:"${TARGET_BRANCH}"
