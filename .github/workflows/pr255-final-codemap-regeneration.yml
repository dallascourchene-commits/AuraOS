name: PR255 Final CODEMAP Regeneration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pr255-final-codemap-regeneration.yml"

permissions:
  contents: write

concurrency:
  group: pr255-final-codemap-regeneration
  cancel-in-progress: false

env:
  FROZEN_HEAD: f72033b798ab7ca4fc0f4a5fbf5c0582faad51be
  TARGET_BRANCH: refactor/intent-native-spatial-workspace-pr1

jobs:
  regenerate-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch frozen PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$FROZEN_HEAD"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FROZEN_HEAD"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regenerate canonical CODEMAP artifacts
        run: |
          set -euo pipefail
          cp .aura/CODEMAP.json /tmp/aura-codemap-reference.json
          python aura_codebase_navigator.py
          set +e
          python -m aura_codemap_verify \
            --compare-json /tmp/aura-codemap-reference.json \
            > /tmp/aura-codemap-comparison.json
          comparison_status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          result = json.loads(
              Path('/tmp/aura-codemap-comparison.json').read_text(encoding='utf-8')
          )
          if result.get('stable_comparison', {}).get('ok') is True:
              subprocess.run(
                  [
                      'git', 'checkout', 'HEAD', '--',
                      '.aura/CODEMAP.json',
                      '.aura/CODEMAP.md',
                      'topology_map.json',
                      'Aura_Memory/live_topology_ast.json',
                  ],
                  check=True,
              )
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'VOLATILE_ONLY\n', encoding='utf-8'
              )
          else:
              Path('/tmp/aura-codemap-change-class.txt').write_text(
                  'MEANINGFUL\n', encoding='utf-8'
              )
          PY
          if [ "$(cat /tmp/aura-codemap-change-class.txt)" = "MEANINGFUL" ]; then
            python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          else
            test "$comparison_status" -eq 0
          fi
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          git diff --check

      - name: Enforce generated-only transaction scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'topology_map.json',
              'Aura_Memory/live_topology_ast.json',
          }
          changed = {
              line for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines() if line
          }
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected generated transaction files: {sorted(unexpected)}')
          Path('/tmp/aura-codemap-changed-files.txt').write_text(
              '\n'.join(sorted(changed)) + ('\n' if changed else ''), encoding='utf-8'
          )
          print('generated changes:', sorted(changed))
          PY

      - name: Run focused regression and static gates
        run: |
          set -euo pipefail
          python -m py_compile aura_ephemeral_workspace_contracts.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_contracts.py
          test "$(python -m pytest --collect-only -q tests/test_aura_ephemeral_workspace_contracts.py | tail -n 1)" = "46 tests collected in 0.00s" || \
            python -m pytest --collect-only -q tests/test_aura_ephemeral_workspace_contracts.py
          python -m ruff check \
            aura_ephemeral_workspace_contracts.py \
            tests/test_aura_ephemeral_workspace_contracts.py \
            --select F401,F821,F841
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          for path in (
              Path('schemas/aura_ephemeral_workspace_recipe.schema.json'),
              Path('schemas/aura_multimodal_spatial_observation.schema.json'),
              Path('schemas/aura_project_context_projection.schema.json'),
          ):
              schema = json.loads(path.read_text(encoding='utf-8'))
              validator_for(schema).check_schema(schema)
              print(f'meta-valid: {path}')
          PY
          git diff --check

      - name: Publish synchronized maps with race guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_head="$({ git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            ls-remote origin "refs/heads/$TARGET_BRANCH"; } | awk '{print $1}')"
          test "$remote_head" = "$FROZEN_HEAD"

          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/aura-codemap-staged-files.txt

          if git diff --cached --quiet; then
            echo "$FROZEN_HEAD" > /tmp/aura-codemap-published-head.txt
            echo "NO_MEANINGFUL_CHANGE" > /tmp/aura-codemap-publication.txt
            unset AUTH_HEADER
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'topology_map.json',
              'Aura_Memory/live_topology_ast.json',
          }
          staged = set(Path('/tmp/aura-codemap-staged-files.txt').read_text().splitlines())
          if not staged or staged - allowed:
              raise SystemExit(f'invalid staged CODEMAP scope: {sorted(staged)}')
          PY

          git commit -m "docs: synchronize CODEMAP and topology"
          published_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$FROZEN_HEAD"

          remote_head="$({ git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            ls-remote origin "refs/heads/$TARGET_BRANCH"; } | awk '{print $1}')"
          test "$remote_head" = "$FROZEN_HEAD"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin HEAD:"refs/heads/$TARGET_BRANCH"
          unset AUTH_HEADER
          echo "$published_head" > /tmp/aura-codemap-published-head.txt
          echo "PUBLISHED" > /tmp/aura-codemap-publication.txt

      - name: Upload final regeneration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr255-final-codemap-regeneration-${{ env.FROZEN_HEAD }}
          path: |
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
            Aura_Memory/live_topology_ast.json
            /tmp/aura-codemap-comparison.json
            /tmp/aura-codemap-change-class.txt
            /tmp/aura-codemap-changed-files.txt
            /tmp/aura-codemap-staged-files.txt
            /tmp/aura-codemap-published-head.txt
            /tmp/aura-codemap-publication.txt
          if-no-files-found: warn
          retention-days: 14
