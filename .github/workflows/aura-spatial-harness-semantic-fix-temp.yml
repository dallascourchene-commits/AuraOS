name: Aura Spatial Harness Semantic Diagnostic Temp

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-harness-semantic-fix-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clone exact PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --no-tags --depth=256 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy
      - name: Capture semantic repair proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/aura-spatial-harness-semantic-diagnostic
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/aura_spatial_s5_s6_construction_architect_harness.py")
          text = path.read_text(encoding="utf-8")
          start = text.index('                "focus_directives": [')
          end = text.index('                "invariants": [', start)
          replacement = '''                # This harness invokes deterministic Waboose analysis without an
                  # external semantic agent. Agent-origin focus directives would require
                  # submit_findings() evidence and must not be claimed as completed here;
                  # the same boundaries remain mandatory in invariants and risk_map.
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          ruff check --fix scripts/aura_spatial_s5_s6_construction_architect_harness.py tests/test_aura_spatial_s5_s6_harness.py
          ruff format scripts/aura_spatial_s5_s6_construction_architect_harness.py tests/test_aura_spatial_s5_s6_harness.py
          git diff -- scripts/aura_spatial_s5_s6_construction_architect_harness.py tests/test_aura_spatial_s5_s6_harness.py \
            > /tmp/aura-spatial-harness-semantic-diagnostic/diff.patch
          python -m py_compile scripts/aura_spatial_s5_s6_construction_architect_harness.py
          set +e
          python -m pytest -vv --tb=long tests/test_aura_spatial_s5_s6_harness.py \
            2>&1 | tee /tmp/aura-spatial-harness-semantic-diagnostic/pytest.log
          test_status=${PIPESTATUS[0]}
          python scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            --repo-root . \
            --base-ref origin/main \
            --head-ref HEAD \
            --observed-head "$(git rev-parse HEAD)" \
            --receipt /tmp/aura-spatial-harness-semantic-diagnostic/full.json \
            2>&1 | tee /tmp/aura-spatial-harness-semantic-diagnostic/harness.log
          harness_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > /tmp/aura-spatial-harness-semantic-diagnostic/test-status.txt
          printf '%s\n' "$harness_status" > /tmp/aura-spatial-harness-semantic-diagnostic/harness-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-harness-semantic-diagnostic-${{ github.sha }}
          path: /tmp/aura-spatial-harness-semantic-diagnostic
          retention-days: 1
