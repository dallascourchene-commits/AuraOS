name: Aura Spatial S3A Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s3a-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: aura-spatial-s3a-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact pull-request head archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o aura-spatial-s3a-exact-head.tar.gz \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${EXACT_HEAD}"
          size="$(wc -c < aura-spatial-s3a-exact-head.tar.gz)"
          test "$size" -gt 0
          test "$size" -le 268435456
          tar -tzf aura-spatial-s3a-exact-head.tar.gz | grep -q '/aura_spatial_contracts.py$'
          printf '%s\n' "$EXACT_HEAD" > EXACT_HEAD.txt

      - name: Upload exact-head repository archive
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-s3a-exact-head-${{ github.event.pull_request.head.sha }}
          path: |
            aura-spatial-s3a-exact-head.tar.gz
            EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 1
