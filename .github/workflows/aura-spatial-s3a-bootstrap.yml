name: Aura P0 Source Integrity Repair

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s3a-bootstrap.yml"
      - "aura_node.py"
      - "aura_source_integrity.py"
      - "aura_review_lessons_*.py"
      - "tests/test_aura_source_integrity.py"
      - "tests/test_aura_*review*lesson*.py"

permissions:
  contents: write

concurrency:
  group: aura-p0-source-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact pull-request branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HEAD_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"

      - name: Apply deterministic startup-auditor repair
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if new in source:
                  return source
              if source.count(old) != 1:
                  raise RuntimeError(f"{label}: expected one old block, found {source.count(old)}")
              return source.replace(old, new, 1)

          node = Path("aura_node.py")
          source = node.read_text(encoding="utf-8")
          source = replace_once(
              source,
              "from aura_positional_parser import AthabaskanPositionalParser\n",
              "from aura_positional_parser import AthabaskanPositionalParser\n"
              "from aura_source_integrity import SourceIntegrityError, read_utf8_source\n",
              "source-integrity import",
          )
          source = replace_once(
              source,
              '''class AuraEcosystemAuditor:\n    def __init__(self, node_ref):\n        self.node = node_ref\n        self.function_calls = defaultdict(int)\n    async def _scan_and_stamp_file(self, file_path: str, q_root: str):\n        if not os.path.exists(file_path):\n            return\n        with open(file_path, encoding='utf-8') as f:\n            source_code = f.read()\n''',
              '''class AuraEcosystemAuditor:\n    def __init__(self, node_ref):\n        self.node = node_ref\n        self.function_calls = defaultdict(int)\n        self.source_integrity_failures = []\n\n    async def _scan_and_stamp_file(self, file_path: str, q_root: str) -> dict[str, Any]:\n        if not os.path.exists(file_path):\n            return {\n                "ok": False,\n                "status": "SOURCE_FILE_MISSING",\n                "path": file_path,\n            }\n        try:\n            source_code = read_utf8_source(file_path)\n        except (OSError, SourceIntegrityError) as exc:\n            if isinstance(exc, SourceIntegrityError):\n                failure = exc.failure.to_dict()\n            else:\n                failure = {\n                    "path": file_path,\n                    "code": "SOURCE_READ_FAILED",\n                    "message": f"{type(exc).__name__}: {exc}",\n                    "byte_offset": 0,\n                    "offending_bytes_hex": "",\n                    "file_size": 0,\n                }\n            self.source_integrity_failures.append(failure)\n            print(\n                f"[-] Source Integrity Error in {file_path}: "\n                f"{failure['message']}"\n            )\n            return {"ok": False, "status": failure["code"], **failure}\n''',
              "auditor source read",
          )
          source = replace_once(
              source,
              '''        except SyntaxError as e:\n            print(f"[-] Syntax Error in {file_path}. Cannot audit: {e}")\n            return\n''',
              '''        except SyntaxError as e:\n            print(f"[-] Syntax Error in {file_path}. Cannot audit: {e}")\n            return {\n                "ok": False,\n                "status": "SOURCE_SYNTAX_INVALID",\n                "path": file_path,\n                "message": str(e),\n            }\n''',
              "auditor syntax result",
          )
          source = replace_once(
              source,
              '''            if not cached_synopsis:\n                await self.node.memory_palace.update_audit_cache(file_path, current_mtime, current_size, synopsis)\n\n    async def execute_unified_audit(self) -> str:\n''',
              '''            if not cached_synopsis:\n                await self.node.memory_palace.update_audit_cache(file_path, current_mtime, current_size, synopsis)\n        return {\n            "ok": True,\n            "status": "STAMPED" if updated_code != source_code else "UNCHANGED",\n            "path": file_path,\n        }\n\n    async def execute_unified_audit(self) -> str:\n''',
              "auditor success result",
          )
          source = replace_once(
              source,
              '''        for file in file_map:\n            await self._scan_and_stamp_file(file, q_root)\n            print(f"[+] Master Key Calibrated & Stamped: {file}")\n''',
              '''        audited_count = 0\n        skipped_count = 0\n        for file in file_map:\n            result = await self._scan_and_stamp_file(file, q_root)\n            if result.get("ok"):\n                audited_count += 1\n                print(f"[+] Master Key Calibrated & Stamped: {file}")\n            else:\n                skipped_count += 1\n''',
              "auditor loop",
          )
          source = replace_once(
              source,
              '''        report = (\n            "SYSTEM AUDIT COMPLETE.\\nAll modules stamped with updated ST3GG Master Keys.\\n\\n"\n            "CRITICAL FRICTION POINTS DETECTED:\\n" + "\\n".join(friction_points[:10]) +\n            optimization_feedback +\n            metabolic_feedback\n        )\n''',
              '''        integrity_summary = (\n            f"\\n\\nSOURCE INTEGRITY: {audited_count} audited, {skipped_count} skipped."\n        )\n        if self.source_integrity_failures:\n            integrity_summary += "\\n" + "\\n".join(\n                (\n                    f"- {item['path']}: {item['code']} at byte "\n                    f"{item['byte_offset']} ({item['offending_bytes_hex'] or 'no bytes'})"\n                )\n                for item in self.source_integrity_failures\n            )\n        report = (\n            "SYSTEM AUDIT COMPLETE.\\n"\n            f"{audited_count} modules audited; {skipped_count} modules skipped.\\n\\n"\n            "CRITICAL FRICTION POINTS DETECTED:\\n" + "\\n".join(friction_points[:10]) +\n            integrity_summary +\n            optimization_feedback +\n            metabolic_feedback\n        )\n''',
              "auditor report",
          )
          node.write_text(source, encoding="utf-8")

          registry = Path("aura_review_lessons_registry.py")
          source = registry.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''    if set(value) != _TOP_LEVEL_FIELDS:\n        missing = _TOP_LEVEL_FIELDS - set(value)\n        unexpected = set(value) - _TOP_LEVEL_FIELDS\n        raise ReviewLessonError(\n            f"review lesson registry keys mismatch: missing={sorted(missing)} "\n            f"unexpected={sorted(unexpected)}"\n        )\n''',
              '''    supplied_fields = set(value)\n    missing = _TOP_LEVEL_FIELDS - supplied_fields\n    unexpected = supplied_fields - _TOP_LEVEL_FIELDS\n    structural_missing = missing - {"registry_digest"}\n    if structural_missing or unexpected:\n        raise ReviewLessonError(\n            f"review lesson registry keys mismatch: missing={sorted(missing)} "\n            f"unexpected={sorted(unexpected)}"\n        )\n''',
              "registry field ordering",
          )
          source = replace_once(
              source,
              '''    for field in ("repository_head", "merge_commit", "registry_digest"):\n        if not isinstance(value.get(field), str) or not _SHA_RE.fullmatch(value[field]):\n            raise ReviewLessonError(f"{field} must be a lowercase 40-character SHA")\n''',
              '''    for field in ("repository_head", "merge_commit"):\n        if not isinstance(value.get(field), str) or not _SHA_RE.fullmatch(value[field]):\n            raise ReviewLessonError(f"{field} must be a lowercase 40-character SHA")\n''',
              "registry SHA validation",
          )
          source = replace_once(
              source,
              '''    supplied_digest = result.pop("registry_digest")\n    canonical_digest = _digest(result, size=20)\n    if supplied_digest != canonical_digest:\n''',
              '''    supplied_digest = result.pop("registry_digest", None)\n    if not isinstance(supplied_digest, str) or not _SHA_RE.fullmatch(supplied_digest):\n        raise ReviewLessonError("registry_digest must be a lowercase 40-character SHA")\n    canonical_digest = _digest(result, size=20)\n    if supplied_digest != canonical_digest:\n''',
              "registry digest validation",
          )
          registry.write_text(source, encoding="utf-8")
          PY

      - name: Install focused verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip --quiet
          python -m pip install pytest jsonschema ruff --quiet

      - name: Prove source integrity and review learning
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          python -m py_compile \
            aura_node.py \
            aura_source_integrity.py \
            aura_review_lessons_replay.py \
            aura_review_lessons_registry.py \
            tests/test_aura_source_integrity.py
          ruff check --select E9,F63,F7,F82 \
            aura_node.py \
            aura_source_integrity.py \
            aura_review_lessons_replay.py \
            aura_review_lessons_registry.py \
            tests/test_aura_source_integrity.py
          python -m pytest -q --tb=short \
            tests/test_aura_source_integrity.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py \
            tests/test_aura_review_learning_mcp_codex.py
          python - <<'PY'
          from aura_source_integrity import scan_utf8_source_tree
          packet = scan_utf8_source_tree(".")
          assert packet["status"] == "PASSED", packet["failures"]
          assert packet["production_mutation"] is False
          PY

      - name: Commit exact repair when needed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cd repo
          git add aura_node.py aura_review_lessons_registry.py
          if git diff --cached --quiet; then
            echo "P0 repair already applied"
            exit 0
          fi
          git config user.name "Aura P0 Repair Harness"
          git config user.email "aura-p0@users.noreply.github.com"
          git commit -m "fix: harden startup audit against corrupt source bytes"
          git push origin "HEAD:${HEAD_REF}"
