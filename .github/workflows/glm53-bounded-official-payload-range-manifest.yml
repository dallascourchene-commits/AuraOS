name: GLM53 Bounded Official Payload Range Manifest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  q10-bounded-payload-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Q10 head with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact PR649 x PR641 convergence and hosted parents
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          convergence = "9534f4782164cd4c29e545b4ce42e8020ef298ba"
          pr649 = "aa004558af8c46bb9bedeedad3cbd2e4e212ab17"
          pr641 = "a8d4605a36e04d64cf03f43f457be4bde553e602"
          parents = subprocess.check_output(
              ["git", "rev-list", "--parents", "-n", "1", convergence], text=True
          ).strip().split()
          assert parents == [convergence, pr649, pr641], parents

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          for run_id, head in ((33373165058, pr649), (33370700852, pr641)):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run["status"] == "completed", (run_id, run["status"])
              assert run["conclusion"] == "success", (run_id, run["conclusion"])
              assert run["head_sha"] == head, (run_id, run["head_sha"], head)
          print("Q10_EXACT_PARENT_RUNS_GREEN=true")
          PY

      - name: Prove exact concrete-page owner blobs
        shell: bash
        run: |
          set -euo pipefail
          PR641=a8d4605a36e04d64cf03f43f457be4bde553e602
          PR628=b8fd399ee0ca6b45a4ec7db58750e6d4105ae3ae
          BIND=tools/quantization/aura_glm53_e8_concrete_page_trial_binding.py
          PAGE=tools/quantization/aura_glm53_e8_indexed_expert_page_reference.py
          test "$(git rev-parse "$PR641:$BIND")" = "157afcb2e457c630d03a8c72aef09f0a6ba04a4d"
          test "$(git rev-parse "$PR628:$PAGE")" = "5df2cd69a1519b2626cb52c1d8f23a25504425d9"
          echo "Q10_EXACT_CONCRETE_PAGE_OWNER_BLOBS=true"

      - name: Compile and run Q10 adversarial contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/quantization/aura_glm53_historical_official_w2_bridge.py \
            tools/quantization/aura_glm53_live_tensor_concrete_page_producer_admission.py \
            tools/quantization/aura_glm53_bounded_official_payload_range_manifest.py \
            tests/test_aura_glm53_bounded_official_payload_range_manifest.py
          python3 -m unittest -v \
            tests.test_aura_glm53_live_tensor_concrete_page_producer_admission \
            tests.test_aura_glm53_bounded_official_payload_range_manifest
          PYTHONPATH=. python3 -m tools.quantization.aura_glm53_bounded_official_payload_range_manifest | tee /tmp/q10.json

      - name: Assert minimum byte cone and nonpromotion ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          r = json.load(open('/tmp/q10.json', encoding='utf-8'))
          assert r['disposition'] == 'PLAN_READY_LIVE_EFFECT_NOT_EXECUTED'
          assert r['slice_count'] == 6
          assert r['total_payload_bytes'] == 37757952
          assert r['target_roles'] == ['gate_up_proj', 'down_proj']
          assert r['historical_relative_offsets_bound'] is True
          assert r['absolute_ranges_require_current_header_length'] is True
          assert r['current_header_revalidation_required'] is True
          assert r['payload_fetch_plan_complete_for_representative_expert'] is True
          assert r['target_role_names_bound'] is True
          assert r['source_to_target_layout_relation_bound'] is False
          assert r['block_fp8_dequantization_semantics_bound'] is False
          assert r['live_payload_observation_executed'] is False
          assert r['live_payload_digests_bound'] is False
          assert r['exact_live_official_tensor_to_concrete_source_tensor_set_relation'] is False
          assert r['candidate_page_materialization_owner_bound'] is False
          assert r['baseline_same_live_official_source_tensor_set_proven'] is False
          assert r['representative_scope_only'] is True
          assert r['all_layers_experts_uniformity_proven'] is False
          assert r['absolute_range_formula'] == '[8+CURRENT_HEADER_LEN+BEGIN,8+CURRENT_HEADER_LEN+END)'
          assert len(r['slices']) == 6
          assert sum(s['expected_bytes'] for s in r['slices']) == 37757952
          for key in (
              'real_tensor_quantization_eligible',
              'model_execution_eligible',
              'generalized_quality_proven',
              'runtime_performance_proven',
              'semantic_k27_authority',
              'native_private_transformer_kv_accessed',
              'gate10_promoted',
              'deployment_authorized',
          ):
              assert r[key] is False, key
          print('Q10_BOUNDED_RANGE_PLAN_FAIL_CLOSED=true')
          PY
