# Precommit-only verification. Source repair is intentionally not committed here.
name: WO Fleet Phase3 Triad2 Verification

on:
  push:
    branches:
      - fix/wo-fleet-phase3-triad2-001
    paths:
      - '.github/workflows/wo-fleet-phase3-triad2-verify.yml'
      - 'conftest.py'
      - 'tools/wo_fleet_phase3_triad2_contract_patch.py'
      - 'tools/wo_fleet_phase3_triad2_incremental_patch.py'
      - 'tools/wo_fleet_phase3_triad2_skillweaver_patch.py'
      - 'tools/wo_fleet_phase3_triad2_pascal_test_patch.py'
      - 'tools/wc02_phase4_readme_patch.py'
      - 'tools/wc02_standalone_smoke_patch.py'
      - 'tests/test_wc02_arch_contract_regressions.py'

permissions:
  contents: read

concurrency:
  group: wo-fleet-phase3-triad2-001
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  verify-precommit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python 3.12 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8.2,<9.0' 'pytest-asyncio>=0.23,<1.0' 'jsonschema>=4.23,<5.0' 'trimesh>=4.7.1,<5.0' 'zstandard>=0.23.0,<1.0'

      - name: Apply Phase3 and WC-02 repairs without committing
        run: |
          python tools/wo_fleet_phase3_triad2_contract_patch.py
          python tools/wo_fleet_phase3_triad2_incremental_patch.py
          python tools/wo_fleet_phase3_triad2_skillweaver_patch.py
          python tools/wo_fleet_phase3_triad2_pascal_test_patch.py
          python tools/wc02_phase4_readme_patch.py
          python tools/wc02_standalone_smoke_patch.py

      - name: Compile repaired contract surfaces
        run: |
          python -m py_compile \
            aura_coding_relationship_compass.py aura_emergent_potential_repl.py \
            aura_codebase_navigator.py aura_codemap_verify.py aura_architect_loop.py \
            aura_fusion.py aura_skillweaver.py \
            test_aura_functions.py test_synthesis_upgrades.py test_syntax_fixes.py \
            conftest.py tests/test_aura_construction_pascal_spatial_foundry_pr5.py \
            tests/test_wc02_arch_contract_regressions.py

      - name: Regenerate canonical deep CODEMAP topology
        run: |
          python aura_codebase_navigator.py --refresh-topology
          python -m aura_codemap_verify | tee triad2-codemap-verify.txt

      - name: Python 3.12 focused contract suite
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_wc02_arch_contract_regressions.py \
            tests/test_aura_construction_refactor_completion.py::test_repository_completion_audit_is_ready_after_final_wiring \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            test_aura_fusion.py::test_infer_fusion_target_from_bang_command_prefers_implementation \
            test_aura_fusion.py::test_mock_fusion_run_infers_command_target_before_mutation_gate \
            test_aura_fusion.py::test_codemap_refresh_skips_artifact_write_when_payload_unchanged \
            test_aura_skillweaver.py::TestSkillRegistry::test_registry_has_commands \
            test_codemap_slimming.py::test_iter_repo_files_skips_runtime_dependency_dirs \
            --junitxml=triad2-focused-py312.xml 2>&1 | tee triad2-focused-py312.txt

      - name: Python 3.12 standalone smoke entrypoints
        run: |
          set -o pipefail
          python -u test_syntax_fixes.py 2>&1 | tee triad2-smoke-syntax-py312.txt
          python -u test_synthesis_upgrades.py 2>&1 | tee triad2-smoke-synthesis-py312.txt
          python -u test_aura_functions.py 2>&1 | tee triad2-smoke-functions-py312.txt

      - name: Python 3.12 full pytest suite
        run: |
          set -o pipefail
          python -m pytest -q --maxfail=1 --junitxml=triad2-full-py312.xml 2>&1 | tee triad2-full-py312.txt

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python 3.10 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8.2,<9.0' 'pytest-asyncio>=0.23,<1.0' 'jsonschema>=4.23,<5.0' 'trimesh>=4.7.1,<5.0' 'zstandard>=0.23.0,<1.0'

      - name: Python 3.10 focused contract suite
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            tests/test_aura_arch_v2_3_capsule_validator.py \
            tests/test_wc02_arch_contract_regressions.py \
            tests/test_aura_construction_refactor_completion.py::test_repository_completion_audit_is_ready_after_final_wiring \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_denies_intent_fidelity_when_any_obligation_category_unprojected \
            tests/test_aura_bilateral_planning_enforcement.py::test_compass_fully_projected_obligations_preserve_eligible_path \
            tests/test_aura_construction_pascal_spatial_foundry_pr5.py::test_pr5_coordinate_receipt_mismatched_artifact_digest_fails_closed \
            test_aura_fusion.py::test_infer_fusion_target_from_bang_command_prefers_implementation \
            test_aura_fusion.py::test_mock_fusion_run_infers_command_target_before_mutation_gate \
            test_aura_fusion.py::test_codemap_refresh_skips_artifact_write_when_payload_unchanged \
            test_aura_skillweaver.py::TestSkillRegistry::test_registry_has_commands \
            test_codemap_slimming.py::test_iter_repo_files_skips_runtime_dependency_dirs \
            --junitxml=triad2-focused-py310.xml 2>&1 | tee triad2-focused-py310.txt

      - name: Python 3.10 standalone smoke entrypoints
        run: |
          set -o pipefail
          python -u test_syntax_fixes.py 2>&1 | tee triad2-smoke-syntax-py310.txt
          python -u test_synthesis_upgrades.py 2>&1 | tee triad2-smoke-synthesis-py310.txt
          python -u test_aura_functions.py 2>&1 | tee triad2-smoke-functions-py310.txt

      - name: Python 3.10 full pytest suite
        run: |
          set -o pipefail
          python -m pytest -q --maxfail=1 --junitxml=triad2-full-py310.xml 2>&1 | tee triad2-full-py310.txt

      - name: Package exact repaired tree for independent local gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > triad2-working-tree-status.txt
          git diff --binary > triad2-repair.diff
          archive="${RUNNER_TEMP}/triad2-patched-tree.tgz"
          tar --exclude=.git -czf "${archive}" .
          sha256sum "${archive}" > triad2-patched-tree.sha256

      - name: Upload verification diagnostics and exact local-gate tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo-fleet-phase3-triad2-${{ github.run_id }}
          path: |
            triad2-codemap-verify.txt
            triad2-focused-py312.txt
            triad2-focused-py312.xml
            triad2-smoke-syntax-py312.txt
            triad2-smoke-synthesis-py312.txt
            triad2-smoke-functions-py312.txt
            triad2-full-py312.txt
            triad2-full-py312.xml
            triad2-focused-py310.txt
            triad2-focused-py310.xml
            triad2-smoke-syntax-py310.txt
            triad2-smoke-synthesis-py310.txt
            triad2-smoke-functions-py310.txt
            triad2-full-py310.txt
            triad2-full-py310.xml
            triad2-working-tree-status.txt
            triad2-repair.diff
            triad2-patched-tree.sha256
            ${{ runner.temp }}/triad2-patched-tree.tgz
          if-no-files-found: warn
          retention-days: 30
