name: WO Phase4 Active Branch CODEMAP Verify

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wo-phase4-active-branch-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: 'w7/paper-x-final-license-normalization', sha: '3e0f6387bf12f76f72da3176a775d1b60ca6ba2e' }
          - { branch: 'feat/multimodal-c2-work-order-locator', sha: 'dd1e4f0113280d874f894b0cdd113889cb5e61e0' }
          - { branch: 'wo-wb-037-qdkt-crystal-hardening', sha: '920f033986e5c2cef79b24703e630b77de1b3bc9' }
          - { branch: 'j05/custodian-drive-event-adapter', sha: 'd030e87aee1d30072d61835f96ec8e2aed534bfb' }
          - { branch: 'docs/benchmark-evidence-map-2026-08-08', sha: 'aa20ec5245e6297cba37b8256ee1fdf66d8cb652' }
          - { branch: 'materialize/verified-ephemeral-workspace-pr2', sha: '6fa76e753df109de3e8e19ee88314f2919447bfd' }
          - { branch: 'fix/standalone-construction-pascal-demo', sha: '8aba009efaf5a85a5ffcdb764021a1c20fc633a2' }
          - { branch: 'docs/construction-pascal-demo-operations', sha: '8f9f59946eee83f22e387b57795e44ece77ec7b1' }
          - { branch: 'refactor/thermal-codemap-materialize', sha: '88269b1cfae0043aa50846aae63d85d4d7fa81fd' }
          - { branch: 'refactor/thermal-kelvin-auto-detection-sync', sha: 'b0d02c975e3ab69095c972000c8657420336fc75' }
          - { branch: 'bilateral-intent-final-b11-b15', sha: '21a75b17d31bccf09bfc82afb91ba0f0c3297fed' }
          - { branch: 'ci/wo-triad2-ci-codemap-repair-001', sha: 'bb9c2538910c760c79789b3cafa2a7404e789a2e' }
          - { branch: 'repair/wo-fleet-phase3-triad2-001', sha: '5e78aa3a176b1bf1564125cec14ef1be8f2f4517' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 1
      - name: Assert exact audited head
        run: test "$(git rev-parse HEAD)" = "${{ matrix.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synchronized CODEMAP and historical UMC boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m aura_codemap_verify > /tmp/codemap-verify.json
          python - <<'PY'
          from pathlib import Path
          import json
          cm=json.loads(Path('.aura/CODEMAP.json').read_text(encoding='utf-8'))
          summary=cm.get('summary',{})
          assert cm.get('status') == 'AURA_CODEMAP_ACTIVE'
          assert int(summary.get('file_count',0)) > 0
          assert int(summary.get('topology_nodes',0)) > 0
          assert int(summary.get('topology_edges',0)) > 0
          assert isinstance(cm.get('files'), list) and len(cm['files']) > 0
          umc=Path('.github/workflows/unified-memory-continuity-deep-v2-target.yml')
          if umc.exists():
              text=umc.read_text(encoding='utf-8')
              assert 'workflow_dispatch:' in text
              assert 'pull_request_target:' not in text
          print(json.dumps({
              'file_count': summary.get('file_count'),
              'topology_nodes': summary.get('topology_nodes'),
              'topology_edges': summary.get('topology_edges'),
              'umc_historical_manual': umc.exists(),
          }, sort_keys=True))
          PY
      - name: Record branch proof
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/phase4-branch-proof
          {
            echo "branch=${{ matrix.branch }}"
            echo "sha=${{ matrix.sha }}"
            echo "head=$(git rev-parse HEAD)"
            echo "codemap_json_blob=$(git hash-object .aura/CODEMAP.json)"
            echo "codemap_md_blob=$(git hash-object .aura/CODEMAP.md)"
            echo "topology_map_blob=$(git hash-object topology_map.json)"
            if [ -f .github/workflows/unified-memory-continuity-deep-v2-target.yml ]; then
              echo "umc_blob=$(git hash-object .github/workflows/unified-memory-continuity-deep-v2-target.yml)"
            fi
          } > /tmp/phase4-branch-proof/proof.txt
          cp /tmp/codemap-verify.json /tmp/phase4-branch-proof/verify.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-codemap-verify-${{ strategy.job-index }}
          path: /tmp/phase4-branch-proof/
          if-no-files-found: warn
          retention-days: 14
