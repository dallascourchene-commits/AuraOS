name: Finalize Governed Routing Once

on:
  pull_request:
    paths:
      - ".github/workflows/finalize-governed-routing-once.yml"
      - "tools/one_time_finalize_governed_routing.py"
      - "aura_shadow_model_router.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Clone exact integration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --branch refactor/model-cognome-governed-routing \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Patch, validate, regenerate, and push clean branch
        run: |
          python - <<'PY'
          from pathlib import Path

          records = Path("aura_model_cognome_store_records.py")
          text = records.read_text(encoding="utf-8")
          if "import math\n" not in text:
              text = text.replace("import json\n", "import json\nimport math\n", 1)
              records.write_text(text, encoding="utf-8")

          ledger = Path("aura_empirical_cost_ledger.py")
          ledger_text = ledger.read_text(encoding="utf-8")
          ledger_text = ledger_text.replace(
              'r"sk-[a-zA-Z0-9_-]+|gh[opusr]_[a-zA-Z0-9]+|Bearer\\s+[a-zA-Z0-9._~+/-]+=*|api[_-]?key|secret|password",',
              'r"sk-[a-zA-Z0-9_-]+|gh[opusr]_[a-zA-Z0-9]+|Bearer\\s+[a-zA-Z0-9._~+/-]+=*",',
          )
          ledger_text = ledger_text.replace(
              'clean.setdefault("comparison_id", "")',
              'clean["comparison_id"] = str(clean.get("comparison_id") or "")',
          )
          ledger.write_text(ledger_text, encoding="utf-8")

          finalizer = Path("tools/one_time_finalize_governed_routing.py")
          script = finalizer.read_text(encoding="utf-8")
          script = script.replace(
              'copy = ROOT / ".aura/CODEMAP.finalizer-first.json"',
              'copy = Path("/tmp/CODEMAP.finalizer-first.json")',
          )
          finalizer.write_text(script, encoding="utf-8")
          PY
          rm -rf finalizer-report
          set +e
          python tools/one_time_finalize_governed_routing.py \
            > /tmp/governed-routing-finalizer.log 2>&1
          code=$?
          set -e
          mkdir -p finalizer-report
          cp /tmp/governed-routing-finalizer.log finalizer-report/output.log
          printf '%s\n' "$code" > finalizer-report/exit_code
          tail -n 250 /tmp/governed-routing-finalizer.log || true
          exit "$code"
      - name: Upload finalizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-routing-finalizer-${{ github.run_id }}
          path: finalizer-report/
          if-no-files-found: error
          retention-days: 3
