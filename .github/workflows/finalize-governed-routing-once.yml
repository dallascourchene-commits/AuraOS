name: Finalize Governed Routing Once

on:
  pull_request:
    paths:
      - ".github/workflows/finalize-governed-routing-once.yml"
      - "tools/one_time_finalize_governed_routing.py"
      - "aura_shadow_model_router.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Clone exact integration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --branch refactor/model-cognome-governed-routing \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Patch, validate, regenerate, and push clean branch
        run: |
          mkdir -p finalizer-report
          set +e
          python tools/one_time_finalize_governed_routing.py \
            > finalizer-report/output.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > finalizer-report/exit_code
          tail -n 250 finalizer-report/output.log || true
          exit "$code"
      - name: Upload finalizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-routing-finalizer-${{ github.run_id }}
          path: finalizer-report/
          if-no-files-found: error
          retention-days: 3
