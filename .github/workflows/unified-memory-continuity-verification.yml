name: Verify unified memory continuity refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: unified-memory-continuity-verification-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.head_ref == 'refactor/unified-memory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      EVIDENCE_DIR: .aura/unified_memory_continuity_evidence
    steps:
      - name: Fetch exact pull-request head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          printf '%s\n' '.aura/unified_memory_continuity_evidence/' >> .git/info/exclude

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Record exact repository identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR/logs"
          {
            echo "target_sha=$TARGET_SHA"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "codemap_md=$(sha256sum .aura/CODEMAP.md | awk '{print $1}')"
            echo "codemap_json=$(sha256sum .aura/CODEMAP.json | awk '{print $1}')"
            echo "module=$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')"
            echo "tests=$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')"
            echo "status_begin"
            git status --porcelain=v1
            echo "status_end"
          } | tee "$EVIDENCE_DIR/repository_identity.txt"
          test -z "$(git status --porcelain=v1)"

      - name: Install AuraOS and verification tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip \
            > "$EVIDENCE_DIR/logs/pip_upgrade.log" 2>&1
          python -m pip install -r requirements.txt 'pytest>=8,<9' ruff bandit \
            > "$EVIDENCE_DIR/logs/install.log" 2>&1

      - name: Prepare and diagnose Aura Architecture Harness
        shell: bash
        run: |
          set -o pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            prepare \
            --venv ../.AuraOS-unified-memory-continuity-venv \
            --install-requirements \
            2>&1 | tee "$EVIDENCE_DIR/logs/harness_prepare.log"
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            doctor \
            --venv ../.AuraOS-unified-memory-continuity-venv \
            2>&1 | tee "$EVIDENCE_DIR/logs/harness_doctor.log"
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            handoff \
            --output-dir "$EVIDENCE_DIR/handoff" \
            2>&1 | tee "$EVIDENCE_DIR/logs/harness_handoff.log"

      - name: Run Aura-native architecture discovery on exact head
        shell: bash
        run: |
          set -o pipefail
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            run \
            --venv ../.AuraOS-unified-memory-continuity-venv \
            --objective "Verify the exact unified manufactured-memory and continuity integration: minimum-sufficient active memory, model-relative execution, immutable P0, independently observed P1, prediction-error sensitivity, current reproof, and human-governed Relationship Experience/QDKT admission without duplicate truth, memory, routing, verification, policy, publication, or authority owners." \
            --combine-with Connectome "Relational Synthesis" Atlas \
            --atlas-profile MINIMAL \
            --output-dir "$EVIDENCE_DIR/architecture-run" \
            2>&1 | tee "$EVIDENCE_DIR/logs/harness_run.log"

      - name: Run Aura navigation, topology, capability, and persistence checks
        shell: bash
        run: |
          set -o pipefail
          python aura_codebase_navigator.py \
            2>&1 | tee "$EVIDENCE_DIR/logs/navigator.log"
          python aura_codebase_navigator.py \
            --query "unified manufactured memory saturation model-relative execution prediction-error learning continuity sensitivity current reproof" \
            2>&1 | tee "$EVIDENCE_DIR/logs/navigator_query.log"
          python -m aura_agent_arena_cli topology-health \
            2>&1 | tee "$EVIDENCE_DIR/logs/topology_health.log"
          python -m aura_agent_arena_cli stabilization-status \
            2>&1 | tee "$EVIDENCE_DIR/logs/stabilization_status.log"
          python -m aura_agent_arena_cli digest \
            2>&1 | tee "$EVIDENCE_DIR/logs/agent_arena_digest.log"
          python -m aura_agent_arena_cli resolve-capabilities \
            --objective "compile minimum-sufficient model-relative Act Capsules and learn only from independently verified prediction error after current reproof" \
            2>&1 | tee "$EVIDENCE_DIR/logs/capability_resolution.log"
          python -m aura_persistence_cli --repo-root . verify-registry \
            2>&1 | tee "$EVIDENCE_DIR/logs/persistence_registry.log"

      - name: Run focused and owner regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_relationship_compass_finalization.py \
            --junitxml="$EVIDENCE_DIR/focused-regressions.xml" \
            2>&1 | tee "$EVIDENCE_DIR/logs/focused_regressions.log"

      - name: Run focused static and security gates
        shell: bash
        run: |
          set -o pipefail
          ruff check --select E9,F63,F7,F82 \
            aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity.py \
            2>&1 | tee "$EVIDENCE_DIR/logs/ruff.log"
          bandit -q -ll aura_unified_memory_continuity.py \
            2>&1 | tee "$EVIDENCE_DIR/logs/bandit.log"

      - name: Run post-mutation Coding Waboose
        shell: bash
        run: |
          set -o pipefail
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file "$EVIDENCE_DIR/waboose_state.json" \
            run \
            --request .aura/waboose_requests/unified_memory_continuity.v1.json \
            2>&1 | tee "$EVIDENCE_DIR/waboose_result.json"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.aura/unified_memory_continuity_evidence/waboose_result.json').read_text(encoding='utf-8'))
          assert payload.get('ok') is True, payload
          Path('.aura/unified_memory_continuity_evidence/waboose_summary.json').write_text(
              json.dumps({
                  'ok': payload.get('ok'),
                  'review_id': payload.get('review_id'),
                  'status': payload.get('status'),
                  'disposition': payload.get('disposition'),
                  'finding_count': len(payload.get('findings') or []),
                  'human_review_required': payload.get('human_review_required'),
                  'production_mutation': payload.get('production_mutation'),
                  'automatic_fix': payload.get('automatic_fix'),
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Prove verification did not mutate repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain=v1 \
            | tee "$EVIDENCE_DIR/final_status.txt"
          test ! -s "$EVIDENCE_DIR/final_status.txt"

      - name: Upload exact-head verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-verification-${{ github.event.pull_request.head.sha }}
          path: .aura/unified_memory_continuity_evidence
          if-no-files-found: warn
          retention-days: 30
