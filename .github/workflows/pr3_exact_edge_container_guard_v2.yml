name: PR3 exact edge container guard v2
on:
  push:
    branches: [analysis/pr3-exact-edge-container-fix-v2]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-first-project-context-pr3
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            aura_project_context_compiler.py
            aura_ephemeral_workspace_contracts.py
            aura_ephemeral_path_policy.py
            tests/test_aura_project_context_compiler.py
            tests/test_aura_project_context_acceptance.py
            schemas/aura_projection_selection_receipt_v1.schema.json
            docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
      - name: Require exact head
        run: test "$(git rev-parse HEAD)" = "5f8794560ace6d31f44e06f75e8a5b4999f569e4"
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aura_project_context_compiler.py'); s=p.read_text()
          old='''    if isinstance(edges, (str, bytes, bytearray)) or not isinstance(edges, Sequence):\n        raise TypeError("edges must be a sequence")\n'''
          new='''    if type(edges) not in (tuple, list):\n        raise TypeError("edges must be an exact built-in tuple or list")\n'''
          if s.count(old)!=1: raise SystemExit('source anchor mismatch')
          p.write_text(s.replace(old,new,1).rstrip()+'\n')
          t=Path('tests/test_aura_project_context_compiler.py'); x=t.read_text().rstrip()
          block='''\n\ndef test_edge_input_rejects_hostile_sequence_before_any_protocol_call() -> None:\n    source = _candidate("source:target", CandidateCategory.SOURCE, D["2"], answer_determining=True)\n    class HostileSequence:\n        def __len__(self): raise AssertionError("hostile __len__ must not run")\n        def __iter__(self): raise AssertionError("hostile __iter__ must not run")\n    with pytest.raises(TypeError, match="exact built-in tuple or list"):\n        compile_project_context_projection(\n            "Fix the exact behavior without losing proof context.", project_ref="project:auraos-pr3",\n            repository_identity=_repo(), candidates=(source,), edges=HostileSequence(),\n            budget=ProjectionBudget(max_nodes=64, max_edges=256), freshness_timestamp_ms=1_786_180_000_000,\n        )\n'''
          if 'test_edge_input_rejects_hostile_sequence_before_any_protocol_call' in x: raise SystemExit('test exists')
          t.write_text(x+block+'\n')
          d=Path('docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md'); y=d.read_text()
          oldd='Candidate input edges must be a runtime `Sequence`; the compiler validates the sequence type and declared length before materialization or item traversal.'
          newd='Candidate input edges must be an exact built-in `tuple` or `list`; arbitrary custom `Sequence` implementations are rejected before calling their length, indexing, or iteration protocols.'
          if y.count(oldd)!=1: raise SystemExit('doc anchor mismatch')
          d.write_text(y.replace(oldd,newd,1).rstrip()+'\n')
          PY
      - run: python -m pip install --quiet pytest jsonschema ruff
      - name: Compile and Ruff
        run: |
          python -m py_compile aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
          python -m ruff check --select E9,F63,F7,F82 aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py
      - name: Focused tests
        shell: bash
        run: |
          set +e
          output="$(python -m pytest -q tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            safe="${output//$'\n'/%0A}"
            echo "::error title=PR3 exact edge-container test failure::$safe"
            exit "$status"
          fi
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aura PR3 Guarded Repair"
          git config user.email "actions@users.noreply.github.com"
          git add aura_project_context_compiler.py tests/test_aura_project_context_compiler.py docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
          git commit -m "PR3: require exact finite edge containers"
          git fetch --depth=1 origin refactor/source-first-project-context-pr3
          test "$(git rev-parse FETCH_HEAD)" = "5f8794560ace6d31f44e06f75e8a5b4999f569e4"
          git push origin HEAD:refactor/source-first-project-context-pr3
