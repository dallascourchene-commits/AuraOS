name: Repair Construction finalization publisher

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-publish-fix.yml"

permissions:
  contents: write

jobs:
  repair-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Add missing pytest dependency and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/aura-construction-g7-g8-publish.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'python -m pip install jsonschema ruff',
              'python -m pip install jsonschema pytest ruff',
              1,
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/aura-construction-g7-g8-publish-fix.yml').unlink()
          PY
      - name: Publish publisher repair
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "AuraOS Finalization Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ci(g8): install pytest in finalization publisher"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"$TARGET_BRANCH"
