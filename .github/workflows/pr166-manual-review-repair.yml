name: PR166 manual review repair

on:
  push:
    branches:
      - feature/aura-spatial-s3a-render-session
    paths:
      - .github/workflows/pr166-manual-review-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair commit
        uses: actions/checkout@v4
        with:
          ref: feature/aura-spatial-s3a-render-session
          fetch-depth: 0

      - name: Assert reviewed parent head
        run: test "$(git rev-parse HEAD^)" = "c3a3f0f70d2d8c96cd686d46e96c715f6d25805e"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact manual repairs and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "aura_source_integrity.py",
              '''    def to_dict(self) -> dict[str, Any]:
                  return asdict(self)


          class SourceIntegrityError(ValueError):
          ''',
              '''    def to_dict(self) -> dict[str, Any]:
                  return asdict(self)


          @dataclass(frozen=True)
          class SourceFileIdentity:
              """Identity and content metadata for the exact descriptor that was read."""

              device: int
              inode: int
              size: int
              mtime_ns: int
              mtime: float

              @classmethod
              def from_stat(cls, metadata: os.stat_result) -> "SourceFileIdentity":
                  return cls(
                      device=int(metadata.st_dev),
                      inode=int(metadata.st_ino),
                      size=int(metadata.st_size),
                      mtime_ns=int(metadata.st_mtime_ns),
                      mtime=float(metadata.st_mtime),
                  )

              def matches(self, metadata: os.stat_result) -> bool:
                  other = type(self).from_stat(metadata)
                  return (
                      self.device,
                      self.inode,
                      self.size,
                      self.mtime_ns,
                  ) == (
                      other.device,
                      other.inode,
                      other.size,
                      other.mtime_ns,
                  )


          class SourceIntegrityError(ValueError):
          ''',
          )

          replace_once(
              "aura_source_integrity.py",
              ''') -> tuple[bytes, int]:
              """Read at most ``maximum_bytes + 1`` bytes without following symlinks."""
          ''',
              ''') -> tuple[bytes, int, SourceFileIdentity]:
              """Read bounded bytes and return identity from the exact opened descriptor."""
          ''',
          )

          replace_once(
              "aura_source_integrity.py",
              '''            data = handle.read(maximum_bytes + 1)
                      after = os.fstat(handle.fileno())
              except SourceIntegrityError:
          ''',
              '''            data = handle.read(maximum_bytes + 1)
                      after = os.fstat(handle.fileno())
                      opened_identity = SourceFileIdentity.from_stat(opened)
                      after_identity = SourceFileIdentity.from_stat(after)
                      if opened_identity != after_identity:
                          raise _failure(
                              candidate,
                              code="SOURCE_CONTENT_CHANGED",
                              message=f"source changed while being read: {candidate}",
                              byte_offset=0,
                              offending=b"",
                              file_size=after.st_size,
                          )
              except SourceIntegrityError:
          ''',
          )

          replace_once(
              "aura_source_integrity.py",
              '''    return data, file_size


          def _decode_source_bytes''',
              '''    return data, file_size, after_identity


          def _decode_source_bytes''',
          )

          replace_once(
              "aura_source_integrity.py",
              '''def read_utf8_source(
              path: str | Path,
              *,
              maximum_bytes: int = MAX_SOURCE_FILE_BYTES,
          ) -> str:
              """Read one bounded regular source file as strict UTF-8."""

              candidate = Path(path)
              data, file_size = _read_bounded_source_bytes(
                  candidate,
                  maximum_bytes=maximum_bytes,
              )
              return _decode_source_bytes(candidate, data, file_size=file_size)


          def _digest_record''',
              '''def read_utf8_source_with_identity(
              path: str | Path,
              *,
              maximum_bytes: int = MAX_SOURCE_FILE_BYTES,
          ) -> tuple[str, SourceFileIdentity]:
              """Read strict UTF-8 and bind it to the exact opened file identity."""

              candidate = Path(path)
              data, file_size, identity = _read_bounded_source_bytes(
                  candidate,
                  maximum_bytes=maximum_bytes,
              )
              return _decode_source_bytes(candidate, data, file_size=file_size), identity


          def read_utf8_source(
              path: str | Path,
              *,
              maximum_bytes: int = MAX_SOURCE_FILE_BYTES,
          ) -> str:
              """Read one bounded regular source file as strict UTF-8."""

              source, _identity = read_utf8_source_with_identity(
                  path,
                  maximum_bytes=maximum_bytes,
              )
              return source


          def write_utf8_source_if_unchanged(
              path: str | Path,
              source: str,
              *,
              expected_source: str,
              expected_identity: SourceFileIdentity,
              maximum_bytes: int = MAX_SOURCE_FILE_BYTES,
          ) -> SourceFileIdentity:
              """Write through a no-follow descriptor only if identity and bytes still match."""

              candidate = Path(path)
              maximum_bytes = _validate_limit(maximum_bytes, name="maximum_bytes")
              expected_bytes = expected_source.encode("utf-8")
              updated_bytes = source.encode("utf-8")
              if len(updated_bytes) > maximum_bytes:
                  raise _failure(
                      candidate,
                      code="SOURCE_FILE_TOO_LARGE",
                      message=f"updated source exceeds {maximum_bytes} bytes: {candidate}",
                      byte_offset=maximum_bytes,
                      offending=b"",
                      file_size=len(updated_bytes),
                  )

              try:
                  before = candidate.lstat()
              except OSError as exc:
                  raise _failure(
                      candidate,
                      code="SOURCE_FILESYSTEM_ERROR",
                      message=f"unable to inspect source before write: {candidate} ({exc})",
                      byte_offset=0,
                      offending=b"",
                      file_size=0,
                  ) from exc
              if stat.S_ISLNK(before.st_mode):
                  raise _failure(
                      candidate,
                      code="SOURCE_SYMLINK_REJECTED",
                      message=f"source symlinks are not allowed: {candidate}",
                      byte_offset=0,
                      offending=b"",
                      file_size=before.st_size,
                  )
              if not stat.S_ISREG(before.st_mode):
                  raise _failure(
                      candidate,
                      code="SOURCE_NOT_REGULAR_FILE",
                      message=f"source path is not a regular file: {candidate}",
                      byte_offset=0,
                      offending=b"",
                      file_size=before.st_size,
                  )
              if not expected_identity.matches(before):
                  raise _failure(
                      candidate,
                      code="SOURCE_PATH_CHANGED",
                      message=f"source identity changed before write: {candidate}",
                      byte_offset=0,
                      offending=b"",
                      file_size=before.st_size,
                  )

              flags = os.O_RDWR
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW

              descriptor: int | None = None
              try:
                  descriptor = os.open(candidate, flags)
                  opened = os.fstat(descriptor)
                  if not stat.S_ISREG(opened.st_mode):
                      raise _failure(
                          candidate,
                          code="SOURCE_NOT_REGULAR_FILE",
                          message=f"opened source is not a regular file: {candidate}",
                          byte_offset=0,
                          offending=b"",
                          file_size=opened.st_size,
                      )
                  if not expected_identity.matches(opened):
                      raise _failure(
                          candidate,
                          code="SOURCE_PATH_CHANGED",
                          message=f"source identity changed while opening for write: {candidate}",
                          byte_offset=0,
                          offending=b"",
                          file_size=opened.st_size,
                      )
                  with os.fdopen(descriptor, "r+b", closefd=True) as handle:
                      descriptor = None
                      current_bytes = handle.read(maximum_bytes + 1)
                      if current_bytes != expected_bytes:
                          raise _failure(
                              candidate,
                              code="SOURCE_CONTENT_CHANGED",
                              message=f"source bytes changed before write: {candidate}",
                              byte_offset=0,
                              offending=b"",
                              file_size=len(current_bytes),
                          )
                      handle.seek(0)
                      handle.truncate(0)
                      handle.write(updated_bytes)
                      handle.flush()
                      os.fsync(handle.fileno())
                      written = os.fstat(handle.fileno())
              except SourceIntegrityError:
                  raise
              except OSError as exc:
                  raise _failure(
                      candidate,
                      code="SOURCE_FILESYSTEM_ERROR",
                      message=f"unable to write source safely: {candidate} ({exc})",
                      byte_offset=0,
                      offending=b"",
                      file_size=expected_identity.size,
                  ) from exc
              finally:
                  if descriptor is not None:
                      os.close(descriptor)

              written_identity = SourceFileIdentity.from_stat(written)
              try:
                  path_after = candidate.lstat()
              except OSError as exc:
                  raise _failure(
                      candidate,
                      code="SOURCE_FILESYSTEM_ERROR",
                      message=f"unable to verify source after write: {candidate} ({exc})",
                      byte_offset=0,
                      offending=b"",
                      file_size=written_identity.size,
                  ) from exc
              if stat.S_ISLNK(path_after.st_mode) or not written_identity.matches(path_after):
                  raise _failure(
                      candidate,
                      code="SOURCE_PATH_CHANGED",
                      message=f"source identity changed during write: {candidate}",
                      byte_offset=0,
                      offending=b"",
                      file_size=path_after.st_size,
                  )
              return written_identity


          def _digest_record''',
          )

          replace_once(
              "aura_source_integrity.py",
              '''                data, file_size = _read_bounded_source_bytes(
                              candidate,
                              maximum_bytes=MAX_SOURCE_FILE_BYTES,
                          )
              ''',
              '''                data, file_size, _identity = _read_bounded_source_bytes(
                              candidate,
                              maximum_bytes=MAX_SOURCE_FILE_BYTES,
                          )
              ''',
          )

          replace_once(
              "aura_source_integrity.py",
              '''    "SourceIntegrityError",
              "SourceIntegrityFailure",
              "read_utf8_source",
              "scan_utf8_source_tree",
          ]
          ''',
              '''    "SourceFileIdentity",
              "SourceIntegrityError",
              "SourceIntegrityFailure",
              "read_utf8_source",
              "read_utf8_source_with_identity",
              "scan_utf8_source_tree",
              "write_utf8_source_if_unchanged",
          ]
          ''',
          )

          replace_once(
              "aura_node.py",
              '''from aura_source_integrity import SourceIntegrityError, read_utf8_source
          ''',
              '''from aura_source_integrity import (
              SourceIntegrityError,
              read_utf8_source_with_identity,
              write_utf8_source_if_unchanged,
          )
          ''',
          )

          replace_once(
              "aura_node.py",
              '''            source_code = read_utf8_source(file_path)
          ''',
              '''            source_code, source_identity = read_utf8_source_with_identity(file_path)
          ''',
          )

          replace_once(
              "aura_node.py",
              '''        stat_metrics = os.stat(file_path)
                  current_mtime = stat_metrics.st_mtime
                  current_size = stat_metrics.st_size
          ''',
              '''        current_mtime = source_identity.mtime
                  current_size = source_identity.size
          ''',
          )

          replace_once(
              "aura_node.py",
              '''        if updated_code != source_code:
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(updated_code)
                      # Capture the absolute post-write timestamp generated by the OS filesystem
                      post_stats = os.stat(file_path)
                      await self.node.memory_palace.update_audit_cache(file_path, post_stats.st_mtime, post_stats.st_size, synopsis)
          ''',
              '''        if updated_code != source_code:
                      post_identity = write_utf8_source_if_unchanged(
                          file_path,
                          updated_code,
                          expected_source=source_code,
                          expected_identity=source_identity,
                      )
                      await self.node.memory_palace.update_audit_cache(
                          file_path,
                          post_identity.mtime,
                          post_identity.size,
                          synopsis,
                      )
          ''',
          )

          replace_once(
              "aura_node.py",
              '''        for file in file_map:
                      if await self._scan_and_stamp_file(file, q_root):
                          stamped_count += 1
                          print(f"[+] Master Key Calibrated & Stamped: {file}")
          ''',
              '''        for file in file_map:
                      try:
                          completed = await self._scan_and_stamp_file(file, q_root)
                      except SourceIntegrityError as exc:
                          failure = exc.failure.to_dict()
                          failure["path"] = Path(file).as_posix()
                          self.audit_failures.append(failure)
                          print(f"[-] Source integrity failure while auditing {file}: {exc}")
                          continue
                      except Exception as exc:
                          self.audit_failures.append(
                              {
                                  "path": Path(file).as_posix(),
                                  "code": "SOURCE_AUDIT_PROCESSING_ERROR",
                                  "message": str(exc),
                                  "byte_offset": 0,
                                  "offending_bytes_hex": "",
                                  "file_size": 0,
                              }
                          )
                          print(f"[-] Audit processing failure in {file}: {exc}")
                          continue
                      if completed:
                          stamped_count += 1
                          print(f"[+] Master Key Calibrated & Stamped: {file}")
          ''',
          )

          replace_once(
              "aura_review_lessons_replay.py",
              '''    receipts.sort(key=lambda item: str(item["scenario_id"]))
              if not receipts:
                  raise ReviewLessonError("crucible replay selected zero scenarios")
              passed_count = sum(1 for item in receipts if item["finding_produced"])
          ''',
              '''    receipts.sort(key=lambda item: str(item["scenario_id"]))
              if not receipts:
                  raise ReviewLessonError("crucible replay selected zero scenarios")
              required_detector_ids = selected_set or set(lessons)
              exercised_detector_ids = {
                  str(item["detector_id"])
                  for item in receipts
              }
              missing_detector_ids = sorted(
                  required_detector_ids - exercised_detector_ids
              )
              if missing_detector_ids:
                  raise ReviewLessonError(
                      "crucible replay is missing scenario coverage for detectors: "
                      f"{missing_detector_ids}"
                  )
              passed_count = sum(1 for item in receipts if item["finding_produced"])
          ''',
          )

          replace_once(
              "tests/test_aura_source_integrity.py",
              '''from aura_source_integrity import (
              SourceIntegrityError,
              read_utf8_source,
              scan_utf8_source_tree,
          )
          ''',
              '''from aura_source_integrity import (
              SourceIntegrityError,
              read_utf8_source,
              read_utf8_source_with_identity,
              scan_utf8_source_tree,
              write_utf8_source_if_unchanged,
          )
          ''',
          )

          replace_once(
              "tests/test_aura_source_integrity.py",
              '''        and item.name in {"__init__", "_scan_and_stamp_file"}
          ''',
              '''        and item.name in {"__init__", "_scan_and_stamp_file", "execute_unified_audit"}
          ''',
          )

          replace_once(
              "tests/test_aura_source_integrity.py",
              '''    namespace = {
                  "Any": Any,
                  "Path": Path,
                  "SourceIntegrityError": SourceIntegrityError,
                  "ast": ast,
                  "defaultdict": defaultdict,
                  "os": __import__("os"),
                  "read_utf8_source": read_utf8_source,
              }
          ''',
              '''    class StubQuantumMerkleDAG:
                  def __init__(self, _node: object) -> None:
                      pass

                  async def generate_epistemic_system_root(self) -> dict[str, str]:
                      return {"root": "test-root"}

              namespace = {
                  "Any": Any,
                  "Path": Path,
                  "QuantumMerkleDAG": StubQuantumMerkleDAG,
                  "SourceIntegrityError": SourceIntegrityError,
                  "_auditor_should_stamp": lambda _filename: True,
                  "ast": ast,
                  "defaultdict": defaultdict,
                  "os": __import__("os"),
                  "read_utf8_source_with_identity": read_utf8_source_with_identity,
                  "time": __import__("time"),
                  "write_utf8_source_if_unchanged": write_utf8_source_if_unchanged,
              }
          ''',
          )

          replace_once(
              "tests/test_aura_source_integrity.py",
              '''def test_repository_python_sources_are_strict_utf8() -> None:
              packet = scan_utf8_source_tree(ROOT)
              assert packet["status"] == "PASSED", packet["failures"]
          ''',
              '''def test_identity_bound_write_rejects_symlink_swap(tmp_path: Path) -> None:
              path = tmp_path / "module.py"
              external = tmp_path / "external.py"
              path.write_text("value = 1\\n", encoding="utf-8")
              external.write_text("protected = True\\n", encoding="utf-8")
              source, identity = read_utf8_source_with_identity(path)
              path.unlink()
              try:
                  path.symlink_to(external)
              except (OSError, NotImplementedError):
                  pytest.skip("symlink creation is unavailable")

              with pytest.raises(SourceIntegrityError) as raised:
                  write_utf8_source_if_unchanged(
                      path,
                      "value = 2\\n",
                      expected_source=source,
                      expected_identity=identity,
                  )

              assert raised.value.failure.code == "SOURCE_SYMLINK_REJECTED"
              assert external.read_text(encoding="utf-8") == "protected = True\\n"


          def test_boot_auditor_continues_after_post_read_failure(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              auditor_type = _load_auditor_source_slice()
              (tmp_path / "a.py").write_text("a = 1\\n", encoding="utf-8")
              (tmp_path / "b.py").write_text("b = 2\\n", encoding="utf-8")
              node = SimpleNamespace(friction_optimizer=None, mitosis_engine=None)
              auditor = auditor_type(node)

              async def fake_scan(file_path: str, _q_root: str) -> bool:
                  if file_path == "a.py":
                      raise RuntimeError("cache backend unavailable")
                  return True

              setattr(auditor, "_scan_and_stamp_file", fake_scan)
              monkeypatch.chdir(tmp_path)
              report = asyncio.run(auditor.execute_unified_audit())

              assert "Stamped 1/2 eligible modules" in report
              assert auditor.audit_failures == [
                  {
                      "path": "a.py",
                      "code": "SOURCE_AUDIT_PROCESSING_ERROR",
                      "message": "cache backend unavailable",
                      "byte_offset": 0,
                      "offending_bytes_hex": "",
                      "file_size": 0,
                  }
              ]


          def test_repository_python_sources_are_strict_utf8() -> None:
              packet = scan_utf8_source_tree(ROOT)
              assert packet["status"] == "PASSED", packet["failures"]
          ''',
          )

          replace_once(
              "tests/test_aura_review_lessons_codex_regressions.py",
              '''    with pytest.raises(ReviewLessonError, match="selected zero scenarios"):
                  run_crucible_replay(payload, detector_ids=[detector_id])
          ''',
              '''    with pytest.raises(ReviewLessonError, match="selected zero scenarios"):
                  run_crucible_replay(payload, detector_ids=[detector_id])


          def test_default_replay_requires_scenario_coverage_for_every_lesson(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              from aura_coding_waboose_review_lessons import run_crucible_replay

              _bind_replay_to_current_head(monkeypatch)
              payload = json.loads(REGISTRY.read_text(encoding="utf-8"))
              detector_ids = sorted(
                  {str(item["detector_id"]) for item in payload["scenarios"]}
              )
              assert len(detector_ids) > 1
              missing_detector_id = detector_ids[0]
              payload["scenarios"] = [
                  item
                  for item in payload["scenarios"]
                  if item["detector_id"] != missing_detector_id
              ]
              unsigned = dict(payload)
              unsigned.pop("registry_digest")
