              with pytest.raises(ReviewLessonError, match="missing scenario coverage"):
                  run_crucible_replay(payload)
          ''',
          )

          Path(".github/workflows/pr166-manual-review-repair.yml").unlink()
          PY

      - name: Install focused verifier dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff

      - name: Compile repaired files
        run: |
          python -m py_compile \
            aura_source_integrity.py \
            aura_review_lessons_replay.py \
            aura_node.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py

      - name: Run focused Ruff checks
        run: |
          ruff check \
            aura_source_integrity.py \
            aura_review_lessons_replay.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py

      - name: Run focused regressions
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_review_lessons_ancestry_regression.py

      - name: Commit verified manual repairs
        run: |
          git diff --check
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add aura_source_integrity.py aura_node.py aura_review_lessons_replay.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            .github/workflows/pr166-manual-review-repair.yml
          git commit -m "Harden auditor stamping and replay coverage"
          git push origin HEAD:feature/aura-spatial-s3a-render-session
