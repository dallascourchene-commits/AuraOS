name: P2.2 bounded planning regression

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: write

concurrency:
  group: p2-2-planning-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-regression:
    name: Backward regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile regression contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            aura_planning_regression.py \
            tests/test_aura_planning_regression.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_planning_regression.py \
            tests/test_aura_planning_regression.py
      - name: Run bounded regression tests
        run: |
          python -m pytest -q \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_regression.py

  apply-regression-hardening:
    name: Apply bounded regression hardening
    if: github.event_name == 'push' && github.ref_name == 'refactor/planning-regression-p2-2' && !contains(github.event.head_commit.message, 'harden backward regression')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/planning-regression-p2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for CODEMAP synchronization
        run: sleep 75
      - name: Refresh exact branch head
        run: |
          git fetch origin refactor/planning-regression-p2-2
          git reset --hard origin/refactor/planning-regression-p2-2
      - name: Apply hardening
        run: python scripts/p2_2_harden_regression.py
      - name: Validate hardened regression
        run: |
          python -m pip install pytest ruff
          python -m py_compile aura_planning_regression.py tests/test_aura_planning_regression.py
          ruff check --select E9,F63,F7,F82 aura_planning_regression.py tests/test_aura_planning_regression.py
          python -m pytest -q tests/test_aura_planning_board.py tests/test_aura_planning_regression.py
      - name: Commit code-only hardening
        run: |
          git config user.name "AuraOS Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_planning_regression.py
          git commit -m "fix(planning): harden backward regression"
          git fetch origin refactor/planning-regression-p2-2
          git rebase origin/refactor/planning-regression-p2-2
          git push origin HEAD:refactor/planning-regression-p2-2
