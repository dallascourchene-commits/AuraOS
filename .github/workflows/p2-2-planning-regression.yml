name: P2.2 bounded planning regression

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p2-2-planning-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regression:
    name: Backward regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile regression contracts
        run: |
          python -m py_compile \
            aura_event_contracts.py \
            aura_planning_board.py \
            aura_planning_regression.py \
            tests/test_aura_planning_regression.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_planning_regression.py \
            tests/test_aura_planning_regression.py
      - name: Run bounded regression tests
        run: |
          python -m pytest -q \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_regression.py
