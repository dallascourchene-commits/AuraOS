name: Finalize unified continuity review cleanup

on:
  pull_request:
    branches:
      - main
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: unified-memory-continuity-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_MODULE_SHA256: bb5c0c50e62b8edbb4cbdad4f9810709f67adf7866fcd8b0700eda334a030ade
      EXPECTED_TEST_SHA256: edddf3af030fd5e4cdeb8bc0bb0c4b2751e3dc7857068ba46c28c5bd905d19ee
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore canonical CI without touching reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_MODULE_SHA256"
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_TEST_SHA256"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_MODULE_SHA256"
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_TEST_SHA256"
          git diff --check

      - name: Stage and commit only canonical CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Review Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --name-status
          git commit -m 'chore: restore canonical CI after unified continuity review'

      - name: Push cleanup-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_MODULE_SHA256"
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = "$EXPECTED_TEST_SHA256"
          git push origin "HEAD:${TARGET_BRANCH}"
