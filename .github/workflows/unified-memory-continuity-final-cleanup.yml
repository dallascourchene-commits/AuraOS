name: Finalize unified continuity review cleanup

on:
  pull_request:
    branches:
      - main
    types: [ready_for_review]

permissions:
  contents: write

concurrency:
  group: unified-memory-continuity-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.head_ref == 'refactor/unified-memory-continuity' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore canonical CI without touching reviewed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          before_module="$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')"
          before_tests="$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .aura/refactor_payloads/unified_memory_continuity_manual_review.v1.part-*
          after_module="$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')"
          after_tests="$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')"
          test "$before_module" = "$after_module"
          test "$before_tests" = "$after_tests"
          git diff --check

      - name: Commit cleanup-only tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Review Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/ci.yml
          git add -u -- .aura/refactor_payloads
          if git diff --cached --quiet; then
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          test "$changed" = '.github/workflows/ci.yml' || {
            printf 'Unexpected cleanup paths:\n%s\n' "$changed" >&2
            exit 1
          }
          git commit -m 'chore: restore canonical CI after unified continuity review'
          git push origin "HEAD:${TARGET_BRANCH}"
