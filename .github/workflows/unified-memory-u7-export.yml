name: Unified memory U7 exact-head discovery

on:
  push:
    branches:
      - analysis/unified-memory-u7-discovery-20260724

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  discover:
    if: github.actor != 'auraos-discovery-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/unified-memory-u7-discovery-20260724
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact-head architecture discovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aura/analysis/u7-discovery
          {
            echo '# Unified Memory U7 Exact-Head Discovery'
            echo
            echo '## Source identity'
            echo '```text'
            git rev-parse HEAD
            git status --porcelain=v1
            echo '```'
            echo
            echo '## Navigator objective query'
            echo '```text'
            python aura_codebase_navigator.py --query "unified manufactured memory continuity learning to reproof Crucible Relationship Experience QDKT" 2>&1 || true
            echo '```'
            echo
            echo '## Exact symbols and owners'
            echo '```text'
            grep -RIn --exclude-dir=.git --exclude='CODEMAP.json' --exclude='live_topology_ast.json' \
              -E 'evaluate_learning_to_reproof|relationship_experience_kwargs|evaluate_qdkt_consequential_admission|ContinuitySensitivityReceipt|ArenaCrucibleService|RelationshipExperienceObservation|UnifiedQDKT' \
              aura_unified_memory_continuity.py aura_unified_memory_continuity_toolchain.py aura_agent_arena_bridge.py aura_agent_arena_mcp.py aura_arena_crucible.py aura_relationship_experience.py aura_qdkt.py tests 2>&1 || true
            echo '```'
            echo
            echo '## Candidate persistence and invocation owners'
            echo '```text'
            find . -maxdepth 2 -type f \( -iname '*relationship*experience*' -o -iname '*crucible*' -o -iname '*qdkt*' -o -iname '*attempt*archive*' -o -iname '*state*ledger*' \) -print | sort
            echo '```'
            echo
            echo '## Topology health'
            echo '```text'
            python -m aura_agent_arena_cli topology-health 2>&1 || true
            echo '```'
            echo
            echo '## Stabilization status'
            echo '```text'
            python -m aura_agent_arena_cli stabilization-status 2>&1 || true
            echo '```'
            echo
            echo '## Architecture harness doctor'
            echo '```text'
            python scripts/aura_architecture_harness.py --repo-root . doctor 2>&1 || true
            echo '```'
          } > .aura/analysis/u7-discovery/U7_DISCOVERY_REPORT.md

      - name: Commit bounded discovery report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'auraos-discovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .aura/analysis/u7-discovery/U7_DISCOVERY_REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'analysis: record U7 learning-to-reproof architecture discovery'
          git push origin HEAD:analysis/unified-memory-u7-discovery-20260724
