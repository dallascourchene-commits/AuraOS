name: Aura Emergent Coding Audit

on:
  push:
    branches:
      - analysis/emergent-coding-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-emergent-coding-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-only-coding-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated analysis runtime
        run: docker build -f Dockerfile.analysis-runtime -t aura-analysis-runtime:${{ github.sha }} .

      - name: Verify emergent audit surfaces
        id: focused_tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p analysis-output
          set +e
          docker run --rm \
            --entrypoint python \
            aura-analysis-runtime:${{ github.sha }} \
            -m pytest -q \
            tests/test_aura_emergent_potential_repl.py \
            tests/test_aura_emergent_result_verifier.py \
            tests/test_aura_coding_arena_grounding.py \
            2>&1 | tee analysis-output/focused-tests.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "${code}" > analysis-output/focused-tests-exit-code.txt
          exit "${code}"

      - name: Run multi-focus coding immersion audit
        id: audit
        shell: bash
        run: |
          mkdir -p analysis-output
          set +e
          docker create --name aura-emergent-audit aura-analysis-runtime:${{ github.sha }}
          docker start -a aura-emergent-audit
          code=$?
          set -e
          docker cp aura-emergent-audit:/app/analysis-output/. ./analysis-output/ || true
          docker rm aura-emergent-audit >/dev/null 2>&1 || true
          exit "${code}"

      - name: Upload grounded emergent audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-emergent-coding-audit-${{ github.run_id }}
          path: analysis-output/
          if-no-files-found: warn
          retention-days: 14
