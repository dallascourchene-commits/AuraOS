name: Aura WorkCapsule Exact Observation-Bound Closure

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_reentry_exact_verifier.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'scripts/aura_workcapsule_reentry_closure.py'
      - 'scripts/aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'scripts/aura_workcapsule_observation_bound_closure.py'
      - 'scripts/aura_workcapsule_observation_bound_exact_verifier.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_exact_verifier.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_reentry_closure.py'
      - 'tests/test_aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'tests/test_aura_workcapsule_observation_bound_closure.py'
      - 'tests/test_aura_workcapsule_observation_bound_exact_verifier.py'
      - '.github/workflows/aura-workcapsule-observation-bound-exact-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-observation-bound-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove source currentness and observation owner
        run: |
          python3 -m py_compile scripts/aura_astge_anchor_hydration.py scripts/aura_workcapsule_source_reentry_observation.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration tests.test_aura_workcapsule_source_reentry_observation

      - name: Re-prove O7 O8 and PR510 exact re-entry verifier
        run: |
          python3 -m py_compile scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py scripts/aura_workcapsule_reentry_exact_verifier.py
          python3 -m unittest -v tests.test_aura_workcapsule_context_binding tests.test_aura_workcapsule_reentry_invalidation tests.test_aura_workcapsule_reentry_exact_verifier

      - name: Re-prove PR512 and PR513 exact closure owners
        run: |
          python3 -m py_compile scripts/aura_workcapsule_reentry_closure.py scripts/aura_workcapsule_reentry_closure_exact_verifier.py
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure tests.test_aura_workcapsule_reentry_closure_exact_verifier

      - name: Re-prove PR516 observation-bound closure
        run: |
          python3 -m py_compile scripts/aura_workcapsule_observation_bound_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_observation_bound_closure

      - name: Prove exact observation-bound closure reproduction
        run: |
          python3 -m py_compile scripts/aura_workcapsule_observation_bound_exact_verifier.py
          python3 -m unittest -v tests.test_aura_workcapsule_observation_bound_exact_verifier

      - name: Assert caller evidence escape hatches are absent
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_observation_bound_exact_verifier import verify_exact_observation_bound_reentry_closure
          params = inspect.signature(verify_exact_observation_bound_reentry_closure).parameters
          assert 'candidate_binding' not in params
          assert 'observed_source_witnesses' not in params
          assert {'root', 'codemap', 'anchor_manifest', 'witness_manifest', 'previous_binding', 'reentry_receipt', 'candidate_graph_witness', 'receipt'} <= set(params)
          print('CALLER_CANDIDATE_BINDING_ACCEPTED=false')
          print('CALLER_SOURCE_WITNESSES_ACCEPTED=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'EXACT_OBSERVATION_BOUND_INPUT_REPRODUCTION=true'
          echo 'SOURCE_CANDIDATE_DERIVED_FROM_RAW_CURRENTNESS_INPUTS=true'
          echo 'PR513_EXACT_CLOSURE_REPLAY_USED=true'
          echo 'PR516_OBSERVATION_BOUND_OWNER_REPLAYED=true'
          echo 'EXACT_REPRODUCTION_OF_HOLD_DOES_NOT_PROMOTE_TO_CLOSED=true'
          echo 'PRODUCER_IDENTITY_AUTHENTICATED=false'
          echo 'GRAPH_WITNESS_PRODUCER_AUTHENTICATED=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
