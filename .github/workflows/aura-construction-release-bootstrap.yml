name: Release Construction G7-G8 final tree

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-construction-release-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff bandit pyyaml

      - name: Execute the reviewed finalizer steps
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          source = Path("tools/construction_release/finalizer.yml")
          payload = yaml.safe_load(source.read_text(encoding="utf-8"))
          steps = payload["jobs"]["finalize"]["steps"]
          required = (
              "Apply fail-closed WebGL2 lifecycle and documentation finalization",
              "Verify source syntax and focused Python contracts",
              "Stress WebGL2 lifecycle and retained Construction rendering",
              "Run focused Coding Waboose review",
          )
          by_name = {step.get("name"): step for step in steps if isinstance(step, dict)}
          missing = [name for name in required if name not in by_name]
          if missing:
              raise RuntimeError(f"finalizer steps missing: {missing}")
          for name in required:
              command = by_name[name].get("run")
              if not isinstance(command, str) or not command.strip():
                  raise RuntimeError(f"finalizer step has no command: {name}")
              print(f"::group::{name}")
              subprocess.run(
                  ["bash", "-e", "-u", "-o", "pipefail", "-c", command],
                  check=True,
              )
              print("::endgroup::")
          PY

      - name: Remove temporary release machinery
        run: |
          git rm -rf \
            .github/workflows/aura-construction-release-bootstrap.yml \
            tools/construction_release

      - name: Regenerate final navigation and rerun exact focused gates
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          node --check aura_spatial_web/webgl2_renderer.js
          node --check aura_spatial_web/construction_demo_app.js
          node --test \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_spatial_render_plan.py
          git diff --check

      - name: Upload Waboose evidence
        uses: actions/upload-artifact@v4
        with:
          name: construction-webgl2-waboose-evidence
          path: /tmp/aura-waboose-result.json
          retention-days: 7

      - name: Publish exact verified release tree
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(g8): harden WebGL2 and finalize Construction operations"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
