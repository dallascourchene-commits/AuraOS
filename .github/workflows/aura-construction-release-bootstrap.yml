name: Release Construction G7-G8 final tree

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-construction-release-bootstrap.yml"
      - "tools/construction_release/extract_finalizer.py"

permissions:
  contents: write

concurrency:
  group: aura-construction-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install jsonschema pytest ruff bandit

      - name: Extract reviewed finalizer commands
        run: python tools/construction_release/extract_finalizer.py

      - name: Apply WebGL2 and documentation changes
        run: |
          set +e
          /tmp/apply.sh > /tmp/apply.log 2>&1
          status=$?
          tail -200 /tmp/apply.log
          exit "$status"

      - name: Verify Python and source contracts
        run: |
          set +e
          /tmp/verify.sh > /tmp/verify.log 2>&1
          status=$?
          tail -200 /tmp/verify.log
          exit "$status"

      - name: Stress renderer and retained Construction contracts
        run: |
          set +e
          /tmp/stress.sh > /tmp/stress.log 2>&1
          status=$?
          tail -240 /tmp/stress.log
          exit "$status"

      - name: Run focused Coding Waboose
        run: |
          set +e
          /tmp/waboose.sh > /tmp/waboose.log 2>&1
          status=$?
          tail -240 /tmp/waboose.log
          exit "$status"

      - name: Upload bounded release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: construction-release-diagnostics
          path: |
            /tmp/apply.log
            /tmp/verify.log
            /tmp/stress.log
            /tmp/waboose.log
            /tmp/aura-waboose-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary release machinery
        run: |
          git rm -rf \
            .github/workflows/aura-construction-release-bootstrap.yml \
            tools/construction_release

      - name: Regenerate final navigation and rerun exact focused gates
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          test -s Aura_Memory/live_topology_ast.json
          node --check aura_spatial_web/webgl2_renderer.js
          node --check aura_spatial_web/construction_demo_app.js
          node --test \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_spatial_render_plan.py
          git diff --check

      - name: Publish exact verified release tree
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(g8): harden WebGL2 and finalize Construction operations"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
