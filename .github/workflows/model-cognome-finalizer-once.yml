name: Adaptive Router Focused Validation Once

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/model-cognome-live-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install pytest ruff
      - name: Compile adaptive modules
        run: |
          python -m py_compile \
            aura_ai_router.py \
            aura_model_cognome_execution_auth.py \
            aura_adaptive_model_router.py \
            aura_adaptive_model_executor.py
      - name: Fatal lint
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_ai_router.py \
            aura_model_cognome_execution_auth.py \
            aura_adaptive_model_router.py \
            aura_adaptive_model_executor.py \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py
      - name: Run focused tests
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            --junitxml=focused-${{ matrix.python-version }}.xml \
            > focused-${{ matrix.python-version }}.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-focused-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            focused-${{ matrix.python-version }}.log
            focused-${{ matrix.python-version }}.xml
      - name: Enforce tests
        if: steps.pytest.outputs.exit_code != '0'
        run: |
          cat focused-${{ matrix.python-version }}.log
          exit 1
