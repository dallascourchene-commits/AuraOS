name: Bilateral PR2 lifecycle hardening finalizer

on:
  push:
    branches:
      - refactor/bilateral-intent-pr2
    paths:
      - .github/workflows/bilateral-pr2-contradiction-finalize.yml

permissions:
  contents: write

concurrency:
  group: bilateral-pr2-contradiction-finalizer
  cancel-in-progress: false

jobs:
  patch-prove-sync-and-dissolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilateral-intent-pr2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Harden contradiction resolution and source identity
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler_path = Path("aura_bilateral_intent_compiler.py")
          compiler = compiler_path.read_text(encoding="utf-8")
          contradiction_old = '''    elif question.ambiguity_class == AmbiguityClass.CONTRADICTION.value:
              positives = [item for item in positives if item != value]
              negatives = [item for item in negatives if item.statement != value and item.target != value]
              if not positives:
                  positives = [analysis.source_request]
          '''.replace("          ", "")
          contradiction_new = '''    elif question.ambiguity_class == AmbiguityClass.CONTRADICTION.value:
              candidates = tuple(question.candidate_answers)
              if len(candidates) != 2 or value not in candidates:
                  raise ValueError("contradiction clarification must select one declared requirement")
              positive_candidate, negative_candidate = candidates
              if value == positive_candidate:
                  negatives = [
                      item
                      for item in negatives
                      if item.statement != negative_candidate and item.target != negative_candidate
                  ]
              else:
                  positives = [item for item in positives if item != positive_candidate]
                  if not positives:
                      positives = ["Preserve the confirmed prohibition and locked guardrails."]
          '''.replace("          ", "")
          if contradiction_old in compiler:
              compiler = compiler.replace(contradiction_old, contradiction_new)
          elif "contradiction clarification must select one declared requirement" not in compiler:
              raise SystemExit("contradiction-resolution source span is neither original nor corrected")
          compiler_path.write_text(compiler, encoding="utf-8")

          gate_path = Path("aura_arena_gate_dialogue.py")
          gate = gate_path.read_text(encoding="utf-8")
          identity_start = gate.index("def _repository_identity(root: Path) -> dict[str, Any]:")
          identity_end = gate.index("\ndef _fallback_response(", identity_start)
          current_identity = gate[identity_start:identity_end]
          hardened_identity = '''def _repository_identity(root: Path) -> dict[str, Any]:
              def git_text(*args: str) -> str:
                  result = subprocess.run(
                      ["git", *args],
                      cwd=root,
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=20,
                  )
                  return result.stdout.strip()

              def git_bytes(*args: str) -> bytes:
                  result = subprocess.run(
                      ["git", *args],
                      cwd=root,
                      check=True,
                      capture_output=True,
                      timeout=20,
                  )
                  return bytes(result.stdout)

              def content_digest(path: Path) -> tuple[str, str]:
                  digest = hashlib.blake2b(digest_size=32)
                  if path.is_symlink():
                      target = str(path.readlink()).encode("utf-8", errors="surrogateescape")
                      digest.update(target)
                      return "symlink", digest.hexdigest()
                  with path.open("rb") as handle:
                      while True:
                          chunk = handle.read(1024 * 1024)
                          if not chunk:
                              break
                          digest.update(chunk)
                  return "file", digest.hexdigest()

              head = git_text("rev-parse", "HEAD")
              status = git_text("status", "--porcelain=v1", "--untracked-files=all")
              clean = not bool(status.strip())
              tracked_diff = git_bytes("diff", "--binary", "--full-index", "HEAD", "--")
              untracked_paths = git_bytes(
                  "ls-files", "--others", "--exclude-standard", "-z"
              ).split(b"\\0")
              untracked: list[dict[str, str]] = []
              for raw_path in untracked_paths:
                  if not raw_path:
                      continue
                  relative = raw_path.decode("utf-8", errors="surrogateescape")
                  candidate = root / relative
                  if not candidate.is_symlink() and not candidate.is_file():
                      continue
                  kind, digest = content_digest(candidate)
                  untracked.append(
                      {
                          "path": relative.replace("\\\\", "/"),
                          "kind": kind,
                          "digest": digest,
                      }
                  )
              untracked.sort(key=lambda item: item["path"])
              tree_digest = stable_digest(
                  {
                      "head": head,
                      "tracked_diff_digest": hashlib.blake2b(
                          tracked_diff, digest_size=32
                      ).hexdigest(),
                      "untracked": untracked,
                  }
              )
              return {
                  "repository_head": head,
                  "source_tree_digest": tree_digest,
                  "working_tree_clean": clean,
                  "working_tree_clean_receipt": stable_digest(
                      {
                          "head": head,
                          "clean": clean,
                          "source_tree_digest": tree_digest,
                          "status": status.splitlines(),
                      }
                  ),
              }
          '''
          hardened_identity = "\n".join(
              line[14:] if line.startswith("              ") else line
              for line in hardened_identity.splitlines()
          ) + "\n"
          if "tracked_diff_digest" not in current_identity:
              gate = gate[:identity_start] + hardened_identity + gate[identity_end + 1 :]

          legacy_old = '''                elif question.candidate_answers:
                      answer = question.candidate_answers[0]
          '''.replace("          ", "")
          legacy_new = '''                elif question.candidate_answers:
                      answer = (
                          question.candidate_answers[-1]
                          if question.ambiguity_class == "CONTRADICTION"
                          else question.candidate_answers[0]
                      )
          '''.replace("          ", "")
          if legacy_old in gate:
              gate = gate.replace(legacy_old, legacy_new)
          elif 'question.ambiguity_class == "CONTRADICTION"' not in gate:
              raise SystemExit("legacy contradiction fallback is neither original nor corrected")
          gate_path.write_text(gate, encoding="utf-8")

          test_path = Path("tests/test_aura_bilateral_gate_dialogue.py")
          tests = test_path.read_text(encoding="utf-8")
          if "import subprocess\n" not in tests:
              tests = tests.replace("import json\n", "import json\nimport subprocess\n", 1)
          marker = "\ndef test_affordance_map_declares_current_review_learning_extension():\n"
          additions = []
          if "def test_contradiction_clarification_preserves_the_selected_side" not in tests:
              additions.append('''
              def test_contradiction_clarification_preserves_the_selected_side():
                  from aura_bilateral_intent_compiler import (
                      analyze_bilateral_request,
                      apply_clarification,
                  )
                  from aura_intent_refinement import AmbiguityClass

                  request = (
                      "Widen the selected file scope. "
                      "Do not widen the selected file scope."
                  )
                  positive_analysis = analyze_bilateral_request(request)
                  positive_question = next(
                      item
                      for item in positive_analysis.questions
                      if item.ambiguity_class == AmbiguityClass.CONTRADICTION.value
                  )
                  positive_choice, negative_choice = positive_question.candidate_answers
                  positive_resolved = apply_clarification(
                      positive_analysis,
                      question=positive_question,
                      answer=positive_choice,
                  )
                  assert positive_choice in positive_resolved.positive_requirements
                  assert all(
                      item.statement != negative_choice and item.target != negative_choice
                      for item in positive_resolved.negative_requirements
                  )

                  negative_analysis = analyze_bilateral_request(request)
                  negative_question = next(
                      item
                      for item in negative_analysis.questions
                      if item.ambiguity_class == AmbiguityClass.CONTRADICTION.value
                  )
                  positive_choice, negative_choice = negative_question.candidate_answers
                  negative_resolved = apply_clarification(
                      negative_analysis,
                      question=negative_question,
                      answer=negative_choice,
                  )
                  assert positive_choice not in negative_resolved.positive_requirements
                  assert any(
                      item.statement == negative_choice or item.target == negative_choice
                      for item in negative_resolved.negative_requirements
                  )
                  assert negative_resolved.teach_back is not None
              ''')
          if "def test_repository_identity_detects_same_path_content_drift" not in tests:
              additions.append('''
              def test_repository_identity_detects_same_path_content_drift(tmp_path):
                  from aura_arena_gate_dialogue import _repository_identity

                  def git(*args):
                      subprocess.run(
                          ["git", *args],
                          cwd=tmp_path,
                          check=True,
                          capture_output=True,
                          text=True,
                      )

                  git("init")
                  git("config", "user.name", "Aura Test")
                  git("config", "user.email", "aura-test@example.invalid")
                  tracked = tmp_path / "tracked.txt"
                  tracked.write_text("base\n", encoding="utf-8")
                  git("add", "tracked.txt")
                  git("commit", "-m", "base")

                  tracked.write_text("candidate one\n", encoding="utf-8")
                  first = _repository_identity(tmp_path)
                  tracked.write_text("candidate two\n", encoding="utf-8")
                  second = _repository_identity(tmp_path)
                  assert first["source_tree_digest"] != second["source_tree_digest"]

                  untracked = tmp_path / "new.txt"
                  untracked.write_text("untracked one\n", encoding="utf-8")
                  third = _repository_identity(tmp_path)
                  untracked.write_text("untracked two\n", encoding="utf-8")
                  fourth = _repository_identity(tmp_path)
                  assert third["source_tree_digest"] != fourth["source_tree_digest"]
              ''')
          if "def test_legacy_one_turn_contradiction_preserves_prohibition" not in tests:
              additions.append('''
              def test_legacy_one_turn_contradiction_preserves_prohibition(workflow):
                  from aura_arena_gate_dialogue import ArenaGateDialogueService

                  service = ArenaGateDialogueService(REPO_ROOT, workflow)
                  proposal = service.address(
                      comment=(
                          "Widen the selected file scope. "
                          "Do not widen the selected file scope."
                      ),
                      node_context=NODE_CONTEXT,
                      stage_hint="FRAME",
                      prefer_model=False,
                  )
                  assert proposal["status"] == "PENDING_HUMAN_APPROVAL"
                  assert any(
                      item.get("target") == "widen the selected file scope"
                      for item in proposal["negative_requirements"]
                  )
                  assert all(
                      requirement != "Widen the selected file scope."
                      for requirement in proposal["positive_requirements"]
                  )
              ''')
          if additions:
              if tests.count(marker) != 1:
                  raise SystemExit("test insertion marker was not found exactly once")
              normalized = []
              for addition in additions:
                  normalized.append(
                      "\n".join(
                          line[14:] if line.startswith("              ") else line
                          for line in addition.splitlines()
                      )
                  )
              tests = tests.replace(marker, "\n".join(normalized) + marker)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Remove one-use workflow before topology generation
        run: rm -f .github/workflows/bilateral-pr2-contradiction-finalize.yml
      - name: Run lifecycle, contradiction, and compatibility proof
        run: |
          python -m py_compile \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py
          python -m pytest -q \
            tests/test_aura_bilateral_gate_dialogue.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_aura_intent_refinement.py
      - name: Publish verified source and tests
        run: |
          git config user.name "AuraOS PR2 Lifecycle Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            .github/workflows/bilateral-pr2-contradiction-finalize.yml
          if git diff --cached --quiet; then
            echo "Lifecycle hardening is already published."
            exit 0
          fi
          git commit -m "fix(intent): harden contradiction and source currency"
          git pull --rebase origin refactor/bilateral-intent-pr2
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:refactor/bilateral-intent-pr2
