name: Aura K27 ASTGE Mmap Generation Contract

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge/**"
      - "crates/aura-k27-astge-mmap/**"
      - ".github/workflows/aura-k27-astge-mmap-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-k27-astge-mmap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mmap-generation-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Re-run safe parent S-plane
        run: cargo test --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets --locked

      - name: Compile and test mmap generation adapter
        run: cargo test --manifest-path crates/aura-k27-astge-mmap/Cargo.toml --all-targets

      - name: Clippy adapter fail-closed
        run: |
          # Keep all warnings fatal. Ignore only the style-only Rust 1.98 suggestion
          # to replace chunks_exact with as_chunks; it changes no storage/safety law.
          cargo clippy --manifest-path crates/aura-k27-astge-mmap/Cargo.toml --all-targets -- \
            -D warnings -A clippy::chunks-exact-to-as-chunks

      - name: Emit claim ceiling
        run: |
          echo 'SAFE_PARENT_UNSAFE_CODE_ALLOWED=false'
          echo 'MMAP_EXTERNAL_POST_MAP_MUTATION_PROTECTED=false'
          echo 'K27_PHYSICAL_LOCALITY_PROVEN=false'
          echo 'MMAP_PERFORMANCE_SUPERIORITY_PROVEN=false'
          echo 'SEMANTIC_CURRENTNESS_OR_AUTHORITY_GRANTED=false'
