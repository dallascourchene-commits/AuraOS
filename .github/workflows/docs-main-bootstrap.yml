name: Apply canonical docs after bootstrap merge

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap canonical documentation update')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Execute embedded documentation updater
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/docs-update-once.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          exec(compile(script, 'docs-update-once', 'exec'), {'__name__': '__main__'})
          PY

      - name: Refresh CODEMAP
        run: python3 aura_codebase_navigator.py

      - name: Commit canonical documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md USER_GUIDE.md .aura/ARCHITECTURE.md .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs: document governed learning loop and benchmarks"
          git push origin HEAD:main
