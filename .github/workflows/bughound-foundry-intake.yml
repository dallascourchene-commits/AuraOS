name: BugHound Foundry Intake

on:
  pull_request:
    paths:
      - 'scripts/bughound_foundry_intake.py'
      - 'tests/test_bughound_foundry_intake.py'
      - '.github/workflows/bughound-foundry-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/bughound_foundry_intake.py tests/test_bughound_foundry_intake.py
      - name: Focused tests
        run: python -m pytest -q tests/test_bughound_foundry_intake.py
