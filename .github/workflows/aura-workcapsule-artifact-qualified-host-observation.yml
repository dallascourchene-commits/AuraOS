name: Aura WorkCapsule Artifact-Qualified Host Observation

on:
  pull_request:
    paths:
      - 'scripts/aura_workcapsule_current_recursive_target_raw_slice_binding.py'
      - 'scripts/aura_workcapsule_artifact_qualified_host_observation.py'
      - 'tests/test_aura_workcapsule_current_recursive_target_raw_slice_binding.py'
      - 'tests/test_aura_workcapsule_artifact_qualified_host_observation.py'
      - '.github/workflows/aura-workcapsule-artifact-qualified-host-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR562_SHA: 446df86fb63b582cf8109079a01cafc753836957
  PR559_SHA: 26201c63c3531bbf631ef34803c6f01ccd7499d3
  CONVERGENCE_SHA: d619ada2acce6992c2481b2c66726230c4f088d8

jobs:
  exact-artifact-host-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact child and prove two-parent convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=260 origin "$TARGET_SHA" "$CONVERGENCE_SHA" "$PR562_SHA" "$PR559_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git show -s --format=%P "$CONVERGENCE_SHA")" = "$PR562_SHA $PR559_SHA"
          git merge-base --is-ancestor "$PR562_SHA" HEAD
          git merge-base --is-ancestor "$PR559_SHA" HEAD
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          echo 'TRUE_TWO_PARENT_CONVERGENCE=true'

      - name: Re-prove exact PR562 consequence on child tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/aura_workcapsule_scoped_higher_owner_portable_continuity.py \
            scripts/aura_workcapsule_current_recursive_target_raw_slice_binding.py \
            scripts/aura_workcapsule_artifact_qualified_host_observation.py
          python3 -m unittest -v \
            tests.test_aura_workcapsule_current_recursive_target_raw_slice_binding

      - name: Re-prove exact PR559 parent in isolated checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr559
          git clone --no-checkout --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pr559
          git -C /tmp/pr559 fetch --no-tags --depth=1 origin "$PR559_SHA"
          git -C /tmp/pr559 checkout --detach "$PR559_SHA"
          git -C /tmp/pr559 remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git -C /tmp/pr559 rev-parse HEAD)" = "$PR559_SHA"
          test -z "$(git -C /tmp/pr559 config --local --get-all http.https://github.com/.extraheader || true)"
          cd /tmp/pr559
          python3 -m py_compile scripts/aura_workcapsule_temporal_host_observation_admission.py
          python3 -m unittest -v tests.test_aura_workcapsule_temporal_host_observation_admission
          echo 'PR559_REPROVED_IN_ISOLATION=true'

      - name: Run artifact-qualified host adversarial suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_aura_workcapsule_artifact_qualified_host_observation

      - name: Assert owner boundary and consequence ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_artifact_qualified_host_observation import verify_artifact_qualified_host_observation
          params = set(inspect.signature(verify_artifact_qualified_host_observation).parameters)
          assert params == {'scoped_target_inputs','higher_owner_projection','raw_slice_receipt','host_admission_receipt'}
          print('CALLER_HOST_RESOLVER_ACCEPTED=false')
          print('CALLER_EFFECT_OVERRIDE_ACCEPTED=false')
          print('HOST_ADMISSION_REPROVED_BY_CHILD=false')
          print('HOST_ADMISSION_PRODUCER_AUTHENTICATED=false')
          print('SEMANTIC_HANDLE_DERIVED_FROM_RAW_SLICE=false')
          print('SEMANTIC_IDENTITY_PROVEN_BY_RAW_SLICE=false')
          print('HOST_RESOLVER_TRUST_PROVEN=false')
          print('HOST_OBSERVATION_AUTHORITY_PROVEN=false')
          print('TRUSTED_CONTINUATION_READY=false')
          print('HOST_EFFECT_READY=false')
          print('MERGE_AUTHORITY=false')
          print('PROVIDER_EFFECT_AUTHORITY=false')
          PY
