name: GLM53 Official Source Trial Bridge

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-official-source-trial-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR629_SHA: 475fc346670bc56951ee6e4262bf23af00f70b7b
      PR629_RUN: "33369419860"
      PR639_SHA: 730426b82235b0ff4e75fef1cff00707877a84ad
      PR639_RUN: "33369967425"
      PR629_TRIAL_BLOB: 3985095e122e9d3a7867452c6ae0fdba41d200f1
    steps:
      - name: Checkout exact child with parent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact semantic two-parent convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          a = os.environ['PR639_SHA']; b = os.environ['PR629_SHA']
          lines = subprocess.check_output(['git','rev-list','HEAD','--parents'], text=True).splitlines()
          matches = []
          for line in lines:
              parts = line.split()
              if len(parts) == 3 and parts[1:] == [a, b]:
                  matches.append(parts[0])
          assert len(matches) == 1, matches
          print('OFFICIAL_SOURCE_TRIAL_TRUE_TWO_PARENT_CONVERGENCE=' + matches[0])
          PY

      - name: Revalidate exact parent hosted generations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for run_key, sha_key in (('PR629_RUN','PR629_SHA'), ('PR639_RUN','PR639_SHA')):
              run_id = os.environ[run_key]; expected = os.environ[sha_key]
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{run_id}",
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run['status'] == 'completed', (run_id, run['status'])
              assert run['conclusion'] == 'success', (run_id, run['conclusion'])
              assert run['head_sha'] == expected, (run_id, run['head_sha'], expected)
              print(f"EXACT_PARENT_GREEN={run_id}:{expected}")
          PY

      - name: Assert exact PR629 trial surface materialized
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/quantization/aura_glm53_quantized_representation_trial.py)" = "$PR629_TRIAL_BLOB"

      - name: Run bridge adversarials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/quantization/aura_glm53_official_source_admission.py \
            tools/quantization/aura_glm53_quantized_representation_trial.py \
            tools/quantization/aura_glm53_official_source_trial_bridge.py \
            tools/quantization/test_aura_glm53_official_source_trial_bridge.py
          python3 -m unittest -v tools.quantization.test_aura_glm53_official_source_trial_bridge

      - name: Assert current HOLD and nonpromotion ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.quantization.aura_glm53_official_source_admission import OFFICIAL_COMMIT, current_public_state
          from tools.quantization.aura_glm53_official_source_trial_bridge import classify_official_source_trial
          from tools.quantization.test_aura_glm53_official_source_trial_bridge import request, comparison
          req = request(OFFICIAL_COMMIT)
          out = classify_official_source_trial(source_state=current_public_state(), request=req, comparison=comparison(req))
          assert out.model_revision_matches_official_source is True
          assert out.trial_internal_byte_domain_bound is True
          assert out.official_source_headers_trial_eligible is False
          assert out.official_source_byte_domain_bound_to_trial is False
          assert out.candidate_materialization_owner_bound is False
          assert out.official_source_trial_admissible is False
          assert out.disposition == 'HOLD_OFFICIAL_INDEX_HEADER_EVIDENCE'
          assert out.semantic_k27_authority is False
          assert out.native_private_transformer_kv_accessed is False
          assert out.gate10_promoted is False
          assert out.deployment_authorized is False
          print('OFFICIAL_SOURCE_TRIAL_CURRENT_HOLD=true')
          PY

      - name: Emit consequence ceiling
        run: |
          cat <<'EOF'
          TRIAL_MODEL_REVISION_LABEL_NE_OFFICIAL_SOURCE_PROVENANCE=true
          TRIAL_INTERNAL_BYTE_DOMAIN_NE_OFFICIAL_SOURCE_BYTE_DOMAIN_BINDING=true
          HEADER_TRIAL_ELIGIBLE_NE_CANDIDATE_MATERIALIZATION_OWNER_BOUND=true
          OFFICIAL_SOURCE_TRIAL_ADMISSIBLE=false
          REAL_GLM53_QUANTIZATION_PERFORMED=false
          GENERALIZED_QUALITY_PROVEN=false
          RUNTIME_PERFORMANCE_PROVEN=false
          OWNER_HOST_AUTHENTICATED=false
          PHYSICAL_IO_PROVEN=false
          SEMANTIC_K27_AUTHORITY=false
          NATIVE_PRIVATE_TRANSFORMER_KV_ACCESSED=false
          GATE10_PROMOTED=false
          DEPLOYMENT_AUTHORIZED=false
          EOF
