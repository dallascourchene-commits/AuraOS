name: PR184 final map sync

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - .github/workflows/pr184-final-map-sync.yml

permissions:
  contents: write

concurrency:
  group: pr184-final-map-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: b6bd1a3881545ae36a4dae28e242a5a7873531c9
      TARGET_BRANCH: work/construction-arena-real-asset-pack-g4-20260722
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate maps and publish exact outcome
        shell: bash
        run: |
          set -u
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE_SHA"
          test "${GITHUB_REF_NAME}" = "$TARGET_BRANCH"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

          rm .github/workflows/pr184-final-map-sync.yml
          : >/tmp/pr184-map-sync.log
          python aura_codebase_navigator.py >>/tmp/pr184-map-sync.log 2>&1
          navigator_rc=$?
          verify_rc=99
          hygiene_rc=99
          if [ "$navigator_rc" -eq 0 ]; then
            python -m aura_codemap_verify --compare-json .aura/CODEMAP.json >>/tmp/pr184-map-sync.log 2>&1
            verify_rc=$?
          fi
          if [ "$navigator_rc" -eq 0 ] && [ "$verify_rc" -eq 0 ]; then
            if grep -qE 'pr184-final-remediation|pr184-final-map-sync|remediation\.log' .aura/CODEMAP.json; then
              echo "stale temporary path remains in CODEMAP" >>/tmp/pr184-map-sync.log
              hygiene_rc=1
            else
              git diff --check >>/tmp/pr184-map-sync.log 2>&1
              hygiene_rc=$?
            fi
          fi

          git config user.name "AuraOS CODEMAP Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "$navigator_rc" -eq 0 ] && [ "$verify_rc" -eq 0 ] && [ "$hygiene_rc" -eq 0 ]; then
            rm -f .aura/pr184-map-sync-failure.json
            git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json .github/workflows/pr184-final-map-sync.yml .aura/pr184-map-sync-failure.json
            git commit -m "docs: regenerate final PR184 maps"
          else
            git reset --hard "$GITHUB_SHA"
            mkdir -p .aura
            NAVIGATOR_RC="$navigator_rc" VERIFY_RC="$verify_rc" HYGIENE_RC="$hygiene_rc" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "version": "PR184_FINAL_MAP_SYNC_FAILURE_V1",
              "navigator_rc": int(os.environ["NAVIGATOR_RC"]),
              "verify_rc": int(os.environ["VERIFY_RC"]),
              "hygiene_rc": int(os.environ["HYGIENE_RC"]),
              "log_tail": Path("/tmp/pr184-map-sync.log").read_text(
                  encoding="utf-8", errors="replace"
              )[-8000:],
          }
          Path(".aura/pr184-map-sync-failure.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            git add .aura/pr184-map-sync-failure.json
            git commit -m "chore(review): record final PR184 map sync failure"
          fi

          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${TARGET_BRANCH}"
