name: SCO Phase 2 E4-E6 Finalize

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: sco-phase2-finalize-refactor-sco-construction-e4-e6
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Fetch exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1 coverage==7.9.2 ruff==0.5.0

      - name: Materialize and apply CodeRabbit repairs
        run: |
          python -m py_compile \
            tools/sco_phase2_materialize.py \
            tools/sco_phase2_apply_review_fixes.py \
            tools/sco_phase2_transformer_preflight.py \
            tools/sco_phase2_transformer_postflight.py \
            tools/sco_phase2_randomized_probe.py
          python tools/sco_phase2_materialize.py
          python tools/sco_phase2_transformer_preflight.py
          python -m py_compile tools/sco_phase2_apply_review_fixes.py
          python tools/sco_phase2_apply_review_fixes.py

      - name: Compile and statically verify canonical files
        run: |
          python -m py_compile \
            aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py \
            tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          python -m compileall -q \
            aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py
          ruff check --select E9,F63,F7,F82,F401,F811,B006 \
            aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py \
            tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          git diff --check

      - name: Run focused suite and measured coverage
        run: |
          python -m pytest --collect-only -q \
            tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py | tee /tmp/sco-collect.txt
          COLLECTED="$(grep -Eo '[0-9]+ tests collected' /tmp/sco-collect.txt | tail -1 | awk '{print $1}')"
          test "${COLLECTED:-0}" -ge 138
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          python -m coverage report \
            --include='aura_construction_contracts.py,aura_construction_state.py,aura_construction_authority.py' \
            --fail-under=90

      - name: Run canonical owner regressions
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py tests/test_aura_workflow_authority_bridge.py \
            tests/test_aura_workflow_gates.py tests/test_p1_1_adversarial_review.py

      - name: Run randomized deterministic replay
        run: PYTHONPATH=. python tools/sco_phase2_randomized_probe.py

      - name: Record verified evidence
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          block = f'''\n## Exact-branch CodeRabbit/manual repair validation\n\n- reviewed_trigger_sha: `{os.environ["REVIEWED_SHA"]}`\n- CodeRabbit actionable threads examined: 15\n- focused Construction tests: at least 138 PASS\n- focused Construction statement coverage: PASS at or above 90%\n- canonical owner regressions: PASS\n- deterministic randomized histories: 250 PASS\n- staging payloads and one-run tooling: removed before final topology\n- authority boundary: proposal-only; human physical release remains mandatory\n'''
          marker = '## Exact-branch CodeRabbit/manual repair validation'
          for name in (
              'docs/AURA_CROSS_ARENA_CHANGE_HANDOFF_LOG.md',
              'docs/AURA_SCO_CONSTRUCTION_ARENA_EMERGENT_REFACTOR_ADDENDUM.md',
              'docs/AURA_SCO_CONSTRUCTION_CAPABILITY_REUSE_MATRIX.md',
              'docs/AURA_SCO_PHASE2_E4_E6_REVIEW_EVIDENCE.md',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  raise SystemExit(f'duplicate validation marker: {name}')
              path.write_text(text.rstrip() + '\n' + block, encoding='utf-8')
          PY

      - name: Remove staging machinery and restore shared workflow
        run: |
          rm -rf .aura/phase2_payload
          rm -f \
            tools/sco_phase2_materialize.py tools/sco_phase2_fatal_lint.py \
            tools/sco_phase2_randomized_probe.py tools/sco_phase2_apply_review_fixes.py \
            tools/sco_phase2_transformer_preflight.py tools/sco_phase2_transformer_postflight.py
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/sync-analysis-codemap.yml
          cat > .github/workflows/sco-phase2-finalize.yml <<'YAML'
          name: SCO Construction E4-E6 Audit

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            audit:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'
                - run: |
                    python -m pip install -r requirements.txt
                    python -m pip install pytest==8.4.1 coverage==7.9.2 ruff==0.5.0
                - run: |
                    python -m py_compile aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py
                    ruff check --select E9,F63,F7,F82,F401,F811,B006 aura_construction_contracts.py aura_construction_state.py aura_construction_authority.py
                    python -m coverage erase
                    python -m coverage run -m pytest -q tests/test_aura_construction_contracts.py tests/test_aura_construction_state.py tests/test_aura_construction_authority.py
                    python -m coverage report --include='aura_construction_contracts.py,aura_construction_state.py,aura_construction_authority.py' --fail-under=90
                    python aura_codemap_verify.py --repo-root .
          YAML

      - name: Regenerate and verify final topology
        run: |
          test -f aura_construction_contracts.py
          test -f aura_construction_state.py
          test -f aura_construction_authority.py
          test ! -e .aura/phase2_payload
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
          git diff --check

      - name: Publish clean reviewed tree over live branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: refactor/sco-construction-e4-e6
        run: |
          git config user.name 'AuraOS Phase Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'SCO Construction Arena E4-E6 reviewed vertical slice [skip ci]'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REMOTE_REF="refs/remotes/origin/${TARGET_BRANCH}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:${REMOTE_REF}"
          REMOTE_HEAD="$(git rev-parse "$REMOTE_REF")"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push --force-with-lease="refs/heads/${TARGET_BRANCH}:${REMOTE_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
