name: SCO Phase 2 E4-E6 Finalize

on:
  push:
    branches:
      - refactor/sco-construction-e4-e6
    paths:
      - '.aura/phase2_payload/**'
      - 'tools/sco_phase2_materialize.py'
      - 'tools/sco_phase2_fatal_lint.py'
      - 'tools/sco_phase2_randomized_probe.py'
      - '.github/workflows/sco-phase2-finalize.yml'

permissions:
  contents: write

concurrency:
  group: sco-phase2-e4-e6-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sco-construction-e4-e6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install focused test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Materialize exact reviewed files
        run: python tools/sco_phase2_materialize.py
      - name: Compile gates
        run: |
          python -m py_compile \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
          python -m compileall -q \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
      - name: Fatal Ruff lint
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_construction_contracts.py \
            aura_construction_state.py \
            aura_construction_authority.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
      - name: Manual-equivalent fatal lint
        run: python tools/sco_phase2_fatal_lint.py
      - name: Focused E4-E6 adversarial tests
        run: |
          python -m pytest -q \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py
      - name: Canonical dependency regressions
        run: |
          python -m pytest -q \
            tests/test_aura_event_contracts.py \
            tests/test_aura_event_privacy_hardening.py \
            tests/test_aura_relational_authority.py \
            tests/test_aura_workflow_authority_bridge.py \
            tests/test_aura_workflow_gates.py \
            tests/test_p1_1_adversarial_review.py
      - name: Randomized deterministic replay
        run: python tools/sco_phase2_randomized_probe.py
      - name: Remove one-time transfer and finalization machinery
        run: |
          rm -rf .aura/phase2_payload
          rm -f tools/sco_phase2_materialize.py
          rm -f tools/sco_phase2_fatal_lint.py
          rm -f tools/sco_phase2_randomized_probe.py
          rm -f .github/workflows/sco-phase2-finalize.yml
      - name: Regenerate and verify Aura topology from final tree
        run: |
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
      - name: Final tree checks
        run: |
          test -f aura_construction_contracts.py
          test -f aura_construction_state.py
          test -f aura_construction_authority.py
          test -f tests/test_aura_construction_contracts.py
          test -f tests/test_aura_construction_state.py
          test -f tests/test_aura_construction_authority.py
          test ! -e .aura/phase2_payload
          test ! -e .github/workflows/sco-phase2-finalize.yml
          git diff --check
      - name: Commit verified phase branch
        run: |
          git config user.name 'AuraOS Phase Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'SCO Construction Arena E4-E6 verified vertical slice [skip ci]'
          git push origin HEAD:refactor/sco-construction-e4-e6
