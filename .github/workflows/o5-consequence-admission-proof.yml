name: O5 Consequence Admission Proof

on:
  pull_request:
    paths:
      - "tools/arena/consequence_admission_kernel.py"
      - "tests/test_consequence_admission_kernel.py"
      - ".github/workflows/o5-consequence-admission-proof.yml"
  push:
    branches:
      - "arena/o5-consequence-admission-kernel-20260903-sol"

permissions:
  contents: read

jobs:
  proof:
    name: O5 proof (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Fetch exact semantic head without persisted credentials
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AURA_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          test -n "$AURA_GITHUB_TOKEN"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$AURA_GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="$auth_header" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset auth_header AURA_GITHUB_TOKEN
          git checkout --detach FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "credential extraheader persisted after fetch" >&2
            exit 1
          fi
          origin_url="$(git remote get-url origin)"
          case "$origin_url" in
            "https://github.com/${GITHUB_REPOSITORY}"|"https://github.com/${GITHUB_REPOSITORY}.git") ;;
            *)
              echo "unexpected or credential-bearing origin URL" >&2
              exit 1
              ;;
          esac
          printf 'exact_checkout_head=%s\n' "$actual"
          printf 'credential_isolation=verified\n'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile O5 source and regression suite
        run: |
          python -m py_compile tools/arena/consequence_admission_kernel.py tests/test_consequence_admission_kernel.py
      - name: Run O5 consequence-admission regression suite
        env:
          PYTHONHASHSEED: "0"
        run: python -m unittest -v tests.test_consequence_admission_kernel
