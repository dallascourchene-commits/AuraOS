name: Construction Demo Asset Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/construction-demo-asset-foundation.yml"
      - ".github/workflows/ci.yml"
      - "aura_construction_demo_contracts.py"
      - "aura_coding_relationship_compass.py"
      - "aura_relational_index.py"
      - "scripts/aura_fetch_construction_demo_source.py"
      - "scripts/aura_ifc_storey_index.py"
      - "scripts/aura_verify_construction_demo_assets.py"
      - "scripts/aura_prepare_construction_demo_assets.py"
      - "scripts/aura_mesh_to_gaussian.py"
      - "tests/test_aura_construction_demo_contracts.py"
      - "tests/test_aura_fetch_construction_demo_source.py"
      - "tests/test_aura_ifc_storey_index.py"
      - "tests/test_aura_verify_construction_demo_assets.py"
      - "tests/test_aura_prepare_construction_demo_assets.py"
      - "tests/test_aura_mesh_to_gaussian.py"
      - "tests/test_aura_coding_relationship_compass.py"
      - "tests/test_aura_relational_index.py"
      - "demo_assets/construction_tuwien/**"
      - "docs/AURA_CONSTRUCTION_ARENA_*.md"
      - "docs/patches/AURA_CONSTRUCTION_G0_COMPASS_RESOLVER_FIX.patch"
      - "tools/construction_demo_assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-demo-assets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  asset-foundation:
    name: Verify deterministic asset foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact checkout and emit base tree
        run: |
          test -f aura_construction_demo_contracts.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse 'HEAD^{tree}'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "pytest>=8.2.0,<9.0" \
            "ruff>=0.12.0,<1.0"
      - name: Compile Construction asset foundation
        run: |
          python -m py_compile \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_ifc_storey_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_ifc_storey_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Validate pinned source manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_construction_demo_contracts import (
              CC_BY_4_0,
              ConstructionDemoSourceManifest,
              TU_WIEN_DOI,
              TU_WIEN_SOURCE_FILENAME,
          )

          path = Path("demo_assets/construction_tuwien/source/source-manifest.json")
          manifest = ConstructionDemoSourceManifest.from_dict(
              json.loads(path.read_text(encoding="utf-8"))
          )
          assert manifest.source_manifest_digest == "22bd970d5babc6ad2d6a22ca2c278738"
          assert manifest.doi == TU_WIEN_DOI
          assert manifest.source_filename == TU_WIEN_SOURCE_FILENAME
          assert manifest.license_id == CC_BY_4_0
          assert manifest.source_byte_length == 7_404_420
          assert manifest.observed_sha256 == (
              "29945f654c636d758a95b66eb0e107ec35afc7e1c7857a7ff652586e7728ba29"
          )
          assert manifest.external_fetch_required_at_runtime is False
          assert manifest.survey_authority is False
          print(manifest.source_manifest_digest)
          PY
      - name: Run focused Construction and resolver tests
        run: |
          python -m pytest -q \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py