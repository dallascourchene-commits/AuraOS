name: Construction Demo Manual Archive Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/construction-demo-asset-foundation.yml"
      - ".aura/manual-remediation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate exact checked-out tree
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -f .aura/manual-remediation/chunk00
          test -f .aura/manual-remediation/chunk06c
      - name: Verify every manually staged segment
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected.sha256" <<'EOF'
          f6099a0ab985a99ded3f39a5dc18ec1dd5ad77acad3913fa0444d2cde9230fc4  .aura/manual-remediation/chunk00
          ce1661faedc8f13a59888afd6630469ae09d82672b7bafa2971afc766335b89a  .aura/manual-remediation/chunk01
          2eab4af5b553281e600cc095a76ee9dba23be6e79aac8baf6395fabb4792a64e  .aura/manual-remediation/chunk02
          97deb77301ee9189d547d87274a5bf3d160ad62134dd3838e64be286e32ed528  .aura/manual-remediation/chunk03
          50df2568af7f9b49e15483c464713ab9abadf1f83b495c5195d4eaaa975a1556  .aura/manual-remediation/chunk04a
          de7ee0ed038c9ca5fa67f70179adb42e26195b59bca624bb541042d631d53d50  .aura/manual-remediation/chunk04b
          31f030b2a899b58bc441ed6244657ac85d5a84b5b67f65c176c24eaab53115d4  .aura/manual-remediation/chunk04c
          16a35496e49ed57de78ff4e3e96a4d01b98a0cdeeb8470f76a6d86214def6bda  .aura/manual-remediation/chunk04d
          caad09c2c8dc4d98466aef52be988bb917e5fc1cabce0c652a28b04a420b0544  .aura/manual-remediation/chunk05a
          c27abed206356a4f44d749e72223b28138cc885cbbf99daada44246ad4036093  .aura/manual-remediation/chunk05b
          ca0243e4fd810c83f10ef0314b3e87afd5567ab8bd45cdcc6cd851f272b0eb28  .aura/manual-remediation/chunk05c
          0916fb18e73ede953a62c14178ee09763cdb25d94c1afdee2195dfb57dd7893b  .aura/manual-remediation/chunk05d
          22d2c4638de618de09391d6d356afcbb5bc71b60554090048fdb92315d2b11b1  .aura/manual-remediation/chunk06a
          8e34ec7749dd7b86db78bbbc72e7029ab9c118d5aa04be7589590752ed45e960  .aura/manual-remediation/chunk06b
          7337e2164e16b19397487b79d257c083726e0a9a04605c5f7c6cb6fe915e8fc2  .aura/manual-remediation/chunk06c
          EOF
          sha256sum --check --strict "${RUNNER_TEMP}/expected.sha256"
          cat \
            .aura/manual-remediation/chunk00 \
            .aura/manual-remediation/chunk01 \
            .aura/manual-remediation/chunk02 \
            .aura/manual-remediation/chunk03 \
            .aura/manual-remediation/chunk04a \
            .aura/manual-remediation/chunk04b \
            .aura/manual-remediation/chunk04c \
            .aura/manual-remediation/chunk04d \
            .aura/manual-remediation/chunk05a \
            .aura/manual-remediation/chunk05b \
            .aura/manual-remediation/chunk05c \
            .aura/manual-remediation/chunk05d \
            .aura/manual-remediation/chunk06a \
            .aura/manual-remediation/chunk06b \
            .aura/manual-remediation/chunk06c \
            > "${RUNNER_TEMP}/archive.b64"
          base64 --decode "${RUNNER_TEMP}/archive.b64" > "${RUNNER_TEMP}/archive.tar.gz"
          sha256sum "${RUNNER_TEMP}/archive.tar.gz"
          echo "fb4619fad614910a37b5526aa42db7abe5b861eebd293c365b142b66f40a8c8d  ${RUNNER_TEMP}/archive.tar.gz" | sha256sum --check --strict
