name: Kinetic Audio Multirate D0 Proof

on:
  pull_request:
    paths:
      - "tools/arena/kinetic_audio_multirate_donor.py"
      - "tools/arena/campaign_kinetic_audio_multirate_donor.py"
      - "tests/test_kinetic_audio_multirate_donor.py"
      - "docs/arena/kinetic-audio-multirate-donor.md"
      - ".github/workflows/kinetic-audio-multirate-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-d0-proof:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile donor
        run: |
          python -m py_compile \
            tools/arena/kinetic_audio_multirate_donor.py \
            tools/arena/campaign_kinetic_audio_multirate_donor.py \
            tests/test_kinetic_audio_multirate_donor.py
      - name: Focused multirate proof
        run: python -m unittest -q tests.test_kinetic_audio_multirate_donor
      - name: HS1000 Omega8 13D K27 proof
        run: |
          python -m tools.arena.campaign_kinetic_audio_multirate_donor > kinetic-audio-proof.json
          python - <<'PY'
          import json
          p = json.load(open("kinetic-audio-proof.json", encoding="utf-8"))
          assert p["hs1000"]["cases"] == 1000
          assert p["hs1000"]["oracle_mismatches"] == 0
          assert p["hs1000"]["compound_root"] == "2922afa6c2fade78f002dac0b988f07e0fce47bd027473a79b8e67ac637fa037"
          assert p["hs1000"]["stream_sha256"] == "8a69834887323acca9f246892063cff39977b07a1168a40d6005847ac70a6c5b"
          assert p["k27"]["coordinates"] == 27
          assert p["k27"]["projection_root"] == "52a65d2493cc3729052032688eb2ca73ff0bbf31467d04bdd57da4a11f4d6293"
          assert p["lattice"]["omega8_states"] == 6561
          assert p["lattice"]["omega8"]["READY"] == 1
          assert p["lattice"]["omega8_routing_variations"] == 0
          assert p["lattice"]["omega8_root"] == "b8530f86db387c4cf4dabc48417a8c4b7e6b3c7ca032929f8e9ec4583c3656b3"
          assert p["lattice"]["states13d"] == 1594323
          assert p["lattice"]["counts13d"]["READY"] == 1
          assert p["lattice"]["hard_invalid_repairs"] == 0
          assert p["lattice"]["routing_decision_variations"] == 0
          assert p["lattice"]["root13d"] == "766d24a06f2cf2a160ec7b4f62c0d315665ea69e6456a460fd8e4e955a2b48bf"
          assert p["replay_equal"] is True
          assert p["replay_root"] == "dee37b300c38283c57107ab1e75d7f6a99914872071ccb40b187285f459437b8"
          assert p["deterministic_root"] == "90bf9361900b7dfcea1d06de270f05abdb861690c4d50e01d24268a63c91702d"
          assert p["synthetic_callback_benchmark_empty"]["control_path_blocks"] == 0
          assert p["synthetic_callback_benchmark_control"]["control_path_blocks"] == 5000
          assert p["authority_ceiling"] == "D0_PROCESS_LEVEL_ONLY__NO_DEVICE_XRUN_CREDIT"
          PY
      - name: Verify proof leaves tracked tree clean
        run: git diff --exit-code
