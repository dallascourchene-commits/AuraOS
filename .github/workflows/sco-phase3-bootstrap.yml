name: SCO Phase 3 Plaintext Bootstrap

on:
  push:
    branches:
      - refactor/sco-construction-e7-e8

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sco-construction-e7-e8
      - name: Assemble exact plaintext source files
        run: |
          cat \
            .aura/bootstrap/aura_construction_adapter.part01 \
            .aura/bootstrap/aura_construction_adapter.part02 \
            .aura/bootstrap/aura_construction_adapter.part03 \
            .aura/bootstrap/aura_construction_adapter.part04 \
            > aura_construction_adapter.py
          cat \
            .aura/bootstrap/aura_construction_fixtures.part01 \
            .aura/bootstrap/aura_construction_fixtures.part02 \
            > aura_construction_fixtures.py
          rm -rf .aura/bootstrap
          rm .github/workflows/sco-phase3-bootstrap.yml
          python -m py_compile \
            aura_construction_adapter.py \
            aura_construction_fixtures.py \
            aura_construction_benchmark.py
      - name: Commit bounded Phase 3 implementation
        run: |
          git config user.name "AuraOS Phase 3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_construction_adapter.py \
            aura_construction_fixtures.py \
            aura_construction_benchmark.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            .github/workflows/sco-phase3-advisory-runtime.yml \
            docs/AURA_SCO_PHASE3_E7_E8_EXECUTION_PLAN.md \
            .aura/bootstrap \
            .github/workflows/sco-phase3-bootstrap.yml
          git commit -m "feat: add SCO construction E7-E8 advisory runtime"
          git push origin HEAD:refactor/sco-construction-e7-e8
