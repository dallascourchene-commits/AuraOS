name: Aura Architecture Harness Export

on:
  push:
    branches:
      - "analysis/aura-harness-export/**"
    paths:
      - ".aura/HARNESS_EXPORT_REQUEST"

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact request commit without submodule interpretation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Archive all Git-tracked files and provenance
        run: |
          git archive --format=zip --prefix=AuraOS/ --output=AuraOS-full-repository.zip HEAD
          sha256sum AuraOS-full-repository.zip > AuraOS-full-repository.zip.sha256
          git ls-files -z | tr -cd '\0' | wc -c > AuraOS-full-repository.tracked-file-count.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_branch": os.environ["GITHUB_REF_NAME"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "archive": "AuraOS-full-repository.zip",
              "authority": "read_only_export",
          }
          Path("AuraOS-harness-export-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-branch-export-${{ env.SOURCE_SHA }}
          path: |
            AuraOS-full-repository.zip
            AuraOS-full-repository.zip.sha256
            AuraOS-full-repository.tracked-file-count.txt
            AuraOS-harness-export-manifest.json
          if-no-files-found: error
          retention-days: 2
      - name: Publish discoverable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="aura-architecture-harness-export" \
            -f description="Run ${GITHUB_RUN_ID}; branch ${GITHUB_REF_NAME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
