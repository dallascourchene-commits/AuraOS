name: Aura Architecture Harness Export

on:
  push:
    branches:
      - "analysis/aura-harness-export/**"
    paths:
      - ".aura/HARNESS_EXPORT_REQUEST"

permissions:
  contents: write
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact publication branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hash-pinned final patch
        env:
          BASE_SHA: "489baef6fc9c0363d5b71c4080efcb7c234e5a39"
          EXPECTED_PATCH_SHA256: "1e849b80739f3ce6221ecd3419d73ab15f7675f824aefca1387ab3b2f68fad96"
          EXPECTED_WORKFLOW_SHA256: "11a35f5951268411d7ee6d818260c6896d672ba03296906b9d9bc6b6a6062cbf"
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "analysis/aura-harness-export/20260722-ai-safe-watchdog-final2"
          cat .aura/AI_SAFE_FINAL_PATCH.part-*.b64 | base64 --decode > /tmp/ai-safe-final.patch.xz
          echo "${EXPECTED_PATCH_SHA256}  /tmp/ai-safe-final.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/ai-safe-final.patch.xz > /tmp/ai-safe-final.patch
          git apply --check /tmp/ai-safe-final.patch
          git apply /tmp/ai-safe-final.patch
          base64 --decode .aura/AI_SAFE_FINAL_WORKFLOW.b64 > /tmp/aura-architecture-harness-export.yml
          echo "${EXPECTED_WORKFLOW_SHA256}  /tmp/aura-architecture-harness-export.yml" | sha256sum --check --strict
          mv /tmp/aura-architecture-harness-export.yml .github/workflows/aura-architecture-harness-export.yml
          rm .aura/AI_SAFE_FINAL_PATCH.part-*.b64
          rm .aura/AI_SAFE_FINAL_WORKFLOW.b64
          rm .aura/HARNESS_EXPORT_REQUEST
      - name: Verify focused implementation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m py_compile scripts/aura_architecture_harness.py tests/test_aura_architecture_harness.py
          pytest -q tests/test_aura_architecture_harness.py
          git diff --check -- \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py \
            .github/workflows/aura-architecture-harness-export.yml \
            README.md USER_GUIDE.md .aura/ARCHITECTURE.md \
            docs/AURA_ARCHITECTURE_HARNESS.md
      - name: Commit exact seven-file result
        env:
          BASE_SHA: "489baef6fc9c0363d5b71c4080efcb7c234e5a39"
        run: |
          set -euo pipefail
          git config user.name "Aura Architecture Harness Publisher"
          git config user.email "aura-harness@users.noreply.github.com"
          git add -A -- \
            .aura \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py \
            .github/workflows/aura-architecture-harness-export.yml \
            README.md USER_GUIDE.md \
            docs/AURA_ARCHITECTURE_HARNESS.md
          git commit -m "feat: add AI-safe architecture harness handoff and watchdog"
          EXPECTED="$(printf '%s\n' \
            .aura/ARCHITECTURE.md \
            .github/workflows/aura-architecture-harness-export.yml \
            README.md \
            USER_GUIDE.md \
            docs/AURA_ARCHITECTURE_HARNESS.md \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py | sort)"
          ACTUAL="$(git diff --name-only "${BASE_SHA}..HEAD" | sort)"
          test "${ACTUAL}" = "${EXPECTED}"
          ! printf '%s\n' "${ACTUAL}" | grep -E '(^|/)(CODEMAP\.(json|md)|topology_map\.json|live_topology_ast\.json)$'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish materializer status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="ai-safe-harness-materialize" \
            -f description="AI-safe harness watchdog publication ${STATE}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
