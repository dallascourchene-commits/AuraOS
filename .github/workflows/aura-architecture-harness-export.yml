name: Aura Architecture Harness Export

on:
  push:
    branches:
      - "analysis/aura-harness-export/**"
    paths:
      - ".aura/HARNESS_EXPORT_REQUEST"

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact current main and request harness without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin \
            refs/heads/main:refs/remotes/origin/main
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin \
            "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/harness-request"
          unset AUTH_HEADER

          REQUEST_SHA="$(git rev-parse refs/remotes/origin/harness-request)"
          test "$REQUEST_SHA" = "$GITHUB_SHA"
          REQUEST_TOOLS_DIR="${RUNNER_TEMP}/AuraOS-request-tools"
          mkdir -p "$REQUEST_TOOLS_DIR"
          git archive "$REQUEST_SHA" | tar -x -C "$REQUEST_TOOLS_DIR"
          python -m py_compile \
            "$REQUEST_TOOLS_DIR/scripts/aura_architecture_harness.py" \
            "$REQUEST_TOOLS_DIR/scripts/aura_exact_head_transport.py"

          git checkout --detach refs/remotes/origin/main
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "REQUEST_HARNESS_SHA=$REQUEST_SHA" >> "$GITHUB_ENV"
          echo "REQUEST_TOOLS_DIR=$REQUEST_TOOLS_DIR" >> "$GITHUB_ENV"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Archive exact clean main outside checkout
        run: |
          FULL_EXPORT_DIR="${RUNNER_TEMP}/AuraOS-full-export"
          DIAGNOSTICS_DIR="${RUNNER_TEMP}/AuraOS-export-diagnostics"
          python "$REQUEST_TOOLS_DIR/scripts/aura_exact_head_transport.py" \
            --repo-root . \
            export \
            --expected-head "$SOURCE_SHA" \
            --output-dir "$FULL_EXPORT_DIR" \
            --diagnostics-dir "$DIAGNOSTICS_DIR"
          cp "$REQUEST_TOOLS_DIR/scripts/aura_architecture_harness.py" \
            "$FULL_EXPORT_DIR/AuraOS-request-harness.py"
          (
            cd "$FULL_EXPORT_DIR"
            sha256sum AuraOS-request-harness.py > AuraOS-request-harness.py.sha256
          )
          git ls-files -z | tr -cd '\0' | wc -c \
            > "$FULL_EXPORT_DIR/AuraOS-full-repository.tracked-file-count.txt"
          FULL_EXPORT_DIR="$FULL_EXPORT_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["FULL_EXPORT_DIR"])
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_main_sha": os.environ["SOURCE_SHA"],
              "request_commit_sha": os.environ["GITHUB_SHA"],
              "request_harness_sha": os.environ["REQUEST_HARNESS_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "archive": "AuraOS-full-repository.zip",
              "request_harness": "AuraOS-request-harness.py",
              "authority": "read_only_export",
          }
          (output / "AuraOS-harness-export-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload exact repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-architecture-harness-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-full-repository.zip
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-full-repository.zip.sha256
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-full-repository.tracked-file-count.txt
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-request-harness.py
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-request-harness.py.sha256
            ${{ runner.temp }}/AuraOS-full-export/AuraOS-harness-export-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Build AI-first bounded review handoff
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          AI_HANDOFF_DIR="${RUNNER_TEMP}/AuraOS-ai-handoff"
          python "$REQUEST_TOOLS_DIR/scripts/aura_architecture_harness.py" \
            --repo-root . \
            handoff \
            --output-dir "$AI_HANDOFF_DIR"
          test -f "$AI_HANDOFF_DIR/ai_handoff_manifest.json"
          test -f "$AI_HANDOFF_DIR/ai_review_files.txt"
          test -f "$AI_HANDOFF_DIR/ai_source_review.zip"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload AI-first bounded review artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-ai-review-first-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/AuraOS-ai-handoff/ai_handoff_manifest.json
            ${{ runner.temp }}/AuraOS-ai-handoff/ai_review_files.txt
            ${{ runner.temp }}/AuraOS-ai-handoff/ai_source_review.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics outside checkout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-harness-failure-${{ github.sha }}
          path: ${{ runner.temp }}/AuraOS-export-diagnostics
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish discoverable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="success"
          if [ "${{ job.status }}" != "success" ]; then STATE="failure"; fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="aura-architecture-harness-export" \
            -f description="Run ${GITHUB_RUN_ID}; main ${SOURCE_SHA:-unavailable}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
