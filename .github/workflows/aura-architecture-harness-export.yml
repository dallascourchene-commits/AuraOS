name: Aura AI-safe Harness Publisher (temporary)

on:
  push:
    branches:
      - "analysis/aura-harness-export/20260722-ai-safe-publisher"
    paths:
      - ".aura/HARNESS_EXPORT_REQUEST"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout checksum-bound staging request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Publish verified single-commit patch
        env:
          EXPECTED_BASE: 489baef6fc9c0363d5b71c4080efcb7c234e5a39
          EXPECTED_TARGET_HEAD: d29abcfc192478b6f1450ac936bf35f36c0b132a
          EXPECTED_BUNDLE_SHA256: aa081372235e63303691cc076b29b560f52d6d7497097b788811829d1abdcf7a
          TARGET_BRANCH: work/ai-safe-architecture-harness-20260722
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          cat .aura/ai-safe-publish/chunk-*.b64 > /tmp/aura-ai-safe-publish.tar.xz.b64
          base64 --decode /tmp/aura-ai-safe-publish.tar.xz.b64 > /tmp/aura-ai-safe-publish.tar.xz
          echo "$EXPECTED_BUNDLE_SHA256  /tmp/aura-ai-safe-publish.tar.xz" | sha256sum --check -
          python - <<'PY'
          import pathlib
          import subprocess

          allowed = {
              ".aura/ARCHITECTURE.md",
              ".github/workflows/aura-architecture-harness-export.yml",
              "README.md",
              "USER_GUIDE.md",
              "docs/AURA_ARCHITECTURE_HARNESS.md",
              "scripts/aura_architecture_harness.py",
              "tests/test_aura_architecture_harness.py",
          }
          names = subprocess.check_output(
              ["tar", "-tJf", "/tmp/aura-ai-safe-publish.tar.xz"],
              text=True,
          ).splitlines()
          normalized = {pathlib.PurePosixPath(name).as_posix() for name in names}
          assert normalized == allowed, (normalized, allowed)
          for name in normalized:
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute()
              assert ".." not in path.parts
          PY
          git checkout --detach "$EXPECTED_BASE"
          tar -xJf /tmp/aura-ai-safe-publish.tar.xz
          PYTHONDONTWRITEBYTECODE=1 python -m py_compile \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py
          PYTHONDONTWRITEBYTECODE=1 pytest -q tests/test_aura_architecture_harness.py
          git diff --check -- \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py \
            .github/workflows/aura-architecture-harness-export.yml \
            README.md USER_GUIDE.md \
            docs/AURA_ARCHITECTURE_HARNESS.md \
            .aura/ARCHITECTURE.md
          git config user.name "Aura AI-safe Harness Publisher"
          git config user.email "aura-harness@users.noreply.github.com"
          git add -- \
            scripts/aura_architecture_harness.py \
            tests/test_aura_architecture_harness.py \
            .github/workflows/aura-architecture-harness-export.yml \
            README.md USER_GUIDE.md \
            docs/AURA_ARCHITECTURE_HARNESS.md \
            .aura/ARCHITECTURE.md
          git commit -m "feat: add AI-safe architecture harness handoff"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
