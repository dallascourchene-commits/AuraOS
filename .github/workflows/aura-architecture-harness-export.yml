name: Aura AI-Safe Harness Materialization

on:
  push:
    branches:
      - "analysis/aura-harness-export/**"
    paths:
      - ".aura/HARNESS_EXPORT_REQUEST"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact materialization request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and publish reviewed AI-safe harness tree
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="489baef6fc9c0363d5b71c4080efcb7c234e5a39"
          TARGET_BRANCH="work/ai-safe-architecture-harness-20260722"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          cat .aura/ai-safe-publish/b64-* > /tmp/payload.b64
          echo "5e69619c721134ab03383ba60cb1441aebc93efe7b5b4d3983012b15d7f0b972  /tmp/payload.b64" | sha256sum -c -
          base64 -d /tmp/payload.b64 > /tmp/final.patch.xz
          echo "d1edb604e0dd2dac1ea9934f974f0b81963771ee6643ce88f9c85932f9f71041  /tmp/final.patch.xz" | sha256sum -c -
          xz -dc /tmp/final.patch.xz > /tmp/final.patch
          echo "de4979b7067de04b316474b263893610647a8f565ba875da99c9e18d265c8083  /tmp/final.patch" | sha256sum -c -
          git reset --hard "$BASE_SHA"
          git apply --check /tmp/final.patch
          git apply --index /tmp/final.patch
          test "$(git write-tree)" = "c89a6e06c6342f713eb48dc976d0a14ed7745b2a"
          git diff --cached --check
          git config user.name "Aura AI-Safe Harness Publisher"
          git config user.email "aura-ai-safe@users.noreply.github.com"
          git commit -m "feat: add AI-safe architecture harness handoff"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
