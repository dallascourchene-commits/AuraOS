name: Aura GLM53 G3 Abstention Safe Transfer Admission

on:
  pull_request:
    paths:
      - 'tools/awj032/glm53_router_separated_prefetch.py'
      - 'tools/awj032/glm53_prefetch_transfer_admission.py'
      - 'tools/awj032/test_glm53_g3_abstention_safe_transfer_admission.py'
      - '.github/workflows/aura-glm53-g3-abstention-safe-transfer-admission.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONVERGENCE_HEAD: e74bcbaa55f5d4f8b09427293a5638089d5dface
  G2_PARENT_HEAD: 44831fd5454d08a97bd0b172337cf4c48a339dfe
  G2_PARENT_SOURCE_BLOB: eba980416b47fb3b4c2391a915ebe3d9db9bebb4
  G2_PARENT_RUN: '33414707814'
  G2_W3_RUN: '33414707855'
  ABSTENTION_PARENT_HEAD: d0f71761b1d8692cc3797d4d8574b4082f404344
  ABSTENTION_PARENT_SOURCE_BLOB: a19609c986faa7212e364890df901d2ff73ad231
  ABSTENTION_PARENT_RUN: '33415068080'
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  g3-abstention-safe-transfer-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact authenticated checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact two-parent convergence and source anchors
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q --no-tags origin "$CONVERGENCE_HEAD" "$G2_PARENT_HEAD" "$ABSTENTION_PARENT_HEAD"
          git merge-base --is-ancestor "$CONVERGENCE_HEAD" HEAD
          parents="$(git rev-list --parents -n 1 "$CONVERGENCE_HEAD")"
          case "$parents" in
            "$CONVERGENCE_HEAD $G2_PARENT_HEAD $ABSTENTION_PARENT_HEAD"|"$CONVERGENCE_HEAD $ABSTENTION_PARENT_HEAD $G2_PARENT_HEAD") ;;
            *) echo "unexpected G3 convergence parents: $parents"; exit 1 ;;
          esac
          test "$(git rev-parse "$G2_PARENT_HEAD:tools/awj032/glm53_prefetch_transfer_admission.py")" = "$G2_PARENT_SOURCE_BLOB"
          test "$(git rev-parse "$ABSTENTION_PARENT_HEAD:tools/awj032/glm53_router_separated_prefetch.py")" = "$ABSTENTION_PARENT_SOURCE_BLOB"
          grep -q '_canonical_prefetch_expert_ids' tools/awj032/glm53_router_separated_prefetch.py
          grep -q 'PagerResultMustBindExactRequestedExpertsAndSource' tools/awj032/glm53_router_separated_prefetch.py
          grep -q 'if cold_bytes == 0' tools/awj032/glm53_prefetch_transfer_admission.py
          echo 'TRUE_TWO_PARENT_CONVERGENCE=true'
          echo 'G2_COST_ADMISSION_COGNITION_PRESERVED=true'
          echo 'G1_ABSTENTION_COGNITION_PRESERVED=true'
          echo 'G1_POST_READ_W3_GUARD_PRESERVED=true'

      - name: Revalidate exact hosted parent proofs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          expected = {
              int(os.environ['G2_PARENT_RUN']): os.environ['G2_PARENT_HEAD'],
              int(os.environ['G2_W3_RUN']): os.environ['G2_PARENT_HEAD'],
              int(os.environ['ABSTENTION_PARENT_RUN']): os.environ['ABSTENTION_PARENT_HEAD'],
          }
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for run_id, head_sha in expected.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run['head_sha'] == head_sha, (run_id, run['head_sha'], head_sha)
              assert run['status'] == 'completed' and run['conclusion'] == 'success', run
          print('PARENT_HOSTED_PROOFS_EXACT_GREEN=true')
          PY

      - name: Compile composed surfaces
        run: |
          python -m py_compile \
            tools/awj032/glm53_router_separated_prefetch.py \
            tools/awj032/glm53_prefetch_transfer_admission.py \
            tools/awj032/test_glm53_g3_abstention_safe_transfer_admission.py

      - name: Reexecute inherited G1 and G2 adversarial contracts
        run: |
          python -m unittest tools.awj032.test_glm53_router_separated_prefetch -v
          python -m unittest tools.awj032.test_glm53_prefetch_transfer_admission -v

      - name: Execute G3 abstention commutation adversarials
        run: |
          python -m unittest tools.awj032.test_glm53_g3_abstention_safe_transfer_admission -v

      - name: Prove exact zero-transfer planning law
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.awj032.glm53_router_separated_prefetch import PREFETCH_SCHEMA, PrefetchPrediction
          from tools.awj032.glm53_prefetch_transfer_admission import PrefetchTransferPolicy, admit_prefetch_transfers

          prediction = PrefetchPrediction(
              schema=PREFETCH_SCHEMA,
              predictor_generation='predictor:g3:abstain',
              layer_id='layer:g3',
              binding_digest='binding:g3',
              predicted_experts=(),
          )
          policy = PrefetchTransferPolicy(
              policy_generation='policy:g3',
              predictor_calibration_generation='cal:g3',
              layer_id='layer:g3',
              binding_digest='binding:g3',
              effective_storage_bandwidth_bytes_per_second=1_000_000_000.0,
              prefetch_window_seconds=0.01,
              minimum_hit_probability_numerator=3,
              minimum_hit_probability_denominator=4,
              max_logical_prefetch_bytes=8_000_000,
              max_estimated_transfer_energy_joules=1.0,
          )
          receipt = admit_prefetch_transfers(
              prediction=prediction,
              forecasts=(),
              policy=policy,
              num_experts=256,
          )
          assert receipt.predicted_experts == ()
          assert receipt.admitted_experts == ()
          assert receipt.cold_predicted_logical_bytes == 0
          assert receipt.cold_required_reuse_for_window == 0.0
          assert receipt.admitted_logical_bytes == 0
          assert receipt.admitted_logical_transfer_seconds == 0.0
          assert receipt.physical_io_attested is False
          assert receipt.physical_prefetch_bytes is None
          assert receipt.transfer_effect_authorized is False
          assert receipt.g2_admitted is False
          print('PREDICTOR_ABSTENTION_COMMUTES_TO_ZERO_TRANSFER_PLAN=true')
          print('ZERO_TRANSFER_PLAN_NOT_PHYSICAL_SAVINGS_PROOF=true')
          PY

      - name: Consequence ceiling
        run: |
          echo 'PredictionAbstention!=RoutingFailure'
          echo 'EmptyPrediction=>ZeroSpeculativeTransferPlan'
          echo 'ZeroSpeculativeTransferPlan!=ZeroNativeExecutionDemand'
          echo 'ZeroPredictedBytes=>ZeroReuseRequiredNotPhysicalSavingsProof'
          echo 'PagerResultSourceProofStillRequiredForNativeDemandMisses'
          echo 'TransferPlanEligibility!=TransferEffectAuthority!=G2Admission'
          echo 'K27Coordinate!=TransformerKVCache!=RoutingAuthority'
          echo 'NO_MODEL_PROVIDER_HOST_EFFECT=true'
