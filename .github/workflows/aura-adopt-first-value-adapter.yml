name: AURA-ADOPT First-Value Receipt Adapter

on:
  pull_request:
    paths:
      - 'aura_adoption_bootstrap.py'
      - 'tests/test_aura_adoption_bootstrap.py'
      - 'tools/aura_adopt/adoption_friction_receipt.py'
      - 'tools/aura_adopt/test_adoption_friction_receipt.py'
      - 'tools/aura_adopt/first_value_witness_adapter.py'
      - 'tools/aura_adopt/test_first_value_witness_adapter.py'
      - 'tools/aura_adopt/test_first_value_witness_adapter_scalar_privacy.py'
      - '.github/workflows/aura-adopt-first-value-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-value-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile convergence seam
        run: >-
          python -m py_compile
          aura_adoption_bootstrap.py
          tools/aura_adopt/adoption_friction_receipt.py
          tools/aura_adopt/first_value_witness_adapter.py
          tools/aura_adopt/test_first_value_witness_adapter.py
          tools/aura_adopt/test_first_value_witness_adapter_scalar_privacy.py
      - name: Re-run canonical ZF-00B receipt regressions
        run: python -m unittest -v tools.aura_adopt.test_adoption_friction_receipt
      - name: Run witness-to-receipt convergence regressions
        run: python -m unittest -v tools.aura_adopt.test_first_value_witness_adapter
      - name: Run scalar privacy membrane regressions
        run: python -m unittest -v tools.aura_adopt.test_first_value_witness_adapter_scalar_privacy
      - name: Re-run inherited Objective-1 compiler regressions
        run: python -m unittest -v tests.test_aura_adoption_bootstrap
