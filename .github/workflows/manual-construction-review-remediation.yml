name: Publish Manual Construction Review Remediation

on:
  push:
    branches:
      - work/construction-arena-bim-gaussian-demo-20260722
    paths:
      - ".aura/manual-remediation/**"
      - ".github/workflows/manual-construction-review-remediation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-construction-review-remediation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-bim-gaussian-demo-20260722
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reassemble and authenticate manual archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .aura/manual-remediation/chunk00 \
            .aura/manual-remediation/chunk01 \
            .aura/manual-remediation/chunk02 \
            .aura/manual-remediation/chunk03 \
            .aura/manual-remediation/chunk04a \
            .aura/manual-remediation/chunk04b \
            .aura/manual-remediation/chunk04c \
            .aura/manual-remediation/chunk04d \
            .aura/manual-remediation/chunk05a \
            .aura/manual-remediation/chunk05b \
            .aura/manual-remediation/chunk05c \
            .aura/manual-remediation/chunk05d \
            .aura/manual-remediation/chunk06a \
            .aura/manual-remediation/chunk06b \
            .aura/manual-remediation/chunk06c \
            > "${RUNNER_TEMP}/manual-review-remediation.tar.gz.b64"
          base64 --decode "${RUNNER_TEMP}/manual-review-remediation.tar.gz.b64" \
            > "${RUNNER_TEMP}/manual-review-remediation.tar.gz"
          echo "fb4619fad614910a37b5526aa42db7abe5b861eebd293c365b142b66f40a8c8d  ${RUNNER_TEMP}/manual-review-remediation.tar.gz" \
            | sha256sum --check --strict
      - name: Validate allowlist and install exact manual files
        env:
          ARCHIVE: ${{ runner.temp }}/manual-review-remediation.tar.gz
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          root = Path.cwd().resolve()
          expected = {
              ".github/workflows/ci.yml",
              ".github/workflows/construction-demo-asset-foundation.yml",
              "aura_construction_demo_contracts.py",
              "aura_coding_relationship_compass.py",
              "aura_relational_index.py",
              "scripts/aura_verify_construction_demo_assets.py",
              "scripts/aura_prepare_construction_demo_assets.py",
              "scripts/aura_mesh_to_gaussian.py",
              "tests/test_aura_verify_construction_demo_assets.py",
              "tests/test_aura_prepare_construction_demo_assets.py",
              "tests/test_aura_mesh_to_gaussian.py",
              "tests/test_aura_construction_demo_contracts.py",
              "tests/test_aura_coding_relationship_compass.py",
              "tests/test_aura_relational_index.py",
              "demo_assets/construction_tuwien/source/source-manifest.json",
              "docs/AURA_CONSTRUCTION_ARENA_BIM_GAUSSIAN_DEMO_IMPLEMENTATION_LEDGER.md",
              "docs/AURA_CONSTRUCTION_ARENA_G0_CHANGE_GRAPH.md",
          }
          archive = Path(os.environ["ARCHIVE"])
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f"archive allowlist mismatch: {sorted(set(names) ^ expected)}")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member rejected: {member.name}")
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"unsafe archive path rejected: {member.name}")
                  destination = (root / Path(*pure.parts)).resolve(strict=False)
                  try:
                      destination.relative_to(root)
                  except ValueError as exc:
                      raise SystemExit(f"archive path escapes repository: {member.name}") from exc
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member unreadable: {member.name}")
                  payload = source.read()
                  if len(payload) != member.size:
                      raise SystemExit(f"archive member length mismatch: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  temporary = destination.with_name(f".{destination.name}.manual-remediation.tmp")
                  temporary.write_bytes(payload)
                  os.replace(temporary, destination)
          PY
      - name: Install bounded validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "jsonschema>=4.23.0,<5.0" \
            "pytest>=8.2.0,<9.0" \
            "pytest-asyncio>=0.23.0,<1.0" \
            "ruff>=0.12.0,<1.0"
      - name: Compile and lint manually edited files
        run: |
          python -m py_compile \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
          ruff check --select E9,F63,F7,F82 \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Run focused Construction and resolver suite
        run: |
          python -m pytest -q \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Validate canonical source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_construction_demo_contracts import (
              CC_BY_4_0,
              ConstructionDemoSourceManifest,
              TU_WIEN_DOI,
              TU_WIEN_SOURCE_FILENAME,
          )
          manifest = ConstructionDemoSourceManifest.from_dict(
              json.loads(
                  Path("demo_assets/construction_tuwien/source/source-manifest.json")
                  .read_text(encoding="utf-8")
              )
          )
          assert manifest.source_manifest_digest == "22bd970d5babc6ad2d6a22ca2c278738"
          assert manifest.doi == TU_WIEN_DOI
          assert manifest.source_filename == TU_WIEN_SOURCE_FILENAME
          assert manifest.license_id == CC_BY_4_0
          assert manifest.observed_sha256 == "29945f654c636d758a95b66eb0e107ec35afc7e1c7857a7ff652586e7728ba29"
          PY
      - name: Remove all temporary remediation transport
        run: |
          rm -rf .aura/manual-remediation .aura/review-remediation
          rm -f .github/workflows/manual-construction-review-remediation.yml
      - name: Commit exact manually edited source tree
        env:
          BRANCH: work/construction-arena-bim-gaussian-demo-20260722
        run: |
          set -euo pipefail
          git config user.name "AuraOS Manual Review Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(construction): resolve deep review findings manually"
          git push origin "HEAD:${BRANCH}"
