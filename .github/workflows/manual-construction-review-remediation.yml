name: Publish Codex Round 3 Manual Remediation

on:
  push:
    branches:
      - work/construction-arena-bim-gaussian-demo-20260722
    paths:
      - ".aura/apply-pr183-codex-round3"

permissions:
  contents: write

concurrency:
  group: codex-round3-manual-remediation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-bim-gaussian-demo-20260722
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reassemble and authenticate validated payload
        run: |
          set -euo pipefail
          cat \
            .aura/codex-round3-payload/chunk00 \
            .aura/codex-round3-payload/chunk01 \
            .aura/codex-round3-payload/chunk02 \
            .aura/codex-round3-payload/chunk03 \
            > "${RUNNER_TEMP}/codex-round3.tar.gz.b64"
          base64 --decode "${RUNNER_TEMP}/codex-round3.tar.gz.b64" \
            > "${RUNNER_TEMP}/codex-round3.tar.gz"
          echo "8473e6b7f3ecdfce2b98dc933f510885609adb24816796a83f224754ba33770b  ${RUNNER_TEMP}/codex-round3.tar.gz" \
            | sha256sum --check --strict
      - name: Install exact allowlisted manual files
        env:
          ARCHIVE: ${{ runner.temp }}/codex-round3.tar.gz
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os
          import tarfile

          root = Path.cwd().resolve()
          expected = {
              "scripts/aura_prepare_construction_demo_assets.py",
              "scripts/aura_verify_construction_demo_assets.py",
              "scripts/aura_mesh_to_gaussian.py",
              "tests/test_aura_prepare_construction_demo_assets.py",
              "tests/test_aura_verify_construction_demo_assets.py",
              "tests/test_aura_mesh_to_gaussian.py",
          }
          archive = Path(os.environ["ARCHIVE"])
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != expected:
                  raise SystemExit(f"archive allowlist mismatch: {sorted(set(names) ^ expected)}")
              for member in members:
                  if not member.isfile():
                      raise SystemExit(f"non-regular archive member rejected: {member.name}")
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or ".." in pure.parts:
                      raise SystemExit(f"unsafe archive path rejected: {member.name}")
                  destination = (root / Path(*pure.parts)).resolve(strict=False)
                  destination.relative_to(root)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"archive member unreadable: {member.name}")
                  payload = source.read()
                  if len(payload) != member.size:
                      raise SystemExit(f"archive member length mismatch: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  temporary = destination.with_name(f".{destination.name}.codex-round3.tmp")
                  temporary.write_bytes(payload)
                  os.replace(temporary, destination)
          PY
      - name: Synchronize evidence records
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/AURA_CONSTRUCTION_ARENA_G1_SOURCE_AND_CONTRACTS_EVIDENCE.md": {
                  "source_manifest_digest: bda63e3e6d3e536c1dffa51ccb8c7b37":
                      "source_manifest_digest: 22bd970d5babc6ad2d6a22ca2c278738",
              },
              "docs/AURA_CONSTRUCTION_ARENA_G2_G3_ASSET_COMPILER_EVIDENCE.md": {
                  "focused_asset_tests: 54": "focused_asset_tests: 59",
                  "focused_asset_tests_passed: 54": "focused_asset_tests_passed: 59",
                  "Local result: **54 passed**.": "Local result: **59 passed**.",
                  "verification for these 54 tests.": "verification for these 59 tests.",
              },
          }
          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in changes.items():
                  if text.count(old) != 1:
                      raise SystemExit(f"{name}: expected exactly one evidence fragment {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Remove temporary transport
        run: |
          rm -rf .aura/codex-round3-payload
          rm -rf .aura/manual-remediation .aura/review-remediation
          rm -f .aura/apply-pr183-codex-round3
      - name: Install bounded validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "jsonschema>=4.23.0,<5.0" \
            "pytest>=8.2.0,<9.0" \
            "pytest-asyncio>=0.23.0,<1.0" \
            "ruff>=0.12.0,<1.0"
      - name: Compile and lint manually edited files
        run: |
          python -m py_compile \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py
          ruff check --select E9,F63,F7,F82 \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py
      - name: Run complete Construction and resolver gate
        run: |
          python -m pytest -q \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Commit exact manually edited source tree
        env:
          BRANCH: work/construction-arena-bim-gaussian-demo-20260722
        run: |
          set -euo pipefail
          git config user.name "AuraOS Manual Review Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(construction): address third deep Codex review"
          git push origin "HEAD:${BRANCH}"
