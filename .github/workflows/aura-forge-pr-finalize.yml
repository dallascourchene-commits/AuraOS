name: Aura Forge V1 PR Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - aura_forge.py
      - tests/test_aura_forge.py
      - docs/AURA_FORGE.md
      - schemas/aura_forge_arena_evidence_contract.schema.json
      - scripts/finalize_aura_forge_v1.py
      - .github/workflows/aura-forge-pr-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-forge-v1-pr-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aura-forge-verified-engineering-os
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit

      - name: Apply reviewed Forge hardening and canonical documentation
        run: python scripts/finalize_aura_forge_v1.py

      - name: Compile and run focused plus owner regressions
        run: |
          python -m py_compile aura_forge.py tests/test_aura_forge.py
          python -m pytest -q \
            tests/test_aura_forge.py \
            tests/test_aura_external_llm_session.py \
            tests/test_aura_architect_controls_vault_and_surfaces.py
          ruff check --select E9,F63,F7,F82 aura_forge.py tests/test_aura_forge.py
          bandit -q -ll aura_forge.py

      - name: Remove temporary finalization machinery
        run: |
          rm -f scripts/finalize_aura_forge_v1.py
          rm -f .github/workflows/aura-forge-finalize.yml
          rm -f .github/workflows/aura-forge-pr-finalize.yml

      - name: Regenerate and verify CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          python - <<'PY'
          import json
          from pathlib import Path
          codemap = json.loads(Path('.aura/CODEMAP.json').read_text(encoding='utf-8'))
          paths = set(codemap.get('coverage', {}).get('all_included_paths_sorted', []))
          required = {
              'aura_forge.py',
              'docs/AURA_FORGE.md',
              'schemas/aura_forge_arena_evidence_contract.schema.json',
              'tests/test_aura_forge.py',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'Forge files missing from CODEMAP: {missing}')
          PY

      - name: Commit verified source, docs, and generated topology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "Finalize Aura Forge V1 contracts and canonical docs"
          git push origin HEAD:feature/aura-forge-verified-engineering-os
