name: AWJ032 GLM53 MTP External Appraiser

on:
  pull_request:
    paths:
      - 'tools/awj032/mtp_resolver_trust_adapter.py'
      - 'tools/awj032/test_mtp_resolver_trust_adapter.py'
      - '.github/workflows/awj032-glm53-mtp-external-appraiser.yml'
  push:
    branches:
      - 'awj032/glm53-mtp-external-appraiser-20260830'
    paths:
      - 'tools/awj032/mtp_resolver_trust_adapter.py'
      - 'tools/awj032/test_mtp_resolver_trust_adapter.py'
      - '.github/workflows/awj032-glm53-mtp-external-appraiser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-appraiser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run external-appraiser contract
        run: |
          python -m py_compile tools/awj032/mtp_resolver_trust_adapter.py
          python -m unittest -v tools.awj032.test_mtp_resolver_trust_adapter
