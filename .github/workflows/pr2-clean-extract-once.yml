name: PR2 clean source extraction once

on:
  push:
    branches:
      - "analysis/pr2-extract-once"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Reconstruct sealed source transaction
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          test "$(git rev-parse HEAD^)" = "9c04a1efa57461a6078acb9f3b569766cbd2ab24"
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d' | sort | wc -l)" -eq 9
          git reset --hard HEAD
          git clean -fd
      - name: Publish only ordinary source commit to clean PR2 branch
        run: |
          set -euo pipefail
          expected="9c04a1efa57461a6078acb9f3b569766cbd2ab24"
          target="refs/heads/refactor/verified-ephemeral-workspace-pr2-clean"
          remote="$(git ls-remote origin "$target" | cut -f1)"
          test -n "$remote"
          if [ "$remote" != "$expected" ]; then
            git fetch origin "$remote"
            test "$(git rev-parse "$remote^")" = "$expected"
            changed="$(git diff --name-only "$expected" "$remote" | sort)"
            unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.aura/CODEMAP\.json|\.aura/CODEMAP\.md|topology_map\.json)$' || true)"
            test -z "$unexpected"
          fi
          git push --force-with-lease="$target:$remote" origin "HEAD:$target"
