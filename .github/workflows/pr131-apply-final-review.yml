name: PR131 Final Review Reconciliation

on:
  push:
    branches:
      - analysis/architect-benchmark

permissions:
  contents: write

concurrency:
  group: pr131-final-review-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create atomic reconciled commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'analysis/architect-benchmark';
            const decoder = new TextDecoder();

            async function readText(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(response.data) || response.data.type !== 'file') {
                throw new Error(`Expected file at ${path}`);
              }
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            async function blob(text) {
              const response = await github.rest.git.createBlob({
                owner,
                repo,
                content: text,
                encoding: 'utf-8',
              });
              return response.data.sha;
            }

            function replaceOnce(text, before, after, label) {
              if (text.includes(after)) return text;
              if (!text.includes(before)) throw new Error(`Missing ${label} anchor`);
              return text.replace(before, after);
            }

            let session = await readText('aura_external_llm_session.py');
            session = replaceOnce(
              session,
              '    ) -> ExternalLLMTurn | None:\n        task = session.active_task\n',
              '    ) -> ExternalLLMTurn | None:\n        if len(session.turns) >= session.max_turns:\n            return None\n        task = session.active_task\n',
              'build-turn budget',
            );
            session = replaceOnce(
              session,
              '            next_turn = self._build_turn(session, role="worker", failure_packet={})\n            session.pending_turn = next_turn\n            session.status = "WAITING_FOR_MODEL"\n            session.updated_at = time.time()\n            return {\n                "ok": True,\n                "status": session.status,\n                "session": session.public_state(),\n                "stage_result": stage,\n                "verification": verification,\n                "next_turn": next_turn.to_dict() if next_turn else None,\n            }\n',
              '            if len(session.turns) >= session.max_turns:\n                session.pending_turn = None\n                session.status = "BLOCKED_MAX_TURNS"\n                session.updated_at = time.time()\n                return {\n                    "ok": False,\n                    "status": session.status,\n                    "session": session.public_state(),\n                    "stage_result": stage,\n                    "verification": verification,\n                    "next_turn": None,\n                    "error": "max_turns_exceeded",\n                }\n            next_turn = self._build_turn(session, role="worker", failure_packet={})\n            if next_turn is None:\n                session.pending_turn = None\n                session.status = "BLOCKED_NEXT_TURN_UNAVAILABLE"\n                session.updated_at = time.time()\n                return {\n                    "ok": False,\n                    "status": session.status,\n                    "session": session.public_state(),\n                    "stage_result": stage,\n                    "verification": verification,\n                    "next_turn": None,\n                    "error": "unable_to_build_leased_turn",\n                }\n            session.pending_turn = next_turn\n            session.status = "WAITING_FOR_MODEL"\n            session.updated_at = time.time()\n            return {\n                "ok": True,\n                "status": session.status,\n                "session": session.public_state(),\n                "stage_result": stage,\n                "verification": verification,\n                "next_turn": next_turn.to_dict(),\n            }\n',
              'successive-turn terminal guard',
            );
            session = session.replaceAll(
              'cost = _token_estimate(safe.get("content", ""))',
              'cost = _token_estimate(json.dumps(safe, sort_keys=True, default=str))',
            );
            session = replaceOnce(
              session,
              '                safe = self._compact_slice(result)\n                source_slices.append(safe)\n                remaining -= _token_estimate(safe.get("content", ""))\n',
              '                safe = self._compact_slice(result)\n                cost = _token_estimate(json.dumps(safe, sort_keys=True, default=str))\n                if cost <= remaining:\n                    source_slices.append(safe)\n                    remaining -= cost\n',
              'fallback serialized budget',
            );

            let report = await readText('aura_architect_benchmark_report.py');
            report = replaceOnce(
              report,
              '            "statement": (\n                "Architect Council normalization did not preserve submitted plan-level fields: "\n                + (", ".join(lost_fields) if lost_fields else "none")\n                + "."\n            ),',
              '            "statement": (\n                (\n                    "Architect Council normalization did not preserve submitted plan-level fields: "\n                    + ", ".join(lost_fields)\n                    + "."\n                )\n                if lost_fields\n                else "Architect Council normalization preserved every submitted plan-level governance field."\n            ),',
              'truth-preserving contract finding',
            );

            const shaExpr = '$' + '{{ github.event.pull_request.head.sha || github.sha }}';
            const refExpr = '$' + '{{ github.event.pull_request.head.ref || github.ref_name }}';

            let consolidation = await readText('.github/workflows/architect-consolidation-benchmark.yml');
            const consolidationCheckout = `          ref: ${shaExpr}\n`;
            if (!consolidation.includes('          persist-credentials: false\n')) {
              consolidation = replaceOnce(
                consolidation,
                consolidationCheckout,
                `          ref: ${refExpr}\n          fetch-depth: 1\n          persist-credentials: false\n`,
                'consolidation checkout',
              );
            }
            consolidation = consolidation.replace(
              '      - name: Remove checkout credentials before repository code\n        run: git config --local --unset-all http.https://github.com/.extraheader || true\n',
              `      - name: Verify exact PR head\n        run: test "$(git rev-parse HEAD)" = "${shaExpr}"\n`,
            );
            const readmeStart = consolidation.indexOf('      - name: Verify committed README and preserve artifact snapshot\n');
            const readmeEnd = consolidation.indexOf('      - name: Upload benchmark evidence, exact prompts, registries, state ledgers, and chronicles\n');
            if (readmeStart >= 0 && readmeEnd > readmeStart) {
              const replacement = '      - name: Validate committed README evidence and preserve current-head rendering\n        run: |\n          grep -q "AURA_ARCHITECT_PLANNING_BENCHMARK:START" README.md\n          grep -q "168,569" README.md\n          grep -q "18 attempted, 18 recorded, 0 failed" README.md\n          grep -q "AURA_REAL_REFACTOR_TRIAL:START" README.md\n          grep -q "Benchmark quality: **93.50**" README.md\n          python scripts/update_architect_benchmark_readme.py \\\n            --planning-report benchmark-output/architect_consolidation_benchmark.json \\\n            --output benchmark-output/README.current-head.md\n          test -s benchmark-output/README.current-head.md\n';
              consolidation = consolidation.slice(0, readmeStart) + replacement + consolidation.slice(readmeEnd);
            } else if (!consolidation.includes('Validate committed README evidence')) {
              throw new Error('Missing consolidation README gate');
            }

            let externalWorkflow = await readText('.github/workflows/architect-external-llm-session.yml');
            const externalCheckout = `          ref: ${shaExpr}\n          fetch-depth: 0\n          persist-credentials: false\n`;
            externalWorkflow = replaceOnce(
              externalWorkflow,
              externalCheckout,
              `          ref: ${refExpr}\n          fetch-depth: 1\n          persist-credentials: false\n      - name: Verify exact PR head\n        run: test "$(git rev-parse HEAD)" = "${shaExpr}"\n`,
              'external-session exact checkout',
            );

            const headRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const parent = headRef.data.object.sha;
            const parentCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });

            const tree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: parentCommit.data.tree.sha,
              tree: [
                { path: 'aura_external_llm_session.py', mode: '100644', type: 'blob', sha: await blob(session) },
                { path: 'tests/test_aura_external_llm_session.py', mode: '100644', type: 'blob', sha: '1e8fa5b7948fa037fcb4b2896b771b8a06c59e6c' },
                { path: 'README.md', mode: '100644', type: 'blob', sha: '231b448375270f58e0fd92bbce4e22e9d264d788' },
                { path: 'aura_architect_benchmark_report.py', mode: '100644', type: 'blob', sha: await blob(report) },
                { path: '.github/workflows/architect-consolidation-benchmark.yml', mode: '100644', type: 'blob', sha: await blob(consolidation) },
                { path: '.github/workflows/architect-external-llm-session.yml', mode: '100644', type: 'blob', sha: await blob(externalWorkflow) },
                { path: '.github/workflows/pr131-apply-final-review.yml', mode: '100644', type: 'blob', sha: null },
                { path: '.github/workflows/pr131-sync-final-benchmark-readme.yml', mode: '100644', type: 'blob', sha: null },
              ],
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'fix(review): reconcile inline findings and publish final benchmarks',
              tree: tree.data.sha,
              parents: [parent],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.data.sha,
              force: false,
            });
            core.info(`Created reconciled commit ${commit.data.sha}`);
