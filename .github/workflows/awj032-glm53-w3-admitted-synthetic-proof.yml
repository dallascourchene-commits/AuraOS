name: AWJ032 GLM53 W3 admitted synthetic proof

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_w3_admitted_synthetic_proof.py"
      - "tools/awj032/test_glm53_w3_admitted_synthetic_proof.py"
      - ".github/workflows/awj032-glm53-w3-admitted-synthetic-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj032-glm53-w3-admitted-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admitted-synthetic-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Materialize exact verified PR406 test generation read-only
        env:
          GH_TOKEN: ${{ github.token }}
          PR406_SHA: d518e0910a747ab83b6524bdcc49245076a0090c
        run: |
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$PR406_SHA"
          unset AUTH_HEADER
          test "$(git rev-parse FETCH_HEAD)" = "$PR406_SHA"
          git show "$PR406_SHA:tools/awj032/test_glm53_w3_native_per_expert_fixture.py" \
            > tools/awj032/test_glm53_w3_native_per_expert_fixture.py
          git show "$PR406_SHA:tools/awj032/test_glm53_w3_scale_semantic_oracle.py" \
            > tools/awj032/test_glm53_w3_scale_semantic_oracle.py
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Run admission and discriminative numerical convergence contract
        run: |
          python -m py_compile \
            tools/awj032/glm53_w3_mtp_composite_admission.py \
            tools/awj032/glm53_w3_admitted_synthetic_proof.py \
            tools/awj032/test_glm53_w3_mtp_composite_admission.py \
            tools/awj032/test_glm53_w3_native_per_expert_fixture.py \
            tools/awj032/test_glm53_w3_scale_semantic_oracle.py \
            tools/awj032/test_glm53_w3_admitted_synthetic_proof.py
          python -m unittest \
            tools.awj032.test_glm53_w3_mtp_composite_admission \
            tools.awj032.test_glm53_w3_native_per_expert_fixture \
            tools.awj032.test_glm53_w3_scale_semantic_oracle \
            tools.awj032.test_glm53_w3_admitted_synthetic_proof -v
