name: Aura WorkCapsule Source Re-entry Observation

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - '.github/workflows/aura-workcapsule-source-reentry-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rejected-currentness-source-identity:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove source-currentness owner
        run: |
          python3 -m py_compile scripts/aura_source_anchor_map.py scripts/aura_astge_anchor_hydration.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration

      - name: Re-prove WorkCapsule O7 and O8
        run: |
          python3 -m py_compile scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py
          python3 -m unittest -v tests.test_aura_workcapsule_context_binding
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_invalidation

      - name: Prove rejected-currentness source identity projection
        run: |
          python3 -m py_compile scripts/aura_workcapsule_source_reentry_observation.py
          python3 -m unittest -v tests.test_aura_workcapsule_source_reentry_observation

      - name: Emit consequence ceiling
        run: |
          echo 'SOURCE_CURRENTNESS_OWNER_REUSED=true'
          echo 'SOURCE_GENERATION_DOMAIN=SOURCE'
          echo 'CURRENT_IDENTITY_FROM_ADMITTED_LOCATOR=true'
          echo 'STALE_EXPECTED_DEPENDENCY_IDENTITY_PRESERVED=true'
          echo 'STALE_OBSERVED_BYTES_BOUND_TO_SOURCE_GENERATION=false'
          echo 'UNKNOWN_IDENTITY_GUESSED=false'
          echo 'NEW_DEPENDENCY_AUTO_PROMOTED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
