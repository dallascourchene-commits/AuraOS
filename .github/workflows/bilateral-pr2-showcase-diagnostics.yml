name: Bilateral PR2 showcase diagnostics

on:
  push:
    branches:
      - refactor/bilateral-intent-pr2
    paths:
      - .github/workflows/bilateral-pr2-showcase-diagnostics.yml
  pull_request:
    paths:
      - .github/workflows/bilateral-pr2-showcase-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch without credentials
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin refs/heads/refactor/bilateral-intent-pr2
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused runtime and test dependencies
        run: |
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest
      - name: Run exact guided showcase contracts and preserve output
        id: showcase_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_showcase_guided_project.py \
            tests/test_aura_showcase_guided_interface.py \
            tests/test_aura_showcase_spatial_integration.py \
            tests/test_aura_showcase_intent_routing.py \
            tests/test_aura_showcase_observatory_crucible.py \
            tests/test_aura_showcase_human_guided_tour.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_aura_showcase_attempt_archive.py \
            tests/test_aura_civic_commons_arena.py \
            tests/test_aura_human_agent_workflow.py \
            test_aura_context_crusher.py \
            test_universal_llm_logging.py \
            --junitxml=showcase-junit.xml \
            > showcase-output.log 2>&1
          code=$?
          cat showcase-output.log
          printf '%s\n' "${code}" > showcase-exit-code.txt
          exit "${code}"
      - name: Upload exact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilateral-pr2-showcase-diagnostics-${{ github.run_id }}
          path: |
            showcase-output.log
            showcase-junit.xml
            showcase-exit-code.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce diagnostic result
        if: steps.showcase_tests.outcome != 'success'
        run: exit 1
