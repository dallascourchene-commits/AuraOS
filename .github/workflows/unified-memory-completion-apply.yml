name: Apply Unified Memory Completion

on:
  push:
    branches:
      - refactor/unified-memory-continuity-completion
    paths:
      - .github/workflows/unified-memory-completion-apply.yml
      - .github/scripts/apply_umc_completion.py
      - .github/scripts/fix_umc_generated_test.py
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'refactor/unified-memory-continuity-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity-completion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Apply exact-anchor patch
        run: python .github/scripts/apply_umc_completion.py

      - name: Complete generated test imports
        run: python .github/scripts/fix_umc_generated_test.py

      - name: Format and verify focused integration
        shell: bash
        run: |
          set +e
          mkdir -p unified-memory-verification

          python -m ruff format \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py \
            2>&1 | tee unified-memory-verification/ruff-format.log
          format_status=${PIPESTATUS[0]}

          python -m ruff check --fix \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py \
            2>&1 | tee unified-memory-verification/ruff-check.log
          lint_status=${PIPESTATUS[0]}

          python -m py_compile \
            aura_unified_memory_continuity.py \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            2>&1 | tee unified-memory-verification/py-compile.log
          compile_status=${PIPESTATUS[0]}

          pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_forge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py \
            2>&1 | tee unified-memory-verification/pytest.log
          pytest_status=${PIPESTATUS[0]}

          printf 'format=%s\nlint=%s\ncompile=%s\npytest=%s\n' \
            "$format_status" "$lint_status" "$compile_status" "$pytest_status" \
            | tee unified-memory-verification/status.txt

          if (( format_status != 0 || lint_status != 0 || compile_status != 0 || pytest_status != 0 )); then
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-completion-verification
          path: unified-memory-verification
          if-no-files-found: warn

      - name: Commit applied integration
        shell: bash
        run: |
          git config user.name "AuraOS Refactor Harness"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "refactor: wire unified memory continuity through Aura toolchain"
          git push origin HEAD:refactor/unified-memory-continuity-completion

      - name: Completion marker
        run: echo "Unified memory completion apply workflow finished."
