name: Apply Unified Memory Completion

on:
  push:
    branches:
      - refactor/unified-memory-continuity-completion
    paths:
      - .github/workflows/unified-memory-completion-apply.yml
      - .github/scripts/apply_umc_completion.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity-completion
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Apply exact-anchor patch
        run: python .github/scripts/apply_umc_completion.py

      - name: Format and verify focused integration
        shell: bash
        run: |
          python -m ruff format \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py
          python -m ruff check --fix \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py
          python -m py_compile \
            aura_unified_memory_continuity.py \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py
          pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_forge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py

      - name: Commit applied integration
        shell: bash
        run: |
          git config user.name "AuraOS Refactor Harness"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_unified_memory_continuity_toolchain.py \
            aura_agent_arena_bridge.py \
            aura_arena_persistence_adapters.py \
            aura_architect_council_v3.py \
            aura_forge.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_unified_memory_continuity.py
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "refactor: wire unified memory continuity through Aura toolchain"
          git push origin HEAD:refactor/unified-memory-continuity-completion
