name: AWJ BugHound R1 Benchmark Contract

on:
  push:
    branches:
      - awj-bughound-002-r1-benchmark-contract-20260830
    paths:
      - "tools/bughound/benchmark_contract.py"
      - "tools/bughound/test_benchmark_contract.py"
      - ".github/workflows/awj-bughound-002-r1-benchmark-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awj-bughound-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-benchmark-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile and run deterministic BugHound contract
        run: |
          python -m py_compile tools/bughound/benchmark_contract.py
          python -m unittest -v tools/bughound/test_benchmark_contract.py
