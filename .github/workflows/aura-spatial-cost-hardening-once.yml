name: Aura Spatial Bounded Evidence Hardening

on:
  push:
    branches:
      - feature/aura-spatial-s0-s2
    paths:
      - .aura/tools/aura_spatial_cost_hardening.trigger

permissions:
  contents: write

concurrency:
  group: aura-spatial-cost-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden-bounded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install pytest ruff numpy --quiet
      - name: Apply exact bounded-evidence transformation
        run: python .aura/tools/aura_spatial_cost_hardening_once.py
      - name: Compile, lint, and test spatial circuit
        run: |
          python -m py_compile \
            aura_spatial_projection.py \
            tests/test_aura_spatial_substrate.py
          ruff check --select E9,F63,F7,F82 \
            aura_spatial_projection.py \
            tests/test_aura_spatial_substrate.py
          python -m pytest -q \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_showcase_spatial_integration.py
          git diff --check
      - name: Remove temporary hardening machinery
        run: |
          rm -f \
            .aura/tools/aura_spatial_cost_hardening_once.py \
            .aura/tools/aura_spatial_cost_hardening.trigger \
            .github/workflows/aura-spatial-cost-hardening-once.yml
      - name: Regenerate canonical CODEMAP
        run: |
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
      - name: Commit bounded evidence hardening
        shell: bash
        run: |
          git config user.name "AuraOS Spatial Circuit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A \
            aura_spatial_projection.py \
            tests/test_aura_spatial_substrate.py \
            docs/AURA_SPATIAL_COMPUTING.md \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .aura/tools/aura_spatial_cost_hardening_once.py \
            .aura/tools/aura_spatial_cost_hardening.trigger \
            .github/workflows/aura-spatial-cost-hardening-once.yml
          git commit -m "Spatial S2: bind asset evidence to bounded projections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
