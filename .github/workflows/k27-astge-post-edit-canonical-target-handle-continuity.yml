name: K27 ASTGE Post-Edit Canonical Target Handle Continuity

on:
  pull_request:
    paths:
      - 'crates/aura-k27-astge-post-edit-canonical-scope/**'
      - 'crates/aura-k27-astge-post-edit-higher-owner-continuity/**'
      - 'crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/**'
      - '.github/workflows/k27-astge-post-edit-canonical-target-handle-continuity.yml'

permissions:
  contents: read

jobs:
  exact-head-post-edit-canonical-target-handle-continuity:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact candidate head without persisted credentials
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Verify toolchains
        run: |
          rustc --version
          cargo --version

      - name: Re-prove PR525 canonical definition-target owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-post-edit-canonical-scope/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-post-edit-canonical-scope/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-post-edit-canonical-scope/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-post-edit-canonical-scope/Cargo.toml --all-targets -- -D warnings

      - name: Re-prove PR526 higher-owner continuity owner
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-post-edit-higher-owner-continuity/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-post-edit-higher-owner-continuity/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-post-edit-higher-owner-continuity/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-post-edit-higher-owner-continuity/Cargo.toml --all-targets -- -D warnings

      - name: Verify canonical target handle continuity composition
        run: |
          cargo fmt --manifest-path crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/Cargo.toml --doc
          cargo clippy --manifest-path crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/Cargo.toml --all-targets -- -D warnings

      - name: Safe-path unsafe scan
        run: |
          ! grep -R --line-number -E 'unsafe[[:space:]]*\{' crates/aura-k27-astge-post-edit-canonical-target-handle-continuity/src

      - name: Emit claim ceiling
        run: |
          echo 'POST_EDIT_PROFILED_SCOPE_CURRENT=true'
          echo 'CANONICAL_DEFINITION_TARGET_CURRENT=true'
          echo 'HIGHER_OWNER_SEMANTIC_HANDLE_CONTINUITY_PROVEN=true'
          echo 'SAME_POST_EDIT_CONSEQUENCE_INSTANCE=true'
          echo 'CANONICAL_DEFINITION_TARGET_HANDLE_CONTINUITY_PROVEN=true'
          echo 'RUNTIME_NAME_RESOLUTION_PROVEN=false'
          echo 'CALL_GRAPH_PROVEN=false'
          echo 'SEMANTIC_PATCH_CORRECTNESS_PROVEN=false'
          echo 'B_MINUS_APPROVED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
          echo 'EXTERNAL_EFFECT_AUTHORIZED=false'
