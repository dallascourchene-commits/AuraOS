name: Aura PR166 Review Fix Apply

on:
  pull_request:
    paths:
      - ".aura/staging/pr166-review-fixes/READY"
      - ".aura/staging/pr166-review-fixes/patch-*.diff"
      - ".github/workflows/aura-pr166-review-fix-apply.yml"

permissions:
  contents: write

concurrency:
  group: aura-pr166-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-reviewed-fixes:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_STAGING_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      PATCH_SHA256: 566f570066dedcf18f77faece442d991e8a749fa51ef6fc401e92c76d3eb51a0
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_STAGING_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and apply transparent repair patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_STAGING_HEAD"
          cat .aura/staging/pr166-review-fixes/patch-*.diff > /tmp/pr166-review-fixes.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/pr166-review-fixes.patch | sha256sum --check --strict
          git apply --check /tmp/pr166-review-fixes.patch
          git apply /tmp/pr166-review-fixes.patch
          rm -rf .aura/staging/pr166-review-fixes
          rm -f .github/workflows/aura-pr166-review-fix-apply.yml
          git diff --check

      - name: Install focused verifier dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema ruff

      - name: Compile and lint repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_node.py \
            aura_source_integrity.py \
            aura_review_lessons_engine.py \
            aura_review_lessons_replay.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py
          ruff check \
            aura_source_integrity.py \
            aura_review_lessons_engine.py \
            aura_review_lessons_replay.py \
            tests/test_aura_source_integrity.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py
          ruff check --select F821,F823 aura_node.py

      - name: Run focused regression matrix
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_source_integrity.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py \
            tests/test_aura_review_lessons_codex_regressions.py \
            tests/test_aura_review_learning_mcp_codex.py \
            tests/test_aura_coding_waboose.py \
            tests/test_aura_waboose_learning.py

      - name: Verify bounded non-mutating source scan
        run: |
          python - <<'PY'
          from pathlib import Path
          from aura_source_integrity import scan_utf8_source_tree

          packet = scan_utf8_source_tree(Path("."))
          assert packet["status"] == "PASSED", packet["failures"]
          assert packet["production_mutation"] is False
          assert packet["automatic_fix"] is False
          assert len(packet["source_digest"]) == 64
          PY

      - name: Commit only the reviewed repair set
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdx
          for generated in \
            .aura/CODEMAP.md \
            .aura/CODEMAP.json \
            topology_map.json \
            Aura_Memory/live_topology_ast.json; do
            git restore --source=HEAD --worktree --staged -- "$generated" 2>/dev/null || true
          done
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              .aura/staging/pr166-review-fixes/*|.github/workflows/aura-pr166-review-fix-apply.yml|.github/workflows/aura-review-learning.yml|.github/workflows/aura-spatial-s3a-materialize.yml|aura_node.py|aura_review_lessons_engine.py|aura_review_lessons_replay.py|aura_source_integrity.py|tests/test_aura_agent_arena_review_learning.py|tests/test_aura_coding_waboose_review_learning.py|tests/test_aura_coding_waboose_review_lessons.py|tests/test_aura_review_lessons_codex_regressions.py|tests/test_aura_source_integrity.py)
                ;;
              *)
                echo "Unexpected tracked change: $path"
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^...//')
          test "$unexpected" -eq 0
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXACT_STAGING_HEAD"
          git config user.name "Aura Review Repair"
          git config user.email "aura-review-repair@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Codex and CodeRabbit review findings"
          git push origin "HEAD:$HEAD_BRANCH"
