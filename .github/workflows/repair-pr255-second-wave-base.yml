name: Repair PR255 second review wave from base

on:
  pull_request:
    branches:
      - repair/pr255-second-wave-runner-base

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/pr255-second-wave-runner-trigger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact second-wave repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          module_path = Path('aura_ephemeral_workspace_contracts.py')
          tests_path = Path('tests/test_aura_ephemeral_workspace_contracts.py')
          module = module_path.read_text()
          tests = tests_path.read_text()

          replacements = [
              ('from dataclasses import dataclass, fields, is_dataclass, replace',
               'from dataclasses import asdict, dataclass, fields, is_dataclass, replace'),
              ('    if is_dataclass(value):\n        return _canonical(value.to_dict())',
               '    if is_dataclass(value):\n        if hasattr(value, "to_dict"):\n            return _canonical(value.to_dict())\n        return _canonical(asdict(value))'),
              ('    if type(value) is not bool or value is not required:',
               '    if not isinstance(value, bool) or value is not required:'),
              ('    if type(value) is not int or not low <= value <= high:',
               '    if isinstance(value, bool) or not isinstance(value, int) or not low <= value <= high:'),
              ('    metadata: tuple[tuple[str, Any], ...] = ()',
               '    metadata: Mapping[str, Any] | tuple[tuple[str, Any], ...] = ()'),
              ('''def _owner_map(value: Any) -> tuple[tuple[str, str], ...]:
    """Validate and canonicalize the domain-owner handoff map."""
    if isinstance(value, Mapping):
        items = value.items()
    elif isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
        items = value
    else:
        raise ValueError("handoff map must be an object or pair sequence")
    result = tuple(sorted((_id(key, "handoff key"), _id(owner, "handoff owner")) for key, owner in items))
    if not result or len({key for key, _ in result}) != len(result):
        raise ValueError("handoff map must be non-empty and unique")
    return result
''',
               '''def _owner_map(value: Any) -> tuple[tuple[str, str], ...]:
    """Validate and canonicalize the domain-owner handoff map."""
    if isinstance(value, Mapping):
        items = value.items()
    elif isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):
        items = value
    else:
        raise ValueError("handoff map must be an object or pair sequence")
    pairs: list[tuple[str, str]] = []
    for item in items:
        if isinstance(item, (str, bytes, bytearray)) or not isinstance(item, Sequence) or len(item) != 2:
            raise ValueError("handoff map entries must be key/owner pairs")
        pairs.append((_id(item[0], "handoff key"), _id(item[1], "handoff owner")))
    result = tuple(sorted(pairs))
    if not result or len({key for key, _ in result}) != len(result):
        raise ValueError("handoff map must be non-empty and unique")
    return result
'''),
          ]
          for old, new in replacements:
              count = module.count(old)
              if count != 1:
                  raise SystemExit(f'expected one module replacement, found {count}: {old[:80]!r}')
              module = module.replace(old, new)

          unused = '    AuthorityEnvelope,\n'
          if tests.count(unused) != 1:
              raise SystemExit('AuthorityEnvelope import was not found exactly once')
          tests = tests.replace(unused, '')
          regression = '''\n\ndef test_malformed_owner_map_pair_sequences_fail_closed() -> None:
    """Malformed owner-map pair sequences must retain the ValueError parse contract."""
    value, _ = recipe()
    payload = value.to_dict()
    payload["domain_owner_handoff_map"] = [1, 2]
    with pytest.raises(ValueError, match="key/owner pairs"):
        EphemeralWorkspaceRecipe.from_dict(payload)
'''
          if 'test_malformed_owner_map_pair_sequences_fail_closed' in tests:
              raise SystemExit('owner-map regression already exists unexpectedly')
          module_path.write_text(module)
          tests_path.write_text(tests.rstrip() + regression + '\n')
          PY
          rm -f .github/workflows/repair-pr255-second-wave-base.yml
          rm -f .aura/pr255-second-wave-trigger
          python -m pip install --disable-pip-version-check -q pytest jsonschema ruff
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python -m pytest -q tests/test_aura_ephemeral_workspace_contracts.py
          python -m ruff check aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py --select F401,F821,E999
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in (
              'schemas/aura_project_context_projection.schema.json',
              'schemas/aura_ephemeral_workspace_recipe.schema.json',
              'schemas/aura_multimodal_spatial_observation.schema.json',
          ):
              Draft202012Validator.check_schema(json.loads(Path(path).read_text()))
          PY
          git add --all
          python - <<'PY'
          import subprocess
          base = '879b5fb056b70d150b1646e082223330a36c2912'
          expected = sorted([
              '.aura/refactor_objectives/intent_native_spatial_workspace_pr1.v1.json',
              '.aura/waboose_requests/intent_native_spatial_workspace_pr1.v1.json',
              'aura_ephemeral_workspace_contracts.py',
              'docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md',
              'schemas/aura_ephemeral_workspace_recipe.schema.json',
              'schemas/aura_multimodal_spatial_observation.schema.json',
              'schemas/aura_project_context_projection.schema.json',
              'tests/test_aura_ephemeral_workspace_contracts.py',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', base], text=True
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f'exact scope mismatch: {actual}')
          PY
      - name: Commit and push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Review Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(pr1): close second review wave'
          git push origin HEAD:${{ github.head_ref }}
