name: BugHound SeedLab Benchmark Contract

on:
  pull_request:
    paths:
      - "tools/bughound/**"
      - "tests/test_bughound_*.py"
      - ".github/workflows/bughound-seedlab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bughound-seedlab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seedlab-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run deterministic local BugHound contracts
        run: |
          python -m py_compile tools/bughound/seedlab_benchmark.py tools/bughound/envelope_lint.py tests/test_bughound_seedlab_benchmark.py tests/test_bughound_envelope_lint.py
          python -m unittest discover -s tests -p "test_bughound_*.py" -v
