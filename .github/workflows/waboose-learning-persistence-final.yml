name: Waboose Learning Persistence Final

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/waboose-learning-persistence-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waboose-learning-persistence-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      AURA_WABOOSE_LEARNING_ROOT: /tmp/aura-waboose-learning
      HEAD_REF: ${{ github.event.pull_request.head.ref || 'feature/aura-emergent-evidence-spine' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<9" ruff bandit
      - name: Apply cleanup and restore generated maps
        run: |
          set -euo pipefail
          python scripts/apply_waboose_post_validation_cleanup.py
          git checkout origin/main -- .aura/CODEMAP.json .aura/CODEMAP.md
      - name: Compile and run Waboose learning regressions
        run: |
          python -m py_compile \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py
          python -m pytest -q \
            tests/test_aura_emergent_evidence_spine.py \
            tests/test_aura_emergent_evidence_spine_coderabbit.py \
            tests/test_aura_waboose_semantic_rules.py \
            tests/test_aura_waboose_semantic_rule_false_positives.py \
            tests/test_aura_waboose_semantic_completeness.py \
            tests/test_aura_waboose_learning.py \
            tests/test_aura_coderabbit_learning_cli.py \
            tests/test_aura_waboose_learning_mcp.py \
            tests/test_aura_waboose_learning_workflows.py \
            tests/test_aura_emergent_agent_bridge.py \
            tests/test_aura_emergent_agent_bridge_mcp.py
          python -m pytest -q tests/test_aura_review_arena.py
          python -m pytest -q tests/test_aura_coding_waboose.py
          python -m pytest -q tests/test_aura_coding_waboose_breadboard.py
          python -m pytest -q tests/test_aura_waboose_callsite_resolution.py
          python -m pytest -q tests/test_aura_review_arena_mcp.py
          python -m pytest -q tests/test_aura_agent_arena_mcp.py
          python -m pytest -q tests/test_aura_agent_arena_bridge.py
          python -m pytest -q test_aura_dream_retrieval.py
          python -m pytest -q tests/test_aura_qdkt_inventory.py
      - name: Enforce static and security checks
        run: |
          ruff check \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py \
            tests/test_aura_emergent_evidence_spine.py \
            tests/test_aura_emergent_evidence_spine_coderabbit.py \
            tests/test_aura_waboose_semantic_rules.py \
            tests/test_aura_waboose_semantic_rule_false_positives.py \
            tests/test_aura_waboose_semantic_completeness.py \
            tests/test_aura_waboose_learning.py \
            tests/test_aura_coderabbit_learning_cli.py \
            tests/test_aura_waboose_learning_mcp.py \
            tests/test_aura_waboose_learning_workflows.py \
            tests/test_aura_emergent_agent_bridge.py \
            tests/test_aura_emergent_agent_bridge_mcp.py
          bandit -q -ll \
            aura_affordance_directory.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_persistence_bridge.py \
            aura_coderabbit_learning_cli.py \
            aura_coding_waboose.py \
            aura_emergent_evidence_spine.py \
            aura_review_arena.py \
            aura_waboose_learning.py \
            aura_waboose_semantic_rules.py
      - name: Remove temporary cleanup machinery
        run: |
          rm -f scripts/apply_waboose_post_validation_cleanup.py
          rm -f .github/workflows/waboose-learning-persistence-final.yml
      - name: Commit exact permanent persistence tree locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist grounded Waboose learning across CodeRabbit reviews"
      - name: Build final five-pack Waboose request
        run: |
          python - <<'PY'
          import json
          request = {
              "objective": "Verify CodeRabbit parity, cross-PR Connectome DREAM-lite QDKT learning persistence, and unchanged authority boundaries.",
              "mode": "range",
              "base_ref": "origin/main",
              "head_ref": "HEAD",
              "profile": "precision",
              "graph_depth": 2,
              "graph_node_budget": 240,
              "run_tests": True,
              "run_optional_tools": True,
              "focus_directives": [
                  {"name":"strict_boolean_options","question":"Are boolean options parsed with strict types rather than truthiness?","risk":"correctness","target_patterns":["boolean option","strict type"],"required_evidence":["semantic_rule","regression_test"]},
                  {"name":"qualified_symbol_identity","question":"Are qualified symbols and same-named methods kept distinct at every target binding boundary?","risk":"dependency_impact","target_patterns":["qualified symbol","symbol identity"],"required_evidence":["semantic_rule","regression_test"]},
                  {"name":"source_inventory_integrity","question":"Does source inventory fail closed on unreadable files and decoding errors?","risk":"correctness","target_patterns":["source inventory","decoding","unreadable file"],"required_evidence":["semantic_rule","regression_test"]},
                  {"name":"bounded_closure_integrity","question":"Are closure edge endpoints always inside the bounded closure node set?","risk":"dependency_impact","target_patterns":["bounded closure","edge endpoint"],"required_evidence":["semantic_rule","regression_test"]},
                  {"name":"test_evidence_preservation","question":"Are test callable nodes and test edges preserved in bounded audit evidence?","risk":"test_gap","target_patterns":["test callable","test edge"],"required_evidence":["semantic_rule","regression_test"]}
              ],
              "invariants": [
                  "Unsupported agent focus directives block deterministic-only completion.",
                  "CodeRabbit lessons require exact reviewed-head and source-span grounding.",
                  "Shared learning runs execute on the trusted default branch.",
                  "Reviewed pull request Python is treated only as source data and is never executed.",
                  "Connectome paths, DREAM-lite ranking, QDKT memory, and causal crystals remain advisory.",
                  "Production mutation and automatic merge remain false."
              ],
              "risk_map": ["semantic_completeness","teacher_authority","cross_pr_memory","source_integrity","symbol_identity","bounded_graph_integrity","test_evidence"]
          }
          with open('/tmp/waboose-persistence-request.json','w',encoding='utf-8') as handle:
              json.dump(request, handle)
          PY
      - name: Run and enforce final Coding Waboose review
        run: |
          set -o pipefail
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/waboose-persistence-state.json \
            run --request /tmp/waboose-persistence-request.json \
            | tee /tmp/waboose-persistence-result.json
          python - <<'PY'
          import json
          with open('/tmp/waboose-persistence-result.json', encoding='utf-8') as handle:
              packet = json.load(handle)
          assert packet.get('ok') is True, packet
          assert packet.get('semantic_review_complete') is True, packet
          assert not packet.get('unverified_focus_directives'), packet
          assert not packet.get('forge_repair_requests'), packet
          assert not packet.get('findings'), packet
          assert set(packet.get('semantic_rule_packs_executed') or []) == {
              'strict_input_types', 'symbol_identity', 'source_integrity',
              'bounded_graph_integrity', 'test_evidence_preservation'
          }
          assert packet.get('production_mutation') is False
          assert packet.get('automatic_merge') is False
          PY
      - name: Push reviewed permanent tree
        run: git push origin HEAD:"$HEAD_REF"
      - name: Upload final persistence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waboose-learning-persistence-final
          path: |
            /tmp/waboose-persistence-result.json
            /tmp/waboose-persistence-state.json
          if-no-files-found: warn
          retention-days: 7
