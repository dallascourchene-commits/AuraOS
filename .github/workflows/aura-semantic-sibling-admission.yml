name: Aura Semantic Sibling Admission

on:
  pull_request:
    paths:
      - "tools/aura_dual_key_evidence_generation.py"
      - "tools/aura_semantic_sibling_admission.py"
      - "tests/test_aura_dual_key_evidence_generation.py"
      - "tests/test_aura_semantic_sibling_admission.py"
      - ".github/workflows/aura-semantic-sibling-admission.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  semantic-sibling-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert checked-out generation is exact pull-request head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify exact PR648 code parent ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bba262fbcca45f729486f204d5413d396d2c1609 HEAD

      - name: Revalidate exact-green PR648 and PR649 hosted generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected = {
              33373150045: "bba262fbcca45f729486f204d5413d396d2c1609",
              33373165058: "aa004558af8c46bb9bedeedad3cbd2e4e212ab17",
          }
          for run_id, head in expected.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/dallascourchene-commits/AuraOS/actions/runs/{run_id}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  run = json.load(response)
              assert run["head_sha"] == head, (run_id, run["head_sha"], head)
              assert run["status"] == "completed", (run_id, run["status"])
              assert run["conclusion"] == "success", (run_id, run["conclusion"])
          PY

      - name: Compile exact identity and sibling gates
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_dual_key_evidence_generation.py \
            tools/aura_semantic_sibling_admission.py \
            tests/test_aura_dual_key_evidence_generation.py \
            tests/test_aura_semantic_sibling_admission.py

      - name: Run dual-key and semantic-sibling adversarials
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_aura_dual_key_evidence_generation \
            tests.test_aura_semantic_sibling_admission

      - name: Emit deterministic semantic-sibling receipt
        run: |
          set -euo pipefail
          python -m tools.aura_semantic_sibling_admission > /tmp/aura-semantic-sibling-receipt.json
          python - <<'PY'
          import json
          with open("/tmp/aura-semantic-sibling-receipt.json", "r", encoding="utf-8") as fh:
              receipt = json.load(fh)
          assert receipt["successor_admissible"] is True
          assert receipt["selected_artifact_ids"] == ["github:pr/648", "github:pr/649"]
          assert len(set(receipt["selected_scks"])) == 2
          assert receipt["evidence_refresh_counts_as_semantic_sibling"] is False
          assert receipt["process_retry_counts_as_semantic_sibling"] is False
          assert receipt["k27_coordinate_growth_counts_as_semantic_sibling"] is False
          assert receipt["semantic_truth_minted"] is False
          assert receipt["effect_authority_granted"] is False
          assert receipt["native_private_transformer_kv_accessed"] is False
          assert receipt["gate10_promoted"] is False
          assert receipt["merge_or_deployment_authorized"] is False
          print(json.dumps(receipt, sort_keys=True, indent=2))
          PY
