name: Phase B CODEMAP Diagnostic

on:
  push:
    branches:
      - feature/arena-crucible-phase-b

permissions:
  contents: write

concurrency:
  group: phase-b-codemap-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arena-crucible-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Compare committed and regenerated canonical maps
        run: |
          cp .aura/CODEMAP.json /tmp/CODEMAP.committed.json
          rm .github/workflows/phase-b-codemap-diagnostic.yml
          python aura_codebase_navigator.py
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_codemap_verify import compare_codemap_payloads, stable_codemap_projection
          committed = json.loads(Path('/tmp/CODEMAP.committed.json').read_text())
          regenerated = json.loads(Path('.aura/CODEMAP.json').read_text())
          result = compare_codemap_payloads(committed, regenerated)
          left = stable_codemap_projection(committed)
          right = stable_codemap_projection(regenerated)
          details = {}
          for field in result['differing_fields']:
              lv, rv = left.get(field), right.get(field)
              if isinstance(lv, dict) and isinstance(rv, dict):
                  keys = sorted(set(lv) | set(rv))
                  details[field] = {
                      'differing_keys': [key for key in keys if lv.get(key) != rv.get(key)][:100],
                      'left_count': len(lv),
                      'right_count': len(rv),
                  }
              elif isinstance(lv, list) and isinstance(rv, list):
                  details[field] = {
                      'left_count': len(lv),
                      'right_count': len(rv),
                      'first_difference': next((i for i, pair in enumerate(zip(lv, rv)) if pair[0] != pair[1]), None),
                  }
              else:
                  details[field] = {'left': lv, 'right': rv}
          Path('PHASE_B_CODEMAP_DIAGNOSTIC.json').write_text(json.dumps({'result': result, 'details': details}, indent=2, sort_keys=True))
          PY
      - name: Commit diagnostic and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .aura/CODEMAP.json .aura/CODEMAP.md
          git add PHASE_B_CODEMAP_DIAGNOSTIC.json
          git add -u .github/workflows/phase-b-codemap-diagnostic.yml
          git commit -m "chore(codemap): record canonical mismatch diagnostic"
          git push origin HEAD:feature/arena-crucible-phase-b
