## Final architecture

```text
ConstructionProjectState
  → deterministic claim readiness
  → hard candidate filtering
  → advisory probabilistic signal
  → role-preserving deterministic options
  → Liquid Planning ActionCapsule / BoundaryContract / ArenaLease
  → WFST evidence-all and verifier-pass guards
  → proposal-only coordination packet
  → authorized human review
  → verified ArenaExperience V3
  → TRAIN / VALIDATION / SHADOW
  → CRYSTALLIZATION_PROPOSED
  → verifier and human review
```

Canonical owners remain the Construction contracts/state/authority modules, Liquid Planning contracts, WFST runtime/compiler, Experience Ledger, Crucible, Architect loop, Council V3, Work Splitter, Surgeon, Verifier, Judge, rollback, and leases. No parallel truth store or production controller was added.

