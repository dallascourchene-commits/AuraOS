| Zero-model benchmark | `250` permutations passed |
| Governed learning projection | `15` records, `15` unique episode digests, one synthetic scenario, one objective |
| Crucible | one `CRYSTALLIZATION_PROPOSED`; active grammar unchanged |
| RefactorSkeleton Python 3.11 dependency repair | PASS; identity arguments unchanged |

## Manual and automated hardening incorporated

- scalar collection and unknown-field deserialization attacks fail closed;
- malformed runtime values are rejected before attribute access;
- option-role ordering is preserved after deduplication;
- cross-project scope mismatches are blocked;
- hard readiness blockers cannot be overridden by probabilistic scores;
- WFST transitions require both benchmark evidence and a passing verifier packet;
- benchmark bounds and report labels are tamper-checked;
- content-addressed Experience payloads exclude wall-clock timing;
- replay is idempotent;
- synthetic episodes do not claim human alignment, field diversity, provider usage, savings, or production readiness;
- Architect base SHA, ancestry, output path, file scope, tests, leases, and rollback are bounded;
- topology verification uses exact generated-file diffs.

## Benchmark and learning boundaries

The measured benchmark is a deterministic zero-model software fixture. Provider tokens, provider cost, real-project savings, and production readiness are `NOT_MEASURED` or `NOT_CLAIMED`.

The learning run contains 15 independently executed seeded permutations of one fictional scenario and one objective. It creates 15 unique episode digests but one evaluation digest and one recommendation. This supports replay and pipeline verification only; it does not establish generalization across real projects.

The Crucible proposal did not satisfy the distinct-objective threshold. That warning is preserved. The proposal remains `CRYSTALLIZATION_PROPOSED`, the allowed path is limited to `soft_weight_profile.empirical_uncertainty`, and active grammar, hard guards, capabilities, authority, source code, commit, push, and merge remain unchanged.

## Deferred by design

- Human Agent server/API and UI wiring (E9)
- Observatory projection (E9/E12)
- real owner, contractor, payroll, payment, access, sensor, or safety integrations
- external-model and multi-provider comparative benchmark arms
- commercial or field-performance claims

## Final sequence

```text
verified source gates
  → synchronized README / ARCHITECTURE / USER_GUIDE / evidence
  → regenerated CODEMAP and topology
  → pinned-head final CI
  → mark PR ready
  → merge
  → post-merge verification
```
