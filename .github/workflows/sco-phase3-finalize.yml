name: SCO Phase 3 Final Documentation and Topology Sync

on:
  push:
    branches:
      - refactor/sco-construction-e7-e8

permissions:
  contents: write

concurrency:
  group: sco-phase3-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          printf '/*\n!/Aura_Memory/\n!/Aura_Sandbox/\n' > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=128 origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          git config --unset-all http.https://github.com/.extraheader
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install declared environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Synchronize verified documentation and evidence
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.').resolve()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_before_once(path: str, marker: str, block: str, sentinel: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if sentinel in text:
                  return
              if marker not in text:
                  raise SystemExit(f'missing insertion marker in {path}: {marker!r}')
              target.write_text(text.replace(marker, block.rstrip() + '\n\n' + marker, 1), encoding='utf-8')

