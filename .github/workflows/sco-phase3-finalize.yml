name: SCO Phase 3 Final Documentation and Topology Sync

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sco-phase3-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.ref == 'refactor/sco-construction-e7-e8' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          printf '/*\n!/Aura_Memory/\n!/Aura_Sandbox/\n' > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --no-tags --filter=blob:none --depth=128 origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          git config --unset-all http.https://github.com/.extraheader
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install declared environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Write verified documentation and evidence
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.').resolve()

          def edit(path: str, *, header_old: str | None = None, header_new: str | None = None,
                   marker: str, sentinel: str, block: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if header_old is not None and header_old in text:
                  text = text.replace(header_old, header_new or header_old, 1)
              if sentinel not in text:
                  if marker not in text:
                      raise SystemExit(f'missing marker {marker!r} in {path}')
                  text = text.replace(marker, block.rstrip() + '\n\n' + marker, 1)
              target.write_text(text, encoding='utf-8')

          common = '''Verified on source head `15b3c26a3228a95174a845c75a178cf772cf5e81`:

- exact Python 3.11 compile, fatal Ruff selection, and diff checks passed;
- `81/81` focused Phase 3 tests passed in `22.45s`;
- focused adapter/fixture/benchmark coverage was `88%`, with learning coverage at `82%`;
- `241/241` Construction and canonical-owner regressions passed in `10.53s`;
- the zero-model benchmark completed `250` permutations;
- native Selective Council V3 selected the bounded Surgeon plan at `0.99`;
- Architect verification recorded `16` checks, `0` failures, four exact-file leases, and Judge `promote_hotswap`;
- the Experience Ledger stored `15` unique seeded episodes from one fictional scenario and one objective;
- Crucible produced one `CRYSTALLIZATION_PROPOSED` candidate and did not mutate active grammar.'''

          readme = f'''## SCO Construction advisory runtime

PR #148 adds the bounded Phase 3 E7–E11 Construction Arena vertical slice:

```text
ConstructionProjectState
  → exact evidence readiness
  → hard blockers before ranking
  → advisory probabilistic signal
  → cheapest / fastest / recommended / safest options
  → ActionCapsule + BoundaryContract + ArenaLease
  → verifier-backed proposal
  → human review
  → ArenaExperience V3
  → proposal-only Crucible
```

{common}

This is synthetic/shadow software evidence, not a real-project or production-readiness claim. Provider tokens, provider cost, and real-project savings remain `NOT_MEASURED`. The runtime cannot authorize physical work, release payment, control access, certify safety or engineering, mutate authoritative records, or automatically promote grammar. See [`docs/evidence/AURA_SCO_PHASE3_E7_E11_VERIFICATION.json`](docs/evidence/AURA_SCO_PHASE3_E7_E11_VERIFICATION.json).'''
          edit('README.md', marker='## Truth and authority', sentinel='## SCO Construction advisory runtime', block=readme)

          architecture = f'''## SCO Construction advisory runtime

The Construction Arena is a narrow domain adapter over canonical Construction, Liquid Planning, WFST, Experience, Crucible, and Architect owners. It does not create a second project truth store.

Architectural invariants:

- exact readiness, expiry, conflict, sensor-only, scope, and authority blockers run before probabilistic ranking;
- a high probabilistic score cannot rescue a blocked route;
- cheapest, fastest, recommended, and safest roles retain semantic ordering while exposing distinct admissible alternatives;
- runtime packets are read-only proposals and cannot mutate Construction events;
- WFST transitions require benchmark evidence and a passing verifier packet;
- Experience identity excludes wall-clock timing and replay is idempotent;
- the 15 episodes are one synthetic scenario and one objective, so no field generalization is claimed;
- Crucible may propose only `soft_weight_profile.empirical_uncertainty` and cannot promote active grammar;
- physical work, payment, access, certification, source mutation, commit, push, and merge remain outside runtime authority.

Primary files: `.aura/arena_routes/construction.v1.json`, `aura_construction_adapter.py`, `aura_construction_fixtures.py`, `aura_construction_benchmark.py`, `aura_construction_learning.py`, and `aura_construction_architect_refactor.py`.

{common}'''
          edit(
              '.aura/ARCHITECTURE.md',
              header_old='**Architecture audit:** through merged PR #133 and the canonical Human Agent, Observatory, and Crucible documentation sync.  ',
              header_new='**Architecture audit:** through SCO Construction Phase 3 E7–E11 verification in PR #148 and the canonical Human Agent, Observatory, Experience, Crucible, Council, and Surgeon boundaries.  ',
              marker='## 7. Benchmark evidence hierarchy',
              sentinel='## SCO Construction advisory runtime',
              block=architecture,
          )

          guide = f'''## SCO Construction advisory runtime

Run the deterministic fixture benchmark:

```bash
python3 aura_construction_benchmark.py --iterations 250 --seed 1337 --json
```

Run the governed synthetic learning projection:

```bash
python3 aura_construction_learning.py \
  --repo-root . \
  --output-dir Aura_Staging/sco_construction_phase3_learning \
  --experience-count 15 \
  --iterations-per-experience 25 \
  --seed-base 1337
```

Run the native Council–Surgeon verification harness:

```bash
python3 aura_construction_architect_refactor.py \
  --base-sha 7edd80484629378af0658bfca0d7d4e351361831 \
  --output-dir Aura_Staging/sco_construction_phase3_architect
```

{common}

Interpret these as fictional deterministic and synthetic pipeline gates only. A `CRYSTALLIZATION_PROPOSED` result requires verifier and human review and does not change active grammar. All real physical-work, payment, access, safety, engineering, legal, and regulatory decisions remain with authorized humans and institutions.'''
          edit(
              'USER_GUIDE.md',
              header_old='**Documentation audit:** through merged PR #133 and the canonical Human Agent, Observatory, and Crucible documentation sync.  ',
              header_new='**Documentation audit:** through SCO Construction Phase 3 E7–E11 verification in PR #148 and the canonical Human Agent, Observatory, Experience, Crucible, Council, and Surgeon documentation sync.  ',
              marker='## 10. Cost and benchmark interpretation',
              sentinel='## SCO Construction advisory runtime',
              block=guide,
          )

          plan = f'''# SCO Construction Arena — Phase 3 E7–E11 Verification Record

```yaml
document_status: VERIFIED_PENDING_PINNED_FINAL_CI
document_version: 2.0.0
