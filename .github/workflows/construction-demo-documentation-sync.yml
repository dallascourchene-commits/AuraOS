name: Construction Demo Documentation and CODEMAP Sync

on:
  push:
    branches:
      - work/construction-arena-real-asset-pack-g4-20260722
    paths:
      - ".aura/run-construction-doc-sync"
      - ".github/workflows/construction-demo-documentation-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construction-demo-documentation-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/construction-arena-real-asset-pack-g4-20260722
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared documentation and map dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update USER_GUIDE and ARCHITECTURE from authenticated proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          proof_path = Path("demo_assets/construction_tuwien/toolchain/asset-proof.json")
          hierarchy_path = Path("demo_assets/construction_tuwien/toolchain/ifc-hierarchy.json")
          if not proof_path.is_file() or not hierarchy_path.is_file():
              raise SystemExit("real Construction proof and authoritative hierarchy are required")
          proof = json.loads(proof_path.read_text(encoding="utf-8"))
          hierarchy = json.loads(hierarchy_path.read_text(encoding="utf-8"))
          if proof.get("runtime_admitted") is not True:
              raise SystemExit("documentation cannot claim a non-admitted asset pack")
          if proof.get("hierarchy_digest") != hierarchy.get("hierarchy_digest"):
              raise SystemExit("documentation proof hierarchy mismatch")
          counts = proof["counts"]
          generated_root = Path("demo_assets/construction_tuwien/generated")
          assets_committed = generated_root.is_dir()

          user_path = Path("USER_GUIDE.md")
          user_text = user_path.read_text(encoding="utf-8")
          user_text, substitutions = re.subn(
              r"\*\*Audit window:\*\*[^\n]*",
              "**Audit window:** architecture and work reviewed through July 22, 2026, including Coding Relationship Compass C0–C9, the AI-safe architecture harness, Construction Arena BIM/Gaussian G0–G3 foundation merged in PR #183, and the authenticated real-toolchain/asset-pack phase in PR #184.",
              user_text,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit("USER_GUIDE audit-window replacement failed")
          user_start = "<!-- AURA_CONSTRUCTION_BIM_GAUSSIAN_GUIDE_START -->"
          user_end = "<!-- AURA_CONSTRUCTION_BIM_GAUSSIAN_GUIDE_END -->"
          user_section = f"""{user_start}

### Build and inspect the Construction BIM/Gaussian demonstration

The Construction demonstration added in PRs #183–#184 is a build-time, local-first asset pipeline for the fictional TU Wien escape-route IFC. It does **not** replace `ConstructionProjectState`, and it grants no survey, professional, regulatory, payment, physical-work, production-mutation, or merge authority.

Verified checkpoint:

```yaml
source: TU Wien Custom Test Model for Escape Route Analysis v2
source_sha256: {proof['source_sha256']}
authoritative_storeys: {counts['storeys']}
indexed_spaces: {counts['spaces']}
indexed_elements: {counts['elements']}
hierarchy_digest: {proof['hierarchy_digest']}
profile: {proof['profile']}
final_file_count: {proof['final_file_count']}
final_asset_bytes: {proof['final_asset_bytes']}
runtime_admitted: true
repository_assets_committed: {str(assets_committed).lower()}
asset_proof_digest: {proof['asset_proof_digest']}
```

The gated route is:

```text
operator-approved pinned IFC acquisition
→ dependency-free STEP preflight
→ authoritative IfcOpenShell hierarchy agreement
→ IfcPatch five-storey split
→ authenticated IfcConvert GLB/SVG conversion
→ deterministic Aura S4-A GLB flattening and runtime import
→ bounded deterministic mesh sampling
→ Niantic SPZ v4 packing from authenticated v3.0.0 source
→ Aura GLB/SPZ runtime admission
→ content-addressed receipts and asset-pack proof
→ G4 fixture projection
```

Primary build and verification owners:

- `aura_construction_demo_contracts.py` — immutable source, storey, representation, and asset-pack identity;
- `scripts/aura_fetch_construction_demo_source.py` — explicit operator-only pinned acquisition;
- `scripts/aura_ifc_storey_index.py` — STEP preflight and authoritative IfcOpenShell hierarchy;
- `scripts/aura_prepare_construction_demo_assets.py` — split/conversion orchestration and receipt chain;
- `scripts/aura_mesh_to_gaussian.py` — deterministic Gaussian sampling, canonical GLB emission, PLY, and SPZ;
- `scripts/aura_verify_construction_demo_assets.py` — bounded command, GLB, SVG, path, and receipt verification;
- `aura_spatial_importers.gltf` and `aura_spatial_importers.spz` — final runtime admission boundaries;
- `demo_assets/construction_tuwien/toolchain/` — authenticated hierarchy and proof metadata;
- `docs/AURA_CONSTRUCTION_ARENA_AUTHORITATIVE_IFC_PROOF.md` and `docs/AURA_CONSTRUCTION_ARENA_REAL_ASSET_PACK_EVIDENCE.md` — durable evidence.

Generated meshes, floor plans, and Gaussian splats are presentation assets only. Never treat their coordinates, bounds, colors, floor labels, or visual overlays as survey truth or authorization to act. Rebuilds must use the exact source/toolchain identities recorded in the receipts; a version, executable, source, hierarchy, or output digest change invalidates resumable output.

{user_end}"""
          if user_start in user_text:
              pattern = re.escape(user_start) + r".*?" + re.escape(user_end)
              user_text, replacements = re.subn(pattern, user_section, user_text, count=1, flags=re.S)
              if replacements != 1:
                  raise SystemExit("USER_GUIDE Construction section replacement failed")
          else:
              anchor = "\n## 20. Use the Financial exact-state layer"
              if anchor not in user_text:
                  raise SystemExit("USER_GUIDE Construction insertion anchor missing")
              user_text = user_text.replace(anchor, "\n" + user_section + "\n" + anchor, 1)
          user_path.write_text(user_text, encoding="utf-8")

          architecture_path = Path(".aura/ARCHITECTURE.md")
          architecture_text = architecture_path.read_text(encoding="utf-8")
          architecture_text, substitutions = re.subn(
              r"\*\*Architecture audit:\*\*[^\n]*",
              "**Architecture audit:** reviewed through July 22, 2026, including Coding Relationship Compass C0–C9, the AI-safe architecture harness, Construction Arena BIM/Gaussian G0–G3 foundation merged in PR #183, and the authenticated real-toolchain/asset-pack phase in PR #184.",
              architecture_text,
              count=1,
          )
          if substitutions != 1:
              raise SystemExit("ARCHITECTURE audit replacement failed")
          arch_start = "<!-- AURA_CONSTRUCTION_BIM_GAUSSIAN_ARCH_START -->"
          arch_end = "<!-- AURA_CONSTRUCTION_BIM_GAUSSIAN_ARCH_END -->"
          arch_section = f"""{arch_start}

### BIM/Gaussian demonstration projection architecture

PR #183 introduced the contract-first G0–G3 compiler foundation; PR #184 binds it to the real, fictional TU Wien IFC and authenticates the complete external toolchain and generated representation chain.

```text
TU Wien pinned source manifest
  → STEP_TEXT_PREFLIGHT_ONLY storey identities
  → IfcOpenShell authoritative project/building/storey/space/element index
  → IfcPatch storey split receipts
  → IfcConvert executable identity + bounded command receipts
  → raw GLB/SVG outputs
  → canonical Aura S4-A flattened GLB + importer receipt
  → deterministic degree-0 Gaussian PLY
  → authenticated Niantic SPZ v4
  → bounded Aura SPZ decode/import receipt
  → immutable ConstructionDemoAssetPack / G4 fixture input
```

Current authenticated evidence:

```yaml
source_sha256: {proof['source_sha256']}
hierarchy_digest: {proof['hierarchy_digest']}
storeys: {counts['storeys']}
spaces: {counts['spaces']}
elements: {counts['elements']}
profile: {proof['profile']}
final_asset_bytes: {proof['final_asset_bytes']}
runtime_admitted: true
repository_assets_committed: {str(assets_committed).lower()}
asset_proof_digest: {proof['asset_proof_digest']}
```

Architectural ownership remains separated:

- `ConstructionProjectState` remains the sole operational Construction truth owner;
- `ConstructionDemoSourceManifest` owns the fictional source identity and attribution only;
- the authoritative IFC hierarchy owns deterministic demo indexing, not survey truth;
- GLB/SVG/PLY/SPZ files are derived presentation representations;
- importer receipts own evidence of bounded decoding, not renderer or domain authority;
- the asset-pack contract owns content-addressed fixture identity only;
- G4 and later Arena surfaces may project these assets but cannot mutate project truth or authorize consequential action.

Security and determinism boundaries include exact source and executable pins, no-follow/root-confined file access, symlink-safe atomic writes, bounded subprocess output and process-group cleanup, canonical storey/output coverage, fragment-only SVG references, fully embedded and flattened GLB, bounded SPZ v4 envelope/decompression/allocation checks, deterministic sampling seeds, coordinate-system declarations, content digests, receipt-chain validation, and explicit human review.

{arch_end}"""
          if arch_start in architecture_text:
              pattern = re.escape(arch_start) + r".*?" + re.escape(arch_end)
              architecture_text, replacements = re.subn(pattern, arch_section, architecture_text, count=1, flags=re.S)
              if replacements != 1:
                  raise SystemExit("ARCHITECTURE Construction section replacement failed")
          else:
              anchor = "\n## 11. Financial Arena exact-state architecture"
              if anchor not in architecture_text:
                  raise SystemExit("ARCHITECTURE Construction insertion anchor missing")
              architecture_text = architecture_text.replace(anchor, "\n" + arch_section + "\n" + anchor, 1)
          architecture_path.write_text(architecture_text, encoding="utf-8")
          PY

      - name: Regenerate and verify canonical CODEMAP and topology
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          python -m aura_codemap_verify
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json
          grep -q "aura_prepare_construction_demo_assets.py" .aura/CODEMAP.md
          grep -q "aura_mesh_to_gaussian.py" .aura/CODEMAP.md
          grep -q "Construction BIM/Gaussian" USER_GUIDE.md
          grep -q "BIM/Gaussian demonstration projection architecture" .aura/ARCHITECTURE.md

      - name: Commit final documentation and generated maps
        run: |
          set -euo pipefail
          rm -f .aura/run-construction-doc-sync
          git config user.name "AuraOS Construction Documentation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            USER_GUIDE.md \
            .aura/ARCHITECTURE.md \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            .aura/run-construction-doc-sync
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(construction): synchronize architecture guide and CODEMAP"
          git push origin HEAD:work/construction-arena-real-asset-pack-g4-20260722
