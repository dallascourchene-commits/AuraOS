name: Triad 2 CI CODEMAP Repair

on:
  push:
    branches:
      - "refactor/triad2-ci-codemap-repair-001"
    paths:
      - ".github/workflows/triad2-ci-codemap-repair.yml"

permissions:
  contents: write

concurrency:
  group: triad2-ci-codemap-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository and verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt hypothesis bandit
      - name: Repair CODEMAP consumer and workflow boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          architect = Path("aura_architect_loop.py")
          text = architect.read_text(encoding="utf-8")
          old = '''def _codemap_paths(codemap: dict[str, Any]) -> set[str]:
              coverage = codemap.get("coverage", {})
              paths = set()
              for item in coverage.get("all_included_paths_sorted", []) or []:
                  normalized = _normalize_path(str(item))
                  if normalized:
                      paths.add(normalized)
              for card in codemap.get("file_cards", []) or []:
                  normalized = _normalize_path(str(card.get("path", "")))
                  if normalized:
                      paths.add(normalized)
              return paths


          def _file_card(codemap: dict[str, Any], target_file: str | None) -> dict[str, Any]:
              normalized = _normalize_path(target_file)
              if not normalized:
                  return {}
              for card in codemap.get("file_cards", []) or []:
                  if _normalize_path(str(card.get("path", ""))) == normalized:
                      return card if isinstance(card, dict) else {}
              return {}
          '''
          # Dedent the exact source block before replacement. Keeping the block here
          # makes this repair fail closed if the consumer changed under us.
          import textwrap
          old = textwrap.dedent(old)
          new = '''def _codemap_file_cards(codemap: dict[str, Any]) -> list[dict[str, Any]]:
              """Return CODEMAP file cards across current and legacy schema generations."""
              cards = codemap.get("files")
              if not isinstance(cards, list):
                  cards = codemap.get("file_cards", [])
              return [card for card in (cards or []) if isinstance(card, dict)]


          def _codemap_paths(codemap: dict[str, Any]) -> set[str]:
              coverage = codemap.get("coverage", {})
              paths = set()
              for item in coverage.get("all_included_paths_sorted", []) or []:
                  normalized = _normalize_path(str(item))
                  if normalized:
                      paths.add(normalized)
              for card in _codemap_file_cards(codemap):
                  normalized = _normalize_path(str(card.get("path", "")))
                  if normalized:
                      paths.add(normalized)
              return paths


          def _file_card(codemap: dict[str, Any], target_file: str | None) -> dict[str, Any]:
              normalized = _normalize_path(target_file)
              if not normalized:
                  return {}
              for card in _codemap_file_cards(codemap):
                  if _normalize_path(str(card.get("path", ""))) == normalized:
                      return card
              return {}
          '''
          new = textwrap.dedent(new)
          if text.count(old) != 1:
              raise SystemExit("CODEMAP consumer source block did not match exactly once; refusing blind patch")
          architect.write_text(text.replace(old, new, 1), encoding="utf-8")

          p7 = Path(".github/workflows/p7-coding-arena-planning-board.yml")
          p7_text = p7.read_text(encoding="utf-8")
          p7_text = p7_text.replace("actions/checkout@v4", "actions/checkout@v7")
          p7_text = p7_text.replace("actions/setup-python@v5", "actions/setup-python@v7")
          p7_text = p7_text.replace("actions/upload-artifact@v4", "actions/upload-artifact@v7")
          p7.write_text(p7_text, encoding="utf-8")

          sync = Path(".github/workflows/sync-analysis-codemap.yml")
          sync_text = sync.read_text(encoding="utf-8")
          sync_text = sync_text.replace("actions/setup-python@v5", "actions/setup-python@v7")
          sync_text = sync_text.replace("actions/upload-artifact@v4", "actions/upload-artifact@v7")
          sync.write_text(sync_text, encoding="utf-8")

          real = Path(".github/workflows/architect-real-refactor-trial.yml")
          real_text = real.read_text(encoding="utf-8")
          old_on = '''on:
            pull_request:
            push:
              branches: ["analysis/**", "refactor/**", main]
              paths-ignore:
                - "aura_workspace/outbox/**"
          '''
          old_on = textwrap.dedent(old_on)
          controlled = [
              "aura_cognitive_labor_router.py",
              "aura_cognitive_labor_router_core.py",
              "aura_refactor_state_identity.py",
              "aura_refactor_state_ledger_core.py",
              "aura_refactor_state_ledger_metrics.py",
              "aura_refactor_state_ledger.py",
              "aura_architect_control.py",
              "aura_refactor_output_vault.py",
              "aura_controlled_refactor_session.py",
              "aura_external_llm_session.py",
              "aura_external_llm_session_safe.py",
              "aura_native_model_gateway.py",
              "aura_arena_architect_connector.py",
              "aura_arena_architect_runtime.py",
              "aura_human_agent_arena_architect.py",
              "aura_agent_arena_mcp_architect.py",
              "aura_arena_connector_server.py",
              "aura_real_refactor_trial.py",
              "Dockerfile.arena-connector",
              "docker-compose.arena-connector.yml",
              "requirements.txt",
              "benchmarks/real_refactor_trial/**",
              "tests/test_aura_benchmark_four.py",
              "tests/test_aura_benchmark_four_hardening.py",
              "tests/test_aura_architect_controls_vault_and_surfaces.py",
              "tests/test_aura_arena_connector_hardening.py",
              "tests/test_aura_state_identity_cycles.py",
              "tests/test_aura_refactor_chronicle_and_length.py",
              "tests/test_aura_external_llm_session.py",
              "tests/test_aura_architect_council_v3.py",
              "tests/test_aura_refactor_output_quality.py",
          ]
          rendered = "on:\n  pull_request:\n    paths:\n" + "".join(f'      - "{item}"\n' for item in controlled)
          rendered += "  push:\n    branches: [\"analysis/**\", \"refactor/**\", main]\n    paths:\n"
          rendered += "".join(f'      - "{item}"\n' for item in controlled)
          if real_text.count(old_on) != 1:
              raise SystemExit("Real-refactor trigger block did not match exactly once; refusing blind patch")
          real_text = real_text.replace(old_on, rendered, 1)
          real_text = real_text.replace("actions/setup-python@v5", "actions/setup-python@v7")
          real_text = real_text.replace("actions/upload-artifact@v4", "actions/upload-artifact@v7")
          real.write_text(real_text, encoding="utf-8")
          PY
      - name: Verify repaired CODEMAP consumer against current and legacy schemas
        run: |
          python - <<'PY'
          import aura_architect_loop as loop
          current = {"files": [{"path": "aura_fusion.py", "topology": {}}], "coverage": {}}
          legacy = {"file_cards": [{"path": "aura_fusion.py", "topology": {}}], "coverage": {}}
          assert loop._codemap_paths(current) == {"aura_fusion.py"}
          assert loop._codemap_paths(legacy) == {"aura_fusion.py"}
          assert loop._file_card(current, "aura_fusion.py")["path"] == "aura_fusion.py"
          assert loop._file_card(legacy, "aura_fusion.py")["path"] == "aura_fusion.py"
          PY
      - name: Regenerate deep topology and canonical CODEMAP projections
        run: |
          python - <<'PY'
          from aura_topological_scanner import compile_topology_map
          payload = compile_topology_map(deep=True)
          assert payload.get("nodes"), "deep topology produced no nodes"
          assert payload.get("edges") is not None, "deep topology produced no edge surface"
          PY
          python scripts/aura_navigation_refresh.py --root .
          python scripts/aura_source_anchor_map.py --root . --check
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.aura/CODEMAP.json').read_text(encoding='utf-8'))
          paths = {str(card.get('path')) for card in payload.get('files', []) if isinstance(card, dict)}
          assert 'aura_architect_loop.py' in paths
          assert 'aura_fusion.py' in paths
          hits = payload.get('symbol_index', {}).get('build_task_capsule', [])
          assert any(item.get('file') == 'aura_fusion.py' for item in hits if isinstance(item, dict))
          assert Path('topology_map.json').stat().st_size > 0
          assert Path('Aura_Memory/live_topology_ast.json').stat().st_size > 0
          PY
      - name: Run exact P7 focused regression matrix
        run: |
          python -m py_compile aura_architect_loop.py aura_codebase_navigator.py
          ruff check --select E4,E7,E9,F --ignore E721 aura_architect_loop.py aura_codebase_navigator.py
          python -m pytest -q \
            tests/test_aura_coding_arena_planning.py \
            tests/test_aura_coding_arena_planning_hardening.py \
            tests/test_aura_coding_arena_planning_contracts.py \
            tests/test_aura_coding_arena_planning_integrity.py \
            tests/test_aura_coding_arena_planning_benchmark.py \
            tests/test_aura_planning_board.py \
            tests/test_aura_planning_regression.py \
            tests/test_aura_planning_frontier.py \
            tests/test_aura_planning_events.py \
            test_aura_architect_loop.py \
            test_aura_liquid_planning_arena.py
      - name: Commit verified repair and regenerated navigation artifacts
        run: |
          git config user.name "Triad 2 CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_architect_loop.py \
            .github/workflows/p7-coding-arena-planning-board.yml \
            .github/workflows/architect-real-refactor-trial.yml \
            .github/workflows/sync-analysis-codemap.yml \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            .aura/SOURCE_ANCHORS.md \
            topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git rm .github/workflows/triad2-ci-codemap-repair.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(ci): repair CODEMAP grounding and regenerate topology"
          git push origin HEAD:"${GITHUB_REF_NAME}"
