name: AWJ032 GLM53 01A synthetic pager C0

on:
  pull_request:
    paths:
      - 'tools/awj032/packed_expert_pager.py'
      - 'tools/awj032/test_packed_expert_pager.py'
      - '.github/workflows/awj032-glm53-01a-pager-c0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pager-c0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pager
        run: python -m py_compile tools/awj032/packed_expert_pager.py tools/awj032/test_packed_expert_pager.py
      - name: Run synthetic pager regressions
        working-directory: tools/awj032
        run: python -m unittest -v test_packed_expert_pager.py
