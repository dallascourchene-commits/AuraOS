name: Apply PR183 Manual Review Fixes

on:
  pull_request:
    paths:
      - ".aura/apply-pr183-now"

permissions:
  contents: write

concurrency:
  group: apply-pr183-manual-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply reviewed remediation diffs to live files
        run: |
          set -euo pipefail
          for patch in .aura/review-remediation/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          rm -rf .aura/review-remediation
          rm -f .aura/pr183-small-*.txt .aura/pr183-payload-*.txt
          rm -f docs/patches/AURA_CONSTRUCTION_G0_COMPASS_RESOLVER_FIX.patch
          rm -f .aura/apply-pr183-now
          rm -f .github/workflows/apply-pr183-manual-fixes.yml
      - name: Install bounded validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "trimesh>=4.7.1,<5.0" \
            "pytest>=8.2.0,<9.0" \
            "ruff>=0.12.0,<1.0"
      - name: Compile and lint edited files
        run: |
          python -m py_compile \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_ifc_storey_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
          ruff check --select E9,F63,F7,F82 \
            aura_construction_demo_contracts.py \
            aura_coding_relationship_compass.py \
            aura_relational_index.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_ifc_storey_index.py \
            scripts/aura_verify_construction_demo_assets.py \
            scripts/aura_prepare_construction_demo_assets.py \
            scripts/aura_mesh_to_gaussian.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py
      - name: Run focused Construction and resolver tests
        id: focused_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_ifc_storey_index.py \
            tests/test_aura_verify_construction_demo_assets.py \
            tests/test_aura_prepare_construction_demo_assets.py \
            tests/test_aura_mesh_to_gaussian.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_relational_index.py \
            2>&1 | tee pytest-pr183.log
      - name: Upload focused pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr183-focused-pytest-${{ github.event.pull_request.head.sha }}
          path: pytest-pr183.log
          retention-days: 1
          if-no-files-found: error
      - name: Enforce focused test success
        if: steps.focused_tests.outcome != 'success'
        run: exit 1
      - name: Commit and publish manually applied fixes
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: address deep Construction review findings"
          for attempt in 1 2 3; do
            git fetch origin "$HEAD_BRANCH"
            git rebase "origin/$HEAD_BRANCH"
            if git push origin HEAD:"$HEAD_BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
