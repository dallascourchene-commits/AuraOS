name: Aura Benchmark Campaign Contracts

on:
  pull_request:
    paths:
      - "benchmarks/arena/**"
      - "tools/benchmarks/**"
      - "tests/test_aura_benchmark_score_admission.py"
      - "tests/test_select_swe_verified_smoke.py"
      - "tests/test_long_horizon_state_benchmark.py"
      - "tests/test_long_horizon_preregistration.py"
      - "tests/test_persistent_adapter_protocol.py"
      - ".github/workflows/aura-benchmark-campaign-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-benchmark-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  benchmark-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Compile benchmark contracts
        run: |
          python -m py_compile \
            tools/benchmarks/aura_benchmark_score_admission.py \
            tools/benchmarks/select_swe_verified_smoke.py \
            tools/benchmarks/long_horizon_state_benchmark.py \
            tools/benchmarks/long_horizon_preregistration.py \
            tools/benchmarks/persistent_adapter_protocol.py \
            tests/test_aura_benchmark_score_admission.py \
            tests/test_select_swe_verified_smoke.py \
            tests/test_long_horizon_state_benchmark.py \
            tests/test_long_horizon_preregistration.py \
            tests/test_persistent_adapter_protocol.py
      - name: Validate campaign manifest JSON
        run: python -m json.tool benchmarks/arena/campaign_v1.json > /dev/null
      - name: Run focused adversarial suite
        run: |
          python -m pytest -q \
            tests/test_aura_benchmark_score_admission.py \
            tests/test_select_swe_verified_smoke.py \
            tests/test_long_horizon_state_benchmark.py \
            tests/test_long_horizon_preregistration.py \
            tests/test_persistent_adapter_protocol.py
