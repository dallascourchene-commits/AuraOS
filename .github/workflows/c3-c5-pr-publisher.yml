name: C3-C5 PR Publisher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: c3-c5-pr-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c3-c5-20260721'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coding-relationship-compass-c3-c5-20260721
          fetch-depth: 10
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract staged patch and reset baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/c3-c5-guarded-publish.yml')
          for line in path.read_text(encoding='utf-8').splitlines():
              marker = '          PATCH_B64: '
              if line.startswith(marker):
                  Path('/tmp/c3-c5.patch.gz.b64').write_text(line[len(marker):] + '\n', encoding='utf-8')
                  break
          else:
              raise SystemExit('staged PATCH_B64 not found')
          PY
          BASE_SHA=9cd461ad7e7cea189f1e2d1e9e652705c563a430
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git reset --hard "$BASE_SHA"
      - name: Apply exact C3-C5 patch
        run: |
          set -euo pipefail
          base64 -d /tmp/c3-c5.patch.gz.b64 | gzip -d > /tmp/c3-c5.patch
          set +e
          git apply --index --3way --whitespace=fix --verbose /tmp/c3-c5.patch > /tmp/apply.log 2>&1
          rc=$?
          set -e
          cat /tmp/apply.log
          test "$rc" -eq 0
          git diff --cached --check
      - name: Install focused dependencies
        run: python -m pip install --quiet pytest jsonschema
      - name: Verify C3-C5
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_coding_relationship_compass.py \
            aura_coding_waboose_breadboard.py \
            aura_planning_board.py \
            aura_relational_index.py \
            aura_relationship_atlas.py \
            aura_relationship_contracts.py
          PYTHONPATH=. pytest -q \
            tests/test_aura_planning_board.py \
            tests/test_aura_coding_arena_planning.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_coding_waboose_breadboard.py \
            tests/test_aura_relational_index.py \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_relationship_contracts.py \
            test_aura_architect_loop.py \
            tests/test_aura_architecture_harness.py
      - name: Publish clean C3-C5 commit
        run: |
          set -euo pipefail
          EXPECTED_HEAD="$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement Coding Relationship Compass C3-C5"
          NEW_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/work/coding-relationship-compass-c3-c5-20260721:$EXPECTED_HEAD \
            origin "$NEW_HEAD":refs/heads/work/coding-relationship-compass-c3-c5-20260721
