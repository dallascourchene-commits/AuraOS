name: C3-C5 PR Publisher

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: c3-c5-pr-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'work/coding-relationship-compass-c3-c5-20260721' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Quiet checkout and reconstruct verified patch
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin work/coding-relationship-compass-c3-c5-20260721
          git checkout -q -B work/coding-relationship-compass-c3-c5-20260721 FETCH_HEAD
          cat \
            .github/c3-c5-payload/00 \
            .github/c3-c5-payload/01 \
            .github/c3-c5-payload/01a \
            .github/c3-c5-payload/01b \
            .github/c3-c5-payload/02 \
            .github/c3-c5-payload/03 \
            .github/c3-c5-payload/04 \
            .github/c3-c5-payload/05 \
            > /tmp/c3-c5.patch.gz.b64
          test "$(wc -c < /tmp/c3-c5.patch.gz.b64)" -eq 35704
          echo '5a66ba1bd391a42500e5ce554ac1297cbd34958d6bd03809318b732f318ffecb  /tmp/c3-c5.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/c3-c5.patch.gz.b64 | gzip -d > /tmp/c3-c5.patch
          echo 'c15df307b134758dc8cbf0309ca7d10dd8bf90dbf797a5371d511b845aa8592e  /tmp/c3-c5.patch' | sha256sum -c -
          git fetch --quiet --depth=100 origin main
          BASE_SHA=9cd461ad7e7cea189f1e2d1e9e652705c563a430
          git reset --hard "$BASE_SHA"
          git apply --index --whitespace=fix /tmp/c3-c5.patch
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --quiet pytest jsonschema numpy
      - name: Verify C3-C5
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_coding_relationship_compass.py \
            aura_coding_waboose_breadboard.py \
            aura_planning_board.py \
            aura_relational_index.py \
            aura_relationship_atlas.py \
            aura_relationship_contracts.py
          PYTHONPATH=. pytest -q \
            tests/test_aura_planning_board.py \
            tests/test_aura_coding_arena_planning.py \
            tests/test_aura_coding_relationship_compass.py \
            tests/test_aura_coding_waboose_breadboard.py \
            tests/test_aura_relational_index.py \
            tests/test_aura_relationship_atlas.py \
            tests/test_aura_relationship_contracts.py \
            test_aura_architect_loop.py \
            tests/test_aura_architecture_harness.py
      - name: Publish clean C3-C5 commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement Coding Relationship Compass C3-C5"
          NEW_HEAD=$(git rev-parse HEAD)
          git push --force-with-lease=refs/heads/work/coding-relationship-compass-c3-c5-20260721:$EXPECTED_HEAD \
            origin "$NEW_HEAD":refs/heads/work/coding-relationship-compass-c3-c5-20260721
