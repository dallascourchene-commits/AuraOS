name: Diagnose retained Construction renderer contracts

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-review-diagnose.yml"

permissions:
  contents: read

concurrency:
  group: aura-construction-g7-g8-review-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize reviewed renderer tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/aura-construction-g7-g8-review-repair-v6.yml')
          source = workflow.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n\n      - name: Install focused", start)
          exec(compile(textwrap.dedent(source[start:end]), str(workflow), 'exec'), {})
          PY

      - name: Mesh pass retained contract
        run: node --test --test-name-pattern="^Construction mesh pass preserves" tests/js/spatial-construction-demo.test.mjs
      - name: Overlay pass retained contract
        run: node --test --test-name-pattern="^Construction overlay pass supports" tests/js/spatial-construction-demo.test.mjs
      - name: WebGL Gaussian retained contract
        run: node --test --test-name-pattern="^degree-0 WebGL2 Gaussian pass caps" tests/js/spatial-construction-demo.test.mjs
      - name: Hybrid renderer retained contract
        run: node --test --test-name-pattern="^Construction scene renderer composes" tests/js/spatial-construction-demo.test.mjs
      - name: Cancellation and device-loss retained contract
        run: node --test --test-name-pattern="^Construction renderer cancellation" tests/js/spatial-construction-demo.test.mjs
      - name: Initialization-failure retained contract
        run: node --test --test-name-pattern="^Construction renderer Gaussian initialization" tests/js/spatial-construction-demo.test.mjs
      - name: Mid-flight abort retained contract
        run: node --test --test-name-pattern="^Construction renderer mid-flight abort" tests/js/spatial-construction-demo.test.mjs
      - name: Storey isolation retained contract
        run: node --test --test-name-pattern="^Construction storey isolation" tests/js/spatial-construction-demo.test.mjs
      - name: Rotated Gaussian matrix retained contract
        run: node --test --test-name-pattern="^degree-0 Gaussian pass applies" tests/js/spatial-construction-demo.test.mjs
      - name: Overlay provenance retained contract
        run: node --test --test-name-pattern="^PUBLIC overlay classification" tests/js/spatial-construction-demo.test.mjs
      - name: Retryable cleanup new contract
        run: node --test --test-name-pattern="mesh cleanup failure" tests/js/spatial-construction-demo.test.mjs
      - name: Partial allocation new contract
        run: node --test --test-name-pattern="partial buffer allocation" tests/js/spatial-construction-demo.test.mjs
