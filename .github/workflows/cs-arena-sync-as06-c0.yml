name: CS Arena Sync AS-06 C0

on:
  push:
    branches:
      - cs-arena-sync-001/as06-c0-rebase-20260830
  pull_request:
    paths:
      - aura_arena_artifact_event_core.py
      - aura_artifact_persistence_index.py
      - tests/test_aura_arena_artifact_event_core.py
      - tests/test_aura_artifact_persistence_index_c0.py
      - .github/workflows/cs-arena-sync-as06-c0.yml

permissions:
  contents: read

jobs:
  exact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact AS-02/AS-06 slice
        run: |
          python -m py_compile aura_arena_artifact_event_core.py aura_artifact_persistence_index.py
      - name: Run repaired AS-02 regressions
        run: python -m unittest -v tests.test_aura_arena_artifact_event_core
      - name: Run AS-06 C0 compatibility regressions
        run: python -m unittest -v tests.test_aura_artifact_persistence_index_c0
