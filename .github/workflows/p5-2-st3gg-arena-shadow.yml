name: P5.2 Arena ST3GG V2 shadow

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

concurrency:
  group: p5-2-arena-st3gg-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-arena-shadow:
    name: Arena ST3GG shadow (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest ruff
      - name: Compile V1, V2, and shadow compatibility surfaces
        run: |
          python -m py_compile \
            aura_arena_st3gg_codec.py \
            aura_arena_st3gg_shadow.py \
            aura_st3gg_contracts.py \
            aura_st3gg_recall.py \
            test_aura_arena_st3gg_codec.py \
            tests/test_aura_arena_st3gg_shadow.py \
            tests/test_aura_st3gg_contracts.py
      - name: Fatal and static correctness lint
        run: |
          ruff check --select E4,E7,E9,F \
            aura_arena_st3gg_shadow.py \
            tests/test_aura_arena_st3gg_shadow.py
      - name: Run focused shadow and compatibility tests
        id: focused-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_aura_arena_st3gg_shadow.py \
            tests/test_aura_st3gg_contracts.py \
            test_aura_arena_st3gg_codec.py \
            > "p5-2-pytest-${{ matrix.python-version }}.txt" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat "p5-2-pytest-${{ matrix.python-version }}.txt"
          exit 0
      - name: Upload focused diagnostics on failure
        if: steps.focused-tests.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: p5-2-pytest-${{ matrix.python-version }}
          path: p5-2-pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce focused test result
        if: steps.focused-tests.outputs.status != '0'
        run: exit 1
