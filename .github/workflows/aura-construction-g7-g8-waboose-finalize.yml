name: Publish exact residual Construction Waboose fixes

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-g7-g8-waboose-finalize.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-waboose-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          python -m pip install -q --disable-pip-version-check -r requirements.txt
          python -m pip install -q --disable-pip-version-check bandit defusedxml jsonschema pytest ruff

      - name: Apply exact Waboose security corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          original = Path('.github/workflows/aura-construction-g7-g8-waboose-fixes.yml')
          source = original.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n\n      - name: Apply Ruff", start)
          exec(compile(textwrap.dedent(source[start:end]), str(original), 'exec'), {})

          for relative in (
              'scripts/aura_prepare_construction_demo_assets_core.py',
              'scripts/aura_verify_construction_demo_assets.py',
          ):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              text = text.replace('  # noqa: E402', '')
              lines = [line for line in text.splitlines() if not line.startswith('# ruff: noqa: E402')]
              insert_at = 1 if lines and lines[0].startswith('#!') else 0
              lines.insert(insert_at, '# ruff: noqa: E402')
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          projection = Path('aura_construction_demo_projection.py')
          text = projection.read_text(encoding='utf-8')
          text = text.replace('  # nosec B105 - capability flag, not a credential', '')
          text = text.replace('  # nosec B105 - capability flag', '')
          projection.write_text(text, encoding='utf-8')

          cli = Path('aura_spatial_cli.py')
          text = cli.read_text(encoding='utf-8')
          text = text.replace(
              'subprocess.run(  # nosec B603 - fixed arguments and resolved executable',
              'subprocess.run(',
          )
          cli.write_text(text, encoding='utf-8')

          verifier = Path('scripts/aura_verify_construction_demo_assets.py')
          text = verifier.read_text(encoding='utf-8')
          text = text.replace(
              'subprocess.Popen(  # nosec B603 - argv is sequence-only and executable is resolved',
              'subprocess.Popen(',
          )
          verifier.write_text(text, encoding='utf-8')

          contract_test = Path('tests/test_aura_construction_demo_contracts.py')
          text = contract_test.read_text(encoding='utf-8')
          text = text.replace('match="CC BY 4.0"', 'match=r"CC BY 4\\.0"')
          contract_test.write_text(text, encoding='utf-8')
          PY

      - name: Apply safe Ruff fixes and formatting
        run: |
          FILES=(
            aura_construction_demo_contracts.py aura_construction_demo_director.py
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py
            aura_construction_demo_projection.py aura_spatial_cli.py
            scripts/aura_fetch_construction_demo_source.py
            scripts/aura_prepare_construction_demo_assets_core.py
            scripts/aura_verify_construction_demo_assets.py
            tests/test_aura_construction_demo_contracts.py
            tests/test_aura_construction_demo_director.py
            tests/test_aura_construction_demo_fixture.py
            tests/test_aura_construction_demo_projection.py
            tests/test_aura_fetch_construction_demo_source.py
            tests/test_aura_spatial_cli_construction_security.py
            tests/test_aura_verify_construction_demo_assets.py
          )
          ruff check --fix --exit-zero "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Verify medium-high Bandit findings are clear
        run: |
          bandit -q -ll \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py

      - name: Verify focused Python regressions
        run: |
          python -m py_compile \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py

      - name: Verify retained browser regressions
        run: |
          node --check aura_spatial_web/construction_demo_app.js
          node --check aura_spatial_web/construction_mesh_pass.js
          node --check aura_spatial_web/construction_overlay_pass.js
          node --check aura_spatial_web/construction_scene_renderer.js
          node --check aura_spatial_web/gaussian_renderer.js
          node --check aura_spatial_web/webgl2_gaussian_pass.js
          node --test tests/js/spatial-construction-demo.test.mjs
          node --test tests/js/spatial-construction-review-regressions.test.mjs
          node --test tests/js/spatial-gaussian-covariance.test.mjs

      - name: Commit and publish verified source fixes
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "AuraOS Waboose Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_construction_demo_contracts.py aura_construction_demo_director.py \
            aura_construction_demo_fixture.py aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py aura_spatial_cli.py \
            scripts/aura_fetch_construction_demo_source.py \
            scripts/aura_prepare_construction_demo_assets_core.py \
            scripts/aura_verify_construction_demo_assets.py \
            tests/test_aura_construction_demo_contracts.py \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_fetch_construction_demo_source.py \
            tests/test_aura_spatial_cli_construction_security.py \
            tests/test_aura_verify_construction_demo_assets.py
          git commit -m "fix(g8): apply exact Waboose security and lint findings"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
