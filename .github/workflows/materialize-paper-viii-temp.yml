name: Materialize canonical Paper VIII

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/materialize-paper-viii-temp.yml

permissions:
  contents: write

jobs:
  materialize-paper-viii:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the canonical Zenodo PDF
        env:
          ZENODO_RECORD: "21465329"
          OUTPUT_PATH: "papers/AuraOS_Paper_VIII_Evidence_Ordered_Relational_Arenas.pdf"
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          record = os.environ["ZENODO_RECORD"]
          output = Path(os.environ["OUTPUT_PATH"])
          output.parent.mkdir(parents=True, exist_ok=True)

          request = Request(
              f"https://zenodo.org/api/records/{record}",
              headers={"User-Agent": "AuraOS-Paper-Archiver/1.0"},
          )
          with urlopen(request, timeout=60) as response:
              payload = json.load(response)

          pdfs = [item for item in payload.get("files", []) if str(item.get("key", "")).lower().endswith(".pdf")]
          if not pdfs:
              raise SystemExit(f"Zenodo record {record} contains no PDF")
          selected = max(pdfs, key=lambda item: int(item.get("size", 0) or 0))
          links = selected.get("links", {})
          url = links.get("content") or links.get("self")
          if not url:
              raise SystemExit("Selected Zenodo PDF has no downloadable content URL")

          download = Request(url, headers={"User-Agent": "AuraOS-Paper-Archiver/1.0"})
          with urlopen(download, timeout=120) as response:
              data = response.read()
          if not data.startswith(b"%PDF-"):
              raise SystemExit("Downloaded Zenodo artifact is not a PDF")

          checksum = str(selected.get("checksum", ""))
          if checksum.startswith("md5:"):
              observed = hashlib.md5(data, usedforsecurity=False).hexdigest()
              if observed != checksum.split(":", 1)[1]:
                  raise SystemExit("Zenodo checksum mismatch")

          output.write_bytes(data)
          print(json.dumps({
              "zenodo_record": record,
              "zenodo_file": selected.get("key"),
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "repository_path": str(output),
          }, sort_keys=True))
          PY

      - name: Replace obsolete Paper VIII references and drafts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("Zenodo 21464058", "Zenodo 21465329")
          text = text.replace(
              "https://zenodo.org/records/21464058",
              "https://zenodo.org/records/21465329",
          )
          text = text.replace(
              "[LaTeX source](AuraOS_Paper_VIII_Evidence_Ordered_Relational_Arenas.tex)",
              "[PDF](papers/AuraOS_Paper_VIII_Evidence_Ordered_Relational_Arenas.pdf)",
          )
          obsolete = (
              "The two earlier N31–N41 manuscripts were never released and are superseded. "
              "They are not part of the canonical claim sequence. "
          )
          text = text.replace(obsolete, "")
          text = text.replace(
              "The two earlier N31-N41 manuscripts were never released and are superseded. "
              "They are not part of the canonical claim sequence. ",
              "",
          )
          required = [
              "https://zenodo.org/records/21465329",
              "papers/AuraOS_Paper_VIII_Evidence_Ordered_Relational_Arenas.pdf",
              "N31–N50",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"README update missing required values: {missing}")
          readme.write_text(text, encoding="utf-8")
          PY

          rm -f \
            AuraOS_Prior_Art_2026.pdf \
            'AuraOS_Prior_Art_2026(1).pdf' \
            AuraOS_Prior_Art_2026.tex \
            papers/AuraOS_Prior_Art_2026.pdf \
            'papers/AuraOS_Prior_Art_2026(1).pdf' \
            papers/AuraOS_Prior_Art_2026.tex

      - name: Commit the canonical paper and remove this temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-paper-viii-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repository changes were required."
            exit 0
          fi
          git commit -m "docs: archive canonical Paper VIII from Zenodo [skip ci]"
          git push origin HEAD:main
