name: WC01 Triad1 Phase4 Stage Copy
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/wc01-triad1-phase4-stage.yml
permissions:
  contents: write
concurrency:
  group: wc01-triad1-phase4-stage-copy
  cancel-in-progress: false
jobs:
  stage_copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bind canonical source and stage exact copy
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git hash-object docs/formal/AURA_MATHEMATICAL_SPECIFICATION_V1.tex)" = "11ea3550a8d79e9ce4ce339ef110fa22ef84dbea"
          mkdir -p docs/staging/arxiv_submission
          cp docs/formal/AURA_MATHEMATICAL_SPECIFICATION_V1.tex docs/staging/arxiv_submission/AURA_MATHEMATICAL_SPECIFICATION_V1.tex
          cmp -s docs/formal/AURA_MATHEMATICAL_SPECIFICATION_V1.tex docs/staging/arxiv_submission/AURA_MATHEMATICAL_SPECIFICATION_V1.tex
          test "$(git hash-object docs/staging/arxiv_submission/AURA_MATHEMATICAL_SPECIFICATION_V1.tex)" = "11ea3550a8d79e9ce4ce339ef110fa22ef84dbea"
      - name: Commit staged copy and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wc01-triad1-phase4-stage.yml
          git config user.name "AuraOS WC01 Stager"
          git config user.email "actions@users.noreply.github.com"
          git add docs/staging/arxiv_submission/AURA_MATHEMATICAL_SPECIFICATION_V1.tex .github/workflows/wc01-triad1-phase4-stage.yml
          git diff --cached --check
          git commit -m "docs(staging): bind WC-01 Phase4 arXiv source"
          git push origin HEAD:main
