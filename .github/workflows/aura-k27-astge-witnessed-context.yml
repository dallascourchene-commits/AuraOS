name: Aura K27 ASTGE Witnessed Readonly Context

on:
  pull_request:
    paths:
      - 'crates/aura-k27-astge/**'
      - 'crates/aura-k27-astge-ingest/**'
      - 'crates/aura-k27-astge-materialize/**'
      - 'scripts/aura_source_anchor_map.py'
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - '.github/workflows/aura-k27-astge-witnessed-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witnessed-readonly-context:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove source currentness owner
        run: |
          python3 --version
          python3 -m py_compile scripts/aura_source_anchor_map.py scripts/aura_astge_anchor_hydration.py
          python3 scripts/aura_source_anchor_map.py --root . --check
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration

      - name: Re-prove current graph and materialization planes
        run: |
          rustc --version
          cargo --version
          cargo test --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets
          cargo test --manifest-path crates/aura-k27-astge-ingest/Cargo.toml --all-targets
          cargo fmt --manifest-path crates/aura-k27-astge-materialize/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-materialize/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge-ingest/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge-materialize/Cargo.toml --all-targets -- -D warnings
          if grep -R --line-number -E 'unsafe\s*\{' crates/aura-k27-astge/src crates/aura-k27-astge-ingest/src crates/aura-k27-astge-materialize/src; then
            echo 'unsafe block found in witnessed read-only context path' >&2
            exit 1
          fi

      - name: Emit consequence ceiling
        run: |
          echo 'SOURCE_BODY_WITNESS_REQUIRED=true'
          echo 'UNKNOWN_OR_STALE_SOURCE_ADMITTED=false'
          echo 'CURRENT_SOURCE_MATERIALIZATION_REVALIDATED=true'
          echo 'CURRENT_GRAPH_CONE_VERIFIED=true'
          echo 'PRODUCTION_BACKEND_DEFAULT=READ_SEEK_SAFE_DEFAULT'
          echo 'PRODUCTION_IMMUTABILITY_CAPABILITIES=0'
          echo 'SNAPSHOT_PLACEMENT_AXIS_BINDING_PROVEN=false'
          echo 'MMAP_PROMOTED=false'
          echo 'SEMANTIC_TRUTH_PROVEN=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
          echo 'EXTERNAL_EFFECT=false'
