name: UMC Greptile QDKT follow-up fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/unified-memory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD: c4e00f09a4e58f5b60f6a630abd08444230fdbeb
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: refactor/unified-memory-continuity
      TRIGGER_PATH: .aura/refactor_payloads/umc_greptile_qdkt_followup.trigger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVENT_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger and apply patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1)"
          git diff --name-only "$SOURCE_HEAD" "$EVENT_HEAD" > "${RUNNER_TEMP}/event-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          changed = set((Path(os.environ['RUNNER_TEMP']) / 'event-paths.txt').read_text().splitlines())
          trigger = os.environ['TRIGGER_PATH']
          allowed = {
              trigger,
              '.aura/CODEMAP.json',
              '.aura/CODEMAP.md',
              'Aura_Memory/live_topology_ast.json',
              'topology_map.json',
          }
          if trigger not in changed:
              raise SystemExit('expected trigger path is absent')
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected pre-fix paths: {sorted(unexpected)}')
          PY

          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          module_path = Path('aura_unified_memory_continuity.py')
          module = module_path.read_text(encoding='utf-8')
          i8 = ' ' * 8
          i12 = ' ' * 12
          i16 = ' ' * 16

          old_receipts = '\n'.join((
              f'{i8}required_relationship_receipts = {{',
              f'{i12}learning_decision.continuity_receipt_ref,',
              f'{i12}learning_decision.crucible_proposal_ref,',
              f'{i12}learning_decision.current_reproof_ref,',
              f'{i12}learning_decision.human_disposition_ref,',
              f'{i8}}}',
          ))
          new_receipts = '\n'.join((
              f'{i8}required_relationship_receipts = {{',
              f'{i12}ref',
              f'{i12}for ref in (',
              f'{i16}learning_decision.continuity_receipt_ref,',
              f'{i16}learning_decision.crucible_proposal_ref,',
              f'{i16}learning_decision.current_reproof_ref,',
              f'{i16}learning_decision.human_disposition_ref,',
              f'{i12})',
              f'{i12}if ref',
              f'{i8}}}',
          ))
          if module.count(old_receipts) != 1:
              raise SystemExit('QDKT receipt-set anchor is ambiguous')
          module = module.replace(old_receipts, new_receipts, 1)

          old_verifier = '\n'.join((
              f'{i8}if (',
              f'{i12}learning_decision.independent_verifier_ref',
              f'{i12}not in relationship_experience.verifier_evidence_refs',
              f'{i8}):',
              f'{i12}raise ValueError("Relationship Experience omits the independent verifier")',
          ))
          new_verifier = '\n'.join((
              f'{i8}if (',
              f'{i12}learning_decision.independent_verifier_ref',
              f'{i12}and learning_decision.independent_verifier_ref',
              f'{i12}not in relationship_experience.verifier_evidence_refs',
              f'{i8}):',
              f'{i12}raise ValueError("Relationship Experience omits the independent verifier")',
          ))
          if module.count(old_verifier) != 1:
              raise SystemExit('QDKT verifier anchor is ambiguous')
          module_path.write_text(module.replace(old_verifier, new_verifier, 1), encoding='utf-8')

          tests_path = Path('tests/test_aura_unified_memory_continuity.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = 'def test_qdkt_ineligible_decision_with_relationship_fails_closed() -> None:'
          if marker in tests:
              raise SystemExit('QDKT fail-closed regression already present')
          test_block = dedent(
              '''
              def test_qdkt_ineligible_decision_with_relationship_fails_closed() -> None:
                  intent, _, _, _, _, _, _, _, receipt = _vertical_fixture()
                  approved = _approved_learning_decision(receipt)
                  relationship = _relationship_observation(intent, receipt, approved)
                  ineligible = evaluate_learning_to_reproof(
                      relationship_id=approved.relationship_id,
                      relationship_digest=approved.relationship_digest,
                      repository_head=HEAD,
                      current_source_digest=SOURCE_DIGEST,
                      continuity_receipt=receipt,
                      human_disposition="APPROVED",
                  )

                  admission = evaluate_qdkt_consequential_admission(
                      continuity_receipt=receipt,
                      learning_decision=ineligible,
                      relationship_experience=relationship,
                      raw_evidence_refs=receipt.raw_evidence_refs,
                      current_repository_head=HEAD,
                      current_source_digest=SOURCE_DIGEST,
                      purpose_compatible=True,
                      privacy_compatible=True,
                      consent_compatible=True,
                      sovereignty_compatible=True,
                  )

                  assert admission.admitted is False
                  assert "LEARNING_REPROOF_NOT_ELIGIBLE" in admission.blockers
                  assert "MISSING_CRUCIBLE_PROPOSAL" in admission.blockers
                  assert "MISSING_CURRENT_REPROOF" in admission.blockers
                  assert "MISSING_INDEPENDENT_VERIFIER" in admission.blockers
                  assert "MISSING_HUMAN_DISPOSITION" in admission.blockers
              '''
          ).strip()
          tests_path.write_text(f'{tests.rstrip()}\n\n\n{test_block}\n', encoding='utf-8')
          PY

          git rm -- "$TRIGGER_PATH"
          git diff --check

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'pytest>=8,<9' jsonschema ruff bandit

      - name: Run static checks
        run: |
          python -m py_compile aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          ruff check aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          bandit -q -ll aura_unified_memory_continuity.py

      - name: Run focused regressions
        run: |
          python -m pytest -q tests/test_aura_unified_memory_continuity.py tests/test_aura_relationship_compass_finalization.py

      - name: Publish bounded fix
        shell: bash
        run: |
          set -euo pipefail
          git add -- aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual.txt"
          printf '%s\n' "$TRIGGER_PATH" aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py | sort > "${RUNNER_TEMP}/expected.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/actual.txt"
          latest="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$latest" = "$EVENT_HEAD"
          git config user.name 'AuraOS Greptile Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: keep ineligible QDKT admission fail-closed'
          git push origin "HEAD:${TARGET_BRANCH}"
