name: Aura WorkCapsule Owner-Bound Re-entry Closure

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - 'scripts/aura_workcapsule_reentry_exact_verifier.py'
      - 'tests/test_aura_workcapsule_reentry_exact_verifier.py'
      - 'scripts/aura_workcapsule_source_bound_exact_reentry.py'
      - 'tests/test_aura_workcapsule_source_bound_exact_reentry.py'
      - 'scripts/aura_workcapsule_reentry_closure.py'
      - 'tests/test_aura_workcapsule_reentry_closure.py'
      - 'scripts/aura_workcapsule_observation_bound_closure.py'
      - 'tests/test_aura_workcapsule_observation_bound_closure.py'
      - 'scripts/aura_workcapsule_owner_bound_reentry_closure.py'
      - 'tests/test_aura_workcapsule_owner_bound_reentry_closure.py'
      - '.github/workflows/aura-workcapsule-owner-bound-reentry-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-bound-reentry-closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove PR514 source-owner-bound exact re-entry
        run: |
          python3 -m py_compile scripts/aura_source_anchor_map.py scripts/aura_astge_anchor_hydration.py
          python3 -m py_compile scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py
          python3 -m py_compile scripts/aura_workcapsule_source_reentry_observation.py scripts/aura_workcapsule_reentry_exact_verifier.py
          python3 -m py_compile scripts/aura_workcapsule_source_bound_exact_reentry.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration
          python3 -m unittest -v tests.test_aura_workcapsule_context_binding
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_invalidation
          python3 -m unittest -v tests.test_aura_workcapsule_source_reentry_observation
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_exact_verifier
          python3 -m unittest -v tests.test_aura_workcapsule_source_bound_exact_reentry

      - name: Re-prove PR516 observation-bound closure
        run: |
          python3 -m py_compile scripts/aura_workcapsule_reentry_closure.py scripts/aura_workcapsule_observation_bound_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure
          python3 -m unittest -v tests.test_aura_workcapsule_observation_bound_closure

      - name: Prove same-owner plan and candidate closure
        run: |
          python3 -m py_compile scripts/aura_workcapsule_owner_bound_reentry_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_owner_bound_reentry_closure

      - name: Assert caller plan and candidate escape hatches are absent
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_owner_bound_reentry_closure import compile_owner_bound_reentry_closure
          params = inspect.signature(compile_owner_bound_reentry_closure).parameters
          assert 'reentry_receipt' not in params
          assert 'candidate_binding' not in params
          assert 'root' in params and 'witness_manifest' in params
          assert 'observed_graph_witness' in params and 'candidate_graph_witness' in params
          print('CALLER_REENTRY_RECEIPT_PARAMETER_PRESENT=false')
          print('CALLER_CANDIDATE_BINDING_PARAMETER_PRESENT=false')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'SAME_RAW_SOURCE_OBSERVATION_DRIVES_PLAN_AND_CANDIDATE=true'
          echo 'OWNER_DERIVED_REENTRY_PLAN=true'
          echo 'OWNER_DERIVED_CANDIDATE_SOURCE_BASIS=true'
          echo 'CALLER_REENTRY_RECEIPT_ACCEPTED=false'
          echo 'CALLER_CANDIDATE_BINDING_ACCEPTED=false'
          echo 'EXACT_END_TO_END_REPRODUCTION_REQUIRED=true'
          echo 'GRAPH_WITNESS_PRODUCER_AUTHENTICATED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
