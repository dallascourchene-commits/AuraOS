name: ThinkPad Longitudinal Envelope Series

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PR597_SHA: 28867452e25c0fe0159014c8bebc2ee18c925dd7
  PR581_SHA: 4b0cdcef93bfaf09d8bb4545a9e022f922067dc7
  PR597_RUN: '33363191808'
  PR581_RUN: '33361104103'
  CONVERGENCE_SHA: f8b3eb6166e4bd906d3ea895d77178204bc3f361
  T3_OBSERVER_BLOB: fa5200aa3fdfe9f41eb6ab8c5f476024bc874171

jobs:
  exact-longitudinal-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact child and prove PR597 x PR581 convergence
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=280 origin "$TARGET_SHA" "$CONVERGENCE_SHA" "$PR597_SHA" "$PR581_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git show -s --format=%P "$CONVERGENCE_SHA")" = "$PR597_SHA $PR581_SHA"
          git merge-base --is-ancestor "$PR597_SHA" HEAD
          git merge-base --is-ancestor "$PR581_SHA" HEAD
          test "$(git hash-object tools/thinkpad_sustained_operating_envelope.py)" = "$T3_OBSERVER_BLOB"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Pin exact-green parent artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = {
              os.environ["PR597_RUN"]: os.environ["PR597_SHA"],
              os.environ["PR581_RUN"]: os.environ["PR581_SHA"],
          }
          for run_id, sha in expected.items():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  run = json.load(response)
              assert run["conclusion"] == "success", run
              assert run["head_sha"] == sha, (run["head_sha"], sha)
          print("PARENT_ARTIFACTS_EXACT_GREEN=true")
          PY

      - name: Prove longitudinal phase correlation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/thinkpad_sustained_operating_envelope.py \
            tools/thinkpad_longitudinal_envelope_series.py \
            tools/test_thinkpad_longitudinal_envelope_series.py
          python3 -m unittest -v tools.test_thinkpad_longitudinal_envelope_series

      - name: Assert correlation and authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          from tools.thinkpad_longitudinal_envelope_series import (
              ThinkPadLongitudinalEnvelopeSeries,
              build_longitudinal_envelope_series,
          )
          assert list(inspect.signature(build_longitudinal_envelope_series).parameters) == [
              "benchmark_request_digest",
              "query_sequence_sha256",
              "process_cold",
              "process_warm",
              "restart",
          ]
          false_fields = {
              "same_host_proven",
              "benchmark_execution_proven",
              "thermal_throttling_proven",
              "temperature_caused_performance_change",
              "memory_pressure_caused_performance_change",
              "battery_state_caused_performance_change",
              "performance_winner_proven",
              "current_now_proven",
              "producer_authenticated",
              "g2_admitted",
              "effect_authority_proven",
          }
          fields = ThinkPadLongitudinalEnvelopeSeries.__dataclass_fields__
          for name in false_fields:
              assert fields[name].default is False, name
          print("PHASE_CORRELATION_NE_CAUSALITY=true")
          print("HISTORICAL_SERIES_NE_CURRENT_NOW=true")
          print("SAME_HOST_PROVEN=false")
          print("G2_ADMITTED=false")
          PY
