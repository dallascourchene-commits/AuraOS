name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "scripts/aura_construction_second_review_repair.py"
      - "aura_construction_demo_projection.py"
      - "aura_spatial_web/construction_scene_renderer.js"
      - "tests/test_aura_construction_demo_projection.py"
      - "tests/js/spatial-construction-review-regressions.test.mjs"

permissions:
  contents: write

concurrency:
  group: aura-construction-review-repair-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 128

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p /tmp/aura-review-repair/status

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pytest ruff zstandard

      - name: Apply review repairs
        continue-on-error: true
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/aura_construction_second_review_repair.py")
          text = path.read_text(encoding="utf-8")
          old = '''    frame_lookup = (
              "                    next(item.frame_id for item in storeys if item.storey_id == package.storey_id),\\n"
          )
              if "                    package_frame_id,\\n" not in text:
                  count = text.count(frame_lookup)
                  if count != 2:
                      raise RuntimeError(f"package frame lookup: expected two spans, found {count}")
                  print("repairing: package frame consumers")
                  text = text.replace(frame_lookup, "                    package_frame_id,\\n", 2)
          '''
          new = '''    frame_expression = "next(item.frame_id for item in storeys if item.storey_id == package.storey_id)"
              if frame_expression in text:
                  count = text.count(frame_expression)
                  print(f"repairing: {count} remaining package frame consumers")
                  text = text.replace(frame_expression, "package_frame_id")
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("temporary repair script frame span is missing")
          PY
          python scripts/aura_construction_second_review_repair.py
          status=$?
          echo "$status" > /tmp/aura-review-repair/status/patch.status
          exit "$status"

      - name: Validate formatting and syntax
        continue-on-error: true
        run: |
          set +e
          ruff format aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
          status=$?
          if test "$status" = "0"; then
            ruff check aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
            status=$?
          fi
          if test "$status" = "0"; then
            node --check aura_spatial_web/construction_scene_renderer.js
            status=$?
          fi
          if test "$status" = "0"; then
            node --check tests/js/spatial-construction-review-regressions.test.mjs
            status=$?
          fi
          if test "$status" = "0"; then
            git diff --check
            status=$?
          fi
          echo "$status" > /tmp/aura-review-repair/status/static.status
          exit "$status"

      - name: Run focused and retained Python tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_spatial_s6_construction.py \
            tests/test_aura_spatial_mixed_scene.py
          status=$?
          echo "$status" > /tmp/aura-review-repair/status/python.status
          exit "$status"

      - name: Run focused browser tests
        continue-on-error: true
        run: |
          set +e
          node --test \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs
          status=$?
          echo "$status" > /tmp/aura-review-repair/status/browser-focused.status
          exit "$status"

      - name: Run retained Spatial browser tests
        continue-on-error: true
        run: |
          set +e
          npm run test:spatial
          status=$?
          echo "$status" > /tmp/aura-review-repair/status/browser-retained.status
          exit "$status"

      - name: Publish only fully verified repairs
        if: always()
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for name in patch static python browser-focused browser-retained; do
            file="/tmp/aura-review-repair/status/${name}.status"
            if ! test -f "$file"; then
              echo "missing status: $name"
              failed=1
              continue
            fi
            status="$(cat "$file")"
            echo "$name=$status"
            if test "$status" != "0"; then failed=1; fi
          done
          test "$failed" = "0"
          if git diff --quiet -- \
            aura_construction_demo_projection.py \
            aura_spatial_web/construction_scene_renderer.js \
            tests/test_aura_construction_demo_projection.py \
            tests/js/spatial-construction-review-regressions.test.mjs; then
            echo "Second deep-review repairs are already present."
            exit 0
          fi
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aura_construction_demo_projection.py \
            aura_spatial_web/construction_scene_renderer.js \
            tests/test_aura_construction_demo_projection.py \
            tests/js/spatial-construction-review-regressions.test.mjs
          git commit -m "fix(construction): resolve second deep review findings"
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:${HEAD_REF}"
