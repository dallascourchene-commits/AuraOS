name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "aura_construction_demo_projection.py"
      - "tests/test_aura_construction_demo_projection.py"

permissions:
  contents: write

jobs:
  format-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 128

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and publish repaired Python owners
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check ruff
          ruff format aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
          ruff check aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
          git diff --check
          if git diff --quiet -- aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py; then
            echo "Repaired Python owners already formatted."
            exit 0
          fi
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
          git commit -m "style(construction): format second review repairs"
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:${HEAD_REF}"
