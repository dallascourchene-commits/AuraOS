name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "aura_construction_demo_fixture.py"
      - "aura_construction_demo_fixture_builder.py"
      - "aura_construction_demo_projection.py"
      - "aura_spatial_web/construction_mesh_pass.js"
      - "aura_spatial_web/construction_overlay_pass.js"
      - "aura_spatial_web/construction_scene_renderer.js"
      - "aura_spatial_web/webgl2_gaussian_pass.js"
      - "tests/test_aura_construction_demo_fixture.py"
      - "tests/test_aura_construction_demo_projection.py"
      - "tests/js/spatial-construction-demo.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-construction-demo-g4-g6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-g4-g6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Clone bounded pull-request history
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --no-tags --single-branch --depth=128 --branch "$HEAD_REF" "https://github.com/${GITHUB_REPOSITORY}.git" .

      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest ruff

      - name: Compile G4-G6 Python owners
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py

      - name: Run Aura-native Connectome Atlas and Council scan
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from aura_architect_council_v3 import route_compass_failure_classes
          from aura_coding_relationship_compass import compile_coding_relationship_compass

          target_files = (
              "aura_construction_demo_fixture.py",
              "aura_construction_demo_fixture_builder.py",
              "aura_construction_demo_projection.py",
              "aura_spatial_web/construction_mesh_pass.js",
              "aura_spatial_web/construction_overlay_pass.js",
              "aura_spatial_web/construction_scene_renderer.js",
              "aura_spatial_web/webgl2_gaussian_pass.js",
              "tests/test_aura_construction_demo_fixture.py",
              "tests/test_aura_construction_demo_projection.py",
              "tests/js/spatial-construction-demo.test.mjs",
          )
          target_symbols = (
              "ConstructionDemoProjectFixture",
              "build_construction_demo_fixture",
              "project_construction_demo_to_scene",
              "ConstructionMeshPass",
              "ConstructionOverlayPass",
              "ConstructionSceneRenderer",
              "createWebGL2GaussianPass",
          )
          objective = (
              "Verify Construction Arena G4-G6 asset-bound fixture, privacy-minimized projection, "
              "mesh Gaussian hybrid rendering, storey isolation, presentation-only exploded view, "
              "cancellation, device-loss disposal, authority boundaries, and exact focused tests"
          )
          output = Path("/tmp/aura_g4_g6_architecture.json")
          council = route_compass_failure_classes(
              ("INTERFACE", "INVARIANT", "AUTHORITY", "SEQUENCE", "LOCAL_TEST")
          )
          try:
              packet = compile_coding_relationship_compass(
                  objective,
                  Path.cwd(),
                  target_files=target_files,
                  target_symbols=target_symbols,
                  max_target_files=16,
                  max_target_symbols=24,
                  max_atomic_nodes=48,
                  max_atlas_participants=48,
                  max_atlas_assessments=128,
                  max_required_tests=32,
                  max_neighborhood_nodes=96,
                  max_neighborhood_edges=384,
                  max_neighborhood_candidate_pairs=4096,
                  include_source=False,
              )
              receipt = {
                  "status": "COMPILED",
                  "objective": objective,
                  "repository_head": packet.get("repository_head"),
                  "compass_digest": packet.get("compass_digest"),
                  "grounding_digest": packet.get("grounding_digest"),
                  "recommended_targets": packet.get("recommended_targets"),
                  "required_tests": packet.get("required_tests"),
                  "relationships_to_preserve": (packet.get("atlas") or {}).get("relationships_to_preserve"),
                  "required_adapters": (packet.get("atlas") or {}).get("required_adapters"),
                  "authority_constraints": (packet.get("atlas") or {}).get("authority_constraints"),
                  "missing_roles": (packet.get("atlas") or {}).get("missing_roles"),
                  "missing_configurations": (packet.get("atlas") or {}).get("missing_configurations"),
                  "prohibitions": (packet.get("atlas") or {}).get("prohibitions"),
                  "emergent_candidates": packet.get("emergent_candidates"),
                  "change_graph": packet.get("change_graph"),
                  "act_capsules": packet.get("act_capsules"),
                  "council_v3": council,
                  "safe_to_patch": packet.get("safe_to_patch", False),
                  "production_mutation": packet.get("production_mutation", False),
                  "automatic_merge": packet.get("automatic_merge", False),
                  "full_packet": packet,
              }
          except Exception as exc:
              receipt = {
                  "status": "FAILED_CLOSED",
                  "objective": objective,
                  "error_type": type(exc).__name__,
                  "error": str(exc)[:4096],
                  "council_v3": council,
                  "safe_to_patch": False,
                  "production_mutation": False,
                  "automatic_merge": False,
              }
          output.write_text(json.dumps(receipt, sort_keys=True, indent=2, default=str), encoding="utf-8")
          print(json.dumps({key: receipt.get(key) for key in (
              "status", "repository_head", "compass_digest", "grounding_digest", "error_type",
              "error", "council_v3", "safe_to_patch", "production_mutation", "automatic_merge"
          )}, sort_keys=True))
          PY

      - name: Lint G4 fixture contracts
        run: |
          set -o pipefail
          ruff check --output-format=concise aura_construction_demo_fixture.py 2>&1 | tee /tmp/g4_fixture_ruff.txt

      - name: Lint G4 fixture builder
        run: ruff check --output-format=concise aura_construction_demo_fixture_builder.py

      - name: Lint G5 projection
        run: ruff check --output-format=concise aura_construction_demo_projection.py

      - name: Lint G4 fixture tests
        run: ruff check --output-format=concise tests/test_aura_construction_demo_fixture.py

      - name: Lint G5 projection tests
        run: ruff check --output-format=concise tests/test_aura_construction_demo_projection.py

      - name: Check G4-G6 Python formatting
        run: |
          set -euo pipefail
          ruff format --check \
            aura_construction_demo_fixture.py \
            aura_construction_demo_fixture_builder.py \
            aura_construction_demo_projection.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py

      - name: Run focused Python verification
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py

      - name: Run retained Construction and Spatial projection regressions
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_spatial_s6_construction.py \
            tests/test_aura_spatial_mixed_scene.py

      - name: Run focused browser renderer verification
        run: |
          set -euo pipefail
          node --test tests/js/spatial-construction-demo.test.mjs

      - name: Run retained browser Spatial regressions
        run: |
          set -euo pipefail
          npm run test:spatial

      - name: Upload Aura G4-G6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-g4-g6-diagnostics
          path: |
            /tmp/aura_g4_g6_architecture.json
            /tmp/g4_fixture_ruff.txt
          if-no-files-found: ignore
          retention-days: 7
