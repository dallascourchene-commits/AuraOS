name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "scripts/aura_construction_second_review_repair.py"
      - "aura_construction_demo_projection.py"
      - "aura_spatial_web/construction_scene_renderer.js"
      - "tests/test_aura_construction_demo_projection.py"
      - "tests/js/spatial-construction-review-regressions.test.mjs"

permissions:
  contents: write

concurrency:
  group: aura-construction-review-repair-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 128

      - name: Verify exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bounded verification dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pytest ruff zstandard

      - name: Apply repair script
        id: patch
        continue-on-error: true
        run: |
          mkdir -p /tmp/aura-review-repair
          set +e
          python scripts/aura_construction_second_review_repair.py \
            > /tmp/aura-review-repair/patch.log 2>&1
          status=$?
          echo "$status" > /tmp/aura-review-repair/patch.status
          cat /tmp/aura-review-repair/patch.log
          exit "$status"

      - name: Format and statically validate repairs
        id: static
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          {
            ruff format aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
            ruff check aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py
            node --check aura_spatial_web/construction_scene_renderer.js
            node --check tests/js/spatial-construction-review-regressions.test.mjs
            git diff --check
          } > /tmp/aura-review-repair/static.log 2>&1
          status=$?
          echo "$status" > /tmp/aura-review-repair/static.status
          cat /tmp/aura-review-repair/static.log
          exit "$status"

      - name: Run focused and retained verification
        id: tests
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          {
            python -m pytest -q --tb=short \
              tests/test_aura_construction_demo_fixture.py \
              tests/test_aura_construction_demo_projection.py \
              tests/test_aura_construction_state.py \
              tests/test_aura_construction_adapter.py \
              tests/test_aura_construction_fixtures.py \
              tests/test_aura_spatial_s6_construction.py \
              tests/test_aura_spatial_mixed_scene.py
            node --test \
              tests/js/spatial-construction-demo.test.mjs \
              tests/js/spatial-construction-review-regressions.test.mjs
            npm run test:spatial
          } > /tmp/aura-review-repair/tests.log 2>&1
          status=$?
          echo "$status" > /tmp/aura-review-repair/tests.status
          cat /tmp/aura-review-repair/tests.log
          exit "$status"

      - name: Capture repair diff
        if: always()
        run: |
          git diff -- \
            aura_construction_demo_projection.py \
            aura_spatial_web/construction_scene_renderer.js \
            tests/test_aura_construction_demo_projection.py \
            tests/js/spatial-construction-review-regressions.test.mjs \
            > /tmp/aura-review-repair/repair.diff || true

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-construction-second-review-repair
          path: /tmp/aura-review-repair
          if-no-files-found: error
          retention-days: 7

      - name: Commit and push repaired owners
        if: steps.patch.outcome == 'success' && steps.static.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            aura_construction_demo_projection.py \
            aura_spatial_web/construction_scene_renderer.js \
            tests/test_aura_construction_demo_projection.py \
            tests/js/spatial-construction-review-regressions.test.mjs; then
            echo "Second deep-review repairs are already present."
            exit 0
          fi
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aura_construction_demo_projection.py \
            aura_spatial_web/construction_scene_renderer.js \
            tests/test_aura_construction_demo_projection.py \
            tests/js/spatial-construction-review-regressions.test.mjs
          git commit -m "fix(construction): resolve second deep review findings"
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${HEAD_REF}"

      - name: Evaluate repair lane
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.static.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
