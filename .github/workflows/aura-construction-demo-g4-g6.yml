name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "scripts/aura_pr187_third_codex_repair.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-focused-repair-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 128

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install -q --disable-pip-version-check numpy pytest ruff zstandard

      - name: Apply owner repairs without workflow reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          path = Path("scripts/aura_pr187_third_codex_repair.py")
          text = path.read_text(encoding="utf-8")
          old = 'exec(compile(zlib.decompress(base64.b64decode(_PAYLOAD)).decode("utf-8"), __file__, "exec"))'
          new = dedent('''\
          _SOURCE = zlib.decompress(base64.b64decode(_PAYLOAD)).decode("utf-8")
          _SOURCE = _SOURCE.replace(
              "    restore_and_expand_workflow()\\n    Path(__file__).unlink()",
              "    Path(__file__).unlink()",
          )
          exec(compile(_SOURCE, __file__, "exec"))
          ''')
          if text.count(old) != 1:
              raise RuntimeError("repair bootstrap execution line mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/aura_pr187_third_codex_repair.py
          ruff format aura_construction_demo_projection.py tests/test_aura_construction_demo_projection.py

      - name: Capture focused pytest result
        id: tests
        continue-on-error: true
        run: |
          mkdir -p /tmp/aura-focused-test
          set +e
          python -m pytest -q --tb=long \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py \
            > /tmp/aura-focused-test/pytest.log 2>&1
          status=$?
          echo "$status" > /tmp/aura-focused-test/pytest.status
          exit "$status"

      - name: Upload focused pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-pr187-focused-pytest-diagnostic
          path: /tmp/aura-focused-test
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success"
