name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "aura_construction_demo_projection.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-construction-demo-g4-g6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-g4-g6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 128

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Canonicalize and publish reviewed projection
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m pip install -q --disable-pip-version-check ruff
          ruff format aura_construction_demo_projection.py
          ruff check aura_construction_demo_projection.py
          if git diff --quiet -- aura_construction_demo_projection.py; then
            echo "Projection is already canonically formatted."
            exit 0
          fi
          git config user.name "Aura Architecture Harness"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura_construction_demo_projection.py
          git commit -m "style(spatial): canonicalize Construction projection"
          git fetch --no-tags origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:${HEAD_REF}"
