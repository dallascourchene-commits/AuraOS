name: Aura Construction Demo G4-G6

on:
  pull_request:
    paths:
      - ".github/workflows/aura-construction-demo-g4-g6.yml"
      - "scripts/aura_pr187_third_codex_repair.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-third-codex-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 128

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply repair and capture exact assertion
        id: repair
        continue-on-error: true
        run: |
          mkdir -p /tmp/aura-third-repair
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("scripts/aura_pr187_third_codex_repair.py")
          text = path.read_text(encoding="utf-8")
          old = 'exec(compile(zlib.decompress(base64.b64decode(_PAYLOAD)).decode("utf-8"), __file__, "exec"))'
          new = dedent('''\
          _SOURCE = zlib.decompress(base64.b64decode(_PAYLOAD)).decode("utf-8")
          _SOURCE = _SOURCE.replace(
              '["git", "show", f"HEAD^:{path}"]',
              '["git", "show", f"65d452230979671540ae8ed5e31c46ae83c3779c:{path}"]',
          )
          exec(compile(_SOURCE, __file__, "exec"))
          ''')
          if text.count(old) != 1:
              raise RuntimeError("repair bootstrap execution line mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          set +e
          python scripts/aura_pr187_third_codex_repair.py > /tmp/aura-third-repair/repair.log 2>&1
          status=$?
          echo "$status" > /tmp/aura-third-repair/repair.status
          exit "$status"

      - name: Upload exact repair diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-pr187-strict-repair-diagnostic
          path: /tmp/aura-third-repair
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed
        if: always()
        run: test "${{ steps.repair.outcome }}" = "success"
