name: Materialize unified memory continuity refactor

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: unified-memory-continuity-materialize-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'refactor/unified-memory-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode exact hash-bound source and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path
          import zlib

          root = Path('.')
          payload_root = root / '.aura' / 'refactor_payloads'

          module_encoded = (
              (payload_root / 'umc_module.part01').read_text(encoding='utf-8').strip()
              + (payload_root / 'umc_module.part02').read_text(encoding='utf-8').strip()
          )
          module_bytes = zlib.decompress(base64.b64decode(module_encoded, validate=True))
          module_digest = hashlib.sha256(module_bytes).hexdigest()
          expected_module = '673dbf6e77d034eb737adcf678ebf83a3021ff8d728ff381b0d3e4879a3c8b1c'
          if module_digest != expected_module:
              raise SystemExit(f'module digest mismatch: {module_digest}')
          (root / 'aura_unified_memory_continuity.py').write_bytes(module_bytes)

          tests_encoded = (payload_root / 'umc_tests.b64').read_text(encoding='utf-8').strip()
          tests_bytes = zlib.decompress(base64.b64decode(tests_encoded, validate=True))
          tests_digest = hashlib.sha256(tests_bytes).hexdigest()
          expected_tests = '1cd10ef32ca18d568de6aab49dc99ca61b9e8ef8b5f43b6704711e05a5f9c1b3'
          if tests_digest != expected_tests:
              raise SystemExit(f'test digest mismatch: {tests_digest}')
          tests_path = root / 'tests' / 'test_aura_unified_memory_continuity.py'
          tests_path.parent.mkdir(parents=True, exist_ok=True)
          tests_path.write_bytes(tests_bytes)

          print(f'module_sha256={module_digest}')
          print(f'tests_sha256={tests_digest}')
          PY

      - name: Verify the bounded vertical slice
        id: focused
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ../AuraOS-unified-memory-continuity-materialize
          python -m pip install pytest \
            2>&1 | tee ../AuraOS-unified-memory-continuity-materialize/install.log
          install_status=${PIPESTATUS[0]}
          if [[ "${install_status}" -ne 0 ]]; then
            exit "${install_status}"
          fi
          python -m py_compile aura_unified_memory_continuity.py \
            2>&1 | tee ../AuraOS-unified-memory-continuity-materialize/py_compile.log
          compile_status=${PIPESTATUS[0]}
          if [[ "${compile_status}" -ne 0 ]]; then
            exit "${compile_status}"
          fi
          python -m pytest -vv tests/test_aura_unified_memory_continuity.py \
            2>&1 | tee ../AuraOS-unified-memory-continuity-materialize/focused_tests.log
          test_status=${PIPESTATUS[0]}
          echo "focused_test_exit=${test_status}" | tee ../AuraOS-unified-memory-continuity-materialize/status.txt
          exit "${test_status}"

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-materialize-${{ github.run_id }}
          path: ../AuraOS-unified-memory-continuity-materialize
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only canonical source and tests
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Refactor Materializer'
          git config user.email 'actions@users.noreply.github.com'
          git add aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          git rm \
            .aura/refactor_payloads/umc_module.part01 \
            .aura/refactor_payloads/umc_module.part02 \
            .aura/refactor_payloads/umc_tests.b64
          git diff --cached --check
          git commit -m 'contracts: add unified memory continuity integration'
          git push origin HEAD:refactor/unified-memory-continuity
