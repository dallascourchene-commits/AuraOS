name: Refresh Model Connectome CODEMAP Once

on:
  pull_request:
    paths:
      - ".github/workflows/refresh-model-connectome-codemap-once.yml"
  workflow_dispatch:

permissions:
  contents: write

# One-time workspace-root refresh; the detached commit removes this workflow.
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone exact branch into CI workspace root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git clone --depth 1 --branch refactor/model-connectome-bridge \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"

      - name: Remove helper and regenerate final topology
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-model-connectome-codemap-once.yml
          python aura_codebase_navigator.py

      - name: Create detached final topology commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/codemap-commit"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          api = f"https://api.github.com/repos/{repository}/git"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aura-model-connectome-codemap",
          }

          def request(method: str, url: str, payload: dict | None = None) -> dict:
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=180) as response:
                  return json.load(response)

          parent_commit = request("GET", f"{api}/commits/{parent}")
          entries = []
          for relative in (
              ".aura/CODEMAP.md",
              ".aura/CODEMAP.json",
              "topology_map.json",
          ):
              raw = Path(relative).read_bytes()
              blob = request(
                  "POST",
                  f"{api}/blobs",
                  {"content": base64.b64encode(raw).decode("ascii"), "encoding": "base64"},
              )
              entries.append({"path": relative, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          entries.append({
              "path": ".github/workflows/refresh-model-connectome-codemap-once.yml",
              "mode": "100644",
              "type": "blob",
              "sha": None,
          })
          tree = request(
              "POST",
              f"{api}/trees",
              {"base_tree": parent_commit["tree"]["sha"], "tree": entries},
          )
          commit = request(
              "POST",
              f"{api}/commits",
              {
                  "message": "chore(codemap): refresh workspace-root Model Connectome topology",
                  "tree": tree["sha"],
                  "parents": [parent],
              },
          )
          out = Path(os.environ["RUNNER_TEMP"]) / "codemap-commit"
          (out / "commit_sha.txt").write_text(commit["sha"] + "\n", encoding="utf-8")
          (out / "parent_sha.txt").write_text(parent + "\n", encoding="utf-8")
          PY

      - name: Upload detached commit reference
        uses: actions/upload-artifact@v4
        with:
          name: model-connectome-root-codemap-${{ github.run_id }}
          path: ${{ runner.temp }}/codemap-commit/
          if-no-files-found: error
          retention-days: 2
