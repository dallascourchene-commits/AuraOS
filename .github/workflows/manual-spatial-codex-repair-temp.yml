name: Temporary Manual Spatial Codex Repair

on:
  push:
    branches:
      - feature/spatial-s4b-gaussian-security

permissions:
  contents: write

concurrency:
  group: manual-spatial-codex-repair-temp
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spatial-s4b-gaussian-security
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded manual repair
        shell: bash
        run: |
          set -euo pipefail
          marker=.aura/tmp/manual-codex-repair.pending
          if [[ ! -f "$marker" ]]; then
            echo "Repair marker absent; nothing to do."
            exit 0
          fi
          expected="$(tr -d '\r\n' < "$marker")"
          git cat-file -e "${expected}^{commit}"

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              if count == 0 and new in text:
                  return
              raise SystemExit(f"replacement mismatch in {path}: observed {count}")

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count == expected:
                  target.write_text(text.replace(old, new), encoding="utf-8")
                  return
              if count == 0 and text.count(new) == expected:
                  return
              raise SystemExit(f"replacement mismatch in {path}: observed {count}, expected {expected}")

          Path("aura_construction_runtime_binding.py").write_text(
              '''"""Process-local canonical issuance binding for Construction runtime packets.

          Spatial Construction preparation is a typed, same-process API. This registry binds
          an immutable packet digest to the exact canonical Construction adapter invocation
          that issued it. Serialized copies remain valid in that process, while modified or
          independently recomputed packets fail closed before projection.
          """

          from __future__ import annotations

          from collections import OrderedDict
          from collections.abc import Mapping
          import threading
          from typing import Any

          from aura_event_contracts import stable_digest

          CONSTRUCTION_RUNTIME_BINDING_VERSION = "AURA_CONSTRUCTION_RUNTIME_BINDING_V1"
          MAX_CANONICAL_CONSTRUCTION_RUNTIME_PACKETS = 256

          _LOCK = threading.RLock()
          _ISSUED_PACKETS: OrderedDict[str, str] = OrderedDict()


          def register_construction_runtime_packet(
              packet: Mapping[str, Any],
              *,
              state_digest: str,
          ) -> str:
              """Register one packet emitted by the canonical Construction adapter."""

              if not isinstance(packet, Mapping):
                  raise ValueError("Construction runtime packet must be a mapping")
              state = str(state_digest or "").strip()
              if not state:
                  raise ValueError("Construction runtime packet state digest must not be empty")
              packet_digest = stable_digest(dict(packet), digest_size=32)
              with _LOCK:
                  _ISSUED_PACKETS[packet_digest] = state
                  _ISSUED_PACKETS.move_to_end(packet_digest)
                  while len(_ISSUED_PACKETS) > MAX_CANONICAL_CONSTRUCTION_RUNTIME_PACKETS:
                      _ISSUED_PACKETS.popitem(last=False)
              return packet_digest


          def require_canonical_construction_runtime_packet(
              packet: Mapping[str, Any],
              *,
              state_digest: str,
          ) -> str:
              """Require an exact packet previously issued for the supplied canonical state."""

              if not isinstance(packet, Mapping):
                  raise ValueError("Construction runtime packet must be a mapping")
              state = str(state_digest or "").strip()
              packet_digest = stable_digest(dict(packet), digest_size=32)
              with _LOCK:
                  issued_state = _ISSUED_PACKETS.get(packet_digest)
              if issued_state != state:
                  raise ValueError(
                      "Construction runtime packet was not issued by the canonical Construction adapter "
                      "for the supplied state"
                  )
              return packet_digest


          __all__ = [
              "CONSTRUCTION_RUNTIME_BINDING_VERSION",
              "MAX_CANONICAL_CONSTRUCTION_RUNTIME_PACKETS",
              "register_construction_runtime_packet",
              "require_canonical_construction_runtime_packet",
          ]
          ''',
              encoding="utf-8",
          )

          replace_once(
              "aura_construction_adapter.py",
              "from aura_construction_state import (\n",
              "from aura_construction_runtime_binding import register_construction_runtime_packet\nfrom aura_construction_state import (\n",
          )
          replace_once(
              "aura_construction_adapter.py",
              '''        return {
              "ok": True,
              "version": CONSTRUCTION_ADAPTER_VERSION,
              "adapter": self.schema(),
              "action_capsule": capsule.to_dict(),
              "boundary_contract": boundary.to_dict(),
              "arena_lease": lease.to_dict(),
              "evaluation": evaluation.to_dict(),
              "state_digest": state.state_digest,
              "source_records_mutated": False,
              "proposal_only": True,
              "human_release_required": True,
              "physical_work_authorized": False,
              "payment_released": False,
              "access_controlled": False,
              "patch_authority": PATCH_AUTHORITY,
              "vsa_patch_authority": VSA_PATCH_AUTHORITY,
          }
          ''',
              '''        packet = {
              "ok": True,
              "version": CONSTRUCTION_ADAPTER_VERSION,
              "adapter": self.schema(),
              "action_capsule": capsule.to_dict(),
              "boundary_contract": boundary.to_dict(),
              "arena_lease": lease.to_dict(),
              "evaluation": evaluation.to_dict(),
              "state_digest": state.state_digest,
              "source_records_mutated": False,
              "proposal_only": True,
              "human_release_required": True,
              "physical_work_authorized": False,
              "payment_released": False,
              "access_controlled": False,
              "patch_authority": PATCH_AUTHORITY,
              "vsa_patch_authority": VSA_PATCH_AUTHORITY,
          }
          register_construction_runtime_packet(packet, state_digest=state.state_digest)
          return packet
          ''',
          )

          replace_once(
              "aura_spatial_construction.py",
              "from aura_construction_state import ConstructionProjectState\n",
              "from aura_construction_runtime_binding import require_canonical_construction_runtime_packet\nfrom aura_construction_state import ConstructionProjectState\n",
          )
          replace_once(
              "aura_spatial_construction.py",
              '''    safe_assessments = [
              _assessment_summary(item, privacy)
              for item in sorted(assessments, key=lambda item: str(item.get("candidate_id") or ""))
          ]
          projection_payload = {
          ''',
              '''    safe_assessments = [
              _assessment_summary(item, privacy)
              for item in sorted(assessments, key=lambda item: str(item.get("candidate_id") or ""))
          ]
          require_canonical_construction_runtime_packet(packet, state_digest=state.state_digest)
          projection_payload = {
          ''',
          )

          replace_once(
              "aura_spatial_session.py",
              "from dataclasses import dataclass, replace\nimport threading\n",
              "from dataclasses import dataclass, replace\nimport math\nimport re\nimport threading\n",
          )
          replace_once(
              "aura_spatial_session.py",
              '''MAX_DISSOLUTION_RECEIPTS = 256

          _SESSION_SUMMARY_KEYS = frozenset(
          ''',
              '''MAX_DISSOLUTION_RECEIPTS = 256

          _GENERIC_RENDER_METRIC_SCHEMA = {
              "fixture": "identifier",
              "frame_ms": "number",
              "rendered_entities": "count",
              "renderer_allocated_count": "count",
          }
          _GENERIC_RENDER_METRIC_IDENTIFIER = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$")


          def _sanitize_generic_render_metrics(metrics: Mapping[str, Any] | None) -> dict[str, Any]:
              """Admit only bounded scalar non-sensor metrics for generic proof receipts."""

              if metrics is None:
                  return {}
              if not isinstance(metrics, Mapping):
                  raise ValueError("generic Spatial proof metrics must be an object")
              unknown = sorted(set(metrics) - set(_GENERIC_RENDER_METRIC_SCHEMA))
              if unknown:
                  raise ValueError(f"generic Spatial proof metrics contain unsupported keys: {unknown}")
              normalized: dict[str, Any] = {}
              for name in sorted(metrics):
                  value = metrics[name]
                  kind = _GENERIC_RENDER_METRIC_SCHEMA[name]
                  if kind == "identifier":
                      if type(value) is not str or not _GENERIC_RENDER_METRIC_IDENTIFIER.fullmatch(value):
                          raise ValueError(f"generic Spatial proof metric {name} must be a bounded identifier")
                  elif kind == "count":
                      if type(value) is not int or value < 0:
                          raise ValueError(f"generic Spatial proof metric {name} must be a non-negative integer")
                  else:
                      if type(value) not in {int, float} or not math.isfinite(float(value)) or float(value) < 0.0:
                          raise ValueError(f"generic Spatial proof metric {name} must be a finite non-negative number")
                  normalized[name] = value
              return normalized


          _SESSION_SUMMARY_KEYS = frozenset(
          ''',
          )
          replace_once(
              "aura_spatial_session.py",
              '''    ) -> tuple[SpatialRenderReceipt, SpatialProjectionSessionSummary]:
              with self._lock:
                  record = self._record(session_id)
                  if record.summary.state is not SpatialSessionState.ACTIVE:
                      raise ValueError("render evidence requires an active session")
          ''',
              '''    ) -> tuple[SpatialRenderReceipt, SpatialProjectionSessionSummary]:
              safe_metrics = _sanitize_generic_render_metrics(metrics)
              with self._lock:
                  record = self._record(session_id)
                  if record.summary.state is not SpatialSessionState.ACTIVE:
                      raise ValueError("render evidence requires an active session")
          ''',
          )
          replace_once(
              "aura_spatial_session.py",
              "                metrics=metrics,\n",
              "                metrics=safe_metrics,\n",
          )

          replace_once(
              "aura_spatial_cli.py",
              '                metrics={"fixture": "synthetic", "renderer_allocated": False},\n',
              '                metrics={"fixture": "synthetic", "renderer_allocated_count": 0},\n',
          )
          replace_once(
              "tests/test_aura_spatial_s5_arena.py",
              '    bridge.prove(run_id, repo_head="e" * 40, metrics={"renderer_allocated": False})\n',
              '    bridge.prove(run_id, repo_head="e" * 40, metrics={"renderer_allocated_count": 0})\n',
          )

          replace_once(
              "aura_agent_arena_mcp.py",
              "from aura_agent_arena_bridge import BRIDGE_VERSION\n",
              "from aura_agent_arena_bridge import BRIDGE_VERSION, AuraAgentArenaBridge\n",
          )
          replace_once(
              "aura_agent_arena_mcp.py",
              '''from aura_agent_arena_persistence_bridge import (
              PersistentAuraAgentArenaBridge as AuraAgentArenaBridge,
          )
          ''',
              "from aura_agent_arena_persistence_bridge import PersistentAuraAgentArenaBridge\n",
          )
          replace_once(
              "aura_agent_arena_mcp.py",
              "        bridge = AuraAgentArenaBridge()\n",
              "        bridge = PersistentAuraAgentArenaBridge()\n",
          )

          Path("tests/test_aura_spatial_codex_repairs.py").write_text(
              '''from __future__ import annotations

          from copy import deepcopy
          from io import StringIO
          import json
          from pathlib import Path
          import sqlite3
          import sys

          import pytest

          from aura_agent_arena_mcp import serve_stdio
          from aura_event_contracts import stable_digest, stable_id
          from aura_spatial_construction import project_construction_state_to_scene
          from tests.test_aura_spatial_s5_arena import _prepared, _repo
          from tests.test_aura_spatial_s6_construction import _fixture_packet


          def _attempt_count(root: Path) -> int:
              db_path = root / "Aura_Memory" / "arena_attempt_artifacts.db"
              with sqlite3.connect(db_path) as connection:
                  return int(connection.execute("SELECT COUNT(*) FROM arena_attempt_artifacts").fetchone()[0])


          @pytest.mark.parametrize(
              "metrics",
              [
                  {"camera_frame": "raw-pixels"},
                  {"frame_ms": {"value": 4.0}},
                  {"fixture": "data:image/png;base64,secret"},
                  {"renderer_allocated_count": False},
                  {"fixture": b"synthetic"},
              ],
          )
          def test_generic_spatial_proof_metrics_reject_raw_or_structured_content_before_archive(
              tmp_path: Path,
              metrics: dict[str, object],
          ) -> None:
              _, _, arena, bridge, prepared = _prepared(tmp_path)
              try:
                  before = _attempt_count(tmp_path)
                  with pytest.raises(ValueError, match="generic Spatial proof metric"):
                      bridge.prove(prepared["run_id"], repo_head="a" * 40, metrics=metrics)
                  assert _attempt_count(tmp_path) == before
                  assert arena._runs[prepared["run_id"]].proof_receipt_ids == []
              finally:
                  bridge.close()


          def test_generic_spatial_proof_metrics_are_scalar_bounded_sorted_and_archived(tmp_path: Path) -> None:
              _, _, _, bridge, prepared = _prepared(tmp_path)
              expected = {
                  "fixture": "synthetic",
                  "frame_ms": 4.0,
                  "rendered_entities": len(prepared["scene"]["entities"]),
                  "renderer_allocated_count": 0,
              }
              try:
                  proof = bridge.prove(
                      prepared["run_id"],
                      repo_head="b" * 40,
                      metrics=dict(reversed(tuple(expected.items()))),
                  )
                  observed = proof["render_receipt"]["metrics"]
                  assert observed == expected
                  assert list(observed) == sorted(observed)
                  db_path = tmp_path / "Aura_Memory" / "arena_attempt_artifacts.db"
                  with sqlite3.connect(db_path) as connection:
                      raw = connection.execute(
                          "SELECT result_json FROM arena_attempt_artifacts ORDER BY created_at DESC LIMIT 1"
                      ).fetchone()[0]
                  assert json.loads(raw)["receipt"]["metrics"] == expected
              finally:
                  bridge.close()


          def test_default_stdio_server_uses_persistent_bridge_for_advertised_spatial_tools(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              root = _repo(tmp_path)
              request = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "tools/call",
                  "params": {
                      "name": "aura_spatial_status",
                      "arguments": {"run_id": "spatial-run:missing"},
                  },
              }
              stdin = StringIO(json.dumps(request) + "\n")
              stdout = StringIO()
              monkeypatch.chdir(root)
              monkeypatch.setattr(sys, "stdin", stdin)
              monkeypatch.setattr(sys, "stdout", stdout)
              serve_stdio()
              response = json.loads(stdout.getvalue().strip())
              assert response["error"]["code"] == -32603
              assert "unknown or dissolved Spatial Arena run" in response["error"]["message"]
              assert "AttributeError" not in response["error"]["message"]


          def _redigest_evaluation(packet: dict[str, object]) -> None:
              evaluation = dict(packet["evaluation"])
              payload = dict(evaluation)
              payload.pop("evaluation_id", None)
              payload.pop("evaluation_digest", None)
              evaluation["evaluation_id"] = stable_id("construction-evaluation", payload)
              evaluation["evaluation_digest"] = stable_digest(payload)
              packet["evaluation"] = evaluation


          def test_construction_projection_accepts_exact_canonical_json_copy() -> None:
              fixture, packet = _fixture_packet()
              copied = json.loads(json.dumps(packet))
              scene = project_construction_state_to_scene(
                  fixture.state,
                  copied,
                  purpose_digest="c" * 64,
              )
              assert scene.scene_digest


          def test_construction_projection_rejects_recomputed_noncanonical_substitutions() -> None:
              fixture, packet = _fixture_packet()
              mutations: list[dict[str, object]] = []

              assessment = deepcopy(packet)
              assessment["evaluation"]["assessments"][0]["uncertainty"] = 0.123
              _redigest_evaluation(assessment)
              mutations.append(assessment)

              candidate = deepcopy(packet)
              candidate["evaluation"]["assessments"][0]["candidate_id"] = "construction-candidate:" + "0" * 40
              _redigest_evaluation(candidate)
              mutations.append(candidate)

              recommendation = deepcopy(packet)
              recommendation["evaluation"]["recommended_candidate_id"] = ""
              recommendation["evaluation"]["next_authority_route"] = ""
              _redigest_evaluation(recommendation)
              mutations.append(recommendation)

              action = deepcopy(packet)
              action["action_capsule"]["objective"] = "forged objective"
              mutations.append(action)

              boundary = deepcopy(packet)
              boundary["boundary_contract"]["promised_outputs"].append("forged authoritative output")
              mutations.append(boundary)

              lease = deepcopy(packet)
              lease["arena_lease"]["holder"] = "forged-holder"
              mutations.append(lease)

              release = deepcopy(packet)
              release["patch_authority"] = "full_repository"
              mutations.append(release)

              for mutated in mutations:
                  with pytest.raises(ValueError, match="canonical Construction adapter"):
                      project_construction_state_to_scene(
                          fixture.state,
                          mutated,
                          purpose_digest="d" * 64,
                      )
          ''',
              encoding="utf-8",
          )

          replace_once(
              ".github/workflows/aura-spatial-s5-s6-construction.yml",
              '      - "aura_spatial_*.py"\n',
              '      - "aura_spatial_*.py"\n      - "aura_construction_runtime_binding.py"\n',
          )
          replace_all(
              ".github/workflows/aura-spatial-s5-s6-construction.yml",
              "aura_spatial_construction.py             aura_spatial_agent_bridge.py",
              "aura_spatial_construction.py             aura_construction_runtime_binding.py             aura_spatial_agent_bridge.py",
              3,
          )
          replace_all(
              ".github/workflows/aura-spatial-s5-s6-construction.yml",
              "tests/test_aura_spatial_s6_construction.py             tests/test_aura_spatial_agent_bridge_mcp.py",
              "tests/test_aura_spatial_s6_construction.py             tests/test_aura_spatial_codex_repairs.py             tests/test_aura_spatial_agent_bridge_mcp.py",
              2,
          )

          Path(".aura/tmp/manual-codex-repair.pending").unlink()
          PY

      - name: Install focused verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest ruff

      - name: Format and validate focused repair
        run: |
          set -euo pipefail
          files=(
            aura_construction_runtime_binding.py
            aura_construction_adapter.py
            aura_spatial_construction.py
            aura_spatial_session.py
            aura_spatial_cli.py
            aura_agent_arena_mcp.py
            tests/test_aura_spatial_s5_arena.py
            tests/test_aura_spatial_codex_repairs.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m py_compile \
            aura_construction_runtime_binding.py \
            aura_construction_adapter.py \
            aura_spatial_construction.py \
            aura_spatial_session.py \
            aura_spatial_cli.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_spatial_codex_repairs.py
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_s5_arena.py \
            tests/test_aura_spatial_s6_construction.py \
            tests/test_aura_spatial_agent_bridge_mcp.py \
            tests/test_aura_spatial_cli.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_spatial_codex_repairs.py
          git diff --check

      - name: Commit and publish repair
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repair changes remained."
            exit 0
          fi
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add \
            .github/workflows/aura-spatial-s5-s6-construction.yml \
            aura_construction_runtime_binding.py \
            aura_construction_adapter.py \
            aura_spatial_construction.py \
            aura_spatial_session.py \
            aura_spatial_cli.py \
            aura_agent_arena_mcp.py \
            tests/test_aura_spatial_s5_arena.py \
            tests/test_aura_spatial_codex_repairs.py \
            .aura/tmp/manual-codex-repair.pending
          git commit -m "fix(spatial): close Codex trust-boundary findings"
          git push origin HEAD:feature/spatial-s4b-gaussian-security
