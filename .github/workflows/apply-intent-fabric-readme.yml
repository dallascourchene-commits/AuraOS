name: Apply intent-compiled application fabric README update

on:
  push:
    branches:
      - docs/intent-compiled-application-fabric
    paths:
      - .github/workflows/apply-intent-fabric-readme.yml

permissions:
  contents: write

jobs:
  apply-readme-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/intent-compiled-application-fabric
      - name: Apply README update
        run: python tools/apply_intent_fabric_readme_update.py
      - name: Remove one-time updater and commit
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_intent_fabric_readme_update.py
          rm .github/workflows/apply-intent-fabric-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add intent-compiled application fabric to README"
          git push origin HEAD:docs/intent-compiled-application-fabric
