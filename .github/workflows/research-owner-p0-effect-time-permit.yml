name: Research Owner P0 Effect-Time Permit

on:
  pull_request:
    paths:
      - "05_staging/research_owner_p0_admission/effect_time_permit.py"
      - "05_staging/research_owner_p0_admission/test_effect_time_permit.py"
      - ".github/workflows/research-owner-p0-effect-time-permit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run effect-time permit tests
        working-directory: 05_staging/research_owner_p0_admission
        run: python -m unittest -v test_effect_time_permit.py
