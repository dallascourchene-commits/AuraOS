name: Aura Review Learning One-Time Lint Fix

on:
  push:
    branches:
      - feature/coding-waboose-review-learning-pr164

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact focused Ruff fixes
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff
          ruff check --fix \
            aura_coding_waboose_review_lessons.py \
            aura_coding_waboose_review_learning.py \
            aura_agent_arena_review_learning_bridge.py \
            aura_agent_arena_review_learning_mcp.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py || true
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_coding_waboose_review_learning.py")
          source = path.read_text(encoding="utf-8")
          old = '"line_end": max(max(1, int(line_start)), int(line_end)),'
          new = '"line_end": max(1, int(line_start), int(line_end)),'
          if old not in source:
              raise SystemExit("expected nested max expression was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check \
            aura_coding_waboose_review_lessons.py \
            aura_coding_waboose_review_learning.py \
            aura_agent_arena_review_learning_bridge.py \
            aura_agent_arena_review_learning_mcp.py \
            scripts/aura_review_learning_architect_harness.py \
            tests/test_aura_coding_waboose_review_lessons.py \
            tests/test_aura_coding_waboose_review_learning.py \
            tests/test_aura_agent_arena_review_learning.py
          python -m py_compile \
            aura_coding_waboose_review_lessons.py \
            aura_coding_waboose_review_learning.py \
            aura_agent_arena_review_learning_bridge.py \
            aura_agent_arena_review_learning_mcp.py \
            scripts/aura_review_learning_architect_harness.py

      - name: Remove one-time workflow and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/aura-review-learning-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply focused review-learning Ruff corrections"
          git push origin HEAD:feature/coding-waboose-review-learning-pr164
