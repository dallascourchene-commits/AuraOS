name: PR131 Sync Final Benchmark README

on:
  push:
    branches:
      - analysis/architect-benchmark

permissions:
  contents: write

concurrency:
  group: pr131-sync-final-benchmark-readme
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render measured benchmark blocks
        run: |
          cat > /tmp/planning.json <<'JSON'
          {
            "repository_commit_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
            "arms": {
              "raw_broad_context": {"model_calls": 1, "input_tokens": 130486, "output_tokens": 1169, "total_tokens": 131655, "normalized_cost_usd": 0.133993, "quality": {"quality_score": 0.9550}},
              "aura_slice_single": {"model_calls": 1, "input_tokens": 12764, "output_tokens": 1667, "total_tokens": 14431, "normalized_cost_usd": 0.017765, "quality": {"quality_score": 0.9607}},
              "aura_architect_council": {
                "model_calls": 18,
                "input_tokens": 163936,
                "output_tokens": 4633,
                "total_tokens": 168569,
                "normalized_cost_usd": 0.177835,
                "quality": {"quality_score": 0.9625},
                "selected_plan": {"length_profile": {"length_class": "LONG", "task_count": 8, "distinct_file_count": 17}},
                "model_usage": {"attempted_call_count": 18, "call_count": 18, "failed_call_count": 0}
              }
            },
            "comparison": {
              "slice_input_reduction_pct": 90.22,
              "slice_total_reduction_pct": 89.04,
              "slice_quality_delta": 0.0057,
              "council_total_reduction_pct": -28.04,
              "council_quality_delta": 0.0075
            },
            "role_token_totals": {
              "planner": {"calls": 1, "input_tokens_estimated": 399, "output_tokens_estimated": 2011},
              "planner_alt": {"calls": 1, "input_tokens_estimated": 400, "output_tokens_estimated": 1546},
              "shadow": {"calls": 15, "input_tokens_estimated": 135582, "output_tokens_estimated": 1001},
              "judge": {"calls": 1, "input_tokens_estimated": 27555, "output_tokens_estimated": 75}
            },
            "prompt_manifest": {"entry_count": 20},
            "fixture_completion": {
              "added_long_critic_aliases": {"sequence": "scope", "continuity": "tests", "rollback": "cost"},
              "independent_provider_responses": false
            },
            "findings": [{"id": "F5_PLAN_CONTRACT_LOSS", "lost_fields": [], "status": "NOT_OBSERVED"}]
          }
          JSON
          cat > /tmp/real.json <<'JSON'
          {
            "selected_plan_match": true,
            "disposition": "ACCEPTED",
            "plan_comparison": {"selected_candidate_id": "PLAN-D-SELECTIVE-COUNCIL-V3-SURGEON"},
            "execution_evidence": {
              "head_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
              "patch_digest": "0c0b1ad98678e0c33b2e66775a625832",
              "visible_junit": {"passed": 32, "tests": 32, "failures": 0, "errors": 0},
              "hidden_junit": {"passed": 35, "tests": 35, "failures": 0, "errors": 0},
              "regression_junit": {"passed": 21, "tests": 21, "failures": 0, "errors": 0},
              "gates": {
                "compile": "PASS", "api_compatibility": "PASS", "security": "PASS", "static_analysis": "PASS", "container_build": "PASS", "selected_plan_bound_to_arena": "PASS", "local_output_vault": "PASS", "record_redaction": "PASS"
              }
            },
            "code_quality_record": {"working_status": "WORKING", "observed_quality_score": 100.0, "benchmark_quality_score": 93.5, "measurement_completeness_pct": 93.5}
          }
          JSON
          python scripts/update_architect_benchmark_readme.py \
            --planning-report /tmp/planning.json \
            --real-trial /tmp/real.json \
            --output /tmp/README.updated.md
          cp /tmp/README.updated.md README.md
      - name: Correct truth-dependent report wording and README CI gate
        run: |
          python - <<'PY'
          from pathlib import Path

          report = Path('aura_architect_benchmark_report.py')
          text = report.read_text(encoding='utf-8')
          old = '''            "statement": (\n                "Architect Council normalization did not preserve submitted plan-level fields: "\n                + (", ".join(lost_fields) if lost_fields else "none")\n                + "."\n            ),'''
          new = '''            "statement": (\n                (\n                    "Architect Council normalization did not preserve submitted plan-level fields: "\n                    + ", ".join(lost_fields)\n                    + "."\n                )\n                if lost_fields\n                else (\n                    "Architect Council normalization preserved every submitted "\n                    "plan-level governance field."\n                )\n            ),'''
          if old not in text:
              raise SystemExit('report F5 wording anchor missing')
          text = text.replace(old, new, 1)
          old = '''        + " The run also exposed contract-preservation and routing defects that must be repaired "\n        "before claiming general architectural superiority. This is reproducible pilot evidence, "\n        "not proof that Aura is revolutionary, generally superior, conscious, or production-ready."'''
          new = '''        + (\n            " The run still exposed contract-preservation or routing defects that require repair. "\n            if lost_fields\n            else (\n                " The repaired Council preserved the submitted governance contract; "\n                "remaining route findings stay explicit. "\n            )\n        )\n        + (\n            "Before claiming general architectural superiority, those route findings and "\n            "execution limits must remain visible. This is reproducible pilot evidence, "\n        )\n        + (\n            "not proof that Aura is revolutionary, generally superior, conscious, or "\n            "production-ready."\n        )'''
          if old not in text:
              raise SystemExit('report interpretation anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('### Defects discovered by the benchmark', '### Defects and repairs surfaced by the benchmark', 1)
          old = "2. Council normalization dropped plan-level fields: `{', '.join(lost_fields) if lost_fields else 'none'}`."
          new = "2. Council governance contract: `{'missing ' + ', '.join(lost_fields) if lost_fields else 'all submitted plan-level fields preserved after repair'}`."
          if old not in text:
              raise SystemExit('report README wording anchor missing')
          report.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/architect-consolidation-benchmark.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''      - name: Verify committed README and preserve artifact snapshot\n        run: |\n          grep -q "Architect Benchmark Prompt" README.md\n          grep -q "89.88%" README.md\n          grep -q "Council–Surgeon Hybrid Benchmark" README.md\n          grep -q "158,545" README.md\n          grep -q "Persistent Refactor History" README.md\n          python scripts/update_architect_benchmark_readme.py \\\n            --output benchmark-output/README.updated.md\n          cmp README.md benchmark-output/README.updated.md'''
          new = '''      - name: Validate committed README evidence and preserve current-head rendering\n        run: |\n          grep -q "AURA_ARCHITECT_PLANNING_BENCHMARK:START" README.md\n          grep -q "168,569" README.md\n          grep -q "18 attempted, 18 recorded, 0 failed" README.md\n          grep -q "AURA_REAL_REFACTOR_TRIAL:START" README.md\n          grep -q "Benchmark quality: **93.50**" README.md\n          python scripts/update_architect_benchmark_readme.py \\\n            --planning-report benchmark-output/architect_consolidation_benchmark.json \\\n            --output benchmark-output/README.current-head.md\n          test -s benchmark-output/README.current-head.md'''
          if old not in text:
              raise SystemExit('workflow README gate anchor missing')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile \
            aura_architect_benchmark_report.py \
            scripts/update_architect_benchmark_readme.py
          test "$(git diff --name-only | sort)" = $'.github/workflows/architect-consolidation-benchmark.yml\nREADME.md\naura_architect_benchmark_report.py'
      - name: Commit synchronized benchmark evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md aura_architect_benchmark_report.py .github/workflows/architect-consolidation-benchmark.yml
          git commit -m "docs(benchmark): synchronize final measured evidence"
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" analysis/architect-benchmark
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:analysis/architect-benchmark
