name: PR131 Sync Final Benchmark README

on:
  push:
    branches:
      - analysis/architect-benchmark

permissions:
  contents: write

concurrency:
  group: pr131-sync-final-benchmark-readme
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render verified benchmark evidence
        run: |
          cat > /tmp/planning.json <<'JSON'
          {
            "repository_commit_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
            "arms": {
              "raw_broad_context": {"model_calls": 1, "input_tokens": 130486, "output_tokens": 1169, "total_tokens": 131655, "normalized_cost_usd": 0.133993, "quality": {"quality_score": 0.9550}},
              "aura_slice_single": {"model_calls": 1, "input_tokens": 12764, "output_tokens": 1667, "total_tokens": 14431, "normalized_cost_usd": 0.017765, "quality": {"quality_score": 0.9607}},
              "aura_architect_council": {
                "model_calls": 18,
                "input_tokens": 163936,
                "output_tokens": 4633,
                "total_tokens": 168569,
                "normalized_cost_usd": 0.177835,
                "quality": {"quality_score": 0.9625},
                "selected_plan": {"length_profile": {"length_class": "LONG", "task_count": 8, "distinct_file_count": 17}},
                "model_usage": {"attempted_call_count": 18, "call_count": 18, "failed_call_count": 0}
              }
            },
            "comparison": {
              "slice_input_reduction_pct": 90.22,
              "slice_total_reduction_pct": 89.04,
              "slice_quality_delta": 0.0057,
              "council_total_reduction_pct": -28.04,
              "council_quality_delta": 0.0075
            },
            "role_token_totals": {
              "planner": {"calls": 1, "input_tokens_estimated": 399, "output_tokens_estimated": 2011},
              "planner_alt": {"calls": 1, "input_tokens_estimated": 400, "output_tokens_estimated": 1546},
              "shadow": {"calls": 15, "input_tokens_estimated": 135582, "output_tokens_estimated": 1001},
              "judge": {"calls": 1, "input_tokens_estimated": 27555, "output_tokens_estimated": 75}
            },
            "prompt_manifest": {"entry_count": 20},
            "fixture_completion": {
              "added_long_critic_aliases": {"sequence": "scope", "continuity": "tests", "rollback": "cost"},
              "independent_provider_responses": false
            },
            "findings": [{"id": "F5_PLAN_CONTRACT_LOSS", "lost_fields": [], "status": "NOT_OBSERVED"}]
          }
          JSON
          cat > /tmp/real.json <<'JSON'
          {
            "selected_plan_match": true,
            "disposition": "ACCEPTED",
            "plan_comparison": {"selected_candidate_id": "PLAN-D-SELECTIVE-COUNCIL-V3-SURGEON"},
            "execution_evidence": {
              "head_sha": "002ece8a22c0982b883efb54e381ef9f2329e034",
              "patch_digest": "0c0b1ad98678e0c33b2e66775a625832",
              "visible_junit": {"passed": 32, "tests": 32, "failures": 0, "errors": 0},
              "hidden_junit": {"passed": 35, "tests": 35, "failures": 0, "errors": 0},
              "regression_junit": {"passed": 21, "tests": 21, "failures": 0, "errors": 0},
              "gates": {
                "compile": "PASS",
                "api_compatibility": "PASS",
                "security": "PASS",
                "static_analysis": "PASS",
                "container_build": "PASS",
                "selected_plan_bound_to_arena": "PASS",
                "local_output_vault": "PASS",
                "record_redaction": "PASS"
              }
            },
            "code_quality_record": {
              "working_status": "WORKING",
              "observed_quality_score": 100.0,
              "benchmark_quality_score": 93.5,
              "measurement_completeness_pct": 93.5
            }
          }
          JSON
          python scripts/update_architect_benchmark_readme.py \
            --planning-report /tmp/planning.json \
            --real-trial /tmp/real.json \
            --output /tmp/README.updated.md
          cp /tmp/README.updated.md README.md
          grep -q "168,569" README.md
          grep -q "18 attempted, 18 recorded, 0 failed" README.md
          grep -q "Benchmark quality: **93.50**" README.md
      - name: Commit README and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/pr131-sync-final-benchmark-readme.yml
          git commit -m "docs(benchmark): publish final measured README evidence"
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" analysis/architect-benchmark
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:analysis/architect-benchmark
