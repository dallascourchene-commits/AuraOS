name: Materialize PR255 review repair

on:
  push:
    branches:
      - repair/pr255-intent-spatial-contracts-clean

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '[...truncated for brevity in summary generation...]AQ== ' | base64 --decode > /tmp/pr255-review-repair.tar.gz
          echo '7ebefeaa3d00c6b2324dd7974fffb525ef7afe88e59f7c0db5e1317ba0b4126b  /tmp/pr255-review-repair.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/pr255-review-repair.tar.gz -C .
          rm -f .github/workflows/materialize-pr255-review-repair.yml
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python -m json.tool schemas/aura_project_context_projection.schema.json >/dev/null
          python -m json.tool schemas/aura_ephemeral_workspace_recipe.schema.json >/dev/null
          python -m json.tool schemas/aura_multimodal_spatial_observation.schema.json >/dev/null
      - name: Commit exact clean repair tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Review Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git commit -m 'fix(pr1): resolve exhaustive review findings'
          git push origin HEAD:repair/pr255-intent-spatial-contracts-clean
