name: PR255 Schema Semantic Delegation Closure V2

on:
  push:
    branches:
      - main
    paths:
      - .github/pr255_schema_semantic_delegation_patch.py

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: stage PR255 schema semantic delegation repair' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 879b5fb056b70d150b1646e082223330a36c2912
      FROZEN_HEAD: 3dce027bbd299633b139ea4df1fe73bd1953da21
      TARGET_BRANCH: refactor/intent-native-spatial-workspace-pr1
    steps:
      - name: Check out control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install focused verification tools
        run: python -m pip install --disable-pip-version-check -q pytest jsonschema ruff

      - name: Patch, prove, and publish exact repair
        shell: bash
        run: |
          set -euo pipefail

          PATCH_SCRIPT="$RUNNER_TEMP/pr255_schema_semantic_delegation_patch.py"
          cp .github/pr255_schema_semantic_delegation_patch.py "$PATCH_SCRIPT"

          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          LIVE_HEAD="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$LIVE_HEAD" = "$FROZEN_HEAD"

          git checkout --detach "$FROZEN_HEAD"
          git switch -c pr255-schema-semantic-delegation-repair
          python "$PATCH_SCRIPT"

          EXPECTED_REPAIR="$(printf '%s\n' \
            docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md \
            schemas/aura_ephemeral_workspace_recipe.schema.json \
            schemas/aura_multimodal_spatial_observation.schema.json \
            schemas/aura_project_context_projection.schema.json \
            tests/test_aura_ephemeral_workspace_contracts.py | sort)"
          ACTUAL_REPAIR="$(git diff --name-only | sort)"
          test "$ACTUAL_REPAIR" = "$EXPECTED_REPAIR"
          git diff --check

          python -m py_compile \
            aura_ephemeral_workspace_contracts.py \
            tests/test_aura_ephemeral_workspace_contracts.py
          pytest -q tests/test_aura_ephemeral_workspace_contracts.py
          COLLECTION="$(pytest --collect-only -q tests/test_aura_ephemeral_workspace_contracts.py | tail -n 1)"
          echo "$COLLECTION"
          [[ "$COLLECTION" == 46\ tests\ collected* ]]
          python -m ruff check \
            aura_ephemeral_workspace_contracts.py \
            tests/test_aura_ephemeral_workspace_contracts.py \
            --select F401,F821,F841

          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          required = {
              "aura_project_context_projection.schema.json": {
                  "exact_builtin_integer_representation",
              },
              "aura_ephemeral_workspace_recipe.schema.json": {
                  "exact_builtin_integer_representation",
                  "signed_recipe_expiration_arithmetic",
              },
              "aura_multimodal_spatial_observation.schema.json": {
                  "exact_builtin_integer_representation",
              },
          }
          for name, keys in required.items():
              schema = json.loads((Path("schemas") / name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              delegations = schema["x-aura-semantic-delegations"]
              assert keys <= set(delegations), (name, keys - set(delegations))
              assert all(delegations[key] == "mandatory semantic validator" for key in keys)
          PY

          EXPECTED_FINAL="$(printf '%s\n' \
            .aura/refactor_objectives/intent_native_spatial_workspace_pr1.v1.json \
            .aura/waboose_requests/intent_native_spatial_workspace_pr1.v1.json \
            aura_ephemeral_workspace_contracts.py \
            docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md \
            schemas/aura_ephemeral_workspace_recipe.schema.json \
            schemas/aura_multimodal_spatial_observation.schema.json \
            schemas/aura_project_context_projection.schema.json \
            tests/test_aura_ephemeral_workspace_contracts.py | sort)"
          ACTUAL_FINAL="$(git diff --name-only "$BASE_SHA" | sort)"
          test "$ACTUAL_FINAL" = "$EXPECTED_FINAL"

          git diff --quiet "$BASE_SHA" -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json
          test ! -e .github/pr255_schema_semantic_delegation_patch.py
          test ! -e .github/workflows/pr255-schema-semantic-delegation-closure-v2.yml

          LIVE_BEFORE_COMMIT="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$LIVE_BEFORE_COMMIT" = "$FROZEN_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md \
            schemas/aura_ephemeral_workspace_recipe.schema.json \
            schemas/aura_multimodal_spatial_observation.schema.json \
            schemas/aura_project_context_projection.schema.json \
            tests/test_aura_ephemeral_workspace_contracts.py
          git commit -m "fix(pr1): declare remaining semantic delegations"

          NEW_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$FROZEN_HEAD"
          ACTUAL_FINAL_COMMITTED="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          test "$ACTUAL_FINAL_COMMITTED" = "$EXPECTED_FINAL"
          git diff --quiet "$BASE_SHA" HEAD -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json

          LIVE_BEFORE_PUSH="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$LIVE_BEFORE_PUSH" = "$FROZEN_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          {
            echo "## PR255 schema-semantic delegation repair"
            echo ""
            echo "- Frozen parent: \`$FROZEN_HEAD\`"
            echo "- Published head: \`$NEW_HEAD\`"
            echo "- Focused tests: 46 passed"
            echo "- Repair scope: 5 authorized files"
            echo "- Final PR scope: exact 8 authorized files"
            echo "- Generated exclusions: unchanged from exact base"
          } >> "$GITHUB_STEP_SUMMARY"
