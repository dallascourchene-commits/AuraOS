name: Aura Spatial S0-S2

on:
  pull_request:
    paths:
      - "aura_spatial_*.py"
      - "aura_topology_ws_bridge.py"
      - "aura_showcase_spatial.py"
      - "tests/test_aura_spatial_*.py"
      - "tests/test_aura_showcase_spatial_integration.py"
      - "schemas/aura_spatial_scene.schema.json"
      - "docs/AURA_SPATIAL_COMPUTING.md"
      - ".aura/research/AURA_SPATIAL_*"
      - ".github/workflows/aura-spatial-s0-s2.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "aura_spatial_*.py"
      - "aura_topology_ws_bridge.py"
      - "aura_showcase_spatial.py"
      - "tests/test_aura_spatial_*.py"
      - "tests/test_aura_showcase_spatial_integration.py"
      - "schemas/aura_spatial_scene.schema.json"
      - "docs/AURA_SPATIAL_COMPUTING.md"
      - ".aura/research/AURA_SPATIAL_*"
      - ".github/workflows/aura-spatial-s0-s2.yml"

permissions:
  contents: read

concurrency:
  group: aura-spatial-s0-s2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-spatial-substrate:
    name: Spatial substrate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install focused test tooling
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install pytest ruff numpy jsonschema --quiet
      - name: Compile spatial contracts, bridge, and tests
        run: |
          python -m py_compile \
            aura_spatial_contracts.py \
            aura_spatial_coordinate_frames.py \
            aura_spatial_asset_registry.py \
            aura_spatial_scene.py \
            aura_spatial_projection.py \
            aura_spatial_interaction.py \
            aura_spatial_ws_guard.py \
            aura_spatial_breadboard.py \
            aura_topology_ws_bridge.py \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_spatial_contracts.py \
            aura_spatial_coordinate_frames.py \
            aura_spatial_asset_registry.py \
            aura_spatial_scene.py \
            aura_spatial_projection.py \
            aura_spatial_interaction.py \
            aura_spatial_ws_guard.py \
            aura_spatial_breadboard.py \
            aura_topology_ws_bridge.py \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py
      - name: Validate Draft 2020-12 schema and runtime interchange
        run: |
          python - <<'PY'
          import hashlib
          import json
          from copy import deepcopy
          from pathlib import Path

          from jsonschema import Draft202012Validator

          from aura_spatial_contracts import (
              CoordinateFrame,
              SpatialAssetManifest,
              SpatialAssetType,
              SpatialEntity,
              SpatialEntityType,
          )
          from aura_spatial_scene import (
              compile_spatial_scene,
              validate_spatial_scene_payload,
          )

          schema = json.loads(
              Path("schemas/aura_spatial_scene.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          scene = compile_spatial_scene(
              scene_id="schema-compatibility-scene",
              purpose_digest="purpose:schema-compatibility",
              root_frame_id="root",
              frames=(CoordinateFrame(frame_id="root"),),
              entities=(
                  SpatialEntity(
                      entity_id="entity:one",
                      entity_type=SpatialEntityType.DOMAIN_NODE,
                      label="One",
                      frame_id="root",
                  ),
              ),
          ).to_dict()
          validator.validate(scene)
          validate_spatial_scene_payload(scene)

          invalid_authority = deepcopy(scene)
          invalid_authority["execution_authority"] = True
          assert list(validator.iter_errors(invalid_authority))

          invalid_nested_alias = deepcopy(scene)
          invalid_nested_alias["entities"][0]["metadata"] = {
              "automaticmErge": False
          }
          assert list(validator.iter_errors(invalid_nested_alias))

          invalid_scale = deepcopy(scene)
          invalid_scale["frames"][0]["scale"] = [0.0, 1.0, 1.0]
          assert list(validator.iter_errors(invalid_scale))

          invalid_quaternion = deepcopy(scene)
          invalid_quaternion["frames"][0]["rotation_xyzw"] = [
              0.0,
              0.0,
              0.0,
              0.0,
          ]
          assert list(validator.iter_errors(invalid_quaternion))

          content = b"asset"
          asset_scene = compile_spatial_scene(
              scene_id="asset-bounds-scene",
              purpose_digest="purpose:asset-bounds",
              root_frame_id="root",
              frames=(CoordinateFrame(frame_id="root"),),
              assets=(
                  SpatialAssetManifest(
                      asset_id="asset:one",
                      asset_type=SpatialAssetType.MESH,
                      uri="assets/one.glb",
                      media_type="model/gltf-binary",
                      content_digest=(
                          "sha256:" + hashlib.sha256(content).hexdigest()
                      ),
                      byte_length=len(content),
                      frame_id="root",
                      bounds_min=(0.0, 0.0, 0.0),
                      bounds_max=(1.0, 1.0, 1.0),
                      source_refs=("source:asset",),
                  ),
              ),
          ).to_dict()
          validator.validate(asset_scene)
          invalid_bounds = deepcopy(asset_scene)
          invalid_bounds["assets"][0]["bounds_min"] = [2.0, 0.0, 0.0]
          invalid_bounds["assets"][0]["bounds_max"] = [1.0, 1.0, 1.0]
          try:
              validate_spatial_scene_payload(invalid_bounds)
          except ValueError as exc:
              assert "bounds_min" in str(exc)
          else:
              raise AssertionError("runtime interchange accepted inverted bounds")
          PY
      - name: Run spatial substrate and showcase compatibility regressions
        id: spatial-tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py \
            tests/test_aura_showcase_spatial_integration.py \
            > spatial-test-output-${{ matrix.python-version }}.txt 2>&1
          status=$?
          cat spatial-test-output-${{ matrix.python-version }}.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-pytest-${{ matrix.python-version }}
          path: spatial-test-output-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Assert non-authority invariants
        if: steps.spatial-tests.outputs.status == '0'
        run: |
          python - <<'PY'
          from aura_spatial_breadboard import compile_spatial_breadboard
          from aura_spatial_contracts import SpatialSceneSnapshot

          packet = compile_spatial_breadboard()
          authority = packet["authority"]
          forbidden = (
              "execution_authority",
              "patch_authority",
              "renderer_authority",
              "vsa_patch_authority",
              "automatic_fix",
              "automatic_commit",
              "automatic_push",
              "automatic_pull_request",
              "automatic_merge",
          )
          assert all(authority[key] is False for key in forbidden)
          assert (
              SpatialSceneSnapshot.__dataclass_fields__[
                  "execution_authority"
              ].default
              is False
          )
          PY
      - name: Fail when focused regressions fail
        if: steps.spatial-tests.outputs.status != '0'
        run: exit 1
