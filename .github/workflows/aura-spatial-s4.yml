name: Aura Spatial S4-B

on:
  pull_request:
    paths:
      - "aura_spatial_asset_registry.py"
      - "aura_spatial_render_plan.py"
      - "aura_spatial_importers/**"
      - "aura_spatial_web/gaussian_renderer.js"
      - "aura_spatial_web/renderer_adapter.js"
      - "scripts/aura_spatial_s4b_architect_harness.py"
      - "schemas/aura_spatial_import_receipt.schema.json"
      - "tests/test_aura_spatial_*.py"
      - "tests/js/spatial-*.test.mjs"
      - "tests/fixtures/spatial/**"
      - "docs/AURA_SPATIAL_*.md"
      - "requirements-spatial-s4b.txt"
      - "package.json"
      - ".github/workflows/aura-spatial-s4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-spatial-s4b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spatial-s4b-python:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AURA_SPATIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AURA_SPATIAL_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      AURA_SPATIAL_BASE_REF: ${{ github.base_ref || 'main' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Fetch exact pull-request branch and base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$AURA_SPATIAL_HEAD_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$AURA_SPATIAL_HEAD_SHA"
          git fetch --no-tags origin "$AURA_SPATIAL_BASE_REF:refs/remotes/origin/$AURA_SPATIAL_BASE_REF"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact optional decoder and verification tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r repo/requirements-spatial-s4b.txt
          python -m pip install --disable-pip-version-check pytest jsonschema ruff numpy
          python - <<'PY'
          import zstandard
          assert zstandard.__version__ == "0.25.0"
          PY

      - name: Compile permanent S4-B source
        working-directory: repo
        run: |
          python -m py_compile \
            aura_spatial_asset_registry.py \
            aura_spatial_render_plan.py \
            aura_spatial_importers/*.py \
            scripts/aura_spatial_continuation_architect_harness.py \
            scripts/aura_spatial_s4b_architect_harness.py

      - name: Lint and format-check intentional Python
        working-directory: repo
        run: |
          ruff check \
            aura_spatial_asset_registry.py \
            aura_spatial_render_plan.py \
            aura_spatial_importers \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_s4b_harness.py
          ruff format --check \
            aura_spatial_asset_registry.py \
            aura_spatial_render_plan.py \
            aura_spatial_importers \
            scripts/aura_spatial_s4b_architect_harness.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_s4b_harness.py

      - name: Validate schema and runtime parity
        working-directory: repo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from tests.test_aura_spatial_spz import build_spz
          from tests.test_aura_spatial_gaussian_gltf import gaussian_gltf
          from aura_spatial_importers.contracts import validate_spatial_import_receipt_payload
          from aura_spatial_importers.gaussian_gltf import import_gaussian_gltf_bytes
          from aura_spatial_importers.spz import import_spz_bytes

          schema = json.loads(Path("schemas/aura_spatial_import_receipt.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          for result in (
              import_spz_bytes(build_spz(), provenance_refs=("ci:spz",)),
              import_gaussian_gltf_bytes(gaussian_gltf(), provenance_refs=("ci:khr",)),
          ):
              payload = result.receipt.to_dict()
              validator.validate(payload)
              assert validate_spatial_import_receipt_payload(payload) == result.receipt
          PY

      - name: Run retained and S4-B spatial regressions
        working-directory: repo
        run: |
          python -m pytest -q --tb=short \
            tests/test_aura_spatial_substrate.py \
            tests/test_aura_spatial_ws_guard.py \
            tests/test_aura_spatial_manual_review.py \
            tests/test_aura_spatial_projection_bounds.py \
            tests/test_aura_spatial_codex_followup.py \
            tests/test_aura_spatial_final_review.py \
            tests/test_aura_showcase_spatial_integration.py \
            tests/test_aura_spatial_render_plan.py \
            tests/test_aura_spatial_session.py \
            tests/test_aura_spatial_server.py \
            tests/test_aura_spatial_continuation_harness.py \
            tests/test_aura_spatial_browser_interaction.py \
            tests/test_aura_spatial_telemetry.py \
            tests/test_aura_spatial_gltf.py \
            tests/test_aura_spatial_ply.py \
            tests/test_aura_spatial_spz.py \
            tests/test_aura_spatial_gaussian_gltf.py \
            tests/test_aura_spatial_mixed_scene.py \
            tests/test_aura_spatial_asset_security.py \
            tests/test_aura_spatial_s4b_harness.py

      - name: Run exact-head Aura architecture, Waboose, and Crucible harness
        id: architecture-harness
        if: matrix.python-version == '3.12'
        continue-on-error: true
        working-directory: repo
        env:
          AURA_BASE_REF: origin/${{ env.AURA_SPATIAL_BASE_REF }}
          AURA_HEAD_REF: HEAD
          AURA_OBSERVED_HEAD_SHA: ${{ env.AURA_SPATIAL_HEAD_SHA }}
        run: |
          python scripts/aura_spatial_s4b_architect_harness.py \
            --repo-root . \
            --base-ref "$AURA_BASE_REF" \
            --head-ref "$AURA_HEAD_REF" \
            --observed-head "$AURA_OBSERVED_HEAD_SHA" \
            --output Aura_Staging/spatial_s4b_harness/architect_receipt.json

      - name: Assert exact-head architecture receipt
        if: matrix.python-version == '3.12' && always()
        working-directory: repo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt_path = Path("Aura_Staging/spatial_s4b_harness/architect_receipt.json")
          assert receipt_path.is_file(), "architecture harness did not produce a receipt"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          print(json.dumps({"status": receipt.get("status"), "checks": receipt.get("checks")}, sort_keys=True))
          assert receipt["status"] == "PASSED", receipt["checks"]
          assert receipt["repository_head"] == os.environ["AURA_SPATIAL_HEAD_SHA"]
          assert receipt["checks"]["crucible_passed"] is True
          assert receipt["s4b_proof"]["point_cloud_fallback"] is True
          assert receipt["s4b_proof"]["accessible_fallback"] is True
          assert receipt["s4b_proof"]["headless_fallback"] is True
          assert receipt["s4b_proof"]["capture_path"] is False
          assert receipt["s4b_proof"]["training_path"] is False
          assert receipt["automatic_fix"] is False
          assert receipt["automatic_merge"] is False
          PY

      - name: Upload exact-head S4-B receipt
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-s4b-receipt-${{ env.AURA_SPATIAL_HEAD_SHA }}
          path: repo/Aura_Staging/spatial_s4b_harness/architect_receipt.json
          if-no-files-found: error
          retention-days: 14

  spatial-s4b-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AURA_SPATIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AURA_SPATIAL_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Fetch exact pull-request branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$AURA_SPATIAL_HEAD_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$AURA_SPATIAL_HEAD_SHA"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run all retained and S4-B browser regressions
        working-directory: repo
        run: npm run test:spatial
