name: Finalize PR164 CODEMAP

on:
  push:
    branches:
      - feature/aura-spatial-s0-s2
    paths:
      - ".github/workflows/aura-codemap-finalize-pr164.yml"

permissions:
  contents: write

concurrency:
  group: aura-codemap-finalize-pr164
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aura-spatial-s0-s2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependency
        run: python -m pip install numpy --quiet
      - name: Remove one-time workflow before scanning
        run: rm .github/workflows/aura-codemap-finalize-pr164.yml
      - name: Regenerate canonical CODEMAP and deep topology
        run: |
          python aura_codebase_navigator.py \
            --root . \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          codemap = json.loads(Path('.aura/CODEMAP.json').read_text(encoding='utf-8'))
          topology = json.loads(Path('topology_map.json').read_text(encoding='utf-8'))
          cards = codemap.get('files') or codemap.get('file_cards') or []
          encoded = json.dumps(cards, sort_keys=True)
          assert 'aura_spatial_scene.py' in encoded
          assert 'tests/test_aura_spatial_final_review.py' in encoded
          assert topology.get('nodes') is not None
          assert topology.get('edges') is not None
          PY
      - name: Commit regenerated navigation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json \
            .github/workflows/aura-codemap-finalize-pr164.yml
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate CODEMAP after final spatial review fixes"
          git push origin HEAD:feature/aura-spatial-s0-s2
