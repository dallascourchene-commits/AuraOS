name: WO Fleet CI CODEMAP Final Repair Bootstrap

on:
  push:
    branches:
      - repair/wo-fleet-ci-codemap-final-001

permissions:
  contents: write

concurrency:
  group: wo-fleet-ci-codemap-final-001
  cancel-in-progress: true

jobs:
  repair-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wo-fleet-ci-codemap-final-001
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            "jsonschema>=4.23,<5.0" \
            "pytest>=8.2,<9.0" \
            "pytest-asyncio>=0.23,<1.0" \
            "trimesh>=4.7.1,<5.0" \
            "zstandard>=0.23.0,<1.0"

      - name: Keep transform focused on deterministic source contracts
        run: sed -i '/^    patch_trial_scope()$/d' tools/wo_fleet_ci_codemap_final_repair.py

      - name: Apply source-bound repair transform
        run: python tools/wo_fleet_ci_codemap_final_repair.py

      - name: Restore complete scanned-path grounding contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("aura_codebase_navigator.py")
          text = path.read_text(encoding="utf-8")
          marker = '        "repo_file_count": len(cards),\n        "source_paths_without_topology": missing_source_paths[:100],'
          replacement = '        "repo_file_count": len(cards),\n        "all_included_paths_sorted": sorted(source_paths),\n        "source_paths_without_topology": missing_source_paths[:100],'
          if '"all_included_paths_sorted": sorted(source_paths)' not in text:
              if marker not in text:
                  raise SystemExit("CODEMAP coverage contract marker missing; fail closed")
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Close residual navigator and Architect compatibility contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          nav_path = Path("aura_codebase_navigator.py")
          text = nav_path.read_text(encoding="utf-8")

          old_kind = '                kind = "method" if scope else "function"\n'
          new_kind = (
              '                if isinstance(child, ast.AsyncFunctionDef):\n'
              '                    kind = "async_method" if scope else "async_function"\n'
              '                else:\n'
              '                    kind = "method" if scope else "function"\n'
          )
          if old_kind in text:
              text = text.replace(old_kind, new_kind, 1)
          elif 'kind = "async_method" if scope else "async_function"' not in text:
              raise SystemExit("async symbol-kind anchor missing; fail closed")

          query_anchor = '    query_terms = {term.lower() for term in re.findall(r"[A-Za-z0-9_]+", query) if len(term) >= 2}\n'
          query_insert = (
              query_anchor
              + '    command_paths = {\n'
              + '        str(item).split(":", 1)[0]\n'
              + '        for item in (index.get("command_index", {}).get(query, []) or [])\n'
              + '    }\n'
          )
          if 'command_paths = {' not in text:
              if query_anchor not in text:
                  raise SystemExit("command ranking query anchor missing; fail closed")
              text = text.replace(query_anchor, query_insert, 1)

          score_anchor = '        score = lexical_hits * 3.0 + semantic + graph_bonus * 0.05\n'
          score_replace = (
              '        command_bonus = 4.0 if path in command_paths else 0.0\n'
              '        if (\n'
              '            command_bonus == 0.0\n'
              '            and query.startswith("!")\n'
              '            and query in (card.get("commands", []) or [])\n'
              '            and role in {"python_module", "operator_script", "native_accelerator"}\n'
              '        ):\n'
              '            command_bonus = 1.0\n'
              '        score = lexical_hits * 3.0 + semantic + graph_bonus * 0.05 + command_bonus\n'
          )
          if score_anchor in text:
              text = text.replace(score_anchor, score_replace, 1)
          elif 'command_bonus = 4.0 if path in command_paths else 0.0' not in text:
              raise SystemExit("command ranking score anchor missing; fail closed")
          nav_path.write_text(text, encoding="utf-8")

          architect_path = Path("aura_architect_loop.py")
          architect = architect_path.read_text(encoding="utf-8")
          refresh_anchor = 'def _refresh_plan_codemap_targets(plan: FractalPlanCapsule, repo_root: str | Path) -> None:\n    targets = sorted({'
          refresh_replace = (
              'def _refresh_plan_codemap_targets(plan: FractalPlanCapsule, repo_root: str | Path) -> None:\n'
              '    # Refresh may update an existing navigation snapshot, but it must\n'
              '    # never manufacture CODEMAP authority for a repository that has none.\n'
              '    if not (Path(repo_root) / ".aura" / "CODEMAP.json").is_file():\n'
              '        return\n'
              '    targets = sorted({'
          )
          if refresh_anchor in architect:
              architect = architect.replace(refresh_anchor, refresh_replace, 1)
          elif 'never manufacture CODEMAP authority' not in architect:
              raise SystemExit("Architect fail-closed refresh anchor missing; fail closed")
          architect_path.write_text(architect, encoding="utf-8")
          PY

      - name: Exclude only append-only outbox receipts from benchmark code scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("aura_real_refactor_trial.py")
          text = path.read_text(encoding="utf-8")
          helper_anchor = "\n\ndef _junit(path: Path | None) -> dict[str, Any]:"
          helper = '''

          def _is_noncode_execution_receipt(path: str) -> bool:
              """Exclude append-only Aura execution receipts from benchmark code scope."""
              normalized = path.replace("\\\\", "/")
              return normalized.startswith("aura_workspace/outbox/") and normalized.endswith(".receipt")
          '''
          if "def _is_noncode_execution_receipt(" not in text:
              if helper_anchor not in text:
                  raise SystemExit("benchmark helper anchor missing; fail closed")
              text = text.replace(helper_anchor, textwrap.dedent(helper) + helper_anchor, 1)
          old = '    out_of_scope = sorted(set(changed_files) - allowed)\n'
          new = (
              "    ignored_execution_receipts = {\n"
              "        path for path in changed_files if _is_noncode_execution_receipt(path)\n"
              "    }\n"
              "    out_of_scope = sorted(\n"
              "        path for path in changed_files\n"
              "        if path not in allowed and path not in ignored_execution_receipts\n"
              "    )\n"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif "ignored_execution_receipts" not in text:
              raise SystemExit("benchmark scope anchor missing; fail closed")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove bootstrap-only artifacts
        run: |
          rm tools/wo_fleet_ci_codemap_final_repair.py
          rm .github/workflows/wo-fleet-ci-codemap-final-bootstrap.yml

      - name: Compile repaired Python surfaces
        run: |
          python -m py_compile \
            aura_codebase_navigator.py \
            aura_codemap_verify.py \
            aura_real_refactor_trial.py \
            aura_architect_loop.py \
            aura_topological_scanner.py \
            aura_topology_manager.py

      - name: Regenerate canonical deep CODEMAP topology
        run: |
          python aura_codebase_navigator.py --refresh-topology
          git checkout -- Aura_Memory/live_topology_ast.json || true
          python -m aura_codemap_verify

      - name: Verify receipt scope exclusion is narrow
        run: |
          python - <<'PY'
          from aura_real_refactor_trial import _is_noncode_execution_receipt
          assert _is_noncode_execution_receipt("aura_workspace/outbox/WO-README-PROMOTE-AND-PUSH-001.receipt")
          assert not _is_noncode_execution_receipt("aura_workspace/outbox/result.json")
          assert not _is_noncode_execution_receipt("README.md")
          PY

      - name: Run exact previously failing CODEMAP and compatibility surfaces
        env:
          PYTHONHASHSEED: "0"
        run: |
          python -m pytest -q \
            tests/test_aura_codemap_verify.py \
            test_aura_substrate.py \
            test_aura_architect_loop.py \
            tests/test_aura_benchmark_four.py \
            tests/test_aura_benchmark_four_hardening.py

      - name: Commit verified repair branch
        run: |
          git config user.name "AuraOS CI Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair delta remains on this generation."
            exit 0
          fi
          git commit -m "fix(ci): restore CODEMAP topology and benchmark scope contracts"
          git push origin HEAD:repair/wo-fleet-ci-codemap-final-001
