name: Manual Final Waboose Patch

on:
  push:
    branches:
      - feature/spatial-s4b-gaussian-security

permissions:
  contents: write

concurrency:
  group: manual-final-waboose-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone branch
        run: |
          set -euo pipefail
          git clone --no-tags --depth=1 --branch feature/spatial-s4b-gaussian-security "https://github.com/${GITHUB_REPOSITORY}.git" .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: python -m pip install --disable-pip-version-check ruff

      - name: Apply and publish exact repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure_replace(path: str, old: str, new: str, marker: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old in text:
                  target.write_text(text.replace(old, new, 1), encoding="utf-8")
              elif marker not in text:
                  raise SystemExit(f"missing old and new forms in {path}: {marker}")

          spatial = "aura_spatial_construction.py"
          ensure_replace(
              spatial,
              "import hashlib\nimport math\nfrom typing import Any\n",
              "import hashlib\nimport math\nfrom pathlib import PurePosixPath\nimport re\nfrom typing import Any\nfrom urllib.parse import unquote, urlsplit\n",
              "from urllib.parse import unquote, urlsplit",
          )
          ensure_replace(
              spatial,
              '_ALLOWED_ASSET_SCHEMES = ("aura://", "file://")\n',
              "_MAX_CONSTRUCTION_ASSET_URI_BYTES = 4096\n",
              "_MAX_CONSTRUCTION_ASSET_URI_BYTES",
          )
          ensure_replace(
              spatial,
              '''    if not asset.uri.startswith(_ALLOWED_ASSET_SCHEMES):
                  raise ValueError("Construction floor-plan assets must be local or Aura-addressed")
          ''',
              "    _validate_local_asset_uri(asset.uri)\n",
              "_validate_local_asset_uri(asset.uri)",
          )
          ensure_replace(
              spatial,
              "def _validate_floor_plan_asset(asset: SpatialAssetManifest, privacy: SpatialPrivacyClass) -> None:\n",
              '''def _validate_local_asset_uri(value: Any) -> str:
              if type(value) is not str:
                  raise ValueError("Construction floor-plan asset URI must be a string")
              uri = value.strip()
              if uri != value or not uri or len(uri.encode("utf-8")) > _MAX_CONSTRUCTION_ASSET_URI_BYTES:
                  raise ValueError("Construction floor-plan asset URI is empty, padded, or oversized")
              if any(ord(char) < 32 or ord(char) == 127 for char in uri):
                  raise ValueError("Construction floor-plan asset URI contains control characters")
              lowered = uri.casefold()
              if "\\" in uri or re.search(r"%(?:2f|5c)", lowered):
                  raise ValueError("Construction floor-plan asset URI contains an encoded or aliased separator")
              decoded = unquote(uri)
              if decoded.count("/") != uri.count("/") or decoded.count("\\") != uri.count("\\"):
                  raise ValueError("Construction floor-plan asset URI changes separators when decoded")
              parsed = urlsplit(uri)
              if parsed.scheme not in {"aura", "file"}:
                  raise ValueError("Construction floor-plan assets must be local or Aura-addressed")
              scheme, separator, remainder = uri.partition(":")
              if separator != ":" or scheme != parsed.scheme or not remainder.startswith("//"):
                  raise ValueError("Construction floor-plan asset URI must use a canonical hierarchical scheme")
              if parsed.username is not None or parsed.password is not None or parsed.query or parsed.fragment:
                  raise ValueError("Construction floor-plan asset URI cannot contain credentials, query, or fragment")
              try:
                  port = parsed.port
              except ValueError as exc:
                  raise ValueError("Construction floor-plan asset URI contains a malformed authority") from exc
              if port is not None:
                  raise ValueError("Construction floor-plan asset URI cannot contain a port")
              if parsed.scheme == "aura":
                  if not parsed.netloc or parsed.netloc != parsed.netloc.casefold():
                      raise ValueError("Aura asset URI requires a canonical lowercase authority")
              elif parsed.netloc not in {"", "localhost"}:
                  raise ValueError("file asset URI cannot name a remote host")
              path = parsed.path
              if not path.startswith("/") or "//" in path or (len(path) > 1 and path.endswith("/")):
                  raise ValueError("Construction floor-plan asset URI path is not canonical")
              if any(part in {".", ".."} for part in PurePosixPath(path).parts):
                  raise ValueError("Construction floor-plan asset URI path contains a dot segment")
              return uri


          def _validate_floor_plan_asset(asset: SpatialAssetManifest, privacy: SpatialPrivacyClass) -> None:
          ''',
              "def _validate_local_asset_uri",
          )

          security = "aura_review_lessons_security.py"
          ensure_replace(
              security,
              "def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:\n",
              '''def _is_spatial_no_authority_envelope(candidate: Any) -> bool:
              return bool(
                  isinstance(candidate, Mapping)
                  and candidate.get("projection_only") is True
                  and candidate.get("renderer_authority") is False
                  and candidate.get("execution_authority") is False
                  and candidate.get("patch_authority") is False
                  and candidate.get("production_mutation") is False
              )


          def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:
          ''',
              "def _is_spatial_no_authority_envelope",
          )
          ensure_replace(
              security,
              '''def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:
              """Detect affirmative or contradictory canonical authority metadata."""

              findings: list[dict[str, Any]] = []
              for path, key, value in _walk_metadata(candidate):
          ''',
              '''def detect_protected_metadata_overrides(candidate: Any) -> list[dict[str, Any]]:
              """Detect affirmative or contradictory canonical authority metadata."""

              findings: list[dict[str, Any]] = []
              spatial_no_authority = _is_spatial_no_authority_envelope(candidate)
              for path, key, value in _walk_metadata(candidate):
          ''',
              "spatial_no_authority = _is_spatial_no_authority_envelope(candidate)",
          )
          ensure_replace(
              security,
              '''        expected = _PROTECTED_AUTHORITY_EXPECTED[key]
              if value == "<dynamic>":
          ''',
              '''        expected = _PROTECTED_AUTHORITY_EXPECTED[key]
              if key == "patch_authority" and path == "$.patch_authority" and spatial_no_authority:
                  continue
              if value == "<dynamic>":
          ''',
              'path == "$.patch_authority" and spatial_no_authority',
          )
          ensure_replace(
              security,
              '''        uri = str(value or "").strip()
              lowered = uri.casefold()
          ''',
              '''        uri = str(value or "").strip()
              scheme, separator, remainder = uri.partition(":")
              if separator == ":" and remainder == "//" and re.fullmatch(r"[A-Za-z][A-Za-z0-9+.-]*", scheme):
                  continue
              lowered = uri.casefold()
          ''',
              'remainder == "//"',
          )

          test = Path("tests/test_aura_spatial_waboose_precision.py")
          if not test.exists():
              test.write_text(
                  '''from __future__ import annotations

          import ast
          from dataclasses import replace

          import pytest

          from aura_coding_waboose_review_learning import scan_python_review_lessons
          from aura_review_lessons_security import (
              detect_protected_metadata_overrides,
              detect_uri_alias_encoding,
          )
          from aura_spatial_construction import project_construction_state_to_scene
          from tests.test_aura_spatial_s6_construction import _fixture_packet, _floor_asset


          def test_review_lesson_uri_detector_ignores_canonical_scheme_prefix_tokens() -> None:
              assert detect_uri_alias_encoding("aura://") == []
              assert detect_uri_alias_encoding("file://") == []
              assert detect_uri_alias_encoding("aura:////forged")
              assert detect_uri_alias_encoding("aura://construction/%2fsecret")


          def test_review_lesson_authority_detector_accepts_typed_spatial_no_authority_envelope() -> None:
              envelope = {
                  "projection_only": True,
                  "renderer_authority": False,
                  "execution_authority": False,
                  "patch_authority": False,
                  "production_mutation": False,
              }
              assert detect_protected_metadata_overrides(envelope) == []
              assert detect_protected_metadata_overrides({**envelope, "patch_authority": "full_repository"})
              source = "packet = " + repr(envelope)
              findings = scan_python_review_lessons(file="tests/fixture.py", source=source, tree=ast.parse(source))
              assert not any(item.get("rule") == "detect_protected_metadata_overrides" for item in findings)


          @pytest.mark.parametrize(
              "uri",
              [
                  "aura:////construction/floor-plan",
                  "aura://construction//floor-plan",
                  "aura://construction/%2fsecret",
                  "aura://construction/../floor-plan",
                  "aura://user@construction/floor-plan",
                  "aura://construction/floor-plan?token=secret",
                  "file://remote-host/tmp/floor.glb",
                  "https://example.test/floor.glb",
              ],
          )
          def test_construction_projection_rejects_noncanonical_floor_asset_uris(uri: str) -> None:
              fixture, packet = _fixture_packet()
              with pytest.raises(ValueError, match="URI|local or Aura-addressed|remote host"):
                  project_construction_state_to_scene(
                      fixture.state,
                      packet,
                      purpose_digest="6" * 64,
                      floor_plan_assets=(_floor_asset(uri=uri),),
                  )


          def test_construction_projection_accepts_canonical_aura_and_local_file_uris() -> None:
              fixture, packet = _fixture_packet()
              aura_scene = project_construction_state_to_scene(
                  fixture.state,
                  packet,
                  purpose_digest="7" * 64,
                  floor_plan_assets=(_floor_asset(),),
              )
              file_asset = replace(_floor_asset(), uri="file:///tmp/aura/floor.glb")
              file_scene = project_construction_state_to_scene(
                  fixture.state,
                  packet,
                  purpose_digest="8" * 64,
                  floor_plan_assets=(file_asset,),
              )
              assert len(aura_scene.assets) == 2
              assert len(file_scene.assets) == 2
          ''',
                  encoding="utf-8",
              )

          spatial_text = Path(spatial).read_text(encoding="utf-8")
          security_text = Path(security).read_text(encoding="utf-8")
          assert "_ALLOWED_ASSET_SCHEMES" not in spatial_text
          assert "def _validate_local_asset_uri" in spatial_text
          assert "def _is_spatial_no_authority_envelope" in security_text
          assert "spatial_no_authority = _is_spatial_no_authority_envelope(candidate)" in security_text
          PY
          files=(aura_spatial_construction.py aura_review_lessons_security.py tests/test_aura_spatial_waboose_precision.py)
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          python -m py_compile "${files[@]}"
          git config user.name "dallascourchene-commits"
          git config user.email "281686929+dallascourchene-commits@users.noreply.github.com"
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "fix(spatial): harden URI and Waboose authority precision"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/feature/spatial-s4b-gaussian-security
          fi
