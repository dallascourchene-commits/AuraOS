name: BugHound BugBot Lab

on:
  pull_request:
    paths:
      - 'scripts/bughound_foundry_intake.py'
      - 'tests/test_bughound_foundry_intake.py'
      - 'scripts/bughound_bugbot_lab.py'
      - 'tests/test_bughound_bugbot_lab.py'
      - '.github/workflows/bughound-bugbot-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bugbot-ground-truth:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/bughound_foundry_intake.py scripts/bughound_bugbot_lab.py tests/test_bughound_foundry_intake.py tests/test_bughound_bugbot_lab.py
      - name: Focused BugHound tests
        run: python -m pytest -q tests/test_bughound_foundry_intake.py tests/test_bughound_bugbot_lab.py
      - name: Deterministic suite receipt
        run: python scripts/bughound_bugbot_lab.py
