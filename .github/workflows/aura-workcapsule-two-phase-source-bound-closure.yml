name: Aura WorkCapsule Two-Phase Source-Bound Closure

on:
  pull_request:
    paths:
      - 'scripts/aura_astge_anchor_hydration.py'
      - 'tests/test_aura_astge_anchor_hydration.py'
      - 'scripts/aura_workcapsule_context_binding.py'
      - 'tests/test_aura_workcapsule_context_binding.py'
      - 'scripts/aura_workcapsule_reentry_invalidation.py'
      - 'tests/test_aura_workcapsule_reentry_invalidation.py'
      - 'scripts/aura_workcapsule_reentry_exact_verifier.py'
      - 'tests/test_aura_workcapsule_reentry_exact_verifier.py'
      - 'scripts/aura_workcapsule_source_reentry_observation.py'
      - 'tests/test_aura_workcapsule_source_reentry_observation.py'
      - 'scripts/aura_workcapsule_source_bound_exact_reentry.py'
      - 'tests/test_aura_workcapsule_source_bound_exact_reentry.py'
      - 'scripts/aura_workcapsule_reentry_closure.py'
      - 'tests/test_aura_workcapsule_reentry_closure.py'
      - 'scripts/aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'tests/test_aura_workcapsule_reentry_closure_exact_verifier.py'
      - 'scripts/aura_workcapsule_two_phase_source_bound_closure.py'
      - 'tests/test_aura_workcapsule_two_phase_source_bound_closure.py'
      - '.github/workflows/aura-workcapsule-two-phase-source-bound-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-phase-source-bound-closure:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Re-prove raw source-currentness and PR514 source-bound exact re-entry
        run: |
          python3 -m py_compile scripts/aura_source_anchor_map.py scripts/aura_astge_anchor_hydration.py
          python3 -m py_compile scripts/aura_workcapsule_source_reentry_observation.py scripts/aura_workcapsule_source_bound_exact_reentry.py
          python3 -m unittest -v tests.test_aura_astge_anchor_hydration
          python3 -m unittest -v tests.test_aura_workcapsule_source_reentry_observation
          python3 -m unittest -v tests.test_aura_workcapsule_source_bound_exact_reentry

      - name: Re-prove PR513 exact closure owner
        run: |
          python3 -m py_compile scripts/aura_workcapsule_context_binding.py scripts/aura_workcapsule_reentry_invalidation.py
          python3 -m py_compile scripts/aura_workcapsule_reentry_exact_verifier.py scripts/aura_workcapsule_reentry_closure.py scripts/aura_workcapsule_reentry_closure_exact_verifier.py
          python3 -m unittest -v tests.test_aura_workcapsule_context_binding
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_invalidation
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_exact_verifier
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure
          python3 -m unittest -v tests.test_aura_workcapsule_reentry_closure_exact_verifier

      - name: Prove two-phase raw-source-bound lifecycle
        run: |
          python3 -m py_compile scripts/aura_workcapsule_two_phase_source_bound_closure.py
          python3 -m unittest -v tests.test_aura_workcapsule_two_phase_source_bound_closure

      - name: Assert public lifecycle has no caller source or candidate escape hatch
        run: |
          python3 - <<'PY'
          import inspect
          from scripts.aura_workcapsule_two_phase_source_bound_closure import verify_two_phase_source_bound_exact_closure
          params = inspect.signature(verify_two_phase_source_bound_exact_closure).parameters
          assert 'candidate_binding' not in params
          assert 'observed_source_witnesses' not in params
          assert 'pre_root' in params and 'post_root' in params
          print('CALLER_CANDIDATE_BINDING_ACCEPTED=false')
          print('CALLER_SOURCE_WITNESSES_ACCEPTED=false')
          print('PRE_POST_RAW_EVIDENCE_ROOTS_REQUIRED=true')
          PY

      - name: Emit consequence ceiling
        run: |
          echo 'TWO_PHASE_RAW_SOURCE_BOUND_EXACT_LIFECYCLE=true'
          echo 'PRE_REENTRY_SOURCE_OWNER_BOUND=true'
          echo 'POST_REPAIR_SOURCE_CANDIDATE_DERIVED=true'
          echo 'PRE_POST_EVIDENCE_COLLAPSE_ALLOWED=false'
          echo 'EXACT_HOLD_PROMOTED_TO_CLOSED=false'
          echo 'SOURCE_GENERATION_DOMAIN_PRESERVED=true'
          echo 'PRE_GRAPH_PRODUCER_AUTHENTICATED=false'
          echo 'POST_GRAPH_PRODUCER_AUTHENTICATED=false'
          echo 'SOURCE_OBSERVATION_PRODUCER_AUTHENTICATED=false'
          echo 'SOURCE_TO_GRAPH_DEPENDENCY_MAP_PROVEN=false'
          echo 'NODE_LEVEL_INVALIDATION_CONE_PROVEN=false'
          echo 'SEMANTIC_TRUTH_MINTED=false'
          echo 'REVIEW_AUTHORIZED=false'
          echo 'MUTATION_AUTHORIZED=false'
          echo 'EXECUTION_AUTHORIZED=false'
          echo 'COMMIT_AUTHORIZED=false'
          echo 'MERGE_AUTHORIZED=false'
          echo 'PROMOTION_AUTHORIZED=false'
          echo 'PROVIDER_EFFECT_AUTHORIZED=false'
          echo 'PUBLIC_EFFECT_AUTHORIZED=false'
          echo 'HUMAN_AUTHORITY=false'
