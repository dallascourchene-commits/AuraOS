name: O20R Exact-Head Proof
on:
  push:
    branches: [arena/o20r-effect-time-loaded-process-currentness]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Three fresh venv proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .o20r_proof && mkdir .o20r_proof
          for e in 1 2 3; do
            python -m venv ".o20r_proof/venv${e}"
            py=".o20r_proof/venv${e}/bin/python"
            "$py" -m unittest tests.test_effect_time_loaded_process_currentness_hosted -v > ".o20r_proof/test${e}.out" 2>&1
            "$py" -m tools.arena.o20r_campaign > ".o20r_proof/campaign${e}.json"
            "$py" -m tools.arena.o20r_lattice8 > ".o20r_proof/omega${e}.json"
            "$py" -m tools.arena.o20r_sweep13d > ".o20r_proof/sweep${e}.json"
            "$py" -m tools.arena.o20r_hs1000 > ".o20r_proof/hs${e}.json"
          done
          for stem in campaign omega sweep hs; do
            cmp ".o20r_proof/${stem}1.json" ".o20r_proof/${stem}2.json"
            cmp ".o20r_proof/${stem}1.json" ".o20r_proof/${stem}3.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('.o20r_proof')
          c=json.loads((r/'campaign1.json').read_text())
          o=json.loads((r/'omega1.json').read_text())
          s=json.loads((r/'sweep1.json').read_text())
          h=json.loads((r/'hs1.json').read_text())
          assert c['cases']==24000 and c['false_admit']==0 and c['false_hold']==0 and c['authority_promotions']==0
          assert c['naive_installed_only_unsafe']==18000
          assert c['naive_load_time_only_unsafe']==12000
          assert o['states']==6561 and o['bind']==1 and o['invalid_bind']==0 and o['effect_authority']==0
          assert s['cartesian_states']==1594323 and s['lawful_contextual_bind']==243 and s['hard_invalid_context_repair']==0 and s['effect_authority']==0
          assert h['raw']==1000 and h['quotients']==100 and h['top27_count']==27
          print('O20R_EXACT_HEAD_PROOF=PASS')
          PY
