name: PR199 bounded review fixes

on:
  push:
    branches:
      - analysis/pr199-review-fixes-20260725

permissions:
  contents: write
  statuses: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/pr199-review-fixes-20260725
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve encoded exact-head review patch
        run: cp .aura/analysis/pr199_review_fixes_payload.txt /tmp/review.b64

      - name: Reset to exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e e361c62209bf8b93a36d80c74288657c057f7408^{commit}
          git reset --hard e361c62209bf8b93a36d80c74288657c057f7408
          test "$(git rev-parse HEAD)" = "e361c62209bf8b93a36d80c74288657c057f7408"

      - name: Decode and verify exact-head review patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d /tmp/review.b64 > /tmp/review.patch.gz
          gzip -t /tmp/review.patch.gz
          gzip -d -c /tmp/review.patch.gz > /tmp/review.patch
          test "$(sha256sum /tmp/review.patch | awk '{print $1}')" = "dfdd281ebb7769086a1078350456881366a4361d8ca85b4931ad1bfa297e402d"

      - name: Apply exact bounded review patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch

      - name: Install focused verification tooling
        run: python -m pip install --upgrade pytest ruff

      - name: Format and lint exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          files=(
            aura_agent_arena_bridge.py
            aura_qdkt_observations.py
            aura_unified_memory_continuity_learning.py
            tests/test_aura_unified_memory_continuity_learning.py
          )
          ruff format "${files[@]}"
          ruff check --select E9,F63,F7,F82 "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check

      - name: Run focused regression ring
        id: focused_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_qdkt_observations.py \
            2>&1 | tee "${RUNNER_TEMP}/pytest.log"

      - name: Preserve formatted diagnostic surface
        if: always()
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/pr199-diagnostics"
          cp "${RUNNER_TEMP}/pytest.log" "${RUNNER_TEMP}/pr199-diagnostics/pytest.log" 2>/dev/null || true
          cp aura_agent_arena_bridge.py "${RUNNER_TEMP}/pr199-diagnostics/"
          cp aura_qdkt_observations.py "${RUNNER_TEMP}/pr199-diagnostics/"
          cp aura_unified_memory_continuity_learning.py "${RUNNER_TEMP}/pr199-diagnostics/"
          cp tests/test_aura_unified_memory_continuity_learning.py "${RUNNER_TEMP}/pr199-diagnostics/"
          git diff --stat > "${RUNNER_TEMP}/pr199-diagnostics/diff-stat.txt"
          git diff --check > "${RUNNER_TEMP}/pr199-diagnostics/diff-check.txt" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr199-review-fix-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/pr199-diagnostics/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce focused regression result
        run: test "${{ steps.focused_tests.outcome }}" = "success"

      - name: Enforce exact four-file scope
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json 2>/dev/null || true
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            aura_agent_arena_bridge.py \
            aura_qdkt_observations.py \
            aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity_learning.py | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Publish clean review-fix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_agent_arena_bridge.py \
            aura_qdkt_observations.py \
            aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity_learning.py
          git commit -m "fix: resolve learning-to-reproof scan findings"
          git push origin HEAD:feature/unified-memory-learning-to-reproof

      - name: Publish discoverable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="pr199-review-fixes" \
            -f description="Run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
