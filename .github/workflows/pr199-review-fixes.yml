name: PR199 bounded review fixes

on:
  push:
    branches:
      - analysis/pr199-review-fixes-20260725

permissions:
  contents: write
  statuses: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-memory-learning-to-reproof
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify expected PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f75f916a6949c0bec013452f581cb3e9a3681d63"

      - name: Apply partial-finalization retry fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_path = Path("aura_unified_memory_continuity_learning.py")
          source = source_path.read_text(encoding="utf-8")

          old = '''    learning_results = session.setdefault("unified_learning_results", {})
              if task in learning_results:
                  raise ValueError("governed learning result is already retained for this task")
              root = Path(bridge.repo_root).resolve()
          '''.replace("              ", "    ")
          new = '''    learning_results = session.setdefault("unified_learning_results", {})
              finalization_claims = session.setdefault("unified_learning_finalization_claims", {})
              if task in learning_results or task in finalization_claims:
                  raise ValueError(
                      "governed learning result is already retained or finalization is already claimed for this task"
                  )

              def _claim_finalization() -> None:
                  finalization_claims.setdefault(
                      task,
                      {
                          "version": LEARNING_RUNTIME_VERSION,
                          "status": "FINALIZATION_CLAIMED",
                          "plan_phase_hash": phase,
                          "task_id": task,
                          "automatic_crystallization": False,
                          "automatic_promotion": False,
                          "production_mutation": False,
                      },
                  )

              root = Path(bridge.repo_root).resolve()
          '''.replace("              ", "    ")
          if source.count(old) != 1:
              raise SystemExit("finalization guard context did not match exactly once")
          source = source.replace(old, new, 1)

          old = '''        with ArenaExperienceLedger(root, db_path=experience_path) as ledger:
                      relationship_storage = ledger.record_relationship_observation(relationship)
          '''.replace("                      ", "        ")
          new = '''        _claim_finalization()
                  with ArenaExperienceLedger(root, db_path=experience_path) as ledger:
                      relationship_storage = ledger.record_relationship_observation(relationship)
          '''.replace("                  ", "        ")
          if source.count(old) != 1:
              raise SystemExit("relationship durable-write context did not match exactly once")
          source = source.replace(old, new, 1)

          old = '''    archive = ArenaAttemptArchive(root, db_path=attempt_archive_path)
          '''
          new = '''    _claim_finalization()
              archive = ArenaAttemptArchive(root, db_path=attempt_archive_path)
          '''.replace("              ", "    ")
          if source.count(old) != 1:
              raise SystemExit("archive durable-write context did not match exactly once")
          source = source.replace(old, new, 1)

          old = '''    learning_results[task] = result
              return result
          '''.replace("              ", "    ")
          new = '''    learning_results[task] = result
              finalization_claims.pop(task, None)
              return result
          '''.replace("              ", "    ")
          if source.count(old) != 1:
              raise SystemExit("successful finalization retention context did not match exactly once")
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_aura_unified_memory_continuity_learning.py")
          tests = test_path.read_text(encoding="utf-8")

          old = '''from dataclasses import replace
          from pathlib import Path
          import subprocess
          '''.replace("          ", "")
          new = '''from dataclasses import replace
          import hashlib
          from pathlib import Path
          import subprocess
          '''.replace("          ", "")
          if tests.count(old) != 1:
              raise SystemExit("test import context did not match exactly once")
          tests = tests.replace(old, new, 1)

          marker = '''def _repo(root: Path) -> str:
          '''.replace("          ", "")
          addition = '''def _governance_storage_snapshot(root: Path) -> dict[str, str]:
              paths = [
                  *root.glob("experience.db*"),
                  *root.glob("attempts.db*"),
                  *((root / "qdkt-events").rglob("*") if (root / "qdkt-events").exists() else ()),
              ]
              return {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(paths)
                  if path.is_file()
              }


          '''.replace("          ", "")
          if tests.count(marker) != 1:
              raise SystemExit("storage snapshot helper insertion point did not match exactly once")
          tests = tests.replace(marker, addition + marker, 1)

          old = '''    # Record initial state
              assert result["relationship_experience"] is not None
              initial_relationship = result["relationship_experience"]
              initial_qdkt = result["qdkt_event_receipt"]
              assert initial_qdkt is not None
              assert result["attempt_archive"]["ok"] is True

              # Verify session state is populated
              assert "A1" in bridge._session["unified_relationship_experiences"]
              assert "A1" in bridge._session["unified_qdkt_admissions"]
              assert "A1" in bridge._session["unified_learning_results"]

              # Second finalization attempt with valid input should raise ValueError
              with pytest.raises(ValueError, match="governed learning result is already retained"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )

              # Verify no records were duplicated in session state
              assert bridge._session["unified_relationship_experiences"]["A1"] is not None
              assert bridge._session["unified_qdkt_admissions"]["A1"] is not None
              assert bridge._session["unified_learning_results"]["A1"] is result
          '''.replace("              ", "    ")
          new = '''    assert result["relationship_experience"] is not None
              assert result["qdkt_event_receipt"] is not None
              assert result["attempt_archive"]["ok"] is True
              assert "A1" in bridge._session["unified_relationship_experiences"]
              assert "A1" in bridge._session["unified_qdkt_admissions"]
              assert "A1" in bridge._session["unified_learning_results"]
              before_retry = _governance_storage_snapshot(tmp_path)

              with pytest.raises(ValueError, match="governed learning result is already retained"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )

              assert _governance_storage_snapshot(tmp_path) == before_retry
              assert bridge._session["unified_relationship_experiences"]["A1"] is not None
              assert bridge._session["unified_qdkt_admissions"]["A1"] is not None
              assert bridge._session["unified_learning_results"]["A1"] is result
          '''.replace("              ", "    ")
          if tests.count(old) != 1:
              raise SystemExit("extended replay test context did not match exactly once")
          tests = tests.replace(old, new, 1)

          marker = '''def test_commit_rejects_absolute_storage_path(tmp_path: Path) -> None:
          '''.replace("          ", "")
          addition = '''def test_archive_failure_retains_claim_and_blocks_duplicate_retry(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              bridge, now = _prepared(tmp_path)
              commit_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  contract=_prediction_contract(now, tmp_path),
              )
              observe_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  observation=_observation_contract(now),
              )
              original_record = learning_runtime.ArenaAttemptArchive.record

              def _fail_archive(*_args: Any, **_kwargs: Any) -> dict[str, Any]:
                  raise ValueError("forced attempt archive failure")

              monkeypatch.setattr(learning_runtime.ArenaAttemptArchive, "record", _fail_archive)
              with pytest.raises(ValueError, match="forced attempt archive failure"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )

              assert "A1" in bridge._session["unified_learning_finalization_claims"]
              assert "A1" not in bridge._session["unified_learning_results"]
              before_retry = _governance_storage_snapshot(tmp_path)
              assert any(name.startswith("experience.db") for name in before_retry)
              assert any(name.startswith("qdkt-events/") for name in before_retry)

              monkeypatch.setattr(learning_runtime.ArenaAttemptArchive, "record", original_record)
              with pytest.raises(ValueError, match="finalization is already claimed"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )

              assert _governance_storage_snapshot(tmp_path) == before_retry


          '''.replace("          ", "")
          if tests.count(marker) != 1:
              raise SystemExit("archive failure test insertion point did not match exactly once")
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused verification tooling
        run: python -m pip install --disable-pip-version-check -q pytest ruff numpy

      - name: Format and lint exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          files=(
            aura_unified_memory_continuity_learning.py
            tests/test_aura_unified_memory_continuity_learning.py
          )
          ruff format "${files[@]}"
          ruff check --select E9,F63,F7,F82 "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check

      - name: Run focused regression ring
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_qdkt_observations.py

      - name: Restore generated architecture artifacts
        shell: bash
        run: |
          git checkout -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            Aura_Memory/live_topology_ast.json \
            topology_map.json \
            2>/dev/null || true

      - name: Enforce exact two-file scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity_learning.py | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Publish clean final review-fix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_unified_memory_continuity_learning.py tests/test_aura_unified_memory_continuity_learning.py
          git commit -m "fix: retain finalization claim before durable writes"
          git push origin HEAD:feature/unified-memory-learning-to-reproof

      - name: Publish discoverable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="pr199-final-review-fix" \
            -f description="Run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
