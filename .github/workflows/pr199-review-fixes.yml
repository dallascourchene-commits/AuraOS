name: PR199 bounded review fixes

on:
  push:
    branches:
      - analysis/pr199-review-fixes-20260725

permissions:
  contents: write
  statuses: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-memory-learning-to-reproof
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify expected PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3057c03464d563a678ef5e98d94bba0fbf843582"

      - name: Apply fail-closed finalization fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_path = Path("aura_unified_memory_continuity_learning.py")
          source = source_path.read_text(encoding="utf-8")

          old = '''    binding = _binding(session, task)
              prediction = _prediction(dict(session.get("unified_prediction_packets") or {}).get(task))
              observation = _observation(dict(session.get("unified_p1_observations") or {}).get(task))
              root = Path(bridge.repo_root).resolve()
          '''.replace("              ", "    ")
          new = '''    binding = _binding(session, task)
              prediction = _prediction(dict(session.get("unified_prediction_packets") or {}).get(task))
              observation = _observation(dict(session.get("unified_p1_observations") or {}).get(task))
              learning_results = session.setdefault("unified_learning_results", {})
              if task in learning_results:
                  raise ValueError("governed learning result is already retained for this task")
              root = Path(bridge.repo_root).resolve()
          '''.replace("              ", "    ")
          if source.count(old) != 1:
              raise SystemExit("finalization entry context did not match exactly once")
          source = source.replace(old, new, 1)

          old = '''            created_at=qdkt_created_at,
                  )
                  qdkt_receipt = {
          '''.replace("                  ", "        ")
          new = '''            created_at=qdkt_created_at,
                  )
                  if event_receipt.appended is not True:
                      raise ValueError("governed QDKT event was not appended to the event store")
                  qdkt_receipt = {
          '''.replace("                  ", "        ")
          if source.count(old) != 1:
              raise SystemExit("QDKT append context did not match exactly once")
          source = source.replace(old, new, 1)

          old = '    session.setdefault("unified_learning_results", {})[task] = result\n'
          new = '    learning_results[task] = result\n'
          if source.count(old) != 1:
              raise SystemExit("learning result retention context did not match exactly once")
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_aura_unified_memory_continuity_learning.py")
          tests = test_path.read_text(encoding="utf-8")
          old = 'import pytest\n\n'
          new = 'import pytest\n\nimport aura_unified_memory_continuity_learning as learning_runtime\n'
          if tests.count(old) != 1:
              raise SystemExit("test import context did not match exactly once")
          tests = tests.replace(old, new, 1)

          marker = '@pytest.mark.parametrize("missing_field", ["human_disposition", "disposition_actor_type"])\n'
          addition = '''def test_finalize_is_first_write_only(tmp_path: Path) -> None:
              bridge, now = _prepared(tmp_path)
              commit_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  contract=_prediction_contract(now, tmp_path),
              )
              observe_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  observation=_observation_contract(now),
              )
              result = finalize_bridge_learning(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  contract=_final_contract(tmp_path, now),
              )
              retained_result = bridge._session["unified_learning_results"]["A1"]
              with pytest.raises(ValueError, match="governed learning result is already retained"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )
              assert retained_result is result
              assert bridge._session["unified_learning_results"]["A1"] is retained_result


          '''
          if tests.count(marker) != 1:
              raise SystemExit("finalize retry test insertion point did not match exactly once")
          tests = tests.replace(marker, addition + marker, 1)

          marker = 'def test_denial_is_archived_without_relationship_or_qdkt_admission(tmp_path: Path) -> None:\n'
          addition = '''def test_finalize_rejects_unappended_qdkt_event(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              bridge, now = _prepared(tmp_path)
              commit_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  contract=_prediction_contract(now, tmp_path),
              )
              observe_bridge_prediction(
                  bridge,
                  plan_phase_hash="phase-1",
                  task_id="A1",
                  observation=_observation_contract(now),
              )
              record_advisory = learning_runtime.record_relationship_experience_advisory

              def _report_unappended(*args: Any, **kwargs: Any) -> GovernedRelationshipQDKTEventReceipt:
                  return replace(record_advisory(*args, **kwargs), appended=False)

              monkeypatch.setattr(
                  learning_runtime,
                  "record_relationship_experience_advisory",
                  _report_unappended,
              )
              with pytest.raises(ValueError, match="governed QDKT event was not appended"):
                  finalize_bridge_learning(
                      bridge,
                      plan_phase_hash="phase-1",
                      task_id="A1",
                      contract=_final_contract(tmp_path, now),
                  )
              assert "A1" not in bridge._session["unified_learning_results"]


          '''
          if tests.count(marker) != 1:
              raise SystemExit("QDKT append test insertion point did not match exactly once")
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused verification tooling
        run: python -m pip install --disable-pip-version-check -q pytest ruff numpy

      - name: Format and lint exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          files=(
            aura_unified_memory_continuity_learning.py
            tests/test_aura_unified_memory_continuity_learning.py
          )
          ruff format "${files[@]}"
          ruff check --select E9,F63,F7,F82 "${files[@]}"
          python -m py_compile "${files[@]}"
          git diff --check

      - name: Run focused regression ring
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity_toolchain.py \
            tests/test_aura_agent_arena_bridge.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_qdkt_observations.py

      - name: Restore generated architecture artifacts
        shell: bash
        run: |
          git checkout -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            Aura_Memory/live_topology_ast.json \
            topology_map.json \
            2>/dev/null || true

      - name: Enforce exact two-file scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            aura_unified_memory_continuity_learning.py \
            tests/test_aura_unified_memory_continuity_learning.py | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Publish clean Greptile-fix commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuraOS Review Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add aura_unified_memory_continuity_learning.py tests/test_aura_unified_memory_continuity_learning.py
          git commit -m "fix: make governed finalization write-once"
          git push origin HEAD:feature/unified-memory-learning-to-reproof

      - name: Publish discoverable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="pr199-review-fixes" \
            -f description="Run ${GITHUB_RUN_ID}: ${{ job.status }}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
