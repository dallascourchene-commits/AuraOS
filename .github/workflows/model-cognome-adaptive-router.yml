name: Adaptive Router Final Artifact Builder

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-router-final-artifact-builder
  cancel-in-progress: true

jobs:
  build-final-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reviewed final tree
        run: |
          python tools/pr92_review_repair.py
          python tools/pr92_review_postprocess.py
          cp tools/model-cognome-adaptive-router.permanent.yml \
            .github/workflows/model-cognome-adaptive-router.yml
          rm -f \
            tools/pr92_review_repair.py \
            tools/pr92_review_postprocess.py \
            tools/model-cognome-adaptive-router.permanent.yml
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Validate reviewed code and tests
        run: |
          python -m py_compile \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py
          ruff check --select E9,F63,F7,F82 \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py \
            tests/test_aura_ai_router_dynamic.py tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py tests/test_aura_adaptive_security.py \
            tests/test_aura_adaptive_fusion_schema.py
          python aura_router.py route --help
          python aura_router.py fusion --help
          python -m pytest -q tests
      - name: Regenerate topology twice with current interfaces
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr92-first
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json
          cp .aura/CODEMAP.json /tmp/pr92-first/CODEMAP.json
          cp .aura/CODEMAP.md /tmp/pr92-first/CODEMAP.md
          cp topology_map.json /tmp/pr92-first/topology_map.json
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json
          cmp /tmp/pr92-first/CODEMAP.json .aura/CODEMAP.json
          cmp /tmp/pr92-first/CODEMAP.md .aura/CODEMAP.md
          cmp /tmp/pr92-first/topology_map.json topology_map.json
          python aura_phase_c2_codemap_verify.py --repo-root .
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
      - name: Ensure final tree is clean
        run: |
          git diff --check
          test ! -e tools/pr92_review_repair.py
          test ! -e tools/pr92_review_postprocess.py
          test ! -e tools/model-cognome-adaptive-router.permanent.yml
          test ! -e .aura/MODULE_MANIFEST.json
          test ! -e Aura_Memory/civic_arena.sqlite3
      - name: Upload tested final artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr92-final-reviewed-tree-${{ github.run_id }}
          retention-days: 3
          include-hidden-files: true
          path: |
            .github/workflows/model-cognome-adaptive-router.yml
            aura_ai_router.py
            aura_router_adaptive_compat.py
            aura_adaptive_model_router.py
            aura_adaptive_model_executor.py
            aura_adaptive_fusion.py
            aura_model_cognome_execution_auth.py
            aura_model_cognome_store_io.py
            tests/test_aura_ai_router_dynamic.py
            tests/test_aura_adaptive_security.py
            tests/test_aura_adaptive_fusion_schema.py
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
