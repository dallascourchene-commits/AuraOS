name: Model Cognome Adaptive Router

on:
  pull_request:
    paths:
      - "aura_ai_router.py"
      - "aura_router.py"
      - "aura_router_adaptive_compat.py"
      - "aura_adaptive_model_router.py"
      - "aura_adaptive_model_executor.py"
      - "aura_adaptive_fusion.py"
      - "aura_model_cognome_execution_auth.py"
      - "aura_model_cognome_store_io.py"
      - "tests/test_aura_ai_router_dynamic.py"
      - "tests/test_aura_adaptive_planner.py"
      - "tests/test_aura_adaptive_execution.py"
      - "tests/test_aura_adaptive_security.py"
      - ".github/workflows/model-cognome-adaptive-router.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-router:
    name: Adaptive router contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling and declared runtime dependency
        run: python -m pip install pytest ruff "numpy>=1.26.4,<3.0"
      - name: Compile adaptive compatibility surfaces
        run: |
          python -m py_compile \
            aura_ai_router.py \
            aura_router.py \
            aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py \
            aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py \
            aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py
      - name: Fatal lint checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            aura_ai_router.py \
            aura_router.py \
            aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py \
            aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py \
            aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py
      - name: Validate public CLI compatibility
        id: cli
        continue-on-error: true
        run: |
          set +e
          python aura_router.py route --help > cli-${{ matrix.python-version }}.log 2>&1
          route_code=$?
          python aura_router.py fusion --help >> cli-${{ matrix.python-version }}.log 2>&1
          fusion_code=$?
          echo "route_code=$route_code" >> "$GITHUB_OUTPUT"
          echo "fusion_code=$fusion_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload CLI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-cli-${{ matrix.python-version }}-${{ github.run_id }}
          path: cli-${{ matrix.python-version }}.log
      - name: Enforce CLI compatibility
        if: steps.cli.outputs.route_code != '0' || steps.cli.outputs.fusion_code != '0'
        run: |
          cat cli-${{ matrix.python-version }}.log
          exit 1
      - name: Run adaptive routing contracts
        run: |
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py
