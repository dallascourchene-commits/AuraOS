name: Adaptive Router Guarded Repair Once

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-router-guarded-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'marker missing in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_before(path, marker, block):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if block in text:
                  return
              if marker not in text:
                  raise RuntimeError(f'marker missing in {path}: {marker!r}')
              target.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')

          def replace_between(path, start, end, replacement):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              left = text.find(start)
              right = text.find(end, left + len(start))
              if left < 0 or right < 0:
                  raise RuntimeError(f'block markers missing in {path}')
              target.write_text(text[:left] + replacement + text[right:], encoding='utf-8')

          def append_once(path, marker, block):
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if marker in text:
                  return
              target.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

