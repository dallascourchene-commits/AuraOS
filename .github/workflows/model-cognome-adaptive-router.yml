name: Adaptive Router Reviewed Repair Builder

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-router-reviewed-repair-builder
  cancel-in-progress: true

jobs:
  build-reviewed-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed repair in isolated checkout
        run: |
          python tools/pr92_review_repair.py
          python tools/pr92_review_postprocess.py
          cp tools/model-cognome-adaptive-router.permanent.yml \
            .github/workflows/model-cognome-adaptive-router.yml
      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Compile and lint reviewed surfaces
        run: |
          python -m py_compile \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py
          ruff check --select E9,F63,F7,F82 \
            aura_ai_router.py aura_router.py aura_router_adaptive_compat.py \
            aura_adaptive_model_router.py aura_adaptive_model_executor.py \
            aura_adaptive_fusion.py aura_model_cognome_execution_auth.py \
            aura_model_cognome_store_io.py \
            tests/test_aura_ai_router_dynamic.py tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py tests/test_aura_adaptive_security.py \
            tests/test_aura_adaptive_fusion_schema.py
      - name: Validate public CLI
        run: |
          python aura_router.py route --help
          python aura_router.py fusion --help
      - name: Run adaptive contracts
        run: |
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py \
            tests/test_aura_adaptive_fusion_schema.py
      - name: Run complete pytest-native suite with retained diagnostics
        id: full_pytest
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q tests \
            --junitxml=/tmp/pr92-full-pytest.xml \
            > /tmp/pr92-full-pytest.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload full-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr92-full-pytest-${{ github.run_id }}
          retention-days: 3
          path: |
            /tmp/pr92-full-pytest.log
            /tmp/pr92-full-pytest.xml
      - name: Enforce complete pytest-native suite
        if: steps.full_pytest.outputs.exit_code != '0'
        run: |
          cat /tmp/pr92-full-pytest.log
          exit 1
      - name: Regenerate and verify stable topology
        run: |
          set -euo pipefail
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --deep \
            --out .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md
          cp .aura/CODEMAP.json /tmp/CODEMAP.first.json
          cp .aura/CODEMAP.md /tmp/CODEMAP.first.md
          cp topology_map.json /tmp/topology.first.json
          python aura_codebase_navigator.py \
            --deep \
            --out .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md
          python aura_phase_c2_codemap_verify.py \
            --committed-json /tmp/CODEMAP.first.json \
            --generated-json .aura/CODEMAP.json \
            --committed-markdown /tmp/CODEMAP.first.md \
            --generated-markdown .aura/CODEMAP.md
          cmp /tmp/topology.first.json topology_map.json
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
      - name: Ensure reviewed artifact is clean
        run: |
          git diff --check
          test ! -e .aura/MODULE_MANIFEST.json
          test ! -e Aura_Memory/civic_arena.sqlite3
      - name: Upload tested reviewed repair
        uses: actions/upload-artifact@v4
        with:
          name: pr92-reviewed-repair-${{ github.run_id }}
          retention-days: 3
          path: |
            .github/workflows/model-cognome-adaptive-router.yml
            aura_ai_router.py
            aura_router_adaptive_compat.py
            aura_adaptive_model_router.py
            aura_adaptive_model_executor.py
            aura_adaptive_fusion.py
            aura_model_cognome_execution_auth.py
            aura_model_cognome_store_io.py
            tests/test_aura_ai_router_dynamic.py
            tests/test_aura_adaptive_security.py
            tests/test_aura_adaptive_fusion_schema.py
            .aura/CODEMAP.json
            .aura/CODEMAP.md
            topology_map.json
