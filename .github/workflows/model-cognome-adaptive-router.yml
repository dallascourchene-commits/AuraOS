name: Diagnose PR92 Final Tree

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-final-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact reviewed transformation
        run: |
          set -euo pipefail
          python tools/pr92_review_repair.py
          python tools/pr92_review_postprocess.py
          python -c "import tools.pr92_closeout as c; c.fix_dynamic_import()"
          python tools/pr92_mesh_closeout.py
          python -c "import tools.pr92_closeout as c; c.update_readme()"
          python -c "import tools.pr92_closeout as c; c.update_architecture()"
          python -c "import tools.pr92_closeout as c; c.update_user_guide()"
          python tools/pr92_trim_trailing_ws.py
          cp tools/model-cognome-adaptive-router.permanent.yml \
            .github/workflows/model-cognome-adaptive-router.yml
          rm -f \
            tools/pr92_review_repair.py \
            tools/pr92_review_postprocess.py \
            tools/pr92_closeout.py \
            tools/pr92_mesh_closeout.py \
            tools/pr92_trim_trailing_ws.py \
            tools/model-cognome-adaptive-router.permanent.yml
      - name: Install topology dependencies
        run: |
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Generate exact final topology and metrics
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json
          python - <<'PY'
          import json
          from pathlib import Path
          token = "__AURA_CODEMAP_METRICS__"
          summary = json.loads(Path(".aura/CODEMAP.json").read_text(encoding="utf-8"))["summary"]
          metric = (
              f"{summary['file_count']:,} indexed files · "
              f"{summary['topology_nodes']:,} topology nodes · "
              f"{summary['topology_edges']:,} topology edges"
          )
          for name in ("README.md", ".aura/ARCHITECTURE.md", "USER_GUIDE.md"):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").replace(token, metric), encoding="utf-8")
          PY
      - name: Capture whitespace and status diagnostics
        run: |
          git diff --check > pr92-diff-check.txt 2>&1 || true
          git status --short > pr92-status.txt
          cat pr92-diff-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr92-final-tree-diagnostics
          path: |
            pr92-diff-check.txt
            pr92-status.txt
          if-no-files-found: error
