name: Adaptive Router Current Topology Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-current-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reviewed final tree
        run: |
          python tools/pr92_review_repair.py
          python tools/pr92_review_postprocess.py
          cp tools/model-cognome-adaptive-router.permanent.yml \
            .github/workflows/model-cognome-adaptive-router.yml
          rm -f \
            tools/pr92_review_repair.py \
            tools/pr92_review_postprocess.py \
            tools/model-cognome-adaptive-router.permanent.yml
      - name: Install dependencies
        run: |
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Reconfirm focused contracts
        run: |
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py \
            tests/test_aura_adaptive_fusion_schema.py
      - name: Capture current topology diagnostics
        id: topology
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/pr92-current-topology/first /tmp/pr92-current-topology/second
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json \
            > /tmp/pr92-current-topology/first/generate.log 2>&1
          first_code=$?
          cp .aura/CODEMAP.json /tmp/pr92-current-topology/first/CODEMAP.json
          cp .aura/CODEMAP.md /tmp/pr92-current-topology/first/CODEMAP.md
          cp topology_map.json /tmp/pr92-current-topology/first/topology_map.json
          python aura_phase_c2_codemap_verify.py --repo-root . \
            > /tmp/pr92-current-topology/first/verify.log 2>&1
          first_verify=$?
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json \
            > /tmp/pr92-current-topology/second/generate.log 2>&1
          second_code=$?
          cp .aura/CODEMAP.json /tmp/pr92-current-topology/second/CODEMAP.json
          cp .aura/CODEMAP.md /tmp/pr92-current-topology/second/CODEMAP.md
          cp topology_map.json /tmp/pr92-current-topology/second/topology_map.json
          python aura_phase_c2_codemap_verify.py --repo-root . \
            > /tmp/pr92-current-topology/second/verify.log 2>&1
          second_verify=$?
          cmp /tmp/pr92-current-topology/first/CODEMAP.json \
              /tmp/pr92-current-topology/second/CODEMAP.json \
              > /tmp/pr92-current-topology/codemap-json-cmp.log 2>&1
          json_cmp=$?
          cmp /tmp/pr92-current-topology/first/CODEMAP.md \
              /tmp/pr92-current-topology/second/CODEMAP.md \
              > /tmp/pr92-current-topology/codemap-md-cmp.log 2>&1
          md_cmp=$?
          cmp /tmp/pr92-current-topology/first/topology_map.json \
              /tmp/pr92-current-topology/second/topology_map.json \
              > /tmp/pr92-current-topology/topology-cmp.log 2>&1
          topology_cmp=$?
          python - <<'PY' > /tmp/pr92-current-topology/digests.txt
          from hashlib import sha256
          from pathlib import Path
          for path in sorted(Path('/tmp/pr92-current-topology').rglob('*')):
              if path.is_file():
                  print(sha256(path.read_bytes()).hexdigest(), path)
          PY
          printf 'first_code=%s\nfirst_verify=%s\nsecond_code=%s\nsecond_verify=%s\njson_cmp=%s\nmd_cmp=%s\ntopology_cmp=%s\n' \
            "$first_code" "$first_verify" "$second_code" "$second_verify" \
            "$json_cmp" "$md_cmp" "$topology_cmp" \
            > /tmp/pr92-current-topology/status.txt
          exit 0
      - name: Upload current topology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr92-current-topology-${{ github.run_id }}
          retention-days: 3
          path: /tmp/pr92-current-topology
