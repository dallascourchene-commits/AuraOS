name: Adaptive Router Semantic Topology Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-semantic-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/model-cognome-live-compat
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean reviewed tree
        run: |
          python tools/pr92_review_repair.py
          python tools/pr92_review_postprocess.py
          cp tools/model-cognome-adaptive-router.permanent.yml \
            .github/workflows/model-cognome-adaptive-router.yml
          rm -f \
            tools/pr92_review_repair.py \
            tools/pr92_review_postprocess.py \
            tools/model-cognome-adaptive-router.permanent.yml
      - name: Install dependencies
        run: |
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0" \
            pytest pytest-asyncio ruff
      - name: Reconfirm focused contracts
        run: |
          python -m pytest -q \
            tests/test_aura_ai_router_dynamic.py \
            tests/test_aura_adaptive_planner.py \
            tests/test_aura_adaptive_execution.py \
            tests/test_aura_adaptive_security.py \
            tests/test_aura_adaptive_fusion_schema.py
      - name: Generate clean snapshots and structural diff
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr92-semantic/first /tmp/pr92-semantic/second
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json \
            > /tmp/pr92-semantic/first/generate.log 2>&1
          python aura_phase_c2_codemap_verify.py --repo-root . \
            > /tmp/pr92-semantic/first/verify.log 2>&1
          cp .aura/CODEMAP.json /tmp/pr92-semantic/first/CODEMAP.json
          cp .aura/CODEMAP.md /tmp/pr92-semantic/first/CODEMAP.md
          cp topology_map.json /tmp/pr92-semantic/first/topology_map.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .aura/MODULE_MANIFEST.json Aura_Memory/civic_arena.sqlite3
          python aura_codebase_navigator.py \
            --index .aura/CODEMAP.json \
            --markdown .aura/CODEMAP.md \
            --topology-json topology_map.json \
            > /tmp/pr92-semantic/second/generate.log 2>&1
          python aura_phase_c2_codemap_verify.py --repo-root . \
            > /tmp/pr92-semantic/second/verify.log 2>&1
          cp .aura/CODEMAP.json /tmp/pr92-semantic/second/CODEMAP.json
          cp .aura/CODEMAP.md /tmp/pr92-semantic/second/CODEMAP.md
          cp topology_map.json /tmp/pr92-semantic/second/topology_map.json
          python - <<'PY' > /tmp/pr92-semantic/structural-diff.txt
          import json
          from pathlib import Path

          a = json.loads(Path('/tmp/pr92-semantic/first/CODEMAP.json').read_text())
          b = json.loads(Path('/tmp/pr92-semantic/second/CODEMAP.json').read_text())

          def walk(x, y, path=''):
              if type(x) is not type(y):
                  print(path, 'TYPE', type(x).__name__, type(y).__name__)
                  return
              if isinstance(x, dict):
                  for key in sorted(set(x) | set(y)):
                      if key not in x or key not in y:
                          print(f'{path}/{key}', 'MISSING')
                      elif x[key] != y[key]:
                          walk(x[key], y[key], f'{path}/{key}')
              elif isinstance(x, list):
                  if len(x) != len(y):
                      print(path, 'LEN', len(x), len(y))
                  else:
                      for index, (left, right) in enumerate(zip(x, y)):
                          if left != right:
                              walk(left, right, f'{path}[{index}]')
              else:
                  print(path, repr(x), repr(y))

          walk(a, b)
          PY
          python - <<'PY' > /tmp/pr92-semantic/markdown-diff.txt
          import difflib
          from pathlib import Path
          a = Path('/tmp/pr92-semantic/first/CODEMAP.md').read_text().splitlines()
          b = Path('/tmp/pr92-semantic/second/CODEMAP.md').read_text().splitlines()
          print('\n'.join(difflib.unified_diff(a, b, fromfile='first', tofile='second', n=2)))
          PY
          cmp /tmp/pr92-semantic/first/topology_map.json \
              /tmp/pr92-semantic/second/topology_map.json \
              > /tmp/pr92-semantic/topology-cmp.txt 2>&1 || true
      - name: Upload semantic topology diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr92-semantic-topology-${{ github.run_id }}
          retention-days: 3
          path: /tmp/pr92-semantic
