name: Phase B Fix Stale ICM Test

on:
  push:
    branches:
      - feature/arena-crucible-phase-b

permissions:
  contents: write

concurrency:
  group: phase-b-fix-stale-icm-test
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arena-crucible-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            pytest pytest-asyncio
      - name: Remove workflow and repair stale constructor fixture
        run: |
          rm .github/workflows/phase-b-fix-stale-icm-test.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('test_aura_icm_workspace.py')
          text = path.read_text(encoding='utf-8')
          old_head = '''    arena = LiquidPlanningArena(
              arena_id="ARENA-ICM-1",
              domain="code",
              intent="patch demo.py",
              adapter={"domain": "code"},
          '''
          new_head = '''    arena = LiquidPlanningArena(
              arena_version="AURA_LIQUID_PLANNING_ARENA_V1",
              arena_id="ARENA-ICM-1",
              domain="code",
              intent="patch demo.py",
              plan_ref="PLAN-ICM-1",
              domain_objects=["demo.py"],
              adapter={"domain": "code"},
          '''
          old_tail = '''        agent_leases=[{"lease_id": "L-1"}],
              phase_hash="ph1",
          '''
          new_tail = '''        agent_leases=[{"lease_id": "L-1"}],
              shared_action_queue=[],
              phase_hash="ph1",
          '''
          if old_head not in text:
              raise SystemExit('expected LiquidPlanningArena constructor head not found')
          if old_tail not in text:
              raise SystemExit('expected LiquidPlanningArena constructor tail not found')
          text = text.replace(old_head, new_head, 1).replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify repaired test
        run: |
          python -m pytest -q \
            test_aura_icm_workspace.py::test_arena_export_to_icm_creates_workspace
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test_aura_icm_workspace.py
          git add -u .github/workflows/phase-b-fix-stale-icm-test.yml
          git commit -m "test(icm): align LiquidPlanningArena fixture with current schema"
          git push origin HEAD:feature/arena-crucible-phase-b
