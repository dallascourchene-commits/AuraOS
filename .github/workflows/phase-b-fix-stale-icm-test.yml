name: Phase B Repair Stale Validators

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: phase-b-repair-stale-validators
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'feature/arena-crucible-phase-b'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arena-crucible-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            pytest pytest-asyncio
      - name: Remove workflow and repair stale fixtures
        run: |
          rm .github/workflows/phase-b-fix-stale-icm-test.yml
          python - <<'PY'
          from pathlib import Path
          import json

          icm_path = Path('test_aura_icm_workspace.py')
          icm = icm_path.read_text(encoding='utf-8')
          old_head = '''    arena = LiquidPlanningArena(
              arena_id="ARENA-ICM-1",
              domain="code",
              intent="patch demo.py",
              adapter={"domain": "code"},
          '''
          new_head = '''    arena = LiquidPlanningArena(
              arena_version="AURA_LIQUID_PLANNING_ARENA_V1",
              arena_id="ARENA-ICM-1",
              domain="code",
              intent="patch demo.py",
              plan_ref="PLAN-ICM-1",
              domain_objects=["demo.py"],
              adapter={"domain": "code"},
          '''
          old_tail = '''        agent_leases=[{"lease_id": "L-1"}],
              phase_hash="ph1",
          '''
          new_tail = '''        agent_leases=[{"lease_id": "L-1"}],
              shared_action_queue=[],
              phase_hash="ph1",
          '''
          if old_head not in icm or old_tail not in icm:
              raise SystemExit('expected stale LiquidPlanningArena fixture was not found')
          icm = icm.replace(old_head, new_head, 1).replace(old_tail, new_tail, 1)
          icm_path.write_text(icm, encoding='utf-8')

          substrate_path = Path('test_aura_substrate.py')
          substrate = substrate_path.read_text(encoding='utf-8')
          old_plan = '''    original = ContextSelector().read("aura_mesh.py")
              good = ('{"edits": [{"file": "aura_mesh.py", "start_line": 174, "end_line": 174, '
                      '"replacement": "            secure_packet = '
                      'self.pack_secure_polysynthetic_packet([0, 0, 0, 0, 0, 0], 1.0)"}]}')
          '''
          new_plan = '''    original = ContextSelector().read("aura_mesh.py")
              original_lines = original.splitlines()
              target_line = next(
                  index
                  for index, line in enumerate(original_lines, start=1)
                  if "secure_packet = self.pack_secure_polysynthetic_packet" in line
              )
              target_source = original_lines[target_line - 1]
              indentation = target_source[: len(target_source) - len(target_source.lstrip())]
              replacement = (
                  f"{indentation}secure_packet = "
                  "self.pack_secure_polysynthetic_packet([0, 0, 0, 0, 0, 0], 1.0)"
              )
              good = json.dumps({
                  "edits": [{
                      "file": "aura_mesh.py",
                      "start_line": target_line,
                      "end_line": target_line,
                      "replacement": replacement,
                  }]
              })
          '''
          if old_plan not in substrate:
              raise SystemExit('expected stale substrate edit-plan fixture was not found')
          substrate_path.write_text(substrate.replace(old_plan, new_plan, 1), encoding='utf-8')
          PY
      - name: Record exact PVM architecture violations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from pvm_arch_checker import PVMArchChecker

          violations = PVMArchChecker(root=Path('.')).run()
          hard_rules = {"SYNTAX_ERROR", "WILDCARD_IMPORT", "CIRCULAR_IMPORT", "NAMESPACE_INJECTION"}
          hard = [v._asdict() for v in violations if v.rule in hard_rules]
          Path('PHASE_B_PVM_ARCH_DIAGNOSTIC.json').write_text(
              json.dumps({"hard_violations": hard, "hard_count": len(hard)}, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          PY
      - name: Verify repaired tests
        run: |
          python -m pytest -q \
            test_aura_icm_workspace.py::test_arena_export_to_icm_creates_workspace
          python test_aura_substrate.py
      - name: Commit repairs, diagnostic, and workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            test_aura_icm_workspace.py \
            test_aura_substrate.py \
            PHASE_B_PVM_ARCH_DIAGNOSTIC.json
          git add -u .github/workflows/phase-b-fix-stale-icm-test.yml
          git commit -m "test(ci): repair stale validators and record PVM violations"
          git push origin HEAD:feature/arena-crucible-phase-b
