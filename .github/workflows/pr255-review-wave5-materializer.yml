name: PR255 review wave5 materializer

on:
  push:
    branches:
      - repair/pr255-review-wave5

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: repair/pr255-review-wave5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused verification tools
        run: python -m pip install --disable-pip-version-check pytest jsonschema ruff

      - name: Apply exact review repair
        run: python .aura/pr255_wave5_patch.py

      - name: Compile and run complete focused suite
        run: |
          python -m py_compile aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          PYTHONPATH=. pytest -q tests/test_aura_ephemeral_workspace_contracts.py | tee /tmp/pr255-wave5-pytest.txt
          grep -Eq '18 passed' /tmp/pr255-wave5-pytest.txt

      - name: Run lint and schema gates
        run: |
          ruff check --select F401,F821 aura_ephemeral_workspace_contracts.py tests/test_aura_ephemeral_workspace_contracts.py
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in (
              Path('schemas/aura_ephemeral_workspace_recipe.schema.json'),
              Path('schemas/aura_multimodal_spatial_observation.schema.json'),
              Path('schemas/aura_project_context_projection.schema.json'),
          ):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding='utf-8')))
              print(f'schema_ok={path}')
          PY

      - name: Restore generated navigation and remove transport
        run: |
          git checkout 879b5fb056b70d150b1646e082223330a36c2912 -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json
          rm -f .aura/pr255_wave5_patch.py
          rm -f .github/workflows/pr255-review-wave5-materializer.yml

      - name: Audit exact two-file repair and eight-file PR scope
        run: |
          python - <<'PY'
          import subprocess
          expected_wave = {
              'aura_ephemeral_workspace_contracts.py',
              'tests/test_aura_ephemeral_workspace_contracts.py',
          }
          expected_pr = {
              '.aura/refactor_objectives/intent_native_spatial_workspace_pr1.v1.json',
              '.aura/waboose_requests/intent_native_spatial_workspace_pr1.v1.json',
              'aura_ephemeral_workspace_contracts.py',
              'docs/AURA_INTENT_NATIVE_SPATIAL_WORKSPACE_PR1.md',
              'schemas/aura_ephemeral_workspace_recipe.schema.json',
              'schemas/aura_multimodal_spatial_observation.schema.json',
              'schemas/aura_project_context_projection.schema.json',
              'tests/test_aura_ephemeral_workspace_contracts.py',
          }
          def names(base):
              out = subprocess.check_output(['git', 'diff', '--name-only', base], text=True)
              return {line for line in out.splitlines() if line}
          wave = names('1e270d09bce165f56564c8cff83d1d8d7e5e9ea7')
          if wave != expected_wave:
              raise SystemExit(f'wave scope mismatch: {sorted(wave)}')
          full = names('879b5fb056b70d150b1646e082223330a36c2912')
          if full != expected_pr:
              raise SystemExit(f'PR scope mismatch: {sorted(full)}')
          print('wave_scope_ok=true')
          print('pr_scope_ok=true')
          PY
          git diff --exit-code 879b5fb056b70d150b1646e082223330a36c2912 -- \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json \
            Aura_Memory/live_topology_ast.json

      - name: Publish one clean commit
        run: |
          git config user.name 'dallascourchene-commits'
          git config user.email '281686929+dallascourchene-commits@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(pr1): close final CodeRabbit quality findings'
          git push --force origin HEAD:repair/pr255-review-wave5
