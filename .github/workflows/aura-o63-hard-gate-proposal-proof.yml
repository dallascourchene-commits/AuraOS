name: Aura O63 Hard Gate Proposal Capsule Proof

on:
  pull_request:
    paths:
      - "tools/aura_hard_gate_transition_admission.py"
      - "tools/aura_bounded_proposal_capsule.py"
      - "tests/test_aura_hard_gate_transition_admission.py"
      - "tests/test_aura_bounded_proposal_capsule.py"
      - ".github/workflows/aura-o63-hard-gate-proposal-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SEMANTIC_HEAD: 1cdad597015615d1c34d236b271516196ac101cd
  Q15_CUT_EPOCH: "1788188632"

jobs:
  o63-hard-gate-proposal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current proof generation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate post-Q15 semantic generation and immutable semantic blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SEMANTIC_HEAD" HEAD
          semantic_epoch="$(git show -s --format='%at' "$SEMANTIC_HEAD")"
          test "$semantic_epoch" -gt "$Q15_CUT_EPOCH"
          test "$(git rev-parse "$SEMANTIC_HEAD:tools/aura_hard_gate_transition_admission.py")" = "18ada65d0aca81ba915c4dc57c98414f38c3b068"
          test "$(git rev-parse "$SEMANTIC_HEAD:tools/aura_bounded_proposal_capsule.py")" = "11ac9fd37aede4902b3c1029eddcbad96a828f45"
          test "$(git rev-parse "$SEMANTIC_HEAD:tests/test_aura_hard_gate_transition_admission.py")" = "9e878769b1fae198035135a8ada3d8c6db3a787d"
          test "$(git rev-parse "$SEMANTIC_HEAD:tests/test_aura_bounded_proposal_capsule.py")" = "fb349a904ddb7f99d9e215a3f9d4210881a7a397"
          echo O63_POST_Q15_SEMANTIC_GENERATION=true

      - name: Compile exact semantic surface
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/aura_hard_gate_transition_admission.py \
            tools/aura_bounded_proposal_capsule.py \
            tests/test_aura_hard_gate_transition_admission.py \
            tests/test_aura_bounded_proposal_capsule.py

      - name: Run focused adversarial suites
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_aura_hard_gate_transition_admission \
            tests.test_aura_bounded_proposal_capsule -v

      - name: Independently prove owner-resolved transition-to-proposal nonpromotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from tools.aura_hard_gate_transition_admission import (
              EvidenceDescriptorRef, GateEvidenceState, ProductState,
              TransitionRequest, evaluate_hard_gate_transition,
          )
          from tools.aura_bounded_proposal_capsule import (
              BASIS_SCHEMA, EligibilityReceiptRef, ProposalBasis,
              RequestOwnerState, ScientificEvidenceState, SourceAdmissionState,
              create_bounded_proposal_capsule, revalidate_proposal_capsule,
          )

          A='a'*64; B='b'*64; C='c'*64; D='d'*64; E='e'*64; F='f'*64; G='1'*64; H='2'*64; I='3'*64
          def gate(gid, passed, gen, receipt, scope):
              return GateEvidenceState(
                  gate_id=gid, owner_ref='owner:'+gid+':v1', gate_scope_digest=scope,
                  evidence_generation=gen, receipt_digest=receipt,
                  verification_state='EXACT_GREEN' if passed else 'HOLD',
                  blocker=None if passed else gid.upper()+'_BLOCKED', passed=passed,
              )
          ev=EvidenceDescriptorRef(descriptor_digest=C,evidence_generation='evidence-gen-4')
          req=TransitionRequest(
              schema_version='AURA-HARD-GATE-TRANSITION-v1',
              transition_id='transition:source:hosted-proof',
              domain_id='generic.bounded.c2', target_gate_id='source',
              before=ProductState((gate('source',False,'source-gen-1','1'*64,I),gate('authority',True,'authority-gen-1','2'*64,B))),
              after=ProductState((gate('source',True,'source-gen-2','3'*64,I),gate('authority',True,'authority-gen-1','2'*64,B))),
              evidence_before=ev, evidence_after=ev,
              source_currentness_root='source-current:4',
          )
          transition=evaluate_hard_gate_transition(req)
          assert transition.disposition == 'ELIGIBLE_BOUNDED_PROPOSAL'
          assert transition.proposal_eligible is True
          assert transition.execution_authorized is False
          assert transition.provider_effect_authorized is False
          assert transition.gate10_promoted is False

          eligibility=EligibilityReceiptRef(
              owner_ref='owner:hard-gate-transition:v1',
              transition_id=req.transition_id,
              domain_id=req.domain_id,
              gate_scope_digest=req.after.by_id()[req.target_gate_id].gate_scope_digest,
              source_currentness_root=req.source_currentness_root,
              disposition='ELIGIBLE_BOUNDED_PROPOSAL',
              receipt_digest=transition.transition_receipt_digest,
              receipt_generation=req.after.by_id()[req.target_gate_id].evidence_generation,
              policy_generation_ref='eligibility-policy-gen-2',
              proposal_eligible=True, execution_authorized=False,
              provider_effect_authorized=False,
          )
          basis=ProposalBasis(
              schema_version=BASIS_SCHEMA, domain_id='generic.bounded.c2',
              action_kind='BOUNDED_C2_PROPOSAL', action_parameters_digest=B,
              scientific_scope_digest=C, scientific_evidence_generation='science-gen-8',
              scientific_evidence_receipt_digest=D, source_scope_digest=E,
              source_admission_generation='source-gen-4', source_admission_receipt_digest=F,
              request_id='request:c2:hosted-proof', request_digest=G,
              resource_envelope_digest=H, eligibility=eligibility,
              currentness_roots=('science-current:8','source-current:4','router-current:2'),
              invalidators=('science-generation-change','source-generation-change','request-envelope-change'),
              authority_scope='D0_NONPROMOTING',
          )

          class HostedOwnerResolver:
              def resolve_eligibility(self, *, owner_ref, transition_id):
                  if owner_ref == eligibility.owner_ref and transition_id == eligibility.transition_id:
                      return eligibility
                  return None
              def resolve_scientific_evidence(self, *, scope_digest):
                  if scope_digest != basis.scientific_scope_digest: return None
                  return ScientificEvidenceState(scope_digest, basis.scientific_evidence_generation, basis.scientific_evidence_receipt_digest)
              def resolve_source_admission(self, *, scope_digest):
                  if scope_digest != basis.source_scope_digest: return None
                  return SourceAdmissionState(scope_digest, basis.source_admission_generation, basis.source_admission_receipt_digest)
              def resolve_request(self, *, request_id):
                  if request_id != basis.request_id: return None
                  return RequestOwnerState(request_id, basis.request_digest, basis.action_parameters_digest, basis.resource_envelope_digest)
              def currentness_root_is_current(self, *, root):
                  return True if root in basis.currentness_roots else None
              def invalidator_is_triggered(self, *, invalidator):
                  return False if invalidator in basis.invalidators else None

          resolver=HostedOwnerResolver()
          p1=create_bounded_proposal_capsule(basis=basis, producer_identity='hosted-worker-a', owner_resolver=resolver)
          p2=create_bounded_proposal_capsule(basis=basis, producer_identity='hosted-worker-b', owner_resolver=resolver)
          assert p1.capsule.proposal_id == p2.capsule.proposal_id
          assert p1.generation_receipt_digest != p2.generation_receipt_digest
          exact=revalidate_proposal_capsule(capsule=p1.capsule,owner_resolver=resolver)
          assert exact.state == 'CURRENT_NONEXECUTABLE'
          assert exact.execution_authorized is False
          absent=revalidate_proposal_capsule(capsule=p1.capsule,owner_resolver=None)
          assert absent.state == 'INVALIDATED'

          forged=EligibilityReceiptRef(
              **{**eligibility.__dict__, 'receipt_digest':'9'*64}
          )
          forged_basis=ProposalBasis(**{**basis.__dict__, 'eligibility': forged})
          try:
              create_bounded_proposal_capsule(
                  basis=forged_basis, producer_identity='attacker', owner_resolver=resolver
              )
          except ValueError as exc:
              assert 'ELIGIBILITY_OWNER_RECEIPT_MISMATCH' in str(exc)
          else:
              raise AssertionError('caller-minted eligibility was admitted')

          receipt={
              'schema':'AURA-O63-HOSTED-PROOF-v2',
              'semantic_head':'1cdad597015615d1c34d236b271516196ac101cd',
              'post_q15_semantic_generation':True,
              'eligibility_owner_resolved':True,
              'caller_minted_eligibility_rejected':True,
              'raw_current_basis_api_absent':True,
              'currentness_operands_owner_resolved':True,
              'unavailable_currentness_invalidates':True,
              'gate_transition_disposition':transition.disposition,
              'proposal_id':p1.capsule.proposal_id,
              'same_basis_collapses_across_producers':True,
              'generation_receipts_remain_producer_distinct':True,
              'exact_revalidation_state':exact.state,
              'execution_authorized':False,
              'provider_effect_authorized':False,
              'semantic_k27_authority':False,
              'native_private_transformer_kv_accessed':False,
              'gate10_promoted':False,
              'merge_deploy_spend_public_human_effect':False,
              'laws':[
                  'CallerAssertion!=OwnerResolvedEligibility',
                  'StaleBasisReplay!=Currentness',
                  'UnknownOwnerState=>Invalidated',
                  'ProposalEligibility!=ProposalIdentity!=ExecutionAuthority',
                  'K27Coordinate!=ProposalAuthority',
              ],
          }
          with open('/tmp/o63.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,sort_keys=True,indent=2); f.write('\n')
          print('O63_OWNER_RESOLVED_PROPOSAL_PROVEN=true')
          PY

      - name: Preserve O63 proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: o63-hard-gate-proposal-proof
          path: /tmp/o63.json
          retention-days: 90

      - name: Consequence ceiling
        run: |
          echo 'CallerAssertion!=OwnerResolvedEligibility'
          echo 'StaleBasisReplay!=Currentness'
          echo 'ProposalEligibility!=ProposalIdentity!=ExecutionAuthority'
          echo 'K27Coordinate!=ProposalAuthority'
          echo 'O63_COMPLETE=true'
