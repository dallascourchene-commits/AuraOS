name: Phase B CODEMAP Diagnostic Detail

on:
  push:
    branches:
      - feature/arena-crucible-phase-b

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arena-crucible-phase-b
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.26.4,<3.0" \
            "websockets>=12.0,<17.0" \
            "aiosqlite>=0.20.0,<1.0" \
            "ddgs>=6.0,<10.0" \
            "wasmtime>=20.0,<46.0" \
            "aiohttp>=3.9.0,<4.0" \
            "beautifulsoup4>=4.12.0,<5.0" \
            "httpx>=0.27.0,<1.0" \
            "cryptography>=41.0.0,<45.0"
      - name: Extract first canonical mismatch
        run: |
          cp .aura/CODEMAP.json /tmp/CODEMAP.committed.json
          rm .github/workflows/phase-b-codemap-diagnostic-detail.yml
          rm -f PHASE_B_CODEMAP_DIAGNOSTIC.json
          python aura_codebase_navigator.py
          python - <<'PY'
          import json
          from pathlib import Path
          from aura_codemap_verify import stable_codemap_projection
          committed = json.loads(Path('/tmp/CODEMAP.committed.json').read_text())
          regenerated = json.loads(Path('.aura/CODEMAP.json').read_text())
          left = stable_codemap_projection(committed)['source_cards']
          right = stable_codemap_projection(regenerated)['source_cards']
          first = next((i for i, pair in enumerate(zip(left, right)) if pair[0] != pair[1]), None)
          result = {
              'left_count': len(left),
              'right_count': len(right),
              'first_difference': first,
              'left_card': left[first] if first is not None else None,
              'right_card': right[first] if first is not None else None,
          }
          Path('PHASE_B_CODEMAP_DIAGNOSTIC.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Commit detail and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .aura/CODEMAP.json .aura/CODEMAP.md
          git add PHASE_B_CODEMAP_DIAGNOSTIC.json
          git add -u .github/workflows/phase-b-codemap-diagnostic-detail.yml
          git commit -m "chore(codemap): identify canonical source mismatch"
          git push origin HEAD:feature/arena-crucible-phase-b
