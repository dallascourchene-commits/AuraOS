name: K27 ASTGE current symbol anchor

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge/**"
      - "crates/aura-k27-astge-ingest/**"
      - "crates/aura-k27-astge-symbols/**"
      - "tools/k27_astge_python_module_symbol_oracle.py"
      - ".github/workflows/k27-astge-current-symbol-anchor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k27-astge-symbol-anchor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-symbol-anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Verify toolchains
        run: |
          rustc --version
          cargo --version
          python3 --version

      - name: Format symbol convergence
        run: cargo fmt --manifest-path crates/aura-k27-astge-symbols/Cargo.toml -- --check

      - name: Execute symbol unit and current-generation anchor contract
        run: cargo test --manifest-path crates/aura-k27-astge-symbols/Cargo.toml --all-targets --verbose

      - name: Reconfirm independent CPython symbol oracle
        run: |
          cargo run --quiet --manifest-path crates/aura-k27-astge-symbols/Cargo.toml --example symbol_fixture > /tmp/tree_sitter_symbols.txt
          python3 tools/k27_astge_python_module_symbol_oracle.py > /tmp/cpython_symbols.txt
          diff -u /tmp/cpython_symbols.txt /tmp/tree_sitter_symbols.txt

      - name: Clippy current semantic/storage stack fail closed
        run: |
          cargo clippy --manifest-path crates/aura-k27-astge-symbols/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge-ingest/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/aura-k27-astge/Cargo.toml --all-targets -- -D warnings

      - name: Emit claim ceiling
        run: |
          echo "CURRENT_GENERATION_SYMBOL_ANCHORS_PROVEN=true"
          echo "TREE_SITTER_CPYTHON_SYMBOL_CONFORMANCE_RECHECKED=true"
          echo "DUPLICATE_NAMES_REMAIN_UNRESOLVED=true"
          echo "SYMBOL_SEMANTIC_HANDLES_PRESERVED=true"
          echo "SYMBOL_AST_CONE_ANCHORS_PROVEN=true"
          echo "RUNTIME_NAME_RESOLUTION_PROVEN=false"
          echo "IMPORT_GRAPH_PROVEN=false"
          echo "CALL_GRAPH_PROVEN=false"
          echo "MMAP_EXECUTED=false"
          echo "AURAOS_RUNTIME_INTEGRATION_PROVEN=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
