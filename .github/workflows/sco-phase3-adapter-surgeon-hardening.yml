name: SCO Phase 3 Adapter Native Surgeon Hardening

on:
  push:
    branches:
      - refactor/sco-construction-e7-e8

permissions:
  contents: write

concurrency:
  group: sco-phase3-adapter-surgeon-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/sco-construction-e7-e8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
      - name: Apply bounded E7 Surgeon repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          adapter = Path('aura_construction_adapter.py')

          replace_once(
              adapter,
              '''def _enum_value(value: Any, enum_type: type[Enum], name: str) -> str:
              raw = value.value if isinstance(value, enum_type) else value
              if type(raw) is not str or raw not in {item.value for item in enum_type}:
                  raise ValueError(f"unknown {name}: {raw}")
              return raw


          ''',
              '''def _enum_value(value: Any, enum_type: type[Enum], name: str) -> str:
              raw = value.value if isinstance(value, enum_type) else value
              if type(raw) is not str or raw not in {item.value for item in enum_type}:
                  raise ValueError(f"unknown {name}: {raw}")
              return raw


          def _canonical_enum(value: Any, enum_type: type[Enum], name: str) -> str:
              raw = _enum_value(value, enum_type, name)
              if type(value) is not str or value != raw:
                  raise ValueError(f"{name} must be stored as its canonical string value")
              return raw


          ''',
              'canonical enum helper',
          )

          replace_once(
              adapter,
              '''def _measurement(value: Any, name: str) -> str:
              raw = value.value if isinstance(value, MeasurementClass) else value
              if type(raw) is not str or raw not in {item.value for item in MeasurementClass}:
                  raise ValueError(f"unknown {name}: {raw}")
              return raw


          ''',
              '''def _canonical_strings(
              value: Any,
              name: str,
              *,
              allow_empty: bool = True,
          ) -> tuple[str, ...]:
              if type(value) is not tuple:
                  raise ValueError(f"{name} must be a tuple")
              normalized = _strings(value, name, allow_empty=allow_empty)
              if value != normalized:
                  raise ValueError(f"{name} must use canonical sorted order")
              return normalized


          def _sequence(value: Any, name: str) -> tuple[Any, ...]:
              if type(value) not in {list, tuple}:
                  raise ValueError(f"{name} must be a list or tuple")
              return tuple(value)


          def _measurement(value: Any, name: str) -> str:
              raw = value.value if isinstance(value, MeasurementClass) else value
              if type(raw) is not str or raw not in {item.value for item in MeasurementClass}:
                  raise ValueError(f"unknown {name}: {raw}")
              return raw


          def _canonical_measurement(value: Any, name: str) -> str:
              raw = _measurement(value, name)
              if type(value) is not str or value != raw:
                  raise ValueError(f"{name} must be stored as its canonical string value")
              return raw


          ''',
              'canonical string and measurement helpers',
          )

          replace_once(
              adapter,
              '''        if self.measurement_class != _measurement(
                      self.measurement_class, "criterion.measurement_class"
                  ):
                      raise ValueError("measurement_class must be canonical")
          ''',
              '''        _canonical_measurement(
                      self.measurement_class, "criterion.measurement_class"
                  )
          ''',
              'criterion canonical measurement',
          )
          replace_once(
              adapter,
              '''        _text(self.candidate_id, "signal.candidate_id")
          ''',
              '''        if self.candidate_id != _text(self.candidate_id, "signal.candidate_id"):
                      raise ValueError("signal candidate_id must be canonical normalized text")
          ''',
              'signal canonical candidate ID',
          )
          replace_once(
              adapter,
              '''        if self.measurement_class != _measurement(
                      self.measurement_class, "signal.measurement_class"
                  ):
                      raise ValueError("signal measurement_class must be canonical")
          ''',
              '''        _canonical_measurement(
                      self.measurement_class, "signal.measurement_class"
                  )
          ''',
              'signal canonical measurement',
          )

          replace_once(
              adapter,
              '''        _enum_value(self.lane, ConstructionAdvisoryLane, "candidate.lane")
                  if self.title != _text(self.title, "candidate.title"):
                      raise ValueError("candidate title must be canonical normalized text")
                  if self.summary != _text(self.summary, "candidate.summary"):
                      raise ValueError("candidate summary must be canonical normalized text")
                  _strings(self.required_claim_ids, "candidate.required_claim_ids")
                  _strings(self.declared_hard_blockers, "candidate.declared_hard_blockers")
                  _strings(self.assumptions, "candidate.assumptions")
                  _enum_value(
                      self.authority_route,
                      ConstructionAuthorityRoute,
                      "candidate.authority_route",
                  )
          ''',
              '''        _canonical_enum(self.lane, ConstructionAdvisoryLane, "candidate.lane")
                  if self.title != _text(self.title, "candidate.title"):
                      raise ValueError("candidate title must be canonical normalized text")
                  if self.summary != _text(self.summary, "candidate.summary"):
                      raise ValueError("candidate summary must be canonical normalized text")
                  _canonical_strings(
                      self.required_claim_ids, "candidate.required_claim_ids"
                  )
                  _canonical_strings(
                      self.declared_hard_blockers, "candidate.declared_hard_blockers"
                  )
                  _canonical_strings(self.assumptions, "candidate.assumptions")
                  _canonical_enum(
                      self.authority_route,
                      ConstructionAuthorityRoute,
                      "candidate.authority_route",
                  )
          ''',
              'candidate canonical fields',
          )
          replace_once(
              adapter,
              '''        if self.measurement_class != _measurement(
                      self.measurement_class, "candidate.measurement_class"
                  ):
                      raise ValueError("candidate measurement_class must be canonical")
          ''',
              '''        _canonical_measurement(
                      self.measurement_class, "candidate.measurement_class"
                  )
          ''',
              'candidate canonical measurement',
          )
          replace_once(
              adapter,
              '''            required_claim_ids=tuple(data.get("required_claim_ids", ())),
                      declared_hard_blockers=tuple(data.get("declared_hard_blockers", ())),
                      assumptions=tuple(data.get("assumptions", ())),
          ''',
              '''            required_claim_ids=_sequence(
                          data.get("required_claim_ids", ()),
                          "candidate.required_claim_ids",
                      ),
                      declared_hard_blockers=_sequence(
                          data.get("declared_hard_blockers", ()),
                          "candidate.declared_hard_blockers",
                      ),
                      assumptions=_sequence(
                          data.get("assumptions", ()), "candidate.assumptions"
                      ),
          ''',
              'candidate strict deserialization',
          )

          replace_once(
              adapter,
              '''        _text(self.candidate_id, "assessment.candidate_id")
                  if type(self.admissible) is not bool:
                      raise ValueError("assessment admissible flag must be boolean")
                  _strings(self.blockers, "assessment.blockers")
          ''',
              '''        if self.candidate_id != _text(
                      self.candidate_id, "assessment.candidate_id"
                  ):
                      raise ValueError("assessment candidate_id must be canonical normalized text")
                  if type(self.admissible) is not bool:
                      raise ValueError("assessment admissible flag must be boolean")
                  _canonical_strings(self.blockers, "assessment.blockers")
          ''',
              'assessment canonical fields',
          )

          replace_once(
              adapter,
              '''        _enum_value(self.mode, ConstructionArenaMode, "evaluation.mode")
                  _enum_value(self.lane, ConstructionAdvisoryLane, "evaluation.lane")
                  _enum_value(self.route_class, ConstructionRouteClass, "evaluation.route_class")
                  _text(self.state_digest, "evaluation.state_digest")
          ''',
              '''        _canonical_enum(self.mode, ConstructionArenaMode, "evaluation.mode")
                  _canonical_enum(self.lane, ConstructionAdvisoryLane, "evaluation.lane")
                  _canonical_enum(
                      self.route_class, ConstructionRouteClass, "evaluation.route_class"
                  )
                  if self.state_digest != _text(
                      self.state_digest, "evaluation.state_digest"
                  ):
                      raise ValueError("state_digest must be canonical normalized text")
          ''',
              'evaluation canonical primary fields',
          )
          replace_once(
              adapter,
              '''        _strings(self.option_candidate_ids, "evaluation.option_candidate_ids")
          ''',
              '''        _canonical_strings(
                      self.option_candidate_ids, "evaluation.option_candidate_ids"
                  )
          ''',
              'evaluation canonical option IDs',
          )
          replace_once(
              adapter,
              '''            _enum_value(
                          self.next_authority_route,
                          ConstructionAuthorityRoute,
                          "evaluation.next_authority_route",
                      )
          ''',
              '''            _canonical_enum(
                          self.next_authority_route,
                          ConstructionAuthorityRoute,
                          "evaluation.next_authority_route",
                      )
          ''',
              'evaluation canonical authority',
          )

          replace_once(
              adapter,
              '''def _route_class(admissible_count: int, candidate_count: int) -> str:
          ''',
              '''_AUTHORITY_PRIORITY = {
              ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED.value: 0,
              ConstructionAuthorityRoute.PROFESSIONAL_REVIEW_REQUIRED.value: 1,
              ConstructionAuthorityRoute.REGULATORY_OR_LEGAL_REVIEW_REQUIRED.value: 2,
          }


          def _route_class(admissible_count: int, candidate_count: int) -> str:
          ''',
              'authority priority table',
          )
          replace_once(
              adapter,
              '''            ranked[0],
                      min(ranked, key=lambda item: (item.safety_risk, item.deadline_risk, item.candidate_id)),
          ''',
              '''            min(
                          ranked,
                          key=lambda item: (
                              -assessment_by_id[item.candidate_id].balanced_score,
                              item.candidate_id,
                          ),
                      ),
                      min(
                          ranked,
                          key=lambda item: (
                              item.safety_risk,
                              item.deadline_risk,
                              item.candidate_id,
                          ),
                      ),
          ''',
              'genuine balanced option selector',
          )
          replace_once(
              adapter,
              '''    next_authority = ""
              if recommended_id:
                  next_authority = candidate_by_id[recommended_id].authority_route
          ''',
              '''    if recommended_id:
                  next_authority = candidate_by_id[recommended_id].authority_route
              elif candidate_items:
                  next_authority = max(
                      (item.authority_route for item in candidate_items),
                      key=lambda value: _AUTHORITY_PRIORITY[value],
                  )
              else:
                  next_authority = ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED.value
          ''',
              'all-blocked authority escalation',
          )

          replace_once(
              adapter,
              '''        if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  mode_value = _enum_value(mode, ConstructionArenaMode, "mode")
                  return BoundaryContract.placeholder(
          ''',
              '''        if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  if capsule.domain != self.domain:
                      raise ValueError("capsule domain must be construction")
                  if str(capsule.target.get("project_id") or "") != scope.project_id:
                      raise ValueError("capsule project does not match Construction scope")
                  mode_value = _enum_value(mode, ConstructionArenaMode, "mode")
                  return BoundaryContract.placeholder(
          ''',
              'boundary capsule binding',
          )
          replace_once(
              adapter,
              '''        if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  return ArenaLease.create(
          ''',
              '''        if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  if capsule.domain != self.domain:
                      raise ValueError("capsule domain must be construction")
                  if str(capsule.target.get("project_id") or "") != scope.project_id:
                      raise ValueError("capsule project does not match Construction scope")
                  return ArenaLease.create(
          ''',
              'lease capsule binding',
          )
          replace_once(
              adapter,
              '''        if type(state) is not ConstructionProjectState:
                      raise ValueError("state must be an exact ConstructionProjectState")
                  if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  candidate_items = tuple(candidates)
                  signal_items = tuple(probabilistic_signals)
          ''',
              '''        if type(state) is not ConstructionProjectState:
                      raise ValueError("state must be an exact ConstructionProjectState")
                  state.__post_init__()
                  if type(scope) is not ConstructionScope:
                      raise ValueError("scope must be an exact ConstructionScope")
                  if scope.project_id != state.project_id:
                      raise ValueError("runtime scope project must match Construction state")
                  candidate_items = tuple(candidates)
                  if not all(
                      type(item) is ConstructionCoordinationCandidate
                      for item in candidate_items
                  ):
                      raise ValueError(
                          "candidates must contain exact ConstructionCoordinationCandidate values"
                      )
                  signal_items = tuple(probabilistic_signals)
                  if not all(
                      type(item) is ConstructionProbabilisticSignal for item in signal_items
                  ):
                      raise ValueError(
                          "probabilistic_signals must contain exact signal values"
                      )
          ''',
              'runtime scope and type validation',
          )

          tests = Path('tests/test_aura_construction_adapter.py')
          text = tests.read_text(encoding='utf-8')
          if 'def test_all_blocked_routes_expose_explicit_authority_escalation()' in text:
              raise SystemExit('manual hardening tests already exist')
          text += '''


def test_all_blocked_routes_expose_explicit_authority_escalation():
              demo = fixture()
              source = demo.candidates[0]
              blocked = ConstructionCoordinationCandidate.create(
                  scope=source.scope,
                  lane=source.lane,
                  title="Regulatory blocked route",
                  summary="A route that is blocked before ranking and requires legal review.",
                  declared_hard_blockers=("missing_regulatory_release",),
                  authority_route=ConstructionAuthorityRoute.REGULATORY_OR_LEGAL_REVIEW_REQUIRED,
                  projected_time_delta_hours=0.0,
                  projected_cost_delta_cad=0.0,
                  projected_idle_delta_hours=0.0,
                  safety_risk=0.0,
                  deadline_risk=0.0,
                  evidence_quality=1.0,
                  reversibility=1.0,
              )
              evaluation = evaluate(candidates=(blocked,), signals=())
              assert evaluation.recommended_candidate_id == ""
              assert evaluation.next_authority_route == (
                  ConstructionAuthorityRoute.REGULATORY_OR_LEGAL_REVIEW_REQUIRED.value
              )


          def test_empty_route_set_still_exposes_owner_review():
              demo = fixture()
              evaluation = evaluate_construction_candidates(
                  demo.state,
                  candidates=(),
                  now=30.0,
                  mode=ConstructionArenaMode.SYNTHETIC,
                  lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK,
              )
              assert evaluation.next_authority_route == (
                  ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED.value
              )


          def test_candidate_stored_forms_must_be_canonical():
              demo = fixture()
              candidate = next(
                  item for item in demo.candidates if len(item.required_claim_ids) == 2
              )
              with pytest.raises(ValueError, match="canonical string value"):
                  replace(candidate, lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK)
              with pytest.raises(ValueError, match="canonical sorted order"):
                  replace(
                      candidate,
                      required_claim_ids=tuple(reversed(candidate.required_claim_ids)),
                  )


          def test_runtime_packet_rejects_scope_and_type_mismatches_before_identity_access():
              demo = fixture()
              adapter = ConstructionArenaAdapter()
              with pytest.raises(ValueError, match="scope project"):
                  adapter.build_runtime_packet(
                      objective="Reject a mismatched scope.",
                      state=demo.state,
                      scope=ConstructionScope("other-project", "zone", "package"),
                      candidates=demo.candidates,
                      now=30.0,
                      mode=ConstructionArenaMode.SYNTHETIC,
                      lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK,
                      probabilistic_signals=demo.probabilistic_signals,
                  )
              with pytest.raises(ValueError, match="exact ConstructionCoordinationCandidate"):
                  adapter.build_runtime_packet(
                      objective="Reject a malformed candidate.",
                      state=demo.state,
                      scope=demo.focus_scope,
                      candidates=(object(),),
                      now=30.0,
                      mode=ConstructionArenaMode.SYNTHETIC,
                      lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK,
                  )


          def test_boundary_and_lease_bind_capsule_to_project_scope():
              demo = fixture()
              adapter = ConstructionArenaAdapter()
              capsule = adapter.action_capsule_from_intent(
                  objective="Bind the packet to its project.",
                  capsule_id="CAP-BIND",
                  target={
                      "project_id": demo.focus_scope.project_id,
                      "mode": "SYNTHETIC",
                      "lane": "ALTERNATIVE_WORK",
                  },
              )
              mismatched = ConstructionScope("other-project", "zone", "package")
              with pytest.raises(ValueError, match="capsule project"):
                  adapter.boundary_contract_for_scope(
                      capsule=capsule,
                      scope=mismatched,
                      mode=ConstructionArenaMode.SYNTHETIC,
                  )
              with pytest.raises(ValueError, match="capsule project"):
                  adapter.lease_for_capsule(capsule=capsule, scope=mismatched)


          def test_balanced_selector_can_surface_a_route_outside_safety_first_top_four():
              demo = fixture()
              base = demo.focus_scope
              candidates = []
              for index, safety in enumerate((0.0, 0.1, 0.2, 0.3)):
                  candidates.append(
                      ConstructionCoordinationCandidate.create(
                          scope=base,
                          lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK,
                          title=f"Safety-first route {index}",
                          summary="Low safety rank but deliberately weak overall balance.",
                          authority_route=ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED,
                          projected_time_delta_hours=0.0,
                          projected_cost_delta_cad=0.0,
                          projected_idle_delta_hours=0.0,
                          safety_risk=safety,
                          deadline_risk=1.0,
                          evidence_quality=0.0,
                          reversibility=0.0,
                      )
                  )
              balanced = None
              for index in range(50):
                  candidate = ConstructionCoordinationCandidate.create(
                      scope=base,
                      lane=ConstructionAdvisoryLane.ALTERNATIVE_WORK,
                      title=f"Balanced route {index}",
                      summary="Higher safety rank but materially better balanced score.",
                      authority_route=ConstructionAuthorityRoute.OWNER_REVIEW_REQUIRED,
                      projected_time_delta_hours=0.0,
                      projected_cost_delta_cad=0.0,
                      projected_idle_delta_hours=0.0,
                      safety_risk=0.4,
                      deadline_risk=0.0,
                      evidence_quality=1.0,
                      reversibility=1.0,
                  )
                  if candidate.candidate_id != min(
                      [item.candidate_id for item in candidates] + [candidate.candidate_id]
                  ):
                      balanced = candidate
                      break
              assert balanced is not None
              evaluation = evaluate(
                  candidates=tuple(candidates) + (balanced,),
                  signals=(),
              )
              assessment = next(
                  item
                  for item in evaluation.assessments
                  if item.candidate_id == balanced.candidate_id
              )
              assert assessment.balanced_score == max(
                  item.balanced_score for item in evaluation.assessments
              )
              assert balanced.candidate_id in evaluation.option_candidate_ids
          '''
          tests.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            aura_construction_adapter.py \
            tests/test_aura_construction_adapter.py
          python -m pytest -q tests/test_aura_construction_adapter.py
      - name: Commit verified E7 hardening and self-clean
        run: |
          rm -f .aura/sco_phase3_adapter_hardening.trigger
          rm .github/workflows/sco-phase3-adapter-surgeon-hardening.yml
          git config user.name "AuraOS E7 Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add \
            aura_construction_adapter.py \
            tests/test_aura_construction_adapter.py \
            .aura/sco_phase3_adapter_hardening.trigger \
            .github/workflows/sco-phase3-adapter-surgeon-hardening.yml
          git commit -m "fix: harden Construction adapter through Aura Surgeon"
          git pull --rebase origin refactor/sco-construction-e7-e8
          git push origin HEAD:refactor/sco-construction-e7-e8
