name: PR224 Greptile repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr224-greptile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 224 &&
      github.event.pull_request.head.ref == 'refactor/bilateral-intent-pr1-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch exact PR head without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"

      - name: Decode and apply exact repair
        run: |
          set -euo pipefail
          base64 -d .aura/pr224-greptile-repair.patch.xz.b64 | xz -d > /tmp/pr224-greptile-repair.patch
          echo '880610c810793332bfebaf58f6342b9acc9bdaed812db2b87dedaf03040c24fc  /tmp/pr224-greptile-repair.patch' | sha256sum --check -
          git apply --check /tmp/pr224-greptile-repair.patch
          git apply /tmp/pr224-greptile-repair.patch
          git rm .aura/pr224-greptile-repair.patch.xz.b64
          git rm .github/workflows/pr224-greptile-repair.yml
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff

      - name: Run bounded repair proof
        run: |
          set -euo pipefail
          python -m py_compile aura_intent_refinement.py aura_bilateral_intent_ingestion.py
          ruff check --select E9,F63,F7,F82 aura_intent_refinement.py tests/test_aura_intent_refinement.py
          python -m pytest -q \
            tests/test_aura_intent_refinement.py \
            tests/test_aura_intent_ingestion_bilateral.py \
            tests/test_bilateral_intent_pr1_evidence.py
          test "$(git hash-object aura_intent_refinement.py)" = aad49ff004d642cab8107178ca60149917f56525
          test "$(git hash-object tests/test_aura_intent_refinement.py)" = 13a38e0af81203ee6521e9c8d0b98de9d2da20bb
          test "$(git hash-object schemas/aura_intent_refinement.v1.schema.json)" = 1940609bbb121134a8224549173c5597efdc4de4
          test "$(git hash-object .aura/refactor_objectives/bilateral_intent_guardrail_foundry_pr1.v1.json)" = 70513356ffd5fac7f6c67c9d3d1ca6416db35a74
          test "$(git hash-object .aura/refactor_objectives/bilateral_intent_guardrail_foundry_pr1_revision.v1.json)" = dca4c92ac53d97f90b7ae32689e36ff3f34c1f9f
          test "$(git hash-object .aura/waboose_requests/bilateral_intent_guardrail_foundry.v2.json)" = d0c6af557ddcf192f18b360b01d306c94f20dc13

      - name: Regenerate governed navigation
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          git checkout HEAD -- Aura_Memory/live_topology_ast.json
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          git diff --check

      - name: Commit verified repair
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'AuraOS Greptile Repair Harness'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: bind bilateral intent compilation to verified confirmation'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"$TARGET_BRANCH"
