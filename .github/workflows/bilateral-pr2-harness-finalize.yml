name: Bilateral PR2 harness finalizer

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

concurrency:
  group: bilateral-pr2-harness-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 231 &&
      github.event.pull_request.head.ref == 'refactor/bilateral-intent-pr2' &&
      contains(github.event.pull_request.body, '<!-- aura-pr2-harness-finalize -->')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/bilateral-intent-pr2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Apply bounded lifecycle corrections
        run: python Aura_Sandbox/pr2_harness_finalize.py

      - name: Remove one-use harness files before verification
        run: |
          rm Aura_Sandbox/pr2_harness_finalize.py
          rm .github/workflows/bilateral-pr2-harness-finalize.yml

      - name: Prepare Aura architecture harness
        run: |
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            prepare \
            --venv "${RUNNER_TEMP}/aura-pr2-harness-venv" \
            --system-site-packages
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            doctor \
            --venv "${RUNNER_TEMP}/aura-pr2-harness-venv" \
            > "${RUNNER_TEMP}/aura-pr2-harness-doctor.json"

      - name: Run Aura Connectome Atlas Architect harness
        run: |
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            run \
            --venv "${RUNNER_TEMP}/aura-pr2-harness-venv" \
            --objective "Harden contradiction resolution in aura_bilateral_intent_compiler.py and content-sensitive repository identity, confirmation expiry, and fail-closed legacy handling in aura_arena_gate_dialogue.py; prove tests/test_aura_bilateral_gate_dialogue.py without regenerating CODEMAP." \
            --combine-with Connectome "Relational Synthesis" Atlas \
            --atlas-profile MINIMAL \
            --top 8 \
            --pair-limit 5000000 \
            --allow-dirty \
            --output-dir "${RUNNER_TEMP}/aura-pr2-harness-output" \
            --watchdog-checkin-seconds 60 \
            --watchdog-pause-seconds 1200

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilateral-pr2-harness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aura-pr2-harness-doctor.json
            ${{ runner.temp }}/aura-pr2-harness-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Run focused source proof
        run: |
          python -m py_compile \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py
          ruff check --select E9,F63,F7,F82 \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py
          python -m pytest -q \
            tests/test_aura_bilateral_gate_dialogue.py \
            tests/test_aura_showcase_gate_dialogue.py \
            tests/test_aura_intent_refinement.py

      - name: Publish verified source only
        run: |
          git config user.name "AuraOS PR2 Harness Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            Aura_Sandbox/pr2_harness_finalize.py \
            .github/workflows/bilateral-pr2-harness-finalize.yml
          git commit -m "[skip ci] fix(intent): harden bilateral clarification lifecycle"
          git push origin HEAD:refactor/bilateral-intent-pr2
