name: Bilateral PR2 harness finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  actions: write
  contents: write

concurrency:
  group: bilateral-pr2-harness-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 231 &&
      github.event.pull_request.head.ref == 'refactor/bilateral-intent-pr2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Cancel competing branch workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate \
            "repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\")) | .id" \
          | while read -r run_id; do
              if [ -n "${run_id}" ]; then
                gh api -X POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel" || true
              fi
            done

      - uses: actions/checkout@v4
        with:
          ref: refactor/bilateral-intent-pr2
          fetch-depth: 0

      - name: Preserve committed CODEMAP without regenerating it
        run: |
          mkdir -p "${RUNNER_TEMP}/committed-codemap/.aura"
          cp .aura/CODEMAP.json "${RUNNER_TEMP}/committed-codemap/.aura/CODEMAP.json"
          cp .aura/CODEMAP.md "${RUNNER_TEMP}/committed-codemap/.aura/CODEMAP.md"
          cp topology_map.json "${RUNNER_TEMP}/committed-codemap/topology_map.json"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install declared dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Apply bounded lifecycle corrections
        run: python Aura_Sandbox/pr2_harness_finalize.py

      - name: Remove one-use harness files before verification
        run: |
          rm Aura_Sandbox/pr2_harness_finalize.py
          rm Aura_Sandbox/pr2_harness_trigger.txt
          rm .github/workflows/bilateral-pr2-harness-finalize.yml

      - name: Run focused source proof
        id: source_proof
        continue-on-error: true
        run: |
          set +e
          {
            python -m py_compile \
              aura_bilateral_intent_compiler.py \
              aura_arena_gate_dialogue.py \
              tests/test_aura_bilateral_gate_dialogue.py
            ruff check --select E9,F63,F7,F82 \
              aura_bilateral_intent_compiler.py \
              aura_arena_gate_dialogue.py \
              tests/test_aura_bilateral_gate_dialogue.py
            python -m pytest -vv --tb=short \
              tests/test_aura_bilateral_gate_dialogue.py \
              tests/test_aura_showcase_gate_dialogue.py \
              tests/test_aura_intent_refinement.py \
              --junitxml="${RUNNER_TEMP}/pr2-focused-junit.xml"
          } > "${RUNNER_TEMP}/pr2-focused-output.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/pr2-focused-output.txt"
          printf '%s\n' "${code}" > "${RUNNER_TEMP}/pr2-focused-exit-code.txt"
          exit "${code}"

      - name: Upload focused proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilateral-pr2-focused-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr2-focused-output.txt
            ${{ runner.temp }}/pr2-focused-junit.xml
            ${{ runner.temp }}/pr2-focused-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Restore and verify untouched CODEMAP
        if: always()
        run: |
          cp "${RUNNER_TEMP}/committed-codemap/.aura/CODEMAP.json" .aura/CODEMAP.json
          cp "${RUNNER_TEMP}/committed-codemap/.aura/CODEMAP.md" .aura/CODEMAP.md
          cp "${RUNNER_TEMP}/committed-codemap/topology_map.json" topology_map.json
          git diff --exit-code -- .aura/CODEMAP.json .aura/CODEMAP.md topology_map.json

      - name: Enforce focused source proof
        if: steps.source_proof.outcome != 'success'
        run: |
          echo "Focused source proof failed. Inspect the uploaded diagnostics."
          exit 1

      - name: Publish verified source only
        if: steps.source_proof.outcome == 'success'
        run: |
          git config user.name "AuraOS PR2 Harness Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- \
            aura_bilateral_intent_compiler.py \
            aura_arena_gate_dialogue.py \
            tests/test_aura_bilateral_gate_dialogue.py \
            Aura_Sandbox/pr2_harness_finalize.py \
            Aura_Sandbox/pr2_harness_trigger.txt \
            .github/workflows/bilateral-pr2-harness-finalize.yml
          git commit -m "[skip ci] fix(intent): harden bilateral clarification lifecycle"
          git push origin HEAD:refactor/bilateral-intent-pr2
