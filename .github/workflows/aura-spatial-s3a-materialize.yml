name: Aura Spatial S3A Materialize

on:
  pull_request:
    paths:
      - ".github/workflows/aura-spatial-s3a-materialize.yml"

permissions:
  contents: read

concurrency:
  group: aura-spatial-s3a-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and verify exact pull-request head archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o exact-head.tar.gz \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${EXACT_HEAD}"
          size="$(wc -c < exact-head.tar.gz)"
          test "$size" -gt 0
          test "$size" -le 268435456
          mkdir -p verify
          tar -xzf exact-head.tar.gz -C verify --strip-components=1
          test -f verify/aura_spatial_contracts.py
          test -f verify/aura_source_integrity.py
          printf '%s\n' "$EXACT_HEAD" > EXACT_HEAD.txt

      - name: Upload exact-head repository archive
        uses: actions/upload-artifact@v4
        with:
          name: aura-spatial-s3a-exact-head-${{ github.event.pull_request.head.sha }}
          path: |
            exact-head.tar.gz
            EXACT_HEAD.txt
          if-no-files-found: error
          retention-days: 1

