name: Dispatch CodeRabbit Waboose Learning

on:
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    if: contains(github.actor, 'coderabbit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch trusted persistent learning run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "ref": os.environ["DEFAULT_BRANCH"],
              "inputs": {
                  "pr_number": os.environ["PR_NUMBER"],
                  "review_id": os.environ["REVIEW_ID"],
                  "head_sha": os.environ["HEAD_SHA"],
              },
          }
          Path("/tmp/waboose-learning-dispatch.json").write_text(
              json.dumps(payload),
              encoding="utf-8",
          )
          PY
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/coderabbit-waboose-learning-persist.yml/dispatches" \
            --input /tmp/waboose-learning-dispatch.json
