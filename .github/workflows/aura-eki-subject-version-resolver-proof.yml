name: Aura EKI Subject Version Resolver Proof

on:
  pull_request:
    paths:
      - "tools/aura_external_cognition_subject_version_resolver.py"
      - "tests/test_aura_external_cognition_subject_version_resolver.py"
      - ".github/workflows/aura-eki-subject-version-resolver-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-subject-version-resolver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact checkout without mutable third-party action
        shell: bash
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Compile resolver surface
        run: |
          set -euo pipefail
          python -m py_compile tools/aura_external_cognition_subject_version_resolver.py
          python -m py_compile tests/test_aura_external_cognition_subject_version_resolver.py

      - name: Run exact resolver contract
        run: |
          set -euo pipefail
          python -m unittest tests.test_aura_external_cognition_subject_version_resolver -v

      - name: Preserve claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('tools/aura_external_cognition_subject_version_resolver.py').read_text(encoding='utf-8')
          required = [
              'StableSubject',
              'Version',
          ]
          for token in required:
              assert token.lower() in text.lower(), token
          print({'proof_only': True, 'semantic_owner': 'PR744', 'effect_authority': False})
          PY
