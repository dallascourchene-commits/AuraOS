name: Publish verified unified continuity patch command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: umc-verified-publish-command
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.issue.number == 193 &&
      github.event.comment.body == '/publish-umc-verified-66' &&
      github.actor == 'dallascourchene-commits'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: refactor/unified-memory-continuity
      TRANSPORT_COMMIT: 1de0f438b330ef91bfc99cead2d288d003181e22
      EVIDENCE_DIR: ${{ runner.temp }}/umc-verified-publish
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/unified-memory-continuity
          fetch-depth: 0

      - name: Bind draft PR and unchanged reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          gh api repos/${{ github.repository }}/pulls/193 > "$EVIDENCE_DIR/pr.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          pr = json.loads((Path(os.environ['EVIDENCE_DIR']) / 'pr.json').read_text())
          assert pr['state'] == 'open', pr
          assert pr['draft'] is True, pr
          assert pr['head']['ref'] == 'refactor/unified-memory-continuity', pr
          assert pr['head']['repo']['full_name'] == '${{ github.repository }}', pr
          PY
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/${TARGET_BRANCH})"
          test -z "$(git status --porcelain=v1)"
          test "$(sha256sum aura_unified_memory_continuity.py | awk '{print $1}')" = \
            bb5c0c50e62b8edbb4cbdad4f9810709f67adf7866fcd8b0700eda334a030ade
          test "$(sha256sum tests/test_aura_unified_memory_continuity.py | awk '{print $1}')" = \
            edddf3af030fd5e4cdeb8bc0bb0c4b2751e3dc7857068ba46c28c5bd905d19ee
          test "$(sha256sum docs/AURA_UNIFIED_MEMORY_CONTINUITY.md | awk '{print $1}')" = \
            5d3c0736b04c4fd3b0dbee54964e43387dad7949a8a175d1d333f4e5c4962603
          test "$(sha256sum docs/AURA_UNIFIED_MEMORY_CONTINUITY_VERIFICATION.md | awk '{print $1}')" = \
            0c72fcc9ff1f9bc3c9f0847d059b9d411ebd041bc3bb00e4698fcef35d8505c5
          test "$(sha256sum .aura/waboose_requests/unified_memory_continuity.v1.json | awk '{print $1}')" = \
            0a3206477ffc6d1f1190a97245b9a4a41b14a2dad27b2bfc81229c3e5294bf34
          git rev-parse HEAD | tee "$EVIDENCE_DIR/source-head.txt"

      - name: Materialize five exact reviewed files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRANSPORT_COMMIT"
          : > "$EVIDENCE_DIR/payload.txt"
          for number in 01 02 03; do
            git show "$TRANSPORT_COMMIT:Aura_Sandbox/umc_deep_review_payload_v2/part-${number}" \
              >> "$EVIDENCE_DIR/payload.txt"
          done
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import zlib

          root = Path(os.environ['EVIDENCE_DIR'])
          payload = json.loads(zlib.decompress(base64.b64decode(
              (root / 'payload.txt').read_text(encoding='utf-8'), validate=True
          )))
          payload_hashes = {
              'aura_unified_memory_continuity.py': 'c0240ccc01b5b54988f2859a81c3379b920fd3acca0b42d6e1fe739d40c50ae1',
              'tests/test_aura_unified_memory_continuity.py': '28e9f7683ea491aa43c321decc41eb4dcb3d806f18633fc530c5cebab74d04e8',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY.md': '262b2207468a918b196de925e46792146ffc7e97a46f5ced88d3e8d80c6614cd',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY_VERIFICATION.md': '7844267632cfba956817f1799e8095e7d5eefd51f087b73c8101281ed0beb4ea',
              '.aura/waboose_requests/unified_memory_continuity.v1.json': '9d9b193e206bd24d94a3592f8bd3d78da88241dece7da4c557a1bcc30691e2d3',
          }
          records = payload.get('files')
          if payload.get('version') != 'AURA_UMC_DEEP_REVIEW_PAYLOAD_V2' or set(records or {}) != set(payload_hashes):
              raise SystemExit('reviewed payload identity or scope mismatch')
          for relative, expected in payload_hashes.items():
              content = records[relative].get('content')
              if not isinstance(content, str):
                  raise SystemExit(f'non-text payload: {relative}')
              data = content.encode('utf-8')
              digest = hashlib.sha256(data).hexdigest()
              if digest != expected or digest != records[relative].get('sha256'):
                  raise SystemExit(f'payload hash mismatch: {relative}')
              target = Path(relative)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)

          module_path = Path('aura_unified_memory_continuity.py')
          module = module_path.read_text(encoding='utf-8')
          import_anchor = 'from enum import Enum\nimport math\n'
          dynamic_load = 'decoded = __import__("json").loads(normalized)'
          if module.count(import_anchor) != 1 or module.count(dynamic_load) != 1:
              raise SystemExit('namespace repair anchors are ambiguous')
          module = module.replace(import_anchor, 'from enum import Enum\nimport json\nimport math\n', 1)
          module = module.replace(dynamic_load, 'decoded = json.loads(normalized)', 1)
          module_path.write_text(module, encoding='utf-8')

          tests_path = Path('tests/test_aura_unified_memory_continuity.py')
          tests = tests_path.read_text(encoding='utf-8')
          if 'test_module_avoids_dynamic_namespace_injection' in tests:
              raise SystemExit('namespace regression unexpectedly exists')
          tests += '''\n\ndef test_module_avoids_dynamic_namespace_injection() -> None:\n    with open("aura_unified_memory_continuity.py", encoding="utf-8") as source_file:\n        source = source_file.read()\n    assert "__import__(" not in source\n'''
          tests_path.write_text(tests, encoding='utf-8')

          final_hashes = {
              'aura_unified_memory_continuity.py': '933b5f4962a33a0aad13bb0979de98bd86032d35ebce1245cb75a75536e12af3',
              'tests/test_aura_unified_memory_continuity.py': '4793480ccc76a6216983a533ef1dc7aab33e5ddd25f8b41a25c7eba40cfb70d1',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY.md': '262b2207468a918b196de925e46792146ffc7e97a46f5ced88d3e8d80c6614cd',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY_VERIFICATION.md': '7844267632cfba956817f1799e8095e7d5eefd51f087b73c8101281ed0beb4ea',
              '.aura/waboose_requests/unified_memory_continuity.v1.json': '9d9b193e206bd24d94a3592f8bd3d78da88241dece7da4c557a1bcc30691e2d3',
          }
          actual = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in final_hashes}
          if actual != final_hashes:
              raise SystemExit(f'final hash mismatch: {actual}')
          (root / 'final-hashes.json').write_text(json.dumps(actual, indent=2, sort_keys=True) + '\n')
          PY
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Reverify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > "$EVIDENCE_DIR/pip.log" 2>&1
          python -m pip install -r requirements.txt 'pytest>=8,<9' jsonschema ruff bandit \
            > "$EVIDENCE_DIR/install.log" 2>&1
          python -m py_compile aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py
          ruff check aura_unified_memory_continuity.py tests/test_aura_unified_memory_continuity.py \
            2>&1 | tee "$EVIDENCE_DIR/ruff.log"
          bandit -q -ll aura_unified_memory_continuity.py 2>&1 | tee "$EVIDENCE_DIR/bandit.log"
          python -m pytest -q \
            tests/test_aura_unified_memory_continuity.py \
            tests/test_aura_relationship_compass_finalization.py \
            2>&1 | tee "$EVIDENCE_DIR/pytest.log"
          grep -Eq '66 passed' "$EVIDENCE_DIR/pytest.log"
          python - <<'PY' 2>&1 | tee "$EVIDENCE_DIR/pvm.log"
          from pathlib import Path
          from pvm_arch_checker import PVMArchChecker
          violations = PVMArchChecker(Path('.')).run()
          hard = [v for v in violations if v.rule in {
              'SYNTAX_ERROR', 'WILDCARD_IMPORT', 'CIRCULAR_IMPORT', 'NAMESPACE_INJECTION'
          }]
          print(f'hard_violations={hard}')
          if hard:
              raise SystemExit('Aura PVM hard gate failed')
          PY

      - name: Regenerate maps and publish atomic bounded commit
        shell: bash
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py > "$EVIDENCE_DIR/codemap.log" 2>&1
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/${TARGET_BRANCH})"
          git config user.name 'AuraOS Verified Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            aura_unified_memory_continuity.py \
            tests/test_aura_unified_memory_continuity.py \
            docs/AURA_UNIFIED_MEMORY_CONTINUITY.md \
            docs/AURA_UNIFIED_MEMORY_CONTINUITY_VERIFICATION.md \
            .aura/waboose_requests/unified_memory_continuity.v1.json \
            .aura/CODEMAP.json \
            .aura/CODEMAP.md \
            topology_map.json
          git add -f Aura_Memory/live_topology_ast.json
          git diff --cached --check
          git diff --cached --name-only > "$EVIDENCE_DIR/staged-paths.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          changed = set((Path(os.environ['EVIDENCE_DIR']) / 'staged-paths.txt').read_text().splitlines())
          required = {
              'aura_unified_memory_continuity.py',
              'tests/test_aura_unified_memory_continuity.py',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY.md',
              'docs/AURA_UNIFIED_MEMORY_CONTINUITY_VERIFICATION.md',
              '.aura/waboose_requests/unified_memory_continuity.v1.json',
          }
          allowed = required | {
              '.aura/CODEMAP.json', '.aura/CODEMAP.md', 'topology_map.json',
              'Aura_Memory/live_topology_ast.json',
          }
          if not required.issubset(changed):
              raise SystemExit(f'missing required paths: {sorted(required - changed)}')
          if changed - allowed:
              raise SystemExit(f'unexpected paths: {sorted(changed - allowed)}')
          PY
          git commit -m 'fix: close deep continuity and namespace review gaps'
          git push origin "HEAD:${TARGET_BRANCH}"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/published-commit.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-memory-continuity-command-${{ github.run_id }}
          path: ${{ runner.temp }}/umc-verified-publish
          if-no-files-found: warn
          retention-days: 30

      - name: Report result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body='Owner-command publication succeeded: the five bounded unified-continuity files passed 66 regressions, Ruff, Bandit, Aura PVM hard gates, exact hashes, map regeneration, and atomic publication.'
          else
            body='Owner-command publication failed closed; no partial unified-continuity source commit was accepted.'
          fi
          gh api repos/${{ github.repository }}/issues/193/comments -f body="$body"
