name: Human Agent Emergent Research

on:
  pull_request:
    branches: [main]
    paths:
      - "aura_emergent_refactor_workspace.py"
      - "aura_arena_research_bridge.py"
      - "aura_human_agent_arena_server.py"
      - "aura_human_agent_arena/index.html"
      - "aura_human_agent_arena/emergent.js"
      - "aura_human_agent_arena/emergent.css"
      - "aura_codebase_navigator.py"
      - "tests/test_aura_codemap_verify.py"
      - "tests/test_aura_emergent_refactor_workspace.py"
      - "Aura_Memory/emergent_results/seed_runs/**"
      - ".github/workflows/human-agent-emergent-research.yml"

permissions:
  contents: read

concurrency:
  group: human-agent-emergent-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact pull-request head without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio numpy aiosqlite websockets ddgs wasmtime aiohttp beautifulsoup4 httpx cryptography

      - name: Verify immutable seed provenance and file digests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path("Aura_Memory/emergent_results/seed_runs/2026-07-16")
          provenance_path = root / "provenance.jsonl"
          records = [
              json.loads(line)
              for line in provenance_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(records) == 1, records
          provenance = records[0]
          assert provenance["source_run_id"] == 29528471066
          assert provenance["source_artifact_id"] == 8387658835
          assert provenance["source_artifact_digest"] == "sha256:aefff3dbbed14d061b38218763fef36dc7e376820dc81301f0a9aeae6a049c1a"
          assert provenance["repository_head_analyzed"] == "624a8afefe1824ef070f4684bcc7dc4195542162"
          assert provenance["probe_count"] == 22
          assert provenance["failure_count"] == 0
          assert provenance["lossless"] is True
          for name, expected in provenance["files"].items():
              path = root / name
              raw = path.read_bytes()
              assert len(raw) == int(expected["bytes"]), (name, len(raw), expected)
              assert hashlib.sha256(raw).hexdigest() == expected["sha256"], name
          print({"verified_files": sorted(provenance["files"]), "probe_count": provenance["probe_count"]})
          PY

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            aura_emergent_refactor_workspace.py \
            aura_arena_research_bridge.py \
            aura_human_agent_arena_server.py \
            aura_codebase_navigator.py

      - name: Check Emergent Lab JavaScript syntax
        run: node --check aura_human_agent_arena/emergent.js

      - name: Run emergent integrity and CODEMAP contracts
        run: python -m pytest -q tests/test_aura_emergent_refactor_workspace.py tests/test_aura_codemap_verify.py

      - name: Run Human Agent Arena compatibility contracts
        run: python -m pytest -q tests/test_aura_human_agent_arena.py tests/test_aura_human_agent_wfst_live_integration.py

      - name: Run Phase C2 regression contracts
        run: |
          python -m pytest -q --tb=short --maxfail=1 \
            tests/test_aura_phase_c2_live_route_capsules.py \
            tests/test_aura_phase_c2_capsule_enforcement.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py

      - name: Verify exact seed import, suite identity, and relevance search
        shell: bash
        run: |
          python - <<'PY'
          from aura_emergent_refactor_workspace import EmergentResultsStore

          store = EmergentResultsStore(".")
          imported = store.import_seed_reports()
          assert imported["ok"], imported
          runs = store.list_runs(limit=20)
          assert runs["total"] >= 2, runs
          versions = {item.get("suite_version") for item in runs["runs"]}
          assert "AURA_EMERGENT_CAPACITY_PROBES_V1" in versions, versions
          assert "AURA_GROUNDED_CAPACITY_PROJECTIONS_V1" in versions, versions
          search = store.search_findings("Refactor the Human Agent Arena", limit=8)
          assert search["count"] > 0, search
          leading = search["findings"][:3]
          files = [
              " ".join([
                  str((item.get("source") or {}).get("file") or ""),
                  str((item.get("target") or {}).get("file") or ""),
              ]).lower()
              for item in leading
          ]
          assert any("human_agent" in item for item in files), leading
          assert all(item["patch_authority"] == "exact_source_spans_and_hashes_only" for item in search["findings"])
          print({"runs": runs["total"], "versions": sorted(versions), "leading_files": files})
          PY
