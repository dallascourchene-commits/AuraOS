name: Human Agent Emergent Research

on:
  pull_request:
    branches: [main]
    paths:
      - "aura_emergent_refactor_workspace.py"
      - "aura_arena_research_bridge.py"
      - "aura_human_agent_arena_server.py"
      - "aura_human_agent_arena/index.html"
      - "aura_human_agent_arena/emergent.js"
      - "aura_human_agent_arena/emergent.css"
      - "tests/test_aura_emergent_refactor_workspace.py"
      - "Aura_Memory/emergent_results/seed_runs/**"
      - ".github/workflows/human-agent-emergent-research.yml"

permissions:
  contents: write

concurrency:
  group: human-agent-emergent-research-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compat-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make emergent context optional for minimal legacy state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("aura_human_agent_arena_server.py")
          text = path.read_text(encoding="utf-8")
          old = '''    objective_text = str(objective or "").strip()
              if not objective_text:
                  return {"ok": False, "error": "objective_required_for_emergent_context"}
              packet_result = state.emergent_store.build_refactor_packet(
          '''.replace("              ", "    ")
          new = '''    objective_text = str(objective or "").strip()
              if not objective_text:
                  return {"ok": False, "error": "objective_required_for_emergent_context"}
              emergent_store = getattr(state, "emergent_store", None)
              if emergent_store is None:
                  return {
                      "ok": False,
                      "status": "UNAVAILABLE",
                      "error": "emergent_workspace_unavailable",
                      "patch_authority": PATCH_AUTHORITY,
                      "vsa_patch_authority": VSA_PATCH_AUTHORITY,
                  }
              packet_result = emergent_store.build_refactor_packet(
          '''.replace("              ", "    ")
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit("compatibility target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Publish compatibility repair when needed
        shell: bash
        run: |
          set -euo pipefail
          git add aura_human_agent_arena_server.py
          if git diff --cached --quiet; then
            echo "Compatibility guard already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve minimal Human Agent server states"
          git fetch origin "${{ github.head_ref }}"
          git rebase "origin/${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"

  verify:
    needs: compat-repair
    if: always() && (needs.compat-repair.result == 'success' || needs.compat-repair.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio numpy aiosqlite websockets ddgs wasmtime aiohttp beautifulsoup4 httpx cryptography

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            aura_emergent_refactor_workspace.py \
            aura_arena_research_bridge.py \
            aura_human_agent_arena_server.py

      - name: Check Emergent Lab JavaScript syntax
        run: node --check aura_human_agent_arena/emergent.js

      - name: Run focused emergent-workspace tests
        run: python -m pytest -q tests/test_aura_emergent_refactor_workspace.py

      - name: Run Human Agent Arena regression tests
        run: python -m pytest -q tests/test_aura_human_agent_arena.py tests/test_aura_human_agent_wfst_live_integration.py

      - name: Run Phase C2 regression contracts
        run: |
          python -m pytest -q --tb=short --maxfail=1 \
            tests/test_aura_phase_c2_live_route_capsules.py \
            tests/test_aura_phase_c2_capsule_enforcement.py \
            tests/test_aura_phase_c1_route_capsules.py \
            tests/test_aura_arena_experience_ledger.py \
            tests/test_aura_crucible_phase_b.py \
            tests/test_aura_coding_workbench_wfst_equivalence.py \
            tests/test_aura_human_agent_wfst_live_integration.py

      - name: Verify exact seed import and search
        shell: bash
        run: |
          python - <<'PY'
          from aura_emergent_refactor_workspace import EmergentResultsStore

          store = EmergentResultsStore(".")
          imported = store.import_seed_reports()
          assert imported["ok"], imported
          runs = store.list_runs(limit=20)
          assert runs["total"] >= 2, runs
          versions = {item.get("suite_version") for item in runs["runs"]}
          assert "AURA_EMERGENT_CAPACITY_PROBES_V1" in versions, versions
          assert "AURA_GROUNDED_CAPACITY_PROJECTIONS_V1" in versions, versions
          search = store.search_findings("Human Agent Arena refactor research", limit=10)
          assert search["count"] > 0, search
          assert all(item["patch_authority"] == "exact_source_spans_and_hashes_only" for item in search["findings"])
          print({"runs": runs["total"], "findings": search["count"], "versions": sorted(versions)})
          PY
