name: SCO Construction E9-E14 Completion Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sco-construction-completion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.ref == 'refactor/sco-construction-e9-e14-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact completion head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config http.https://github.com/.extraheader "${AUTH_HEADER}"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          cat > .git/info/sparse-checkout <<'EOF'
          /*
          !/Aura_Sandbox/
          EOF
          git -c protocol.version=2 fetch \
            --no-tags \
            --filter=blob:none \
            --depth=160 \
            origin "${TARGET_SHA}"
          git checkout --quiet --detach "${TARGET_SHA}"
          git config --unset-all http.https://github.com/.extraheader
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact audit environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1 coverage==7.9.2 ruff==0.5.0

      - name: Apply bounded final integration once
        run: |
          set -euo pipefail
          FINALIZE=0
          if [ -f tools/apply_sco_construction_completion.py ]; then
            python tools/apply_sco_construction_completion.py
            rm tools/apply_sco_construction_completion.py
            FINALIZE=1
          fi
          if [ -f tools/apply_sco_completion_static_cleanup.py ]; then
            python tools/apply_sco_completion_static_cleanup.py
            rm tools/apply_sco_completion_static_cleanup.py
            FINALIZE=1
          fi
          if [ -f tools/apply_sco_completion_doc_cleanup.py ]; then
            python tools/apply_sco_completion_doc_cleanup.py
            rm tools/apply_sco_completion_doc_cleanup.py
            FINALIZE=1
          fi
          if [ -f tools/fix_sco_completion_manual_hardening.py ]; then
            python tools/fix_sco_completion_manual_hardening.py
            rm tools/fix_sco_completion_manual_hardening.py
            FINALIZE=1
          fi
          if [ -f tools/apply_sco_completion_manual_hardening.py ]; then
            python tools/apply_sco_completion_manual_hardening.py
            rm tools/apply_sco_completion_manual_hardening.py
            FINALIZE=1
          fi
          echo "COMPLETION_FINALIZE=${FINALIZE}" >> "${GITHUB_ENV}"

      - name: Compile and run fatal static checks
        run: |
          set -o pipefail
          {
          python -m py_compile \
            aura_construction_human_agent.py \
            aura_construction_refactor_completion.py \
            aura_human_agent_arena_server.py \
            aura_construction_refactor_plan.py \
            tests/test_aura_construction_human_agent.py \
            tests/test_aura_construction_human_agent_server.py \
            tests/test_aura_construction_refactor_completion.py
          ruff check --select E9,F63,F7,F82,F401,F811,B006 \
            aura_construction_human_agent.py \
            aura_construction_refactor_completion.py \
            aura_human_agent_arena_server.py \
            aura_construction_refactor_plan.py \
            tests/test_aura_construction_human_agent.py \
            tests/test_aura_construction_human_agent_server.py \
            tests/test_aura_construction_refactor_completion.py
          node --check aura_human_agent_arena/construction.js
          git diff --check
          } 2>&1 | tee /tmp/sco-completion-static.txt

      - name: Run focused Human Agent and completion coverage
        run: |
          set -o pipefail
          python -m coverage erase
          python -m coverage run -m pytest -q \
            tests/test_aura_construction_human_agent.py \
            tests/test_aura_construction_human_agent_server.py \
            tests/test_aura_construction_refactor_completion.py \
            2>&1 | tee /tmp/sco-completion-focused.txt
          python -m coverage report -m \
            --include='aura_construction_human_agent.py,aura_construction_refactor_completion.py' \
            --fail-under=82 \
            2>&1 | tee /tmp/sco-completion-coverage.txt

      - name: Run Construction and cross-Arena owner regressions
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_aura_refactor_skeleton.py \
            tests/test_aura_construction_refactor_plan.py \
            tests/test_aura_construction_contracts.py \
            tests/test_aura_construction_state.py \
            tests/test_aura_construction_authority.py \
            tests/test_aura_construction_adapter.py \
            tests/test_aura_construction_adapter_hardening.py \
            tests/test_aura_construction_fixtures.py \
            tests/test_aura_construction_benchmark.py \
            tests/test_aura_construction_grammar.py \
            tests/test_aura_construction_learning.py \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_persistence_integrations.py \
            tests/test_aura_human_agent_wfst_live_integration.py \
            2>&1 | tee /tmp/sco-completion-regressions.txt

      - name: Verify E0-E14 completion and authority boundaries
        run: |
          set -o pipefail
          python -m aura_construction_refactor_completion --repo-root . \
            2>&1 | tee /tmp/sco-completion-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/sco-completion-status.json').read_text())
          assert result['ok'] is True, result
          assert result['runtime_complete'] is True
          assert result['e14_release_status'] == 'READY_FOR_PINNED_MERGE'
          assert result['physical_work_authorized'] is False
          assert result['payment_released'] is False
          assert result['access_controlled'] is False
          assert result['professional_certification_authorized'] is False
          assert result['automatic_merge'] is False
          assert result['vsa_patch_authority'] is False
          PY

      - name: Regenerate and validate topology
        run: |
          rm -f .coverage
          rm -rf .pytest_cache .ruff_cache __pycache__
          python aura_codebase_navigator.py
          python aura_codemap_verify.py --repo-root .
          git diff --check

      - name: Upload completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sco-construction-e9-e14-${{ github.sha }}
          path: |
            /tmp/sco-completion-static.txt
            /tmp/sco-completion-focused.txt
            /tmp/sco-completion-coverage.txt
            /tmp/sco-completion-regressions.txt
            /tmp/sco-completion-status.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit integrated surface and synchronized topology
        if: env.COMPLETION_FINALIZE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          ORIGINAL_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -f .coverage
          rm -rf .pytest_cache .ruff_cache __pycache__
          git config user.name "AuraOS Construction Completion Surgeon"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete Construction Human Agent and Observatory wiring"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="${AUTH_HEADER}" fetch \
            --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          REMOTE_SHA="$(git rev-parse "refs/remotes/origin/${HEAD_REF}")"
          if [ "${REMOTE_SHA}" != "${ORIGINAL_SHA}" ]; then
            mapfile -t CHANGED < <(git diff --name-only "${ORIGINAL_SHA}" "${REMOTE_SHA}")
            test "${#CHANGED[@]}" -gt 0
            for path in "${CHANGED[@]}"; do
              case "${path}" in
                .aura/CODEMAP.json|.aura/CODEMAP.md|topology_map.json|Aura_Memory/live_topology_ast.json) ;;
                *) echo "unsafe concurrent source change: ${path}" >&2; exit 1 ;;
              esac
            done
          fi
          git -c http.https://github.com/.extraheader="${AUTH_HEADER}" push \
            --force-with-lease="refs/heads/${HEAD_REF}:${REMOTE_SHA}" \
            origin HEAD:"${HEAD_REF}"
