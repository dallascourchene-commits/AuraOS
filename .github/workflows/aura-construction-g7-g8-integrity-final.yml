        run: |
          node --test \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          git diff --check

      - name: Run focused Coding Waboose review
        run: |
          cat > /tmp/waboose-request.json <<'JSON'
          {
            "objective": "Review the finalized WebGL2 renderer lifecycle, failure cleanup, Construction recording claims, operator guide, and AI-agent harness documentation",
            "mode": "files",
            "changed_files": [
              "aura_spatial_web/webgl2_renderer.js",
              "aura_spatial_web/construction_demo_app.js",
              "tests/js/spatial-webgl2.test.mjs",
              "tests/js/spatial-webgl2-failure-injection.test.mjs",
              "tests/js/spatial-construction-review-regressions.test.mjs",
              "docs/AURA_CONSTRUCTION_DEMO_OPERATOR_GUIDE.md",
              "docs/AURA_CONSTRUCTION_ARENA_G7_G8.md",
              "README.md",
              "USER_GUIDE.md",
              ".aura/ARCHITECTURE.md"
            ],
            "profile": "exhaustive",
            "risk_map": ["correctness", "security", "resource_lifecycle", "authority", "documentation"],
            "invariants": [
              "partial WebGL allocation failures release or retain every handle truthfully",
              "cleanup failures preserve the original failure and remain retryable",
              "renderer state fails closed",
              "unsupported browser modes are visibly disabled",
              "harnesses remain review or proposal surfaces without automatic merge authority"
            ],
            "run_tests": false
          }
          JSON
          python aura_coding_waboose_cli.py \
            --repo-root . \
            --state-file /tmp/aura-waboose-state.json \
            run --request /tmp/waboose-request.json \
            > /tmp/aura-waboose-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/aura-waboose-result.json").read_text())
          assert payload.get("ok") is True, payload

          findings = []
          repairs = []
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in {"findings", "normalized_findings"} and isinstance(item, list):
                          findings.extend(item)
                      if key == "forge_repair_requests" and isinstance(item, list):
                          repairs.extend(item)
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(payload)
          assert not repairs, repairs
          blocking = [
              item for item in findings
              if isinstance(item, dict)
              and str(item.get("evidence_status", item.get("status", ""))).lower()
                  in {"confirmed", "corroborated"}
          ]
          assert not blocking, blocking
          print(json.dumps({"ok": True, "finding_count": len(findings), "repair_count": 0}, indent=2))
          PY

      - name: Upload Waboose evidence
        uses: actions/upload-artifact@v4
        with:
          name: construction-webgl2-waboose-evidence
          path: /tmp/aura-waboose-result.json
          retention-days: 7

