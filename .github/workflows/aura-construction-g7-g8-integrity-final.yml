name: Finalize Construction WebGL2, operator docs, and harness guidance

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/aura-construction-g7-g8-integrity-final.yml"

permissions:
  contents: write

concurrency:
  group: aura-construction-g7-g8-integrity-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff bandit

      - name: Apply fail-closed WebGL2 lifecycle and documentation finalization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          renderer = Path("aura_spatial_web/webgl2_renderer.js")
          text = renderer.read_text(encoding="utf-8")

          initialize_pattern = re.compile(
              r'''  initialize\(scenePayload, planPayload\) \{.*?\n  \}\n\n  present\(''',
              re.DOTALL,
          )
          initialize_replacement = '''  initialize(scenePayload, planPayload) {
            super.initialize(scenePayload, planPayload);
            this.gl =
              this.gl ||
              this.canvas?.getContext?.("webgl2", {
                antialias: true,
                alpha: false,
                powerPreference: "high-performance",
              });
            if (!this.gl) {
              this.scene = null;
              this.plan = null;
              this.state = RENDERER_STATES.LOST;
              throw new Error("WebGL2 unavailable");
            }
            let program = null;
            const buffers = [];
            try {
              program = createProgram(this.gl, VERTEX, FRAGMENT);
              const entityPositions = new Float32Array(
                this.scene.entities.flatMap((entity) => entity.position),
              );
              const byId = new Map(
                this.scene.entities.map((entity) => [entity.entity_id, entity.position]),
              );
              const linkPositions = new Float32Array(
                this.scene.links.flatMap((link) => [
                  ...byId.get(link.source_entity_id),
                  ...byId.get(link.target_entity_id),
                ]),
              );
              const entityBuffer = createBuffer(this.gl, entityPositions);
              buffers.push(entityBuffer);
              const linkBuffer = createBuffer(this.gl, linkPositions);
              buffers.push(linkBuffer);

              this.program = program;
              this.entityBuffer = entityBuffer;
              this.linkBuffer = linkBuffer;
              this.buffers = [...buffers];
              this.resources.add(program);
              for (const buffer of buffers) this.resources.add(buffer);
              return this.status();
            } catch (error) {
              this.program = program;
              this.buffers = [...buffers];
              this.entityBuffer = buffers[0] || null;
              this.linkBuffer = buffers[1] || null;
              if (program) this.resources.add(program);
              for (const buffer of buffers) this.resources.add(buffer);
              const cleanupErrors = this._releaseGpuResources({ loseContext: true });
              this.entityScreenPositions.clear();
              this.scene = null;
              this.plan = null;
              this.state = RENDERER_STATES.LOST;
              throw combineFailure(
                error,
                cleanupErrors,
                "WebGL2 initialization and cleanup failed",
              );
            }
          }

          present('''
          text, count = initialize_pattern.subn(initialize_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"WebGL2 initialize span count was {count}")

          dispose_pattern = re.compile(
              r'''  dispose\(\) \{.*?\n  \}\n\}''',
              re.DOTALL,
          )
          dispose_replacement = '''  _releaseGpuResources({ loseContext = false } = {}) {
            const errors = [];
            const failedBuffers = [];
            for (const buffer of [...this.buffers].reverse()) {
              try {
                this.gl?.deleteBuffer?.(buffer);
                this.resources.delete(buffer);
              } catch (error) {
                errors.push(error);
                failedBuffers.unshift(buffer);
              }
            }
            this.buffers = failedBuffers;
            this.entityBuffer = failedBuffers.includes(this.entityBuffer)
              ? this.entityBuffer
              : null;
            this.linkBuffer = failedBuffers.includes(this.linkBuffer)
              ? this.linkBuffer
              : null;

            if (this.program) {
              try {
                this.gl?.deleteProgram?.(this.program);
                this.resources.delete(this.program);
                this.program = null;
              } catch (error) {
                errors.push(error);
              }
            }

            if (loseContext && !this.contextLost) {
              try {
                const extension = this.gl?.getExtension?.("WEBGL_lose_context");
                if (extension?.loseContext) {
                  extension.loseContext();
                  this.contextLost = true;
                  this.buffers = [];
                  this.entityBuffer = null;
                  this.linkBuffer = null;
                  this.program = null;
                  this.resources.clear();
                }
              } catch (error) {
                errors.push(error);
              }
            }
            return errors;
          }

          dispose() {
            if (this.state === RENDERER_STATES.DISPOSED) return this.status();
            const errors = this._releaseGpuResources({ loseContext: true });
            this.entityScreenPositions.clear();
            this.scene = null;
            this.plan = null;
            if (errors.length) {
              this.state = RENDERER_STATES.LOST;
              throw errors.length === 1
                ? errors[0]
                : new AggregateError(errors, "WebGL2 disposal failed");
            }
            return super.dispose();
          }
        }'''
          text, count = dispose_pattern.subn(dispose_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"WebGL2 dispose span count was {count}")

          helper_pattern = re.compile(
              r'''function createShader\(gl, type, source\) \{.*?\n\}\n\nfunction setMatrix''',
              re.DOTALL,
          )
          helper_replacement = '''function combineFailure(primary, cleanupErrors, message) {
            if (!cleanupErrors.length) return primary;
            return new AggregateError([primary, ...cleanupErrors], message);
          }

          function attemptCleanup(errors, callback) {
            try {
              callback();
            } catch (error) {
              errors.push(error);
            }
          }

          function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            if (!shader) throw new Error("unable to allocate shader");
            try {
              gl.shaderSource(shader, source);
              gl.compileShader(shader);
              if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                const log = gl.getShaderInfoLog(shader);
                throw new Error(`shader compile failed: ${log}`);
              }
              return shader;
            } catch (error) {
              const cleanupErrors = [];
              attemptCleanup(cleanupErrors, () => gl.deleteShader(shader));
              throw combineFailure(error, cleanupErrors, "shader creation and cleanup failed");
            }
          }

          function createProgram(gl, vertexSource, fragmentSource) {
            const shaders = [];
            let program = null;
            let primaryError = null;
            try {
              shaders.push(createShader(gl, gl.VERTEX_SHADER, vertexSource));
              shaders.push(createShader(gl, gl.FRAGMENT_SHADER, fragmentSource));
              program = gl.createProgram();
              if (!program) throw new Error("unable to allocate program");
              gl.attachShader(program, shaders[0]);
              gl.attachShader(program, shaders[1]);
              gl.linkProgram(program);
              if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                const log = gl.getProgramInfoLog(program);
                throw new Error(`program link failed: ${log}`);
              }
            } catch (error) {
              primaryError = error;
            }

            const cleanupErrors = [];
            for (const shader of [...shaders].reverse()) {
              attemptCleanup(cleanupErrors, () => gl.deleteShader(shader));
            }
            if (primaryError) {
              if (program) {
                attemptCleanup(cleanupErrors, () => gl.deleteProgram(program));
              }
              throw combineFailure(
                primaryError,
                cleanupErrors,
                "program creation and cleanup failed",
              );
            }
            if (cleanupErrors.length) {
              const cleanupFailure = new Error("linked program shader cleanup failed");
              if (program) {
                attemptCleanup(cleanupErrors, () => gl.deleteProgram(program));
              }
              throw combineFailure(
                cleanupFailure,
                cleanupErrors,
                "program creation and cleanup failed",
              );
            }
            return program;
          }

          function createBuffer(gl, data) {
            const buffer = gl.createBuffer();
            if (!buffer) throw new Error("unable to allocate buffer");
            try {
              gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
              gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
              return buffer;
            } catch (error) {
              const cleanupErrors = [];
              attemptCleanup(cleanupErrors, () => gl.deleteBuffer(buffer));
              throw combineFailure(error, cleanupErrors, "buffer upload and cleanup failed");
            }
          }

          function setMatrix'''
          text, count = helper_pattern.subn(helper_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"WebGL2 helper span count was {count}")

          text = text.replace(
              "    this.entityScreenPositions = new Map();\n",
              "    this.entityScreenPositions = new Map();\n"
              "    this.entityBuffer = null;\n"
              "    this.linkBuffer = null;\n"
              "    this.contextLost = false;\n",
              1,
          )
          renderer.write_text(text, encoding="utf-8")

          failure_test = Path("tests/js/spatial-webgl2-failure-injection.test.mjs")
          failure_test.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";

          import { WebGL2Renderer } from "../../aura_spatial_web/webgl2_renderer.js";
          import { planFixture, sceneFixture } from "./spatial-fixture.mjs";

          function fakeGL(options = {}) {
            let id = 0;
            let shaderAllocation = 0;
            let bufferAllocation = 0;
            let bufferUpload = 0;
            const calls = [];
            const gl = {
              calls,
              VERTEX_SHADER: 1,
              FRAGMENT_SHADER: 2,
              COMPILE_STATUS: 3,
              LINK_STATUS: 4,
              ARRAY_BUFFER: 5,
              STATIC_DRAW: 6,
              FLOAT: 7,
              LINES: 8,
              POINTS: 9,
              DEPTH_TEST: 10,
              COLOR_BUFFER_BIT: 1,
              DEPTH_BUFFER_BIT: 2,
              createShader(type) {
                shaderAllocation += 1;
                calls.push(["createShader", type]);
                if (options.failShaderAllocation === shaderAllocation) return null;
                return { id: ++id, type };
              },
              shaderSource(shader) {
                calls.push(["shaderSource", shader.id]);
                if (options.throwShaderSource) throw new Error("shaderSource exploded");
              },
              compileShader(shader) {
                calls.push(["compileShader", shader.id]);
                if (options.throwCompileShader) throw new Error("compileShader exploded");
              },
              getShaderParameter(shader) {
                return options.failShaderCompileType !== shader.type;
              },
              getShaderInfoLog: () => "compile diagnostic",
              deleteShader(shader) {
                calls.push(["deleteShader", shader.id]);
                if (options.throwDeleteShader) throw new Error("deleteShader exploded");
              },
              createProgram() {
                calls.push(["createProgram"]);
                return options.failProgramAllocation ? null : { id: ++id };
              },
              attachShader(program, shader) {
                calls.push(["attachShader", program.id, shader.id]);
                if (options.throwAttachShader) throw new Error("attachShader exploded");
              },
              linkProgram(program) {
                calls.push(["linkProgram", program.id]);
                if (options.throwLinkProgram) throw new Error("linkProgram exploded");
              },
              getProgramParameter: () => !options.failProgramLink,
              getProgramInfoLog: () => "link diagnostic",
              deleteProgram(program) {
                calls.push(["deleteProgram", program.id]);
                if (options.throwDeleteProgram) throw new Error("deleteProgram exploded");
              },
              createBuffer() {
                bufferAllocation += 1;
                calls.push(["createBuffer", bufferAllocation]);
                if (options.failBufferAllocation === bufferAllocation) return null;
                return { id: ++id, allocation: bufferAllocation };
              },
              bindBuffer(_target, buffer) {
                calls.push(["bindBuffer", buffer.id]);
                if (options.throwBindBufferAt === buffer.allocation) {
                  throw new Error("bindBuffer exploded");
                }
              },
              bufferData() {
                bufferUpload += 1;
                calls.push(["bufferData", bufferUpload]);
                if (options.throwBufferDataAt === bufferUpload) {
                  throw new Error("bufferData exploded");
                }
              },
              deleteBuffer(buffer) {
                calls.push(["deleteBuffer", buffer.id]);
                if (options.throwDeleteBuffer) throw new Error("deleteBuffer exploded");
              },
              viewport() {},
              enable() {},
              clearColor() {},
              clear() {},
              useProgram() {},
              getAttribLocation: () => 0,
              enableVertexAttribArray() {},
              vertexAttribPointer() {},
              getUniformLocation: () => 0,
              uniformMatrix4fv() {},
              uniform4fv() {},
              uniform1f() {},
              drawArrays() {},
              getExtension() {
                if (options.noLoseContext) return null;
                return {
                  loseContext() {
                    calls.push(["lose"]);
                    if (options.throwLoseContext) throw new Error("loseContext exploded");
                  },
                };
              },
            };
            return gl;
          }

          function expectInitializationFailure(options, pattern) {
            const gl = fakeGL(options);
            const renderer = new WebGL2Renderer({ gl });
            assert.throws(
              () => renderer.initialize(sceneFixture(), planFixture("WEBGL2")),
              pattern,
            );
            assert.equal(renderer.status().state, "LOST");
            return { gl, renderer };
          }

          test("WebGL2 releases a first buffer when the second allocation fails", () => {
            const { gl, renderer } = expectInitializationFailure(
              { failBufferAllocation: 2 },
              /unable to allocate buffer/,
            );
            assert.equal(gl.calls.filter(([name]) => name === "deleteBuffer").length, 1);
            assert.equal(gl.calls.filter(([name]) => name === "deleteProgram").length, 1);
            assert.equal(gl.calls.filter(([name]) => name === "lose").length, 1);
            assert.equal(renderer.status().resource_count, 0);
          });

          test("WebGL2 releases a buffer whose upload throws", () => {
            const { gl, renderer } = expectInitializationFailure(
              { throwBufferDataAt: 1 },
              /bufferData exploded/,
            );
            assert.equal(gl.calls.filter(([name]) => name === "deleteBuffer").length, 1);
            assert.equal(renderer.status().resource_count, 0);
          });

          test("WebGL2 releases earlier shaders when fragment allocation fails", () => {
            const { gl } = expectInitializationFailure(
              { failShaderAllocation: 2 },
              /unable to allocate shader/,
            );
            assert.equal(gl.calls.filter(([name]) => name === "deleteShader").length, 1);
            assert.equal(gl.calls.filter(([name]) => name === "lose").length, 1);
          });

          test("WebGL2 releases shaders when program allocation or linking fails", () => {
            for (const options of [
              { failProgramAllocation: true },
              { failProgramLink: true },
              { throwAttachShader: true },
              { throwLinkProgram: true },
            ]) {
              const { gl, renderer } = expectInitializationFailure(options, /program|attachShader|linkProgram/);
              assert.equal(gl.calls.filter(([name]) => name === "deleteShader").length, 2);
              assert.equal(renderer.status().resource_count, 0);
            }
          });

          test("WebGL2 preserves cleanup failures while context loss releases handles", () => {
            const { gl, renderer } = expectInitializationFailure(
              { failBufferAllocation: 2, throwDeleteBuffer: true },
              AggregateError,
            );
            assert.equal(gl.calls.filter(([name]) => name === "lose").length, 1);
            assert.equal(renderer.status().resource_count, 0);
            assert.equal(renderer.dispose().state, "DISPOSED");
          });

          test("WebGL2 retains failed releases for a later disposal retry", () => {
            const options = {
              failBufferAllocation: 2,
              throwDeleteBuffer: true,
              throwLoseContext: true,
            };
            const { gl, renderer } = expectInitializationFailure(options, AggregateError);
            assert.equal(renderer.status().resource_count, 1);
            options.throwDeleteBuffer = false;
            options.throwLoseContext = false;
            assert.equal(renderer.dispose().state, "DISPOSED");
            assert.equal(renderer.status().resource_count, 0);
            assert.ok(gl.calls.filter(([name]) => name === "deleteBuffer").length >= 2);
          });

          test("WebGL2 compile cleanup failures remain terminal and inspectable", () => {
            const { gl, renderer } = expectInitializationFailure(
              { failShaderCompileType: 1, throwDeleteShader: true },
              AggregateError,
            );
            assert.equal(renderer.status().state, "LOST");
            assert.equal(gl.calls.filter(([name]) => name === "lose").length, 1);
          });

          test("WebGL2 survives repeated initialize, present, and dispose cycles", () => {
            for (let index = 0; index < 64; index += 1) {
              const gl = fakeGL();
              const renderer = new WebGL2Renderer({ gl });
              renderer.initialize(sceneFixture(), planFixture("WEBGL2"));
              renderer.present({ width: 640 + (index % 3), height: 360 + (index % 5) });
              assert.equal(renderer.dispose().state, "DISPOSED");
              assert.equal(renderer.dispose().state, "DISPOSED");
              assert.equal(renderer.status().resource_count, 0);
            }
          });
          ''', encoding="utf-8")

          app = Path("aura_spatial_web/construction_demo_app.js")
          app_text = app.read_text(encoding="utf-8")
          original = '''  await state.renderer.initialize(state.packet.scene, state.packet.render_plan, {
            meshPayloads: meshPayloads(state.packet.scene),
            gaussianPayloads: gaussianPayloads(state.packet.scene),
          });
          buildControls();'''
          replacement = '''  await state.renderer.initialize(state.packet.scene, state.packet.render_plan, {
            meshPayloads: meshPayloads(state.packet.scene),
            gaussianPayloads: gaussianPayloads(state.packet.scene),
          });
          state.renderer.setRepresentationMode("SPLATS");
          document.querySelectorAll("button[data-mode]").forEach((button) => {
            const supported = button.dataset.mode === "SPLATS";
            button.disabled = !supported;
            button.classList.toggle("active", supported);
            if (!supported) {
              button.title = "Browser GLB decoding and mesh drawing are not implemented; mode is fail-closed";
            }
          });
          buildControls();'''
          if original not in app_text:
              raise RuntimeError("Construction renderer initialization span changed")
          app.write_text(app_text.replace(original, replacement, 1), encoding="utf-8")

          review_test = Path("tests/js/spatial-construction-review-regressions.test.mjs")
          review_text = review_test.read_text(encoding="utf-8")
          review_addition = r'''

          test("Construction recording UI advertises only implemented representation modes", async () => {
            const { readFile } = await import("node:fs/promises");
            const source = await readFile(
              new URL("../../aura_spatial_web/construction_demo_app.js", import.meta.url),
              "utf8",
            );
            assert.match(source, /setRepresentationMode\("SPLATS"\)/);
            assert.match(source, /button\.disabled = !supported/);
            assert.match(source, /Browser GLB decoding and mesh drawing are not implemented/);
          });
          '''
          if "advertises only implemented representation modes" not in review_text:
              review_test.write_text(review_text + review_addition, encoding="utf-8")

          operator_guide = Path("docs/AURA_CONSTRUCTION_DEMO_OPERATOR_GUIDE.md")
          operator_guide.write_text(r'''# Aura Construction Arena Demo — Operator and AI-Agent Guide

          ## Purpose

          This guide explains how to compile, launch, record, verify, troubleshoot, and safely modify AuraOS's deterministic Construction Arena demonstration.

          The demo is a local, synthetic, presentation-only surface. It does not control a real project, release work, approve a contractor, operate equipment, certify a design, issue a permit, release payment, or mutate canonical Construction truth.

          ## What is implemented

          The G0–G8 chain provides:

          ```text
          source/provenance contracts
            → deterministic IFC storey, GLB, and SVG compilation
            → bounded degree-0 Gaussian assets
            → synthetic Construction project fixture
            → immutable Spatial Projection V2
            → WebGL2 Gaussian, graph, and overlay presentation
            → deterministic director tours
            → Observatory evidence and a human decision packet
            → exact renderer dissolution
          ```

          The browser recording client currently renders the deterministic Gaussian fallback plus graph and overlay context. Mesh contracts remain part of the architecture, but browser GLB decoding and a real mesh draw pass are not implemented; mesh and hybrid controls therefore remain disabled and fail closed.

          ## Prerequisites

          - Python 3.10 or newer;
          - Node.js 22 for JavaScript verification;
          - a clean AuraOS checkout;
          - loopback access to `127.0.0.1`;
          - no external network is required at runtime.

          ## Fastest launch

          ```bash
          python aura_spatial_cli.py \
            --repo-root . \
            construction-video-demo \
            --tour full \
            --serve
          ```

          Open:

          ```text
          http://127.0.0.1:8767/demo/construction?tour=full
          ```

          The server accepts loopback hosts only. Do not expose it through `0.0.0.0`, a public interface, or a reverse proxy without a separate security review.

          ## Compile a packet without serving

          ```bash
          python aura_spatial_cli.py \
            --repo-root . \
            construction-video-demo \
            --tour full \
            --output /tmp/aura-construction-demo.packet.json
          ```

          Inspect the packet before recording:

          ```bash
          python -m json.tool /tmp/aura-construction-demo.packet.json | less
          ```

          Expected authority fields remain false, while `human_review_required` remains true.

          ## Tour modes

          - `full` — complete 18-step recording sequence;
          - `blocked-work` — blocked drilling, evidence, unsafe option, and cleanup;
          - `alternatives` — blocked option, admissible alternative, time/cost/idle comparison, and human review;
          - `timeline` — storey separation, floor plans, progress replay, and trade history.

          Change the tour in the command or URL:

          ```bash
          python aura_spatial_cli.py --repo-root . construction-video-demo --tour alternatives --serve
          ```

          ```text
          http://127.0.0.1:8767/demo/construction?tour=alternatives
          ```

          ## Recording controls

          The implemented recording surface supports:

          ```text
          orbit · zoom · storey isolation · show all · explode · collapse
          splats · floor plans · work status · trades · blockers · budgets
          inspections · dependencies · synthetic rules · timeline scrub
          picking · reset · play · pause · next step · dissolve
          ```

          Mesh and hybrid buttons are visibly disabled until repository-owned browser GLB decoding and a real mesh draw pass exist.

          For a clean recording:

          1. use a 16:9 browser window;
          2. open the full tour URL;
          3. wait for `Fallback pack ready`;
          4. verify attribution is visible;
          5. start screen recording;
          6. use Play, Pause, and Next Step as needed;
          7. finish on Dissolve and confirm zero active presentation resources.

          ## Fallback pack versus admitted generated pack

          Omit `--asset-pack` for the deterministic five-storey Gaussian recording fallback.

          An admitted generated pack may be compiled and contract-validated:

          ```bash
          python aura_spatial_cli.py \
            --repo-root . \
            construction-video-demo \
            --asset-pack demo_assets/construction_tuwien/generated/asset-pack.manifest.json \
            --tour full \
            --output /tmp/aura-construction-real-pack.packet.json
          ```

          The browser intentionally refuses real-pack rendering until GLB/SPZ browser decoders and a real mesh draw pass are implemented. It never substitutes fabricated fallback geometry for admitted real digests.

          ## Security boundary

          The local server serves only:

          - `aura_spatial_web/` files required by the interface;
          - generated Construction demo assets under the admitted directory;
          - the deterministic `/api/construction-demo` packet.

          It rejects traversal, encoded traversal, backslash paths, NUL paths, unrelated repository files, non-loopback hosts, and invalid ports. Responses use no-store caching, content-type hardening, no-referrer policy, and a restrictive Content Security Policy.

          ## Focused verification

          ```bash
          python -m py_compile aura_construction_demo_director.py aura_spatial_cli.py

          ruff check \
            aura_construction_demo_director.py \
            aura_spatial_cli.py \
            tests/test_aura_construction_demo_director.py

          pytest -q \
            tests/test_aura_construction_demo_director.py \
            tests/test_aura_construction_demo_fixture.py \
            tests/test_aura_construction_demo_projection.py

          node --test \
            tests/js/spatial-webgl2.test.mjs \
            tests/js/spatial-webgl2-failure-injection.test.mjs \
            tests/js/spatial-construction-demo.test.mjs \
            tests/js/spatial-construction-review-regressions.test.mjs \
            tests/js/spatial-gaussian-covariance.test.mjs
          ```

          ## Use Aura's own review and architecture tools

          Read `.aura/CODEMAP.md` first, then use the Architecture Harness for a reproducible repository view:

          ```bash
          python scripts/aura_architecture_harness.py --repo-root . doctor
          ```

          Prepare an AI-safe source handoff outside the checkout:

          ```bash
          python scripts/aura_architecture_harness.py \
            --repo-root . \
            handoff \
            --output-dir ../AuraOS-ai-handoff
          ```

          Run Waboose on the focused Construction surface:

          ```bash
          python aura_coding_waboose_cli.py --repo-root . run --request waboose_request.json
          ```

          Waboose is review-only. It does not patch, commit, push, approve, or merge. Use exact findings as inputs to a separate repair and verification pass.

          ## Troubleshooting

          ### `WebGL2 unavailable`

          Confirm the browser exposes WebGL2 and that hardware acceleration is enabled. The renderer fails closed instead of silently changing evidence class.

          ### The browser rejects an admitted real pack

          This is intentional. Use the fallback for recording or implement and review repository-owned GLB/SPZ decoders and a real mesh pass.

          ### A renderer enters `LOST`

          Inspect the original error and any cleanup errors. The renderer attempts all releases, loses the WebGL context when available, retains unresolved handles when release cannot be proven, and permits a bounded disposal retry.

          ### Generated maps are stale

          Regenerate only after source and tests stabilize:

          ```bash
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          ```

