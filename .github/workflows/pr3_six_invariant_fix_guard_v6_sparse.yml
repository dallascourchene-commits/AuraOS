name: PR3 six-invariant guarded repair v6 sparse

on:
  push:
    branches:
      - analysis/pr3-six-invariant-fixes-v6-sparse

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Sparse checkout repair control branch
        uses: actions/checkout@v4
        with:
          ref: analysis/pr3-six-invariant-fixes-v6-sparse
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/pr3_six_invariant_fix_guard_v6_sparse.yml
            aura_project_context_compiler.py
            aura_ephemeral_workspace_contracts.py
            aura_ephemeral_path_policy.py
            tests/test_aura_project_context_compiler.py
            tests/test_aura_project_context_acceptance.py
            schemas/aura_projection_selection_receipt_v1.schema.json
            docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md

      - name: Recover repair payload and switch to exact PR3 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin analysis/pr3-six-invariant-fixes-v4
          git show FETCH_HEAD:tools/tmp_pr3_six_invariant_fix_v4.py > /tmp/pr3_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/pr3_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected exactly one anchor, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    if count != 1:\n        if label == "consider optional expired parameter" and count == 2:\n            return text.replace(old, new, 1)\n        raise SystemExit(f"{label}: expected exactly one anchor, found {count}")\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('once helper patch anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git fetch --depth=1 origin refactor/source-first-project-context-pr3
          test "$(git rev-parse FETCH_HEAD)" = "6c8833785a8602560af2f355cc2ad0dab88b2499"
          git checkout --detach 6c8833785a8602560af2f355cc2ad0dab88b2499

      - name: Apply six invariant fixes
        shell: bash
        run: |
          set +e
          output="$(python /tmp/pr3_fix.py 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            safe="${output//$'\n'/%0A}"
            echo "::error title=PR3 transform mismatch::$safe"
            exit "$status"
          fi

      - name: Normalize repaired-file whitespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "aura_project_context_compiler.py",
              "tests/test_aura_project_context_compiler.py",
              "tests/test_aura_project_context_acceptance.py",
              "docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md",
          ):
              path = Path(name)
              lines = path.read_text(encoding="utf-8").splitlines()
              path.write_text(
                  "\n".join(line.rstrip(" \t") for line in lines) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install focused verification tools
        shell: bash
        run: python -m pip install --quiet pytest jsonschema ruff

      - name: Python compile
        shell: bash
        run: python -m py_compile aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py

      - name: Fatal Ruff classes
        shell: bash
        run: python -m ruff check --select E9,F63,F7,F82 aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py

      - name: Direct repaired-file whitespace proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = (
              Path("aura_project_context_compiler.py"),
              Path("tests/test_aura_project_context_compiler.py"),
              Path("tests/test_aura_project_context_acceptance.py"),
              Path("docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md"),
          )
          failures = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), 1):
                  if line.endswith((" ", "\t")):
                      failures.append(f"{path}:{number}")
              if not text.endswith("\n"):
                  failures.append(f"{path}:missing-final-newline")
          if failures:
              raise SystemExit("whitespace violations: " + ", ".join(failures))
          print("direct whitespace proof passed for repaired files")
          PY

      - name: Focused PR3 tests
        shell: bash
        run: python -m pytest -q tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py

      - name: Commit and guarded fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aura PR3 Guarded Repair"
          git config user.email "actions@users.noreply.github.com"
          git add aura_project_context_compiler.py tests/test_aura_project_context_compiler.py tests/test_aura_project_context_acceptance.py docs/AURA_SOURCE_FIRST_PROJECT_CONTEXT_PR3.md
          git commit -m "PR3: close six temporal and provenance invariant gaps"
          git fetch --depth=1 origin refactor/source-first-project-context-pr3
          test "$(git rev-parse FETCH_HEAD)" = "6c8833785a8602560af2f355cc2ad0dab88b2499"
          git push origin HEAD:refactor/source-first-project-context-pr3
