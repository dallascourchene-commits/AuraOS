name: Aura GLM53 G6 Gate10 Owner Host Evidence Request

on:
  pull_request:
    paths:
      - "tools/awj032/glm53_g6_gate10_owner_host_evidence_request.py"
      - "tools/awj032/test_glm53_g6_gate10_owner_host_evidence_request.py"
      - "docs/arena/AWJ032_G6_GATE10_OWNER_HOST_EVIDENCE_REQUEST_20260831.md"
      - ".github/workflows/aura-glm53-g6-gate10-owner-host-evidence-request.yml"
  push:
    branches: ["arena/glm53-g6-gate10-owner-host-evidence-request-v2-20260831-sol"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  g6-owner-host-evidence-request-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REUSE_HEAD: "d1a0f94255527835a59a70a0af7dc417ba1d023d"
      REUSE_SOURCE_BLOB: "d171d0938e469a4383490d1a691750c2068f21e7"
      REUSE_TEST_BLOB: "58fad37a0f89853098fa3dbbe2f2a1771574e449"
      REUSE_RUN: "33437612722"
      REUSE_JOB: "99637780915"
      Q18_HEAD: "aed81432db8b84d2f43b8a85d06d4b72e16f6a50"
      Q18_SOURCE_BLOB: "4cee26edaf0759fc80d31889ab9e4e268f9a4fbe"
      Q18_RUN: "33436580962"
      Q18_JOB: "99634379758"
      Q18_RECEIPT_DIGEST: "c53acb3ff471dbe3971ee4e7a75b28c4316b50fba88a414f406b93c271c90230"
      PROV_HEAD: "293c59d7260372ccd3b9e8130b12979b052c3ed9"
      PROV_SOURCE_BLOB: "98db548b6e8f7443b79d979eb0e177ac6aa68534"
      PROV_RUN: "33416248604"
      PROV_JOB: "99567478616"
      C2_HANDOFF_HEAD: "24a5404ee3b987dee12192917e40b35d3a43e81c"
      C2_HANDOFF_SOURCE_BLOB: "91da9f6f5c9c8175fbe123634e53e14bc9ba3cbe"
      C2_HANDOFF_RUN: "33360061584"
      LIFECYCLE_RETURN_HEAD: "aa3fcd9a4cefd18dbc991c3e8a450fcfbbb6726b"
      LIFECYCLE_RETURN_SOURCE_BLOB: "8e57494c1c77eb41d6a402aa7dceb43121512863"
      LIFECYCLE_RETURN_RUN: "33360529366"
    steps:
      - name: Fetch exact candidate, parents, Q18 lineage and canonical return owners
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$TARGET_SHA" "$REUSE_HEAD" "$Q18_HEAD" "$PROV_HEAD" "$C2_HANDOFF_HEAD" "$LIFECYCLE_RETURN_HEAD"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Authenticate exact semantic blobs and inherited Q18 pin
        run: |
          set -euo pipefail
          test "$(git rev-parse "$REUSE_HEAD:tools/aura_generation_bound_admission_reuse.py")" = "$REUSE_SOURCE_BLOB"
          test "$(git rev-parse "$REUSE_HEAD:tests/test_aura_generation_bound_admission_reuse.py")" = "$REUSE_TEST_BLOB"
          test "$(git rev-parse "$Q18_HEAD:tools/quantization/aura_glm53_current_generation_bounded_c2_proposal.py")" = "$Q18_SOURCE_BLOB"
          test "$(git rev-parse "$PROV_HEAD:tools/awj032/airllm_secure_fixture_observation_envelope.py")" = "$PROV_SOURCE_BLOB"
          test "$(git rev-parse "$C2_HANDOFF_HEAD:tools/awj032/glm53_owner_host_c2_handoff.py")" = "$C2_HANDOFF_SOURCE_BLOB"
          test "$(git rev-parse "$LIFECYCLE_RETURN_HEAD:tools/awj032/glm53_owner_host_lifecycle_return_packet.py")" = "$LIFECYCLE_RETURN_SOURCE_BLOB"
          git show "$REUSE_HEAD:tools/aura_generation_bound_admission_reuse.py" | grep -q "$Q18_HEAD"
          git show "$REUSE_HEAD:tools/aura_generation_bound_admission_reuse.py" | grep -q "$Q18_SOURCE_BLOB"
          git show "$Q18_HEAD:tools/quantization/aura_glm53_current_generation_bounded_c2_proposal.py" | grep -q 'BOUNDED_REPRESENTATIVE_E8_C2_REQUEST_PROPOSAL_ELIGIBLE'
          echo "G6_EXACT_PARENT_Q18_AND_RETURN_OWNER_BLOBS=true"

      - name: Revalidate two terminal parent hosted proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          parents=(
            (int(os.environ['REUSE_RUN']),int(os.environ['REUSE_JOB']),os.environ['REUSE_HEAD'],'Aura Generation Bound Admission Reuse Proof'),
            (int(os.environ['PROV_RUN']),int(os.environ['PROV_JOB']),os.environ['PROV_HEAD'],'AWJ032 Secure Fixture Observation Envelope'),
          )
          for run_id,job_id,head,name in parents:
            run=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
            assert run['head_sha']==head and run['name']==name and run['status']=='completed' and run['conclusion']=='success',run
            job=get(f'https://api.github.com/repos/{repo}/actions/jobs/{job_id}')
            assert job['head_sha']==head and job['status']=='completed' and job['conclusion']=='success',job
          print('G6_TWO_TERMINAL_PARENT_PROOFS_REVALIDATED=true')
          PY

      - name: Revalidate transitive Q18 receipt generation and canonical return owners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          q18=get(f"https://api.github.com/repos/{repo}/actions/runs/{os.environ['Q18_RUN']}")
          assert q18['head_sha']==os.environ['Q18_HEAD'] and q18['name']=='GLM53 Current Generation Bounded C2 Proposal' and q18['status']=='completed' and q18['conclusion']=='success',q18
          q18_job=get(f"https://api.github.com/repos/{repo}/actions/jobs/{os.environ['Q18_JOB']}")
          assert q18_job['head_sha']==os.environ['Q18_HEAD'] and q18_job['status']=='completed' and q18_job['conclusion']=='success',q18_job
          for run_key,head_key,name in (
            ('C2_HANDOFF_RUN','C2_HANDOFF_HEAD','AWJ032 GLM53 Owner Host C2 Handoff'),
            ('LIFECYCLE_RETURN_RUN','LIFECYCLE_RETURN_HEAD','AWJ032 GLM53 Owner Host Lifecycle Return Packet'),
          ):
            run=get(f"https://api.github.com/repos/{repo}/actions/runs/{os.environ[run_key]}")
            assert run['head_sha']==os.environ[head_key] and run['name']==name and run['status']=='completed' and run['conclusion']=='success',run
          print('G6_TRANSITIVE_Q18_PROOF_REVALIDATED=true')
          print('G6_CANONICAL_RETURN_PATH_REVALIDATED=true')
          PY

      - name: Compile and execute canonical G6 adversarials
        run: |
          set -euo pipefail
          python3 -m py_compile tools/awj032/glm53_g6_gate10_owner_host_evidence_request.py tools/awj032/test_glm53_g6_gate10_owner_host_evidence_request.py
          python3 -m unittest -v tools.awj032.test_glm53_g6_gate10_owner_host_evidence_request

      - name: Exhaust request and reuse-identity Different-J surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools.awj032.glm53_g6_gate10_owner_host_evidence_request import prove_different_j, prove_reuse_identity_different_j
          assert prove_different_j()==512
          assert prove_reuse_identity_different_j()==32
          print('G6_DIFFERENT_J_512=PASS')
          print('G6_REUSE_IDENTITY_DIFFERENT_J_32=PASS')
          PY

      - name: Enforce single-owner identity and Gate10 nonpromotion laws
        run: |
          set -euo pipefail
          target=tools/awj032/glm53_g6_gate10_owner_host_evidence_request.py
          grep -q 'ExactQ18AdmissionReceiptMustRemainBound' "$target"
          grep -q 'PR769ReuseDigestMustCommitExactIdentityVector' "$target"
          grep -q 'DigestShape!=DigestRelationProof' "$target"
          grep -q 'SingleOwnerCompilerEliminatesPostHocIdentityJoin' "$target"
          grep -q 'CallerSuppliedPrecompiledRequest!=IdentityBoundRequest' "$target"
          grep -q 'IdentityBinding!=ReceiptProducerAuthentication' "$target"
          grep -q 'CallerWitness!=BackendObservationProvenance' "$target"
          grep -q 'CanonicalC2ReturnPath!=ProducerAuthentication' "$target"
          grep -q 'Gate10DebtMustRemainExplicitUntilObserved' "$target"
          grep -q 'CoordinateMemory!=MODEL_PREFIX_KV' "$target"
          grep -q "$Q18_RECEIPT_DIGEST" "$target"
          echo "REUSE_RECEIPT_PRODUCER_AUTHENTICATED=false"
          echo "SOURCE_CURRENTNESS_PROVEN=false"
          echo "OWNER_HOST_EXECUTION_OBSERVED=false"
          echo "AUTHENTICATED_PHYSICAL_OBSERVATION=false"
          echo "FULL_FLAGSHIP_MODEL_LOADED=false"
          echo "AURAOS_RESIDENT_ROUTING_PROVEN=false"
          echo "GATE10_PROMOTED=false"
