name: K27 ASTGE Python Nested Scope Contract

on:
  pull_request:
    paths:
      - "crates/aura-k27-astge-scopes/**"
      - "tools/k27_astge_python_scope_oracle.py"
      - ".github/workflows/k27-astge-python-nested-scopes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-scopes:
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Fetch exact head without persisted credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            fetch --no-tags --depth=1 origin "$TARGET_SHA"
          unset AUTH_HEADER GH_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
      - name: Run nested-scope contract and independent CPython oracle
        shell: bash
        run: |
          rustc --version
          cargo --version
          python3 --version
          cargo fmt --manifest-path crates/aura-k27-astge-scopes/Cargo.toml -- --check
          cargo test --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/aura-k27-astge-scopes/Cargo.toml --all-targets -- -D warnings
          python3 tools/k27_astge_python_scope_oracle.py
      - name: Emit claim ceiling
        shell: bash
        run: |
          echo "PYTHON_NESTED_SCOPE_INVENTORY_EXECUTED=true"
          echo "CPYTHON_SYMTABLE_SCOPE_TREE_CONFORMANT=true"
          echo "STATEMENT_NESTING_IS_SCOPE=false"
          echo "DUPLICATE_SCOPE_BINDINGS_RETAINED=true"
          echo "RUNTIME_NAME_RESOLUTION_PROVEN=false"
          echo "GLOBAL_NONLOCAL_RESOLUTION_PROVEN=false"
          echo "FREE_CELL_VARIABLES_PROVEN=false"
          echo "LAMBDA_COMPREHENSION_SCOPE_PROVEN=false"
          echo "IMPORT_GRAPH_PROVEN=false"
          echo "CALL_GRAPH_PROVEN=false"
          echo "SEMANTIC_K27_DERIVED=false"
          echo "AURAOS_RUNTIME_INTEGRATION_PROVEN=false"
          echo "EXTERNAL_EFFECT_AUTHORIZED=false"
