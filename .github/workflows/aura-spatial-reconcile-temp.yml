name: Aura Spatial reconcile and finalize

on:
  push:
    branches:
      - feature/spatial-s4b-gaussian-security
    paths:
      - ".github/workflows/aura-spatial-reconcile-temp.yml"

permissions:
  contents: write

concurrency:
  group: aura-spatial-reconcile-final
  cancel-in-progress: false

jobs:
  reconcile-final:
    if: github.repository == 'dallascourchene-commits/AuraOS'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest ruff jsonschema numpy

      - name: Apply final least-privilege checkout repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/aura-spatial-s5-s6-construction.yml')
          text = path.read_text(encoding='utf-8')
          checkout_ref = '$' + '{{ github.event.pull_request.head.sha || github.sha }}'
          anchor = (
              f'          ref: {checkout_ref}\n'
              '          fetch-depth: 0\n'
          )
          replacement = (
              f'          ref: {checkout_ref}\n'
              '          persist-credentials: false\n'
              '          fetch-depth: 0\n'
          )
          if 'persist-credentials: false' not in text:
              if anchor not in text:
                  raise SystemExit('checkout repair anchor missing')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and verify CODEMAP and topology
        run: |
          set -euo pipefail
          python aura_codebase_navigator.py
          python -m aura_codemap_verify --compare-json .aura/CODEMAP.json
          test -s .aura/CODEMAP.json
          test -s .aura/CODEMAP.md
          test -s topology_map.json

      - name: Compile and lint combined permanent surface
        run: |
          set -euo pipefail
          python -m py_compile \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py
          python -m ruff check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_arena_persistence_adapters.py \
            aura_agent_arena_persistence_bridge.py \
            aura_agent_arena_mcp.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            scripts/aura_spatial_s5_s6_construction_architect_harness.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py
          python -m ruff format --check \
            aura_spatial_arena.py \
            aura_spatial_construction.py \
            aura_spatial_agent_bridge.py \
            aura_spatial_mcp.py \
            aura_spatial_cli.py \
            aura_agent_arena_github_bridge.py \
            aura_agent_arena_github_mcp.py \
            tests/test_aura_spatial*.py \
            tests/test_aura_agent_arena_github_bridge.py

      - name: Validate routes and retained tests
        run: |
          set -euo pipefail
          python aura_spatial_cli.py --repo-root . validate-route
          python -m pytest -q --tb=short tests/test_aura_spatial*.py
          python -m pytest -q --tb=short tests/test_aura_construction*.py
          python -m pytest -q --tb=short \
            tests/test_aura_arena_persistence_adapters.py \
            tests/test_aura_agent_arena_mcp.py \
            tests/test_aura_agent_arena_github_bridge.py
          npm run test:spatial

      - name: Remove runner and publish verified combined artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: feature/spatial-s4b-gaussian-security
        run: |
          set -euo pipefail
          rm .github/workflows/aura-spatial-reconcile-temp.yml
          git config user.name "AuraOS Reconciliation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          test ! -e .github/workflows/aura-spatial-reconcile-temp.yml
          git diff --cached --check
          git commit -m "chore: finalize combined Spatial and GitHub publication artifacts"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:"$TARGET_BRANCH"
          unset AUTH_HEADER
