services:
  aura-arena-connector:
    build:
      context: .
      dockerfile: Dockerfile.arena-connector
    image: ghcr.io/dallascourchene-commits/auraos-arena-connector:latest
    ports:
      - "8091:8091"
    environment:
      AURA_REPO_ROOT: /opt/aura
      AURA_CONNECTOR_HOST: 0.0.0.0
      AURA_CONNECTOR_PORT: "8091"
    volumes:
      - aura_memory:/opt/aura/Aura_Memory
      - aura_staging:/opt/aura/Aura_Staging
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  aura_memory:
  aura_staging:
