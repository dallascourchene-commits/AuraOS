serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
aura-k27-astge = { path = "../aura-k27-astge" }
aura-k27-astge-ingest = { path = "../aura-k27-astge-ingest" }
aura-k27-astge-materialize = { path = "../aura-k27-astge-materialize" }
aura-k27-astge-profiled-scopes = { path = "../aura-k27-astge-profiled-scopes" }
aura-k27-astge-scope = { path = "../aura-k27-astge-scope" }
aura-k27-astge-scopes = { path = "../aura-k27-astge-scopes" }
aura-k27-astge-post-edit-profiled-scope = { path = "../aura-k27-astge-post-edit-profiled-scope" }
