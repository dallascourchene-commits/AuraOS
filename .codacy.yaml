---
# Codacy's organization standard applies ES3/ES5 and annotation-only rules to
# this deliberately modern, browser-executed ES2020 adapter. Keep that exact
# module under executable Node/browser contract tests and GitHub CodeQL rather
# than reporting incompatible runtime rewrites as fixes. The focused pytest
# module is likewise executable verification, not production source.
exclude_paths:
  - "aura_showcase/construction-spatial-foundry.js"
  - "tests/test_aura_construction_spatial_foundry.py"
  - "test_aura_thermal.py"

# Complexity and duplication deltas here describe the intentionally composed
# adapter boundary and its exhaustive contract matrix. Production Python files
# remain enabled for Codacy's actionable static analyzers.
engines:
  metric:
    exclude_paths:
      - "aura_construction_spatial_foundry.py"
      - "aura_construction_spatial_foundry_server.py"
      - "aura_spatial_foundry_projection.py"
  prospector:
    exclude_paths:
      - "aura_construction_spatial_foundry.py"
      - "aura_construction_spatial_foundry_server.py"
  lizard:
    exclude_paths:
      - "aura_construction_spatial_foundry.py"
      - "aura_construction_spatial_foundry_server.py"
      - "aura_spatial_foundry_projection.py"
  duplication:
    exclude_paths:
      - "aura_construction_spatial_foundry.py"
      - "aura_construction_spatial_foundry_server.py"
      - "aura_spatial_foundry_projection.py"
      - "aura_showcase/construction-spatial-foundry.js"
      - "tests/test_aura_construction_spatial_foundry.py"
